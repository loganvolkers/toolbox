[package]
name = "toolbox-connector-git-files"
description = "Toolbox connector: catalog-info.yaml files from a local checkout or the GitHub contents API (docs/v1-spec.md §7.4)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
reqwest.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tokio.workspace = true
toolbox-connect = { path = "../toolbox-connect" }

[lints]
workspace = true

[package.metadata.dist]
dist = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target-triple }{ archive-suffix }"
bin-dir = "{ name }-{ target-triple }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
