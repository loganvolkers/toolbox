[package]
name = "toolbox-connector-workspace"
description = "Toolbox connector: a local Rust workspace (crates and code metrics), its markdown docs and other files, read statically (docs/design/toolbox-for-toolbox.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit", "printing"] }
tokio.workspace = true
toolbox-connect = { path = "../toolbox-connect" }
walkdir = "2"

[lints]
workspace = true
