<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbox report</title>
<style>
:root{--bg:#fbfbfa;--fg:#1d1d1b;--muted:#6b6b66;--line:#e4e3df;--card:#fff;--accent:#2f5d8a;
--none:#b4433a;--bronze:#9a6a2f;--silver:#6f7a86;--gold:#a8861d;--skipped:#9a9a94;--pass:#2f7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe7;--muted:#a3a29c;--line:#2e2e2b;--card:#1e1e1c;
--accent:#86b3e0;--none:#e0786f;--bronze:#d5a463;--silver:#b3bdc8;--gold:#e2c25a;--skipped:#7d7d77;--pass:#6fc493}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}
.meta{color:var(--muted);font-size:13px;margin-bottom:20px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
nav button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.sub{color:var(--muted);font-size:13px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 4px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
input[type=search]{width:100%;margin:12px 0 8px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
details{border-top:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}
summary::-webkit-details-marker{display:none}
.lvl{font-size:12px;font-weight:600;min-width:58px}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.fails{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.rule{margin:8px 0 0 68px}.rule b{font-weight:600}
.rule ul{margin:4px 0 0;padding-left:18px}.rule li{overflow-wrap:anywhere}
.fix{color:var(--muted);font-size:13px}
@media (max-width:600px){.rule{margin-left:0}summary{flex-wrap:wrap}.fails{flex-basis:100%}}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<div class="meta" id="meta"></div>
<nav id="nav" aria-label="Scorecards"></nav>
<div id="cards"></div>
</main>
<script type="application/json" id="data">/*DATA*/null</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); Object.assign(e, a); e.append(...kids); return e; };
const color = l => `var(--${['none','bronze','silver','gold','skipped'].includes(l) ? l : 'accent'})`;
document.title = D.portal + ' — scorecards';
title.textContent = D.portal;
meta.textContent = `Scorecards at snapshot ${D.snapshot} · generated by toolbox report`;
const cards = Object.keys(D.scorecards);
let active = location.hash.slice(1) || cards[0];
function render() {
  nav.replaceChildren(...cards.map(c => el('button', {textContent: c, ariaPressed: String(c === active), onclick: () => { active = c; location.hash = c; render(); }})));
  const sc = D.scorecards[active], rows = Object.entries(D.scores[active] || {});
  const order = ['none', ...sc.levels, 'skipped'];
  const tally = {}; rows.forEach(([, r]) => tally[r.level] = (tally[r.level] || 0) + 1);
  const bar = el('div', {className: 'bar'}, ...order.filter(l => tally[l]).map(l => el('span', {style: `flex:${tally[l]};background:${color(l)}`, title: `${l}: ${tally[l]}`})));
  const legend = el('div', {className: 'legend'}, ...order.filter(l => tally[l]).map(l => el('span', {}, el('span', {className: 'dot', style: `background:${color(l)}`}), `${l} ${tally[l]}`)));
  const list = el('div');
  const search = el('input', {type: 'search', placeholder: 'Filter by entity or failing rule…', ariaLabel: 'Filter'});
  const draw = () => {
    const q = search.value.toLowerCase();
    const shown = rows.filter(([id, r]) => r.level !== 'skipped')
      .sort((a, b) => order.indexOf(a[1].level) - order.indexOf(b[1].level) || a[0].localeCompare(b[0]))
      .filter(([id, r]) => !q || id.toLowerCase().includes(q) || Object.entries(r.rules || {}).some(([n, o]) => o !== 'pass' && n.includes(q)));
    list.replaceChildren(...shown.map(([id, r]) => {
      const failing = Object.entries(r.rules || {}).filter(([, o]) => o !== 'pass');
      const s = el('summary', {}, el('span', {className: 'lvl', textContent: r.level, style: `color:${color(r.level)}`}), el('code', {textContent: id}),
        el('span', {className: 'fails', textContent: failing.map(([n]) => n).join(', ')}));
      const body = failing.map(([n, o]) => {
        const ev = (r.evidence || {})[n], items = ev == null ? [] : Array.isArray(ev) ? ev : [ev];
        const rule = sc.rules[n] || {};
        return el('div', {className: 'rule'}, el('div', {}, el('b', {textContent: n}), ` (${rule.level || ''}, ${o})`),
          rule.fix ? el('div', {className: 'fix', textContent: rule.fix}) : '',
          items.length ? el('ul', {}, ...items.slice(0, 50).map(i => el('li', {}, el('code', {textContent: typeof i === 'string' ? i : JSON.stringify(i)})))) : '');
      });
      return el('details', {}, s, ...body);
    }));
  };
  search.oninput = draw; draw();
  document.getElementById('cards').replaceChildren(el('section', {},
    el('div', {className: 'head'}, el('h2', {textContent: active}), el('span', {className: 'sub', textContent: `${sc.kind} · levels ${sc.levels.join(' < ')} · owner ${sc.owner}`})),
    bar, legend, search, list));
}
render();
</script>
</body>
</html>
