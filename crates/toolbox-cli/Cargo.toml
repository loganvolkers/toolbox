[package]
name = "toolbox-cli"
description = "Toolbox: the `toolbox` binary (docs/v1-spec.md §7.7)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "toolbox"
path = "src/main.rs"

[dependencies]
clap.workspace = true
mimalloc.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
regex = "1"
serde.workspace = true
sha2.workspace = true
toolbox-expr = { path = "../toolbox-expr" }
toolbox-model.workspace = true
toolbox-derive.workspace = true
toolbox-store.workspace = true
toolbox-api.workspace = true
toolbox-authz.workspace = true
toolbox-connect = { path = "../toolbox-connect" }
toolbox-telemetry.workspace = true
tracing.workspace = true
walkdir.workspace = true
async-trait.workspace = true
tokio.workspace = true
reqwest.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[lints]
workspace = true

[package.metadata.dist]
dist = true

# cargo-binstall: same asset names cargo-dist publishes (D90).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target-triple }{ archive-suffix }"
bin-dir = "{ name }-{ target-triple }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
