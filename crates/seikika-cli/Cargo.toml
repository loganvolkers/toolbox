[package]
name = "seikika-cli"
description = "Seikika: the `seikika` binary (docs/v1-spec.md §7.7)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
include = ["/LICENSE", "/README.md", "/src/**", "/tests/**", "/report-dist/**"]

[[bin]]
name = "seikika"
path = "src/main.rs"

[dependencies]
clap.workspace = true
mimalloc.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
regex.workspace = true
serde.workspace = true
sha2.workspace = true
seikika-expr.workspace = true
seikika-model.workspace = true
seikika-derive.workspace = true
seikika-exec.workspace = true
seikika-store.workspace = true
seikika-api.workspace = true
seikika-authz.workspace = true
seikika-connect.workspace = true
seikika-telemetry.workspace = true
tracing.workspace = true
walkdir.workspace = true
async-trait.workspace = true
tokio.workspace = true
reqwest.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[lints]
workspace = true

[package.metadata.dist]
dist = true

# cargo-binstall: same asset names cargo-dist publishes (D90).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target-triple }{ archive-suffix }"
bin-dir = "{ name }-{ target-triple }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
