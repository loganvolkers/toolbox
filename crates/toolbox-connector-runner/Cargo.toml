[package]
name = "toolbox-connector-runner"
description = "Toolbox connector: runs local commands (cargo test, clippy, any NDJSON-printing tool) and reports their results as records (docs/design/toolbox-for-toolbox.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
regex = "1"
serde_json.workspace = true
tokio.workspace = true
toolbox-connect = { path = "../toolbox-connect" }

[lints]
workspace = true

[package.metadata.dist]
dist = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target-triple }{ archive-suffix }"
bin-dir = "{ name }-{ target-triple }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
