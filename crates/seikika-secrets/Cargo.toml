[package]
name = "seikika-secrets"
description = "Seikika: pluggable secret backends for connector ${secret:…} resolution (D55, docs/design/secret-vault.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Env + file always compile. Remote backends use reqwest only — no cloud SDKs in default CI.
default = ["vault", "aws", "gcp", "azure"]
remote = ["dep:reqwest", "dep:tokio"]
vault = ["remote"]
aws = ["remote"]
gcp = ["remote"]
azure = ["remote"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
