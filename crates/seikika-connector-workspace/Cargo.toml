[package]
name = "seikika-connector-workspace"
description = "Seikika connector: a local Rust workspace (crates and code metrics), its markdown docs and other files, read statically (docs/design/seikika-for-seikika.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit", "printing"] }
tokio.workspace = true
seikika-connect.workspace = true
seikika-model.workspace = true
walkdir.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target-triple }{ archive-suffix }"
bin-dir = "{ name }-{ target-triple }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
