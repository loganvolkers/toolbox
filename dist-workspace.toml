[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Signed build provenance for every artifact (verify with `gh attestation verify`, D90)
github-attestations = true
# Keep hand-patched release.yml Token-Permissions (top-level contents: read; job-level
# write on host/announce). Without this, `dist generate` refuses the dirty CI file (cargo-dist#2320).
allow-dirty = ["ci"]
# The server image is built after the release is announced: a `release: published` trigger never
# fires for a release made with GITHUB_TOKEN. release.yml carries the job without `secrets: inherit`.
post-announce-jobs = ["./image"]
github-custom-job-permissions = { "image" = { contents = "read", packages = "write", id-token = "write", attestations = "write" } }

# Actions pinned to commit SHAs (zizmor `unpinned-uses`; maintainer-ci-security). Update with the
# tag's commit when upgrading: git ls-remote --tags https://github.com/actions/<name>
[dist.github-action-commits]
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
