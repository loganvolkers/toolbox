rules:
  # ---------------------------------------------------------------- Go
  - id: go-tls-insecure-skip-verify
    languages: [go]
    severity: ERROR
    message: >-
      TLS certificate verification is disabled (InsecureSkipVerify), which
      allows man-in-the-middle attacks.
    patterns:
    - pattern-either:
      - pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
      - pattern: $C.InsecureSkipVerify = true
      # skipping default verification is fine when the code verifies the peer itself
    - pattern-not: "tls.Config{..., VerifyPeerCertificate: $F, ...}"
    - pattern-not: "tls.Config{..., VerifyConnection: $F, ...}"
  - id: go-tls-weak-min-version
    languages: [go]
    severity: WARNING
    message: TLS MinVersion below TLS 1.2 permits deprecated protocol versions.
    pattern-either:
    - pattern: "tls.Config{..., MinVersion: tls.VersionTLS10, ...}"
    - pattern: "tls.Config{..., MinVersion: tls.VersionTLS11, ...}"
    - pattern: "tls.Config{..., MinVersion: tls.VersionSSL30, ...}"
  - id: go-sql-string-building
    languages: [go]
    severity: ERROR
    message: >-
      SQL query built with string formatting or concatenation; use bind
      parameters to prevent SQL injection.
    patterns:
    - pattern-either:
      - pattern: $DB.$M(..., fmt.Sprintf($Q, ...), ...)
      - pattern: $DB.$M(..., $A + $B, ...)
    - metavariable-regex:
        metavariable: $M
        regex: ^(Query|QueryContext|QueryRow|QueryRowContext|Exec|ExecContext|Prepare|PrepareContext|Raw|NamedExec|NamedQuery)$
    - pattern-not: $DB.$M(..., "..." + "...", ...)
  - id: go-exec-shell
    languages: [go]
    severity: WARNING
    message: >-
      Command run through a shell with a non-constant argument; validate input
      or avoid the shell to prevent command injection.
    patterns:
    - pattern-either:
      - pattern: exec.Command($SH, "-c", $CMD, ...)
      - pattern: exec.CommandContext($CTX, $SH, "-c", $CMD, ...)
    - pattern-not: exec.Command($SH, "-c", "...", ...)
    - pattern-not: exec.CommandContext($CTX, $SH, "-c", "...", ...)
  - id: go-http-server-no-read-header-timeout
    languages: [go]
    severity: WARNING
    message: >-
      http.Server without ReadHeaderTimeout (or ReadTimeout) is exposed to
      Slowloris-style resource exhaustion.
    patterns:
    - pattern: "&http.Server{...}"
    - pattern-not: "&http.Server{..., ReadHeaderTimeout: $T, ...}"
    - pattern-not: "&http.Server{..., ReadTimeout: $T, ...}"
  - id: go-http-listen-no-timeouts
    languages: [go]
    severity: WARNING
    message: >-
      http.ListenAndServe uses a server with no timeouts; construct an
      http.Server with ReadHeaderTimeout.
    pattern-either:
    - pattern: http.ListenAndServe(...)
    - pattern: http.ListenAndServeTLS(...)
  - id: go-weak-hash
    languages: [go]
    severity: INFO
    message: >-
      MD5/SHA-1 are broken for security purposes; make sure this use is not
      for integrity or authentication.
    pattern-either:
    - pattern: md5.New()
    - pattern: md5.Sum(...)
    - pattern: sha1.New()
    - pattern: sha1.Sum(...)
  - id: go-math-rand-for-secrets
    languages: [go]
    severity: WARNING
    message: math/rand output used in a token/key/secret/password; use crypto/rand.
    patterns:
    - pattern-either:
      - pattern: $X := <... rand.$F(...) ...>
      - pattern: $X = <... rand.$F(...) ...>
    - metavariable-regex:
        metavariable: $X
        regex: (?i).*(token|secret|password|passwd|nonce|apikey|api_key|salt).*
    - pattern-inside: |
        import "math/rand"
        ...
  - id: go-unescaped-template-html
    languages: [go]
    severity: WARNING
    message: >-
      Converting a non-constant value to template.HTML/JS/URL bypasses
      html/template escaping (XSS).
    patterns:
    - pattern-either:
      - pattern: template.HTML($X)
      - pattern: template.JS($X)
      - pattern: template.URL($X)
    - pattern-not: template.HTML("...")
    - pattern-not: template.JS("...")
    - pattern-not: template.URL("...")
  - id: go-path-traversal-servefile
    languages: [go]
    severity: WARNING
    message: http.ServeFile with a request-derived path can expose arbitrary files.
    pattern: http.ServeFile($W, $R, <... $R.$F ...>)
  - id: go-pprof-exposed
    languages: [go]
    severity: INFO
    message: >-
      net/http/pprof registers debug handlers on the default mux; make sure it
      is not reachable from untrusted networks.
    pattern: import _ "net/http/pprof"

  # ---------------------------------------------------------------- JavaScript / TypeScript
  - id: js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval/new Function on a non-constant value allows code injection.
    patterns:
    - pattern-either:
      - pattern: eval($X)
      - pattern: new Function(..., $X)
    - pattern-not: eval("...")
    - pattern-not: new Function(..., "...")
  - id: js-child-process-exec
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      child_process exec with a non-constant command runs through a shell
      (command injection); prefer execFile/spawn with an argument array.
    patterns:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern-inside: |
              $CP = require('child_process')
              ...
          - pattern-inside: |
              import * as $CP from 'child_process'
              ...
          - pattern-inside: |
              import $CP from 'child_process'
              ...
        - pattern-either:
          - pattern: $CP.exec($CMD, ...)
          - pattern: $CP.execSync($CMD, ...)
      - patterns:
        - pattern-either:
          - pattern-inside: |
              const {..., $F, ...} = require('child_process')
              ...
          - pattern-inside: |
              import {..., $F, ...} from 'child_process'
              ...
        - metavariable-regex: {metavariable: $F, regex: ^(exec|execSync)$}
        - pattern: $F($CMD, ...)
    - metavariable-pattern:
        metavariable: $CMD
        patterns: [{pattern-not: '"..."'}]
  - id: js-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Assigning non-constant HTML (innerHTML/outerHTML/document.write) can
      lead to XSS.
    patterns:
    - pattern-either:
      - pattern: $E.innerHTML = $X
      - pattern: $E.outerHTML = $X
      - pattern: document.write($X)
    - pattern-not: $E.innerHTML = "..."
    - pattern-not: $E.outerHTML = "..."
    - pattern-not: document.write("...")
  - id: js-tls-reject-unauthorized
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS certificate verification disabled (rejectUnauthorized false /
      NODE_TLS_REJECT_UNAUTHORIZED=0).
    pattern-either:
    - pattern: "{..., rejectUnauthorized: false, ...}"
    - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  # ---------------------------------------------------------------- Rust
  - id: rust-tls-danger-accept-invalid
    languages: [rust]
    severity: ERROR
    message: TLS certificate or hostname verification disabled.
    pattern-either:
    - pattern: $B.danger_accept_invalid_certs(true)
    - pattern: $B.danger_accept_invalid_hostnames(true)
  - id: rust-shell-command
    languages: [rust]
    severity: WARNING
    message: >-
      Command run through a shell with a non-constant argument (command
      injection risk).
    patterns:
    - pattern: Command::new($SH).arg("-c").arg($X)
    - pattern-not: Command::new($SH).arg("-c").arg("...")

  # ---------------------------------------------------------------- Shell
  - id: sh-curl-pipe-shell
    languages: [bash]
    severity: WARNING
    message: >-
      Piping a download straight into a shell runs unverified remote code;
      download, verify a checksum, then run.
    pattern-either:
    - pattern: curl ... | bash
    - pattern: curl ... | sh
    - pattern: wget ... | bash
    - pattern: wget ... | sh
