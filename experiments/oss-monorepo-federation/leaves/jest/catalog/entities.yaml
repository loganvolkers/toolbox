entities:
  - kind: Repository
    id: repository:jestjs/jest
    name: jest
    org: jestjs
    packageManager: yarn@4.18.0
    packageManagerPinned: true
    hasWorkspace: true
    eslintFlat: true
    typescriptPresent: true
    agentsInstruction: true
    usesPrettier: true
    prettierPrintWidth: 80
    prettierSingleQuote: true
    prettierBracketSpacing: false
    depsAutomation: false
    lernaLite: true
    jestCiConfig: true

  - kind: Library
    id: library:jestjs/jest/jest-cli
    name: jest-cli
    ecosystem: js
    repository: repository:jestjs/jest
    path: packages/jest-cli

  - kind: Component
    id: component:jestjs/jest/packages
    name: packages
    repository: repository:jestjs/jest
    path: packages
