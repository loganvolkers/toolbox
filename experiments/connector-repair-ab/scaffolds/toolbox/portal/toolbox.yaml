apiVersion: toolbox.dev/v1alpha1

portal:
  name: forge-connector
  title: Forge connector (scaffold)
  owner: group:platform
  toolbox: "0.1"

connectors:
  - name: forge
    package: local:forge
    runtime: in-image
    # Keep in sync with TOOLBOX_CONNECTOR_CONFIG / connector drive --config when switching tenants.
    config: {baseUrl: http://127.0.0.1:9743, token: tenant-a-token}
    records: [project, issue, component]

kinds:
  - name: Project
    identityFrom: [connector:forge]
    fields: {title: {type: string}}
    sources: {default: [connector:forge]}
    map:
    - from: forge/project
      id: "'project:' + record.key"
      set: "{'title': record.name}"
  - name: Issue
    identityFrom: [connector:forge]
    fields: {title: {type: string}}
    sources: {default: [connector:forge]}
    map:
    - from: forge/issue
      id: "'issue:' + record.key"
      set: "{'title': record.summary}"
  - name: Component
    identityFrom: [connector:forge]
    fields: {title: {type: string}}
    sources: {default: [connector:forge]}
    map:
    - from: forge/component
      id: "record.project + ':' + record.name"
      set: "{'title': record.name}"
