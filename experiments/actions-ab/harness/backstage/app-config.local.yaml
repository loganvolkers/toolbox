# The Backstage arm's overlay on the create-app app-config.yaml (README §4.3): this run's port, and
# one static token per person (backend.auth.externalAccess). Backstage authenticates each as an
# external service principal whose subject is the person's name. backstage-cli loads this file
# after app-config.yaml.
app: {baseUrl: http://localhost:3000}
backend:
  baseUrl: http://localhost:{PORT}
  listen:
    port: {PORT}
  auth:
    externalAccess:
      - {type: static, options: {token: ann-token-0123456789, subject: ann}}
      - {type: static, options: {token: bob-token-0123456789, subject: bob}}
      - {type: static, options: {token: carol-token-0123456789, subject: carol}}
      - {type: static, options: {token: dave-token-0123456789, subject: dave}}
      - {type: static, options: {token: erin-token-0123456789, subject: erin}}
