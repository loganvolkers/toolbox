[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Exact pins (crate versions current on 2026-11-19 per index.crates.io); Cargo.lock is committed.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
axum = "=0.8.9"
sqlx = { version = "=0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
rmcp = { version = "=3.11.0", features = ["server", "transport-streamable-http-server"] }
cel = { git = "https://github.com/cel-rust/cel-rust.git", rev = "004a4b88b99d65a5daece2c82636e278eb671e2d" }
dbsp = "=0.384.0"
wasmtime = "=50.0.3"
tantivy = "=0.27.0"
async-graphql = { version = "=7.2.1", features = ["dynamic-schema"] }

# The profile proposed in docs/design/developer-velocity.md §3.2
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.package.dbsp]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
