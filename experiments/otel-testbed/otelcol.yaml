# Local / CI collector: OTLP only → file exporters. The test scrapes Prometheus separately.
# __OTEL_OUT__ is filled by scripts/score.sh.
# Pin: otel/opentelemetry-collector-contrib:0.142.0 (see pin.env / README).

receivers:
  otlp:
    protocols:
      grpc: {endpoint: 127.0.0.1:4317}
      http: {endpoint: 127.0.0.1:4318, auth: {authenticator: bearertokenauth}}

extensions: {bearertokenauth: {token: seikika-testbed}}

processors: {batch: {timeout: 200ms, send_batch_size: 32}}

exporters:
  file/traces: {path: __OTEL_OUT__/traces.json, format: json}
  file/metrics: {path: __OTEL_OUT__/metrics.json, format: json}
  file/logs: {path: __OTEL_OUT__/logs.json, format: json}
  debug: {verbosity: basic}

service:
  extensions: [bearertokenauth]
  telemetry: {logs: {level: warn}}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs, debug]
