[package]
name = "forge-connector"
version = "0.1.0"
edition = "2021"
description = "Forge SaaS connector scaffold for the connector A/B"

[[bin]]
name = "forge-connector"
path = "src/main.rs"

[dependencies]
seikika-connect = { path = "/agent/repos/seikika/crates/seikika-connect" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
