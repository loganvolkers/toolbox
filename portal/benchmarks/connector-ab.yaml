  - id: connector-ab
    title: 'Cloud/SaaS connector authoring: Toolbox vs Ocean vs Backstage'
    question: >-
      When an agent authors a cloud/SaaS connector that syncs projects and
      issues from an HTTP API, does Toolbox cost less than Port Ocean or a
      Backstage entity provider across the package-author lifecycle?
    layers: [package-author]
    stages:
    - package-author/author
    - package-author/build-connector
    - package-author/test
    - package-author/adopt
    hypotheses: [C1, C2, C3]
    rival: >-
      Port Ocean (@ocean.on_resync) and a Backstage EntityProvider — the
      strongest alternatives for SaaS catalog connectors
    repos:
    - port-labs/ocean@f9f3948e83a20769f32fd3ca9fe0581cc8755926
    - backstage/backstage@feeadd4d4efcbda9f1573b95e356e0f3fc0b5d17
    status: complete
    ran: 2026-11-23
    outcome: >-
      v3 (catalog-drive + composite ids, same bar): C1–C3 hold. C1 39/57/40;
      C2 9/12/16. Large-lead target (≥10 under both rivals on C1 and C2)
      missed (C1 vs C only −1). v2: RESULTS-v2.md; v1: RESULTS.md
    changed:
    - >-
      Scaffold ships rust-toolchain.toml so toolbox-connect edition2024 builds
      (phase-1 friction)
    - >-
      FORGE.md notes components as a bare array (not paginated like
      project/search)
