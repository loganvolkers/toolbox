# DX Benchmark catalog entry (docs/design/dx-benchmarks.md §6), scored by maintainer-benchmark.
records:
  - id: actions-ab
    title: >-
      Federated self-service actions: Toolbox vs GitHub Actions vs Backstage
      vs a vanilla app
    question: >-
      Can a fresh coding agent give three repositories and their org one
      governed self-service action (validated inputs, preview, approval by
      someone other than the requester, verified effect, a record, one place
      to find it) with less code to maintain and fewer tool calls on Toolbox
      than on GitHub Actions, Backstage's scaffolder or an app of its own?
    layers: [operator, user]
    stages: [operator/author, operator/deploy, user/build]
    hypotheses: [H1, H2, H3]
    rival: >-
      three rivals: GitHub Actions run locally with act (GitHub-only features
      credited when configured as code), Backstage 1.57's scaffolder with
      static tokens, and a vanilla app in any language
    repos:
    - loganvolkers/dependabot-proxy@5f186c53
    - loganvolkers/valtio@c97e2aa9
    - loganvolkers/graphify@48888a7c
    status: complete
    ran: 2026-11-24
    outcome: >-
      Passes in round 8, on the held-out add-notice task. All twelve runs
      fully pass (C1 and P1 to P11), so H1 holds. H2 holds against every
      rival: Toolbox 241 lines to maintain against GitHub Actions 1330 (W
      283), Backstage 1882 (W 794) and vanilla 952 (W 624). H3 holds against
      Backstage (36 calls vs 81, W 19) and is inconclusive against GitHub
      Actions (36 vs 52) and vanilla (36 vs 20), so nothing is lost. Labelled
      per the round 8 fit audit: Toolbox's calls come with a shipped task
      skill tuned on rounds 4 to 7 and extended for R9, and its P9 passes come
      from a change built for this task before the freeze; lines carry little
      discount. Round 7 met the bar on its tally but was not a pass (fitted
      recipe, untriaged rivals).
    changed:
    - D01M86BY3YQX3SA1W99QXF1QA1H
    - D01M86J769VGE6K5FJJQ76EP4AA
    - D01M86WAVQQXYF9DFHCP3G035MA
    - D01M8727W7FEED6VVRY6MB3JFR3
    - D01M87579Y5AZWR1Z29S802VP2K
    - >-
      rounds 2 and 3: run records list approvers as plain identities; a
      change's commit message takes placeholders; a repeated change its base
      already has succeeds without a commit; /readyz waits for the first read
      of federation children
    - >-
      rounds 4 to 6: toolbox test runs action cases in a scratch copy with a
      rejected push; test defaults; a hint for a value cut at a comma; a
      child's federation from an included file; standard action files
    - >-
      round 7: a parent's checkout approves and rejects runs with its kept
      key; refused approvals are recorded; a blocked run exits 2
    - >-
      round 8 (pre-freeze, labelled): group approvers in a parent's checkout
      from the portal's own model (fb5dc3f)
    servedValue: ''
    blockedOn: ''
    readme: experiments/actions-ab/README.md
    results: experiments/actions-ab/results/r8/README.md
    protocol: 2
    prompts: experiments/actions-ab/prompts
    runsPerArm: 3
    measure: >-
      lines of code and config to maintain (harness/score.py lines), tool
      calls by kind and characters of tool results from each run's transcript
      (harness/count.py), and the adjudicator's probes (P1 to P10 to round 7;
      C1 and P1 to P11 in round 8, on the held-out add-notice task)
    frozenAt: >-
      round 8: 8519cd5, with the twelve run prompts rendered and committed in
      681cf8e before the first launch (013c58f)
    designer: >-
      the agent that built Toolbox's actions and federation and wrote the
      README
    adjudicator: a fresh agent that designed no part of it and changed nothing
    fitAudit: >-
      rounds 1 to 7 (results/FIT-AUDIT.md): 15 commits fit with corrections,
      and the Toolbox arm had a task-fitted recipe and untriaged rivals, so
      round 7 is not a pass. Round 8 (results/FIT-AUDIT-r8.md): P4 and P5 hold
      with corrections; 14 of 15 earlier corrections made; the effect and
      inputs were held out but R9 was not, so Toolbox's P9 passes and its
      calls are labelled; the example's group was renamed (38e9549)
    spread: >-
      round 8, lines (min, median, max): Toolbox 186, 241, 242; GitHub Actions
      1056, 1330, 1339; Backstage 1855, 1882, 2649; vanilla 536, 952, 1160.
      Calls: Toolbox 23, 36, 42; GitHub Actions 47, 52, 57; Backstage 75, 81,
      85; vanilla 16, 20, 30. Every run's measures are in results/r8/
