# DX Benchmark catalog entry (docs/design/dx-benchmarks.md §6), scored by maintainer-benchmark.
records:
  - id: deploy-ab
    title: 'Deploy a usable portal: Toolbox or Backstage, on a laptop'
    question: >-
      Can a fresh agent deploy a usable portal onto a laptop, with Toolbox and
      with Backstage, when the only services are a local GitHub and Postgres?
    layers: [operator, user]
    stages: [operator/deploy, operator/verify, user/discover]
    hypotheses: [deploy-usable]
    rival: >-
      Backstage from create-app, run as one container plus Postgres against
      the same local GitHub
    repos:
    - backstage/backstage@feeadd4d4efcbda9f1573b95e356e0f3fc0b5d17
    - openfga/openfga@d67ba7b1d2eaf945cffab3a9129ca1a4c7ad5251
    status: complete
    ran: 2026-11-23
    outcome: >-
      deploy-usable does not hold, and the rerun admits defeat. Toolbox passed
      S1–S3 and T1–T4 on both runs. Backstage passed S1 and S3 and failed S2
      on both runs. The agent runtime returned no token counts on either run
    changed:
    - >-
      OpenFGA's tuple view follows the connection search_path, so a role named
      toolbox is not an empty authorization table
    - >-
      The Acme portal image pushes the directory after the SCIM connector is
      listening. The rerun still failed S2 for Backstage and still had no
      tokens
    servedValue: ''
    blockedOn: ''
    readme: experiments/deploy-ab/README.md
    results: experiments/deploy-ab/RESULTS-v2.md
