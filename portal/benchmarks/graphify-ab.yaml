# DX Benchmark catalog entry (docs/design/dx-benchmarks.md §6), scored by maintainer-benchmark.
records:
  - id: graphify-ab
    title: Graphify knowledge graph vs the agent's own search
    question: >-
      Does a Graphify knowledge graph, installed with its mandatory Cursor
      rule and document layer, help a coding agent answer questions about a
      repository more completely, or for less reading and fewer calls?
    layers: [maintainer, user]
    stages: [maintainer/plan, user/discover]
    hypotheses: [K1, K2, K3, K4, K5, K6, K7]
    rival: >-
      the agent's own search and read tools (rg, grep, read_file), the
      baseline every independent Graphify study found strongest
    repos: [loganvolkers/openfga@7d89a566, loganvolkers/toolbox@a8f7e03]
    status: archived
    ran: 2026-11-23
    outcome: >-
      Neither helps nor hurts shown on either repository: K1 to K6
      inconclusive, K7 held (every Graphify run queried the graph). Coverage
      saturated: 0.955 on OpenFGA and 1.000 on Toolbox in every run of both
      arms. Graphify's arm made a median of 18 fewer calls on both
      repositories (62 vs 44, W 39; 73 vs 55, W 27) and read less on Toolbox
      and more on OpenFGA, each inside W. Building the document layer took 17
      agents and 4.27M characters read for Toolbox. Toolbox for Toolbox
      doesn't adopt Graphify (ADJUDICATION.md)
    changed:
    - D01M84ZW6K2V9CV2SD644DE5M0S
    - >-
      dx-benchmarks.md L21: freeze a quality measure only after the baseline
      arm shows it has headroom
    servedValue: >-
      It answered the adoption question under the vendor's own integration,
      which no independent study had tested. No second round is planned unless
      a code-graph tool keeps its document layer current without a full LLM
      pass, or a question set with headroom is written
      (D01M84ZW6K2V9CV2SD644DE5M0S)
    blockedOn: ''
    readme: experiments/graphify-ab/README.md
    results: experiments/graphify-ab/ADJUDICATION.md
    protocol: 2
    prompts: experiments/graphify-ab/prompts
    runsPerArm: 5
    measure: >-
      key-fact coverage graded blind against gold hashed before the run; tool
      calls and characters of tool results from each run's runtime transcript
      (harness/count.py), a read_file without a recorded result counting as
      the file
    frozenAt: >-
      round 1 cf2e64c (harness a87524e, Graphify 0.9.118, graphs built from
      the frozen repositories)
    designer: the agent that wrote the README and ran the round
    adjudicator: >-
      two fresh agents, one per repository, that designed no part of it and
      graded blind; one applied the rules, 2026-11-23 (ADJUDICATION.md)
    fitAudit: >-
      One round, no product change. Between registration and the run, the dry
      run's two harness fixes (a87524e) applied to both arms: graphify on
      every shell's PATH, and count.py counting only real graphify
      subcommands. No prompt, question or gold changed
    spread: >-
      five runs per arm per repository; every run's measures are in
      results/r1.tsv, and minimum, median and range per arm in README §0 and
      ADJUDICATION.md
