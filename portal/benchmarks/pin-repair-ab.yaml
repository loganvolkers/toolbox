# DX Benchmark catalog entry (docs/design/dx-benchmarks.md §6), scored by maintainer-benchmark.
records:
  - id: pin-repair-ab
    title: 'Pin repair: Toolbox ratchet vs reviewdog (R4)'
    question: >-
      When a coding agent's pull request adds actions written as tags that the
      repository already pins by SHA elsewhere, does Toolbox's ratchet get it
      to a correct pass for less effort than reviewdog over the same tools?
    layers: [operator]
    stages: [operator/monitor]
    hypotheses: [N1, N2, N3, N4, N5, N6, N7, N8]
    rival: >-
      reviewdog 0.21.0 with -filter-mode=added over the same zizmor and
      actionlint, failing only on findings the branch added, with
      gate-repair-ab's rival fixes (pass line, source quoting)
    repos: [loganvolkers/openfga@7d89a566]
    status: complete
    ran: 2026-11-23
    outcome: >-
      Round 1: no win. N1 held (Toolbox correct 5 of 5), and N2 to N4 were
      inconclusive (calls 3 vs 4, read 6,054 vs 11,605, gate read 5,794 vs
      7,850). The runtime dropped three of reviewdog's command results, which
      the registered measure counted as nothing. Round 2, registered with a
      measure that rebuilds dropped command results by replay, for every arm:
      Toolbox beats reviewdog on read. N5 held, and N7 held: median read 5,794
      vs 18,300 characters, with W 11,433. N6 (calls 2 vs 5) and N8 (gate read
      5,794 vs 8,299) were inconclusive. The replay decides N7; without it N7
      would have been inconclusive. One repository, one planted pull request,
      chosen where Toolbox's pin hints should help (ADJUDICATION.md)
    changed:
    - D01M84X4JDHXS98K89KN4AB0RCD
    - >-
      8a76f24: github-actions writes each pin hint on the unpinned ref's own
      path, at the version its tag names (pinHints), instead of the first pin
      of the same repository
    - >-
      6303a4d (measure, every arm): a terminal command whose result the
      transcript lacks counts as its result rebuilt by replaying the run, kept
      only if the replay reproduces the run's recorded results
    servedValue: ''
    blockedOn: ''
    readme: experiments/pin-repair-ab/README.md
    results: experiments/pin-repair-ab/ADJUDICATION.md
    protocol: 2
    prompts: experiments/pin-repair-ab/prompts
    runsPerArm: 5
    measure: >-
      tool calls, characters of tool results, and characters of gate runs'
      results, from each run's runtime transcript (harness/count.py, as in
      gate-repair-ab round 5); from round 2, a dropped terminal result counts
      as its replayed result (harness/replay.py)
    frozenAt: round 1 25079a6 (Rust 8a76f24), round 2 6303a4d (Rust 8a76f24)
    designer: the agent that wrote the README and runs the rounds
    adjudicator: >-
      a fresh agent that designed no part of it and changed nothing,
      2026-11-23 (ADJUDICATION.md)
    fitAudit: >-
      8a76f24 touches no harness file and was made before any run; its use
      outside the harness is sub-actions such as actions/cache/restore and
      github/codeql-action/analyze, whose hints named the wrong action. The
      replay change is harness-only and applies to both arms; round 1's
      missing results were all in arm B, so it was known to help arm A when it
      was registered (ADJUDICATION.md)
    spread: >-
      five runs per arm in both rounds; every run's measures are in
      results/r1.tsv and r2.tsv, and minimum, median and range per arm are in
      README §0 and ADJUDICATION.md
