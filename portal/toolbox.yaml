# Toolbox for Toolbox: the portal Toolbox maintainers run on their own repository
# (docs/design/toolbox-for-toolbox.md). It catalogues our crates, docs, scripts and tests, the CLI
# commands and MCP tools we promise, and scores each against the standard of one SDLC layer
# (docs/sdlc.md). It runs locally (`scripts/self-portal.sh`): no Postgres, no OpenFGA, no network.
apiVersion: toolbox.dev/v1alpha1

portal:
  name: toolbox
  title: Toolbox for Toolbox
  owner: group:maintainers
  toolbox: "0.1"

policies:
  # Logs and reviews whose past entries are never rewritten (AGENTS.md), so wording rules
  # introduced later don't apply to them.
  historicalDocs:
    - docs/decisions.md
    - docs/research-log.md
    - docs/red-team.md
    - docs/principal-review.md
    - docs/adversarial-critique.md
    - docs/technology-critique.md
    - docs/research.md
    - docs/ocean.md
  # Scorecards whose lowest level is the repository level (D86). Unknown constituents drop out.
  # Runner-backed cards are omitted: a skipped clippy run would make the repo `none` on absent data.
  repoRollup:
    - maintainer-docs
    - maintainer-ci-security
    - maintainer-action-deps
    - maintainer-skill
    - maintainer-connector
    - maintainer-dependency
    - maintainer-agent-doc
    - maintainer-package
    - maintainer-schema
    - maintainer-example
    - maintainer-plugin
    - maintainer-supply-chain

connectors:
  - name: workspace
    package: builtin:workspace             # reads files; fast, so it resyncs often
    runtime: in-image
    config:
      root: "."
      docs: ["*.md", "docs/**/*.md", "examples/*/README.md", "experiments/*/README.md", "plugins/**/*.md", "portal/*.md", "actions/*/README.md"]
      files: ["scripts/*", "crates/*/tests/*.rs", "examples/reference-portal/tools/*.py", ".github/workflows/*.yml"]
      captures:
        # `toolbox get …`, `"$T/toolbox" serve …`, the acceptance scripts' `ask owner …`, and
        # subcommands (`toolbox assess check`)
        commands: '(?:\btoolbox"?|\bask)\s+((?:connector|token)\s+[a-z]+|assess[ \t]+(?:brief|check|submit)|describe[ \t]+(?:portal|scorecards)|[a-z][a-z-]*)'
        # MCP tools/call bodies: {"name": "owner_of", …}
        tools: '"name"\s*:\s*"([a-z][a-z_]*)"'
      counts:
        sdlc: '\bSDLC\b'
        # A named layer (`maintainer SDLC`, `*operator* SDLC`), the layer model itself, or a quoted mention
        layeredSdlc: '(?i:maintainer|operator|user|agent|three|four|author|portal)[*_ ’''-]*s?[*_]*\s+SDLC\b|\bSDLC\s+(?:layers?\b|stages?\b|has\b|in Toolbox)|"SDLC"'
      # GitHub Actions workflows and action metadata (docs/design/github-actions-standards.md)
      workflows: [".github/workflows/*.y*ml", "actions/*/action.y*ml"]
      # Agent skills (docs/design/skill-standards.md). The directory is the skill; SKILL.md is its manifest.
      skills: ["plugins/**/SKILL.md", "skills/**/SKILL.md"]
      # First-party connectors (docs/design/connector-standards.md). One record per crate manifest.
      connectors: ["crates/toolbox-connector-*/Cargo.toml"]
      # Direct Cargo dependencies (docs/design/dependency-standards.md).
      dependencies: true
      # Agent instruction files (docs/design/agents-md-standards.md). AGENTS.md is canonical.
      # The other names are harness aliases and must point at it.
      agentDocs: ["**/AGENTS.md", "**/CLAUDE.md", "**/GEMINI.md", "**/.cursorrules", "**/.github/copilot-instructions.md", "**/.github/instructions/*.instructions.md", "**/.cursor/rules/**/*.md", "**/.cursor/rules/**/*.mdc", "**/.claude/rules/**/*.md"]
      # Agent plugin packages (docs/design/plugin-standards.md).
      plugins: ["plugins/*/plugin.json"]
      # The checkout itself: supply-chain config and the repository rollup (D85, D86).
      repo: true
      # npm manifests (docs/design/package-standards.md). One record per package.json.
      packages: ["**/package.json"]
      # JSON Schema documents (docs/design/schema-standards.md). The contracts compiled into the binary.
      schemas: ["schema/*.json"]
      # Example and experiment write-ups (docs/design/example-standards.md).
      examples: ["examples/**/README.md", "experiments/**/README.md", "docs/examples/*.md"]
      # Coding agents' judgements of our standards and crates (`toolbox assess`, D79)
      assessments: ["portal/assessments/**/*.y*ml"]
      # The SDLC layers and their stages, declared as data (D87)
      data:
        - {kind: sdlc-layer, globs: ["portal/sdlc/layers.yaml"], paths: [doc]}
        - {kind: sdlc-stage, globs: ["portal/sdlc/stages/*.yaml"], paths: [docs, checks]}
    records: [crate, doc, file, repo, workflow, action-ref, skill, connector, dependency, agent-doc, plugin, package-json, json-schema, example, assessment, sdlc-layer, sdlc-stage]
    refresh: {crate: [external_ids], doc: [external_ids], file: [external_ids], repo: [external_ids], workflow: [external_ids], action-ref: [external_ids], skill: [external_ids], connector: [external_ids], dependency: [external_ids], agent-doc: [external_ids], plugin: [external_ids], package-json: [external_ids], json-schema: [external_ids], example: [external_ids], sdlc-layer: [external_ids], sdlc-stage: [external_ids]}
    freshness: {crate: 5m, doc: 5m, file: 5m, repo: 5m, workflow: 5m, action-ref: 5m, skill: 5m, connector: 5m, dependency: 5m, agent-doc: 5m, plugin: 5m, package-json: 5m, json-schema: 5m, example: 5m, assessment: 5m, sdlc-layer: 5m, sdlc-stage: 5m}
  - name: runner
    package: builtin:runner                # executes things; slow, so it's refreshed per entity
    runtime: in-image
    config:
      root: "."
      jobs:
        - {name: test, per: crate, command: [cargo, test, -q, -p, "{crate}"], parse: cargo-test}
        - {name: clippy, per: crate, command: [cargo, clippy, -q, -p, "{crate}", --all-targets, --message-format=json], parse: clippy}
        # MCP calls the contract tests actually make (TOOLBOX_MCP_TRACE), not just name (F9)
        - name: mcp-calls
          command: [sh, -c, 'TOOLBOX_MCP_TRACE="$PWD/target/mcp-trace.ndjson" cargo test -q -p toolbox-api --test mcp']
          parse: tally
          file: target/mcp-trace.ndjson
          key: tool
    records: [test, clippy, mcp-calls]
    refresh: {test: [external_ids], clippy: [external_ids], mcp-calls: [external_ids]}
    freshness: {test: 1h, clippy: 1h, mcp-calls: 1h}
  - name: surfaces
    package: builtin:runner                # the same runner, one fast job: Toolbox's own CLI and MCP surfaces
    runtime: in-image
    config:
      name: surfaces
      root: "."
      jobs:
        - {name: describe, command: [target/debug/toolbox, describe], parse: ndjson, kinds: [command, mcp-tool]}
        # Every part of a portal as entities (docs/design/scorecards-for-scorecards.md): this
        # portal, the starter pilots copy, and the reference portal. Live outcomes come from the
        # committed results and are information only, so meta scorecards never depend on their own output.
        - name: portals
          command: [target/debug/toolbox, describe, portal, portal, examples/repo-portal-starter, examples/reference-portal, --results, portal=portal/results.json]
          parse: ndjson
          kinds: [scorecard, rule, kind, field, connector, rubric]
    records: [command, mcp-tool, scorecard, rule, kind, field, connector, rubric]
    refresh: {command: [external_ids], mcp-tool: [external_ids], scorecard: [external_ids], rule: [external_ids], kind: [external_ids], field: [external_ids], connector: [external_ids], rubric: [external_ids]}
    freshness: {command: 5m, mcp-tool: 5m, scorecard: 5m, rule: 5m, kind: 5m, field: 5m, connector: 5m, rubric: 5m}
  - name: ci-lint
    package: builtin:runner                # zizmor and actionlint: fast, offline, deterministic at pinned versions
    runtime: in-image
    config:
      name: ci-lint
      root: "."
      jobs:
        - name: zizmor                     # security audits (regular persona), offline
          command: [zizmor, --offline, --no-exit-codes, --format, json, .github/workflows, actions]
          parse: zizmor
          files: [".github/workflows/*.y*ml", "actions/*/action.y*ml"]
          optional: true                   # not installed → its rules are unknown, not failing
        - name: actionlint                 # workflow syntax, expressions, types; shellcheck off so local = CI
          command: [actionlint, -shellcheck=, -pyflakes=, -format, "{{json .}}"]
          parse: actionlint
          files: [".github/workflows/*.y*ml"]
          optional: true
    records: [zizmor, actionlint]
    refresh: {zizmor: [external_ids], actionlint: [external_ids]}
    freshness: {zizmor: 5m, actionlint: 5m}
  - name: github-actions
    package: builtin:github                # run history: changes with time, so not in the ratchet (--skip it)
    runtime: in-image
    config:
      org: loganvolkers
      token: ${env:GITHUB_TOKEN}
      actions: {repos: [toolbox], branch: main, runs: 50}
    records: [workflow-runs]
    refresh: {workflow-runs: [external_ids]}
    freshness: {workflow-runs: 15m}

kinds:
  # ── Layer 1: what maintainers build ──────────────────────────────────────────────────────
  - name: Crate
    description: "A Rust crate in the Cargo workspace: its docs, size, functions, tests and lint results."
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      description: {type: string}
      targets: {type: list, items: string}
      externalDeps: {type: integer}
      readme: {type: boolean}
      lastChange: {type: string}
      crateDoc: {type: boolean}
      codeLines: {type: integer}
      testCodeLines: {type: integer}
      pubItems: {type: integer}
      pubDocumented: {type: integer}
      undocumented: {type: list, items: string}
      functions: {type: list, items: object}
      maxFnLines: {type: integer}
      maxComplexity: {type: integer}
      unitTests: {type: integer}
      integrationTests: {type: integer}
      unwraps: {type: integer}
      tests: {type: object}                # from the runner: status, passed, failed, output
      clippy: {type: object}               # from the runner: status, warnings, messages
      hash: {type: string, description: "SHA-256 (12 hex) of the crate's src/ files: an assessment is stale when it changes."}
      reviewState: {type: string, description: "crate-design assessment: fresh, stale or missing.", computed: "inbound.assessesCrate.size() == 0 ? 'missing' : (inbound.assessesCrate[0].subjectHash == entity.hash ? 'fresh' : 'stale')"}
      reviewFailing: {type: list, items: string, description: "Criteria the crate-design assessment failed.", computed: "inbound.assessesCrate.size() == 0 ? [] : inbound.assessesCrate[0].failing"}
      reviewUnsure: {type: list, items: string, description: "Criteria the assessor was unsure of.", computed: "inbound.assessesCrate.size() == 0 ? [] : inbound.assessesCrate[0].unsure"}
      docCoverage:
        type: integer
        computed: "entity.pubItems == 0 ? 100 : entity.pubDocumented * 100 / entity.pubItems"
      longFunctions:
        type: list
        items: string
        computed: "entity.functions.filter(f, f.lines > 80).map(f, f.name + ' at ' + f.at + ': ' + string(f.lines) + ' lines')"
      complexFunctions:
        type: list
        items: string
        computed: "entity.functions.filter(f, f.complexity > 15).map(f, f.name + ' at ' + f.at + ': complexity ' + string(f.complexity))"
      dependents:
        type: list
        items: string
        computed: "inbound.dependsOn.map(c, c.path)"
    relations:
      dependsOn: {to: Crate, many: true}
    sources:
      default: [connector:workspace]
      fields:
        tests: [connector:runner]
        clippy: [connector:runner]
    map:
      - from: workspace/crate
        id: "'crate:' + record.name"
        set: >-
          {'path': record.path, 'description': record.description, 'targets': record.targets,
           'externalDeps': record.externalDeps, 'readme': record.readme, 'lastChange': record.lastChange,
           'crateDoc': record.crateDoc, 'codeLines': record.codeLines, 'testCodeLines': record.testCodeLines,
           'pubItems': record.pubItems, 'pubDocumented': record.pubDocumented,
           'undocumented': record.undocumented, 'functions': record.functions,
           'maxFnLines': record.maxFnLines, 'maxComplexity': record.maxComplexity,
           'unitTests': record.unitTests, 'integrationTests': record.integrationTests,
           'unwraps': record.unwraps, 'hash': has(record.hash) ? record.hash : null}
        relations:
          dependsOn: "record.dependsOn.map(d, 'crate:' + d)"
      - from: runner/test
        id: "'crate:' + record.crate"
        set: "{'tests': record}"
      - from: runner/clippy
        id: "'crate:' + record.crate"
        set: "{'clippy': record}"

  - name: Doc
    description: "A markdown document: its links, status banner, sources and the SDLC layer it names."
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      title: {type: string}
      words: {type: integer}
      hasStatus: {type: boolean}
      hasSources: {type: boolean}
      brokenLinks: {type: list, items: string}
      counts: {type: object}
      lastChange: {type: string}
      missingDecisions: {type: list, items: string, description: "Decision ids cited in the doc that are not rows of docs/decisions.md."}
      area:
        type: string
        computed: >-
          entity.path.startsWith('docs/design/') ? 'design'
          : entity.path.startsWith('docs/') ? 'docs'
          : entity.path.startsWith('examples/') || entity.path.startsWith('experiments/') ? 'example'
          : 'repo'
    relations:
      mentionsCommand: {to: Command, many: true, unresolved: ignore}   # candidates from captures/code spans
      mentionsTool: {to: McpTool, many: true, unresolved: ignore}   # candidates from captures/code spans
      mentionsCrate: {to: Crate, many: true, unresolved: ignore}   # candidates from captures/code spans
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/doc
        id: "'doc:' + record.path"
        set: >-
          {'path': record.path, 'title': record.title, 'words': record.words,
           'hasStatus': record.hasStatus, 'hasSources': record.hasSources,
           'brokenLinks': record.brokenLinks, 'counts': record.counts, 'lastChange': record.lastChange,
           'missingDecisions': record.missingDecisions}
        relations:
          mentionsCommand: "record.captures.commands.map(c, 'command:' + c)"
          mentionsTool: "record.codeSpans.map(s, 'mcp-tool:' + s)"
          mentionsCrate: "record.codeSpans.map(s, 'crate:' + s)"

  - name: File
    description: "A script or integration test, with the commands and MCP tools it exercises."
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      extension: {type: string}
      lines: {type: integer}
      lastChange: {type: string}
    relations:
      exercisesCommand: {to: Command, many: true, unresolved: ignore}   # candidates from captures/code spans
      exercisesTool: {to: McpTool, many: true, unresolved: ignore}   # candidates from captures/code spans
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/file
        id: "'file:' + record.path"
        set: "{'path': record.path, 'extension': record.extension, 'lines': record.lines, 'lastChange': record.lastChange}"
        relations:
          exercisesCommand: "record.captures.commands.map(c, 'command:' + c)"
          exercisesTool: "record.captures.tools.map(t, 'mcp-tool:' + t)"

  # Agent skills we ship (docs/design/skill-standards.md). The connector reports facts; the
  # scorecard below holds the thresholds.
  - name: Skill
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      dir: {type: string}
      name: {type: string}
      plugin: {type: string}
      description: {type: string}
      descriptionChars: {type: integer}
      triggerCues: {type: list, items: string}       # when / whenever / before / after in the description
      pronouns: {type: list, items: string}          # you / I / we … in the description
      frontmatterErrors: {type: list, items: string}
      bodyLines: {type: integer}
      estimatedTokens: {type: integer}               # body characters / 4, not a tokenizer count
      numberedSteps: {type: integer}
      codeFences: {type: integer}
      missingFiles: {type: list, items: string}
      windowsPaths: {type: list, items: string}
      boundaryCues: {type: list, items: string}
      evalCases: {type: integer}                     # cases in evals/evals.json
      hiddenChars: {type: integer}
      secretHits: {type: list, items: string}
      linkDepth: {type: integer}
      supportFiles: {type: integer}
      lastChange: {type: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/skill
        id: "'skill:' + record.dir"
        set: >-
          {'path': record.path, 'dir': record.dir, 'name': record.name, 'plugin': record.plugin,
           'description': record.description, 'descriptionChars': record.descriptionChars,
           'triggerCues': record.triggerCues, 'pronouns': record.pronouns,
           'frontmatterErrors': record.frontmatterErrors, 'bodyLines': record.bodyLines,
           'estimatedTokens': record.estimatedTokens, 'numberedSteps': record.numberedSteps,
           'codeFences': record.codeFences, 'missingFiles': record.missingFiles,
           'windowsPaths': record.windowsPaths, 'boundaryCues': record.boundaryCues,
           'evalCases': record.evalCases, 'hiddenChars': record.hiddenChars,
           'secretHits': record.secretHits, 'linkDepth': record.linkDepth,
           'supportFiles': record.supportFiles, 'lastChange': record.lastChange}

  # First-party connectors (docs/design/connector-standards.md). Facts from the crate; thresholds below.
  - name: Connector
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      dir: {type: string}
      name: {type: string}
      description: {type: string}
      descriptionChars: {type: integer}
      crateDoc: {type: boolean}
      configDocumented: {type: boolean}
      transport: {type: string}                 # stdio, remote, both, or none
      pushOnly: {type: boolean}
      documentedKinds: {type: list, items: string}
      genericKinds: {type: boolean}             # kinds come from config, as the runner's jobs do
      snapshotComplete: {type: boolean}
      reportsNotFound: {type: boolean}
      tests: {type: integer}
      conformanceMentions: {type: integer}      # lines that run `connector test` on this binary
      ciMentions: {type: integer}               # CI scripts or workflows that name the binary
      secretHits: {type: list, items: string}
      lastChange: {type: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/connector
        id: "'connector:' + record.dir"
        set: >-
          {'path': record.path, 'dir': record.dir, 'name': record.name,
           'description': record.description, 'descriptionChars': record.descriptionChars,
           'crateDoc': record.crateDoc, 'configDocumented': record.configDocumented,
           'transport': record.transport, 'pushOnly': record.pushOnly,
           'documentedKinds': record.documentedKinds, 'genericKinds': record.genericKinds,
           'snapshotComplete': record.snapshotComplete, 'reportsNotFound': record.reportsNotFound,
           'tests': record.tests, 'conformanceMentions': record.conformanceMentions,
           'ciMentions': record.ciMentions, 'secretHits': record.secretHits,
           'lastChange': record.lastChange}

  # Direct Cargo dependencies (docs/design/dependency-standards.md).
  - name: Dependency
    identityFrom: [connector:workspace]
    fields:
      name: {type: string}
      ecosystem: {type: string}
      requirements: {type: list, items: string}
      usedBy: {type: list, items: string}
      versions: {type: list, items: string}
      sources: {type: list, items: string}
      git: {type: boolean}
      wildcard: {type: boolean}
      inherited: {type: boolean}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/dependency
        id: "'dependency:' + record.ecosystem + ':' + record.name"
        set: >-
          {'name': record.name, 'ecosystem': record.ecosystem,
           'requirements': record.requirements, 'usedBy': record.usedBy,
           'versions': record.versions, 'sources': record.sources,
           'git': record.git, 'wildcard': record.wildcard, 'inherited': record.inherited}

  # Agent instruction files (docs/design/agents-md-standards.md).
  - name: AgentDoc
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      name: {type: string}
      canonical: {type: boolean}
      lines: {type: integer}
      commandLines: {type: integer}
      pointsAtAgents: {type: boolean}
      mentionsDecisions: {type: boolean}
      ciMissingCommands: {type: list, items: string, description: "Backtick check commands (tool and subcommand) that no workflow runs. Table rows are excluded."}
      missingFiles: {type: list, items: string}
      hiddenChars: {type: integer}
      secretHits: {type: list, items: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/agent-doc
        id: "'agent-doc:' + record.path"
        set: >-
          {'path': record.path, 'name': record.name, 'canonical': record.canonical,
           'lines': record.lines, 'commandLines': record.commandLines,
           'pointsAtAgents': record.pointsAtAgents, 'mentionsDecisions': record.mentionsDecisions,
           'ciMissingCommands': record.ciMissingCommands,
           'missingFiles': record.missingFiles, 'hiddenChars': record.hiddenChars,
           'secretHits': record.secretHits}

  # npm manifests (docs/design/package-standards.md).
  - name: PackageJson
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      name: {type: string}
      version: {type: string}
      private: {type: boolean}
      descriptionChars: {type: integer}
      engines: {type: boolean}
      requirements: {type: list, items: string}
      wildcardRanges: {type: list, items: string}
      gitRanges: {type: list, items: string}
      lockfile: {type: string}
      checkScripts: {type: integer}
      ciUsesInstall: {type: boolean}
      secretHits: {type: list, items: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/package-json
        id: "'package-json:' + record.path"
        set: >-
          {'path': record.path, 'name': record.name, 'version': record.version,
           'private': record.private, 'descriptionChars': record.descriptionChars,
           'engines': record.engines, 'requirements': record.requirements,
           'wildcardRanges': record.wildcardRanges, 'gitRanges': record.gitRanges,
           'lockfile': record.lockfile, 'checkScripts': record.checkScripts,
           'ciUsesInstall': record.ciUsesInstall, 'secretHits': record.secretHits}

  # JSON Schema documents (docs/design/schema-standards.md).
  - name: JsonSchema
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      name: {type: string}
      dialect: {type: string}
      schemaId: {type: string}
      titleChars: {type: integer}
      descriptionChars: {type: integer}
      externalRefs: {type: list, items: string}
      wired: {type: boolean}
      draft202012: {type: boolean}
      secretHits: {type: list, items: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/json-schema
        id: "'json-schema:' + record.path"
        set: >-
          {'path': record.path, 'name': record.name, 'dialect': record.dialect, 'schemaId': record.schemaId,
           'titleChars': record.titleChars, 'descriptionChars': record.descriptionChars,
           'externalRefs': record.externalRefs, 'wired': record.wired,
           'draft202012': record.draft202012, 'secretHits': record.secretHits}

  # Example and experiment write-ups (docs/design/example-standards.md).
  - name: Example
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      title: {type: string}
      lines: {type: integer}
      commandLines: {type: integer}
      missingFiles: {type: list, items: string}
      citesDesign: {type: boolean}
      secretHits: {type: list, items: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/example
        id: "'example:' + record.path"
        set: >-
          {'path': record.path, 'title': record.title, 'lines': record.lines,
           'commandLines': record.commandLines, 'missingFiles': record.missingFiles,
           'citesDesign': record.citesDesign, 'secretHits': record.secretHits}

  # Agent plugin packages (docs/design/plugin-standards.md). Skills inside them stay Skill entities.
  - name: Plugin
    description: "An Agent Plugins 1.0.0 package: plugin.json, mcp.json, and skills at the spec path."
    identityFrom: [connector:workspace]
    fields:
      path: {type: string, description: "Path of plugin.json."}
      dir: {type: string, description: "Plugin directory. The entity id uses this path."}
      name: {type: string, description: "The name field."}
      nameOk: {type: boolean, description: "Name matches the 1.0.0 rule: 1-64 chars, a-z, digits, dot and hyphen, alphanumeric ends, no double hyphen or double dot."}
      descriptionChars: {type: integer, description: "Length of the description."}
      schemaOk: {type: boolean, description: "$schema is the Agent Plugins 1.0.0 plugin schema."}
      hasMcp: {type: boolean, description: "mcp.json sits beside plugin.json."}
      mcpSchemaOk: {type: boolean, description: "$schema is the Agent Plugins 1.0.0 mcp schema."}
      commandToken: {type: boolean, description: "Every stdio command is one token (bare, ./, or a plugin variable). True when there is no stdio server."}
      headerSecrets: {type: list, items: string, description: "MCP headers whose values match a high-precision secret shape."}
      pathEscapes: {type: list, items: string, description: "Commands or args that contain a parent-directory segment."}
      misplacedSkills: {type: list, items: string, description: "SKILL.md files that are not skills/<name>/SKILL.md."}
      secretHits: {type: list, items: string, description: "Secret shapes in plugin.json or mcp.json."}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/plugin
        id: "'plugin:' + record.dir"
        set: >-
          {'path': record.path, 'dir': record.dir, 'name': record.name, 'nameOk': record.nameOk,
           'descriptionChars': record.descriptionChars, 'schemaOk': record.schemaOk,
           'hasMcp': record.hasMcp, 'mcpSchemaOk': record.mcpSchemaOk, 'commandToken': record.commandToken,
           'headerSecrets': record.headerSecrets, 'pathEscapes': record.pathEscapes,
           'misplacedSkills': record.misplacedSkills, 'secretHits': record.secretHits}

  # The checkout (docs/design/supply-chain-standards.md, docs/design/repo-level.md).
  - name: Repository
    description: "This checkout: the files that turn on supply-chain tools, and the scorecards it rolls up."
    identityFrom: [connector:workspace]
    fields:
      name: {type: string, description: "owner/name from the origin remote, or the directory name."}
      dependabotGaps: {type: list, items: string, description: "Of cargo, npm and github-actions, the ecosystems dependabot.yml does not update."}
      codeScanning: {type: boolean, description: "A workflow uses github/codeql-action."}
      codeScanningPinned: {type: boolean, description: "That use is pinned to a 40-character commit."}
      securityPolicy: {type: boolean, description: "SECURITY.md exists at the root, under .github, or under docs."}
      workflowOwners: {type: boolean, description: "A CODEOWNERS rule covers .github/workflows/ci.yml."}
      watchOverride: {type: list, items: string, description: "Constituents a fixture watches. Empty on a live checkout, which then uses policy.repoRollup."}
      watch:
        type: list
        items: string
        description: "Constituent scorecards whose lowest level is this repository's level."
        computed: "entity.watchOverride.size() > 0 ? entity.watchOverride : policy.repoRollup"
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/repo
        id: "'repo:' + record.name"
        set: >-
          {'name': record.name, 'dependabotGaps': record.dependabotGaps,
           'codeScanning': record.codeScanning, 'codeScanningPinned': record.codeScanningPinned,
           'securityPolicy': record.securityPolicy, 'workflowOwners': record.workflowOwners,
           'watchOverride': has(record.watchOverride) ? record.watchOverride : []}

  # ── Layers 2 and 3: what operators and users rely on ─────────────────────────────────────
  - name: Command
    description: "A `toolbox` CLI (sub)command, from `toolbox describe`."
    identityFrom: [connector:surfaces]
    fields:
      name: {type: string}
      about: {type: string}
      args: {type: list, items: object}
      undocumentedArgs: {type: list, items: string}
      structuredOutput: {type: boolean}
      mcpTool: {type: string}
      layer:
        type: enum
        values: [operator, user]
        computed: "has(entity.mcpTool) || entity.name == 'mcp' ? 'user' : 'operator'"
      documentedIn: {type: list, items: string, computed: "inbound.mentionsCommand.map(d, d.path)"}
      exercisedBy: {type: list, items: string, computed: "inbound.exercisesCommand.map(f, f.path)"}
    relations:
      callsTool: {to: McpTool, many: false}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/command
        id: "'command:' + record.slug"
        set: >-
          {'name': record.name, 'about': record.about, 'args': record.args,
           'undocumentedArgs': record.undocumentedArgs, 'structuredOutput': record.structuredOutput,
           'mcpTool': record.mcpTool}
        relations:
          callsTool: "record.mcpTool == null ? [] : ['mcp-tool:' + record.mcpTool]"

  - name: McpTool
    description: "A built-in MCP tool the server exposes, from `toolbox describe`."
    identityFrom: [connector:surfaces]
    fields:
      name: {type: string}
      description: {type: string}
      annotations: {type: object}
      properties: {type: list, items: string}
      undescribedProperties: {type: list, items: string}
      observed: {type: object}             # from the runner: {calls, errors} in the MCP contract tests
      documentedIn: {type: list, items: string, computed: "inbound.mentionsTool.map(d, d.path)"}
      exercisedBy: {type: list, items: string, computed: "inbound.exercisesTool.map(f, f.path)"}
      viaCli: {type: list, items: string, computed: "inbound.callsTool.map(c, c.name)"}
    sources:
      default: [connector:surfaces]
      fields: {observed: [connector:runner]}
    map:
      - from: runner/mcp-calls
        id: "'mcp-tool:' + record.tool"
        set: "{'observed': record}"
      - from: surfaces/mcp-tool
        id: "'mcp-tool:' + record.name"
        set: >-
          {'name': record.name, 'description': record.description, 'annotations': record.annotations,
           'properties': record.properties, 'undescribedProperties': record.undescribedProperties}

  # ── CI: the workflows and actions that build, test and ship Toolbox ──────────────────────
  - name: Workflow
    description: "A GitHub Actions workflow or action metadata file, with lint findings and run history."
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      type: {type: enum, values: [workflow, action]}
      name: {type: string}
      triggers: {type: list, items: string}
      riskyTriggers: {type: list, items: string}
      topPermissions: {type: boolean}
      jobs: {type: integer}
      jobsWithoutTimeout: {type: list, items: string}
      jobsWithoutPermissions: {type: list, items: string}
      jobsWithWrite: {type: list, items: string}
      concurrency: {type: boolean}
      unpinned: {type: list, items: string}
      zizmor: {type: object}               # {total, counts: {high, medium, low, informational}, findings}
      actionlint: {type: object}           # {total, findings}
      runs: {type: object}                 # from the GitHub API: failRate, rerunRate, failingStreak, p90Seconds …
    relations:
      usesAction: {to: ActionDependency, many: true}
    sources:
      default: [connector:workspace]
      fields:
        zizmor: [connector:ci-lint]
        actionlint: [connector:ci-lint]
        runs: [connector:github-actions]
    map:
      - from: workspace/workflow
        id: "'workflow:' + record.path"
        set: >-
          {'path': record.path, 'type': record.type, 'name': record.name, 'triggers': record.triggers,
           'riskyTriggers': record.riskyTriggers, 'topPermissions': record.topPermissions, 'jobs': record.jobs,
           'jobsWithoutTimeout': record.jobsWithoutTimeout, 'jobsWithoutPermissions': record.jobsWithoutPermissions,
           'jobsWithWrite': record.jobsWithWrite, 'concurrency': record.concurrency, 'unpinned': record.unpinned}
        relations:
          usesAction: "record.actions.map(a, 'action:' + a)"
      - from: ci-lint/zizmor
        id: "'workflow:' + record.path"
        set: "{'zizmor': record}"
      - from: ci-lint/actionlint
        id: "'workflow:' + record.path"
        set: "{'actionlint': record}"
      - from: github-actions/workflow-runs
        id: "'workflow:' + record.path"
        set: "{'runs': record}"

  - name: ActionDependency
    description: "A third-party action or reusable workflow our CI runs, across every workflow using it."
    identityFrom: [connector:workspace]
    fields:
      name: {type: string}
      owner: {type: string}
      refs: {type: list, items: string}
      pins: {type: list, items: string}
      usedBy: {type: list, items: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/action-ref
        id: "'action:' + record.name"
        set: "{'name': record.name, 'owner': record.owner, 'refs': record.refs, 'pins': record.pins, 'usedBy': record.usedBy}"

  # ── Our standards themselves (scorecards for scorecards) ──────────────────────────────────
  - name: Scorecard
    description: "A scorecard one of the described portals declares (this one, the starter or the reference portal)."
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string}
      name: {type: string}
      kind: {type: string}
      owner: {type: string}
      levels: {type: list, items: string}
      rulesPerLevel: {type: object}
      rules: {type: integer}
      tested: {type: boolean}
      meta: {type: boolean}
      fixtureLevels: {type: object}        # levels the portal's own fixtures reach
      liveEntities: {type: integer}        # information only (from the committed results)
      untestedRules: {type: list, items: string, computed: "inbound.ruleOf.filter(r, !r.tested).map(r, r.name)"}
      hash: {type: string, description: "Content hash of the scorecard's definition: assessments of it go stale when it changes."}
      reviewState: {type: string, description: "scorecard-quality assessment: fresh, stale or missing.", computed: "inbound.assessesScorecard.size() == 0 ? 'missing' : (inbound.assessesScorecard[0].subjectHash == entity.hash ? 'fresh' : 'stale')"}
      reviewFailing: {type: list, items: string, description: "Criteria the scorecard-quality assessment failed.", computed: "inbound.assessesScorecard.size() == 0 ? [] : inbound.assessesScorecard[0].failing"}
      reviewUnsure: {type: list, items: string, description: "Criteria the assessor was unsure of.", computed: "inbound.assessesScorecard.size() == 0 ? [] : inbound.assessesScorecard[0].unsure"}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/scorecard
        id: "'scorecard:' + record.portal + '/' + record.name"
        set: >-
          {'portal': record.portal, 'name': record.name, 'kind': record.kind, 'owner': record.owner,
           'levels': record.levels, 'rulesPerLevel': record.rulesPerLevel, 'rules': record.rules,
           'tested': record.tested, 'meta': record.meta, 'fixtureLevels': record.fixtureLevels,
           'liveEntities': has(record.liveEntities) ? record.liveEntities : null, 'hash': record.hash}

  - name: Rule
    description: "A rule of one of those scorecards: what it is made of, its tests and its outcomes."
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string}
      scorecard: {type: string}
      name: {type: string}
      level: {type: string}
      fixWords: {type: integer}
      hasEvidence: {type: boolean}
      check: {type: object}                # CEL: nodes, depth, loops (comprehension nesting), fields, functions
      evidence: {type: object}
      tested: {type: boolean}              # a test expectation names it
      fixture: {type: object}              # {pass, fail, unknown} over the portal's fixtures
      live: {type: object}                 # information only: {entities, pass, fail, unknown} on real data
      checkCel: {type: string, description: "The rule's check, as written."}
      evidenceCel: {type: string, description: "The rule's evidence expression, as written."}
      fixText: {type: string, description: "The rule's fix text."}
      hash: {type: string, description: "Content hash of the rule's definition: assessments of it go stale when it changes."}
      reviewState: {type: string, description: "rule-quality assessment: fresh, stale or missing.", computed: "inbound.assessesRule.size() == 0 ? 'missing' : (inbound.assessesRule[0].subjectHash == entity.hash ? 'fresh' : 'stale')"}
      reviewFailing: {type: list, items: string, description: "Criteria the rule-quality assessment failed.", computed: "inbound.assessesRule.size() == 0 ? [] : inbound.assessesRule[0].failing"}
      reviewUnsure: {type: list, items: string, description: "Criteria the assessor was unsure of.", computed: "inbound.assessesRule.size() == 0 ? [] : inbound.assessesRule[0].unsure"}
    relations:
      ruleOf: {to: Scorecard, many: false}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/rule
        id: "'rule:' + record.card + '/' + record.name"
        set: >-
          {'portal': record.portal, 'scorecard': record.scorecard, 'name': record.name, 'level': record.level,
           'fixWords': record.fixWords, 'hasEvidence': record.hasEvidence, 'check': record.check,
           'evidence': record.evidence, 'tested': record.tested, 'fixture': record.fixture,
           'live': has(record.live) ? record.live : null, 'hash': record.hash,
           'checkCel': record.definition.check, 'evidenceCel': record.definition.evidence, 'fixText': record.definition.fix}
        relations:
          ruleOf: "['scorecard:' + record.card]"

  # ── The rest of a portal's model (docs/design/scorecards-for-scorecards.md §5) ──────────────
  - name: Kind
    description: A kind of entity one of the described portals declares.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string, description: Portal that declares it.}
      name: {type: string, description: The kind's name.}
      described: {type: boolean, description: The manifest gives the kind a description.}
      fieldCount: {type: integer, description: "Declared fields, computed ones included."}
      fieldsDescribed: {type: integer, description: Fields with a description.}
      scorecards: {type: list, items: string, description: Scorecards on this kind.}
      relationsOut: {type: list, items: string, description: Relations it declares.}
      relationsIn: {type: list, items: string, description: "Relations other kinds declare to it, as Kind.relation."}
      fixtureEntities: {type: integer, description: Entities of this kind the portal's fixtures produce.}
      tested: {type: boolean, description: A test expectation names one of those entities.}
      hash: {type: string, description: Content hash of the kind's definition.}
      undescribedFields: {type: list, items: string, description: Fields without a description., computed: "inbound.fieldOf.filter(f, !f.described).map(f, f.name)"}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/kind
        id: "'kind:' + record.portal + '/' + record.name"
        set: >-
          {'portal': record.portal, 'name': record.name, 'described': record.described,
           'fieldCount': record.fields, 'fieldsDescribed': record.fieldsDescribed, 'scorecards': record.scorecards,
           'relationsOut': record.relationsOut, 'relationsIn': record.relationsIn,
           'fixtureEntities': record.fixtureEntities, 'tested': record.tested, 'hash': record.hash}

  - name: Field
    description: A field of a kind in one of the described portals.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string, description: Portal that declares it.}
      kind: {type: string, description: The kind it belongs to.}
      name: {type: string, description: The field's name.}
      fieldType: {type: string, description: "Declared type (string, integer, boolean, list, object, …)."}
      described: {type: boolean, description: The manifest gives the field a description.}
      computed: {type: boolean, description: A CEL expression computes it.}
      opaque: {type: boolean, description: "An object, or a list of objects: no declared shape for validation, CEL type checks or agents."}
      sources: {type: list, items: string, description: "Sources allowed to set it, in precedence order."}
      readBy: {type: list, items: string, description: "Rules, evidence, computed fields and authorization that read it (information: display fields are read by no CEL)."}
      fixtureEntities: {type: integer, description: Fixture entities of its kind.}
      fixtureWithValue: {type: integer, description: Fixture entities with a value for it.}
      hash: {type: string, description: Content hash of the field's definition.}
    relations:
      fieldOf: {to: Kind, many: false}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/field
        id: "'field:' + record.portal + '/' + record.kind + '.' + record.name"
        set: >-
          {'portal': record.portal, 'kind': record.kind, 'name': record.name, 'fieldType': record.type,
           'described': record.described, 'computed': record.computed, 'opaque': record.opaque,
           'sources': record.sources, 'readBy': record.readBy, 'fixtureEntities': record.fixture.entities,
           'fixtureWithValue': record.fixture.withValue, 'hash': record.hash}
        relations:
          fieldOf: "['kind:' + record.portal + '/' + record.kind]"

  - name: PortalConnector
    description: A connector one of the described portals declares.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string, description: Portal that declares it.}
      name: {type: string, description: The connector's name.}
      runtime: {type: string, description: in-image or remote.}
      package: {type: string, description: "Package (builtin:<name> or an image)."}
      records: {type: list, items: string, description: Record kinds it declares.}
      unmapped: {type: list, items: string, description: Declared record kinds no map rule reads.}
      withoutFreshness: {type: list, items: string, description: Record kinds with no freshness bound.}
      refreshable: {type: list, items: string, description: Record kinds it can refresh by id.}
      fixtureRecords: {type: integer, description: Messages in the portal's fixture file for it.}
      hash: {type: string, description: Content hash of the connector's declaration.}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/connector
        id: "'connector:' + record.portal + '/' + record.name"
        set: >-
          {'portal': record.portal, 'name': record.name, 'runtime': record.runtime, 'package': record.package,
           'records': record.records, 'unmapped': record.unmapped, 'withoutFreshness': record.withoutFreshness,
           'refreshable': record.refreshable, 'fixtureRecords': record.fixtureRecords, 'hash': record.hash}

  - name: Rubric
    description: A rubric one of the described portals declares, with how it has been used.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string, description: Portal that declares it.}
      name: {type: string, description: The rubric's name.}
      rubricKind: {type: string, description: The kind it assesses.}
      subject: {type: string, description: The field assessments are versioned by.}
      described: {type: boolean, description: The rubric has a description.}
      criteria: {type: list, items: string, description: Its criteria.}
      unguided: {type: list, items: string, description: Criteria without guidance.}
      assessments: {type: integer, description: "Assessments made with it (the portal's assessments/ files)."}
      alwaysPass: {type: list, items: string, description: "With three or more assessments: criteria every one passed."}
      hash: {type: string, description: Content hash of the rubric.}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/rubric
        id: "'rubric:' + record.portal + '/' + record.name"
        set: >-
          {'portal': record.portal, 'name': record.name, 'rubricKind': record.kind, 'subject': record.subject,
           'described': record.described, 'criteria': record.criteria, 'unguided': record.unguided,
           'assessments': record.assessments, 'alwaysPass': record.alwaysPass, 'hash': record.hash}

  # ── The SDLC layers and their stages (docs/sdlc.md, D87) ─────────────────────────────────
  - name: SdlcLayer
    description: "One SDLC layer: maintainer, package author, operator or user, with the stages it needs."
    identityFrom: [connector:workspace]
    fields:
      title: {type: string, description: The layer's name.}
      who: {type: string, description: Who works in this layer.}
      builds: {type: string, description: What they build.}
      doc: {type: string, description: The layer's design doc.}
      stages: {type: list, items: string, description: "The stages this layer needs, in order."}
      missingPaths: {type: list, items: string, description: Declared paths that don't exist.}
      definedStages: {type: list, items: string, description: Stages declared for this layer., computed: "inbound.stageOf.map(s, s.name)"}
      stagesMissing: {type: list, items: string, description: "Stages with status missing.", computed: "inbound.stageOf.filter(s, s.status == 'missing').map(s, s.name)"}
      stagesNotBuilt: {type: list, items: string, description: "Stages not yet built (partial, designed or missing).", computed: "inbound.stageOf.filter(s, s.status != 'built').map(s, s.name + ' (' + s.status + ')')"}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/sdlc-layer
        id: "'sdlc:' + record.id"
        set: >-
          {'title': record.title, 'who': record.who, 'builds': record.builds, 'doc': record.doc,
           'stages': record.stages, 'missingPaths': record.missingPaths}

  - name: SdlcStage
    description: "One stage of an SDLC layer: what it is for, its exit criterion, the commands and checks that carry it out, and its open gaps."
    identityFrom: [connector:workspace]
    fields:
      layer: {type: string, description: The layer it belongs to.}
      name: {type: string, description: The stage's name.}
      order: {type: integer, description: Position in the layer.}
      intent: {type: string, description: What the stage is for.}
      exitCriterion: {type: string, description: What must be true to leave the stage.}
      commands: {type: list, items: string, description: Commands a person or agent runs in this stage.}
      checks: {type: list, items: string, description: "Files that verify the stage (CI workflows, scripts, tests)."}
      docs: {type: list, items: string, description: Docs that describe the stage.}
      status: {type: string, description: "built, partial, designed or missing."}
      gaps: {type: list, items: string, description: What is missing for the stage to be built.}
      missingPaths: {type: list, items: string, description: Declared docs or checks that don't exist.}
      hash: {type: string, description: Content hash of the declaration; assessments of it go stale when it changes.}
      reviewState: {type: string, description: "sdlc-stage-quality assessment: fresh, stale or missing.", computed: "inbound.assessesSdlcStage.size() == 0 ? 'missing' : (inbound.assessesSdlcStage[0].subjectHash == entity.hash ? 'fresh' : 'stale')"}
      reviewFailing: {type: list, items: string, description: "Criteria the sdlc-stage-quality assessment failed.", computed: "inbound.assessesSdlcStage.size() == 0 ? [] : inbound.assessesSdlcStage[0].failing"}
      reviewUnsure: {type: list, items: string, description: "Criteria the assessor was unsure of.", computed: "inbound.assessesSdlcStage.size() == 0 ? [] : inbound.assessesSdlcStage[0].unsure"}
    relations:
      stageOf: {to: SdlcLayer, many: false}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/sdlc-stage
        id: "'sdlc-stage:' + record.id"
        set: >-
          {'layer': record.layer, 'name': record.name, 'order': record.order, 'intent': record.intent,
           'exitCriterion': record.exitCriterion, 'commands': record.commands, 'checks': record.checks,
           'docs': record.docs, 'status': record.status, 'gaps': record.gaps,
           'missingPaths': record.missingPaths, 'hash': record.hash}
        relations:
          stageOf: "['sdlc:' + record.layer]"

  # ── Judgement, pushed by coding agents (D79) ─────────────────────────────────────────────
  - name: Assessment
    description: "One coding agent's (or person's) judgement of one entity against a rubric: a file in portal/assessments/, written after `toolbox assess brief`."
    identityFrom: [connector:workspace]
    fields:
      entity: {type: string, description: The entity assessed.}
      rubric: {type: string, description: The rubric it was assessed against.}
      subjectHash: {type: string, description: "The entity's hash when assessed; a different hash now means stale."}
      assessorName: {type: string, description: "The agent harness or person (assessor.name)."}
      assessorKind: {type: string, description: "agent or person."}
      at: {type: string, description: When it was assessed.}
      verdict: {type: string, description: "fail if any criterion failed, else unsure if any was unsure, else pass."}
      failing: {type: list, items: string, description: Criteria that failed.}
      unsure: {type: list, items: string, description: Criteria the assessor could not decide.}
      reasons: {type: list, items: string, description: "One line per criterion: verdict, name and reason."}
      summary: {type: string, description: The assessor's summary.}
      path: {type: string, description: The file it was read from.}
      unsuggested: {type: list, items: string, description: "Criteria judged fail or unsure without a suggestion."}
      uncited: {type: list, items: string, description: "Criteria whose reason cites nothing checkable (a path, a decision id, a section, a number)."}
      hash: {type: string, description: "Content hash of the assessment: what an assessment-quality review of it is versioned by."}
      reviewState: {type: string, description: "assessment-quality review: fresh, stale or missing.", computed: "inbound.assessesAssessment.size() == 0 ? 'missing' : (inbound.assessesAssessment[0].subjectHash == entity.hash ? 'fresh' : 'stale')"}
      reviewFailing: {type: list, items: string, description: "Criteria the assessment-quality review failed.", computed: "inbound.assessesAssessment.size() == 0 ? [] : inbound.assessesAssessment[0].failing"}
      reviewUnsure: {type: list, items: string, description: "Criteria the reviewer was unsure of.", computed: "inbound.assessesAssessment.size() == 0 ? [] : inbound.assessesAssessment[0].unsure"}
    relations:
      assessesAssessment: {to: Assessment, many: false, unresolved: ignore}
      assessesSdlcStage: {to: SdlcStage, many: false, unresolved: ignore}
      assessesRule: {to: Rule, many: false, unresolved: ignore}
      assessesScorecard: {to: Scorecard, many: false, unresolved: ignore}
      assessesCrate: {to: Crate, many: false, unresolved: ignore}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/assessment
        id: "'assessment:' + record.rubric + '/' + record.entity"
        set: >-
          {'entity': record.entity, 'rubric': record.rubric, 'subjectHash': record.subjectHash,
           'assessorName': has(record.assessor.name) ? record.assessor.name : null, 'assessorKind': record.assessor.kind,
           'at': string(record.at), 'verdict': record.verdict, 'failing': record.failing, 'unsure': record.unsure,
           'reasons': record.verdicts.map(v, v.verdict + ' ' + v.criterion + ': ' + v.reason),
           'summary': record.summary, 'path': record.path, 'unsuggested': record.unsuggested,
           'uncited': record.uncited, 'hash': record.hash}
        relations:
          assessesAssessment: "record.entity.startsWith('assessment:') ? [record.entity] : []"
          assessesSdlcStage: "record.entity.startsWith('sdlc-stage:') ? [record.entity] : []"
          assessesRule: "record.entity.startsWith('rule:') ? [record.entity] : []"
          assessesScorecard: "record.entity.startsWith('scorecard:') ? [record.entity] : []"
          assessesCrate: "record.entity.startsWith('crate:') ? [record.entity] : []"

scorecards:
  # ── Layer 1: maintainer SDLC ─────────────────────────────────────────────────────────────
  - name: maintainer-crate
    kind: Crate
    owner: group:maintainers
    levels: [bronze, silver, gold]
    appliesTo: "entity.codeLines >= 50"    # placeholder crates (toolbox-durable, toolbox-exec) are skipped
    rules:
      - name: crate-docs
        level: bronze
        check: "entity.crateDoc"
        fix: "Start the crate's lib.rs or main.rs with //! docs: what it is and which spec section it implements."
      - name: has-tests
        level: bronze
        check: "entity.unitTests + entity.integrationTests > 0"
        fix: "Add a #[test] for the crate's main behaviour, or an integration test in tests/."
      - name: tests-pass
        level: bronze
        check: "has(entity.tests) && entity.tests.status == 'pass'"
        evidence: "has(entity.tests) ? [entity.tests.status + ': ' + string(entity.tests.failed) + ' failed'] + (has(entity.tests.output) ? [entity.tests.output] : []) : ['no test run yet (refresh the crate)']"
        fix: "Run `cargo test -p <crate>` and fix the failures in the evidence."
      - name: clippy-clean
        level: bronze
        check: "has(entity.clippy) && entity.clippy.status == 'pass'"
        evidence: "has(entity.clippy) ? entity.clippy.messages : ['no clippy run yet (refresh the crate)']"
        fix: "Fix the clippy warnings in the evidence (`cargo clippy -p <crate> --all-targets`)."
      - name: public-api-documented
        level: silver
        check: "entity.docCoverage >= 80"
        evidence: "entity.undocumented"
        fix: "Add /// docs to the public items in the evidence."
      - name: no-huge-functions
        level: silver
        check: "entity.maxFnLines <= 150"
        evidence: "entity.functions.filter(f, f.lines > 150).map(f, f.name + ' at ' + f.at + ': ' + string(f.lines) + ' lines')"
        fix: "Split the functions in the evidence into named steps."
      - name: bounded-complexity
        level: silver
        check: "entity.maxComplexity <= 30"
        evidence: "entity.functions.filter(f, f.complexity > 30).map(f, f.name + ' at ' + f.at + ': complexity ' + string(f.complexity))"
        fix: "Simplify the functions in the evidence (extract match arms, early returns)."
      - name: fully-documented
        level: gold
        check: "entity.docCoverage == 100"
        evidence: "entity.undocumented"
        fix: "Document every item in the evidence."
      - name: short-functions
        level: gold
        check: "entity.longFunctions.size() == 0"
        evidence: "entity.longFunctions"
        fix: "Keep functions at 80 lines or fewer; split those in the evidence."
      - name: simple-functions
        level: gold
        check: "entity.complexFunctions.size() == 0"
        evidence: "entity.complexFunctions"
        fix: "Keep cyclomatic complexity at 15 or lower; simplify those in the evidence."
      - name: few-unwraps
        level: gold
        check: "entity.unwraps * 100 <= entity.codeLines"
        evidence: "[string(entity.unwraps) + ' unwrap/expect calls in ' + string(entity.codeLines) + ' lines']"
        fix: "At most one unwrap/expect per 100 lines outside tests: return errors or document the invariant."
    facets: {summary: public, details: public}

  - name: maintainer-docs
    kind: Doc
    owner: group:maintainers
    levels: [bronze, silver]
    appliesTo: "!(entity.path in policy.historicalDocs)"
    rules:
      - name: links-resolve
        level: bronze
        check: "entity.brokenLinks.size() == 0"
        evidence: "entity.brokenLinks"
        fix: "Fix or remove the relative links in the evidence."
      - name: names-sdlc-layer
        level: bronze
        check: "entity.counts.sdlc <= entity.counts.layeredSdlc"
        evidence: "[string(entity.counts.sdlc - entity.counts.layeredSdlc) + ' mention(s) of SDLC without a layer']"
        fix: "Say which SDLC you mean: maintainer, operator or user (docs/sdlc.md, D63)."
      - name: cited-decisions-exist
        level: bronze
        check: "entity.missingDecisions.size() == 0"
        evidence: "entity.missingDecisions"
        fix: "The decision ids in the evidence are not rows of docs/decisions.md. Cite a decision that exists, or add the row."
      - name: status-banner
        level: silver
        check: "entity.area != 'design' || entity.hasStatus"
        fix: "Start the design doc with a *Status:* line saying what is decided and what is built."
      - name: cites-sources
        level: silver
        check: "entity.area != 'design' || entity.hasSources"
        fix: "End the design doc with a ## Sources section (AGENTS.md working rules)."
    facets: {summary: public, details: public}

  # ── Layer 2: operator SDLC ───────────────────────────────────────────────────────────────
  - name: operator-cli
    kind: Command
    owner: group:maintainers
    levels: [bronze, silver]
    appliesTo: "entity.layer == 'operator'"
    rules:
      - name: has-help
        level: bronze
        check: "has(entity.about) && entity.about.size() >= 10"
        fix: "Give the command a /// doc comment; clap shows it as the command's help."
      - name: documented
        level: bronze
        check: "entity.documentedIn.size() > 0"
        evidence: "['not mentioned as `toolbox ' + entity.name + '` in any doc']"
        fix: "Describe `toolbox <command>` in docs/v1-spec.md §7.7 or the operator SDLC doc."
      - name: args-described
        level: silver
        check: "entity.undocumentedArgs.size() == 0"
        evidence: "entity.undocumentedArgs"
        fix: "Add a /// doc comment to each argument in the evidence."
      - name: exercised
        level: silver
        check: "entity.exercisedBy.size() > 0"
        fix: "Run the command in an acceptance script or an integration test."
    facets: {summary: public, details: public}

  # ── Layer 3: user SDLC ───────────────────────────────────────────────────────────────────
  - name: user-cli
    kind: Command
    owner: group:maintainers
    levels: [bronze, silver]
    appliesTo: "entity.layer == 'user'"
    rules:
      - name: has-help
        level: bronze
        check: "has(entity.about) && entity.about.size() >= 10"
        fix: "Give the command a /// doc comment; clap shows it as the command's help."
      - name: structured-output
        level: bronze
        check: "entity.name == 'mcp' || entity.structuredOutput"
        fix: "Support -o json so scripts and apps can parse the output."
      - name: args-described
        level: silver
        check: "entity.undocumentedArgs.size() == 0"
        evidence: "entity.undocumentedArgs"
        fix: "Add a /// doc comment to each argument in the evidence."
      - name: exercised
        level: silver
        check: "entity.exercisedBy.size() > 0"
        fix: "Run the command in an acceptance script or an integration test."
    facets: {summary: public, details: public}

  - name: user-mcp
    kind: McpTool
    owner: group:maintainers
    levels: [bronze, silver, gold]
    rules:
      - name: described
        level: bronze
        check: "entity.description.size() >= 20"
        fix: "Describe what the tool returns and when an agent should call it."
      - name: annotated
        level: bronze
        check: "has(entity.annotations.readOnlyHint)"
        fix: "Set annotations.readOnlyHint (and idempotent/openWorld hints for writes)."
      - name: inputs-described
        level: silver
        check: "entity.undescribedProperties.size() == 0"
        evidence: "entity.undescribedProperties"
        fix: "Add a description to each input property in the evidence (crates/toolbox-api/src/mcp.rs)."
      - name: documented
        level: silver
        check: "'docs/v1-spec.md' in entity.documentedIn"   # common names (`get`, `query`) appear in many docs
        evidence: "entity.documentedIn.size() == 0 ? ['documented in: nothing'] : entity.documentedIn.map(d, 'documented in ' + d + ', not docs/v1-spec.md')"
        fix: "List the tool, in backticks, in docs/v1-spec.md §7.3."
      - name: contract-tested
        level: gold
        # Observed calls when the runner has run the contract tests; otherwise a tools/call body that
        # names the tool (static mode, weaker: it can't see whether the call happens).
        check: "has(entity.observed) ? entity.observed.calls > 0 : entity.exercisedBy.size() > 0"
        evidence: "has(entity.observed) ? ['observed ' + string(entity.observed.calls) + ' call(s) in the MCP contract tests'] : ['no tools/call naming this tool in tests or scripts (static mode)']"
        fix: "Call the tool directly (tools/call) in a test, e.g. crates/toolbox-api/tests; the CLI path in `viaCli` doesn't pin the MCP contract."
    facets: {summary: public, details: public}

  # ── Layer 1: maintainer SDLC — CI (docs/design/github-actions-standards.md) ──────────────
  # Security: what an attacker could do through a workflow or the report action (which pilot repos
  # run, so it is operator-facing too). zizmor and actionlint rules evaluate to `unknown`, not `fail`,
  # where those tools aren't installed.
  - name: maintainer-ci-security
    kind: Workflow
    owner: group:maintainers
    levels: [bronze, silver, gold]
    rules:
      - name: actionlint-clean
        level: bronze
        check: "entity.type == 'action' || entity.actionlint.total == 0"
        evidence: "entity.actionlint.findings.map(f, f.rule + ' at line ' + string(f.line) + ': ' + f.message)"
        fix: "Fix what actionlint reports (`actionlint` in the repository root)."
      - name: no-high-findings
        level: bronze
        check: "entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule != 'unpinned-uses').size() == 0"
        evidence: "entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule != 'unpinned-uses').map(f, f.rule + ' at line ' + string(f.line) + ': ' + f.message)"
        fix: "Fix zizmor's high-severity findings (`zizmor --offline .github/workflows actions`); see https://docs.zizmor.sh/audits/."
      - name: least-privilege-token
        level: bronze
        check: "entity.type == 'action' || entity.topPermissions || entity.jobsWithoutPermissions.size() == 0"
        evidence: "entity.jobsWithoutPermissions"
        fix: "Declare `permissions:` at the top of the workflow (read-only, e.g. `contents: read`) and grant writes per job."
      - name: pinned-to-sha
        level: bronze
        check: "entity.unpinned.size() == 0"
        evidence: "entity.unpinned"
        fix: "Pin every third-party `uses:` to a full commit SHA (with the tag in a comment), or adopt a workflow lockfile; let Dependabot update them."
      - name: no-medium-findings
        level: silver
        check: "entity.zizmor.counts.medium == 0"
        evidence: "entity.zizmor.findings.filter(f, f.severity == 'medium').map(f, f.rule + ' at line ' + string(f.line) + ': ' + f.message)"
        fix: "Fix zizmor's medium findings (e.g. `artipacked`: set `persist-credentials: false` on checkout)."
      - name: no-write-tokens-on-risky-triggers
        level: silver
        check: "entity.riskyTriggers.size() == 0 || entity.jobsWithWrite.size() == 0"
        evidence: "entity.riskyTriggers.map(t, 'trigger ' + t) + entity.jobsWithWrite.map(j, 'write token in job ' + j)"
        fix: "Don't combine pull_request_target/workflow_run/issue_comment with write permissions; split privileged steps into a separate workflow."
      - name: zizmor-clean
        level: gold
        check: "entity.zizmor.total == 0"
        evidence: "entity.zizmor.findings.map(f, f.severity + ' ' + f.rule + ' at line ' + string(f.line))"
        fix: "Resolve or explicitly ignore (with a reason) zizmor's low and informational findings."
    facets: {summary: public, details: public}

  # Reliability: whether CI can be trusted to say "green means good". Run history comes from the
  # GitHub API (github-actions connector); without it those rules fail with "no run data".
  - name: maintainer-ci-reliability
    kind: Workflow
    owner: group:maintainers
    levels: [bronze, silver, gold]
    appliesTo: "entity.type == 'workflow'"
    rules:
      - name: main-not-stuck-red
        level: bronze
        check: "has(entity.runs) && entity.runs.failingStreak < 3"
        evidence: "has(entity.runs) ? [string(entity.runs.failingStreak) + ' failures in a row on ' + entity.runs.branch + ', last run ' + entity.runs.lastRunAt] : ['no run data (github-actions connector skipped or no token)']"
        fix: "Fix main before anything else: a red default branch hides new failures."
      - name: fail-rate-under-20
        level: bronze
        check: "has(entity.runs) && entity.runs.failRate <= 20"
        evidence: "has(entity.runs) ? [string(entity.runs.failRate) + '% of the last ' + string(entity.runs.decided) + ' decided runs on ' + entity.runs.branch + ' failed'] : ['no run data']"
        fix: "Find the failing jobs (`toolbox get workflow:<path>` shows run data) and fix or quarantine their causes."
      - name: every-job-has-timeout
        level: bronze
        check: "entity.jobsWithoutTimeout.size() == 0"
        evidence: "entity.jobsWithoutTimeout"
        fix: "Set `timeout-minutes` on every job; the default is 360 minutes of a hung runner."
      - name: fail-rate-under-10
        level: silver
        check: "has(entity.runs) && entity.runs.failRate <= 10"
        evidence: "has(entity.runs) ? [string(entity.runs.failRate) + '% failed'] : ['no run data']"
        fix: "Track failures to their causes: flaky tests, infrastructure, or real breakage merged to main."
      - name: few-reruns
        level: silver
        check: "has(entity.runs) && entity.runs.rerunRate <= 5"
        evidence: "has(entity.runs) ? [string(entity.runs.rerunRate) + '% of runs were re-run'] : ['no run data']"
        fix: "Re-runs mean flakiness: find the flaky jobs and fix or isolate them instead of retrying."
      - name: cancels-superseded-runs
        level: silver
        check: "entity.concurrency || !('pull_request' in entity.triggers)"
        evidence: "['no concurrency group on a workflow triggered by pull_request']"
        fix: "Add `concurrency: {group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true}` so a new push cancels the old run."
      - name: fail-rate-under-5
        level: gold
        check: "has(entity.runs) && entity.runs.failRate <= 5"
        evidence: "has(entity.runs) ? [string(entity.runs.failRate) + '% failed'] : ['no run data']"
        fix: "Keep main green: failures should be rare enough that each one gets looked at."
      - name: fast-feedback
        level: gold
        check: "has(entity.runs) && entity.runs.p90Seconds <= 900"
        evidence: "has(entity.runs) ? ['p90 run time ' + string(entity.runs.p90Seconds / 60) + ' min'] : ['no run data']"
        fix: "Keep the p90 run under 15 minutes: split slow jobs, cache builds, move long suites off the PR path."
    facets: {summary: public, details: public}

  # Supply chain: each third-party action, across every workflow that uses it (the "who uses
  # tj-actions/changed-files?" question).
  - name: maintainer-action-deps
    kind: ActionDependency
    owner: group:maintainers
    levels: [bronze]
    rules:
      - name: pinned-everywhere
        level: bronze
        check: "entity.pins.all(p, p == 'sha')"
        evidence: "entity.refs.filter(r, !r.matches('@[0-9a-f]{40}$')) + entity.usedBy.map(u, 'used by ' + u)"
        fix: "Pin this action to a full commit SHA in every workflow that uses it."
    facets: {summary: public, details: public}

  # ── Agent skills we ship (docs/design/skill-standards.md) ────────────────────────────────
  # Bronze is "a harness can load it and route to it". Silver is "an agent can follow it".
  # Gold is "it states its limits, has eval cases, and nothing hostile is hiding in the files".
  # Live with/without-skill runs are not a rule: they need a model and they vary (D71).
  - name: maintainer-skill
    kind: Skill
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: valid-frontmatter
        level: bronze
        check: "entity.frontmatterErrors.size() == 0"
        evidence: "entity.frontmatterErrors"
        fix: "Fix the Agent Skills frontmatter errors in the evidence (name, description, directory match, allowed fields)."
      - name: description-says-when
        level: bronze
        check: "entity.descriptionChars >= 20 && entity.descriptionChars <= 1024 && entity.triggerCues.size() > 0"
        evidence: "entity.triggerCues + [string(entity.descriptionChars) + ' characters']"
        fix: "Say what the skill does and when to use it in the description (20 to 1024 characters), including when, whenever, before, or after."
      - name: third-person
        level: bronze
        check: "entity.descriptionChars > 0 && entity.pronouns.size() == 0"
        evidence: "entity.pronouns.size() == 0 ? ['description is empty'] : entity.pronouns.map(p, 'pronoun: ' + p)"
        fix: "Rewrite the description in third person. Drop you, your, I, we, my, and our; the description is loaded into the agent's prompt."
      - name: has-procedure
        level: silver
        check: "entity.numberedSteps >= 3"
        evidence: "[string(entity.numberedSteps) + ' numbered step(s); want at least 3']"
        fix: "Write at least three numbered steps in SKILL.md so an agent can follow the procedure."
      - name: has-example
        level: silver
        check: "entity.codeFences > 0"
        evidence: "['no fenced code block in SKILL.md']"
        fix: "Add a fenced code block in SKILL.md with a concrete command, input, or output."
      - name: links-resolve
        level: silver
        check: "entity.missingFiles.size() == 0"
        evidence: "entity.missingFiles"
        fix: "Fix or remove the relative links in the evidence. Paths are relative to the file that contains them."
      - name: within-body-budget
        level: silver
        check: "entity.bodyLines <= 500 && entity.estimatedTokens <= 5000"
        evidence: "[string(entity.bodyLines) + ' lines, ~' + string(entity.estimatedTokens) + ' tokens (characters/4)']"
        fix: "Keep the SKILL.md body under 500 lines and about 5000 tokens (characters divided by 4). Move detail into references/."
      - name: portable-paths
        level: silver
        check: "entity.windowsPaths.size() == 0"
        evidence: "entity.windowsPaths"
        fix: "Replace the Windows paths in the evidence with forward-slash paths relative to the skill directory."
      - name: states-boundaries
        level: gold
        check: "entity.boundaryCues.size() > 0"
        evidence: "['no error, limit, or prerequisite cue in the body']"
        fix: "Name a limit, an error path, or a prerequisite in the body (never, do not, limitation, prerequisite, troubleshooting, or on error)."
      - name: has-evals
        level: gold
        check: "entity.evalCases >= 3"
        evidence: "[string(entity.evalCases) + ' cases in evals/evals.json (want at least 3)']"
        fix: "Add at least three eval cases to evals/evals.json (a JSON array, or an object with an evals array). One element is one prompt. Running them is a separate, non-gating step."
      - name: no-hidden-instructions
        level: gold
        check: "entity.hiddenChars == 0"
        evidence: "[string(entity.hiddenChars) + ' hidden or bidi characters']"
        fix: "Remove hidden Unicode from the skill files: zero-width characters, bidi overrides, and Unicode tags."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the hardcoded credentials in the evidence. Refer to a secret by name instead of pasting it into the skill."
      - name: one-level-deep
        level: gold
        check: "entity.linkDepth <= 1 && entity.supportFiles <= 3"
        evidence: "[string(entity.linkDepth) + ' link hops, ' + string(entity.supportFiles) + ' supporting files']"
        fix: "Keep references one hop from SKILL.md and the skill to at most three supporting files. Focused skills outperform large bundles."
    facets: {summary: public, details: public}

  # ── Connectors we ship (docs/design/connector-standards.md) ──────────────────────────────
  # Bronze is "it is a connector an operator can configure". Silver is "a resync and a refresh
  # have the shapes the conformance kit checks, and someone wrote a test". Gold is "CI runs it,
  # and no credential is pasted into the source". Lag, error rate and permission probes need a
  # live portal; they are the meta-catalog's connector-health and are not gated here.
  - name: maintainer-connector
    kind: Connector
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: described
        level: bronze
        check: "entity.descriptionChars > 0 && entity.crateDoc"
        evidence: "entity.descriptionChars == 0 ? ['Cargo.toml has no description'] : (!entity.crateDoc ? ['no crate-level doc comment'] : ['described'])"
        fix: "Add a Cargo.toml description and a //! crate doc that says what the connector emits."
      - name: config-documented
        level: bronze
        check: "entity.configDocumented"
        evidence: "['crate docs name neither TOOLBOX_CONNECTOR_CONFIG nor a CLI flag']"
        fix: "Document the configuration in the crate doc: TOOLBOX_CONNECTOR_CONFIG for an in-image connector, or the --toolbox and --listen flags for a remote one."
      - name: speaks-the-protocol
        level: bronze
        check: "entity.transport == 'stdio' || entity.transport == 'remote' || entity.transport == 'both'"
        evidence: "[entity.transport]"
        fix: "Serve commands with run_stdio (in-image) or run_remote (long-poll). A connector that does neither is not on the control channel."
      - name: names-its-kinds
        level: silver
        check: "entity.documentedKinds.size() > 0 || entity.genericKinds"
        evidence: "['crate docs and source name no record kind']"
        fix: "Name each record kind in the source (record or snapshot_complete) or, for a generic runner, document that kinds come from the job config."
      - name: closes-snapshots
        level: silver
        check: "entity.pushOnly || entity.snapshotComplete"
        evidence: "['resync never sends snapshot_complete']"
        fix: "End every resync kind with snapshot_complete. A push-only connector is exempt: it has no resync."
      - name: reports-missing-ids
        level: silver
        check: "entity.pushOnly || entity.reportsNotFound"
        evidence: "['refresh never sends not_found']"
        fix: "A refresh of an unknown external id must send not_found. A push-only connector is exempt: the provider sends deletes."
      - name: has-tests
        level: silver
        check: "entity.tests >= 1"
        evidence: "[string(entity.tests) + ' #[test] functions']"
        fix: "Add a unit test that does not need the upstream API: a parser, a record shape, or a capabilities case."
      - name: exercised-in-ci
        level: gold
        check: "entity.conformanceMentions > 0 || (entity.pushOnly && entity.ciMentions > 0)"
        evidence: "[string(entity.conformanceMentions) + ' connector-test lines, ' + string(entity.ciMentions) + ' CI files']"
        fix: "Run toolbox connector test on this binary from CI. A push-only connector has no resync for that kit; an acceptance script must start it instead."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the hardcoded credentials in the evidence. Read tokens from the environment or from TOOLBOX_CONNECTOR_CONFIG."
    facets: {summary: public, details: public}

  # ── Direct library dependencies (docs/design/dependency-standards.md) ────────────────────
  # Bronze is "the requirement is bounded and the source is a registry". Silver is "Cargo.lock
  # resolves it to one version". Gold is "a dependency used by more than one crate is declared
  # once, in [workspace.dependencies]". Advisories and licence allow-lists need a database and
  # a policy; they are not gated.
  - name: maintainer-dependency
    kind: Dependency
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: version-bounded
        level: bronze
        check: "!entity.wildcard && entity.requirements.size() > 0"
        evidence: "entity.requirements"
        fix: "Replace the requirement in the evidence with a caret, tilde or exact version. An empty requirement, *, or a bare >= has no ceiling."
      - name: from-a-registry
        level: bronze
        check: "!entity.git"
        evidence: "entity.sources"
        fix: "Depend on a crates.io release. A git dependency is not reproducible from the registry and is not reviewed here."
      - name: locked
        level: silver
        check: "entity.versions.size() > 0"
        evidence: "['not in Cargo.lock']"
        fix: "Run cargo generate-lockfile so Cargo.lock records this dependency. The lockfile is what makes the build reproducible."
      - name: one-version
        level: silver
        check: "entity.versions.size() == 1"
        evidence: "entity.versions"
        fix: "The lockfile resolves this crate to more than one version. Move the direct requirement onto the newer release, or drop the dependency that pulls the other one in."
      - name: shared-is-inherited
        level: gold
        check: "entity.usedBy.size() <= 1 || entity.inherited"
        evidence: "entity.usedBy"
        fix: "Declare this dependency once in [workspace.dependencies] and inherit it. It is used by more than one crate, so two requirements can drift."
    facets: {summary: public, details: public}

  # ── Agent instruction files (docs/design/agents-md-standards.md) ─────────────────────────
  # AGENTS.md is the canonical file. CLAUDE.md and GEMINI.md are aliases: they should point at
  # AGENTS.md rather than become a second copy. The 500-line ceiling is the v1.1 proposal's
  # guideline, not a field the current spec requires. Frontmatter is optional and not required.
  - name: maintainer-agent-doc
    kind: AgentDoc
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: single-source
        level: bronze
        check: "entity.canonical || entity.pointsAtAgents"
        evidence: "entity.canonical || entity.pointsAtAgents ? ['points at AGENTS.md'] : ['alias does not point at AGENTS.md']"
        fix: "Keep instructions in AGENTS.md. An alias such as CLAUDE.md should link to it, not restate a second set of rules."
      - name: links-resolve
        level: bronze
        check: "entity.missingFiles.size() == 0"
        evidence: "entity.missingFiles"
        fix: "Fix or remove the relative links in the evidence. An agent follows them."
      - name: has-commands
        level: silver
        check: "!entity.canonical || entity.commandLines > 0"
        evidence: "[string(entity.commandLines) + ' command lines']"
        fix: "Name the build or test command in AGENTS.md (cargo, npm, pnpm, yarn, pytest, or toolbox). An alias inherits the canonical file's commands."
      - name: within-budget
        level: silver
        check: "entity.lines <= 500"
        evidence: "[string(entity.lines) + ' lines']"
        fix: "Keep the file under 500 lines. Move detail into a linked document. The agents.md v1.1 proposal uses 500 lines as the point where a file should be split."
      - name: names-the-decision-log
        level: gold
        check: "!entity.canonical || entity.mentionsDecisions"
        evidence: "['does not link to decisions.md']"
        fix: "Link the canonical AGENTS.md at the decision log, so an agent edits the log instead of treating this file as the only source of truth."
      - name: checks-run-in-ci
        level: gold
        check: "!entity.canonical || entity.ciMissingCommands.size() == 0"
        evidence: "entity.ciMissingCommands"
        fix: "Run each command in the evidence from a GitHub Actions workflow, or remove it from the check procedure. Commands that appear only in a markdown table are the track index and are not required."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the credential in the evidence. An instruction file is loaded into the agent's prompt."
      - name: no-hidden-instructions
        level: gold
        check: "entity.hiddenChars == 0"
        evidence: "[string(entity.hiddenChars) + ' hidden characters']"
        fix: "Remove zero-width and bidi characters. They are invisible to a reviewer and visible to a model."
    facets: {summary: public, details: public}

  # ── npm manifests (docs/design/package-standards.md) ─────────────────────────────────────
  # Private packages are applications: npm will not publish them, and a lockfile is the pin.
  # A licence field is not required (Q1). Advisory databases are not a gate.
  - name: maintainer-package
    kind: PackageJson
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: named
        level: bronze
        check: "entity.name != ''"
        evidence: "entity.name != '' ? [entity.name] : ['no name']"
        fix: "Set name in package.json. npm uses it as the package identity, including when the package is private."
      - name: publish-intent
        level: bronze
        check: "entity.private || entity.version != ''"
        evidence: "['public package with no version']"
        fix: "Set private to true for a package this repository does not publish, or set version before publishing. npm refuses to publish a private package."
      - name: version-bounded
        level: bronze
        check: "entity.wildcardRanges.size() == 0"
        evidence: "entity.wildcardRanges"
        fix: "Replace the ranges in the evidence. A star, x, latest or unbounded minimum can move without a review. Caret and tilde ranges stay bounded."
      - name: from-a-registry
        level: bronze
        check: "entity.gitRanges.size() == 0"
        evidence: "entity.gitRanges"
        fix: "Depend on a registry version. The evidence names a git URL or a tarball URL instead of a version the registry serves."
      - name: locked
        level: silver
        check: "entity.lockfile != ''"
        evidence: "entity.lockfile != '' ? [entity.lockfile] : ['no lockfile beside package.json']"
        fix: "Commit a lockfile beside package.json. package-lock.json records an integrity hash for every installed package."
      - name: has-a-check
        level: silver
        check: "entity.checkScripts > 0"
        evidence: "[string(entity.checkScripts) + ' check scripts']"
        fix: "Add a test, build, check or typecheck script. npm's guidance is to keep a smoke test, and this repository runs build and check in CI."
      - name: described
        level: gold
        check: "entity.descriptionChars > 0"
        evidence: "['no description']"
        fix: "Add a description. npm's package.json document says to put a description in it, so a reader can tell packages apart."
      - name: engines-declared
        level: gold
        check: "entity.engines"
        evidence: "['engines.node is not set']"
        fix: "Set engines.node to the Node version this package is developed with. That is the field npm documents for the runtime."
      - name: ci-installs-from-the-lockfile
        level: gold
        check: "!entity.ciUsesInstall"
        evidence: "['CI runs npm install, which can update the lockfile']"
        fix: "Change this package's CI install from npm install to npm ci. npm ci installs the lockfile as written and does not rewrite it."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the credential in the evidence. The manifest is committed and read by the installer."
    facets: {summary: public, details: public}

  # ── JSON Schema documents (docs/design/schema-standards.md) ──────────────────────────────
  # The binary compiles these with Draft 2020-12 and does not fetch `$ref`s, so a schema that
  # names another dialect or a remote schema is not the contract the server runs.
  - name: maintainer-schema
    kind: JsonSchema
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: draft-2020-12
        level: bronze
        check: "entity.draft202012"
        evidence: "entity.dialect != '' ? [entity.dialect] : ['no $schema']"
        fix: "Set $schema to https://json-schema.org/draft/2020-12/schema. The binary compiles schemas as that draft and no other."
      - name: has-id
        level: bronze
        check: "entity.schemaId.startsWith('https://')"
        evidence: "entity.schemaId != '' ? [entity.schemaId] : ['no $id']"
        fix: "Set $id to an absolute https URI. That is the schema's canonical identity in JSON Schema 2020-12."
      - name: described
        level: bronze
        check: "entity.descriptionChars > 0"
        evidence: "['no description']"
        fix: "Add a root description saying which contract this document is. Readers and agents meet the schema before the code."
      - name: titled
        level: silver
        check: "entity.titleChars > 0"
        evidence: "['no title']"
        fix: "Add a title. JSON Schema defines title as the short name of the document."
      - name: wired-in
        level: silver
        check: "entity.wired"
        evidence: "['not compiled by schema.rs or applied by the reference validator']"
        fix: "Compile the document from crates/toolbox-model/src/schema.rs, or apply it from the reference portal validator. A schema file nothing loads is not a contract."
      - name: local-refs
        level: gold
        check: "entity.externalRefs.size() == 0"
        evidence: "entity.externalRefs"
        fix: "Point $ref at a fragment in this file. The compiler embeds the document and does not fetch a remote schema."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the credential in the evidence. A schema is compiled into the binary and published with the repository."
    facets: {summary: public, details: public}

  # ── Examples and experiments (docs/design/example-standards.md) ──────────────────────────
  # A write-up is useful when a reader can follow its links and run the check it names.
  # The reference portal's expected/ outputs stay the oracle; this scorecard does not regenerate them.
  - name: maintainer-example
    kind: Example
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: has-a-heading
        level: bronze
        check: "entity.title != ''"
        evidence: "['no heading']"
        fix: "Start the write-up with a level-1 heading that names the example."
      - name: links-resolve
        level: bronze
        check: "entity.missingFiles.size() == 0"
        evidence: "entity.missingFiles"
        fix: "Fix or remove the relative links in the evidence. An agent follows them to the files the example depends on."
      - name: says-how-to-check
        level: silver
        check: "entity.commandLines > 0"
        evidence: "[string(entity.commandLines) + ' command lines']"
        fix: "Name the command that checks this example (toolbox, cargo, npm, python, fga, or a ./run script). A reader should be able to reproduce it."
      - name: cites-the-design
        level: gold
        check: "entity.citesDesign"
        evidence: "['does not point at a design doc or a decision']"
        fix: "Link the write-up at the design doc or the decision it demonstrates, so the example is not a second source of truth."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the credential in the evidence. An example is copied and read by agents."
    facets: {summary: public, details: public}

  # ── Agent plugins (docs/design/plugin-standards.md) ──────────────────────────────────────
  # The marketplace installs the package. Skills inside it are scored by maintainer-skill.
  - name: maintainer-plugin
    kind: Plugin
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: manifest-valid
        level: bronze
        check: "entity.schemaOk && entity.nameOk && entity.descriptionChars > 0"
        evidence: "[!entity.schemaOk ? 'schema is not Agent Plugins 1.0.0' : (!entity.nameOk ? 'name ' + entity.name : 'description is empty')]"
        fix: "Point $schema at the 1.0.0 plugin schema, use a name of 1–64 lowercase letters, digits, dots and hyphens, and write a description."
      - name: portable-components
        level: bronze
        check: "entity.misplacedSkills.size() == 0"
        evidence: "entity.misplacedSkills"
        fix: "Move each skill to skills/<name>/SKILL.md. Client-specific files go under a reverse-domain directory, not beside the manifest."
      - name: mcp-declared
        level: silver
        check: "entity.hasMcp && entity.mcpSchemaOk"
        evidence: "[!entity.hasMcp ? 'no mcp.json' : 'mcp.json schema is not Agent Plugins 1.0.0']"
        fix: "Add mcp.json next to plugin.json with the 1.0.0 mcp schema. A tool that exists only in a vendor config is a harness lock-in."
      - name: stdio-command
        level: silver
        check: "entity.commandToken"
        evidence: "['stdio command is not a single token']"
        fix: "Set command to one token (./bin/toolbox-mcp or ${PLUGIN_ROOT}/bin/tool). Do not use a shell string."
      - name: no-secret-headers
        level: gold
        check: "entity.headerSecrets.size() == 0"
        evidence: "entity.headerSecrets"
        fix: "Remove the secret in the evidence. MCP authorization is client-managed. Headers must not carry credentials."
      - name: paths-stay-inside
        level: gold
        check: "entity.pathEscapes.size() == 0"
        evidence: "entity.pathEscapes"
        fix: "Drop the .. segments in the evidence. Plugin paths stay inside the plugin root."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the credential in the evidence from plugin.json or mcp.json."
    facets: {summary: public, details: public}

  # ── Supply chain config (docs/design/supply-chain-standards.md) ──────────────────────────
  # The files that turn GitHub Advanced Security on. Alert counts need the API and are not gated.
  # This repository has none of the three bronze files, so the live entity is none until they exist.
  - name: maintainer-supply-chain
    kind: Repository
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: dependabot
        level: bronze
        check: "entity.dependabotGaps.size() == 0"
        evidence: "entity.dependabotGaps"
        fix: "Add .github/dependabot.yml updates for the ecosystems in the evidence (cargo, npm, github-actions)."
      - name: code-scanning
        level: bronze
        check: "entity.codeScanning"
        evidence: "['no workflow uses github/codeql-action']"
        fix: "Add a code scanning workflow that uses github/codeql-action. Alert counts stay a report, not a gate."
      - name: security-policy
        level: bronze
        check: "entity.securityPolicy"
        evidence: "['no SECURITY.md']"
        fix: "Add SECURITY.md at the repository root, under .github/, or under docs/, with how to report a vulnerability."
      - name: workflows-have-owners
        level: silver
        check: "entity.workflowOwners"
        evidence: "['no CODEOWNERS rule covers .github/workflows/ci.yml']"
        fix: "Add a CODEOWNERS rule that covers .github/workflows (a catch-all * does). Workflow changes should have an owner."
      - name: code-scanning-pinned
        level: gold
        check: "entity.codeScanningPinned"
        evidence: "['code scanning action is missing or not pinned to a commit']"
        fix: "Pin github/codeql-action to a 40-character commit, the same way other actions are pinned."
    facets: {summary: public, details: public}

  # ── Repository level (docs/design/repo-level.md) ─────────────────────────────────────────
  # The level is the lowest constituent. A weighted 0–10 is not the gate. `cards` is bound on a
  # second pass; fixture samples under /demo/ are not constituents, so the ladder fixtures do
  # not drag this score to none.
  - name: maintainer-repo
    kind: Repository
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: constituents-at-least-bronze
        level: bronze
        check: "cards.all(c, c.rank >= 1)"
        evidence: "cards.filter(c, c.rank < 1).map(c, c.name + ' is ' + c.level)"
        fix: "The repository level is the lowest constituent scorecard. Raise each one in the evidence to bronze."
      - name: constituents-at-least-silver
        level: silver
        check: "cards.all(c, c.rank >= 2)"
        evidence: "cards.filter(c, c.rank < 2).map(c, c.name + ' is ' + c.level)"
        fix: "Raise each constituent in the evidence to silver. A card whose highest level is bronze caps the repository at bronze."
      - name: constituents-at-least-gold
        level: gold
        check: "cards.all(c, c.rank >= 3)"
        evidence: "cards.filter(c, c.rank < 3).map(c, c.name + ' is ' + c.level)"
        fix: "Raise each constituent in the evidence to gold."
    facets: {summary: public, details: public}

  # ── Scorecards for scorecards (docs/design/scorecards-for-scorecards.md) ─────────────────
  # They score every rule and scorecard of this portal, the starter and the reference portal —
  # themselves included, so there is no further level. Only deterministic facts (manifest, CEL,
  # tests, fixtures) are scored; live outcomes are shown, not scored.
  - name: meta-rule
    kind: Rule
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new rule or scorecard must be tested and explained from day one
    rules:
      - name: explains-fix
        level: bronze
        check: "entity.fixWords >= 5"
        evidence: "['fix has ' + string(entity.fixWords) + ' words']"
        fix: "Write a fix an agent can act on: what to change, and where."
      - name: tested
        level: bronze
        check: "entity.tested"
        evidence: "['no expectation in the portal tests names ' + entity.scorecard + '/' + entity.name]"
        fix: "Add an expectation that pins the rule: score('<card>', '<entity>').rules['<rule>'] == 'fail' (and one that passes)."
      - name: decided-on-fixtures
        level: bronze
        check: "entity.fixture.pass + entity.fixture.fail > 0"
        evidence: "[string(entity.fixture.unknown) + ' unknown, no pass or fail on the fixtures']"
        fix: "Add fixture records the rule applies to, so it evaluates in tests."
      - name: both-outcomes-on-fixtures
        level: silver
        check: "entity.fixture.pass > 0 && entity.fixture.fail > 0"
        evidence: "['fixtures: ' + string(entity.fixture.pass) + ' pass, ' + string(entity.fixture.fail) + ' fail']"
        fix: "Give the fixtures one entity that passes and one that fails, so both paths (and the evidence) are exercised."
      - name: shows-evidence
        level: silver
        check: "entity.hasEvidence || entity.check.nodes <= 4"
        evidence: "['the check has ' + string(entity.check.nodes) + ' CEL nodes and no evidence expression']"
        fix: "Add `evidence:` naming the items that fail, so agents and people know what to change."
      - name: no-nested-loops
        level: silver
        check: "entity.check.loops <= 1 && (!has(entity.evidence) || entity.evidence.loops <= 1)"
        evidence: "['check loops ' + string(entity.check.loops) + (has(entity.evidence) ? ', evidence loops ' + string(entity.evidence.loops) : '')]"
        fix: "Avoid a comprehension inside a comprehension: compute the inner list in the connector or a computed field."
      - name: readable
        level: gold
        check: "entity.check.nodes <= 30"
        evidence: "['the check has ' + string(entity.check.nodes) + ' CEL nodes (30 or fewer reads at a glance)']"
        fix: "Move logic into a computed field or the connector, and keep the rule a short comparison."
      - name: always-explains
        level: gold
        check: "entity.hasEvidence"
        evidence: "['no evidence expression']"
        fix: "Add `evidence:` even for simple checks: it is what an agent reads first."
    facets: {summary: public, details: public}

  - name: meta-scorecard
    kind: Scorecard
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new rule or scorecard must be tested and explained from day one
    rules:
      - name: tested
        level: bronze
        check: "entity.tested"
        evidence: "['no expectation names score(' + entity.name + ', …)']"
        fix: "Add at least one expectation for the scorecard in the portal's tests."
      - name: every-level-has-rules
        level: bronze
        check: "entity.levels.all(l, l in entity.rulesPerLevel && entity.rulesPerLevel[l] > 0)"
        evidence: "entity.levels.filter(l, !(l in entity.rulesPerLevel) || entity.rulesPerLevel[l] == 0)"
        fix: "Give every level at least one rule, or drop the level."
      - name: fixtures-show-the-ladder
        level: silver
        check: "entity.fixtureLevels.size() >= 2"
        evidence: "entity.fixtureLevels.map(l, 'fixtures reach only ' + l)"
        fix: "Make the fixtures reach at least two levels (e.g. one entity at none, one at bronze or above)."
      - name: every-rule-tested
        level: gold
        check: "entity.untestedRules.size() == 0"
        evidence: "entity.untestedRules"
        fix: "Add an expectation for each untested rule."
    facets: {summary: public, details: public}

  # ── The rest of the model: kinds, fields, connectors (§5) ─────────────────────────────────
  - name: meta-kind
    kind: Kind
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new kind must be in the fixtures and the tests
    rules:
      - name: in-fixtures
        level: bronze
        check: "entity.fixtureEntities > 0"
        evidence: "['no fixture record maps to ' + entity.name + ' in portal ' + entity.portal]"
        fix: "Add fixture records that map to the kind, so its map rules and computed fields run in tests."
      - name: tested
        level: bronze
        check: "entity.tested"
        evidence: "['no test expectation names an entity of ' + entity.name]"
        fix: "Add a test expectation about one of the kind's fixture entities (a field, a relation or a score)."
      - name: described
        level: silver
        check: "entity.described"
        evidence: "['kind ' + entity.name + ' has no description']"
        fix: "Give the kind a `description:` saying what one entity is; agents read it before any field."
      - name: fields-described
        level: gold
        check: "entity.undescribedFields.size() == 0"
        evidence: "entity.undescribedFields"
        fix: "Give each listed field a `description:`: what it means, its unit, and where it comes from."
    facets: {summary: public, details: public}

  - name: meta-field
    kind: Field
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new field must have a value somewhere in the fixtures
    rules:
      - name: populated-in-fixtures
        level: bronze
        check: "entity.fixtureWithValue > 0"
        evidence: "['none of ' + string(entity.fixtureEntities) + ' fixture ' + entity.kind + ' entities has a value']"
        fix: "Give at least one fixture record a value for the field, so its mapping (or computation) is exercised."
      - name: described
        level: silver
        check: "entity.described"
        evidence: "[entity.kind + '.' + entity.name + ' has no description']"
        fix: "Add a `description:` to the field: what it means, its unit, and where it comes from."
      - name: has-shape
        level: gold
        check: "!entity.opaque"
        evidence: "[entity.kind + '.' + entity.name + ' is ' + entity.fieldType + ' with no declared shape']"
        fix: "Replace the object with typed fields (or a list of strings), so CEL, validation and agents know its shape."
    facets: {summary: public, details: public}

  - name: meta-connector
    kind: PortalConnector
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new connector needs fixtures and a mapping for every record
    rules:
      - name: records-mapped
        level: bronze
        check: "entity.unmapped.size() == 0"
        evidence: "entity.unmapped"
        fix: "Map each listed record kind to a kind (`map: - from: <connector>/<record>`), or stop declaring it."
      - name: has-fixtures
        level: bronze
        check: "entity.fixtureRecords > 0"
        evidence: "['no fixtures/' + entity.name + '.ndjson in portal ' + entity.portal]"
        fix: "Add fixtures/<connector>.ndjson with representative records, so tests run without the live system."
      - name: freshness-declared
        level: silver
        check: "entity.withoutFreshness.size() == 0"
        evidence: "entity.withoutFreshness"
        fix: "Declare `freshness:` for each listed record kind, so stale data shows as stale rather than current."
      - name: refreshable
        level: gold
        check: "entity.records.all(r, r in entity.refreshable)"
        evidence: "entity.records.filter(r, !(r in entity.refreshable))"
        fix: "Support refresh by external id for each listed record kind, so an agent can see its fix land."
    facets: {summary: public, details: public}

  # ── Judgement: coding agents' assessments against the rubrics below (D79) ──────────────────
  # Advisory: reported, never gating. An assessment goes stale when its subject changes, and the
  # agent that changed it should re-assess — but a stale review must not block the change.
  - name: review-rule
    kind: Rule
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    appliesTo: "entity.portal == 'toolbox'"  # our own rules; the starter and reference are examples
    rules:
      - name: assessed
        level: bronze
        check: "entity.reviewState == 'fresh'"
        evidence: "[entity.reviewState == 'stale' ? 'the rule changed since it was assessed' : 'not assessed against rule-quality']"
        fix: "Run `toolbox assess brief <rule id> --portal portal`, have your agent write the assessment file it names, then `toolbox assess check portal`."
      - name: passes-review
        level: silver
        check: "entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewFailing : ['no current assessment']"
        fix: "Act on the failing criteria's suggestions in the assessment (portal/assessments/), then re-assess."
      - name: no-doubts
        level: gold
        check: "entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current assessment']"
        fix: "Resolve what the assessor was unsure of: usually a missing source for a threshold or an unstated intent."
    facets: {summary: public, details: public}

  - name: review-scorecard
    kind: Scorecard
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    appliesTo: "entity.portal == 'toolbox'"
    rules:
      - name: assessed
        level: bronze
        check: "entity.reviewState == 'fresh'"
        evidence: "[entity.reviewState == 'stale' ? 'the scorecard changed since it was assessed' : 'not assessed against scorecard-quality']"
        fix: "Run `toolbox assess brief <scorecard id> --portal portal`, have your agent write the assessment file it names, then `toolbox assess check portal`."
      - name: passes-review
        level: silver
        check: "entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewFailing : ['no current assessment']"
        fix: "Act on the failing criteria's suggestions in the assessment (portal/assessments/), then re-assess."
      - name: no-doubts
        level: gold
        check: "entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current assessment']"
        fix: "Resolve what the assessor was unsure of: usually a level whose purpose isn't written down."
    facets: {summary: public, details: public}

  - name: review-crate
    kind: Crate
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    appliesTo: "entity.codeLines >= 50"
    rules:
      - name: assessed
        level: bronze
        check: "entity.reviewState == 'fresh'"
        evidence: "[entity.reviewState == 'stale' ? 'the crate\\'s sources changed since it was assessed' : 'not assessed against crate-design']"
        fix: "Run `toolbox assess brief crate:<name> --portal portal`, have your agent write the assessment file it names, then `toolbox assess check portal`."
      - name: passes-review
        level: silver
        check: "entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewFailing : ['no current assessment']"
        fix: "Act on the failing criteria's suggestions in the assessment (portal/assessments/), then re-assess."
      - name: no-doubts
        level: gold
        check: "entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current assessment']"
        fix: "Resolve what the assessor was unsure of, or record the open question in docs/decisions.md and link it."
    facets: {summary: public, details: public}

  # ── Assessments and rubrics are standards too (D80) ──────────────────────────────────────
  # Deterministic, so ratcheted: what any assessment must contain to be worth reading.
  - name: meta-assessment
    kind: Assessment
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new assessment must name its assessor and suggest fixes
    rules:
      - name: suggests-fixes
        level: bronze
        check: "entity.unsuggested.size() == 0"
        evidence: "entity.unsuggested"
        fix: "Add a `suggestion:` to each listed fail or unsure verdict: the change that would make it pass."
      - name: assessor-named
        level: bronze
        check: "has(entity.assessorName) && entity.assessorName.size() > 0"
        evidence: "['assessor.name is empty']"
        fix: "Set `assessor.name` to the agent harness or person who made the assessment."
      - name: cites-for-findings
        level: silver
        check: "entity.uncited.filter(c, c in entity.failing || c in entity.unsure).size() == 0"
        evidence: "entity.uncited.filter(c, c in entity.failing || c in entity.unsure)"
        fix: "Cite what each listed fail or unsure reason rests on: a file path, a decision id (D71), a section (§4) or a number."
      - name: cites-everything
        level: gold
        check: "entity.uncited.size() == 0"
        evidence: "entity.uncited"
        fix: "Cite a source in every reason, passes included, so a reviewer can check the verdict."
    facets: {summary: public, details: public}

  - name: meta-rubric
    kind: Rubric
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new rubric must be described and used once
    rules:
      - name: described
        level: bronze
        check: "entity.described"
        evidence: "['rubric ' + entity.name + ' has no description']"
        fix: "Describe what the rubric judges and which sources the assessor should read."
      - name: in-use
        level: bronze
        check: "entity.assessments > 0"
        evidence: "['no assessment uses ' + entity.name]"
        fix: "Assess one entity with it (`toolbox assess brief <id> --rubric <name>`), or remove the rubric."
      - name: guided
        level: silver
        check: "entity.unguided.size() == 0"
        evidence: "entity.unguided"
        fix: "Give each listed criterion `guidance:` saying what counts as fail, so assessors agree."
      - name: discriminates
        level: gold
        check: "entity.assessments >= 3 && entity.alwaysPass.size() == 0"
        evidence: "entity.assessments < 3 ? ['only ' + string(entity.assessments) + ' assessment(s); 3 show whether criteria discriminate'] : entity.alwaysPass.map(c, c + ' passed in every assessment')"
        fix: "Sharpen or drop a criterion that everything passes; a question nothing fails asks nothing."
    facets: {summary: public, details: public}

  # Judgement of judgement. Stops here: reviews made with assessment-quality are not reviewed.
  - name: review-assessment
    kind: Assessment
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    appliesTo: "entity.rubric != 'assessment-quality'"
    rules:
      - name: assessed
        level: bronze
        check: "entity.reviewState == 'fresh'"
        evidence: "[entity.reviewState == 'stale' ? 'the assessment changed since it was reviewed' : 'not reviewed against assessment-quality']"
        fix: "Run `toolbox assess brief <assessment id> --portal portal`; a different agent or person should review it."
      - name: passes-review
        level: silver
        check: "entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewFailing : ['no current review']"
        fix: "Revise the assessment where the review found it unsupported or incomplete, then have it reviewed again."
      - name: no-doubts
        level: gold
        check: "entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current review']"
        fix: "Resolve what the reviewer was unsure of, usually by citing the source a verdict rests on."
    facets: {summary: public, details: public}

  # ── The SDLCs themselves (D87): can each layer's stages be carried out, and by an agent? ──
  - name: sdlc-stage
    kind: SdlcStage
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: none}      # a newly identified stage may start missing; that is the point
    rules:
      - name: has-exit-criterion
        level: bronze
        check: "entity.exitCriterion.size() >= 20"
        evidence: "['exit criterion: ' + entity.exitCriterion]"
        fix: "Write the exit criterion as something checkable: the command that passes, or the artifact that exists."
      - name: documented
        level: bronze
        check: "entity.docs.size() > 0 && entity.missingPaths.size() == 0"
        evidence: "entity.docs.size() == 0 ? ['no doc describes the stage'] : entity.missingPaths.map(p, p + ' does not exist')"
        fix: "Point `docs:` (and `checks:`) in portal/sdlc/stages/<layer>.yaml at files that exist; write the doc if it doesn't."
      - name: agent-operable
        level: silver
        check: "entity.commands.size() > 0"
        evidence: "['no command an agent can run carries out ' + entity.layer + '/' + entity.name]"
        fix: "Give the stage a command (a toolbox subcommand, script or make target) and list it under `commands:`."
      - name: automated
        level: silver
        check: "entity.checks.size() > 0"
        evidence: "['nothing in CI or a script verifies ' + entity.layer + '/' + entity.name]"
        fix: "Add a CI step, acceptance script or test that proves the exit criterion, and list it under `checks:`."
      - name: built
        level: gold
        check: "entity.status == 'built' && entity.gaps.size() == 0"
        evidence: "entity.gaps.size() > 0 ? entity.gaps : ['status is ' + entity.status]"
        fix: "Close the listed gaps, then set `status: built` and empty `gaps:`."
    facets: {summary: public, details: public}

  - name: sdlc-layer
    kind: SdlcLayer
    owner: group:maintainers
    levels: [bronze, silver, gold]
    rules:
      - name: stages-declared
        level: bronze
        check: "entity.stages.all(s, s in entity.definedStages)"
        evidence: "entity.stages.filter(s, !(s in entity.definedStages))"
        fix: "Declare each listed stage in portal/sdlc/stages/<layer>.yaml, even if its status is missing."
      - name: nothing-missing
        level: silver
        check: "entity.stagesMissing.size() == 0"
        evidence: "entity.stagesMissing"
        fix: "Give each missing stage at least a design and a command; see the stage's gaps."
      - name: every-stage-built
        level: gold
        check: "entity.stagesNotBuilt.size() == 0"
        evidence: "entity.stagesNotBuilt"
        fix: "Raise each listed stage to built (see sdlc-stage for what each lacks)."
    facets: {summary: public, details: public}

  - name: review-sdlc-stage
    kind: SdlcStage
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    rules:
      - name: assessed
        level: bronze
        check: "entity.reviewState == 'fresh'"
        evidence: "[entity.reviewState == 'stale' ? 'the stage changed since it was assessed' : 'not assessed against sdlc-stage-quality']"
        fix: "Run `toolbox assess brief sdlc-stage:<layer>/<stage> --portal portal`, have your agent write the assessment, then `toolbox assess check portal`."
      - name: passes-review
        level: silver
        check: "entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewFailing : ['no current assessment']"
        fix: "Act on the failing criteria's suggestions in the assessment (portal/assessments/), then re-assess."
      - name: no-doubts
        level: gold
        check: "entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0"
        evidence: "entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current assessment']"
        fix: "Resolve what the assessor was unsure of, usually a missing measurement or an unstated exit criterion."
    facets: {summary: public, details: public}

rubrics:
  # What a coding agent judges, given `toolbox assess brief` (or the assessment_brief MCP tool).
  # Criteria are questions a deterministic check can't answer; anything a check can answer belongs
  # in a scorecard rule instead (docs/design/scorecards-for-scorecards.md §6).
  - name: assessment-quality
    kind: Assessment
    description: "Is this assessment trustworthy? Read the assessment, then the sources its reasons cite, and the entity it judges (toolbox get <entity>). Review someone else's assessment, not your own."
    criteria:
      - name: supported
        question: Is every verdict supported by the sources its reason cites?
        guidance: Open each cited file, decision or number. Fail when a cited source doesn't say what the reason claims.
      - name: complete
        question: Did the assessment get every criterion right, missing no failure the sources show?
        guidance: Fail and name the criterion that should have failed or been unsure, with the evidence.
      - name: reproducible
        question: Would a second assessor, reading the same sources, reach the same verdicts?
        guidance: Unsure when a verdict rests on taste rather than on something the sources state.
      - name: actionable
        question: Would following the suggestions change the verdicts they are attached to?
        guidance: Fail when a suggestion improves something else (another rule, the scorecard) but leaves this entity's verdict as it is.
  - name: sdlc-stage-quality
    kind: SdlcStage
    description: "Can this SDLC stage be carried out well, by an agent? Read the stage in portal/sdlc/stages/, its docs and checks, and try its commands."
    criteria:
      - name: executable-exit
        question: Is the exit criterion checked by a command or CI step, not by judgement?
        guidance: Fail when nothing in `checks:` would fail if the exit criterion were not met.
      - name: agent-can-complete
        question: Could an agent complete the stage using only the listed commands, Toolbox's CLI or MCP, and the docs?
        guidance: Fail and name the step that needs a person, a secret or tribal knowledge.
      - name: reuses-artifacts
        question: Does the stage reuse released, pinned artifacts instead of rebuilding or reinstalling everything from source?
        guidance: Fail when consumers compile Toolbox or install tools by hand; pass when nothing is built or installed in the stage.
      - name: decoupled-from-core
        question: Can someone outside this repository's maintainers carry out the stage (an operator or package author), or does it need a change to Toolbox's own crates?
        guidance: Fail when the stage requires adding a crate, a builtin or a schema change to this repository.
  - name: rule-quality
    kind: Rule
    description: Is this rule a good standard? Read its check, evidence and fix in the portal's toolbox.yaml, its tests, and the design doc its scorecard cites.
    criteria:
      - name: measures-intent
        question: Does passing the check mean what the rule's name and fix say it means, rather than a proxy that can drift from it?
        guidance: Fail when an entity could pass while missing the intent (e.g. any test counts as tested), or fail while meeting it.
      - name: hard-to-game
        question: Is the cheapest way to pass the rule to do the right thing?
        guidance: Fail when an empty doc comment, a renamed item, a trivial test or a suppression would pass it.
      - name: fix-leads-to-pass
        question: Would following the fix text alone, with the evidence, make the rule pass?
        guidance: Fail when the fix is vague, names the wrong place, or the rule needs data the fix doesn't mention.
      - name: threshold-justified
        question: Are its thresholds and its level (bronze, silver or gold) justified by a design doc, a decision or evidence?
        guidance: Pass for rules with no threshold. Cite the source; unsure when no source states the number.
  - name: scorecard-quality
    kind: Scorecard
    description: Is this scorecard a good standard? Read it in the portal's toolbox.yaml with the doc that motivates it (portal/README.md says which layer it raises).
    criteria:
      - name: one-concern
        question: Does it measure one concern for one audience (one SDLC layer), so its level means one thing?
        guidance: Fail when its rules serve two audiences or layers (e.g. security and speed); name the split.
      - name: levels-are-a-ladder
        question: Does each level build on the one below, with bronze reachable now and gold worth reaching?
        guidance: Fail when a level mixes unrelated rules or a gold rule is cheaper than a bronze one.
      - name: no-obvious-gap
        question: Is there no obvious standard for this concern that the scorecard leaves out?
        guidance: Fail and name the missing rule; compare with the research its design doc cites.
      - name: actionable
        question: Can an agent raise an entity one level using only the scorecard's fixes, evidence and the portal's tools?
        guidance: Fail when a rule's fix names no place to change, or it has no evidence; try raising one entity yourself.
  - name: crate-design
    kind: Crate
    description: Is this crate well designed for its place in Toolbox? Read its crate docs, public API and tests, and docs/v1-spec.md §4.
    criteria:
      - name: one-responsibility
        question: Does the crate do one thing, stated in its crate docs, that matches its role in docs/v1-spec.md §4?
        guidance: Fail when the crate docs are missing, stale, or describe several unrelated jobs.
      - name: small-contract
        question: Do other crates use it through a small, documented public API rather than its internals?
        guidance: Search other crates for `use <crate>::`; fail when they reach internals or receive third-party types.
      - name: replaceable-defaults
        question: If it wraps a default (cel-rust, OpenFGA, DBOS, Postgres, React), could that default be swapped behind a Toolbox-owned contract (charter goal 3)?
        guidance: Pass when it wraps no third-party default.
      - name: tests-match-risk
        question: Are its riskiest paths (parsing, authorization, persistence, protocol handling) tested, not only the easy ones?
        guidance: List the riskiest paths first, then find a test for each; unsure when coverage is only indirect.

mcp:
  instructions: >-
    Toolbox for Toolbox: the catalogue of Toolbox's own crates, docs, scripts, CLI commands and MCP
    tools, agent skills, first-party connectors, direct Cargo dependencies, agent instruction files, npm manifests, JSON Schemas, example write-ups, agent plugins and the repository rollup, scored against the maintainer, operator and user SDLC standards. To raise the bar, pick
    a failing rule with scorecard_status, read the evidence with explain (rule) or get: Crate
    undocumented, longFunctions, complexFunctions, clippy.messages, tests.output; Doc brokenLinks,
    counts; Command undocumentedArgs, documentedIn, exercisedBy; McpTool undescribedProperties,
    documentedIn, exercisedBy, viaCli; Skill frontmatterErrors, triggerCues, pronouns, missingFiles,
    secretHits, boundaryCues, evalCases; Connector documentedKinds, transport, tests, conformanceMentions, secretHits; Dependency requirements, versions, sources, usedBy; AgentDoc missingFiles, commandLines, ciMissingCommands, secretHits, hiddenChars; PackageJson wildcardRanges, gitRanges, lockfile, checkScripts, ciUsesInstall; JsonSchema dialect, schemaId, externalRefs; Example missingFiles, commandLines; Plugin misplacedSkills, headerSecrets, pathEscapes, commandToken; Repository dependabotGaps, codeScanning, securityPolicy, workflowOwners. Change the code, refresh_entity, and check the score again.
    Contract tests count when a test or script contains a tools/call body naming the tool.

tests: [tests/standards.test.yaml]
