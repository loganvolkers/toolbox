# Toolbox for Toolbox: the portal Toolbox maintainers run on their own repository
# (docs/design/toolbox-for-toolbox.md). It catalogues our crates, docs, scripts and tests, the CLI
# commands and MCP tools we promise, and scores each against the standard of one SDLC layer
# (docs/sdlc.md). It runs locally (`scripts/self-portal.sh`): no Postgres, no OpenFGA, no network.
apiVersion: toolbox.dev/v1alpha1

portal:
  name: toolbox
  title: Toolbox for Toolbox
  owner: group:maintainers
  toolbox: "0.1"

policies:
  # Logs and reviews whose past entries are never rewritten (AGENTS.md), so wording rules
  # introduced later don't apply to them.
  historicalDocs:
    - docs/decisions.md
    - docs/research-log.md
    - docs/red-team.md
    - docs/principal-review.md
    - docs/adversarial-critique.md
    - docs/technology-critique.md
    - docs/research.md
    - docs/ocean.md

connectors:
  - name: workspace
    package: builtin:workspace             # reads files; fast, so it resyncs often
    runtime: in-image
    config:
      root: "."
      docs: ["*.md", "docs/**/*.md", "examples/*/README.md", "experiments/*/README.md", "plugins/**/*.md", "portal/*.md", "actions/*/README.md"]
      files: ["scripts/*", "crates/*/tests/*.rs", "examples/reference-portal/tools/*.py"]
      captures:
        # `toolbox get …`, `"$T/toolbox" serve …`, the acceptance scripts' `ask owner …`
        commands: '(?:\btoolbox"?|\bask)\s+((?:connector|token)\s+[a-z]+|[a-z][a-z-]*)'
        # MCP tools/call bodies: {"name": "owner_of", …}
        tools: '"name"\s*:\s*"([a-z][a-z_]*)"'
      counts:
        sdlc: '\bSDLC\b'
        # A named layer (`maintainer SDLC`, `*operator* SDLC`), the layer model itself, or a quoted mention
        layeredSdlc: '(?i:maintainer|operator|user|agent|three|portal)[*_ ’''-]*s?[*_]*\s+SDLC\b|\bSDLC\s+(?:layers?\b|has\b|in Toolbox)|"SDLC"'
      # GitHub Actions workflows and action metadata (docs/design/github-actions-standards.md)
      workflows: [".github/workflows/*.y*ml", "actions/*/action.y*ml"]
      # Agent skills (docs/design/skill-standards.md). The directory is the skill; SKILL.md is its manifest.
      skills: ["plugins/**/SKILL.md", "skills/**/SKILL.md"]
      # First-party connectors (docs/design/connector-standards.md). One record per crate manifest.
      connectors: ["crates/toolbox-connector-*/Cargo.toml"]
    records: [crate, doc, file, workflow, action-ref, skill, connector]
    refresh: {crate: [external_ids], doc: [external_ids], file: [external_ids], skill: [external_ids], connector: [external_ids]}
    freshness: {crate: 5m, doc: 5m, file: 5m, skill: 5m, connector: 5m}
  - name: runner
    package: builtin:runner                # executes things; slow, so it's refreshed per entity
    runtime: in-image
    config:
      root: "."
      jobs:
        - {name: test, per: crate, command: [cargo, test, -q, -p, "{crate}"], parse: cargo-test}
        - {name: clippy, per: crate, command: [cargo, clippy, -q, -p, "{crate}", --all-targets, --message-format=json], parse: clippy}
        # MCP calls the contract tests actually make (TOOLBOX_MCP_TRACE), not just name (F9)
        - name: mcp-calls
          command: [sh, -c, 'TOOLBOX_MCP_TRACE="$PWD/target/mcp-trace.ndjson" cargo test -q -p toolbox-api --test mcp']
          parse: tally
          file: target/mcp-trace.ndjson
          key: tool
    records: [test, clippy, mcp-calls]
    refresh: {test: [external_ids], clippy: [external_ids], mcp-calls: [external_ids]}
    freshness: {test: 1h, clippy: 1h, mcp-calls: 1h}
  - name: surfaces
    package: builtin:runner                # the same runner, one fast job: Toolbox's own CLI and MCP surfaces
    runtime: in-image
    config:
      name: surfaces
      root: "."
      jobs:
        - {name: describe, command: [target/debug/toolbox, describe], parse: ndjson, kinds: [command, mcp-tool]}
        # Our standards as entities (docs/design/scorecards-for-scorecards.md): this portal, the
        # starter pilots copy, and the reference portal. Live outcomes come from the committed
        # results and are information only, so the meta scorecards never depend on their own output.
        - name: scorecards
          command: [target/debug/toolbox, describe, scorecards, portal, examples/repo-portal-starter, examples/reference-portal, --results, portal=portal/results.json]
          parse: ndjson
          kinds: [scorecard, rule]
    records: [command, mcp-tool, scorecard, rule]
    refresh: {command: [external_ids], mcp-tool: [external_ids], scorecard: [external_ids], rule: [external_ids]}
    freshness: {command: 5m, mcp-tool: 5m, scorecard: 5m, rule: 5m}
  - name: ci-lint
    package: builtin:runner                # zizmor and actionlint: fast, offline, deterministic at pinned versions
    runtime: in-image
    config:
      name: ci-lint
      root: "."
      jobs:
        - name: zizmor                     # security audits (regular persona), offline
          command: [zizmor, --offline, --no-exit-codes, --format, json, .github/workflows, actions]
          parse: zizmor
          files: [".github/workflows/*.y*ml", "actions/*/action.y*ml"]
          optional: true                   # not installed → its rules are unknown, not failing
        - name: actionlint                 # workflow syntax, expressions, types; shellcheck off so local = CI
          command: [actionlint, -shellcheck=, -pyflakes=, -format, "{{json .}}"]
          parse: actionlint
          files: [".github/workflows/*.y*ml"]
          optional: true
    records: [zizmor, actionlint]
    refresh: {zizmor: [external_ids], actionlint: [external_ids]}
    freshness: {zizmor: 5m, actionlint: 5m}
  - name: github-actions
    package: builtin:github                # run history: changes with time, so not in the ratchet (--skip it)
    runtime: in-image
    config:
      org: loganvolkers
      token: ${env:GITHUB_TOKEN}
      actions: {repos: [toolbox], branch: main, runs: 50}
    records: [workflow-runs]
    refresh: {workflow-runs: [external_ids]}
    freshness: {workflow-runs: 15m}

kinds:
  # ── Layer 1: what maintainers build ──────────────────────────────────────────────────────
  - name: Crate
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      description: {type: string}
      targets: {type: list, items: string}
      externalDeps: {type: integer}
      readme: {type: boolean}
      lastChange: {type: string}
      crateDoc: {type: boolean}
      codeLines: {type: integer}
      testCodeLines: {type: integer}
      pubItems: {type: integer}
      pubDocumented: {type: integer}
      undocumented: {type: list, items: string}
      functions: {type: list, items: object}
      maxFnLines: {type: integer}
      maxComplexity: {type: integer}
      unitTests: {type: integer}
      integrationTests: {type: integer}
      unwraps: {type: integer}
      tests: {type: object}                # from the runner: status, passed, failed, output
      clippy: {type: object}               # from the runner: status, warnings, messages
      docCoverage:
        type: integer
        computed: "entity.pubItems == 0 ? 100 : entity.pubDocumented * 100 / entity.pubItems"
      longFunctions:
        type: list
        items: string
        computed: "entity.functions.filter(f, f.lines > 80).map(f, f.name + ' at ' + f.at + ': ' + string(f.lines) + ' lines')"
      complexFunctions:
        type: list
        items: string
        computed: "entity.functions.filter(f, f.complexity > 15).map(f, f.name + ' at ' + f.at + ': complexity ' + string(f.complexity))"
      dependents:
        type: list
        items: string
        computed: "inbound.dependsOn.map(c, c.path)"
    relations:
      dependsOn: {to: Crate, many: true}
    sources:
      default: [connector:workspace]
      fields:
        tests: [connector:runner]
        clippy: [connector:runner]
    map:
      - from: workspace/crate
        id: "'crate:' + record.name"
        set: >-
          {'path': record.path, 'description': record.description, 'targets': record.targets,
           'externalDeps': record.externalDeps, 'readme': record.readme, 'lastChange': record.lastChange,
           'crateDoc': record.crateDoc, 'codeLines': record.codeLines, 'testCodeLines': record.testCodeLines,
           'pubItems': record.pubItems, 'pubDocumented': record.pubDocumented,
           'undocumented': record.undocumented, 'functions': record.functions,
           'maxFnLines': record.maxFnLines, 'maxComplexity': record.maxComplexity,
           'unitTests': record.unitTests, 'integrationTests': record.integrationTests,
           'unwraps': record.unwraps}
        relations:
          dependsOn: "record.dependsOn.map(d, 'crate:' + d)"
      - from: runner/test
        id: "'crate:' + record.crate"
        set: "{'tests': record}"
      - from: runner/clippy
        id: "'crate:' + record.crate"
        set: "{'clippy': record}"

  - name: Doc
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      title: {type: string}
      words: {type: integer}
      hasStatus: {type: boolean}
      hasSources: {type: boolean}
      brokenLinks: {type: list, items: string}
      counts: {type: object}
      lastChange: {type: string}
      area:
        type: string
        computed: >-
          entity.path.startsWith('docs/design/') ? 'design'
          : entity.path.startsWith('docs/') ? 'docs'
          : entity.path.startsWith('examples/') || entity.path.startsWith('experiments/') ? 'example'
          : 'repo'
    relations:
      mentionsCommand: {to: Command, many: true, unresolved: ignore}   # candidates from captures/code spans
      mentionsTool: {to: McpTool, many: true, unresolved: ignore}   # candidates from captures/code spans
      mentionsCrate: {to: Crate, many: true, unresolved: ignore}   # candidates from captures/code spans
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/doc
        id: "'doc:' + record.path"
        set: >-
          {'path': record.path, 'title': record.title, 'words': record.words,
           'hasStatus': record.hasStatus, 'hasSources': record.hasSources,
           'brokenLinks': record.brokenLinks, 'counts': record.counts, 'lastChange': record.lastChange}
        relations:
          mentionsCommand: "record.captures.commands.map(c, 'command:' + c)"
          mentionsTool: "record.codeSpans.map(s, 'mcp-tool:' + s)"
          mentionsCrate: "record.codeSpans.map(s, 'crate:' + s)"

  - name: File
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      extension: {type: string}
      lines: {type: integer}
      lastChange: {type: string}
    relations:
      exercisesCommand: {to: Command, many: true, unresolved: ignore}   # candidates from captures/code spans
      exercisesTool: {to: McpTool, many: true, unresolved: ignore}   # candidates from captures/code spans
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/file
        id: "'file:' + record.path"
        set: "{'path': record.path, 'extension': record.extension, 'lines': record.lines, 'lastChange': record.lastChange}"
        relations:
          exercisesCommand: "record.captures.commands.map(c, 'command:' + c)"
          exercisesTool: "record.captures.tools.map(t, 'mcp-tool:' + t)"

  # Agent skills we ship (docs/design/skill-standards.md). The connector reports facts; the
  # scorecard below holds the thresholds.
  - name: Skill
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      dir: {type: string}
      name: {type: string}
      plugin: {type: string}
      description: {type: string}
      descriptionChars: {type: integer}
      triggerCues: {type: list, items: string}       # when / whenever / before / after in the description
      pronouns: {type: list, items: string}          # you / I / we … in the description
      frontmatterErrors: {type: list, items: string}
      bodyLines: {type: integer}
      estimatedTokens: {type: integer}               # body characters / 4, not a tokenizer count
      numberedSteps: {type: integer}
      codeFences: {type: integer}
      missingFiles: {type: list, items: string}
      windowsPaths: {type: list, items: string}
      boundaryCues: {type: list, items: string}
      evalCases: {type: integer}                     # cases in evals/evals.json
      hiddenChars: {type: integer}
      secretHits: {type: list, items: string}
      linkDepth: {type: integer}
      supportFiles: {type: integer}
      lastChange: {type: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/skill
        id: "'skill:' + record.dir"
        set: >-
          {'path': record.path, 'dir': record.dir, 'name': record.name, 'plugin': record.plugin,
           'description': record.description, 'descriptionChars': record.descriptionChars,
           'triggerCues': record.triggerCues, 'pronouns': record.pronouns,
           'frontmatterErrors': record.frontmatterErrors, 'bodyLines': record.bodyLines,
           'estimatedTokens': record.estimatedTokens, 'numberedSteps': record.numberedSteps,
           'codeFences': record.codeFences, 'missingFiles': record.missingFiles,
           'windowsPaths': record.windowsPaths, 'boundaryCues': record.boundaryCues,
           'evalCases': record.evalCases, 'hiddenChars': record.hiddenChars,
           'secretHits': record.secretHits, 'linkDepth': record.linkDepth,
           'supportFiles': record.supportFiles, 'lastChange': record.lastChange}

  # First-party connectors (docs/design/connector-standards.md). Facts from the crate; thresholds below.
  - name: Connector
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      dir: {type: string}
      name: {type: string}
      description: {type: string}
      descriptionChars: {type: integer}
      crateDoc: {type: boolean}
      configDocumented: {type: boolean}
      transport: {type: string}                 # stdio, remote, both, or none
      pushOnly: {type: boolean}
      documentedKinds: {type: list, items: string}
      genericKinds: {type: boolean}             # kinds come from config, as the runner's jobs do
      snapshotComplete: {type: boolean}
      reportsNotFound: {type: boolean}
      tests: {type: integer}
      conformanceMentions: {type: integer}      # lines that run `connector test` on this binary
      ciMentions: {type: integer}               # CI scripts or workflows that name the binary
      secretHits: {type: list, items: string}
      lastChange: {type: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/connector
        id: "'connector:' + record.dir"
        set: >-
          {'path': record.path, 'dir': record.dir, 'name': record.name,
           'description': record.description, 'descriptionChars': record.descriptionChars,
           'crateDoc': record.crateDoc, 'configDocumented': record.configDocumented,
           'transport': record.transport, 'pushOnly': record.pushOnly,
           'documentedKinds': record.documentedKinds, 'genericKinds': record.genericKinds,
           'snapshotComplete': record.snapshotComplete, 'reportsNotFound': record.reportsNotFound,
           'tests': record.tests, 'conformanceMentions': record.conformanceMentions,
           'ciMentions': record.ciMentions, 'secretHits': record.secretHits,
           'lastChange': record.lastChange}

  # ── Layers 2 and 3: what operators and users rely on ─────────────────────────────────────
  - name: Command
    identityFrom: [connector:surfaces]
    fields:
      name: {type: string}
      about: {type: string}
      args: {type: list, items: object}
      undocumentedArgs: {type: list, items: string}
      structuredOutput: {type: boolean}
      mcpTool: {type: string}
      layer:
        type: enum
        values: [operator, user]
        computed: "has(entity.mcpTool) || entity.name == 'mcp' ? 'user' : 'operator'"
      documentedIn: {type: list, items: string, computed: "inbound.mentionsCommand.map(d, d.path)"}
      exercisedBy: {type: list, items: string, computed: "inbound.exercisesCommand.map(f, f.path)"}
    relations:
      callsTool: {to: McpTool, many: false}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/command
        id: "'command:' + record.slug"
        set: >-
          {'name': record.name, 'about': record.about, 'args': record.args,
           'undocumentedArgs': record.undocumentedArgs, 'structuredOutput': record.structuredOutput,
           'mcpTool': record.mcpTool}
        relations:
          callsTool: "record.mcpTool == null ? [] : ['mcp-tool:' + record.mcpTool]"

  - name: McpTool
    identityFrom: [connector:surfaces]
    fields:
      name: {type: string}
      description: {type: string}
      annotations: {type: object}
      properties: {type: list, items: string}
      undescribedProperties: {type: list, items: string}
      observed: {type: object}             # from the runner: {calls, errors} in the MCP contract tests
      documentedIn: {type: list, items: string, computed: "inbound.mentionsTool.map(d, d.path)"}
      exercisedBy: {type: list, items: string, computed: "inbound.exercisesTool.map(f, f.path)"}
      viaCli: {type: list, items: string, computed: "inbound.callsTool.map(c, c.name)"}
    sources:
      default: [connector:surfaces]
      fields: {observed: [connector:runner]}
    map:
      - from: runner/mcp-calls
        id: "'mcp-tool:' + record.tool"
        set: "{'observed': record}"
      - from: surfaces/mcp-tool
        id: "'mcp-tool:' + record.name"
        set: >-
          {'name': record.name, 'description': record.description, 'annotations': record.annotations,
           'properties': record.properties, 'undescribedProperties': record.undescribedProperties}

  # ── CI: the workflows and actions that build, test and ship Toolbox ──────────────────────
  - name: Workflow
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      type: {type: enum, values: [workflow, action]}
      name: {type: string}
      triggers: {type: list, items: string}
      riskyTriggers: {type: list, items: string}
      topPermissions: {type: boolean}
      jobs: {type: integer}
      jobsWithoutTimeout: {type: list, items: string}
      jobsWithoutPermissions: {type: list, items: string}
      jobsWithWrite: {type: list, items: string}
      concurrency: {type: boolean}
      unpinned: {type: list, items: string}
      zizmor: {type: object}               # {total, counts: {high, medium, low, informational}, findings}
      actionlint: {type: object}           # {total, findings}
      runs: {type: object}                 # from the GitHub API: failRate, rerunRate, failingStreak, p90Seconds …
    relations:
      usesAction: {to: ActionDependency, many: true}
    sources:
      default: [connector:workspace]
      fields:
        zizmor: [connector:ci-lint]
        actionlint: [connector:ci-lint]
        runs: [connector:github-actions]
    map:
      - from: workspace/workflow
        id: "'workflow:' + record.path"
        set: >-
          {'path': record.path, 'type': record.type, 'name': record.name, 'triggers': record.triggers,
           'riskyTriggers': record.riskyTriggers, 'topPermissions': record.topPermissions, 'jobs': record.jobs,
           'jobsWithoutTimeout': record.jobsWithoutTimeout, 'jobsWithoutPermissions': record.jobsWithoutPermissions,
           'jobsWithWrite': record.jobsWithWrite, 'concurrency': record.concurrency, 'unpinned': record.unpinned}
        relations:
          usesAction: "record.actions.map(a, 'action:' + a)"
      - from: ci-lint/zizmor
        id: "'workflow:' + record.path"
        set: "{'zizmor': record}"
      - from: ci-lint/actionlint
        id: "'workflow:' + record.path"
        set: "{'actionlint': record}"
      - from: github-actions/workflow-runs
        id: "'workflow:' + record.path"
        set: "{'runs': record}"

  - name: ActionDependency                 # a third-party action or reusable workflow our CI runs
    identityFrom: [connector:workspace]
    fields:
      name: {type: string}
      owner: {type: string}
      refs: {type: list, items: string}
      pins: {type: list, items: string}
      usedBy: {type: list, items: string}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/action-ref
        id: "'action:' + record.name"
        set: "{'name': record.name, 'owner': record.owner, 'refs': record.refs, 'pins': record.pins, 'usedBy': record.usedBy}"

  # ── Our standards themselves (scorecards for scorecards) ──────────────────────────────────
  - name: Scorecard
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string}
      name: {type: string}
      kind: {type: string}
      owner: {type: string}
      levels: {type: list, items: string}
      rulesPerLevel: {type: object}
      rules: {type: integer}
      tested: {type: boolean}
      meta: {type: boolean}
      fixtureLevels: {type: object}        # levels the portal's own fixtures reach
      liveEntities: {type: integer}        # information only (from the committed results)
      untestedRules: {type: list, items: string, computed: "inbound.ruleOf.filter(r, !r.tested).map(r, r.name)"}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/scorecard
        id: "'scorecard:' + record.portal + '/' + record.name"
        set: >-
          {'portal': record.portal, 'name': record.name, 'kind': record.kind, 'owner': record.owner,
           'levels': record.levels, 'rulesPerLevel': record.rulesPerLevel, 'rules': record.rules,
           'tested': record.tested, 'meta': record.meta, 'fixtureLevels': record.fixtureLevels,
           'liveEntities': has(record.liveEntities) ? record.liveEntities : null}

  - name: Rule
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string}
      scorecard: {type: string}
      name: {type: string}
      level: {type: string}
      fixWords: {type: integer}
      hasEvidence: {type: boolean}
      check: {type: object}                # CEL: nodes, depth, loops (comprehension nesting), fields, functions
      evidence: {type: object}
      tested: {type: boolean}              # a test expectation names it
      fixture: {type: object}              # {pass, fail, unknown} over the portal's fixtures
      live: {type: object}                 # information only: {entities, pass, fail, unknown} on real data
    relations:
      ruleOf: {to: Scorecard, many: false}
    sources: {default: [connector:surfaces]}
    map:
      - from: surfaces/rule
        id: "'rule:' + record.card + '/' + record.name"
        set: >-
          {'portal': record.portal, 'scorecard': record.scorecard, 'name': record.name, 'level': record.level,
           'fixWords': record.fixWords, 'hasEvidence': record.hasEvidence, 'check': record.check,
           'evidence': record.evidence, 'tested': record.tested, 'fixture': record.fixture,
           'live': has(record.live) ? record.live : null}
        relations:
          ruleOf: "['scorecard:' + record.card]"

scorecards:
  # ── Layer 1: maintainer SDLC ─────────────────────────────────────────────────────────────
  - name: maintainer-crate
    kind: Crate
    owner: group:maintainers
    levels: [bronze, silver, gold]
    appliesTo: "entity.codeLines >= 50"    # placeholder crates (toolbox-durable, toolbox-exec) are skipped
    rules:
      - name: crate-docs
        level: bronze
        check: "entity.crateDoc"
        fix: "Start the crate's lib.rs or main.rs with //! docs: what it is and which spec section it implements."
      - name: has-tests
        level: bronze
        check: "entity.unitTests + entity.integrationTests > 0"
        fix: "Add a #[test] for the crate's main behaviour, or an integration test in tests/."
      - name: tests-pass
        level: bronze
        check: "has(entity.tests) && entity.tests.status == 'pass'"
        evidence: "has(entity.tests) ? [entity.tests.status + ': ' + string(entity.tests.failed) + ' failed'] + (has(entity.tests.output) ? [entity.tests.output] : []) : ['no test run yet (refresh the crate)']"
        fix: "Run `cargo test -p <crate>` and fix the failures in the evidence."
      - name: clippy-clean
        level: bronze
        check: "has(entity.clippy) && entity.clippy.status == 'pass'"
        evidence: "has(entity.clippy) ? entity.clippy.messages : ['no clippy run yet (refresh the crate)']"
        fix: "Fix the clippy warnings in the evidence (`cargo clippy -p <crate> --all-targets`)."
      - name: public-api-documented
        level: silver
        check: "entity.docCoverage >= 80"
        evidence: "entity.undocumented"
        fix: "Add /// docs to the public items in the evidence."
      - name: no-huge-functions
        level: silver
        check: "entity.maxFnLines <= 150"
        evidence: "entity.functions.filter(f, f.lines > 150).map(f, f.name + ' at ' + f.at + ': ' + string(f.lines) + ' lines')"
        fix: "Split the functions in the evidence into named steps."
      - name: bounded-complexity
        level: silver
        check: "entity.maxComplexity <= 30"
        evidence: "entity.functions.filter(f, f.complexity > 30).map(f, f.name + ' at ' + f.at + ': complexity ' + string(f.complexity))"
        fix: "Simplify the functions in the evidence (extract match arms, early returns)."
      - name: fully-documented
        level: gold
        check: "entity.docCoverage == 100"
        evidence: "entity.undocumented"
        fix: "Document every item in the evidence."
      - name: short-functions
        level: gold
        check: "entity.longFunctions.size() == 0"
        evidence: "entity.longFunctions"
        fix: "Keep functions at 80 lines or fewer; split those in the evidence."
      - name: simple-functions
        level: gold
        check: "entity.complexFunctions.size() == 0"
        evidence: "entity.complexFunctions"
        fix: "Keep cyclomatic complexity at 15 or lower; simplify those in the evidence."
      - name: few-unwraps
        level: gold
        check: "entity.unwraps * 100 <= entity.codeLines"
        evidence: "[string(entity.unwraps) + ' unwrap/expect calls in ' + string(entity.codeLines) + ' lines']"
        fix: "At most one unwrap/expect per 100 lines outside tests: return errors or document the invariant."
    facets: {summary: public, details: public}

  - name: maintainer-docs
    kind: Doc
    owner: group:maintainers
    levels: [bronze, silver]
    appliesTo: "!(entity.path in policy.historicalDocs)"
    rules:
      - name: links-resolve
        level: bronze
        check: "entity.brokenLinks.size() == 0"
        evidence: "entity.brokenLinks"
        fix: "Fix or remove the relative links in the evidence."
      - name: names-sdlc-layer
        level: bronze
        check: "entity.counts.sdlc <= entity.counts.layeredSdlc"
        evidence: "[string(entity.counts.sdlc - entity.counts.layeredSdlc) + ' mention(s) of SDLC without a layer']"
        fix: "Say which SDLC you mean: maintainer, operator or user (docs/sdlc.md, D63)."
      - name: status-banner
        level: silver
        check: "entity.area != 'design' || entity.hasStatus"
        fix: "Start the design doc with a *Status:* line saying what is decided and what is built."
      - name: cites-sources
        level: silver
        check: "entity.area != 'design' || entity.hasSources"
        fix: "End the design doc with a ## Sources section (AGENTS.md working rules)."
    facets: {summary: public, details: public}

  # ── Layer 2: operator SDLC ───────────────────────────────────────────────────────────────
  - name: operator-cli
    kind: Command
    owner: group:maintainers
    levels: [bronze, silver]
    appliesTo: "entity.layer == 'operator'"
    rules:
      - name: has-help
        level: bronze
        check: "has(entity.about) && entity.about.size() >= 10"
        fix: "Give the command a /// doc comment; clap shows it as the command's help."
      - name: documented
        level: bronze
        check: "entity.documentedIn.size() > 0"
        evidence: "['not mentioned as `toolbox ' + entity.name + '` in any doc']"
        fix: "Describe `toolbox <command>` in docs/v1-spec.md §7.7 or the operator SDLC doc."
      - name: args-described
        level: silver
        check: "entity.undocumentedArgs.size() == 0"
        evidence: "entity.undocumentedArgs"
        fix: "Add a /// doc comment to each argument in the evidence."
      - name: exercised
        level: silver
        check: "entity.exercisedBy.size() > 0"
        fix: "Run the command in an acceptance script or an integration test."
    facets: {summary: public, details: public}

  # ── Layer 3: user SDLC ───────────────────────────────────────────────────────────────────
  - name: user-cli
    kind: Command
    owner: group:maintainers
    levels: [bronze, silver]
    appliesTo: "entity.layer == 'user'"
    rules:
      - name: has-help
        level: bronze
        check: "has(entity.about) && entity.about.size() >= 10"
        fix: "Give the command a /// doc comment; clap shows it as the command's help."
      - name: structured-output
        level: bronze
        check: "entity.name == 'mcp' || entity.structuredOutput"
        fix: "Support -o json so scripts and apps can parse the output."
      - name: args-described
        level: silver
        check: "entity.undocumentedArgs.size() == 0"
        evidence: "entity.undocumentedArgs"
        fix: "Add a /// doc comment to each argument in the evidence."
      - name: exercised
        level: silver
        check: "entity.exercisedBy.size() > 0"
        fix: "Run the command in an acceptance script or an integration test."
    facets: {summary: public, details: public}

  - name: user-mcp
    kind: McpTool
    owner: group:maintainers
    levels: [bronze, silver, gold]
    rules:
      - name: described
        level: bronze
        check: "entity.description.size() >= 20"
        fix: "Describe what the tool returns and when an agent should call it."
      - name: annotated
        level: bronze
        check: "has(entity.annotations.readOnlyHint)"
        fix: "Set annotations.readOnlyHint (and idempotent/openWorld hints for writes)."
      - name: inputs-described
        level: silver
        check: "entity.undescribedProperties.size() == 0"
        evidence: "entity.undescribedProperties"
        fix: "Add a description to each input property in the evidence (crates/toolbox-api/src/mcp.rs)."
      - name: documented
        level: silver
        check: "'docs/v1-spec.md' in entity.documentedIn"   # common names (`get`, `query`) appear in many docs
        evidence: "entity.documentedIn.size() == 0 ? ['documented in: nothing'] : entity.documentedIn.map(d, 'documented in ' + d + ', not docs/v1-spec.md')"
        fix: "List the tool, in backticks, in docs/v1-spec.md §7.3."
      - name: contract-tested
        level: gold
        # Observed calls when the runner has run the contract tests; otherwise a tools/call body that
        # names the tool (static mode, weaker: it can't see whether the call happens).
        check: "has(entity.observed) ? entity.observed.calls > 0 : entity.exercisedBy.size() > 0"
        evidence: "has(entity.observed) ? ['observed ' + string(entity.observed.calls) + ' call(s) in the MCP contract tests'] : ['no tools/call naming this tool in tests or scripts (static mode)']"
        fix: "Call the tool directly (tools/call) in a test, e.g. crates/toolbox-api/tests; the CLI path in `viaCli` doesn't pin the MCP contract."
    facets: {summary: public, details: public}

  # ── Layer 1: maintainer SDLC — CI (docs/design/github-actions-standards.md) ──────────────
  # Security: what an attacker could do through a workflow or the report action (which pilot repos
  # run, so it is operator-facing too). zizmor and actionlint rules evaluate to `unknown`, not `fail`,
  # where those tools aren't installed.
  - name: maintainer-ci-security
    kind: Workflow
    owner: group:maintainers
    levels: [bronze, silver, gold]
    rules:
      - name: actionlint-clean
        level: bronze
        check: "entity.type == 'action' || entity.actionlint.total == 0"
        evidence: "entity.actionlint.findings.map(f, f.rule + ' at line ' + string(f.line) + ': ' + f.message)"
        fix: "Fix what actionlint reports (`actionlint` in the repository root)."
      - name: no-high-findings
        level: bronze
        check: "entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule != 'unpinned-uses').size() == 0"
        evidence: "entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule != 'unpinned-uses').map(f, f.rule + ' at line ' + string(f.line) + ': ' + f.message)"
        fix: "Fix zizmor's high-severity findings (`zizmor --offline .github/workflows actions`); see https://docs.zizmor.sh/audits/."
      - name: least-privilege-token
        level: bronze
        check: "entity.type == 'action' || entity.topPermissions || entity.jobsWithoutPermissions.size() == 0"
        evidence: "entity.jobsWithoutPermissions"
        fix: "Declare `permissions:` at the top of the workflow (read-only, e.g. `contents: read`) and grant writes per job."
      - name: pinned-to-sha
        level: bronze
        check: "entity.unpinned.size() == 0"
        evidence: "entity.unpinned"
        fix: "Pin every third-party `uses:` to a full commit SHA (with the tag in a comment), or adopt a workflow lockfile; let Dependabot update them."
      - name: no-medium-findings
        level: silver
        check: "entity.zizmor.counts.medium == 0"
        evidence: "entity.zizmor.findings.filter(f, f.severity == 'medium').map(f, f.rule + ' at line ' + string(f.line) + ': ' + f.message)"
        fix: "Fix zizmor's medium findings (e.g. `artipacked`: set `persist-credentials: false` on checkout)."
      - name: no-write-tokens-on-risky-triggers
        level: silver
        check: "entity.riskyTriggers.size() == 0 || entity.jobsWithWrite.size() == 0"
        evidence: "entity.riskyTriggers.map(t, 'trigger ' + t) + entity.jobsWithWrite.map(j, 'write token in job ' + j)"
        fix: "Don't combine pull_request_target/workflow_run/issue_comment with write permissions; split privileged steps into a separate workflow."
      - name: zizmor-clean
        level: gold
        check: "entity.zizmor.total == 0"
        evidence: "entity.zizmor.findings.map(f, f.severity + ' ' + f.rule + ' at line ' + string(f.line))"
        fix: "Resolve or explicitly ignore (with a reason) zizmor's low and informational findings."
    facets: {summary: public, details: public}

  # Reliability: whether CI can be trusted to say "green means good". Run history comes from the
  # GitHub API (github-actions connector); without it those rules fail with "no run data".
  - name: maintainer-ci-reliability
    kind: Workflow
    owner: group:maintainers
    levels: [bronze, silver, gold]
    appliesTo: "entity.type == 'workflow'"
    rules:
      - name: main-not-stuck-red
        level: bronze
        check: "has(entity.runs) && entity.runs.failingStreak < 3"
        evidence: "has(entity.runs) ? [string(entity.runs.failingStreak) + ' failures in a row on ' + entity.runs.branch + ', last run ' + entity.runs.lastRunAt] : ['no run data (github-actions connector skipped or no token)']"
        fix: "Fix main before anything else: a red default branch hides new failures."
      - name: fail-rate-under-20
        level: bronze
        check: "has(entity.runs) && entity.runs.failRate <= 20"
        evidence: "has(entity.runs) ? [string(entity.runs.failRate) + '% of the last ' + string(entity.runs.decided) + ' decided runs on ' + entity.runs.branch + ' failed'] : ['no run data']"
        fix: "Find the failing jobs (`toolbox get workflow:<path>` shows run data) and fix or quarantine their causes."
      - name: every-job-has-timeout
        level: bronze
        check: "entity.jobsWithoutTimeout.size() == 0"
        evidence: "entity.jobsWithoutTimeout"
        fix: "Set `timeout-minutes` on every job; the default is 360 minutes of a hung runner."
      - name: fail-rate-under-10
        level: silver
        check: "has(entity.runs) && entity.runs.failRate <= 10"
        evidence: "has(entity.runs) ? [string(entity.runs.failRate) + '% failed'] : ['no run data']"
        fix: "Track failures to their causes: flaky tests, infrastructure, or real breakage merged to main."
      - name: few-reruns
        level: silver
        check: "has(entity.runs) && entity.runs.rerunRate <= 5"
        evidence: "has(entity.runs) ? [string(entity.runs.rerunRate) + '% of runs were re-run'] : ['no run data']"
        fix: "Re-runs mean flakiness: find the flaky jobs and fix or isolate them instead of retrying."
      - name: cancels-superseded-runs
        level: silver
        check: "entity.concurrency || !('pull_request' in entity.triggers)"
        evidence: "['no concurrency group on a workflow triggered by pull_request']"
        fix: "Add `concurrency: {group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true}` so a new push cancels the old run."
      - name: fail-rate-under-5
        level: gold
        check: "has(entity.runs) && entity.runs.failRate <= 5"
        evidence: "has(entity.runs) ? [string(entity.runs.failRate) + '% failed'] : ['no run data']"
        fix: "Keep main green: failures should be rare enough that each one gets looked at."
      - name: fast-feedback
        level: gold
        check: "has(entity.runs) && entity.runs.p90Seconds <= 900"
        evidence: "has(entity.runs) ? ['p90 run time ' + string(entity.runs.p90Seconds / 60) + ' min'] : ['no run data']"
        fix: "Keep the p90 run under 15 minutes: split slow jobs, cache builds, move long suites off the PR path."
    facets: {summary: public, details: public}

  # Supply chain: each third-party action, across every workflow that uses it (the "who uses
  # tj-actions/changed-files?" question).
  - name: maintainer-action-deps
    kind: ActionDependency
    owner: group:maintainers
    levels: [bronze]
    rules:
      - name: pinned-everywhere
        level: bronze
        check: "entity.pins.all(p, p == 'sha')"
        evidence: "entity.refs.filter(r, !r.matches('@[0-9a-f]{40}$')) + entity.usedBy.map(u, 'used by ' + u)"
        fix: "Pin this action to a full commit SHA in every workflow that uses it."
    facets: {summary: public, details: public}

  # ── Agent skills we ship (docs/design/skill-standards.md) ────────────────────────────────
  # Bronze is "a harness can load it and route to it". Silver is "an agent can follow it".
  # Gold is "it states its limits, has eval cases, and nothing hostile is hiding in the files".
  # Live with/without-skill runs are not a rule: they need a model and they vary (D71).
  - name: maintainer-skill
    kind: Skill
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: valid-frontmatter
        level: bronze
        check: "entity.frontmatterErrors.size() == 0"
        evidence: "entity.frontmatterErrors"
        fix: "Fix the Agent Skills frontmatter errors in the evidence (name, description, directory match, allowed fields)."
      - name: description-says-when
        level: bronze
        check: "entity.descriptionChars >= 20 && entity.descriptionChars <= 1024 && entity.triggerCues.size() > 0"
        evidence: "entity.triggerCues + [string(entity.descriptionChars) + ' characters']"
        fix: "Say what the skill does and when to use it in the description (20 to 1024 characters), including when, whenever, before, or after."
      - name: third-person
        level: bronze
        check: "entity.descriptionChars > 0 && entity.pronouns.size() == 0"
        evidence: "entity.pronouns.size() == 0 ? ['description is empty'] : entity.pronouns.map(p, 'pronoun: ' + p)"
        fix: "Rewrite the description in third person. Drop you, your, I, we, my, and our; the description is loaded into the agent's prompt."
      - name: has-procedure
        level: silver
        check: "entity.numberedSteps >= 3"
        evidence: "[string(entity.numberedSteps) + ' numbered step(s); want at least 3']"
        fix: "Write at least three numbered steps in SKILL.md so an agent can follow the procedure."
      - name: has-example
        level: silver
        check: "entity.codeFences > 0"
        evidence: "['no fenced code block in SKILL.md']"
        fix: "Add a fenced code block in SKILL.md with a concrete command, input, or output."
      - name: links-resolve
        level: silver
        check: "entity.missingFiles.size() == 0"
        evidence: "entity.missingFiles"
        fix: "Fix or remove the relative links in the evidence. Paths are relative to the file that contains them."
      - name: within-body-budget
        level: silver
        check: "entity.bodyLines <= 500 && entity.estimatedTokens <= 5000"
        evidence: "[string(entity.bodyLines) + ' lines, ~' + string(entity.estimatedTokens) + ' tokens (characters/4)']"
        fix: "Keep the SKILL.md body under 500 lines and about 5000 tokens (characters divided by 4). Move detail into references/."
      - name: portable-paths
        level: silver
        check: "entity.windowsPaths.size() == 0"
        evidence: "entity.windowsPaths"
        fix: "Replace the Windows paths in the evidence with forward-slash paths relative to the skill directory."
      - name: states-boundaries
        level: gold
        check: "entity.boundaryCues.size() > 0"
        evidence: "['no error, limit, or prerequisite cue in the body']"
        fix: "Name a limit, an error path, or a prerequisite in the body (never, do not, limitation, prerequisite, troubleshooting, or on error)."
      - name: has-evals
        level: gold
        check: "entity.evalCases >= 3"
        evidence: "[string(entity.evalCases) + ' cases in evals/evals.json (want at least 3)']"
        fix: "Add at least three eval cases to evals/evals.json (a JSON array, or an object with an evals array). One element is one prompt. Running them is a separate, non-gating step."
      - name: no-hidden-instructions
        level: gold
        check: "entity.hiddenChars == 0"
        evidence: "[string(entity.hiddenChars) + ' hidden or bidi characters']"
        fix: "Remove hidden Unicode from the skill files: zero-width characters, bidi overrides, and Unicode tags."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the hardcoded credentials in the evidence. Refer to a secret by name instead of pasting it into the skill."
      - name: one-level-deep
        level: gold
        check: "entity.linkDepth <= 1 && entity.supportFiles <= 3"
        evidence: "[string(entity.linkDepth) + ' link hops, ' + string(entity.supportFiles) + ' supporting files']"
        fix: "Keep references one hop from SKILL.md and the skill to at most three supporting files. Focused skills outperform large bundles."
    facets: {summary: public, details: public}

  # ── Connectors we ship (docs/design/connector-standards.md) ──────────────────────────────
  # Bronze is "it is a connector an operator can configure". Silver is "a resync and a refresh
  # have the shapes the conformance kit checks, and someone wrote a test". Gold is "CI runs it,
  # and no credential is pasted into the source". Lag, error rate and permission probes need a
  # live portal; they are the meta-catalog's connector-health and are not gated here.
  - name: maintainer-connector
    kind: Connector
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
      - name: described
        level: bronze
        check: "entity.descriptionChars > 0 && entity.crateDoc"
        evidence: "entity.descriptionChars == 0 ? ['Cargo.toml has no description'] : (!entity.crateDoc ? ['no crate-level doc comment'] : ['described'])"
        fix: "Add a Cargo.toml description and a //! crate doc that says what the connector emits."
      - name: config-documented
        level: bronze
        check: "entity.configDocumented"
        evidence: "['crate docs name neither TOOLBOX_CONNECTOR_CONFIG nor a CLI flag']"
        fix: "Document the configuration in the crate doc: TOOLBOX_CONNECTOR_CONFIG for an in-image connector, or the --toolbox and --listen flags for a remote one."
      - name: speaks-the-protocol
        level: bronze
        check: "entity.transport == 'stdio' || entity.transport == 'remote' || entity.transport == 'both'"
        evidence: "[entity.transport]"
        fix: "Serve commands with run_stdio (in-image) or run_remote (long-poll). A connector that does neither is not on the control channel."
      - name: names-its-kinds
        level: silver
        check: "entity.documentedKinds.size() > 0 || entity.genericKinds"
        evidence: "['crate docs and source name no record kind']"
        fix: "Name each record kind in the source (record or snapshot_complete) or, for a generic runner, document that kinds come from the job config."
      - name: closes-snapshots
        level: silver
        check: "entity.pushOnly || entity.snapshotComplete"
        evidence: "['resync never sends snapshot_complete']"
        fix: "End every resync kind with snapshot_complete. A push-only connector is exempt: it has no resync."
      - name: reports-missing-ids
        level: silver
        check: "entity.pushOnly || entity.reportsNotFound"
        evidence: "['refresh never sends not_found']"
        fix: "A refresh of an unknown external id must send not_found. A push-only connector is exempt: the provider sends deletes."
      - name: has-tests
        level: silver
        check: "entity.tests >= 1"
        evidence: "[string(entity.tests) + ' #[test] functions']"
        fix: "Add a unit test that does not need the upstream API: a parser, a record shape, or a capabilities case."
      - name: exercised-in-ci
        level: gold
        check: "entity.conformanceMentions > 0 || (entity.pushOnly && entity.ciMentions > 0)"
        evidence: "[string(entity.conformanceMentions) + ' connector-test lines, ' + string(entity.ciMentions) + ' CI files']"
        fix: "Run toolbox connector test on this binary from CI. A push-only connector has no resync for that kit; an acceptance script must start it instead."
      - name: no-hardcoded-secrets
        level: gold
        check: "entity.secretHits.size() == 0"
        evidence: "entity.secretHits"
        fix: "Remove the hardcoded credentials in the evidence. Read tokens from the environment or from TOOLBOX_CONNECTOR_CONFIG."
    facets: {summary: public, details: public}

  # ── Scorecards for scorecards (docs/design/scorecards-for-scorecards.md) ─────────────────
  # They score every rule and scorecard of this portal, the starter and the reference portal —
  # themselves included, so there is no further level. Only deterministic facts (manifest, CEL,
  # tests, fixtures) are scored; live outcomes are shown, not scored.
  - name: meta-rule
    kind: Rule
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new rule or scorecard must be tested and explained from day one
    rules:
      - name: explains-fix
        level: bronze
        check: "entity.fixWords >= 5"
        evidence: "['fix has ' + string(entity.fixWords) + ' words']"
        fix: "Write a fix an agent can act on: what to change, and where."
      - name: tested
        level: bronze
        check: "entity.tested"
        evidence: "['no expectation in the portal tests names ' + entity.scorecard + '/' + entity.name]"
        fix: "Add an expectation that pins the rule: score('<card>', '<entity>').rules['<rule>'] == 'fail' (and one that passes)."
      - name: decided-on-fixtures
        level: bronze
        check: "entity.fixture.pass + entity.fixture.fail > 0"
        evidence: "[string(entity.fixture.unknown) + ' unknown, no pass or fail on the fixtures']"
        fix: "Add fixture records the rule applies to, so it evaluates in tests."
      - name: both-outcomes-on-fixtures
        level: silver
        check: "entity.fixture.pass > 0 && entity.fixture.fail > 0"
        evidence: "['fixtures: ' + string(entity.fixture.pass) + ' pass, ' + string(entity.fixture.fail) + ' fail']"
        fix: "Give the fixtures one entity that passes and one that fails, so both paths (and the evidence) are exercised."
      - name: shows-evidence
        level: silver
        check: "entity.hasEvidence || entity.check.nodes <= 4"
        evidence: "['the check has ' + string(entity.check.nodes) + ' CEL nodes and no evidence expression']"
        fix: "Add `evidence:` naming the items that fail, so agents and people know what to change."
      - name: no-nested-loops
        level: silver
        check: "entity.check.loops <= 1 && (!has(entity.evidence) || entity.evidence.loops <= 1)"
        evidence: "['check loops ' + string(entity.check.loops) + (has(entity.evidence) ? ', evidence loops ' + string(entity.evidence.loops) : '')]"
        fix: "Avoid a comprehension inside a comprehension: compute the inner list in the connector or a computed field."
      - name: readable
        level: gold
        check: "entity.check.nodes <= 30"
        evidence: "['the check has ' + string(entity.check.nodes) + ' CEL nodes (30 or fewer reads at a glance)']"
        fix: "Move logic into a computed field or the connector, and keep the rule a short comparison."
      - name: always-explains
        level: gold
        check: "entity.hasEvidence"
        evidence: "['no evidence expression']"
        fix: "Add `evidence:` even for simple checks: it is what an agent reads first."
    facets: {summary: public, details: public}

  - name: meta-scorecard
    kind: Scorecard
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}   # a new rule or scorecard must be tested and explained from day one
    rules:
      - name: tested
        level: bronze
        check: "entity.tested"
        evidence: "['no expectation names score(' + entity.name + ', …)']"
        fix: "Add at least one expectation for the scorecard in the portal's tests."
      - name: every-level-has-rules
        level: bronze
        check: "entity.levels.all(l, l in entity.rulesPerLevel && entity.rulesPerLevel[l] > 0)"
        evidence: "entity.levels.filter(l, !(l in entity.rulesPerLevel) || entity.rulesPerLevel[l] == 0)"
        fix: "Give every level at least one rule, or drop the level."
      - name: fixtures-show-the-ladder
        level: silver
        check: "entity.fixtureLevels.size() >= 2"
        evidence: "entity.fixtureLevels.map(l, 'fixtures reach only ' + l)"
        fix: "Make the fixtures reach at least two levels (e.g. one entity at none, one at bronze or above)."
      - name: every-rule-tested
        level: gold
        check: "entity.untestedRules.size() == 0"
        evidence: "entity.untestedRules"
        fix: "Add an expectation for each untested rule."
    facets: {summary: public, details: public}

mcp:
  instructions: >-
    Toolbox for Toolbox: the catalogue of Toolbox's own crates, docs, scripts, CLI commands and MCP
    tools, agent skills and first-party connectors, scored against the maintainer, operator and user SDLC standards. To raise the bar, pick
    a failing rule with scorecard_status, read the evidence with explain (rule) or get: Crate
    undocumented, longFunctions, complexFunctions, clippy.messages, tests.output; Doc brokenLinks,
    counts; Command undocumentedArgs, documentedIn, exercisedBy; McpTool undescribedProperties,
    documentedIn, exercisedBy, viaCli; Skill frontmatterErrors, triggerCues, pronouns, missingFiles,
    secretHits, boundaryCues, evalCases; Connector documentedKinds, transport, tests, conformanceMentions, secretHits. Change the code, refresh_entity, and check the score again.
    Contract tests count when a test or script contains a tools/call body naming the tool.

