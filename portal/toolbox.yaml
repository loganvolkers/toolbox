# Toolbox for Toolbox: the portal Toolbox maintainers run on their own repository
# (docs/design/toolbox-for-toolbox.md). It catalogues our crates, docs, scripts and tests, the CLI
# commands and MCP tools we promise, and scores each against the standard of one SDLC layer
# (docs/sdlc.md). It runs locally (`scripts/self-portal.sh`): no Postgres, no OpenFGA, no network.
apiVersion: toolbox.dev/v1alpha1

portal:
  name: toolbox
  title: Toolbox for Toolbox
  owner: group:maintainers
  toolbox: "0.1"

policies:
  # Logs and reviews whose past entries are never rewritten (AGENTS.md), so wording rules
  # introduced later don't apply to them.
  historicalDocs:
    # The old single file, so the fixture that still uses that path stays skipped, and the
    # question list, which is appended to rather than rewritten.
    - docs/decisions.md
    - docs/questions.md
    - docs/research-log.md
    - docs/red-team.md
    - docs/principal-review.md
    - docs/adversarial-critique.md
    - docs/technology-critique.md
    - docs/research.md
    - docs/ocean.md
  # Scorecards whose lowest level is the repository level (D86). Unknown constituents drop out.
  # Runner-backed cards are omitted: a skipped clippy run would make the repo `none` on absent data.
  repoRollup:
    - maintainer-docs
    - maintainer-ci-security
    - maintainer-action-deps
    - maintainer-skill
    - maintainer-connector
    - maintainer-dependency
    - maintainer-agent-doc
    - maintainer-package
    - maintainer-schema
    - maintainer-example
    - maintainer-site
    - maintainer-plugin
    - maintainer-supply-chain

# How the catalog is grouped for readers (report and UI). Every kind is in one group.
kindGroups:
  - name: code
    title: Code
    description: >-
      The Rust crates, their dependencies, and the other code we maintain:
      scripts, integration tests and schemas.
    kinds: [Crate, Dependency, PackageJson, PythonScript, File, JsonSchema]
  - name: surfaces
    title: Agent and user surfaces
    description: >-
      What people and agents call: CLI commands, MCP tools, connectors, agent
      skills and plugins.
    kinds: [Command, McpTool, Connector, Skill, Plugin]
  - name: docs
    title: Docs and examples
    description: >-
      What people and agents read: design and reference docs, the public site,
      examples and agent instruction files.
    kinds: [Doc, SitePage, Example, AgentDoc]
  - name: delivery
    title: CI and supply chain
    description: >-
      How changes ship: workflows, the actions they use, OpenSSF checks and
      the repository's settings.
    kinds: [Workflow, ActionDependency, OpenSSFCheck, Repository, Lockfile]
  - name: standards
    title: Standards and judgement
    description: >-
      The portal's own model, scored like any other code: scorecards, rules,
      kinds, fields, connectors, rubrics, and the agents' assessments.
    kinds: [Scorecard, Rule, Kind, Field, PortalConnector, Rubric, Assessment]
  - name: evidence
    title: SDLC and evidence
    description: >-
      Whether Toolbox delivers: the SDLC layers and stages, DX Benchmarks, the
      products compared, and runtime observability.
    kinds: [SdlcLayer, SdlcStage, Benchmark, Product, Observability]

connectors:
  - name: workspace
    package: builtin:workspace # reads files; fast, so it resyncs often
    runtime: in-image
    config:
      root: .
      # Generated files / harness scaffolds are not scored as maintained packages.
      exclude:
        - portal/STANDARD.md
        - experiments/connector-ab/**/package.json
        - experiments/connector-repair-ab/**/package.json
      docs:
        - "*.md"
        - docs/**/*.md
        - examples/*/README.md
        - experiments/*/README.md
        - plugins/**/*.md
        - portal/*.md
        - actions/*/README.md
      files:
        - scripts/*
        - crates/*/tests/*.rs
        - examples/reference-portal/tools/*.py
        - .github/workflows/*.yml
      captures:
        # `toolbox get …`, `"$T/toolbox" serve …`, the acceptance scripts' `ask owner …`, and
        # subcommands (`toolbox assess check`)
        commands: >-
          (?:\btoolbox"?|\bask)\s+((?:connector|token|tools)\s+[a-z]+|assess[
          \t]+(?:brief|check|submit)|describe[
          \t]+(?:portal|scorecards)|[a-z][a-z-]*)
        # MCP tools/call bodies passed to the contract tests' `ok`/`call` helpers, which send
        # them (crates/toolbox-api/tests/mcp.rs), on lines that aren't comments: a quoted name
        # alone, a literal that is never sent, or one in a comment calls nothing.
        tools: (?m)^[^/#*\n]*?\b(?:ok|call)\(\s*&\w+,\s*json!\(\{\s*"name"\s*:\s*"([a-z][a-z_]*)"\s*,\s*"arguments"
      counts:
        sdlc: \bSDLC\b
        # A named layer (`maintainer SDLC`, `*operator* SDLC`), the layer model itself, or a quoted mention
        layeredSdlc: >-
          (?i:maintainer|operator|user|agent|three|four|author|portal)[*_
          ’'-]*s?[*_]*\s+SDLC\b|\bSDLC\s+(?:layers?\b|stages?\b|has\b|in
          Toolbox)|"SDLC"
      # GitHub Actions workflows and action metadata (docs/design/github-actions-standards.md)
      workflows: [.github/workflows/*.y*ml, actions/*/action.y*ml]
      # Agent skills (docs/design/skill-standards.md). The directory is the skill; SKILL.md is its manifest.
      skills: [plugins/**/SKILL.md, skills/**/SKILL.md]
      # First-party connectors (docs/design/connector-standards.md). One record per crate manifest.
      connectors: [crates/toolbox-connector-*/Cargo.toml]
      # Direct Cargo dependencies (docs/design/dependency-standards.md).
      dependencies: true
      # Agent instruction files (docs/design/agents-md-standards.md). AGENTS.md is canonical.
      # The other names are harness aliases and must point at it.
      agentDocs:
        - "**/AGENTS.md"
        - "**/CLAUDE.md"
        - "**/GEMINI.md"
        - "**/.cursorrules"
        - "**/.github/copilot-instructions.md"
        - "**/.github/instructions/*.instructions.md"
        - "**/.cursor/rules/**/*.md"
        - "**/.cursor/rules/**/*.mdc"
        - "**/.claude/rules/**/*.md"
      # Agent plugin packages (docs/design/plugin-standards.md).
      plugins: [plugins/*/plugin.json]
      # The checkout itself: supply-chain config and the repository rollup (D85, D86).
      repo: true
      # npm manifests (docs/design/package-standards.md). One record per package.json.
      packages: ["**/package.json"]
      # JSON Schema documents (docs/design/schema-standards.md). The contracts compiled into the binary.
      schemas: [schema/*.json]
      # Example and experiment write-ups (docs/design/example-standards.md).
      examples:
        - examples/**/README.md
        - experiments/**/README.md
        - docs/examples/*.md
      # Coding agents' judgements of our standards and crates (`toolbox assess`, D79)
      assessments: [portal/assessments/**/*.y*ml]
      # Starlight content pages (docs/design/site-standards.md)
      pages: [site/src/content/docs/**/*.md, site/src/content/docs/**/*.mdx]
      # The SDLC layers and their stages, declared as data (D87)
      data:
        - {kind: sdlc-layer, globs: [portal/sdlc/layers.yaml], paths: [doc]}
        - kind: sdlc-stage
          globs: [portal/sdlc/stages/*.yaml]
          paths: [docs, checks]
          commands: [commands]
          ci: [checks]
          naming: [docs]
        # DX Benchmarks, one entry per benchmark (docs/design/dx-benchmarks.md)
        - kind: benchmark
          globs: [portal/benchmarks/*.yaml]
          paths: [readme, results, prompts]
        - kind: observability
          globs: [portal/observability/*.yaml]
          paths:
          - crate
          - catalog
          - serviceNameDoc
          - promTest
          - structuredLogTest
          - alerts
          - monitorAssessment
          - otlpTestbed
        # Products compared by experiments/backstage-compare (docs/design/backstage-comparison.md)
        - {kind: product, globs: [portal/comparisons/*.yaml]}
    records:
    - crate
    - doc
    - file
    - repo
    - workflow
    - action-ref
    - skill
    - connector
    - dependency
    - agent-doc
    - plugin
    - package-json
    - json-schema
    - example
    - site-page
    - assessment
    - sdlc-layer
    - sdlc-stage
    - observability
    - benchmark
    - product
    refresh:
      crate: [external_ids]
      doc: [external_ids]
      file: [external_ids]
      repo: [external_ids]
      workflow: [external_ids]
      action-ref: [external_ids]
      skill: [external_ids]
      connector: [external_ids]
      dependency: [external_ids]
      agent-doc: [external_ids]
      plugin: [external_ids]
      package-json: [external_ids]
      json-schema: [external_ids]
      example: [external_ids]
      site-page: [external_ids]
      sdlc-layer: [external_ids]
      sdlc-stage: [external_ids]
      observability: [external_ids]
      benchmark: [external_ids]
      product: [external_ids]
    freshness:
      crate: 5m
      doc: 5m
      file: 5m
      repo: 5m
      workflow: 5m
      action-ref: 5m
      skill: 5m
      connector: 5m
      dependency: 5m
      agent-doc: 5m
      plugin: 5m
      package-json: 5m
      json-schema: 5m
      example: 5m
      site-page: 5m
      assessment: 5m
      sdlc-layer: 5m
      sdlc-stage: 5m
      observability: 5m
      benchmark: 5m
      product: 5m
  - name: runner
    package: builtin:runner # executes things; slow, so it's refreshed per entity
    runtime: in-image
    inRatchet: false # too slow for every change: CI's ratchet skips it
    config:
      root: .
      jobs:
        - name: test
          per: crate
          # Tests that need OpenFGA, Landlock or an unprivileged user fail without them, as in CI,
          # instead of returning early as passed.
          command:
          - env
          - TOOLBOX_REQUIRE_OPENFGA=1
          - TOOLBOX_REQUIRE_LANDLOCK=1
          - TOOLBOX_REQUIRE_UNPRIVILEGED=1
          - cargo
          - test
          - -q
          - -p
          - "{crate}"
          parse: cargo-test
        - name: clippy
          per: crate
          command:
          - cargo
          - clippy
          - -q
          - -p
          - "{crate}"
          - --all-targets
          - --message-format=json
          parse: clippy
        # MCP calls the contract tests actually make (TOOLBOX_MCP_TRACE), not just name (F9)
        - name: mcp-calls
          command:
          - sh
          - -c
          - >-
            TOOLBOX_MCP_TRACE="$PWD/target/mcp-trace.ndjson" cargo test -q -p
            toolbox-api --test mcp
          parse: tally
          file: target/mcp-trace.ndjson
          key: tool
    records: [test, clippy, mcp-calls]
    refresh:
      test: [external_ids]
      clippy: [external_ids]
      mcp-calls: [external_ids]
    freshness: {test: 1h, clippy: 1h, mcp-calls: 1h}
  - name: surfaces
    package: builtin:runner # the same runner, one fast job: Toolbox's own CLI and MCP surfaces
    runtime: in-image
    config:
      name: surfaces
      root: .
      jobs:
        - name: describe
          command: [target/debug/toolbox, describe]
          parse: ndjson
          kinds: [command, mcp-tool]
        # Every part of a portal as entities (docs/design/scorecards-for-scorecards.md): this
        # portal, the starter pilots copy, and the reference portal. Live outcomes come from the
        # committed results and are information only, so meta scorecards never depend on their own output.
        - name: portals
          command:
          - target/debug/toolbox
          - describe
          - portal
          - portal
          - examples/repo-portal-starter
          - examples/reference-portal
          - --results
          - portal=portal/results.json
          parse: ndjson
          kinds: [scorecard, rule, kind, field, connector, rubric]
    records:
    - command
    - mcp-tool
    - scorecard
    - rule
    - kind
    - field
    - connector
    - rubric
    refresh:
      command: [external_ids]
      mcp-tool: [external_ids]
      scorecard: [external_ids]
      rule: [external_ids]
      kind: [external_ids]
      field: [external_ids]
      connector: [external_ids]
      rubric: [external_ids]
    freshness:
      command: 5m
      mcp-tool: 5m
      scorecard: 5m
      rule: 5m
      kind: 5m
      field: 5m
      connector: 5m
      rubric: 5m

include:
  # One file per topic: its kinds, scorecards and rubrics (portal/README.md).
  - standards/*.yaml
  # Time-bound focus over those scorecards (docs/design/campaigns.md).
  - campaigns.yaml
  # Accepted failures. Each one cites a decision (docs/design/waivers.md).
  - waivers.yaml
  # Our GitHub Actions standards, as the package pilots will use (D89): connectors, tools, kinds, scorecards.
  - package: ../packages/github-actions
    with: {githubOrg: loganvolkers, githubRepo: toolbox, track: delivery}
  # OpenSSF Scorecard, an existing standard and its tool, carried as it is: its checks and scores
  # are OpenSSF's; the box adds the ratchet and a campaign (docs/design/openssf-template.md).
  # It replaces this portal's own versions of SAST and Security-Policy.
  # Every --local check but Vulnerabilities: that one asks api.osv.dev at run time, so its score
  # moves with each new advisory and reads 10 when OSV is unreachable (openssf-template.md §4).
  - package: ../packages/openssf-scorecard
    with:
      name: maintainer-openssf
      kind: OpenSSFCheck
      track: delivery
      command:
        - scorecard
        - --local
        - .
        - --format
        - json
        - --show-details
        - --checks=Binary-Artifacts,Dangerous-Workflow,Dependency-Update-Tool,Fuzzing,License,Packaging,Pinned-Dependencies,SAST,Security-Policy,Token-Permissions
  # The Python we maintain, checked by ruff (an existing tool) through the SARIF slot. ruff reads
  # its own ruff.toml; the box passes it nothing else (docs/design/toolbox-and-tools.md).
  # experiments/ are archived harnesses, not maintained code.
  - package: ../packages/sarif
    with:
      name: maintainer-python
      kind: PythonScript
      kindTitle: Python file
      track: maintainer
      tool: ruff
      version: 0.14.0
      install: {pypi: ruff, mise: pipx:ruff, aqua: astral-sh/ruff}
      command:
        - ruff
        - check
        - --no-cache
        - --output-format
        - sarif
        - --exit-zero
        # A `# noqa` would make a finding vanish from the SARIF; the only
        # suppression is a per-file ignore in ruff.toml, reviewed with a reason.
        - --ignore-noqa
        - "{files}"
      files:
        - scripts/*.py
        - examples/reference-portal/tools/*.py
        - examples/acme-live/deploy/*.py
      title: Python we maintain passes ruff
      fix: >-
        Fix ruff's findings (the record's command reruns them), or, for a
        deliberate style, ignore the rule for those files under
        `[lint.per-file-ignores]` in ruff.toml with a comment saying why. A `#
        noqa` comment doesn't help: the check runs with --ignore-noqa.
  # Known advisories in the Cargo.lock we ship, by osv-scanner offline against the RustSec OSV
  # export pinned in scripts/ci-tools.sh, so a result changes only when the pin moves
  # (D01M885GT32STM506V32XKPP37G). Each accepted advisory is ignored in osv-scanner.toml with
  # its reason. The experiments' lockfiles are archived harnesses, not shipped.
  - package: ../packages/sarif
    with:
      name: maintainer-advisories
      kind: Lockfile
      track: maintainer
      tool: osv-scanner
      version: 2.7.1
      install: {mise: aqua:google/osv-scanner, aqua: google/osv-scanner}
      command:
        - osv-scanner
        - scan
        - source
        - --offline
        - --format
        - sarif
        - --lockfile
        - "{files}"
      files: [Cargo.lock]
      title: No unexplained advisories in Cargo.lock
      fix: >-
        Upgrade the crate past the advisory (`cargo update -p <crate>`), or,
        when no fix exists or it doesn't apply, ignore its id under
        `[[IgnoredVulns]]` in osv-scanner.toml with a reason that says why and
        what ends it. Leave out `effectiveUntil`: an expiry changes the result
        with no change to the repository.
  # A ruff ignore hides findings from maintainer-python, so each must say why on the line above
  # it (ruff.toml is under CODEOWNERS). A jig: a regex over one config file.
  - package: ../packages/pattern-count
    with:
      name: maintainer-python-ignores
      kind: LintConfig
      title: Every ruff ignore says why
      files: [ruff.toml]
      pattern: >-
        (?m)^[^#\n][^\n]*\n\s*(?:"[^"\n]+"\s*=\s*\[|(?:extend-)?ignore\s*=\s*\[)|\A\s*(?:"[^"\n]+"\s*=\s*\[|(?:extend-)?ignore\s*=\s*\[)
      fix: >-
        Put a comment on the line above each listed ignore in ruff.toml saying
        why the rule doesn't apply to those files, or fix the findings and
        remove the ignore.

mcp:
  instructions: >-
    Toolbox for Toolbox: the catalogue of Toolbox's own crates, docs,
    scripts, CLI commands and MCP tools, agent skills, first-party
    connectors, direct Cargo dependencies, agent instruction files, npm
    manifests, JSON Schemas, example write-ups, agent plugins, public docs
    pages and the repository rollup, scored against the maintainer, operator
    and user SDLC standards. To raise the bar, pick a failing rule with
    scorecard_status, read the evidence with explain (rule) or get: Crate
    undocumented, longFunctions, complexFunctions, clippy.messages,
    tests.output; Doc brokenLinks, counts; Command undocumentedArgs,
    documentedIn, exercisedBy; McpTool undescribedProperties, documentedIn,
    exercisedBy, viaCli; Skill frontmatterErrors, triggerCues, pronouns,
    missingFiles, secretHits, boundaryCues, evalCases; Connector
    documentedKinds, transport, tests, conformanceMentions, secretHits;
    Dependency requirements, versions, sources, usedBy; AgentDoc
    missingFiles, commandLines, ciMissingCommands, secretHits, hiddenChars;
    PackageJson wildcardRanges, gitRanges, lockfile, checkScripts,
    ciUsesInstall; JsonSchema dialect, schemaId, externalRefs; Example
    missingFiles, commandLines; Plugin misplacedSkills, headerSecrets,
    pathEscapes, commandToken; SitePage missingFiles, inSidebar, secretHits;
    Repository dependabotGaps, codeScanning, securityPolicy, workflowOwners.
    Change the code, refresh_entity, and check the score again. Contract
    tests count when a test or script contains a tools/call body (name and
    arguments) naming the tool, outside a comment.

tests: [tests/standards.test.yaml]
