# Time-bound focus over continuous scorecards (docs/design/campaigns.md, D01M7Y11G0YZT23W26Z9D3XW68Y).
# Included by portal/toolbox.yaml.

tracks:
  - name: maintainer
    title: Code quality
    owner: group:maintainers
    description: >-
      Toolbox's own code: the Rust crates, their dependencies, schemas,
      connectors, scripts and runtime signals, and the repository level they
      roll up to.
    links:
    - {title: Maintainer SDLC, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/maintainer-sdlc.md"}
    - {title: Toolbox for Toolbox, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/toolbox-for-toolbox.md"}
  - name: delivery
    title: CI and supply chain
    owner: group:maintainers
    description: >-
      How a change ships: workflows that are secure, reliable and fast,
      pinned actions, OpenSSF checks and the repository's security settings.
    links:
    - {title: GitHub Actions standards, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/github-actions-standards.md"}
    - {title: OpenSSF Scorecard, url: "https://scorecard.dev/"}
  - name: docs
    title: Docs people and agents read
    owner: group:maintainers
    description: >-
      Design docs, the public site, examples agents copy and the agent
      instruction files: each current, linked and readable.
    links:
    - {title: Writing style rules, url: "https://github.com/loganvolkers/toolbox/blob/main/AGENTS.md"}
  - name: operator
    title: Operator experience
    owner: group:maintainers
    description: >-
      What portal authors and their agents touch: CLI commands, MCP tools,
      and the agent skills and plugins that teach them.
    links:
    - {title: Operator SDLC, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/sdlc.md"}
    - {title: Agent plugins, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/agent-plugins.md"}
  - name: standards
    title: Standards that check themselves
    owner: group:maintainers
    description: >-
      The portal's scorecards, rules, kinds and assessments, scored for form
      by deterministic checks and for quality by independent agent reviews.
    links:
    - {title: Scorecards for scorecards, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md"}
    - {title: Do the meta scorecards measure anything?, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/meta-standards-review.md"}
  - name: evidence
    title: Proving value
    owner: group:maintainers
    description: >-
      Whether Toolbox delivers on its claims: every SDLC layer and stage
      covered, and DX Benchmarks run on real forks against the strongest
      alternative.
    links:
    - {title: The four SDLC layers, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/sdlc.md"}
    - {title: DX Benchmarks, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/dx-benchmarks.md"}
  - name: vs-backstage
    title: Against Backstage
    owner: group:maintainers
    description: >-
      Toolbox and Backstage 1.57, installed as each project documents and run
      on the same machine and Postgres 16, scored on the same rules, factor by
      factor. A scripted harness measures both: medians of 5 runs on a
      10,000-component catalog, plus probes and facts with evidence. A fresh
      agent adjudicated the result. Toolbox is behind on a factor if it is
      behind on any of its rules.
    links:
    - {title: Results, url: "https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md"}
    - {title: How it was run, url: "https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/README.md"}
    - {title: Adjudication, url: "https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/ADJUDICATION.md"}
    - {title: Design, url: "https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md"}

campaigns:
  - name: skill-silver
    title: Skills to silver
    track: operator
    owner: group:maintainers
    description: Every shipped agent skill reaches silver on maintainer-skill.
    start: 2026-11-01
    end: 2026-12-31
    targetPercent: 100
    milestones: [{name: half, targetPercent: 50}]
    includes: [{scorecard: maintainer-skill, atLeast: silver}]
  - name: cli-skill-coverage
    title: CLI skills present
    track: operator
    owner: group:maintainers
    description: Every CLI command that needs a skill has one (cli-skill bronze).
    start: 2026-11-01
    end: 2027-03-31
    targetPercent: 100
    includes: [{scorecard: cli-skill, atLeast: bronze}]
  - name: close-review-findings
    title: Close the open review findings
    track: standards
    owner: group:maintainers
    description: >-
      Act on every current rule-quality and scorecard-quality finding: fix the
      standard, or answer the finding in a new, independent assessment
      (docs/design/meta-standards-review.md).
    start: 2026-11-23
    end: 2027-02-28
    targetPercent: 100
    milestones: [{name: half, targetPercent: 50}]
    includes:
    - {scorecard: review-rule, atLeast: bronze}
    - {scorecard: review-scorecard, atLeast: bronze}
