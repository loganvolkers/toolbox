# Design docs, scripts and tests (docs/design/maintainer-sdlc.md).
# Included by portal/toolbox.yaml; see portal/README.md for the layout.

kinds:
  - name: Doc
    description: >-
      A markdown document: its links, status banner, sources and the SDLC
      layer it names.
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      title: {type: string}
      words: {type: integer}
      hasStatus: {type: boolean}
      hasSources: {type: boolean}
      brokenLinks: {type: list, items: string}
      counts: {type: object}
      lastChange: {type: string}
      missingDecisions:
        type: list
        items: string
        description: >-
          Decision ids cited in the doc that are not a file in docs/decisions/. A
          legacy D number and a D plus ULID both count.
      area:
        type: string
        computed: >-
          entity.path.startsWith('docs/design/') ? 'design' :
          entity.path.startsWith('docs/') ? 'docs' :
          entity.path.startsWith('examples/') ||
          entity.path.startsWith('experiments/') ? 'example' : 'repo'
    relations:
      mentionsCommand: {to: Command, many: true, unresolved: ignore} # candidates from captures/code spans
      mentionsTool: {to: McpTool, many: true, unresolved: ignore} # candidates from captures/code spans
      mentionsCrate: {to: Crate, many: true, unresolved: ignore} # candidates from captures/code spans
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/doc
      id: "'doc:' + record.path"
      set: >-
        {'path': record.path, 'title': record.title, 'words': record.words,
         'hasStatus': record.hasStatus, 'hasSources': record.hasSources,
         'brokenLinks': record.brokenLinks, 'counts': record.counts, 'lastChange': record.lastChange,
         'missingDecisions': record.missingDecisions}
      relations:
        mentionsCommand: record.captures.commands.map(c, 'command:' + c)
        mentionsTool: record.codeSpans.map(s, 'mcp-tool:' + s)
        mentionsCrate: record.codeSpans.map(s, 'crate:' + s)

  - name: File
    description: >-
      A script or integration test, with the commands and MCP tools it
      exercises.
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      extension: {type: string}
      lines: {type: integer}
      lastChange: {type: string}
    relations:
      exercisesCommand: {to: Command, many: true, unresolved: ignore} # candidates from captures/code spans
      exercisesTool: {to: McpTool, many: true, unresolved: ignore} # candidates from captures/code spans
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/file
      id: "'file:' + record.path"
      set: >-
        {'path': record.path, 'extension': record.extension, 'lines':
        record.lines, 'lastChange': record.lastChange}
      relations:
        exercisesCommand: record.captures.commands.map(c, 'command:' + c)
        exercisesTool: record.captures.tools.map(t, 'mcp-tool:' + t)

scorecards:
  - name: maintainer-docs
    title: Design and reference docs
    kind: Doc
    description: >-
      Each design and reference doc: links that resolve, its SDLC layer named,
      cited decisions that exist, a status banner and its sources (D84).
    rationale: >-
      Agents read these docs as the source of intent, so a dead link, an
      unnamed SDLC layer or a decision id that names no file sends them to the
      wrong place or nowhere. Bronze is the pointers; silver is what lets a
      reader trust a design doc: what is decided and built, and where its
      claims come from.
    links:
    - title: Toolbox for Toolbox standards
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/toolbox-for-toolbox.md
    - title: Maintainer SDLC
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/maintainer-sdlc.md
    owner: group:maintainers
    track: docs
    levels: [bronze, silver]
    appliesTo: >-
      !(entity.path in policy.historicalDocs) &&
      !entity.path.startsWith('docs/decisions/')
    rules:
    - name: links-resolve
      level: bronze
      check: entity.brokenLinks.size() == 0
      evidence: entity.brokenLinks
      fix: Fix or remove the relative links in the evidence.
      rationale: >-
        A file move or rename breaks the links to it without failing any build,
        and the reader who follows one loses the context the doc relies on.
    - name: names-sdlc-layer
      level: bronze
      check: entity.counts.sdlc <= entity.counts.layeredSdlc
      evidence: >-
        [string(entity.counts.sdlc - entity.counts.layeredSdlc) + ' mention(s)
        of "SDLC" without a layer']
      fix: >-
        Say which SDLC you mean: maintainer, operator or user (docs/sdlc.md,
        D63).
      rationale: >-
        Toolbox has four SDLC layers with different builders and checks, so a
        bare "SDLC" leaves the reader to guess whose loop the doc is about.
      links:
      - title: The four SDLC layers
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/sdlc.md
    - name: cited-decisions-exist
      level: bronze
      check: entity.missingDecisions.size() == 0
      evidence: entity.missingDecisions
      fix: >-
        The decision ids in the evidence are not files in docs/decisions/. Cite
        one that exists, or add the file. Mint the id with python3
        scripts/decision-id.py.
      rationale: >-
        Decision files are the source of truth for what is decided. A cited id
        with no file makes a claim look settled when a reader cannot check what,
        if anything, was decided.
      links:
      - title: Decision citations
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/decision-citations.md
      - title: D84 cited decisions exist
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7WMSMS30000000000000000.md
    - name: status-banner
      level: silver
      check: entity.area != 'design' || entity.hasStatus
      evidence: "['design doc with no *Status:* line']"
      fix: >-
        Start the design doc under `docs/design/` with a `*Status:*` line saying
        what is decided and what is built.
      rationale: >-
        A design doc mixes decided, built and deferred material. Without the
        banner a reader or agent can implement something that was deferred, and
        where the banner and the body disagree the banner wins.
    - name: cites-sources
      level: silver
      check: entity.area != 'design' || entity.hasSources
      evidence: "['design doc with no ## Sources section']"
      fix: >-
        End the design doc with a `## Sources` section (AGENTS.md working
        rules).
      rationale: >-
        Design docs make claims about other tools, standards and vendors. A
        Sources section lets a reader check them against primary sources instead
        of taking them on trust.
      links:
      - title: AGENTS.md working rules
        url: https://github.com/loganvolkers/toolbox/blob/main/AGENTS.md#working-rules-maintainer-sdlc
    facets: {summary: public, details: public}
