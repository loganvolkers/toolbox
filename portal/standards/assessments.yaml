# Judgement pushed by coding agents, and its standards (D79, D80).
# Included by portal/seikika.yaml; see portal/README.md for the layout.

kinds:
  - name: Assessment
    description: >-
      One coding agent's (or person's) judgement of one entity against a
      rubric: a file in portal/assessments/, written after `seikika assess
      brief`.
    identityFrom: [connector:workspace]
    fields:
      entity: {type: string, description: The entity assessed.}
      rubric: {type: string, description: The rubric it was assessed against.}
      subjectHash:
        type: string
        description: The entity's hash when assessed; a different hash now means stale.
      assessorName:
        type: string
        description: The agent harness or person (assessor.name).
      assessorKind: {type: string, description: agent or person.}
      at: {type: string, description: When it was assessed.}
      verdict:
        type: string
        description: fail if any criterion failed, else unsure if any was unsure, else pass.
      failing: {type: list, items: string, description: Criteria that failed.}
      unsure:
        type: list
        items: string
        description: Criteria the assessor could not decide.
      reasons:
        type: list
        items: string
        description: "One line per criterion: verdict, name and reason."
      summary: {type: string, description: "The assessor's summary."}
      path: {type: string, description: The file it was read from.}
      unsuggested:
        type: list
        items: string
        description: Criteria judged fail or unsure without a suggestion.
      uncited:
        type: list
        items: string
        description: >-
          Criteria whose reason cites nothing that resolves in the repository: a
          path that exists, a file name only one file has, a decision or question
          id that exists, or a URL.
      hash:
        type: string
        description: >-
          Content hash of the assessment: what an assessment-quality review of it
          is versioned by.
      cited:
        type: list
        items: string
        description: The repository files its reasons cite (paths that exist).
      groundedIn:
        type: list
        items: string
        description: >-
          For a review: what it cites that its subject also cites, or the
          subject's own file. Empty for a review that cites only unrelated files.
      independentReview:
        type: string
        description: >-
          Verdict of a current review of this assessment by another named assessor
          that is grounded in it: pass, fail, unsure, or empty when there is none.
      reviewState:
        type: string
        description: "assessment-quality review: fresh, stale or missing."
        computed: >-
          inbound.assessesAssessment.size() == 0 ? 'missing' :
          (inbound.assessesAssessment[0].subjectHash == entity.hash ? 'fresh' :
          'stale')
      reviewFailing:
        type: list
        items: string
        description: Criteria the assessment-quality review failed.
        computed: >-
          inbound.assessesAssessment.size() == 0 ? [] :
          inbound.assessesAssessment[0].failing
      reviewUnsure:
        type: list
        items: string
        description: Criteria the reviewer was unsure of.
        computed: >-
          inbound.assessesAssessment.size() == 0 ? [] :
          inbound.assessesAssessment[0].unsure
      reviewUncited:
        type: list
        items: string
        description: >-
          Criteria whose reasons in the current review cite nothing that resolves
          in the repository: a review that can't be checked.
        computed: >-
          inbound.assessesAssessment.size() == 0 ? [] :
          inbound.assessesAssessment[0].uncited
      reviewGrounded:
        type: boolean
        description: >-
          The current review cites this assessment's file or a source it cites,
          rather than only unrelated files.
        computed: >-
          inbound.assessesAssessment.size() > 0 &&
          inbound.assessesAssessment[0].groundedIn.size() > 0
      selfReviewed:
        type: boolean
        description: >-
          The assessment-quality review was written by the same assessor as the
          assessment, so it is no independent check.
        computed: >-
          inbound.assessesAssessment.size() > 0 && has(entity.assessorName) &&
          inbound.assessesAssessment[0].assessorName == entity.assessorName
    relations:
      assessesAssessment: {to: Assessment, many: false, unresolved: ignore}
      assessesSdlcStage: {to: SdlcStage, many: false, unresolved: ignore}
      assessesRule: {to: Rule, many: false, unresolved: ignore}
      assessesScorecard: {to: Scorecard, many: false, unresolved: ignore}
      assessesCrate: {to: Crate, many: false, unresolved: ignore}
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/assessment
      id: "'assessment:' + record.rubric + '/' + record.entity"
      set: >-
        {'entity': record.entity, 'rubric': record.rubric, 'subjectHash': record.subjectHash,
         'assessorName': has(record.assessor.name) ? record.assessor.name : null, 'assessorKind': record.assessor.kind,
         'at': string(record.at), 'verdict': record.verdict, 'failing': record.failing, 'unsure': record.unsure,
         'reasons': record.verdicts.map(v, v.verdict + ' ' + v.criterion + ': ' + v.reason),
         'summary': record.summary, 'path': record.path, 'unsuggested': record.unsuggested,
         'uncited': record.uncited, 'hash': record.hash,
         'cited': has(record.cited) ? record.cited : [],
         'groundedIn': has(record.groundedIn) ? record.groundedIn : [],
         'independentReview': has(record.independentReview) ? record.independentReview : ''}
      relations:
        assessesAssessment: "record.entity.startsWith('assessment:') ? [record.entity] : []"
        assessesSdlcStage: "record.entity.startsWith('sdlc-stage:') ? [record.entity] : []"
        assessesRule: "record.entity.startsWith('rule:') ? [record.entity] : []"
        assessesScorecard: "record.entity.startsWith('scorecard:') ? [record.entity] : []"
        assessesCrate: "record.entity.startsWith('crate:') ? [record.entity] : []"

scorecards:
  # Deterministic, so ratcheted: what any assessment must contain to be worth reading.
  - name: meta-assessment
    title: Assessments are well-formed
    kind: Assessment
    description: >-
      What every assessment must contain to be worth reading: a named
      assessor, suggestions for findings and citations that resolve in the
      repository (D80).
    rationale: >-
      Agents act on assessments and review cards read them, so a malformed one
      misleads twice: a finding without a suggestion can't be acted on, and a
      reason without a citation can't be checked. Bronze is the ratcheted
      floor every new assessment must meet; silver and gold ask for citations,
      first on findings, then on every verdict.
    links:
    - title: 'Decision: assessments are scored'
      url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M7WJVW700000000000000000.md
    - title: Scorecards for scorecards
      url: https://github.com/seikika/seikika/blob/main/docs/design/scorecards-for-scorecards.md#61-assessments-and-rubrics-are-standards-too-d80
    - title: assess-entity skill
      url: https://github.com/seikika/seikika/blob/main/plugins/seikika-operator/skills/assess-entity/SKILL.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze} # a new assessment must name its assessor and suggest fixes
    rules:
    - name: suggests-fixes
      level: bronze
      check: entity.unsuggested.size() == 0
      evidence: entity.unsuggested
      fix: >-
        Add a `suggestion:` to each listed fail or unsure verdict: the change
        that would make it pass.
      rationale: >-
        A fail or unsure verdict with no suggested change leaves the reader to
        rediscover the fix, so the finding tends to go unacted.
    - name: assessor-named
      level: bronze
      check: has(entity.assessorName) && entity.assessorName.size() > 0
      evidence: "['assessor.name is empty']"
      fix: >-
        Set `assessor.name` to the agent harness or person who made the
        assessment.
      rationale: >-
        An unnamed assessment can't be weighed or challenged, and
        review-assessment needs the name to tell an independent review from a
        self-review.
    - name: cites-for-findings
      level: silver
      check: >-
        entity.uncited.filter(c, c in entity.failing || c in
        entity.unsure).size() == 0
      evidence: entity.uncited.filter(c, c in entity.failing || c in entity.unsure)
      fix: >-
        In the assessment file under portal/assessments/, cite what each listed
        fail or unsure reason rests on, in a form a reader can open: a
        repository path (`crates/x/src/lib.rs:40`), a file name only one file
        has, a decision or question id that exists (D71, Q10), or a full URL. A
        section sign or a bare number alone isn't checkable.
      rationale: >-
        A finding that cites nothing a reader can open can be neither verified
        nor disputed; on the first run, 6 of 9 assessments fell below silver
        because their reasons named a behaviour without a path or a number.
    - name: cites-everything
      level: gold
      check: entity.uncited.size() == 0
      evidence: entity.uncited
      fix: >-
        Cite a source in every listed reason, passes included, in the same forms
        as cites-for-findings (a path, a unique file name, an existing decision
        or question id, a URL), so a reviewer can check the verdict.
      rationale: >-
        A pass is a claim too; without a citation a reviewer can't tell a
        checked pass from a guess, and a wrong pass hides a problem the
        assessment was meant to find.
    facets: {summary: public, details: public}

  # Judgement of judgement. Stops here: reviews made with assessment-quality are not reviewed.
  - name: review-assessment
    title: Assessments, reviewed
    kind: Assessment
    description: >-
      Each assessment reviewed against assessment-quality by another assessor,
      advisory; reviews of reviews are not made (D80,
      D01M831P5QWJQ4A2FT85N5MXJQF).
    rationale: >-
      A deterministic check sees that an assessment cites something, not that
      the source says what the reason claims; a second assessor's review
      checks that. Reviews stop at one level, so assessments made with
      assessment-quality are skipped, and the card is advisory because a
      review goes stale on every edit.
    links:
    - title: 'Decision: assessments are reviewed'
      url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M7WJVW700000000000000000.md
    - title: Findings first decision
      url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M831P5QWJQ4A2FT85N5MXJQF.md
    - title: Meta standards review
      url: https://github.com/seikika/seikika/blob/main/docs/design/meta-standards-review.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    appliesTo: entity.rubric != 'assessment-quality'
    rules:
    - name: no-open-findings
      level: bronze
      check: entity.reviewFailing.size() == 0
      evidence: >-
        entity.reviewState == 'stale' ? entity.reviewFailing.map(c, c + ' (from
        a stale review: re-assess to close it)') : entity.reviewFailing
      fix: >-
        A current assessment-quality assessment failed the listed criteria: act
        on its suggestions (portal/assessments/), then re-assess. If the finding
        is wrong, say why in a new assessment by another assessor.
      rationale: >-
        Failing reviews were lost among the unreviewed lines and went unacted
        for days; putting the assessment at none makes an open finding head the
        report until it is fixed or disputed.
    - name: assessed
      level: silver
      check: entity.reviewState == 'fresh' && !entity.selfReviewed
      evidence: >-
        [entity.selfReviewed ? 'reviewed by its own assessor, ' +
        entity.assessorName : (entity.reviewState == 'stale' ? 'the assessment
        changed since it was reviewed' : 'not reviewed against
        assessment-quality')]
      fix: >-
        Run `seikika assess brief <assessment id> --portal portal`; a different
        agent or person should review it.
      rationale: >-
        A review by the assessment's own assessor repeats its blind spots and is
        no independent check; one of the first three assessment reviews was a
        self-review.
    - name: passes-review
      level: gold
      check: >-
        entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0 &&
        entity.reviewUncited.size() == 0 && entity.reviewGrounded
      evidence: >-
        entity.reviewState != 'fresh' ? ['no current review'] :
        entity.reviewFailing + entity.reviewUncited.map(c, c + ' cites nothing
        that resolves (fix the review)') + (entity.reviewGrounded ? [] : ['the
        review cites neither this assessment nor anything it cites (fix the
        review)'])
      fix: >-
        For a listed criterion, revise the assessment file in
        portal/assessments/ where the review found it unsupported or incomplete,
        then have it reviewed again. For an item marked "fix the review", the
        review file is at fault: its reasons must cite what they rest on,
        including this assessment's file or the sources it cites.
      rationale: >-
        Gold means an independent reviewer checked the assessment against its
        own sources and found it sound; a review that cites only unrelated files
        can't have checked it.
    - name: no-doubts
      level: gold
      check: entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0
      evidence: >-
        entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current
        review']
      fix: >-
        Resolve what the reviewer was unsure of, usually by citing the source a
        verdict rests on.
      rationale: >-
        A reviewer's doubt usually means a verdict rests on taste rather than a
        cited source, so a second assessor reading the same sources might reach
        a different one.
    facets: {summary: public, details: public}

rubrics:
  # What a coding agent judges, given `seikika assess brief` (or the assessment_brief MCP tool).
  # Criteria are questions a deterministic check can't answer; anything a check can answer belongs
  # in a scorecard rule instead (docs/design/scorecards-for-scorecards.md §6).
  - name: assessment-quality
    kind: Assessment
    description: >-
      Is this assessment trustworthy? Read the assessment, then the sources
      its reasons cite, and the entity it judges (seikika get <entity>).
      Review someone else's assessment, not your own.
    criteria:
    - name: supported
      question: Is every verdict supported by the sources its reason cites?
      guidance: >-
        Open each cited file, decision or number. Fail when a cited source
        doesn't say what the reason claims.
    - name: complete
      question: >-
        Did the assessment get every criterion right, missing no failure the
        sources show?
      guidance: >-
        Fail and name the criterion that should have failed or been unsure, with
        the evidence.
    - name: reproducible
      question: >-
        Would a second assessor, reading the same sources, reach the same
        verdicts?
      guidance: >-
        Unsure when a verdict rests on taste rather than on something the
        sources state.
    - name: actionable
      question: >-
        Would following the suggestions change the verdicts they are attached
        to?
      guidance: >-
        Fail when a suggestion improves something else (another rule, the
        scorecard) but leaves this entity's verdict as it is.
