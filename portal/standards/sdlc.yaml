# The SDLC layers and their stages (docs/sdlc.md, D87).
# Included by portal/toolbox.yaml; see portal/README.md for the layout.

kinds:
  - name: SdlcLayer
    description: >-
      One SDLC layer: maintainer, package author, operator or user, with the
      stages it needs.
    identityFrom: [connector:workspace]
    fields:
      title: {type: string, description: The layer's name.}
      who: {type: string, description: Who works in this layer.}
      builds: {type: string, description: What they build.}
      doc: {type: string, description: The layer's design doc.}
      stages:
        type: list
        items: string
        description: The stages this layer needs, in order.
      missingPaths: {type: list, items: string, description: Declared paths that don't exist.}
      definedStages: {type: list, items: string, description: Stages declared for this layer., computed: "inbound.stageOf.map(s, s.name)"}
      stagesMissing:
        type: list
        items: string
        description: >-
          Stages that are missing in fact: declared missing, or with no doc that
          exists and names the stage, whatever their status says.
        computed: >-
          inbound.stageOf.filter(s, s.status == 'missing' || s.namedIn.size() ==
          0).map(s, s.name + (s.status == 'missing' ? '' : ' (no doc that exists
          and names it)'))
      stagesNotBuilt: {type: list, items: string, description: "Stages not yet built (partial, designed or missing).", computed: "inbound.stageOf.filter(s, s.status != 'built').map(s, s.name + ' (' + s.status + ')')"}
    sources: {default: [connector:workspace]}
    map:
      - from: workspace/sdlc-layer
        id: "'sdlc:' + record.id"
        set: >-
          {'title': record.title, 'who': record.who, 'builds': record.builds, 'doc': record.doc,
           'stages': record.stages, 'missingPaths': record.missingPaths}

  - name: SdlcStage
    description: "One stage of an SDLC layer: what it is for, its exit criterion, the commands and checks that carry it out, and its open gaps."
    identityFrom: [connector:workspace]
    fields:
      layer: {type: string, description: The layer it belongs to.}
      name: {type: string, description: The stage's name.}
      order: {type: integer, description: Position in the layer.}
      intent: {type: string, description: What the stage is for.}
      exitCriterion:
        type: string
        description: What must be true to leave the stage.
      commands:
        type: list
        items: string
        description: Commands a person or agent runs in this stage.
      checks:
        type: list
        items: string
        description: Files that verify the stage (CI workflows, scripts, tests).
      docs:
        type: list
        items: string
        description: Docs that describe the stage.
      status:
        type: string
        description: built, partial, designed or missing.
      gaps:
        type: list
        items: string
        description: What is missing for the stage to be built.
      missingPaths: {type: list, items: string, description: Declared docs or checks that don't exist.}
      unresolvedCommands:
        type: list
        items: string
        description: >-
          Commands whose program is neither a known tool nor a file in the
          repository (so `echo` or a script never written doesn't count).
      notInCi:
        type: list
        items: string
        description: Declared checks that no GitHub Actions workflow runs.
      notNaming:
        type: list
        items: string
        description: >-
          Declared docs that exist but never mention the stage's name, so they
          don't describe it.
      namedIn:
        type: list
        items: string
        description: Declared docs that exist and mention the stage's name.
      hash:
        type: string
        description: >-
          Content hash of the declaration; assessments of it go stale when it
          changes.
      reviewState:
        type: string
        description: "sdlc-stage-quality assessment: fresh, stale or missing."
        computed: >-
          inbound.assessesSdlcStage.size() == 0 ? 'missing' :
          (inbound.assessesSdlcStage[0].subjectHash == entity.hash ? 'fresh' :
          'stale')
      reviewFailing:
        type: list
        items: string
        description: Criteria the sdlc-stage-quality assessment failed.
        computed: >-
          inbound.assessesSdlcStage.size() == 0 ? [] :
          inbound.assessesSdlcStage[0].failing
      reviewUnsure:
        type: list
        items: string
        description: Criteria the assessor was unsure of.
        computed: >-
          inbound.assessesSdlcStage.size() == 0 ? [] :
          inbound.assessesSdlcStage[0].unsure
      reviewUncited:
        type: list
        items: string
        description: >-
          Criteria whose reasons in the current review cite nothing that resolves
          in the repository: a review that can't be checked.
        computed: >-
          inbound.assessesSdlcStage.size() == 0 ? [] :
          inbound.assessesSdlcStage[0].uncited
    relations: {stageOf: {to: SdlcLayer, many: false}}
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/sdlc-stage
      id: "'sdlc-stage:' + record.id"
      set: >-
        {'layer': record.layer, 'name': record.name, 'order': record.order, 'intent': record.intent,
         'exitCriterion': record.exitCriterion, 'commands': record.commands, 'checks': record.checks,
         'docs': record.docs, 'status': record.status, 'gaps': record.gaps,
         'missingPaths': record.missingPaths, 'hash': record.hash,
         'unresolvedCommands': has(record.unresolvedCommands) ? record.unresolvedCommands : [],
         'notInCi': has(record.notInCi) ? record.notInCi : [],
         'notNaming': has(record.notNaming) ? record.notNaming : [],
         'namedIn': has(record.namedIn) ? record.namedIn : record.docs}
      relations: {stageOf: "['sdlc:' + record.layer]"}

scorecards:
  - name: sdlc-stage
    kind: SdlcStage
    description: >-
      Each stage of an SDLC layer, checked against facts: an exit criterion, a
      doc that exists, commands that resolve, checks CI runs, and status built
      (D87, docs/sdlc.md).
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: none} # a newly identified stage may start missing; that is the point
    rules:
    - name: status-known
      level: bronze
      check: entity.status in ['built', 'partial', 'designed', 'missing']
      evidence: "['status is ' + entity.status]"
      fix: >-
        Set `status:` in portal/sdlc/stages/<layer>.yaml to built, partial,
        designed or missing.
    - name: has-exit-criterion
      level: bronze
      check: entity.exitCriterion.size() >= 20
      evidence: "['exit criterion: ' + entity.exitCriterion]"
      fix: >-
        Write the exit criterion as something checkable: the command that
        passes, or the artifact that exists.
    - name: documented
      level: bronze
      check: entity.docs.size() > 0 && entity.missingPaths.size() == 0
      evidence: >-
        entity.docs.size() == 0 ? ['no doc describes the stage'] :
        entity.missingPaths.map(p, p + ' does not exist')
      fix: >-
        Point `docs:` (and `checks:`) in portal/sdlc/stages/<layer>.yaml at
        files that exist; write the doc if it doesn't.
    - name: agent-operable
      level: silver
      check: >-
        entity.commands.size() > 0 && entity.unresolvedCommands.size() == 0
      evidence: >-
        entity.commands.size() == 0 ? ['no command an agent can run carries out
        ' + entity.layer + '/' + entity.name] : entity.unresolvedCommands.map(c,
        c + ' runs no known tool or repository file')
      fix: >-
        List under `commands:` a command that carries out the stage: a known
        tool (toolbox, cargo, npm, python3 …) or a script that exists in the
        repository. Fix or remove each listed command.
    - name: automated
      level: silver
      check: entity.checks.size() > 0 && entity.notInCi.size() == 0
      evidence: >-
        entity.checks.size() == 0 ? ['nothing in CI or a script verifies ' +
        entity.layer + '/' + entity.name] : entity.notInCi.map(c, c + ' is not
        run by any workflow')
      fix: >-
        Add a CI step, acceptance script or test that proves the exit criterion,
        list it under `checks:`, and run each listed check from a workflow in
        .github/workflows.
    - name: built
      level: gold
      check: entity.status == 'built' && entity.gaps.size() == 0
      evidence: "entity.gaps.size() > 0 ? entity.gaps : ['status is ' + entity.status]"
      fix: "Close the listed gaps, then set `status: built` and empty `gaps:`."
    facets: {summary: public, details: public}

  - name: sdlc-layer
    kind: SdlcLayer
    description: >-
      Each SDLC layer as a whole: every stage declared, none missing in fact,
      and all built (D87, docs/sdlc.md).
    owner: group:maintainers
    levels: [bronze, silver, gold]
    rules:
    - name: stages-declared
      level: bronze
      check: entity.stages.all(s, s in entity.definedStages)
      evidence: entity.stages.filter(s, !(s in entity.definedStages))
      fix: >-
        Declare each listed stage in portal/sdlc/stages/<layer>.yaml, even if
        its status is missing.
    - name: nothing-missing
      level: silver
      check: entity.stagesMissing.size() == 0
      evidence: entity.stagesMissing
      fix: >-
        For each listed stage in portal/sdlc/stages/<layer>.yaml, write the
        design (a doc, or a section of one, that names the stage), point `docs:`
        at it, then set `status:` to designed, partial or built. A status alone
        doesn't count, nor does a listed doc that is missing or never names the
        stage.
    - name: every-stage-built
      level: gold
      check: entity.stagesNotBuilt.size() == 0
      evidence: entity.stagesNotBuilt
      fix: Raise each listed stage to built (see sdlc-stage for what each lacks).
    facets: {summary: public, details: public}

  - name: review-sdlc-stage
    kind: SdlcStage
    description: >-
      Agents' judgement of each SDLC stage against sdlc-stage-quality,
      advisory: an open finding is none, a current review is silver, a clean
      and cited one is gold (D79, D01M831P5QWJQ4A2FT85N5MXJQF).
    owner: group:maintainers
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    rules:
    - name: no-open-findings
      level: bronze
      check: entity.reviewFailing.size() == 0
      evidence: >-
        entity.reviewState == 'stale' ? entity.reviewFailing.map(c, c + ' (from
        a stale review: re-assess to close it)') : entity.reviewFailing
      fix: >-
        A current sdlc-stage-quality assessment failed the listed criteria: act
        on its suggestions (portal/assessments/), then re-assess. If the finding
        is wrong, say why in a new assessment by another assessor.
    - name: assessed
      level: silver
      check: entity.reviewState == 'fresh'
      evidence: >-
        [entity.reviewState == 'stale' ? 'the stage changed since it was
        assessed' : 'not assessed against sdlc-stage-quality']
      fix: >-
        Run `toolbox assess brief sdlc-stage:<layer>/<stage> --portal portal`,
        have your agent write the assessment, then `toolbox assess check
        portal`.
    - name: passes-review
      level: gold
      check: >-
        entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0 &&
        entity.reviewUncited.size() == 0
      evidence: >-
        entity.reviewState != 'fresh' ? ['no current assessment'] :
        entity.reviewFailing + entity.reviewUncited.map(c, c + ' cites nothing
        that resolves')
      fix: >-
        Act on the failing criteria's suggestions in the assessment
        (portal/assessments/), then re-assess.
    - name: no-doubts
      level: gold
      check: entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0
      evidence: >-
        entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current
        assessment']
      fix: >-
        Resolve what the assessor was unsure of, usually a missing measurement
        or an unstated exit criterion.
    facets: {summary: public, details: public}

rubrics:
  - name: sdlc-stage-quality
    kind: SdlcStage
    description: >-
      Can this SDLC stage be carried out well, by an agent? Read the stage in
      portal/sdlc/stages/, its docs and checks, and try its commands.
    criteria:
    - name: executable-exit
      question: Is the exit criterion checked by a command or CI step, not by judgement?
      guidance: >-
        Fail when nothing in `checks:` would fail if the exit criterion were not
        met.
    - name: agent-can-complete
      question: >-
        Could an agent complete the stage using only the listed commands,
        Toolbox's CLI or MCP, and the docs?
      guidance: >-
        Fail and name the step that needs a person, a secret or tribal
        knowledge.
    - name: reuses-artifacts
      question: >-
        Does the stage reuse released, pinned artifacts instead of rebuilding or
        reinstalling everything from source?
      guidance: >-
        Fail when consumers compile Toolbox or install tools by hand; pass when
        nothing is built or installed in the stage.
    - name: decoupled-from-core
      question: >-
        Can someone outside this repository's maintainers carry out the stage
        (an operator or package author), or does it need a change to Toolbox's
        own crates?
      guidance: >-
        Fail when the stage requires adding a crate, a builtin or a schema
        change to this repository.
