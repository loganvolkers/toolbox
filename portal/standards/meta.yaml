# Scorecards for scorecards: the portal's own model (docs/design/scorecards-for-scorecards.md).
# Included by portal/toolbox.yaml; see portal/README.md for the layout.

kinds:
  - name: Scorecard
    description: >-
      A scorecard one of the described portals declares (this one, the starter
      or the reference portal).
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string}
      name: {type: string}
      kind: {type: string}
      owner: {type: string}
      levels: {type: list, items: string}
      rulesPerLevel: {type: object}
      rules: {type: integer}
      tested: {type: boolean}
      meta: {type: boolean}
      fixtureLevels: {type: object} # levels the portal's own fixtures reach
      liveEntities: {type: integer} # information only (from the committed results)
      untestedRules:
        type: list
        items: string
        computed: inbound.ruleOf.filter(r, !r.tested).map(r, r.name)
      hash:
        type: string
        description: >-
          Content hash of the scorecard's definition: assessments of it go stale
          when it changes.
      described:
        type: boolean
        description: The scorecard has a non-blank `description:` saying what it is.
      explained:
        type: boolean
        description: >-
          The scorecard has a non-blank `rationale:` saying why the standard
          exists.
      links:
        type: integer
        description: URLs under the scorecard's `links:`.
      fixtureRealLevels:
        type: list
        items: string
        description: >-
          The scorecard's own levels that some fixture entity reaches (none and
          skipped don't count).
        computed: entity.levels.filter(l, l in entity.fixtureLevels)
      reviewState:
        type: string
        description: "scorecard-quality assessment: fresh, stale or missing."
        computed: >-
          inbound.assessesScorecard.size() == 0 ? 'missing' :
          (inbound.assessesScorecard[0].subjectHash == entity.hash ? 'fresh' :
          'stale')
      reviewFailing:
        type: list
        items: string
        description: Criteria the scorecard-quality assessment failed.
        computed: >-
          inbound.assessesScorecard.size() == 0 ? [] :
          inbound.assessesScorecard[0].failing
      reviewUnsure:
        type: list
        items: string
        description: Criteria the assessor was unsure of.
        computed: >-
          inbound.assessesScorecard.size() == 0 ? [] :
          inbound.assessesScorecard[0].unsure
      reviewUncited:
        type: list
        items: string
        description: >-
          Criteria whose reasons in the current review cite nothing that resolves
          in the repository: a review that can't be checked.
        computed: >-
          inbound.assessesScorecard.size() == 0 ? [] :
          inbound.assessesScorecard[0].uncited
    sources: {default: [connector:surfaces]}
    map:
    - from: surfaces/scorecard
      id: "'scorecard:' + record.portal + '/' + record.name"
      set: >-
        {'portal': record.portal, 'name': record.name, 'kind': record.kind, 'owner': record.owner,
         'levels': record.levels, 'rulesPerLevel': record.rulesPerLevel, 'rules': record.rules,
         'tested': record.tested, 'meta': record.meta, 'fixtureLevels': record.fixtureLevels,
         'described': has(record.described) ? record.described : false,
         'explained': has(record.explained) ? record.explained : false,
         'links': has(record.links) ? record.links : 0,
         'liveEntities': has(record.liveEntities) ? record.liveEntities : null, 'hash': record.hash}

  - name: Rule
    description: >-
      A rule of one of those scorecards: what it is made of, its tests and its
      outcomes.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string}
      scorecard: {type: string}
      name: {type: string}
      level: {type: string}
      fixWords: {type: integer}
      hasEvidence: {type: boolean}
      check: {type: object} # CEL: nodes, depth, loops (comprehension nesting), fields, functions
      evidence: {type: object}
      tested: {type: boolean} # a test expectation pins it (outcome compared with a literal, or evidence)
      testedOutcomes:
        type: list
        items: string
        description: >-
          The outcomes the portal's expectations pin for this rule (pass, fail,
          unknown, skipped); comparing its evidence pins fail.
      fixture: {type: object} # {pass, fail, unknown} over the portal's fixtures
      live: {type: object} # information only: {entities, pass, fail, unknown} on real data
      checkCel: {type: string, description: "The rule's check, as written."}
      evidenceCel:
        type: string
        description: The rule's evidence expression, as written.
      fixText: {type: string, description: "The rule's fix text."}
      explained:
        type: boolean
        description: The rule has a non-blank `rationale:` saying why it exists.
      links: {type: integer, description: "URLs under the rule's `links:`."}
      basis:
        type: enum
        values: [measured, judged]
        description: >-
          judged when the check reads an assessment, directly or through computed
          fields, so an agent's verdict decides it; measured otherwise.
      evidenceTracksCheck:
        type: boolean
        description: >-
          The evidence names what failed on this entity: it reads an entity field
          or loops over values. A fixed sentence counts only for a small yes/no
          check (at most 8 CEL nodes, no loop, no list that must be empty), where
          the sentence is the whole answer.
        computed: >-
          entity.hasEvidence && (entity.evidence.fields.size() > 0 ||
          entity.evidence.loops > 0 || (entity.check.loops == 0 &&
          entity.check.nodes <= 8 && !entity.checkCel.matches('size[(][)] *==
          *0')))
      fixNamesPlace:
        type: boolean
        description: >-
          The fix tells an agent where to act: a path, a code span, a file name or
          extension, LICENSE or CODEOWNERS, a toolbox command, a field the check
          reads, or an evidence that reads this entity's fields and so lists the
          places.
        computed: >-
          entity.fixText.matches('`|[A-Za-z0-9_.-]+/[A-Za-z0-9_./<>*-]+|[A-Za-z0-9][.](md|rs|ya?ml|json|toml|sh|py)([^A-Za-z]|$)|LICENSE|CODEOWNERS|toolbox
          [a-z]') || entity.check.fields.exists(f, f.size() > 3 &&
          entity.fixText.contains(f)) || (entity.hasEvidence &&
          (entity.evidence.fields.size() > 0 || entity.evidence.loops > 0))
      hash:
        type: string
        description: >-
          Content hash of the rule's definition: assessments of it go stale when
          it changes.
      reviewState:
        type: string
        description: "rule-quality assessment: fresh, stale or missing."
        computed: >-
          inbound.assessesRule.size() == 0 ? 'missing' :
          (inbound.assessesRule[0].subjectHash == entity.hash ? 'fresh' : 'stale')
      reviewFailing:
        type: list
        items: string
        description: Criteria the rule-quality assessment failed.
        computed: "inbound.assessesRule.size() == 0 ? [] : inbound.assessesRule[0].failing"
      reviewUnsure:
        type: list
        items: string
        description: Criteria the assessor was unsure of.
        computed: "inbound.assessesRule.size() == 0 ? [] : inbound.assessesRule[0].unsure"
      reviewUncited:
        type: list
        items: string
        description: >-
          Criteria whose reasons in the current review cite nothing that resolves
          in the repository: a review that can't be checked.
        computed: >-
          inbound.assessesRule.size() == 0 ? [] : inbound.assessesRule[0].uncited
    relations: {ruleOf: {to: Scorecard, many: false}}
    sources: {default: [connector:surfaces]}
    map:
    - from: surfaces/rule
      id: "'rule:' + record.card + '/' + record.name"
      set: >-
        {'portal': record.portal, 'scorecard': record.scorecard, 'name': record.name, 'level': record.level,
         'fixWords': record.fixWords, 'hasEvidence': record.hasEvidence, 'check': record.check,
         'evidence': record.evidence, 'tested': record.tested, 'fixture': record.fixture,
         'testedOutcomes': has(record.testedOutcomes) ? record.testedOutcomes : [],
         'live': has(record.live) ? record.live : null, 'hash': record.hash,
         'checkCel': record.definition.check, 'evidenceCel': record.definition.evidence, 'fixText': record.definition.fix,
         'explained': has(record.explained) ? record.explained : false,
         'links': has(record.links) ? record.links : 0,
         'basis': has(record.basis) ? record.basis : 'measured'}
      relations: {ruleOf: "['scorecard:' + record.card]"}

  - name: Kind
    description: A kind of entity one of the described portals declares.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string, description: Portal that declares it.}
      name: {type: string, description: "The kind's name."}
      described:
        type: boolean
        description: The manifest gives the kind a description.
      fieldCount:
        type: integer
        description: Declared fields, computed ones included.
      fieldsDescribed: {type: integer, description: Fields with a description.}
      scorecards:
        type: list
        items: string
        description: Scorecards on this kind.
      relationsOut:
        type: list
        items: string
        description: Relations it declares.
      relationsIn:
        type: list
        items: string
        description: Relations other kinds declare to it, as Kind.relation.
      fixtureEntities: {type: integer, description: Entities of this kind the portal's fixtures produce.}
      tested: {type: boolean, description: A test expectation names one of those entities.}
      hash: {type: string, description: Content hash of the kind's definition.}
      undescribedFields:
        type: list
        items: string
        description: Fields without a description.
        computed: inbound.fieldOf.filter(f, !f.described).map(f, f.name)
    sources: {default: [connector:surfaces]}
    map:
    - from: surfaces/kind
      id: "'kind:' + record.portal + '/' + record.name"
      set: >-
        {'portal': record.portal, 'name': record.name, 'described': record.described,
         'fieldCount': record.fields, 'fieldsDescribed': record.fieldsDescribed, 'scorecards': record.scorecards,
         'relationsOut': record.relationsOut, 'relationsIn': record.relationsIn,
         'fixtureEntities': record.fixtureEntities, 'tested': record.tested, 'hash': record.hash}

  - name: Field
    description: A field of a kind in one of the described portals.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string, description: Portal that declares it.}
      kind: {type: string, description: The kind it belongs to.}
      name: {type: string, description: "The field's name."}
      fieldType:
        type: string
        description: Declared type (string, integer, boolean, list, object, …).
      described:
        type: boolean
        description: The manifest gives the field a description.
      computed: {type: boolean, description: A CEL expression computes it.}
      opaque:
        type: boolean
        description: >-
          An object, or a list of objects: no declared shape for validation, CEL
          type checks or agents.
      sources:
        type: list
        items: string
        description: Sources allowed to set it, in precedence order.
      readBy:
        type: list
        items: string
        description: >-
          Rules, evidence, computed fields and authorization that read it
          (information: display fields are read by no CEL).
      fixtureEntities:
        type: integer
        description: Fixture entities of its kind.
      fixtureWithValue:
        type: integer
        description: Fixture entities with a value for it.
      hash: {type: string, description: Content hash of the field's definition.}
      computedNodes:
        type: integer
        description: >-
          CEL nodes in the field's `computed:` expression (0 when it is not
          computed).
      computedLoops:
        type: integer
        description: Comprehension nesting in the field's `computed:` expression.
    relations: {fieldOf: {to: Kind, many: false}}
    sources: {default: [connector:surfaces]}
    map:
    - from: surfaces/field
      id: "'field:' + record.portal + '/' + record.kind + '.' + record.name"
      set: >-
        {'portal': record.portal, 'kind': record.kind, 'name': record.name, 'fieldType': record.type,
         'described': record.described, 'computed': record.computed, 'opaque': record.opaque,
         'sources': record.sources, 'readBy': record.readBy, 'fixtureEntities': record.fixture.entities,
         'fixtureWithValue': record.fixture.withValue, 'hash': record.hash,
         'computedNodes': has(record.computedCel) && record.computedCel != null ? record.computedCel.nodes : 0,
         'computedLoops': has(record.computedCel) && record.computedCel != null ? record.computedCel.loops : 0}
      relations: {fieldOf: "['kind:' + record.portal + '/' + record.kind]"}

  - name: PortalConnector
    title: Declared connector
    description: A connector one of the described portals declares.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string, description: Portal that declares it.}
      name: {type: string, description: "The connector's name."}
      runtime: {type: string, description: in-image or remote.}
      package:
        type: string
        description: Package (builtin:<name> or an image).
      records:
        type: list
        items: string
        description: Record kinds it declares.
      unmapped:
        type: list
        items: string
        description: Declared record kinds no map rule reads.
      withoutFreshness:
        type: list
        items: string
        description: Record kinds with no freshness bound.
      refreshable:
        type: list
        items: string
        description: Record kinds it can refresh by id.
      fixtureRecords:
        type: integer
        description: Messages in the portal's fixture file for it.
      hash:
        type: string
        description: Content hash of the connector's declaration.
    sources: {default: [connector:surfaces]}
    map:
    - from: surfaces/connector
      id: "'connector:' + record.portal + '/' + record.name"
      set: >-
        {'portal': record.portal, 'name': record.name, 'runtime': record.runtime, 'package': record.package,
         'records': record.records, 'unmapped': record.unmapped, 'withoutFreshness': record.withoutFreshness,
         'refreshable': record.refreshable, 'fixtureRecords': record.fixtureRecords, 'hash': record.hash}

  - name: Rubric
    description: >-
      A rubric one of the described portals declares, with how it has been
      used.
    identityFrom: [connector:surfaces]
    fields:
      portal: {type: string, description: Portal that declares it.}
      name: {type: string, description: "The rubric's name."}
      rubricKind: {type: string, description: The kind it assesses.}
      subject:
        type: string
        description: The field assessments are versioned by.
      described: {type: boolean, description: The rubric has a description.}
      criteria: {type: list, items: string, description: Its criteria.}
      unguided:
        type: list
        items: string
        description: Criteria without guidance.
      assessments:
        type: integer
        description: Assessments made with it (the portal's assessments/ files).
      alwaysPass:
        type: list
        items: string
        description: "With three or more assessments: criteria every one passed."
      hash: {type: string, description: Content hash of the rubric.}
    sources: {default: [connector:surfaces]}
    map:
    - from: surfaces/rubric
      id: "'rubric:' + record.portal + '/' + record.name"
      set: >-
        {'portal': record.portal, 'name': record.name, 'rubricKind': record.kind, 'subject': record.subject,
         'described': record.described, 'criteria': record.criteria, 'unguided': record.unguided,
         'assessments': record.assessments, 'alwaysPass': record.alwaysPass, 'hash': record.hash}

scorecards:
  # They score every rule and scorecard of this portal, the starter and the reference portal —
  # themselves included, so there is no further level. Only deterministic facts (manifest, CEL,
  # tests, fixtures) are scored; live outcomes are shown, not scored.
  - name: meta-rule
    title: Rules are well-formed
    kind: Rule
    description: >-
      Each rule's form: explained, tested, decided both ways on fixtures, with
      evidence, readable CEL. Gold means well-formed, not good: quality is
      judged by review-rule (D71, D01M831P5QWJQ4A2FT85N5MXJQF).
    rationale: >-
      Every score in the portal is only as trustworthy as the rule behind it,
      and an untested or unexplained rule can pass everything, or fail for the
      wrong reason, unnoticed. Bronze is the floor every new rule must meet
      (tested, explained, decided on fixtures); silver adds both outcomes,
      evidence and a cost bound; gold asks for tests that pin both outcomes
      and for evidence and a fix that lead an agent to the change.
    links:
    - title: Scorecards for scorecards
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md
    - title: D71 one meta level
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7W0J8YR0000000000000000.md
    - title: Meta standards review
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/meta-standards-review.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze} # a new rule or scorecard must be tested and explained from day one
    rules:
    - name: explains-fix
      level: bronze
      check: entity.fixWords >= 5
      evidence: "['fix has ' + string(entity.fixWords) + ' words']"
      fix: "Write a fix an agent can act on: what to change, and where."
      rationale: >-
        A failing rule without a usable fix leaves the reader to
        reverse-engineer the check. A fresh agent raised a scorecard to gold
        using only fix texts that said what and where (lesson L1).
      links:
      - title: Thresholds and levels
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md#2-the-numbers
    - name: explains-why
      level: bronze
      check: entity.explained
      evidence: >-
        ['rule ' + entity.scorecard + '/' + entity.name + ' has no rationale']
      fix: >-
        Give the rule a `rationale:` saying why it exists (the risk or the cost
        it guards against), and put the long story under `links:`.
      rationale: >-
        A reader who sees a failing rule needs to know why it matters before
        deciding to act, and a reviewer can't tell whether a check is a proxy
        without its goal. Links carry the long story, so the portal doesn't
        become an encyclopedia.
      links:
      - title: Goals for rules (GQM)
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/meta-standards-review.md#3-the-literature-and-where-our-meta-standard-stands
    - name: tested
      level: bronze
      check: entity.tested
      evidence: >-
        ['no expectation in the portal tests names ' + entity.scorecard + '/' +
        entity.name]
      fix: >-
        In the portal's tests (tests/*.test.yaml), add an expectation that pins
        the rule: `score('<card>', '<entity>').rules['<rule>'] == 'fail'`, or
        its evidence compared (`.evidence['<rule>'] == [...]`). A bare mention
        doesn't count.
      rationale: >-
        An untested rule can change outcome after an edit with nothing to catch
        it. The first rules here gave false positives on a numbered Sources
        heading and a quoted "SDLC" (lesson L4).
    - name: decided-on-fixtures
      level: bronze
      check: entity.fixture.pass + entity.fixture.fail > 0
      evidence: >-
        [string(entity.fixture.unknown) + ' unknown, no pass or fail on the
        fixtures']
      fix: Add fixture records the rule applies to, so it evaluates in tests.
      rationale: >-
        A rule that is unknown on every fixture never runs its check in tests,
        so an error in its CEL first shows on real data, as `join` and `flatten`
        did twice (lesson L5).
    - name: both-outcomes-on-fixtures
      level: silver
      check: entity.fixture.pass > 0 && entity.fixture.fail > 0
      evidence: >-
        ['fixtures: ' + string(entity.fixture.pass) + ' pass, ' +
        string(entity.fixture.fail) + ' fail']
      fix: >-
        Give the fixtures one entity that passes and one that fails, so both
        paths (and the evidence) are exercised.
      rationale: >-
        A rule seen only passing may pass everything, and one seen only failing
        may fail everything; only both outcomes show it separates entities and
        that its evidence reads.
    - name: no-nested-loops
      level: silver
      check: >-
        entity.check.loops <= 1 && (!has(entity.evidence) ||
        entity.evidence.loops <= 1)
      evidence: >-
        ['check loops ' + string(entity.check.loops) + (has(entity.evidence) ?
        ', evidence loops ' + string(entity.evidence.loops) : '')]
      fix: >-
        Avoid a comprehension inside a comprehension: compute the inner list in
        the connector or a computed field.
      rationale: >-
        Rules are evaluated once per entity, so a loop inside a loop multiplies
        cost with the data; the 100k-entity budget already fails on 2-vCPU
        runners (lesson L8).
    - name: readable
      level: silver
      check: entity.check.nodes <= 30
      evidence: >-
        ['the check has ' + string(entity.check.nodes) + ' CEL nodes (30 or
        fewer reads at a glance)']
      fix: >-
        Move logic into a computed field or the connector, and keep the rule a
        short comparison.
      rationale: >-
        A long check hides its logic from the reader deciding whether a failure
        is fair, and costs more per entity. Logic in a computed field or the
        connector can be named and tested on its own.
      links:
      - title: Thresholds and levels
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md#2-the-numbers
    - name: always-explains
      level: silver
      check: entity.hasEvidence
      evidence: "['no evidence expression']"
      fix: "Add `evidence:` even for simple checks: it is what an agent reads first."
      rationale: >-
        Without evidence, an agent needed one `explain` call per rule per entity
        to find what failed; evidence shown with the fix removed that step
        (lesson L2, D66).
      links:
      - title: D66 scorecards say why
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7VWS4ZG0000000000000000.md
    - name: evidence-tracks-check
      level: gold
      check: entity.evidenceTracksCheck
      evidence: >-
        ['the evidence is a fixed sentence, but the check has ' +
        string(entity.check.nodes) + ' CEL nodes and ' +
        string(entity.check.loops) + ' loops: ' + entity.checkCel]
      fix: >-
        Write `evidence:` from what the check reads (the failing list itself, or
        the value compared), so it names what failed on this entity.
      rationale: >-
        A fixed sentence says that a rule failed, not what failed on this
        entity, so the reader must redo the check. Agents fixed what the
        evidence named (lessons L1 and L2).
      links:
      - title: Thresholds and levels
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md#2-the-numbers
    - name: pins-both-outcomes
      level: gold
      check: "'pass' in entity.testedOutcomes && 'fail' in entity.testedOutcomes"
      evidence: >-
        ['pass', 'fail'].filter(o, !(o in entity.testedOutcomes)).map(o, 'no
        expectation pins ' + entity.scorecard + '/' + entity.name + ' == \'' + o
        + '\'')
      fix: >-
        In the portal's tests (tests/*.test.yaml), add an expectation that the
        rule passes for one fixture entity (`score('<card>',
        '<entity>').rules['<rule>'] == 'pass'`) and one that it fails for
        another (`== 'fail'`, or its evidence compared), so a change that flips
        either outcome is caught (lesson L4).
      rationale: >-
        A rule whose tests pin only failing can start passing everything, and
        the tests still pass (lesson L4). Pinning both outcomes catches a change
        in either direction.
    - name: fix-names-a-place
      level: gold
      check: entity.fixNamesPlace
      evidence: >-
        ['the fix names no path, code span, file, command, checked field or
        listing evidence: ' + entity.fixText]
      fix: >-
        Say in `fix:` where to act: the file or directory (a path), the field
        the check reads, a `toolbox` command, or "the listed …" items of an
        evidence that names them (scorecards-for-scorecards.md, lesson L1).
      rationale: >-
        A fix that says what but not where sends an agent searching, which is
        where it guesses wrong. Fixes that named the file and field were what
        let a fresh agent raise a scorecard on its own (lesson L1).
    facets: {summary: public, details: public}

  - name: meta-scorecard
    title: Scorecards are well-formed
    kind: Scorecard
    description: >-
      Each scorecard's form: described, tested, no empty level, fixtures that
      climb the ladder to every level. Gold means well-formed, not good (D71,
      D01M831P5QWJQ4A2FT85N5MXJQF).
    rationale: >-
      A scorecard is the ladder readers climb, so its levels must exist and be
      exercised: an empty level is granted for nothing, and a level no fixture
      reaches has never been seen to work. Bronze, tested with no empty level,
      is the floor for every new scorecard; silver adds a description, a
      reason, a fixture ladder and tested rules; gold has a fixture at every
      level.
    links:
    - title: Scorecards for scorecards
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md
    - title: The ladders
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md#3-the-ladders
    - title: Meta gold is not good
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M831P5QWJQ4A2FT85N5MXJQF.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze} # a new rule or scorecard must be tested and explained from day one
    rules:
    - name: tested
      level: bronze
      check: entity.tested
      evidence: "['no expectation names score(' + entity.name + ', …)']"
      fix: Add at least one expectation for the scorecard in the portal's tests.
      rationale: >-
        A scorecard no expectation names can change its levels or lose a rule
        with no test noticing; on the first run, `user-cli` had no test of any
        kind.
    - name: every-level-has-rules
      level: bronze
      check: >-
        entity.levels.all(l, l in entity.rulesPerLevel &&
        entity.rulesPerLevel[l] > 0)
      evidence: >-
        entity.levels.filter(l, !(l in entity.rulesPerLevel) ||
        entity.rulesPerLevel[l] == 0)
      fix: Give every level at least one rule, or drop the level.
      rationale: >-
        A level with no rules is granted to every entity that reaches the one
        below it, so it tells the reader nothing about the entities at it.
    - name: described
      level: silver
      check: entity.described
      evidence: "['scorecard ' + entity.name + ' has no description']"
      fix: >-
        Give the scorecard a `description:` saying what the standard covers;
        agents read it before any rule.
      rationale: >-
        Agents read a scorecard's description before its rules. Without one,
        they infer the standard's purpose from its checks and may work towards
        the wrong goal.
    - name: explains-why
      level: silver
      check: entity.explained
      evidence: "['scorecard ' + entity.name + ' has no rationale']"
      fix: >-
        Give the scorecard a `rationale:` saying why the standard exists and why
        its levels are where they are, with `links:` to the decision or design
        behind it.
      rationale: >-
        A description says what a standard covers, not why anyone should meet
        it. Without the risk and the reason for its levels, a reader can't weigh
        a failure before acting, and links keep that long story out of the
        portal so it doesn't become an encyclopedia.
      links:
      - title: Goals for rules (GQM)
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/meta-standards-review.md#3-the-literature-and-where-our-meta-standard-stands
    - name: fixtures-show-the-ladder
      level: silver
      check: >-
        entity.fixtureRealLevels.size() >= 2 || (entity.fixtureRealLevels.size()
        == 1 && 'none' in entity.fixtureLevels)
      evidence: >-
        ['fixtures reach ' + string(entity.fixtureRealLevels.size()) + ' of the
        levels, and ' + ('none' in entity.fixtureLevels ? 'some' : 'no') + '
        fixture entity is at none']
      fix: >-
        Give the scorecard fixtures at two outcomes, one of them a real level:
        one entity at none and one at bronze or above, or two at different
        levels. Skipped entities show no ladder.
      rationale: >-
        Fixtures at one outcome never show the scorecard telling a better entity
        from a worse one. A ladder of `none` and `skipped` used to pass, so one
        real level is now required (D01M831P5QWJQ4A2FT85N5MXJQF).
    - name: every-rule-tested
      level: silver
      check: entity.untestedRules.size() == 0
      evidence: entity.untestedRules
      fix: Add an expectation for each untested rule.
      rationale: >-
        One untested rule is enough for a scorecard's levels to drift. A rule
        without a test was the most common scorecard gap on the first run, in 11
        scorecards.
    - name: fixtures-reach-every-level
      level: gold
      check: entity.fixtureRealLevels.size() == entity.levels.size()
      evidence: >-
        entity.levels.filter(l, !(l in entity.fixtureRealLevels)).map(l, 'no
        fixture entity reaches ' + l)
      fix: >-
        Add fixture entities that reach each listed level, so every rung of the
        ladder is exercised in tests (portal/fixtures/).
      rationale: >-
        A level no fixture reaches is untested: its rules may never pass
        together, and nothing shows that an entity can reach it (lesson L12).
    facets: {summary: public, details: public}

  - name: meta-kind
    title: Kinds are well-formed
    kind: Kind
    description: >-
      Each kind of entity: in the fixtures, tested and described with every
      field, since every rule reads it
      (docs/design/scorecards-for-scorecards.md §5).
    rationale: >-
      Every rule reads a kind, so a kind absent from fixtures and tests leaves
      its map rules and computed fields unexercised, and an undescribed one
      leaves agents guessing what an entity is. Being exercised in tests is
      the floor for a new kind; descriptions sit above it because they help
      readers without making any score wrong.
    links:
    - title: Which parts need standards
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md#4-holistic-review-which-parts-of-a-portal-need-standards
    - title: 'Decision: every part is scored'
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7WHQA9G0000000000000000.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze} # a new kind must be in the fixtures and the tests
    rules:
    - name: in-fixtures
      level: bronze
      check: entity.fixtureEntities > 0
      evidence: >-
        ['no fixture record maps to ' + entity.name + ' in portal ' +
        entity.portal]
      fix: >-
        Add fixture records that map to the kind, so its map rules and computed
        fields run in tests.
      rationale: >-
        A kind with no fixture entities never runs its map rules or computed
        fields in tests, so a mapping error first shows on live data.
    - name: tested
      level: bronze
      check: entity.tested
      evidence: "['no test expectation names an entity of ' + entity.name]"
      fix: >-
        Add a test expectation about one of the kind's fixture entities (a
        field, a relation or a score).
      rationale: >-
        Fixture entities no expectation reads can change without any test
        failing; one expectation pins the kind's mapping. Three kinds were in no
        test on the first run.
    - name: described
      level: silver
      check: entity.described
      evidence: "['kind ' + entity.name + ' has no description']"
      fix: >-
        Give the kind a `description:` saying what one entity is; agents read it
        before any field.
      rationale: >-
        Agents read a kind's description before its fields. Without one, they
        infer what an entity is from field names and can act on the wrong thing.
    - name: fields-described
      level: gold
      check: entity.undescribedFields.size() == 0
      evidence: entity.undescribedFields
      fix: >-
        Give each listed field a `description:`: what it means, its unit, and
        where it comes from.
      rationale: >-
        An undescribed field leaves its meaning, unit and origin to guesswork,
        and every rule and agent that reads it inherits the guess; 16 kinds had
        undescribed fields on the first run.
    facets: {summary: public, details: public}

  - name: meta-field
    title: Fields are well-formed
    kind: Field
    description: >-
      Each field: populated in the fixtures, described and given a shape, so
      CEL, validation and agents know what it holds
      (docs/design/scorecards-for-scorecards.md §5).
    rationale: >-
      Fields are what rules, evidence and agents read: one never populated in
      fixtures has an untested mapping, an undescribed one is guessed at, and
      an opaque object can't be type-checked or validated. A value in some
      fixture is the floor for a new field; a description and a declared shape
      sit above it.
    links:
    - title: The rest of the model
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md#5-the-rest-of-the-model-kinds-fields-connectors
    - title: 'Decision: every part is scored'
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7WHQA9G0000000000000000.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze} # a new field must have a value somewhere in the fixtures
    rules:
    - name: populated-in-fixtures
      level: bronze
      check: entity.fixtureWithValue > 0
      evidence: >-
        ['none of ' + string(entity.fixtureEntities) + ' fixture ' + entity.kind
        + ' entities has a value']
      fix: >-
        Give at least one fixture record a value for the field, so its mapping
        (or computation) is exercised.
      rationale: >-
        A field no fixture sets has a mapping or computation that no test runs,
        so it can be empty or wrong on every entity without anyone noticing.
    - name: described
      level: silver
      check: entity.described
      evidence: "[entity.kind + '.' + entity.name + ' has no description']"
      fix: >-
        Add a `description:` to the field: what it means, its unit, and where it
        comes from.
      rationale: >-
        A field's meaning, unit and source aren't visible from its name, and a
        rule written against a misread field measures the wrong thing.
    - name: has-shape
      level: gold
      check: "!entity.opaque"
      evidence: >-
        [entity.kind + '.' + entity.name + ' is ' + entity.fieldType + ' with no
        declared shape']
      fix: >-
        Replace the object with typed fields (or a list of strings), so CEL,
        validation and agents know its shape.
      rationale: >-
        With no declared shape, validation and CEL type checks can't see inside
        the object, so a renamed or missing key surfaces only as a wrong outcome
        in the rules that read it.
    - name: computed-readable
      level: gold
      check: entity.computedNodes <= 60 && entity.computedLoops <= 1
      evidence: >-
        ['computed: ' + string(entity.computedNodes) + ' CEL nodes, loop depth '
        + string(entity.computedLoops) + ' (60 nodes and no nested loops at
        most; docs/design/thresholds.md)']
      fix: >-
        Split the field's `computed:` expression into simpler fields and rules,
        or move the logic into the connector, so it reads at a glance.
      rationale: >-
        A long or doubly nested computed field is hard to review and costs more
        on every entity. Computed fields get twice a check's budget because they
        are where logic belongs.
      links:
      - title: Thresholds and levels
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md#2-the-numbers
    facets: {summary: public, details: public}

  - name: meta-connector
    title: Portal connectors are well-formed
    kind: PortalConnector
    description: >-
      Each connector a portal configures: every record mapped, fixtures for
      tests, freshness declared and refresh by id
      (docs/design/scorecards-for-scorecards.md §5).
    rationale: >-
      Every fact enters the portal through a connector, so its gaps become the
      portal's: unmapped records are lost, untested mappings break on live
      data, and stale data reads as current. The starter shipped without
      freshness or refresh, which pilots copying it would have inherited; a
      mapping and fixtures are the floor, freshness and refresh sit above it.
    links:
    - title: The rest of the model
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md#5-the-rest-of-the-model-kinds-fields-connectors
    - title: 'Decision: every part is scored'
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7WHQA9G0000000000000000.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze} # a new connector needs fixtures and a mapping for every record
    rules:
    - name: records-mapped
      level: bronze
      check: entity.unmapped.size() == 0
      evidence: entity.unmapped
      fix: >-
        Map each listed record kind to a kind (`map: - from:
        <connector>/<record>`), or stop declaring it.
      rationale: >-
        Records of a kind no map rule reads never become entities, so the portal
        silently lacks those facts while the connector appears to cover them.
    - name: has-fixtures
      level: bronze
      check: entity.fixtureRecords > 0
      evidence: "['no fixtures/' + entity.name + '.ndjson in portal ' + entity.portal]"
      fix: >-
        Add fixtures/<connector>.ndjson with representative records, so tests
        run without the live system.
      rationale: >-
        Without fixture records, the connector's mappings run only against the
        live system, so tests and CI never exercise them.
    - name: freshness-declared
      level: silver
      check: entity.withoutFreshness.size() == 0
      evidence: entity.withoutFreshness
      fix: >-
        Declare `freshness:` for each listed record kind, so stale data shows as
        stale rather than current.
      rationale: >-
        With no freshness bound, data from a connector that stopped syncing
        reads as current, and rules pass or fail on stale facts.
    - name: refreshable
      level: gold
      check: entity.records.all(r, r in entity.refreshable)
      evidence: entity.records.filter(r, !(r in entity.refreshable))
      fix: >-
        Support refresh by external id for each listed record kind, so an agent
        can see its fix land.
      rationale: >-
        An agent that fixes something needs to refresh that one entity to see
        the rule pass; without refresh by id it waits for a full sync, or can't
        confirm the fix at all.
    facets: {summary: public, details: public}

  # Advisory: reported, never gating. An assessment goes stale when its subject changes, and the
  # agent that changed it should re-assess — but a stale review must not block the change.
  - name: review-rule
    title: Rules, reviewed by agents
    kind: Rule
    description: >-
      Agents' judgement of each rule against rule-quality, advisory: an open
      finding is none, a current review is silver, a clean, cited one with no
      doubts is gold (D79, D01M831P5QWJQ4A2FT85N5MXJQF).
    rationale: >-
      Form checks can't tell whether a rule measures its intent or can be
      gamed, and none of 19 meta-gold rules and scorecards that agents
      reviewed passed. Open findings rank lowest so they head the report; the
      card is advisory because a review goes stale whenever its subject
      changes, and gating on it would block every edit.
    links:
    - title: Judgement pushed by agents
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md#6-judgement-pushed-by-coding-agents-d79
    - title: 'Decision: judgement is pushed'
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7WHQA9G0000000000000000.md
    - title: Meta standards review
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/meta-standards-review.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    appliesTo: entity.portal == 'toolbox' # our own rules; the starter and reference are examples
    rules:
    - name: no-open-findings
      level: bronze
      check: entity.reviewFailing.size() == 0
      evidence: >-
        entity.reviewState == 'stale' ? entity.reviewFailing.map(c, c + ' (from
        a stale review: re-assess to close it)') : entity.reviewFailing
      fix: >-
        A current rule-quality assessment failed the listed criteria: act on its
        suggestions (portal/assessments/), then re-assess. If the finding is
        wrong, say why in a new assessment by another assessor.
      rationale: >-
        A failing review names a way the rule misleads or can be gamed. Two such
        findings sat unacted for three days, buried among unreviewed rules, so
        an open finding now drops the rule to none.
    - name: assessed
      level: silver
      check: entity.reviewState == 'fresh'
      evidence: >-
        [entity.reviewState == 'stale' ? 'the rule changed since it was
        assessed' : 'not assessed against rule-quality']
      fix: >-
        Run `toolbox assess brief <rule id> --portal portal`, have your agent
        write the assessment file it names, then `toolbox assess check portal`.
      rationale: >-
        Without a current review, nobody has judged whether the rule as it now
        stands measures its intent; a verdict on an earlier version may not
        apply to the check.
    - name: passes-review
      level: gold
      check: >-
        entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0 &&
        entity.reviewUncited.size() == 0
      evidence: >-
        entity.reviewState != 'fresh' ? ['no current assessment'] :
        entity.reviewFailing + entity.reviewUncited.map(c, c + ' cites nothing
        that resolves')
      fix: >-
        Act on the failing criteria's suggestions in the assessment
        (portal/assessments/), then re-assess.
      rationale: >-
        A review that fails a criterion found a problem, and one whose reasons
        cite nothing that resolves can't be checked; either way the rule isn't
        known to be good.
    - name: no-doubts
      level: gold
      check: entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0
      evidence: >-
        entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current
        assessment']
      fix: >-
        Resolve what the assessor was unsure of: usually a missing source for a
        threshold or an unstated intent.
      rationale: >-
        An unsure verdict usually marks a threshold with no source or an intent
        nobody wrote down, which is where a rule drifts into a proxy (lesson
        L9).
      links:
      - title: Thresholds and levels
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md
    facets: {summary: public, details: public}

  - name: review-scorecard
    title: Scorecards, reviewed by agents
    kind: Scorecard
    description: >-
      Agents' judgement of each scorecard against scorecard-quality, advisory,
      with the same ladder as review-rule (D79, D01M831P5QWJQ4A2FT85N5MXJQF).
    rationale: >-
      Form checks can't tell whether a scorecard measures one concern, climbs
      a real ladder or leaves an obvious gap; an adversarial review failed
      every meta-gold scorecard it sampled. The ladder and advisory status
      match review-rule: open findings first, and never gating, because a
      review goes stale when the scorecard changes.
    links:
    - title: Judgement pushed by agents
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md#6-judgement-pushed-by-coding-agents-d79
    - title: 'Decision: judgement is pushed'
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7WHQA9G0000000000000000.md
    - title: Meta standards review
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/meta-standards-review.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {advisory: true}
    appliesTo: entity.portal == 'toolbox'
    rules:
    - name: no-open-findings
      level: bronze
      check: entity.reviewFailing.size() == 0
      evidence: >-
        entity.reviewState == 'stale' ? entity.reviewFailing.map(c, c + ' (from
        a stale review: re-assess to close it)') : entity.reviewFailing
      fix: >-
        A current scorecard-quality assessment failed the listed criteria: act
        on its suggestions (portal/assessments/), then re-assess. If the finding
        is wrong, say why in a new assessment by another assessor.
      rationale: >-
        A failing review names a gap or a broken ladder that every entity the
        scorecard scores inherits; dropping the scorecard to none keeps the
        finding at the top of the report until someone acts on it.
    - name: assessed
      level: silver
      check: entity.reviewState == 'fresh'
      evidence: >-
        [entity.reviewState == 'stale' ? 'the scorecard changed since it was
        assessed' : 'not assessed against scorecard-quality']
      fix: >-
        Run `toolbox assess brief <scorecard id> --portal portal`, have your
        agent write the assessment file it names, then `toolbox assess check
        portal`.
      rationale: >-
        A review is tied to the scorecard's content hash; once the scorecard
        changes, the old verdict may no longer describe its rules or levels.
    - name: passes-review
      level: gold
      check: >-
        entity.reviewState == 'fresh' && entity.reviewFailing.size() == 0 &&
        entity.reviewUncited.size() == 0
      evidence: >-
        entity.reviewState != 'fresh' ? ['no current assessment'] :
        entity.reviewFailing + entity.reviewUncited.map(c, c + ' cites nothing
        that resolves')
      fix: >-
        Act on the failing criteria's suggestions in the assessment
        (portal/assessments/), then re-assess.
      rationale: >-
        A review that fails a criterion found a problem, and one whose reasons
        cite nothing that resolves can't be checked; either way the scorecard
        isn't known to be good.
    - name: no-doubts
      level: gold
      check: entity.reviewState == 'fresh' && entity.reviewUnsure.size() == 0
      evidence: >-
        entity.reviewState == 'fresh' ? entity.reviewUnsure : ['no current
        assessment']
      fix: >-
        Resolve what the assessor was unsure of: usually a level whose purpose
        isn't written down.
      rationale: >-
        An unsure verdict usually marks a level whose purpose nobody wrote down,
        and a level nobody can justify is one readers can't trust.
      links:
      - title: The ladders
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md#3-the-ladders
    facets: {summary: public, details: public}

  - name: meta-rubric
    title: Rubrics are well-formed
    kind: Rubric
    description: >-
      Each rubric agents judge with: described, used, guided with what counts
      as fail, and shown to discriminate on real assessments (D80).
    rationale: >-
      A rubric decides what agents judge, so a vague one yields reviews that
      disagree or pass everything. Described and used once is the floor for a
      new rubric; guidance on what counts as fail lets assessors agree; gold
      needs three assessments to show that each criterion can fail.
    links:
    - title: Assessments and rubrics
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/scorecards-for-scorecards.md#61-assessments-and-rubrics-are-standards-too-d80
    - title: 'Decision: rubrics are scored'
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7WJVW700000000000000000.md
    owner: group:maintainers
    track: standards
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze} # a new rubric must be described and used once
    rules:
    - name: described
      level: bronze
      check: entity.described
      evidence: "['rubric ' + entity.name + ' has no description']"
      fix: >-
        Describe what the rubric judges and which sources the assessor should
        read.
      rationale: >-
        The assessor reads the description to learn what to judge and which
        sources to read; without it, two assessors judge different things.
    - name: in-use
      level: bronze
      check: entity.assessments > 0
      evidence: "['no assessment uses ' + entity.name]"
      fix: >-
        Assess one entity with it (`toolbox assess brief <id> --rubric <name>`),
        or remove the rubric.
      rationale: >-
        A rubric no assessment has used is untried configuration: nobody knows
        whether its questions can be answered from the sources it names.
    - name: guided
      level: silver
      check: entity.unguided.size() == 0
      evidence: entity.unguided
      fix: >-
        Give each listed criterion `guidance:` saying what counts as fail, so
        assessors agree.
      rationale: >-
        Without guidance on what counts as fail, assessors draw the line in
        different places and their verdicts can't be compared. Blank guidance
        used to pass (D01M831P5QWJQ4A2FT85N5MXJQF).
      links:
      - title: Thresholds and levels
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md#2-the-numbers
    - name: discriminates
      level: gold
      check: entity.assessments >= 3 && entity.alwaysPass.size() == 0
      evidence: >-
        entity.assessments < 3 ? ['only ' + string(entity.assessments) + '
        assessment(s); 3 show whether criteria discriminate'] :
        entity.alwaysPass.map(c, c + ' passed in every assessment')
      fix: >-
        Sharpen or drop a criterion that everything passes; a question nothing
        fails asks nothing.
      rationale: >-
        A criterion every assessment passes costs assessor effort and tells
        nothing apart: `rule-quality`'s `fix-leads-to-pass` passed all four of
        its first rule assessments.
    facets: {summary: public, details: public}

rubrics:
  - name: rule-quality
    kind: Rule
    description: >-
      Is this rule a good standard? Read its check, evidence and fix in the
      portal's toolbox.yaml, its tests, and the design doc its scorecard
      cites.
    criteria:
    - name: measures-intent
      question: >-
        Does passing the check mean what the rule's name and fix say it means,
        rather than a proxy that can drift from it?
      guidance: >-
        Fail when an entity could pass while missing the intent (e.g. any test
        counts as tested), or fail while meeting it.
    - name: hard-to-game
      question: Is the cheapest way to pass the rule to do the right thing?
      guidance: >-
        Fail when an empty doc comment, a renamed item, a trivial test or a
        suppression would pass it.
    - name: fix-leads-to-pass
      question: >-
        Would following the fix text alone, with the evidence, make the rule
        pass?
      guidance: >-
        Fail when the fix is vague, names the wrong place, or the rule needs
        data the fix doesn't mention.
    - name: threshold-justified
      question: >-
        Are its thresholds and its level (bronze, silver or gold) justified by a
        design doc, a decision or evidence?
      guidance: >-
        Pass for rules with no threshold. Cite the source; unsure when no source
        states the number.

  - name: scorecard-quality
    kind: Scorecard
    description: >-
      Is this scorecard a good standard? Read it in the portal's toolbox.yaml
      with the doc that motivates it (portal/README.md says which layer it
      raises).
    criteria:
    - name: one-concern
      question: >-
        Does it measure one concern for one audience (one SDLC layer), so its
        level means one thing?
      guidance: >-
        Fail when its rules serve two audiences or layers (e.g. security and
        speed); name the split.
    - name: levels-are-a-ladder
      question: >-
        Does each level build on the one below, with bronze reachable now and
        gold worth reaching?
      guidance: >-
        Fail when a level mixes unrelated rules or a gold rule is cheaper than a
        bronze one.
    - name: no-obvious-gap
      question: >-
        Is there no obvious standard for this concern that the scorecard leaves
        out?
      guidance: >-
        Fail and name the missing rule; compare with the research its design doc
        cites.
    - name: actionable
      question: >-
        Can an agent raise an entity one level using only the scorecard's fixes,
        evidence and the portal's tools?
      guidance: >-
        Fail when a rule's fix names no place to change, or it has no evidence;
