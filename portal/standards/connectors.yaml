# Connectors we ship (docs/design/connector-standards.md).
# Included by portal/seikika.yaml; see portal/README.md for the layout.

kinds:
  # First-party connectors (docs/design/connector-standards.md). Facts from the crate; thresholds below.
  - name: Connector
    title: Connector binary
    description: >-
      A first-party connector binary we ship: its docs, transport, the kinds
      it emits, its tests and where CI runs its conformance suite.
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      dir: {type: string}
      name: {type: string}
      description: {type: string}
      descriptionChars: {type: integer}
      crateDoc: {type: boolean}
      configDocumented: {type: boolean}
      transport: {type: string} # stdio, remote, both, or none
      pushOnly: {type: boolean}
      documentedKinds: {type: list, items: string}
      genericKinds: {type: boolean} # kinds come from config, as the runner's jobs do
      snapshotComplete: {type: boolean}
      reportsNotFound: {type: boolean}
      tests: {type: integer}
      conformanceMentions: {type: integer} # lines that run `connector test` on this binary
      ciMentions: {type: integer} # CI scripts or workflows that name the binary
      secretHits: {type: list, items: string}
      lastChange: {type: string}
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/connector
      id: "'connector:' + record.dir"
      set: >-
        {'path': record.path, 'dir': record.dir, 'name': record.name,
         'description': record.description, 'descriptionChars': record.descriptionChars,
         'crateDoc': record.crateDoc, 'configDocumented': record.configDocumented,
         'transport': record.transport, 'pushOnly': record.pushOnly,
         'documentedKinds': record.documentedKinds, 'genericKinds': record.genericKinds,
         'snapshotComplete': record.snapshotComplete, 'reportsNotFound': record.reportsNotFound,
         'tests': record.tests, 'conformanceMentions': record.conformanceMentions,
         'ciMentions': record.ciMentions, 'secretHits': record.secretHits,
         'lastChange': record.lastChange}

scorecards:
  # Bronze is "it is a connector an operator can configure". Silver is "a resync and a refresh
  # have the shapes the conformance kit checks, and someone wrote a test". Gold is "CI runs it,
  # and no credential is pasted into the source". Lag, error rate and permission probes need a
  # live portal; they are the meta-catalog's connector-health and are not gated here.
  - name: maintainer-connector
    title: First-party connectors
    kind: Connector
    description: >-
      Each first-party connector: configurable, speaking the protocol the
      conformance kit checks, and free of credentials in shipped code (D73,
      docs/design/connector-standards.md).
    rationale: >-
      Connectors hold credentials to upstream systems and feed every entity a
      portal derives, so one that is undocumented, off-protocol or carrying a
      secret harms every portal that runs it. Bronze is a connector an
      operator can configure, silver has the message shapes the conformance
      kit checks plus a test, and gold runs in CI with no credential in the
      tree. Lag and error rate need a live portal and are not gated.
    links:
    - title: Connector standards
      url: https://github.com/seikika/seikika/blob/main/docs/design/connector-standards.md
    - title: 'Decision: a connector scorecard'
      url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M7W4FRJR0000000000000000.md
    - title: Connector control channel
      url: https://github.com/seikika/seikika/blob/main/docs/design/connector-control.md
    owner: group:maintainers
    track: maintainer
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
    - name: described
      level: bronze
      check: entity.descriptionChars > 0 && entity.crateDoc
      evidence: >-
        entity.descriptionChars == 0 ? ['Cargo.toml has no description'] :
        (!entity.crateDoc ? ['no crate-level doc comment'] : ['described'])
      fix: >-
        Add a Cargo.toml description and a //! crate doc that says what the
        connector emits.
      rationale: >-
        An operator choosing a connector reads its package description and crate
        docs, not its source; without them they cannot tell what it emits.
    - name: config-documented
      level: bronze
      check: entity.configDocumented
      evidence: "['crate docs name neither SEIKIKA_CONNECTOR_CONFIG nor a CLI flag']"
      fix: >-
        Document the configuration in the crate doc: SEIKIKA_CONNECTOR_CONFIG
        for an in-image connector, or the --seikika and --listen flags for a
        remote one.
      rationale: >-
        A connector reads its settings from SEIKIKA_CONNECTOR_CONFIG or its
        flags; when they are undocumented an operator has to read the source to
        wire it into a manifest.
    - name: speaks-the-protocol
      level: bronze
      check: >-
        entity.transport == 'stdio' || entity.transport == 'remote' ||
        entity.transport == 'both'
      evidence: "[entity.transport]"
      fix: >-
        Serve commands with run_stdio (in-image) or run_remote (long-poll). A
        connector that does neither is not on the control channel.
      rationale: >-
        Seikika asks connectors for data only over the control channel; a
        connector that serves neither stdio nor long-poll can never be told to
        refresh or resync.
    - name: names-its-kinds
      level: silver
      check: entity.documentedKinds.size() > 0 || entity.genericKinds
      evidence: "['crate docs and source name no record kind']"
      fix: >-
        Name each record kind in the connector's source (in a `record` or
        `snapshot_complete` message) or, for a generic runner, say in its `//!`
        crate doc that kinds come from the job config.
      rationale: >-
        An operator must declare a connector's kinds in the manifest, and the
        conformance kit rejects capabilities that name undeclared ones; unnamed
        kinds leave both to guesswork.
    - name: closes-snapshots
      level: silver
      check: entity.pushOnly || entity.snapshotComplete
      evidence: "['resync never sends snapshot_complete']"
      fix: >-
        End every resync kind with a `snapshot_complete` message. A push-only
        connector is exempt: it has no resync.
      rationale: >-
        A resync is the only command that can remove records by omission, and
        only once the snapshot is closed; without `snapshot_complete`, records
        deleted upstream stay in the catalog.
    - name: reports-missing-ids
      level: silver
      check: entity.pushOnly || entity.reportsNotFound
      evidence: "['refresh never sends not_found']"
      fix: >-
        Send `not_found` when a refresh names an unknown external id. A
        push-only connector is exempt: the provider sends deletes.
      rationale: >-
        A refresh never deletes by omission, so without `not_found` an entity
        deleted upstream stays in the catalog and the requester sees it as
        unresolved.
    - name: has-tests
      level: silver
      check: entity.tests >= 1
      evidence: "[string(entity.tests) + ' #[test] functions']"
      fix: >-
        Add a unit test that does not need the upstream API: a parser, a record
        shape, or a capabilities case.
      rationale: >-
        A unit test that needs no upstream API runs on every build without
        credentials, so a parser or record-shape regression fails CI instead of
        a portal's next sync.
    - name: exercised-in-ci
      level: gold
      check: >-
        entity.conformanceMentions > 0 || (entity.pushOnly && entity.ciMentions
        > 0)
      evidence: >-
        [string(entity.conformanceMentions) + ' connector-test lines, ' +
        string(entity.ciMentions) + ' CI files']
      fix: >-
        Run seikika connector test on this binary from CI. A push-only connector
        has no resync for that kit; an acceptance script must start it instead.
      rationale: >-
        The conformance kit is the run that proves the protocol shapes the
        static rules infer; a connector CI never starts can drift from the
        protocol unnoticed.
    - name: no-hardcoded-secrets
      level: bronze
      check: entity.secretHits.size() == 0
      evidence: entity.secretHits
      fix: >-
        Remove the hardcoded credentials in the evidence. Read tokens from the
        environment or from SEIKIKA_CONNECTOR_CONFIG.
      rationale: >-
        Connectors are open source and carry tokens for systems such as GitHub,
        so a credential in the tree is published with it. It sits at bronze so
        such a connector cannot pass the ratchet.
      links:
      - title: 'Thresholds: why credentials sit at bronze'
        url: https://github.com/seikika/seikika/blob/main/docs/design/thresholds.md
    facets: {summary: public, details: public}
