# CLI commands and MCP tools: operator and user SDLC contracts (docs/sdlc.md).
# Included by portal/seikika.yaml; see portal/README.md for the layout.

kinds:
  - name: Command
    description: A `seikika` CLI (sub)command, from `seikika describe`.
    identityFrom: [connector:surfaces]
    fields:
      name: {type: string}
      about: {type: string}
      args: {type: list, items: object}
      undocumentedArgs: {type: list, items: string}
      structuredOutput: {type: boolean}
      mcpTool: {type: string}
      layer:
        type: enum
        values: [operator, user]
        computed: "has(entity.mcpTool) || entity.name == 'mcp' ? 'user' : 'operator'"
      documentedIn:
        type: list
        items: string
        computed: inbound.mentionsCommand.map(d, d.path)
      exercisedBy:
        type: list
        items: string
        computed: inbound.exercisesCommand.map(f, f.path)
    relations: {callsTool: {to: McpTool, many: false}}
    sources: {default: [connector:surfaces]}
    map:
    - from: surfaces/command
      id: "'command:' + record.slug"
      set: >-
        {'name': record.name, 'about': record.about, 'args': record.args,
         'undocumentedArgs': record.undocumentedArgs, 'structuredOutput': record.structuredOutput,
         'mcpTool': record.mcpTool}
      relations:
        callsTool: "record.mcpTool == null ? [] : ['mcp-tool:' + record.mcpTool]"

  - name: McpTool
    description: A built-in MCP tool the server exposes, from `seikika describe`.
    identityFrom: [connector:surfaces]
    fields:
      name: {type: string}
      description: {type: string}
      annotations: {type: object}
      properties: {type: list, items: string}
      undescribedProperties: {type: list, items: string}
      observed: {type: object} # from the runner: {calls, errors} in the MCP contract tests
      documentedIn:
        type: list
        items: string
        computed: inbound.mentionsTool.map(d, d.path)
      exercisedBy:
        type: list
        items: string
        computed: inbound.exercisesTool.map(f, f.path)
      viaCli:
        type: list
        items: string
        computed: inbound.callsTool.map(c, c.name)
    sources:
      default: [connector:surfaces]
      fields: {observed: [connector:runner]}
    map:
    - from: runner/mcp-calls
      id: "'mcp-tool:' + record.tool"
      set: "{'observed': record}"
    - from: surfaces/mcp-tool
      id: "'mcp-tool:' + record.name"
      set: >-
        {'name': record.name, 'description': record.description, 'annotations': record.annotations,
         'properties': record.properties, 'undescribedProperties': record.undescribedProperties}

scorecards:
  - name: operator-cli
    title: Operator CLI commands
    kind: Command
    description: >-
      Each CLI command an operator runs on a portal: documented, with help for
      every argument and exercised by a test, so an agent can use it without
      reading the source (operator SDLC).
    rationale: >-
      Operators' agents run these commands at every step of changing a portal,
      and they learn a command from its help and the docs, not from the Rust
      source. Bronze means an agent can find and read about the command;
      silver means it can use every flag and a test fails when the command
      breaks.
    links:
    - title: Seikika for Seikika
      url: https://github.com/seikika/seikika/blob/main/docs/design/seikika-for-seikika.md
    - title: Operator SDLC
      url: https://github.com/seikika/seikika/blob/main/docs/design/sdlc.md
    owner: group:maintainers
    track: operator
    levels: [bronze, silver]
    appliesTo: entity.layer == 'operator'
    rules:
    - name: has-help
      level: bronze
      check: has(entity.about) && entity.about.size() >= 10
      evidence: >-
        [has(entity.about) ? 'help "' + entity.about + '" is under 10
        characters' : 'seikika ' + entity.name + ' has no help text']
      fix: >-
        Give the command's variant in `crates/seikika-cli/src/main.rs` a `///`
        doc comment; clap shows it as the command's help.
      rationale: >-
        `--help` is the first thing an agent runs on an unfamiliar command;
        without help text it has to guess what the command does or read the
        source.
    - name: documented
      level: bronze
      check: entity.documentedIn.size() > 0
      evidence: "['not mentioned as `seikika ' + entity.name + '` in any doc']"
      fix: >-
        Describe `seikika <command>` in docs/v1-spec.md §7.7 or the operator
        SDLC doc.
      rationale: >-
        Help is read only by someone who already knows the command exists. An
        agent planning a change finds commands in the docs, so an undocumented
        command goes unused.
    - name: args-described
      level: silver
      check: entity.undocumentedArgs.size() == 0
      evidence: entity.undocumentedArgs
      fix: Add a /// doc comment to each argument in the evidence.
      rationale: >-
        An undescribed flag leaves an agent to guess its format and default from
        its name; a wrong guess is a failed run or a quietly different result.
    - name: exercised
      level: silver
      check: entity.exercisedBy.size() > 0
      evidence: >-
        ['no script under scripts/ and no test under crates/*/tests runs seikika
        ' + entity.name]
      fix: >-
        Run the command in an acceptance script (`scripts/m*-acceptance.sh`) or
        an integration test under `crates/seikika-cli/tests/`.
      rationale: >-
        A command that no script or test runs can break without CI noticing, and
        an operator finds out halfway through a change to their portal.
    facets: {summary: public, details: public}

  - name: user-cli
    title: User CLI commands
    kind: Command
    description: >-
      Each CLI command a portal's users and their agents call: help,
      structured output and a test that runs it, so scripts can depend on it
      (user SDLC).
    rationale: >-
      Users' scripts, CI checks and apps call these commands and parse what
      they print, so an unannounced change breaks them. Bronze means a caller
      can find the command and parse its output; silver means every flag is
      explained and a test runs the command.
    links:
    - title: User SDLC
      url: https://github.com/seikika/seikika/blob/main/docs/design/user-sdlc.md
    - title: Seikika for Seikika
      url: https://github.com/seikika/seikika/blob/main/docs/design/seikika-for-seikika.md
    owner: group:maintainers
    track: operator
    levels: [bronze, silver]
    appliesTo: entity.layer == 'user'
    rules:
    - name: has-help
      level: bronze
      check: has(entity.about) && entity.about.size() >= 10
      evidence: >-
        [has(entity.about) ? 'help "' + entity.about + '" is under 10
        characters' : 'seikika ' + entity.name + ' has no help text']
      fix: >-
        Give the command's variant in `crates/seikika-cli/src/main.rs` a `///`
        doc comment; clap shows it as the command's help.
      rationale: >-
        `--help` is the first thing an agent runs on an unfamiliar command;
        without help text it has to guess what the command does or read the
        source.
    - name: structured-output
      level: bronze
      check: entity.name == 'mcp' || entity.structuredOutput
      evidence: "['seikika ' + entity.name + ' has no -o json output']"
      fix: >-
        Support `-o json` (or `--format json`) so scripts and apps can parse the
        output.
      rationale: >-
        A script that parses Markdown or table text breaks when the wording
        changes; JSON gives a CI check a shape it can depend on. `seikika mcp`
        is exempt because it is a stdio bridge, not a read.
    - name: args-described
      level: silver
      check: entity.undocumentedArgs.size() == 0
      evidence: entity.undocumentedArgs
      fix: Add a /// doc comment to each argument in the evidence.
      rationale: >-
        An undescribed flag leaves an agent to guess its format and default from
        its name; a wrong guess is a failed run or a quietly different result.
    - name: exercised
      level: silver
      check: entity.exercisedBy.size() > 0
      evidence: >-
        ['no script under scripts/ and no test under crates/*/tests runs seikika
        ' + entity.name]
      fix: >-
        Run the command in an acceptance script (`scripts/m*-acceptance.sh`) or
        an integration test under `crates/seikika-cli/tests/`.
      rationale: >-
        Users' scripts depend on this command's behaviour; if no script or test
        runs it, a regression reaches them before CI sees it.
    facets: {summary: public, details: public}

  # Every CLI command has a skill that names its invocation (D94). The doc capture already
  # turns `seikika <command>` in a SKILL.md into documentedIn.
  - name: cli-skill
    title: Every CLI command has a skill
    kind: Command
    description: >-
      Every CLI command has an agent skill that names its invocation (D94), so
      a coding agent finds the command when it needs it.
    rationale: >-
      Help text is loaded only once an agent already knows the command, while
      a skill is loaded when the task matches its description, so a command
      with no skill is invisible to an agent that has not heard of it. One
      level is enough: maintainer-skill scores the skill file itself.
    links:
    - title: CLI skills design
      url: https://github.com/seikika/seikika/blob/main/docs/design/cli-skills.md
    - title: 'Decision: one skill per command'
      url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M7X1Y5T00000000000000000.md
    owner: group:maintainers
    track: operator
    levels: [bronze]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
    - name: has-skill
      level: bronze
      check: entity.documentedIn.filter(p, p.endsWith('SKILL.md')).size() > 0
      evidence: "['missing skill for seikika ' + entity.name]"
      fix: >-
        Add plugins/seikika-operator/skills/<slug>/SKILL.md that includes the
        invocation seikika <command>, with the flags and the exit codes.
      rationale: >-
        An agent that cannot find a command will not run it. The skill routes a
        coding agent to the invocation when its task calls for it; matching the
        leaf name keeps nested commands from hiding behind their parent.
    facets: {summary: public, details: public}

  - name: user-mcp
    title: MCP tools
    kind: McpTool
    description: >-
      Each built-in MCP tool: described inputs and a contract test that calls
      it successfully, so agents can rely on its schema (user SDLC).
    rationale: >-
      MCP tools are the contract users' agents and apps build on, and their
      names, inputs and result shapes may change only additively within a
      major version. Bronze means an agent can choose the tool and its client
      can tell a read from a write; silver means it can call the tool
      correctly; gold means a test calls it over MCP, because the first direct
      tests found bugs the CLI path did not show.
    links:
    - title: User SDLC
      url: https://github.com/seikika/seikika/blob/main/docs/design/user-sdlc.md
    - title: Seikika for Seikika
      url: https://github.com/seikika/seikika/blob/main/docs/design/seikika-for-seikika.md
    owner: group:maintainers
    track: operator
    levels: [bronze, silver, gold]
    rules:
    - name: described
      level: bronze
      check: entity.description.size() >= 20
      evidence: >-
        ['description is ' + string(entity.description.size()) + ' characters:
        "' + entity.description + '"']
      fix: >-
        Write the tool's `description` (at least 20 characters): what it returns
        and when an agent should call it.
      rationale: >-
        An agent picks a tool from its `tools/list` description alone; a short
        or vague one means the right tool is skipped or the wrong one is called.
    - name: annotated
      level: bronze
      check: has(entity.annotations.readOnlyHint)
      evidence: "['tool ' + entity.name + ' sets no annotations.readOnlyHint']"
      fix: >-
        Set annotations.readOnlyHint (and idempotent/openWorld hints for
        writes).
      rationale: >-
        Seikika leaves prompt-injection defence to the client's approval layer
        and owes it accurate annotations; without `readOnlyHint` a client cannot
        tell a safe read from a call that needs the user's approval.
      links:
      - title: Authorization and MCP
        url: https://github.com/seikika/seikika/blob/main/docs/authorization.md
    - name: inputs-described
      level: silver
      check: entity.undescribedProperties.size() == 0
      evidence: entity.undescribedProperties
      fix: >-
        Add a description to each input property in the evidence
        (crates/seikika-api/src/mcp.rs).
      rationale: >-
        An agent fills a tool's inputs from the schema it is given; without
        descriptions it guesses formats and defaults. The fresh-agent run had to
        read the REST handlers to work out 15 of them.
    - name: documented
      level: silver
      check: "'docs/v1-spec.md' in entity.documentedIn" # common names (`get`, `query`) appear in many docs
      evidence: >-
        entity.documentedIn.size() == 0 ? ['documented in: nothing'] :
        entity.documentedIn.map(d, 'documented in ' + d + ', not
        docs/v1-spec.md')
      fix: List the tool, in backticks, in docs/v1-spec.md §7.3.
      rationale: >-
        The v1 spec is the contract users build against, so a tool missing there
        carries no promise. Naming that file, not any doc, stops common names
        such as `get` passing on a stray mention.
    - name: contract-tested
      level: gold
        # Observed calls when the runner has run the contract tests; otherwise a tools/call body that
        # names the tool (static mode, weaker: it can't see whether the call happens).
      # Only successful calls count: the contract tests' helper asserts on each result
      # (crates/seikika-api/tests/mcp.rs, `call`), so a call that errors proves nothing.
      check: >-
        has(entity.observed) ? entity.observed.calls - entity.observed.errors >
        0 : entity.exercisedBy.size() > 0
      evidence: >-
        has(entity.observed) ? ['observed ' + string(entity.observed.calls) + '
        call(s) in the MCP contract tests, ' + string(entity.observed.errors) +
        ' of them errors'] : ['no tools/call body ({"name": …, "arguments": …})
        naming this tool outside a comment in tests or scripts (static mode)']
      fix: >-
        Call the tool directly (tools/call) in a test, e.g.
        crates/seikika-api/tests; the CLI path in `viaCli` doesn't pin the MCP
        contract.
      rationale: >-
        A tool reached only through the CLI leaves its MCP schema and
        `structuredContent` untested, and those are what users' agents read. A
        call that errors proves nothing, so when the runner observes the tests
        only successful calls count; the static read can only see that a test
        names the tool.
      links:
      - title: Thresholds
        url: https://github.com/seikika/seikika/blob/main/docs/design/thresholds.md
    facets: {summary: public, details: public}
