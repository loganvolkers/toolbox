# Toolbox against Backstage, beyond DX (docs/design/backstage-comparison.md). Comparative
# scorecards (D01M857ZB468ZM2YS6GNSEG6YB9): each scores both products on the same rules and says,
# rule by rule, where Toolbox stands. Products are the records experiments/backstage-compare
# writes into portal/comparisons/; rerun the harness rather than editing them.

kinds:
  - name: Product
    description: >-
      A product measured by experiments/backstage-compare: one run of its
      harness, at one commit, on one corpus.
    identityFrom: [connector:workspace]
    fields:
      title: {type: string, description: "The product's name."}
      version: {type: string, description: The version or install measured.}
      harness: {type: string, description: The harness commit that measured it.}
      corpus:
        type: number
        description: Components in the catalog the performance runs used.
      runs: {type: number, description: Runs per product the medians are over.}
      readyS: {type: number, description: Seconds from exec to ready (median).}
      catalogReadableS:
        type: number
        description: Seconds from exec until every component is readable (median).
      getP95Ms:
        type: number
        description: p95 milliseconds to read one entity by id (median).
      getRps:
        type: number
        description: Entity reads by id per second at 16 connections (median).
      listP95Ms:
        type: number
        description: p95 milliseconds to list 100 components of one owner (median).
      listRps:
        type: number
        description: Filtered lists per second at 16 connections (median).
      recoveredS:
        type: number
        description: >-
          Seconds from a restart after kill -9 until every component is readable
          again (median).
      rssIdleMb:
        type: number
        description: Resident memory of the process tree when ready (median).
      rssLoadedMb:
        type: number
        description: Resident memory of the process tree with the catalog loaded (median).
      installMb: {type: number, description: Megabytes on disk to run it.}
      adopterFiles:
        type: number
        description: Files the adopter keeps in their repository for a first portal.
      adopterLines: {type: number, description: Lines in those files.}
      thirdPartyPackages:
        type: number
        description: Third-party packages in its lockfile.
      knownVulns:
        type: number
        description: Known vulnerabilities in its lockfile (osv-scanner).
      highVulns: {type: number, description: Those rated high or critical.}
      provenancePercent:
        type: number
        description: Percent of its release artifacts with verifiable provenance.
      anonymousReadRefused:
        type: boolean
        description: A catalog read without credentials is refused.
      forgedIdentityRefused:
        type: boolean
        description: A read that claims an identity without proving it is refused.
      anonymousMcpRefused:
        type: boolean
        description: An MCP call without credentials is refused.
      clientCannotDelete:
        type: boolean
        description: A client's credential cannot delete a catalog entity.
      loopbackByDefault:
        type: boolean
        description: The server listens on loopback unless told otherwise.
      ownerOnlyFields:
        type: boolean
        description: Fields can be shown to owners only, and filters cannot probe them.
      extensionProcessIsolated:
        type: boolean
        description: An extension runs outside the server's process.
      extensionCredentialIsolated:
        type: boolean
        description: An extension gets none of the server's credentials.
      offlineValidate:
        type: boolean
        description: The catalog and config validate with no running instance.
      changePreview:
        type: boolean
        description: A change's effect on entities and access is shown before deploy.
      upgradeLinesPerRelease:
        type: number
        description: Lines the adopter changes per release to upgrade.
      rollbackManualStepsPerRelease:
        type: number
        description: Manual steps per release to roll back to the previous version.
      repoScopedWithoutServer:
        type: boolean
        description: One repository can be scored with no server.
      federates:
        type: boolean
        description: Two instances join into one catalog.
      mcpByDefault:
        type: boolean
        description: The default install serves MCP.
      mcpToolsListBytes:
        type: number
        description: Bytes of the MCP tools/list response.
      mcpGetEntityBytes:
        type: number
        description: Bytes of the MCP response that reads one entity.
      extensionAnyLanguage:
        type: boolean
        description: An extension can be written in any language.
      extensionWithoutRebuild:
        type: boolean
        description: An extension is added without rebuilding the server.
      capCatalogBrowse:
        type: boolean
        description: Browse and filter the catalog.
      capOwnership:
        type: boolean
        description: Show who owns what, through groups.
      capGraph:
        type: boolean
        description: Show an entity's relations as a graph.
      capDocsSearch:
        type: boolean
        description: Search the catalog and documentation by any word.
      capDocs:
        type: boolean
        description: Read a component's documentation in the portal.
      capTemplates:
        type: boolean
        description: Create a component from a template.
      capScorecards:
        type: boolean
        description: Score entities against standards.
      capApiDocs: {type: boolean, description: Render an API's OpenAPI or AsyncAPI definition.}
      capKubernetes:
        type: boolean
        description: Show a component's Kubernetes workloads.
      capNotifications: {type: boolean, description: Notify users of events.}
      capPermissionRule:
        type: boolean
        description: Write a custom permission rule.
      capMcpRead: {type: boolean, description: Read the catalog over MCP.}
      contributors:
        type: number
        description: Contributors to its repository, anonymous included.
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/product
      id: "'product:' + record.id"
      set: >-
        {'title': record.title, 'version': record.version, 'harness':
        record.harness, 'corpus': record.corpus, 'runs': record.runs, 'readyS':
        record.readyS, 'catalogReadableS': record.catalogReadableS, 'getP95Ms':
        record.getP95Ms, 'getRps': record.getRps, 'listP95Ms': record.listP95Ms,
        'listRps': record.listRps, 'recoveredS': record.recoveredS, 'rssIdleMb':
        record.rssIdleMb, 'rssLoadedMb': record.rssLoadedMb, 'installMb':
        record.installMb, 'adopterFiles': record.adopterFiles, 'adopterLines':
        record.adopterLines, 'thirdPartyPackages': record.thirdPartyPackages,
        'knownVulns': record.knownVulns, 'highVulns': record.highVulns,
        'provenancePercent': record.provenancePercent, 'anonymousReadRefused':
        record.anonymousReadRefused, 'forgedIdentityRefused':
        record.forgedIdentityRefused, 'anonymousMcpRefused':
        record.anonymousMcpRefused, 'clientCannotDelete':
        record.clientCannotDelete, 'loopbackByDefault':
        record.loopbackByDefault, 'ownerOnlyFields': record.ownerOnlyFields,
        'extensionProcessIsolated': record.extensionProcessIsolated,
        'extensionCredentialIsolated': record.extensionCredentialIsolated,
        'offlineValidate': record.offlineValidate, 'changePreview':
        record.changePreview, 'upgradeLinesPerRelease':
        record.upgradeLinesPerRelease, 'rollbackManualStepsPerRelease':
        record.rollbackManualStepsPerRelease, 'repoScopedWithoutServer':
        record.repoScopedWithoutServer, 'federates': record.federates,
        'mcpByDefault': record.mcpByDefault, 'mcpToolsListBytes':
        record.mcpToolsListBytes, 'mcpGetEntityBytes': record.mcpGetEntityBytes,
        'extensionAnyLanguage': record.extensionAnyLanguage,
        'extensionWithoutRebuild': record.extensionWithoutRebuild,
        'capCatalogBrowse': record.capCatalogBrowse, 'capOwnership':
        record.capOwnership, 'capGraph': record.capGraph, 'capDocsSearch':
        record.capDocsSearch, 'capDocs': record.capDocs, 'capTemplates':
        record.capTemplates, 'capScorecards': record.capScorecards,
        'capApiDocs': record.capApiDocs, 'capKubernetes': record.capKubernetes,
        'capNotifications': record.capNotifications, 'capPermissionRule':
        record.capPermissionRule, 'capMcpRead': record.capMcpRead,
        'contributors': record.contributors}

scorecards:
  - name: vs-backstage-performance
    title: Performance
    kind: Product
    description: >-
      Start, read and recover on a 10k-component catalog, with every read
      authorized (Toolbox through OpenFGA, Backstage under allow-all). ISO
      25010 performance efficiency and reliability.
    rationale: >-
      Every page load, agent call and CI job reads the portal, so a slow
      start, slow reads or a slow recovery cost all of its users at once. The
      bars are absolute and set before the run; Toolbox authorizes every read
      while Backstage runs allow-all, which favours Backstage.
    links:
    - title: Performance results
      url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#performance-and-memory
    - title: Factors F3 F4 F5 F14
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md#2-factors
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: ready
      level: bronze
      check: entity.readyS <= 10.0
      value: entity.readyS
      better: lower
      unit: s
      tolerance: 0.1
      evidence: "['ready after ' + string(entity.readyS) + ' s']"
      fix: >-
        Profile startup with `RUST_LOG=debug toolbox serve`, then rerun
        experiments/backstage-compare/run.sh.
      rationale: >-
        Start time bounds how soon a crashed or rescheduled instance, a preview
        environment or a scale-from-zero deploy serves again; a slow start turns
        each of those into an outage.
    - name: catalog-readable
      level: bronze
      check: entity.catalogReadableS <= 60.0
      value: entity.catalogReadableS
      better: lower
      unit: s
      tolerance: 0.1
      evidence: >-
        ['every component readable after ' + string(entity.catalogReadableS) + '
        s']
      fix: >-
        Time ingest and recompute in `toolbox serve` logs and the derive laps,
        then rerun experiments/backstage-compare/run.sh.
      rationale: >-
        Until ingest finishes, the portal answers from a partial catalog, and
        people and agents read wrong owners and scores without knowing it. This
        covers the first ingest only, not later freshness.
    - name: get-latency
      level: bronze
      check: entity.getP95Ms <= 50.0
      value: entity.getP95Ms
      better: lower
      unit: ms
      tolerance: 0.1
      evidence: "['p95 ' + string(entity.getP95Ms) + ' ms to read one entity']"
      fix: >-
        Profile GET /v1/entities/{id} in crates/toolbox-api/src/routes.rs, then
        rerun experiments/backstage-compare/run.sh.
      rationale: >-
        An entity page fans out into many reads, so the per-call tail becomes
        the page's typical latency (Dean and Barroso, The Tail at Scale); a slow
        p95 makes every page and agent lookup slow.
    - name: get-throughput
      level: bronze
      check: entity.getRps >= 1000.0
      value: entity.getRps
      better: higher
      unit: rps
      tolerance: 0.1
      evidence: "[string(entity.getRps) + ' entity reads per second']"
      fix: >-
        Profile GET /v1/entities/{id} in crates/toolbox-api/src/routes.rs, then
        rerun experiments/backstage-compare/run.sh.
      rationale: >-
        Throughput decides how many people, agents and CI jobs one instance
        serves before it needs replicas. Toolbox's reads here are mostly
        authorization-cache hits, and the load shares the CPUs: a ceiling, not a
        capacity.
    - name: list-latency
      level: bronze
      check: entity.listP95Ms <= 500.0
      value: entity.listP95Ms
      better: lower
      unit: ms
      tolerance: 0.1
      evidence: "['p95 ' + string(entity.listP95Ms) + ' ms to list 100 components']"
      fix: >-
        Profile the filtered list in crates/toolbox-api/src/routes.rs
        (list_entities), then rerun experiments/backstage-compare/run.sh.
      rationale: >-
        Filtered lists back the catalog filter, ownership views and the MCP
        query tool, so a slow filter slows every "what does this team own"
        question. Toolbox lost here in round 1, before the field index.
    - name: list-throughput
      level: bronze
      check: entity.listRps >= 20.0
      value: entity.listRps
      better: higher
      unit: rps
      tolerance: 0.1
      evidence: "[string(entity.listRps) + ' filtered lists per second']"
      fix: >-
        Profile the filtered list in crates/toolbox-api/src/routes.rs
        (list_entities), then rerun experiments/backstage-compare/run.sh.
      rationale: >-
        A filter that scans every entity gets slower as the catalog grows, so a
        portal that copes at 1k components stalls at 10k. Round 1's loss here,
        about 2.4× behind, is published as written.
      links:
      - title: Round 1 list loss
        url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#round-1-toolbox-at-5ef6263-backstage-lists-empty
    - name: recovery
      level: bronze
      check: entity.recoveredS <= 60.0
      value: entity.recoveredS
      better: lower
      unit: s
      tolerance: 0.1
      evidence: "['readable again ' + string(entity.recoveredS) + ' s after kill -9']"
      fix: >-
        Time the restart path in crates/toolbox-api/src/state.rs (the first
        recompute from Postgres), then rerun
        experiments/backstage-compare/run.sh.
      rationale: >-
        After a crash the portal is down until its state is back, so recovery
        time adds to every incident (DORA failed deployment recovery time). A
        product whose state is derived should recover by recomputing.
    facets: {summary: public, details: public}

  - name: vs-backstage-footprint
    title: Footprint
    kind: Product
    description: >-
      What it costs to run and to own: memory, disk, and the files an adopter
      keeps for a first portal. Charter goal 1 (simple deployment).
    rationale: >-
      Memory, disk and the files an adopter keeps are paid for on every
      instance, preview environment and upgrade, and they decide the smallest
      machine and team that can run a portal. Charter goal 1 promises one
      image plus Postgres; a heavy footprint would break that promise.
    links:
    - title: Static facts
      url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#static-facts-and-single-run-probes
    - title: Factors F2 F3
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md#2-factors
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: idle-memory
      level: bronze
      check: entity.rssIdleMb <= 512.0
      value: entity.rssIdleMb
      better: lower
      unit: MB
      tolerance: 0.1
      evidence: "[string(entity.rssIdleMb) + ' MB resident when ready']"
      fix: >-
        Measure the server and its co-processes with
        experiments/backstage-compare/measure.py and trim what starts eagerly.
      rationale: >-
        Idle memory is paid by every instance, replica and preview environment
        whether or not anyone reads it, and sets the smallest machine a portal
        can run on.
    - name: loaded-memory
      level: bronze
      check: entity.rssLoadedMb <= 1024.0
      value: entity.rssLoadedMb
      better: lower
      unit: MB
      tolerance: 0.1
      evidence: "[string(entity.rssLoadedMb) + ' MB resident with the catalog loaded']"
      fix: >-
        Measure with experiments/backstage-compare/measure.py and shrink the
        derived state's copies in crates/toolbox-api/src/state.rs.
      rationale: >-
        Memory that grows with the catalog decides when an instance runs out as
        the organisation adds services; a portal that fits at 1k components can
        be killed for memory at 10k.
    - name: install-size
      level: bronze
      check: entity.installMb <= 1000.0
      value: entity.installMb
      better: lower
      unit: MB
      tolerance: 0.1
      evidence: "[string(entity.installMb) + ' MB on disk']"
      fix: >-
        Measure with experiments/backstage-compare/footprint.py and drop what
        the release archives carry but do not run.
      rationale: >-
        Bytes on disk are pulled on every deploy, cold start and CI job, and
        every file shipped is one more thing to scan and patch.
    - name: adopter-files
      level: bronze
      check: entity.adopterFiles <= 10.0
      value: entity.adopterFiles
      better: lower
      unit: files
      tolerance: 0.1
      evidence: "[string(entity.adopterFiles) + ' files to keep for a first portal']"
      fix: >-
        Move what examples/repo-portal-starter asks an adopter to keep into
        packages they include.
      rationale: >-
        Every file an adopter keeps is theirs to merge on each upgrade, so a
        portal that starts as a generated app makes the adopter its maintainer.
        Toolbox counts its repo starter; its served portal gives the same
        standing.
    - name: adopter-lines
      level: bronze
      check: entity.adopterLines <= 500.0
      value: entity.adopterLines
      better: lower
      unit: lines
      tolerance: 0.1
      evidence: "[string(entity.adopterLines) + ' lines to keep for a first portal']"
      fix: >-
        Move what examples/repo-portal-starter asks an adopter to keep into
        packages they include.
      rationale: >-
        Lines kept are lines someone must read, review and carry through every
        upgrade; they set how long a first portal takes to understand and how
        much can break when the product changes.
    facets: {summary: public, details: public}

  - name: vs-backstage-security
    title: Security defaults
    kind: Product
    description: >-
      Secure by default, as installed: what an unauthenticated or forging
      client gets, what a client token can destroy, and what an extension can
      reach. ISO 25010 security.
    rationale: >-
      A portal maps every service, its owners and how to reach them, and the
      configuration it ships with is often the one deployed. OWASP ASVS V13
      asks that the default be secure for use on the Internet, so each rule
      probes the product as it ships, and a setting the adopter must remember
      to change counts as a fail.
    links:
    - title: Factors F6 F7
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md#2-factors
    - title: Static facts
      url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#static-facts-and-single-run-probes
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: anonymous-read
      level: bronze
      check: entity.anonymousReadRefused
      evidence: "['anonymousReadRefused is ' + string(entity.anonymousReadRefused)]"
      fix: >-
        Refuse a read without credentials outside dev mode in
        crates/toolbox-authz/src/authn.rs.
      rationale: >-
        A catalog readable without credentials hands the organisation's service
        map, owners and internal links to anyone who can reach the port.
    - name: forged-identity
      level: bronze
      check: entity.forgedIdentityRefused
      evidence: "['forgedIdentityRefused is ' + string(entity.forgedIdentityRefused)]"
      fix: >-
        Trust identity headers only in dev mode, in
        crates/toolbox-authz/src/authn.rs.
      rationale: >-
        If the server believes an identity header, any client that reaches it
        can act as anyone, an operator included. Toolbox's image did this until
        the comparison found it.
      links:
      - title: No trusted header off loopback
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M857ZB3FZJZWX8G3BF5W1RNR.md
    - name: anonymous-mcp
      level: bronze
      check: entity.anonymousMcpRefused
      evidence: "['anonymousMcpRefused is ' + string(entity.anonymousMcpRefused)]"
      fix: >-
        Authenticate /mcp as the REST API does, in
        crates/toolbox-api/src/mcp.rs.
      rationale: >-
        MCP reads the same catalog as the API, so an unauthenticated MCP
        endpoint is a side door around every access rule the API enforces.
    - name: client-cannot-delete
      level: bronze
      check: entity.clientCannotDelete
      evidence: "['clientCannotDelete is ' + string(entity.clientCannotDelete)]"
      fix: >-
        Keep entity writes to connectors' ingest; offer no DELETE in
        crates/toolbox-api/src/routes.rs.
      rationale: >-
        A read client's token ends up in scripts and agent configs; if it can
        delete entities, a leaked token becomes lost data. Backstage is scored
        on its read-only REST token; its MCP-capable token can still delete.
      links:
      - title: Two-token adjudication
        url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/ADJUDICATION.md#r35-is-the-two-token-arrangement-fair-to-backstage-p4
    - name: loopback-by-default
      level: bronze
      check: entity.loopbackByDefault
      evidence: "['loopbackByDefault is ' + string(entity.loopbackByDefault)]"
      fix: >-
        Bind 127.0.0.1 unless `--listen` says otherwise, in
        crates/toolbox-cli/src/main.rs.
      rationale: >-
        A server bound to every interface is reachable from the whole network
        before anyone has configured its auth. Both products' shipped images
        listen on every interface, so both fail.
    - name: owner-only-fields
      level: bronze
      check: entity.ownerOnlyFields
      evidence: "['ownerOnlyFields is ' + string(entity.ownerOnlyFields)]"
      fix: >-
        Keep facets and their filter guard in crates/toolbox-api/src/access.rs,
        pinned by crates/toolbox-api/tests/authz.rs.
      rationale: >-
        Without field-level access, a sensitive field is either shown to every
        signed-in user or kept out of the catalog; a filter that can test a
        hidden value leaks it anyway.
    - name: extension-process-isolated
      level: bronze
      check: entity.extensionProcessIsolated
      evidence: >-
        ['extensionProcessIsolated is ' +
        string(entity.extensionProcessIsolated)]
      fix: >-
        Run every connector as its own process, as
        docs/design/connector-control.md says.
      rationale: >-
        An extension inside the server's process can read its memory and crash
        or stall it, so one bad integration takes the portal down. Backstage's
        threat model says there is no boundary between plugins on one host.
    - name: extension-credential-isolated
      level: bronze
      check: entity.extensionCredentialIsolated
      evidence: >-
        ['extensionCredentialIsolated is ' +
        string(entity.extensionCredentialIsolated)]
      fix: >-
        Start connectors with a cleared environment and an allowlist, in
        crates/toolbox-api/src/connectors.rs.
      rationale: >-
        An extension that holds the server's database or authorization
        credentials can read and rewrite everything, so one compromised
        integration is a compromised portal. Rescored to fail for both: a
        same-user connector read OpenFGA's memory on a host without Yama.
      links:
      - title: Credential isolation round 3
        url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#credential-isolation-round-3
      - title: Adjudication R3.3
        url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/ADJUDICATION.md#r33-credential-isolation-f7-against-581be50
    facets: {summary: public, details: public}

  - name: vs-backstage-supply-chain
    title: Supply chain
    kind: Product
    description: >-
      What an adopter inherits: third-party packages, their known
      vulnerabilities, and whether the release can be verified. OpenSSF and
      SLSA build provenance.
    rationale: >-
      An adopter inherits every package a portal ships, as attack surface and
      as upgrade work, and runs it next to the catalog and its credentials.
      Provenance is how they prove that what they deploy was built from the
      published source.
    links:
    - title: Static facts
      url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#static-facts-and-single-run-probes
    - title: Factor F8
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md#2-factors
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: packages
      level: bronze
      check: entity.thirdPartyPackages <= 1000.0
      value: entity.thirdPartyPackages
      better: lower
      unit: packages
      tolerance: 0.1
      evidence: "[string(entity.thirdPartyPackages) + ' third-party packages']"
      fix: >-
        List the heaviest dependencies with `cargo tree -e normal`, and drop or
        feature-gate them in Cargo.toml.
      rationale: >-
        Every third-party package is code an adopter runs, scans and updates
        without having chosen it, so more packages mean more advisories and more
        upgrade churn. Backstage's Node runtime is not counted.
    - name: known-vulnerabilities
      level: bronze
      check: entity.knownVulns == 0.0
      value: entity.knownVulns
      better: lower
      unit: vulnerabilities
      tolerance: 0.1
      evidence: "[string(entity.knownVulns) + ' known vulnerabilities']"
      fix: >-
        Run `osv-scanner scan source --lockfile Cargo.lock` and update or
        replace the listed packages.
      rationale: >-
        Each known advisory is a finding the adopter's scanner raises and
        someone must triage, even when, like Toolbox's unmaintained chrono
        crates, it is not exploitable.
      links:
      - {title: osv-scanner, url: https://github.com/google/osv-scanner}
    - name: high-vulnerabilities
      level: bronze
      check: entity.highVulns == 0.0
      value: entity.highVulns
      better: lower
      unit: vulnerabilities
      tolerance: 0.1
      evidence: "[string(entity.highVulns) + ' high or critical vulnerabilities']"
      fix: >-
        Run `osv-scanner scan source --lockfile Cargo.lock` and update or
        replace the listed packages first.
      rationale: >-
        High and critical advisories are the ones a security review blocks a
        deploy on, and the ones that need a patched release fast; one in the
        shipped lockfile can keep a portal out of production.
    - name: provenance
      level: bronze
      check: entity.provenancePercent == 100.0
      value: entity.provenancePercent
      better: higher
      unit: "%"
      tolerance: 0.1
      evidence: >-
        [string(entity.provenancePercent) + '% of release artifacts with
        provenance']
      fix: >-
        Attest every artifact in .github/workflows/release.yml, and check with
        `gh attestation verify`.
      rationale: >-
        Without verifiable provenance, an adopter cannot tell a release built
        from the published source from one swapped in the registry or the build
        system.
      links:
      - title: SLSA build track
        url: https://slsa.dev/spec/v1.2/build-track-basics
    facets: {summary: public, details: public}

  - name: vs-backstage-change-safety
    title: Change safety
    kind: Product
    description: >-
      Changing a portal safely: validate before deploy, preview the effect,
      upgrade without merging, roll back without surgery. ISO 25010
      maintainability; DORA change failure rate and recovery time.
    rationale: >-
      A portal's bad data and outages mostly arrive with a change: a config
      edit, a catalog edit or an upgrade. Checking and previewing a change
      before deploy lowers the change failure rate, and rolling back without
      database surgery shortens recovery (DORA).
    links:
    - title: Factors F9 F10 F14
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md#2-factors
    - title: Static facts
      url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#static-facts-and-single-run-probes
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: offline-validate
      level: bronze
      check: entity.offlineValidate
      evidence: "['offlineValidate is ' + string(entity.offlineValidate)]"
      fix: >-
        Keep `toolbox validate` and `toolbox test` working with no server or
        database.
      rationale: >-
        If validation needs a running instance, CI and pre-commit checks need
        one too, so catalog mistakes surface after deploy. Backstage's catalog
        validate takes `--instance`.
    - name: change-preview
      level: bronze
      check: entity.changePreview
      evidence: "['changePreview is ' + string(entity.changePreview)]"
      fix: >-
        Keep `toolbox plan --local --base <manifest>` diffing entities, scores
        and tuples.
      rationale: >-
        Without a preview, production is the first place a change shows that it
        re-owned entities, moved scores or widened access; a diff before deploy
        catches those in review.
    - name: upgrade-lines
      level: bronze
      check: entity.upgradeLinesPerRelease <= 10.0
      value: entity.upgradeLinesPerRelease
      better: lower
      unit: lines
      tolerance: 0.1
      evidence: "[string(entity.upgradeLinesPerRelease) + ' lines to change per release']"
      fix: >-
        Keep examples/repo-portal-starter passing `toolbox validate` and
        `toolbox test` across releases
        (experiments/backstage-compare/upgrade.py).
      rationale: >-
        Lines an adopter edits per release are a cost paid on every release for
        the portal's life, and adopters who skip it stay on unpatched releases.
        Unlike measures: Toolbox counts required lines, Backstage its suggested
        template diff.
      links:
      - title: Unlike measures
        url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/ADJUDICATION.md#43-measures-that-compare-unlike-things
    - name: rollback-steps
      level: bronze
      check: entity.rollbackManualStepsPerRelease == 0.0
      value: entity.rollbackManualStepsPerRelease
      better: lower
      unit: steps
      tolerance: 0.1
      evidence: >-
        [string(entity.rollbackManualStepsPerRelease) + ' manual steps per
        release to roll back']
      fix: >-
        Keep the store's migrations readable by the previous release, as
        experiments/backstage-compare/upgrade.py checks.
      rationale: >-
        A rollback that needs hand-run database steps is slow and error-prone in
        the incident that calls for it. Backstage documents a manual Knex
        `migrate:down`, run from the newer version.
      links:
      - title: Backstage manual Knex rollback
        url: https://github.com/backstage/backstage/blob/v1.57.1/docs/tutorials/manual-knex-rollback.md
    facets: {summary: public, details: public}

  - name: vs-backstage-org-fit
    title: Org fit
    kind: Product
    description: >-
      Fitting how an organisation is built: one repository with no server
      first, then many portals joined. Conway's law and Team Topologies.
    rationale: >-
      Systems take the shape of the organisation that builds them (Conway),
      and teams move fastest when they can test without an integrated
      environment (DORA, loosely coupled teams). A portal that needs a central
      server first makes every team wait for the platform team; one that
      cannot join portals cannot grow past one.
    links:
    - title: Factor F12
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md#2-factors
    - title: DORA loosely coupled teams
      url: https://dora.dev/capabilities/loosely-coupled-teams/
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: repo-scoped
      level: bronze
      check: entity.repoScopedWithoutServer
      evidence: "['repoScopedWithoutServer is ' + string(entity.repoScopedWithoutServer)]"
      fix: >-
        Keep `toolbox report` scoring a repository with no server, as
        actions/report does.
      rationale: >-
        A team that can score its own repository in CI, with no server, gets
        value before anyone runs a portal, and the platform team has nothing to
        operate for it.
      links:
      - title: Repo value
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/repo-value.md
      - title: D69 report as an Action
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7VXK0480000000000000000.md
    - name: federation
      level: bronze
      check: entity.federates
      evidence: "['federates is ' + string(entity.federates)]"
      fix: Build federation as docs/design/federation.md designs it (D68).
      rationale: >-
        Without federation, a large organisation runs one catalog for everyone
        or many that never join, and neither fits teams that own their portals.
        Neither product federates, so this rule is parity.
      links:
      - title: Federation design
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/federation.md
      - title: D68 federation designed
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7VWS4ZJ0000000000000000.md
    facets: {summary: public, details: public}

  - name: vs-backstage-agent-surface
    title: Agent surface
    kind: Product
    description: >-
      What a coding agent gets: MCP by default, and how many tokens it spends
      to learn the tools and read one entity.
    rationale: >-
      Coding agents are a primary audience of a portal, and every byte a tool
      returns is tokens they pay for and context the task loses. A portal
      without MCP leaves each adopter to build and secure their own agent
      integration.
    links:
    - title: Factor F13
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md#2-factors
    - title: Static facts
      url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#static-facts-and-single-run-probes
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: mcp-by-default
      level: bronze
      check: entity.mcpByDefault
      evidence: "['mcpByDefault is ' + string(entity.mcpByDefault)]"
      fix: Serve /mcp from `toolbox serve` and stdio from `toolbox mcp`.
      rationale: >-
        If MCP is an add-on, each adopter must install, configure and secure it
        before an agent can read the catalog. Both products serve it by default,
        so this rule is parity.
    - name: tools-list-size
      level: bronze
      check: entity.mcpToolsListBytes <= 32768.0
      value: entity.mcpToolsListBytes
      better: lower
      unit: bytes
      tolerance: 0.1
      evidence: "[string(entity.mcpToolsListBytes) + ' bytes in tools/list']"
      fix: >-
        Shorten tool descriptions and schemas in
        crates/toolbox-api/src/mcp.rs.
      rationale: >-
        An agent loads tools/list before it does anything, so its size is a
        fixed token cost on every session and crowds out the task's context.
        Backstage is measured with its unrestricted MCP token.
    - name: get-entity-size
      level: bronze
      check: entity.mcpGetEntityBytes <= 4096.0
      value: entity.mcpGetEntityBytes
      better: lower
      unit: bytes
      tolerance: 0.1
      evidence: "[string(entity.mcpGetEntityBytes) + ' bytes to read one entity']"
      fix: >-
        Trim the get tool's response in crates/toolbox-api/src/mcp.rs to the
        fields an agent asks for.
      rationale: >-
        Reading an entity is an agent's routine call, so a bloated response
        multiplies its token cost and buries the fields it asked for.
    facets: {summary: public, details: public}

  - name: vs-backstage-extensibility
    title: Extensibility
    kind: Product
    description: >-
      What it takes to add an integration: which languages, and whether the
      server is rebuilt. ISO 25010 modifiability.
    rationale: >-
      Extensions are where portals accrete cost: an integration built into the
      core is rebuilt, redeployed and upgraded with it. A protocol any
      language can speak, added without a rebuild, keeps that cost with the
      integration's owner (Parnas). Not pre-registered on its own; the README
      counts it inside capabilities.
    links:
    - title: Factor F11
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/backstage-comparison.md#2-factors
    - title: Connector control
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/connector-control.md
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: any-language
      level: bronze
      check: entity.extensionAnyLanguage
      evidence: "['extensionAnyLanguage is ' + string(entity.extensionAnyLanguage)]"
      fix: >-
        Keep the connector protocol language-neutral, as
        schema/connector-messages.schema.json defines it.
      rationale: >-
        If integrations must be written in the portal's own language and
        framework, the teams who own the data cannot write them, and the
        platform team becomes the bottleneck.
    - name: without-rebuild
      level: bronze
      check: entity.extensionWithoutRebuild
      evidence: "['extensionWithoutRebuild is ' + string(entity.extensionWithoutRebuild)]"
      fix: >-
        Keep remote connectors pushing to /v1/ingest with their own token
        (docs/design/connector-control.md).
      rationale: >-
        If adding an integration means rebuilding and redeploying the server,
        every new data source becomes a core release, with its risk and its wait
        in the platform team's queue.
    facets: {summary: public, details: public}

  - name: vs-backstage-capabilities
    title: Capabilities
    kind: Product
    description: >-
      What a portal does out of the box, by configuration alone. The scenarios
      come from the Backstage parity audit (D47), so they favour what
      Backstage ships.
    rationale: >-
      Functional completeness is the first question in a portal evaluation: a
      team will not adopt a portal that lacks what its developers use every
      day. Toolbox is expected to lose here, and each missing capability is
      published as a loss rather than dropped.
    links:
    - title: Verdict
      url: https://github.com/loganvolkers/toolbox/blob/main/experiments/backstage-compare/RESULTS.md#verdict
    - title: D47 Backstage parity audit
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7V8P2VY0000000000000000.md
    owner: group:maintainers
    track: vs-backstage
    levels: [bronze]
    compare: {subject: product:toolbox, peers: [product:backstage]}
    rules:
    - name: catalog-browse
      level: bronze
      check: entity.capCatalogBrowse
      evidence: "['capCatalogBrowse is ' + string(entity.capCatalogBrowse)]"
      fix: Keep the catalog pages in ui/src and `toolbox query`.
      rationale: >-
        Browsing and filtering the catalog is a portal's base job; without it,
        people and agents cannot find a service or the team behind it.
    - name: ownership
      level: bronze
      check: entity.capOwnership
      evidence: "['capOwnership is ' + string(entity.capOwnership)]"
      fix: Keep `toolbox owner` and the owner_of MCP tool.
      rationale: >-
        Incident response, reviews and access requests start from who owns a
        service; a portal that cannot answer through teams leaves people asking
        in chat.
    - name: graph
      level: bronze
      check: entity.capGraph
      evidence: "['capGraph is ' + string(entity.capGraph)]"
      fix: Keep `toolbox graph` and /v1/entities/{id}/graph.
      rationale: >-
        Relations show what a change or an outage affects; without a graph,
        impact analysis means reading descriptors one by one.
    - name: docs-search
      level: bronze
      check: entity.capDocsSearch
      evidence: "['capDocsSearch is ' + string(entity.capDocsSearch)]"
      fix: >-
        Index documentation text with the entities that `toolbox search` reads
        (docs/v1-spec.md, full-text search).
      rationale: >-
        Developers search for answers in documentation, not only for entity
        names; a portal whose search stops at names and titles sends them to
        another tool.
    - name: docs
      level: bronze
      check: entity.capDocs
      evidence: "['capDocs is ' + string(entity.capDocs)]"
      fix: >-
        Carry a documentation tool's built site per component, as
        docs/design/toolbox-and-tools.md carries tools.
      rationale: >-
        Without a component's docs in the portal, developers switch to a
        separate docs site, and the portal stops being the one place to learn
        about a service.
    - name: templates
      level: bronze
      check: entity.capTemplates
      evidence: "['capTemplates is ' + string(entity.capTemplates)]"
      fix: >-
        Build self-service actions (v1-spec M5) once D64 lifts the pause
        (docs/design/action-runs.md).
      rationale: >-
        Templates are how a platform spreads its defaults to new services;
        without them, each service starts as a copy of an old one. Toolbox's
        self-service actions are paused (D64).
      links:
      - title: D64 actions paused
        url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7VTP0HG0000000000000000.md
    - name: scorecards
      level: bronze
      check: entity.capScorecards
      evidence: "['capScorecards is ' + string(entity.capScorecards)]"
      fix: Keep scorecards in the manifest, as docs/v1-spec.md §5 defines them.
      rationale: >-
        Scorecards turn standards into what each team must fix next; without
        them, standards live in documents nobody checks. Backstage passes
        through the Tech Insights add-on, configured in code.
    - name: api-docs
      level: bronze
      check: entity.capApiDocs
      evidence: "['capApiDocs is ' + string(entity.capApiDocs)]"
      fix: Render an API entity's definition through a UI extension in ui/src.
      rationale: >-
        A rendered API definition lets a consumer read a service's contract
        where they found the service; otherwise it sits unread in the provider's
        repository.
    - name: kubernetes
      level: bronze
      check: entity.capKubernetes
      evidence: "['capKubernetes is ' + string(entity.capKubernetes)]"
      fix: >-
        Add a connector that reads workloads from the Kubernetes API
        (docs/design/connector-control.md).
      rationale: >-
        Seeing a component's workloads lets its owner check what runs where
        without cluster access; without it, on-call leaves the portal for
        kubectl at the first question.
    - name: notifications
      level: bronze
      check: entity.capNotifications
      evidence: "['capNotifications is ' + string(entity.capNotifications)]"
      fix: >-
        Notify owners of score changes through a connector or webhook
        (docs/design/campaigns.md).
      rationale: >-
        Without notifications, a score drop or a change to what a team owns is
        noticed only when someone happens to open the portal.
    - name: permission-rule
      level: bronze
      check: entity.capPermissionRule
      evidence: "['capPermissionRule is ' + string(entity.capPermissionRule)]"
      fix: Keep the OpenFGA model in the manifest (docs/authorization.md).
      rationale: >-
        Organisations differ in who may see and do what; without custom rules, a
        portal's access model is too open or forked. Backstage's rule is
        TypeScript code, counted in its favour.
    - name: mcp-read
      level: bronze
      check: entity.capMcpRead
      evidence: "['capMcpRead is ' + string(entity.capMcpRead)]"
      fix: Keep the read tools in crates/toolbox-api/src/mcp.rs.
      rationale: >-
        Without MCP read tools, an agent cannot ask the portal who owns what,
        and guesses from code and commit history instead.
    - name: community
      level: bronze
      check: entity.contributors >= 10.0
      value: entity.contributors
      better: higher
      unit: contributors
      tolerance: 0.1
      evidence: "[string(entity.contributors) + ' contributors']"
      fix: >-
        Make a first contribution easy: CONTRIBUTING.md, good first issues, and
        a green `cargo test` on a fresh clone.
      rationale: >-
        Contributors fix bugs, review changes and keep a project alive when a
        maintainer leaves; with a handful, the adopter carries the risk that it
        stalls.
    facets: {summary: public, details: public}
