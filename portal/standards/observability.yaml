# Runtime observability for Seikika (OTel design / D6). Maintainer SDLC.
# Included by portal/seikika.yaml; see portal/README.md for the layout.

kinds:
  - name: Observability
    title: Telemetry checklist
    description: >-
      A declared runtime-telemetry checklist: required crate paths, metric
      catalog, alert stubs and assessment evidence for OTel/Prometheus
      instrumentation.
    identityFrom: [connector:workspace]
    fields:
      title: {type: string, description: Human title for the checklist.}
      intent: {type: string, description: What the checklist is for.}
      crate: {type: string, description: Path to the telemetry crate.}
      catalog: {type: string, description: Path to the SemVer metric catalog.}
      serviceNameDoc:
        type: string
        description: Docs that cite OTEL_SERVICE_NAME.
      promTest:
        type: string
        description: Test that asserts /metrics catalog names.
      structuredLogTest:
        type: string
        description: Test that structured JSON logs work.
      alerts: {type: list, items: string, description: Alert rule stub files.}
      monitorAssessment:
        type: string
        description: Assessment of operator/monitor.
      otlpTestbed:
        type: string
        description: Script that tests export to a local OTel collector.
      notInCi:
        type: list
        items: string
        description: Declared test commands without a matching CI workflow step.
      missingPaths:
        type: list
        items: string
        description: Declared paths that do not exist under the repository root.
      hash: {type: string, description: Content hash of the declaration.}
      missingCrate:
        type: list
        items: string
        description: Crate path when missing.
        computed: "entity.crate in entity.missingPaths ? [entity.crate] : []"
      missingCatalog:
        type: list
        items: string
        computed: "entity.catalog in entity.missingPaths ? [entity.catalog] : []"
      missingServiceNameDoc:
        type: list
        items: string
        computed: >-
          entity.serviceNameDoc in entity.missingPaths ? [entity.serviceNameDoc] :
          []
      missingPromTest:
        type: list
        items: string
        computed: "entity.promTest in entity.missingPaths ? [entity.promTest] : []"
      missingStructuredLogTest:
        type: list
        items: string
        computed: >-
          entity.structuredLogTest in entity.missingPaths ?
          [entity.structuredLogTest] : []
      missingAlerts:
        type: list
        items: string
        description: Required alerts omitted from the checklist, plus missing declared files.
        computed: >-
          ['ops/alerts/snapshot-lag.yaml', 'ops/alerts/index-freshness.yaml']
          .filter(a, !(a in entity.alerts)) + entity.alerts.filter(a, a in
          entity.missingPaths)
      missingAssessment:
        type: list
        items: string
        computed: >-
          entity.monitorAssessment in entity.missingPaths ?
          [entity.monitorAssessment] : []
      missingOtlpTestbed:
        type: list
        items: string
        computed: >-
          entity.otlpTestbed in entity.missingPaths ? [entity.otlpTestbed] : []
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/observability
      id: "'observability:' + record.id"
      set: >-
        {'title': record.title, 'intent': record.intent, 'crate': record.crate,
         'catalog': record.catalog, 'serviceNameDoc': record.serviceNameDoc,
         'promTest': record.promTest, 'structuredLogTest': record.structuredLogTest,
         'alerts': record.alerts, 'monitorAssessment': record.monitorAssessment,
         'otlpTestbed': record.otlpTestbed, 'missingPaths': record.missingPaths,
         'notInCi': has(record.notInCi) ? record.notInCi : [record.otlpTestbed],
         'hash': record.hash}

scorecards:
  - name: maintainer-observability
    title: Runtime observability
    kind: Observability
    description: >-
      Seikika's runtime telemetry checklist: the OTel crate, metric catalog,
      structured logs, alert stubs and an exported trace, each a file that
      exists (docs/design/observability.md).
    rationale: >-
      Operators can't run a portal they can't see: without traces, metrics and
      logs under a stable contract, connector lag or a stuck snapshot goes
      unnoticed. Bronze is the crate and catalog that keep Prometheus and OTLP
      names from drifting, silver adds logs, alerts and a reviewed monitor
      stage, and gold a trace exported to a real collector.
    links:
    - title: Observability design
      url: https://github.com/seikika/seikika/blob/main/docs/design/observability.md
    - title: Telemetry crate decision
      url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M81ADN8C10EA1Z1VNRY3A5JZ.md
    - title: 'Decision: observability'
      url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M7TCJ31X0000000000000000.md
    owner: group:maintainers
    track: maintainer
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
    - name: otel-crate-present
      level: bronze
      check: entity.missingCrate.size() == 0
      evidence: entity.missingCrate
      fix: >-
        Add crates/seikika-telemetry to the workspace with opentelemetry
        dependencies (plan §4, D6).
      rationale: >-
        Without one crate that owns the bootstrap, each crate sets up its own
        exporters and metric names drift between Prometheus and OTLP.
    - name: service-name-documented
      level: bronze
      check: entity.missingServiceNameDoc.size() == 0
      evidence: entity.missingServiceNameDoc
      fix: >-
        Document OTEL_SERVICE_NAME / service.name in the telemetry crate
        README.
      rationale: >-
        Backends group every signal by `service.name`; an operator who doesn't
        know to set it sees Seikika's telemetry under a generic default, mixed
        with other services.
      links:
      - title: OTEL_SERVICE_NAME
        url: https://opentelemetry.io/docs/languages/sdk-configuration/general/#otel_service_name
    - name: metric-catalog-complete
      level: bronze
      check: entity.missingCatalog.size() == 0
      evidence: entity.missingCatalog
      fix: >-
        Add METRIC_CATALOG.md listing the v1 required metric names (v1-spec
        §10.5).
      rationale: >-
        Metric names, units and labels are part of Seikika's SemVer surface, and
        operators' dashboards and alerts depend on them; without a written
        catalog a rename breaks them silently.
      links:
      - title: Metric catalog
        url: https://github.com/seikika/seikika/blob/main/crates/seikika-telemetry/METRIC_CATALOG.md
    - name: prom-endpoint
      level: bronze
      check: entity.missingPromTest.size() == 0
      evidence: entity.missingPromTest
      fix: >-
        Add a unit/integration test that asserts metrics_text() contains the
        catalog names (including seikika_snapshot_lag_seconds).
      rationale: >-
        A catalog protects operators only if `/metrics` really serves it; a test
        pinning the names catches a dropped or renamed metric before it ships.
    - name: structured-logs
      level: silver
      check: entity.missingStructuredLogTest.size() == 0
      evidence: entity.missingStructuredLogTest
      fix: >-
        Add a test that init with JSON log format succeeds, and route
        connector/snapshot failures through tracing instead of eprintln.
      rationale: >-
        Plain stderr lines can't be queried or joined to a trace; JSON logs
        carrying the trace id let an operator follow a failure from its log line
        to the request that caused it.
    - name: operator-monitor-alerts
      level: silver
      check: entity.missingAlerts.size() == 0
      evidence: entity.missingAlerts
      fix: >-
        List both snapshot-lag.yaml and index-freshness.yaml under alerts in
        portal/observability/runtime.yaml. Add any missing files under
        ops/alerts/.
      rationale: >-
        Metrics nobody alerts on are noticed only after users notice; snapshot
        lag and index freshness are the signals that a portal is serving stale
        data.
    - name: assessed-monitor
      level: silver
      check: entity.missingAssessment.size() == 0
      evidence: entity.missingAssessment
      fix: >-
        Write portal/assessments/.../operator/monitor.yaml via seikika assess
        (sdlc-stage-quality).
      rationale: >-
        Every file can exist while the operator's monitor stage still can't be
        carried out by an agent; only a review against sdlc-stage-quality judges
        that.
    - name: otlp-export-tested
      level: gold
      check: entity.missingOtlpTestbed.size() == 0 && entity.notInCi.size() == 0
      evidence: >-
        entity.missingOtlpTestbed + entity.notInCi.filter(p, !(p in
        entity.missingOtlpTestbed)).map(p, p + ' is not run by CI')
      fix: >-
        Add the collector scoring script under experiments/otel-testbed and
        invoke it from a workflow run step in .github/workflows/.
      rationale: >-
        Unit tests can pass while nothing reaches a collector; exporting to a
        pinned otelcol-contrib is what proves the OTLP contract that operators'
        backends depend on.
      links:
      - title: OTel testbed
        url: https://github.com/seikika/seikika/blob/main/experiments/otel-testbed/README.md
    facets: {summary: public, details: public}
