# Hand-written expectations for the Toolbox-for-Toolbox standards, over the curated fixtures in
# ../fixtures (a trimmed snapshot of this repo plus hand-made runner results). They pin what each
# rule means; the live portal applies the same rules to the whole repository.
name: standards
assert:
  # Layer 1: crates
  - name: a crate with passing tests and clippy, 80%+ documented, no huge functions reaches silver
    expect: "score('maintainer-crate', 'crate:toolbox-expr').level == 'silver' && score('maintainer-crate', 'crate:toolbox-expr').rules['fully-documented'] == 'fail'"
  - name: a failing test run caps a crate below bronze
    expect: "score('maintainer-crate', 'crate:toolbox-derive').rules['tests-pass'] == 'fail' && score('maintainer-crate', 'crate:toolbox-derive').level == 'none'"
  - name: clippy warnings and missing tests both fail bronze
    expect: "score('maintainer-crate', 'crate:toolbox-connector-git-files').rules['clippy-clean'] == 'fail' && score('maintainer-crate', 'crate:toolbox-connector-git-files').rules['has-tests'] == 'fail'"
  - name: placeholder crates are skipped
    expect: "score('maintainer-crate', 'crate:toolbox-durable').level == 'skipped'"
  - name: runner results land on the crate entity
    expect: "entity('crate:toolbox-derive').tests.failed == 1 && entity('crate:toolbox-connector-git-files').clippy.warnings == 1"
  - name: evidence names the functions to split
    expect: "entity('crate:toolbox-derive').longFunctions.exists(f, f.startsWith('Pipeline::run at src/lib.rs'))"
  - name: workspace dependencies become inbound relations
    expect: "'crates/toolbox-derive' in entity('crate:toolbox-expr').dependents"
  # Layer 1: docs
  - name: a design doc without a Sources section stops at bronze
    expect: "score('maintainer-docs', 'doc:docs/design/dashboards.md').level == 'bronze' && score('maintainer-docs', 'doc:docs/design/dashboards.md').rules['cites-sources'] == 'fail'"
  - name: broken links and a bare SDLC fail bronze
    expect: "score('maintainer-docs', 'doc:docs/v1-spec.md').rules['links-resolve'] == 'fail' && score('maintainer-docs', 'doc:docs/v1-spec.md').rules['names-sdlc-layer'] == 'fail'"
  - name: append-only logs are exempt from wording rules
    expect: "score('maintainer-docs', 'doc:docs/decisions.md').level == 'skipped'"
  # Layer 2: operator commands
  - name: commands split into operator and user layers
    expect: "entity('command:validate').layer == 'operator' && entity('command:owner').layer == 'user' && entity('command:mcp').layer == 'user'"
  - name: a documented command that no script runs stops at bronze
    expect: "'docs/v1-spec.md' in entity('command:validate').documentedIn && score('operator-cli', 'command:validate').level == 'bronze'"
  - name: an undocumented, unexercised command fails bronze
    expect: "score('operator-cli', 'command:push').level == 'none'"
  # Layer 3: user interfaces
  - name: the acceptance script exercises the owner command
    expect: "entity('command:owner').exercisedBy == ['scripts/m4-acceptance.sh']"
  - name: an MCP tool reached only through the CLI is not contract-tested
    expect: "entity('mcp-tool:owner_of').viaCli == ['owner'] && score('user-mcp', 'mcp-tool:owner_of').rules['contract-tested'] == 'fail'"
  - name: undescribed MCP inputs fail silver
    expect: "score('user-mcp', 'mcp-tool:search').level == 'bronze' && score('user-mcp', 'mcp-tool:search').rules['inputs-described'] == 'fail'"
  # Evidence: failing rules say exactly what fails
  - name: failing rules carry their evidence
    expect: "score('maintainer-crate', 'crate:toolbox-derive').evidence['short-functions'].size() == 3 && score('maintainer-crate', 'crate:toolbox-connector-git-files').evidence['clippy-clean'] == ['src/main.rs:12 clippy::needless_return unneeded `return` statement']"
  - name: passing rules have no evidence
    expect: "!('crate-docs' in score('maintainer-crate', 'crate:toolbox-derive').evidence) && !('tests-pass' in score('maintainer-crate', 'crate:toolbox-expr').evidence)"
  - name: evidence lists what fails
    expect: "score('user-mcp', 'mcp-tool:search').evidence['inputs-described'] == ['kind', 'limit', 'query'] && score('user-mcp', 'mcp-tool:search').evidence['documented'] == ['documented in: nothing']"
  - name: a failing rule without an evidence expression has none
    expect: "score('operator-cli', 'command:validate').rules['exercised'] == 'fail' && (!has(score('operator-cli', 'command:validate').evidence) || !('exercised' in score('operator-cli', 'command:validate').evidence))"
  - name: without a runner run, contract-tested falls back to tools/call bodies and says so
    expect: "score('user-mcp', 'mcp-tool:owner_of').evidence['contract-tested'] == ['no tools/call naming this tool in tests or scripts (static mode)']"
  - name: observed calls from the runner decide contract-tested when present
    expect: "entity('mcp-tool:get').observed.calls == 0 && score('user-mcp', 'mcp-tool:get').rules['contract-tested'] == 'fail' && entity('mcp-tool:search').observed.calls == 4 && score('user-mcp', 'mcp-tool:search').rules['contract-tested'] == 'pass'"
  # CI security (fixtures: this repo's ci.yml and report action, trimmed; a synthetic release.yml)
  - name: tag-pinned actions fail bronze, and zizmor's unpinned-uses isn't counted twice
    expect: "score('maintainer-ci-security', 'workflow:.github/workflows/ci.yml').rules['pinned-to-sha'] == 'fail' && score('maintainer-ci-security', 'workflow:.github/workflows/ci.yml').rules['no-high-findings'] == 'pass' && score('maintainer-ci-security', 'workflow:.github/workflows/ci.yml').evidence['pinned-to-sha'] == ['actions/checkout@v4', 'actions/setup-go@v5', 'actions/setup-node@v4', 'actions/setup-python@v5']"
  - name: a dangerous trigger is a high finding with evidence, and a write token on it fails silver
    expect: "score('maintainer-ci-security', 'workflow:.github/workflows/release.yml').evidence['no-high-findings'] == ['dangerous-triggers at line 3: use of fundamentally insecure workflow trigger'] && score('maintainer-ci-security', 'workflow:.github/workflows/release.yml').rules['no-write-tokens-on-risky-triggers'] == 'fail'"
  - name: without actionlint's output its rule is unknown, not failing
    expect: "score('maintainer-ci-security', 'workflow:.github/workflows/release.yml').rules['actionlint-clean'] == 'unknown'"
  - name: medium findings (artipacked) fail silver
    expect: "score('maintainer-ci-security', 'workflow:.github/workflows/ci.yml').evidence['no-medium-findings'] == ['artipacked at line 14: credential persistence through GitHub Actions artifacts']"
  # CI reliability (fixture: this repo's real run history on main, 2026-11-20)
  - name: a 92% fail rate and 11 red runs in a row fail bronze
    expect: "score('maintainer-ci-reliability', 'workflow:.github/workflows/ci.yml').evidence['fail-rate-under-20'] == ['92% of the last 12 decided runs on main failed'] && score('maintainer-ci-reliability', 'workflow:.github/workflows/ci.yml').rules['main-not-stuck-red'] == 'fail'"
  - name: no job timeouts and no concurrency group are named
    expect: "score('maintainer-ci-reliability', 'workflow:.github/workflows/ci.yml').evidence['every-job-has-timeout'].size() == 6 && score('maintainer-ci-reliability', 'workflow:.github/workflows/ci.yml').rules['cancels-superseded-runs'] == 'fail'"
  - name: without run data the run rules fail and say why
    expect: "score('maintainer-ci-reliability', 'workflow:.github/workflows/release.yml').evidence['main-not-stuck-red'] == ['no run data (github-actions connector skipped or no token)']"
  - name: action metadata isn't scored for reliability
    expect: "score('maintainer-ci-reliability', 'workflow:actions/report/action.yml').level == 'skipped'"
  # Supply chain
  - name: an action pinned by SHA in one workflow and by tag in another fails, naming both
    expect: "score('maintainer-action-deps', 'action:actions/checkout').evidence['pinned-everywhere'] == ['actions/checkout@v4', 'used by .github/workflows/ci.yml', 'used by .github/workflows/release.yml'] && score('maintainer-action-deps', 'action:actions/cache').level == 'bronze'"
