# Hand-written expectations for the Toolbox-for-Toolbox standards, over the curated fixtures in
# ../fixtures (a trimmed snapshot of this repo plus hand-made runner results). They pin what each
# rule means; the live portal applies the same rules to the whole repository.
name: standards
assert:
  # Layer 1: crates
  - name: a crate with passing tests and clippy, 80%+ documented, no huge functions reaches silver
    expect: "score('maintainer-crate', 'crate:toolbox-expr').level == 'silver' && score('maintainer-crate', 'crate:toolbox-expr').rules['fully-documented'] == 'fail'"
  - name: a failing test run caps a crate below bronze
    expect: "score('maintainer-crate', 'crate:toolbox-derive').rules['tests-pass'] == 'fail' && score('maintainer-crate', 'crate:toolbox-derive').level == 'none'"
  - name: clippy warnings and missing tests both fail bronze
    expect: "score('maintainer-crate', 'crate:toolbox-connector-git-files').rules['clippy-clean'] == 'fail' && score('maintainer-crate', 'crate:toolbox-connector-git-files').rules['has-tests'] == 'fail'"
  - name: placeholder crates are skipped
    expect: "score('maintainer-crate', 'crate:toolbox-durable').level == 'skipped'"
  - name: runner results land on the crate entity
    expect: "entity('crate:toolbox-derive').tests.failed == 1 && entity('crate:toolbox-connector-git-files').clippy.warnings == 1"
  - name: evidence names the functions to split
    expect: "entity('crate:toolbox-derive').longFunctions.exists(f, f.startsWith('Pipeline::run at src/lib.rs'))"
  - name: workspace dependencies become inbound relations
    expect: "'crates/toolbox-derive' in entity('crate:toolbox-expr').dependents"
  # Layer 1: docs
  - name: a design doc without a Sources section stops at bronze
    expect: "score('maintainer-docs', 'doc:docs/design/dashboards.md').level == 'bronze' && score('maintainer-docs', 'doc:docs/design/dashboards.md').rules['cites-sources'] == 'fail'"
  - name: broken links and a bare SDLC fail bronze
    expect: "score('maintainer-docs', 'doc:docs/v1-spec.md').rules['links-resolve'] == 'fail' && score('maintainer-docs', 'doc:docs/v1-spec.md').rules['names-sdlc-layer'] == 'fail'"
  - name: append-only logs are exempt from wording rules
    expect: "score('maintainer-docs', 'doc:docs/decisions.md').level == 'skipped'"
  # Layer 2: operator commands
  - name: commands split into operator and user layers
    expect: "entity('command:validate').layer == 'operator' && entity('command:owner').layer == 'user' && entity('command:mcp').layer == 'user'"
  - name: a documented command that no script runs stops at bronze
    expect: "'docs/v1-spec.md' in entity('command:validate').documentedIn && score('operator-cli', 'command:validate').level == 'bronze'"
  - name: an undocumented, unexercised command fails bronze
    expect: "score('operator-cli', 'command:push').level == 'none'"
  # Layer 3: user interfaces
  - name: the acceptance script exercises the owner command
    expect: "entity('command:owner').exercisedBy == ['scripts/m4-acceptance.sh']"
  - name: an MCP tool reached only through the CLI is not contract-tested
    expect: "entity('mcp-tool:owner_of').viaCli == ['owner'] && score('user-mcp', 'mcp-tool:owner_of').rules['contract-tested'] == 'fail'"
  - name: undescribed MCP inputs fail silver
    expect: "score('user-mcp', 'mcp-tool:search').level == 'bronze' && score('user-mcp', 'mcp-tool:search').rules['inputs-described'] == 'fail'"
  # Evidence: failing rules say exactly what fails
  - name: failing rules carry their evidence
    expect: "score('maintainer-crate', 'crate:toolbox-derive').evidence['short-functions'].size() == 3 && score('maintainer-crate', 'crate:toolbox-connector-git-files').evidence['clippy-clean'] == ['src/main.rs:12 clippy::needless_return unneeded `return` statement']"
  - name: passing rules have no evidence
    expect: "!('crate-docs' in score('maintainer-crate', 'crate:toolbox-derive').evidence) && !('tests-pass' in score('maintainer-crate', 'crate:toolbox-expr').evidence)"
  - name: evidence lists what fails
    expect: "score('user-mcp', 'mcp-tool:search').evidence['inputs-described'] == ['kind', 'limit', 'query'] && score('user-mcp', 'mcp-tool:search').evidence['documented'] == ['documented in: nothing']"
  - name: a failing rule without an evidence expression has none
    expect: "score('operator-cli', 'command:validate').rules['exercised'] == 'fail' && (!has(score('operator-cli', 'command:validate').evidence) || !('exercised' in score('operator-cli', 'command:validate').evidence))"
  - name: without a runner run, contract-tested falls back to tools/call bodies and says so
    expect: "score('user-mcp', 'mcp-tool:owner_of').evidence['contract-tested'] == ['no tools/call naming this tool in tests or scripts (static mode)']"
  - name: observed calls from the runner decide contract-tested when present
    expect: "entity('mcp-tool:get').observed.calls == 0 && score('user-mcp', 'mcp-tool:get').rules['contract-tested'] == 'fail' && entity('mcp-tool:search').observed.calls == 4 && score('user-mcp', 'mcp-tool:search').rules['contract-tested'] == 'pass'"
  # CI security (fixtures: this repo's ci.yml and report action, trimmed; a synthetic release.yml)
  - name: tag-pinned actions fail bronze, and zizmor's unpinned-uses isn't counted twice
    expect: "score('maintainer-ci-security', 'workflow:.github/workflows/ci.yml').rules['pinned-to-sha'] == 'fail' && score('maintainer-ci-security', 'workflow:.github/workflows/ci.yml').rules['no-high-findings'] == 'pass' && score('maintainer-ci-security', 'workflow:.github/workflows/ci.yml').evidence['pinned-to-sha'] == ['actions/checkout@v4', 'actions/setup-go@v5', 'actions/setup-node@v4', 'actions/setup-python@v5']"
  - name: a dangerous trigger is a high finding with evidence, and a write token on it fails silver
    expect: "score('maintainer-ci-security', 'workflow:.github/workflows/release.yml').evidence['no-high-findings'] == ['dangerous-triggers at line 3: use of fundamentally insecure workflow trigger'] && score('maintainer-ci-security', 'workflow:.github/workflows/release.yml').rules['no-write-tokens-on-risky-triggers'] == 'fail'"
  - name: without actionlint's output its rule is unknown, not failing
    expect: "score('maintainer-ci-security', 'workflow:.github/workflows/release.yml').rules['actionlint-clean'] == 'unknown'"
  - name: medium findings (artipacked) fail silver
    expect: "score('maintainer-ci-security', 'workflow:.github/workflows/ci.yml').evidence['no-medium-findings'] == ['artipacked at line 14: credential persistence through GitHub Actions artifacts']"
  # CI reliability (fixture: this repo's real run history on main, 2026-11-20)
  - name: a 92% fail rate and 11 red runs in a row fail bronze
    expect: "score('maintainer-ci-reliability', 'workflow:.github/workflows/ci.yml').evidence['fail-rate-under-20'] == ['92% of the last 12 decided runs on main failed'] && score('maintainer-ci-reliability', 'workflow:.github/workflows/ci.yml').rules['main-not-stuck-red'] == 'fail'"
  - name: no job timeouts and no concurrency group are named
    expect: "score('maintainer-ci-reliability', 'workflow:.github/workflows/ci.yml').evidence['every-job-has-timeout'].size() == 6 && score('maintainer-ci-reliability', 'workflow:.github/workflows/ci.yml').rules['cancels-superseded-runs'] == 'fail'"
  - name: without run data the run rules fail and say why
    expect: "score('maintainer-ci-reliability', 'workflow:.github/workflows/release.yml').evidence['main-not-stuck-red'] == ['no run data (github-actions connector skipped or no token)']"
  - name: action metadata isn't scored for reliability
    expect: "score('maintainer-ci-reliability', 'workflow:actions/report/action.yml').level == 'skipped'"
  # Supply chain
  - name: an action pinned by SHA in one workflow and by tag in another fails, naming both
    expect: "score('maintainer-action-deps', 'action:actions/checkout').evidence['pinned-everywhere'] == ['actions/checkout@v4', 'used by .github/workflows/ci.yml', 'used by .github/workflows/release.yml'] && score('maintainer-action-deps', 'action:actions/cache').level == 'bronze'"
  # Scorecards for scorecards (fixtures: real records from `toolbox describe scorecards` for a few of
  # our rules, plus a synthetic "sprawling" scorecard). They also score themselves.
  - name: a well-made rule reaches gold
    expect: "score('meta-rule', 'rule:toolbox/maintainer-ci-security/no-medium-findings').level == 'gold'"
  - name: an untested rule that never fails on the fixtures stops below bronze
    expect: "score('meta-rule', 'rule:toolbox/maintainer-ci-security/least-privilege-token').rules['tested'] == 'fail' && score('meta-rule', 'rule:toolbox/maintainer-ci-security/least-privilege-token').rules['both-outcomes-on-fixtures'] == 'fail'"
  - name: a rule that never evaluates on fixtures, with a two-word fix, fails every bronze rule
    expect: "score('meta-rule', 'rule:demo/sprawling/everything').rules['explains-fix'] == 'fail' && score('meta-rule', 'rule:demo/sprawling/everything').rules['decided-on-fixtures'] == 'fail' && score('meta-rule', 'rule:demo/sprawling/everything').evidence['explains-fix'] == ['fix has 2 words']"
  - name: nested loops and a large check are named
    expect: "score('meta-rule', 'rule:demo/sprawling/everything').evidence['no-nested-loops'] == ['check loops 2'] && score('meta-rule', 'rule:demo/sprawling/everything').rules['readable'] == 'fail'"
  - name: a non-trivial check without evidence fails shows-evidence; a trivial one is exempt until gold
    expect: "score('meta-rule', 'rule:acme/github-app-hygiene/only-approved-apps').rules['shows-evidence'] == 'fail' && score('meta-rule', 'rule:toolbox/user-cli/has-help').rules['always-explains'] == 'fail'"
  - name: the meta scorecard scores its own rules (no further level)
    expect: "score('meta-rule', 'rule:toolbox/meta-rule/tested').rules['tested'] == 'pass' && score('meta-scorecard', 'scorecard:toolbox/meta-rule').rules['tested'] == 'pass'"
  - name: a scorecard with an empty level and fixtures at one level fails bronze, naming them
    expect: "score('meta-scorecard', 'scorecard:demo/sprawling').evidence['every-level-has-rules'] == ['gold'] && score('meta-scorecard', 'scorecard:demo/sprawling').rules['fixtures-show-the-ladder'] == 'fail'"
  - name: an untested scorecard fails bronze, and untested rules roll up to their scorecard
    expect: "score('meta-scorecard', 'scorecard:toolbox/user-cli').rules['tested'] == 'fail' && entity('scorecard:toolbox/maintainer-ci-security').untestedRules == ['least-privilege-token']"
  - name: always-explains, every-rule-tested and the rest of the meta rules are pinned here too
    expect: "'always-explains' in score('meta-rule', 'rule:toolbox/meta-rule/tested').rules && score('meta-scorecard', 'scorecard:toolbox/maintainer-ci-security').rules['every-rule-tested'] == 'fail' && score('meta-scorecard', 'scorecard:toolbox/maintainer-ci-security').rules['every-level-has-rules'] == 'pass'"
  # Agent skills (synthetic fixtures: one gold, one bronze, one below bronze)
  - name: a focused skill with evals, a procedure and no hidden text reaches gold
    expect: "score('maintainer-skill', 'skill:plugins/demo/focused').level == 'gold' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['valid-frontmatter'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['description-says-when'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['third-person'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['has-procedure'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['has-example'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['links-resolve'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['within-body-budget'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['portable-paths'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['states-boundaries'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['has-evals'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['no-hidden-instructions'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['no-hardcoded-secrets'] == 'pass' && score('maintainer-skill', 'skill:plugins/demo/focused').rules['one-level-deep'] == 'pass'"
  - name: a routable skill without steps, an example or a body budget stops at bronze
    expect: "score('maintainer-skill', 'skill:plugins/demo/partial').level == 'bronze' && score('maintainer-skill', 'skill:plugins/demo/partial').rules['has-procedure'] == 'fail' && score('maintainer-skill', 'skill:plugins/demo/partial').evidence['has-example'] == ['no fenced code block in SKILL.md'] && score('maintainer-skill', 'skill:plugins/demo/partial').evidence['links-resolve'] == ['references/missing.md'] && score('maintainer-skill', 'skill:plugins/demo/partial').evidence['within-body-budget'] == ['600 lines, ~6000 tokens (characters/4)'] && score('maintainer-skill', 'skill:plugins/demo/partial').evidence['has-evals'] == ['0 cases in evals/evals.json (want at least 3)'] && score('maintainer-skill', 'skill:plugins/demo/partial').evidence['one-level-deep'] == ['2 link hops, 5 supporting files'] && score('maintainer-skill', 'skill:plugins/demo/partial').evidence['states-boundaries'] == ['no error, limit, or prerequisite cue in the body']"
  - name: an invalid skill fails bronze and names the frontmatter, pronoun and secret
    expect: "score('maintainer-skill', 'skill:plugins/demo/unsafe').level == 'none' && score('maintainer-skill', 'skill:plugins/demo/unsafe').evidence['valid-frontmatter'] == [\"Directory name 'unsafe' must match skill name 'Unsafe'\"] && score('maintainer-skill', 'skill:plugins/demo/unsafe').evidence['description-says-when'] == ['12 characters'] && score('maintainer-skill', 'skill:plugins/demo/unsafe').evidence['third-person'] == ['pronoun: you'] && score('maintainer-skill', 'skill:plugins/demo/unsafe').evidence['no-hidden-instructions'] == ['3 hidden or bidi characters'] && score('maintainer-skill', 'skill:plugins/demo/unsafe').evidence['no-hardcoded-secrets'] == ['SKILL.md:9 github-token'] && score('maintainer-skill', 'skill:plugins/demo/unsafe').evidence['portable-paths'] == ['SKILL.md:4'] && score('maintainer-skill', 'skill:plugins/demo/unsafe').rules['has-procedure'] == 'fail'"
  # Connectors (synthetic fixtures: one gold, one bronze, one below bronze)
  - name: a documented connector that CI conformance-tests reaches gold
    expect: "score('maintainer-connector', 'connector:crates/demo/focused').level == 'gold' && score('maintainer-connector', 'connector:crates/demo/focused').rules['described'] == 'pass' && score('maintainer-connector', 'connector:crates/demo/focused').rules['config-documented'] == 'pass' && score('maintainer-connector', 'connector:crates/demo/focused').rules['speaks-the-protocol'] == 'pass' && score('maintainer-connector', 'connector:crates/demo/focused').rules['names-its-kinds'] == 'pass' && score('maintainer-connector', 'connector:crates/demo/focused').rules['closes-snapshots'] == 'pass' && score('maintainer-connector', 'connector:crates/demo/focused').rules['reports-missing-ids'] == 'pass' && score('maintainer-connector', 'connector:crates/demo/focused').rules['has-tests'] == 'pass' && score('maintainer-connector', 'connector:crates/demo/focused').rules['exercised-in-ci'] == 'pass' && score('maintainer-connector', 'connector:crates/demo/focused').rules['no-hardcoded-secrets'] == 'pass'"
  - name: a configured connector with no kinds, tests or CI stops at bronze
    expect: "score('maintainer-connector', 'connector:crates/demo/partial').level == 'bronze' && score('maintainer-connector', 'connector:crates/demo/partial').rules['names-its-kinds'] == 'fail' && score('maintainer-connector', 'connector:crates/demo/partial').evidence['closes-snapshots'] == ['resync never sends snapshot_complete'] && score('maintainer-connector', 'connector:crates/demo/partial').evidence['reports-missing-ids'] == ['refresh never sends not_found'] && score('maintainer-connector', 'connector:crates/demo/partial').evidence['has-tests'] == ['0 #[test] functions'] && score('maintainer-connector', 'connector:crates/demo/partial').evidence['exercised-in-ci'] == ['0 connector-test lines, 0 CI files'] && score('maintainer-connector', 'connector:crates/demo/partial').evidence['names-its-kinds'] == ['crate docs and source name no record kind']"
  - name: a binary that speaks no protocol fails bronze and names the secret
    expect: "score('maintainer-connector', 'connector:crates/demo/unsafe').level == 'none' && score('maintainer-connector', 'connector:crates/demo/unsafe').evidence['described'] == ['Cargo.toml has no description'] && score('maintainer-connector', 'connector:crates/demo/unsafe').evidence['config-documented'] == ['crate docs name neither TOOLBOX_CONNECTOR_CONFIG nor a CLI flag'] && score('maintainer-connector', 'connector:crates/demo/unsafe').evidence['speaks-the-protocol'] == ['none'] && score('maintainer-connector', 'connector:crates/demo/unsafe').evidence['no-hardcoded-secrets'] == ['src/main.rs:4 aws-access-key']"
  # Direct Cargo dependencies (synthetic fixtures: one gold, one silver, one below bronze)
  - name: a locked registry dependency declared in the workspace reaches gold
    expect: "score('maintainer-dependency', 'dependency:cargo:focused').level == 'gold' && score('maintainer-dependency', 'dependency:cargo:focused').rules['version-bounded'] == 'pass' && score('maintainer-dependency', 'dependency:cargo:focused').rules['from-a-registry'] == 'pass' && score('maintainer-dependency', 'dependency:cargo:focused').rules['locked'] == 'pass' && score('maintainer-dependency', 'dependency:cargo:focused').rules['one-version'] == 'pass' && score('maintainer-dependency', 'dependency:cargo:focused').rules['shared-is-inherited'] == 'pass'"
  - name: two resolved versions of a shared dependency stop at bronze
    expect: "score('maintainer-dependency', 'dependency:cargo:partial').level == 'bronze' && score('maintainer-dependency', 'dependency:cargo:partial').evidence['one-version'] == ['1.0.0', '2.0.0'] && score('maintainer-dependency', 'dependency:cargo:partial').evidence['shared-is-inherited'] == ['a', 'b'] && score('maintainer-dependency', 'dependency:cargo:partial').rules['locked'] == 'pass'"
  - name: a git dependency with a star requirement fails bronze
    expect: "score('maintainer-dependency', 'dependency:cargo:unsafe').level == 'none' && score('maintainer-dependency', 'dependency:cargo:unsafe').evidence['version-bounded'] == ['*'] && score('maintainer-dependency', 'dependency:cargo:unsafe').evidence['from-a-registry'] == ['git+https://example.invalid/leftpad'] && score('maintainer-dependency', 'dependency:cargo:unsafe').evidence['locked'] == ['not in Cargo.lock']"
  # Agent instruction files
  - name: a canonical AGENTS.md that links, names a command and the decision log reaches gold
    expect: "score('maintainer-agent-doc', 'agent-doc:agents/demo/focused/AGENTS.md').level == 'gold' && score('maintainer-agent-doc', 'agent-doc:agents/demo/focused/AGENTS.md').rules['single-source'] == 'pass' && score('maintainer-agent-doc', 'agent-doc:agents/demo/focused/AGENTS.md').rules['links-resolve'] == 'pass' && score('maintainer-agent-doc', 'agent-doc:agents/demo/focused/AGENTS.md').rules['has-commands'] == 'pass' && score('maintainer-agent-doc', 'agent-doc:agents/demo/focused/AGENTS.md').rules['within-budget'] == 'pass' && score('maintainer-agent-doc', 'agent-doc:agents/demo/focused/AGENTS.md').rules['names-the-decision-log'] == 'pass' && score('maintainer-agent-doc', 'agent-doc:agents/demo/focused/AGENTS.md').rules['no-hardcoded-secrets'] == 'pass' && score('maintainer-agent-doc', 'agent-doc:agents/demo/focused/AGENTS.md').rules['no-hidden-instructions'] == 'pass'"
  - name: a long canonical file with no command and no decision link stops at bronze
    expect: "score('maintainer-agent-doc', 'agent-doc:agents/demo/partial/AGENTS.md').level == 'bronze' && score('maintainer-agent-doc', 'agent-doc:agents/demo/partial/AGENTS.md').evidence['has-commands'] == ['0 command lines'] && score('maintainer-agent-doc', 'agent-doc:agents/demo/partial/AGENTS.md').evidence['within-budget'] == ['600 lines'] && score('maintainer-agent-doc', 'agent-doc:agents/demo/partial/AGENTS.md').evidence['names-the-decision-log'] == ['does not link to decisions.md']"
  - name: an alias that does not point at AGENTS.md fails bronze and names the secret
    expect: "score('maintainer-agent-doc', 'agent-doc:agents/demo/unsafe/CLAUDE.md').level == 'none' && score('maintainer-agent-doc', 'agent-doc:agents/demo/unsafe/CLAUDE.md').evidence['single-source'] == ['alias does not point at AGENTS.md'] && score('maintainer-agent-doc', 'agent-doc:agents/demo/unsafe/CLAUDE.md').evidence['links-resolve'] == ['docs/nope.md'] && score('maintainer-agent-doc', 'agent-doc:agents/demo/unsafe/CLAUDE.md').evidence['no-hardcoded-secrets'] == ['CLAUDE.md:2 aws-access-key'] && score('maintainer-agent-doc', 'agent-doc:agents/demo/unsafe/CLAUDE.md').evidence['no-hidden-instructions'] == ['1 hidden characters']"
  # npm manifests
  - name: a private package with a lockfile, a check script and a description reaches gold
    expect: "score('maintainer-package', 'package-json:packages/demo/focused/package.json').level == 'gold' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['named'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['publish-intent'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['version-bounded'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['from-a-registry'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['locked'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['has-a-check'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['described'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['engines-declared'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['ci-installs-from-the-lockfile'] == 'pass' && score('maintainer-package', 'package-json:packages/demo/focused/package.json').rules['no-hardcoded-secrets'] == 'pass'"
  - name: a private package with no lockfile and no check script stops at bronze
    expect: "score('maintainer-package', 'package-json:packages/demo/partial/package.json').level == 'bronze' && score('maintainer-package', 'package-json:packages/demo/partial/package.json').evidence['locked'] == ['no lockfile beside package.json'] && score('maintainer-package', 'package-json:packages/demo/partial/package.json').evidence['has-a-check'] == ['0 check scripts'] && score('maintainer-package', 'package-json:packages/demo/partial/package.json').evidence['described'] == ['no description'] && score('maintainer-package', 'package-json:packages/demo/partial/package.json').evidence['engines-declared'] == ['engines.node is not set']"
  - name: a public manifest with a star, a git URL and a secret fails bronze
    expect: "score('maintainer-package', 'package-json:packages/demo/unsafe/package.json').level == 'none' && score('maintainer-package', 'package-json:packages/demo/unsafe/package.json').evidence['named'] == ['no name'] && score('maintainer-package', 'package-json:packages/demo/unsafe/package.json').evidence['publish-intent'] == ['public package with no version'] && score('maintainer-package', 'package-json:packages/demo/unsafe/package.json').evidence['version-bounded'] == ['leftpad@*'] && score('maintainer-package', 'package-json:packages/demo/unsafe/package.json').evidence['from-a-registry'] == ['leftpad@git+https://example.invalid/leftpad'] && score('maintainer-package', 'package-json:packages/demo/unsafe/package.json').evidence['ci-installs-from-the-lockfile'] == ['CI runs npm install, which can update the lockfile'] && score('maintainer-package', 'package-json:packages/demo/unsafe/package.json').evidence['no-hardcoded-secrets'] == ['package.json:4 aws-access-key']"
  # JSON Schema documents
  - name: a draft 2020-12 schema with a title, an id and only local refs reaches gold
    expect: "score('maintainer-schema', 'json-schema:schema/demo/focused.schema.json').level == 'gold' && score('maintainer-schema', 'json-schema:schema/demo/focused.schema.json').rules['draft-2020-12'] == 'pass' && score('maintainer-schema', 'json-schema:schema/demo/focused.schema.json').rules['has-id'] == 'pass' && score('maintainer-schema', 'json-schema:schema/demo/focused.schema.json').rules['described'] == 'pass' && score('maintainer-schema', 'json-schema:schema/demo/focused.schema.json').rules['titled'] == 'pass' && score('maintainer-schema', 'json-schema:schema/demo/focused.schema.json').rules['wired-in'] == 'pass' && score('maintainer-schema', 'json-schema:schema/demo/focused.schema.json').rules['local-refs'] == 'pass' && score('maintainer-schema', 'json-schema:schema/demo/focused.schema.json').rules['no-hardcoded-secrets'] == 'pass'"
  - name: a described draft 2020-12 schema that nothing compiles stops at bronze
    expect: "score('maintainer-schema', 'json-schema:schema/demo/partial.schema.json').level == 'bronze' && score('maintainer-schema', 'json-schema:schema/demo/partial.schema.json').evidence['titled'] == ['no title'] && score('maintainer-schema', 'json-schema:schema/demo/partial.schema.json').evidence['wired-in'] == ['not compiled by schema.rs or applied by the reference validator']"
  - name: a draft-07 schema with a remote ref and a secret fails bronze
    expect: "score('maintainer-schema', 'json-schema:schema/demo/unsafe.schema.json').level == 'none' && score('maintainer-schema', 'json-schema:schema/demo/unsafe.schema.json').evidence['draft-2020-12'] == ['https://json-schema.org/draft-07/schema#'] && score('maintainer-schema', 'json-schema:schema/demo/unsafe.schema.json').evidence['has-id'] == ['no $id'] && score('maintainer-schema', 'json-schema:schema/demo/unsafe.schema.json').evidence['described'] == ['no description'] && score('maintainer-schema', 'json-schema:schema/demo/unsafe.schema.json').evidence['local-refs'] == ['https://example.invalid/other.json'] && score('maintainer-schema', 'json-schema:schema/demo/unsafe.schema.json').evidence['no-hardcoded-secrets'] == ['schema/demo/unsafe.schema.json:4 aws-access-key']"
  # Examples and experiments
  - name: an example that links, names a check and cites the design reaches gold
