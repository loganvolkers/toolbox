# Maintainer SDLC stages (docs/design/maintainer-sdlc.md). Status: built | partial | designed | missing.
records:
  - id: maintainer/plan
    layer: maintainer
    name: plan
    order: 1
    intent: Decide what to build and record it before building it.
    exitCriterion: A decision row in docs/decisions.md and the owning design doc updated.
    commands: []
    checks: []
    docs: [docs/decisions.md, docs/v1-spec.md, AGENTS.md]
    status: built
    gaps: []
  - id: maintainer/build
    layer: maintainer
    name: build
    order: 2
    intent: Compile the workspace, the UI bundle and the connector binaries.
    exitCriterion: cargo build and the UI build succeed from a clean checkout with pinned toolchains.
    commands: ["cargo build", "npm --prefix ui run build"]
    checks: [.github/workflows/ci.yml, rust-toolchain.toml]
    docs: [docs/design/maintainer-sdlc.md]
    status: built
    gaps: []
  - id: maintainer/test
    layer: maintainer
    name: test
    order: 3
    intent: Run the check pyramid, from unit tests to the reference portal oracle.
    exitCriterion: fmt, clippy -D warnings, cargo test and toolbox test pass; reference outputs match byte for byte.
    commands: ["cargo test", "cargo clippy --all-targets -- -D warnings", "toolbox test portal", "python scripts/validate-parity.py"]
    checks: [.github/workflows/ci.yml, scripts/validate-parity.py]
    docs: [docs/design/maintainer-sdlc.md, docs/design/verification.md]
    status: built
    gaps: []
  - id: maintainer/verify
    layer: maintainer
    name: verify
    order: 4
    intent: Prove each milestone's acceptance scenarios on the production path (Postgres, OpenFGA, real connectors).
    exitCriterion: The milestone's acceptance script passes in CI.
    commands: ["scripts/m4-acceptance.sh"]
    checks: [scripts/m2-acceptance.sh, scripts/m3-acceptance.sh, scripts/m4-acceptance.sh]
    docs: [docs/v1-spec.md]
    status: built
    gaps: ["acceptance scripts for M5 and M6 don't exist yet (M5 is paused, D64)"]
  - id: maintainer/release
    layer: maintainer
    name: release
    order: 5
    intent: Publish versioned, attested artifacts others install instead of building from source.
    exitCriterion: A tag produces attested binaries for each platform, installers and an image, and consumers pin them.
    commands: []
    checks: []
    docs: [docs/design/packages.md]
    status: missing
    gaps:
      - "no tagged releases: every consumer builds toolbox from source"
      - "actions/report compiles the workspace at its own ref (cached by a source hash) on every cold runner"
      - "no installers: shell, PowerShell, Homebrew, npm, cargo-binstall, aqua/mise, apt"
      - "no published container image for serve"
      - "no release attestations or immutable releases"
  - id: maintainer/monitor
    layer: maintainer
    name: monitor
    order: 6
    intent: Score this repository against its own standards and stop regressions (Toolbox for Toolbox).
    exitCriterion: The ratchet passes in CI and improvements are recorded in portal/results.json.
    commands: ["toolbox report portal --skip runner,github-actions --baseline portal/results.json --ci"]
    checks: [.github/workflows/ci.yml, portal/results.json]
    docs: [docs/design/toolbox-for-toolbox.md]
    status: built
    gaps: []
