# Maintainer SDLC stages (docs/design/maintainer-sdlc.md). Status: built | partial | designed | missing.
records:
  - id: maintainer/plan
    layer: maintainer
    name: plan
    order: 1
    intent: Decide what to build and record it before building it.
    exitCriterion: A decision file in docs/decisions/ and the owning design doc updated.
    commands: []
    checks: []
    docs: [docs/decisions/README.md, docs/v1-spec.md, AGENTS.md]
    status: built
    gaps: []
  - id: maintainer/build
    layer: maintainer
    name: build
    order: 2
    intent: Compile the workspace, the UI bundle and the connector binaries.
    exitCriterion: >-
      cargo build and the UI build succeed from a clean checkout with pinned
      toolchains.
    commands: [pnpm install --frozen-lockfile, pnpm build, cargo build]
    checks: [.github/workflows/ci.yml, rust-toolchain.toml]
    docs: [docs/design/maintainer-sdlc.md]
    status: built
    gaps: []
  - id: maintainer/test
    layer: maintainer
    name: test
    order: 3
    intent: Run the check pyramid, from unit tests to the reference portal oracle.
    exitCriterion: >-
      fmt, clippy -D warnings, cargo test and seikika test pass; reference
      outputs match byte for byte.
    commands:
    - cargo test
    - cargo clippy --all-targets -- -D warnings
    - seikika test portal
    - python scripts/validate-parity.py
    checks: [.github/workflows/ci.yml, scripts/validate-parity.py]
    docs: [docs/design/maintainer-sdlc.md, docs/design/verification.md]
    status: built
    gaps: []
  - id: maintainer/verify
    layer: maintainer
    name: verify
    order: 4
    intent: >-
      Prove each milestone's acceptance scenarios on the production path
      (Postgres, OpenFGA, real connectors).
    exitCriterion: The milestone's acceptance script passes in CI.
    commands: [scripts/m4-acceptance.sh]
    checks:
    - scripts/m2-acceptance.sh
    - scripts/m3-acceptance.sh
    - scripts/m4-acceptance.sh
    - scripts/m5-acceptance.sh
    docs: [docs/v1-spec.md]
    status: built
    gaps: ["the M6 acceptance script doesn't exist yet"]
  - id: maintainer/design-review
    layer: maintainer
    name: design-review
    order: 5
    intent: >-
      Judge what readers see (the hosted report and the UI) on more than one
      portal, by machine first and then by blind auditors.
    exitCriterion: >-
      The PNPM workspace checks its Vue types, embedded Astro assets and all
      Storybook stories; for a change readers see, a blind three-auditor panel
      round passes the design-audit stop rule and is recorded in docs/audits/.
    commands:
    - pnpm install --frozen-lockfile
    - pnpm check
    - pnpm build
    - pnpm storybook:build
    - pnpm storybook:probe
    - report-ui/scripts/fixtures.sh
    checks: [.github/workflows/ci.yml]
    docs:
    - docs/design/design-audit.md
    - docs/design/maintainer-sdlc.md
    - report-ui/README.md
    status: partial
    gaps:
    - >-
      CI probes the committed fixtures but does not regenerate them (that
      needs zizmor, staticcheck and the OpenFGA checkout), so a fixture can
      lag the report data it stands for
  - id: maintainer/release
    layer: maintainer
    name: release
    order: 6
    intent: >-
      Publish versioned, attested artifacts others install instead of building
      from source.
    exitCriterion: >-
      A tag produces attested binaries for each platform, installers and an
      image, and consumers pin them.
    commands: [git tag v0.1.0 && git push origin v0.1.0, dist plan]
    checks: [.github/workflows/release.yml, .github/workflows/image.yml]
    docs:
    - docs/design/maintainer-sdlc.md
    - docs/design/package-author-sdlc.md
    - docs/RELEASING.md
    - dist-workspace.toml
    status: partial
    gaps:
    - >-
      Homebrew tap, npm installer and the aqua registry entry are not set up
      (cargo-binstall metadata is on each distable crate)
    - >-
      release.yml is generated by dist (D98). The template's zizmor findings
      are waived in portal/waivers.yaml, for that file only, rather than
      edited by hand
    - >-
      This repository's CI still builds actions/report from source; external
      callers should set seikika-version to a release (e.g. 0.1.0)
    - >-
      The release run builds the image (custom-image calls image.yml), but no
      tag has gone through it yet; v0.1.0 and v0.1.1 have no image until
      someone runs `gh workflow run image.yml -f tag=<tag>`
  - id: maintainer/monitor
    layer: maintainer
    name: monitor
    order: 7
    intent: >-
      Score this repository against its own standards and stop regressions
      (Seikika for Seikika).
    exitCriterion: >-
      The ratchet passes in CI and improvements are recorded in
      portal/results.json.
    commands:
    - >-
      seikika report portal --skip runner,github-actions --baseline
      portal/results.json --ci
    checks: [.github/workflows/ci.yml, portal/results.json]
    docs: [docs/design/maintainer-sdlc.md, docs/design/seikika-for-seikika.md]
    status: built
    gaps: []
