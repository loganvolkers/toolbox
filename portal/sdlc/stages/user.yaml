# User SDLC stages (docs/design/user-sdlc.md).
records:
  - id: user/discover
    layer: user
    name: discover
    order: 1
    intent: Find entities, owners and scores from a terminal, an agent or the UI.
    exitCriterion: >-
      search, get, owner and score answer over CLI, MCP and the UI with the
      same authorization.
    commands: [seikika search, seikika get, seikika owner, seikika mcp]
    checks: [crates/seikika-api/tests/mcp.rs, scripts/m4-acceptance.sh]
    docs: [docs/design/user-sdlc.md]
    status: built
    gaps: []
  - id: user/build
    layer: user
    name: build
    order: 2
    intent: Build an app or agent on stable API and MCP contracts.
    exitCriterion: A typed client generated from the portal's OpenAPI compiles against it.
    commands: [seikika query]
    checks: [crates/seikika-api/tests/mcp.rs]
    docs: [docs/design/user-sdlc.md]
    status: partial
    gaps:
    - no per-portal OpenAPI or typed clients
    - no generated user agent plugin
  - id: user/test
    layer: user
    name: test
    order: 3
    intent: Test an app with reproducible reads.
    exitCriterion: Reads pinned with min_snapshot return the same data.
    commands: [seikika get]
    checks: [scripts/m2-acceptance.sh]
    docs: [docs/v1-spec.md]
    status: partial
    gaps: [no recorded-fixture mode for user apps]
  - id: user/deploy
    layer: user
    name: deploy
    order: 4
    intent: Run an app with its own identity, not a person's token.
    exitCriterion: A service identity with scoped access calls the portal from CI.
    commands: [seikika token create]
    checks: [scripts/m3-acceptance.sh]
    docs: [docs/design/user-sdlc.md]
    status: partial
    gaps: [service identities are designed; personal access tokens only today]
  - id: user/monitor
    layer: user
    name: monitor
    order: 5
    intent: Know when a contract an app depends on changes or is deprecated.
    exitCriterion: Deprecations are announced on the API and MCP surfaces with a timeline.
    commands: []
    checks: []
    docs: [docs/design/user-sdlc.md]
    status: designed
    gaps: [no stability or deprecation policy enforcement]
