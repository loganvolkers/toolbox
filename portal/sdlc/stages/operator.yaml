# Operator SDLC stages (docs/design/sdlc.md): validate → test → plan → preview → deploy → verify.
records:
  - id: operator/author
    layer: operator
    name: author
    order: 1
    intent: Write the portal in YAML (split with include) or the TypeScript builder.
    exitCriterion: The canonical manifest validates.
    commands: [seikika validate]
    checks: [examples/repo-portal-starter/seikika.yaml]
    docs: [docs/design/typescript-builder.md, docs/design/sdlc.md]
    status: partial
    gaps:
    - the TypeScript builder is a prototype; `seikika build` doesn't exist
  - id: operator/build-connector
    layer: operator
    name: build-connector
    order: 2
    intent: Connect a system Seikika has no connector for.
    exitCriterion: >-
      The operator's connector passes the conformance kit and runs in-image or
      remotely.
    commands:
    - seikika connector test
    - seikika install
    - seikika doctor
    - seikika push
    checks:
    - crates/seikika-connect/src/conformance.rs
    - crates/seikika-cli/tests/install.rs
    docs: [docs/design/connector-control.md, docs/design/package-author-sdlc.md]
    status: partial
    gaps: [no scaffold or SDK outside Rust]
  - id: operator/validate
    layer: operator
    name: validate
    order: 3
    intent: Catch schema, reference and CEL errors before anything runs.
    exitCriterion: seikika validate reports 0 errors.
    commands: [seikika validate]
    checks: [scripts/validate-parity.py]
    docs: [docs/v1-spec.md]
    status: built
    gaps: []
  - id: operator/test
    layer: operator
    name: test
    order: 4
    intent: Pin what each rule means with expectations over fixtures.
    exitCriterion: seikika test passes.
    commands: [seikika test]
    checks: [portal/tests/standards.test.yaml]
    docs: [docs/v1-spec.md]
    status: built
    gaps: []
  - id: operator/plan
    layer: operator
    name: plan
    order: 5
    intent: >-
      Show what a change does to entities, scores, access and notifications
      before it merges.
    exitCriterion: A plan against the running portal's data is attached to the PR.
    commands: [seikika plan --local]
    checks: []
    docs: [docs/design/sdlc.md]
    status: partial
    gaps: ["plan --remote (against live data) is designed for M6, not built"]
  - id: operator/preview
    layer: operator
    name: preview
    order: 6
    intent: Run the changed portal as an ephemeral environment for the PR.
    exitCriterion: A preview URL per PR, torn down on merge.
    commands: []
    checks: []
    docs: [docs/design/sdlc.md]
    status: designed
    gaps: [no preview deploys]
  - id: operator/deploy
    layer: operator
    name: deploy
    order: 7
    intent: Ship the portal as one image plus Postgres, and roll back by image.
    exitCriterion: A tagged image deploys and rolls back on Cloud Run or equivalent.
    commands: [seikika serve]
    checks: []
    docs: [docs/plan.md]
    status: designed
    gaps:
    - >-
      no `seikika build` image pipeline and no published base image
      (maintainer/release is missing)
  - id: operator/verify
    layer: operator
    name: verify
    order: 8
    intent: Confirm the deployed portal matches the plan.
    exitCriterion: seikika verify passes against the deployed portal.
    commands: []
    checks: []
    docs: [docs/design/sdlc.md]
    status: designed
    gaps: ["`seikika verify` doesn't exist"]
  - id: operator/monitor
    layer: operator
    name: monitor
    order: 9
    intent: >-
      Watch connector freshness, derivation diagnostics and adoption in
      production.
    exitCriterion: >-
      The ops view and metrics show freshness, diagnostics and snapshot lag;
      OTLP export and Prometheus /metrics both carry the catalog.
    commands: [seikika serve]
    checks: [scripts/m4-acceptance.sh]
    docs: [docs/design/minimal-ui.md, docs/design/observability.md]
    status: partial
    gaps:
    - >-
      Grafana / seikika-ops pack deferred (alert stubs + local OTel testbed
      exist)
