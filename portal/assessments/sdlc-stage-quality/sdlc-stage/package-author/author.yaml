apiVersion: seikika.com/assessment/v1
entity: sdlc-stage:package-author/author
rubric: sdlc-stage-quality
subjectHash: 6c120008690d
assessor: {kind: agent, name: cursor-assessor-22, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: pass
    reason: >-
      CI runs `seikika validate` and `seikika test` on every packages/*/tests
      portal (.github/workflows/ci.yml:67-71). Each of those portals includes
      its package as a consumer would
      (packages/github-actions/tests/seikika.yaml:9), so the fragments merge
      and validate against the manifest schema, and
      crates/seikika-model/src/package.rs:248-257 rejects a
      seikika-package.yaml with the wrong apiVersion. The stage's `checks:`
      names the package file itself
      (portal/sdlc/stages/package-author.yaml:16), not this CI loop.
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      There is no `seikika package new` (not in `seikika --help`), but
      docs/design/package-author-sdlc.md §6 (lines 214-293) gives an agent the
      layout, a copy-and-trim path from packages/github-actions,
      packages/pnpm-expo or packages/storybook, the CEL pitfalls `validate`
      rejects, and the meta-bronze bar, all checked by `seikika validate` and
      `seikika test`.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      Authoring is YAML only. The v0.1.0 and v0.1.1 tags publish installers
      (dist-workspace.toml installers, scripts/install-release.sh:6-8), so an
      author validates with a released `seikika` and compiles nothing.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      Standards over existing record shapes need only fragments, fixtures and
      `seikika test` (package-author-sdlc.md §6.2, line 235), and a package
      can live in its author's repository as `github:owner/repo[/dir]@tag`
      (crates/seikika-model/src/package.rs:55-68). The caveat is that new
      facts still need a workspace-connector change in this repository (§6.2,
      line 234), as pnpm-expo did.
# Codex evaluated the two added criteria. Earlier verdicts retain their original attribution.
  - criterion: fast-feedback
    verdict: fail
    reason: >-
      portal/sdlc/stages/package-author.yaml lists seikika validate.
      docs/design/packages.md gives no measured local time to the stage exit.
    suggestion: >-
      Measure and record the fastest local check that demonstrates this stage
      exit in docs/design/packages.md.
  - criterion: beyond-one-reference
    verdict: fail
    reason: >-
      portal/sdlc/stages/package-author.yaml lists packages/github-
      actions/seikika-package.yaml as evidence. The declared checks name no
      second exercised reference for this stage exit.
    suggestion: >-
      Exercise this exit on a second reference and cite the result in
      portal/sdlc/stages/package-author.yaml.
summary: >-
  An agent can author a package today: copy an existing package, validate
  and test it, with CI proving it for the packages in this repository. Two
  things are weak. The stage's `checks:` points at a data file rather than
  ci.yml:67-71, and there is no scaffold.
