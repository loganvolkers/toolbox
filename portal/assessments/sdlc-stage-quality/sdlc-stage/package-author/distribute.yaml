    reason: Today the only way to share standards is to copy YAML or land them in this repository's portal/.
    suggestion: Ship packages from their authors' own repositories (git-first, docs/design/packages.md §4.4).
summary: Missing end to end; it depends on maintainer/release, Q15 and a tools declaration.
