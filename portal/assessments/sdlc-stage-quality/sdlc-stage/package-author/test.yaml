apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:package-author/test
rubric: sdlc-stage-quality
subjectHash: e35f1feceea9
assessor: {kind: agent, name: cursor-assessor-22, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      CI runs `toolbox test` on each packages/*/tests portal, but with
      target/debug/toolbox built at HEAD (.github/workflows/ci.yml:67-71) on
      one platform. No workflow installs a released version: no
      `toolbox-version` or install-release.sh appears in .github/workflows/.
      The "each supported release and platform" half of the exit criterion is
      therefore unchecked. Meta bronze is covered only for packages T4T
      includes (portal/toolbox.yaml:361-384), through its ratchet.
    suggestion: >-
      Add a matrix job that installs each supported release with
      scripts/install-release.sh, on Linux, macOS and Windows, and runs
      `toolbox test packages/<name>/tests`.
  - criterion: agent-can-complete
    verdict: fail
    reason: >-
      An agent can run `toolbox test packages/github-actions/tests`, but it
      cannot learn which releases a package supports. toolbox-package.yaml has
      no Toolbox range (crates/toolbox-model/src/package.rs:9-10). The test
      portal's `portal.toolbox: "0.1"`
      (packages/github-actions/tests/toolbox.yaml:8) is only parsed
      (crates/toolbox-model/src/manifest.rs:114) and never compared against
      the running binary.
    suggestion: >-
      Add a `toolbox:` version range to toolbox-package.yaml, enforced at
      load, so the matrix is derived from the package rather than guessed.
  - criterion: reuses-artifacts
    verdict: fail
    reason: >-
      The only package tests in this repository compile Toolbox from source
      first (ci.yml:67-71 use target/debug). Releases v0.1.0 and v0.1.1 exist
      (git tags) with installers (scripts/install-release.sh:6-8), yet no
      package test uses them.
    suggestion: >-
      Test this repository's packages against the pinned release binary, as an
      outside author would, and keep the source build for maintainer CI.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      A package's tests are fixtures plus a mini-portal
      (package-author-sdlc.md §6.1 and §6.3, lines 222-254). Any author runs
      them with the released `toolbox test`, without a crate change.
summary: >-
  An agent can test a package today on fixtures, but only against the
  workspace build, on one platform. The stage's defining fork, testing
  against released versions across platforms, has no matrix, version range
  or check, though the releases it needs now exist.
