apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:maintainer/release
rubric: sdlc-stage-quality
subjectHash: 977efbbf4b7a
assessor: {kind: agent, name: cursor-release-assessor, model: claude-opus-5.5}
at: 2026-11-23
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      The image half is now wired: release.yml's custom-image job needs
      announce and calls image.yml (.github/workflows/release.yml:328-341,
      .github/workflows/image.yml:7-15), so a tag whose image fails to build
      turns the release run red; actionlint and `dist plan` accept it, but no
      tag has run it yet (image.yml has no runs,
      https://github.com/loganvolkers/toolbox/actions/workflows/image.yml) and
      v0.1.0/v0.1.1 still have no image
      (portal/sdlc/stages/maintainer.yaml:90-93). The "consumers pin them"
      half is checked by nothing in `checks:` (maintainer.yaml:72): this
      repo's own calls to ./actions/report pass toolbox-dir or nothing, never
      toolbox-version (.github/workflows/ci.yml:106-111, :189-193, :207-210),
      so the download path (actions/report/action.yml:84-91) never runs in CI.
    suggestion: >-
      Add a CI job that runs ./actions/report with toolbox-version set to the
      latest release (and fails if it falls back to building), add a step
      after custom-image that verifies the pushed image with `gh attestation
      verify oci://ghcr.io/<owner>/toolbox:<version>`, and dispatch image.yml
      for v0.1.1 so the current release meets the criterion.
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      An agent with push access can finish the stage from the documented
      commands: set the version, `dist plan`, tag and push
      (docs/design/maintainer-sdlc.md:114-117, docs/RELEASING.md:46-58), and
      release.yml then builds the archives, installers, release and image
      using only GITHUB_TOKEN (release.yml:62, :249, :330-341). The docs now
      say the image comes from custom-image and name `gh workflow run
      image.yml -f tag=` for older tags (maintainer-sdlc.md:126-131,
      RELEASING.md:62-66), and the stage lists that as a gap
      (maintainer.yaml:90-93). RELEASING.md:21 calls the tag a "human step for
      now", but it is a command an agent can run, not a secret. The Docker
      build and attest steps are unproven: I ran image.yml's
      download-and-checksum loop (image.yml:47-57) against v0.1.1's assets and
      it passed, but nothing has pushed an image yet.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      The image is assembled from the release's checksum-verified Linux
      archives (image.yml:40-59) and the Dockerfile compiles nothing, adding
      only a SHA-256-pinned OpenFGA (image/Dockerfile:1-3, :14-20). Consumers
      are told to pin a release and download it
      (actions/report/README.md:33-35, docs/RELEASING.md:95-96), which
      action.yml does through install.sh (actions/report/action.yml:84-91).
      The from-source fallback when toolbox-version is empty
      (action.yml:51-57, :119-129) is what this repo's CI uses, and the stage
      lists that as a gap (maintainer.yaml:87-89).
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      Cutting a release is a version bump and a tag
      (docs/design/maintainer-sdlc.md:111-133). It adds no crate, builtin or
      schema. The pipeline is driven by dist-workspace.toml (:25-28 for the
      image job) and resolves its own repository and owner (image.yml:52, :58;
      actions/report/action.yml:88), so a fork can release the same way.
summary: >-
  The release run now builds the image: custom-image calls image.yml after
  dist announces, so the GITHUB_TOKEN trigger gap is closed in code, and
  the docs and stage gaps match it. That path has not run for a real tag,
  and v0.1.0/v0.1.1 still have no image. The exit criterion stays
  unchecked because nothing in CI fails when consumers don't pin a
  toolbox-version, and this repo's own CI never takes the download path.
