apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:maintainer/design-review
rubric: sdlc-stage-quality
subjectHash: e303d41d3cfa
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: executable-exit
    verdict: pass
    reason: >-
      The machine half of the exit criterion is a CI gate: the report-ui job
      in .github/workflows/ci.yml runs `npm run check` (lines 282-283) and
      `npm run probe` over every story (lines 285-289), so CI fails if either
      is not met. The panel half is judgement by design: the stage exists to
      collect a blind panel's verdict (design-audit SKILL.md lines 38-57).
      Nothing checks that a docs/audits/ record exists for a change readers
      see; rg finds no reference to docs/audits in .github/, scripts/ or
      crates/.
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      I ran check, build-storybook and probe with no secret or manual step.
      The panel is three fresh agents given the auditor brief in design-audit
      SKILL.md (lines 76-87), with capture commands at lines 64-74.
      Regenerating fixtures needs scorecard 5.7.0 installed by hand; an agent
      can do that from scripts/ci-tools.sh line 23, so it is counted under
      reuses-artifacts, not here.
  - criterion: reuses-artifacts
    verdict: fail
    reason: >-
      Capture is fixed: capture.cjs (lines 5-7) and design-audit SKILL.md
      (lines 61-66) resolve Playwright 1.65.1 and axe-core 4.14.1 from
      report-ui's exact pins (package.json lines 19-24). Fixtures are not:
      scripts/fixtures.sh lines 11-13 say `toolbox tools install <portal>`
      installs the linters, but scorecard declares no install id
      (packages/openssf-scorecard/fragments/openssf-scorecard.yaml line 21).
      Measured: `toolbox tools install portal --dry-run` prints `SKIP
      scorecard 5.7.0`, `tools config --for mise` and `--for aqua` both note
      that scorecard declares no id, and `toolbox doctor portal` exits 1. The
      script runs under `set -e` and stops at line 24 until scorecard is
      installed by hand. staticcheck's only id, `mise:
      go:honnef.co/go/tools/cmd/staticcheck`, builds it from source with a Go
      toolchain. Line 16's `cargo build` is justified, because a fixture must
      be this checkout's report output.
    suggestion: >-
      Declare an install id for scorecard in the openssf-scorecard fragment
      (aqua/mise `ossf/scorecard`, if the aqua registry carries it; not
      verified), or have fixtures.sh install scorecard and actionlint through
      scripts/ci-tools.sh, as scripts/regen-site-report.sh line 16 already
      does. Then fix the comment at lines 11-13 so it names an install path
      that works.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      The stage adds no crate, builtin or schema. Probes and stories live in
      report-ui/, and the audit skill ships in the operator plugin for any
      rendered surface ("the hosted report, the minimal UI, a custom view",
      SKILL.md lines 4-5). capture.cjs documents an install outside this repo
      (lines 7-8), so an operator can audit their own custom view.
  - criterion: fast-feedback
    verdict: pass
    reason: >-
      Measured on this VM: `npm run check` took 0.2 s, `npm run
      build-storybook` 1.6 s, and `npm run probe` 33.9 s ("53 stories × 4
      views: 212 passed, 0 failed"). These match
      docs/design/maintainer-sdlc.md lines 47-48 (1.5 s and 33 s) and
      report-ui/README.md lines 26-27. All three run locally before CI.
  - criterion: beyond-one-reference
    verdict: pass
    reason: >-
      Stories load five fixtures from three portals (report-ui/README.md lines
      41-47; stories/*.stories.js import each one). The second reference is
      examples/openfga-portal over OpenFGA v1.23.0, and the third is
      repo-portal-starter. In my probe output, page stories split 56 views on
      OpenFGA, 56 on Toolbox for Toolbox and 40 on the starter. design-audit
      SKILL.md line 25 also requires a task on the second portal.
summary: >-
  The probe gate is fast, local, CI-enforced and runs over three portals,
  and capture now uses report-ui's pinned Playwright and axe-core. Two
  gaps remain. Regenerating fixtures still needs scorecard installed by
  hand, because `toolbox tools install` has no id for it. The panel half
  of the exit criterion is recorded, not checked. design-audit.md line 109
  still cites axe-core 4.10 for capture, which now uses 4.14.1.
