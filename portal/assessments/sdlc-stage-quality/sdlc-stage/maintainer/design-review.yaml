apiVersion: seikika.com/assessment/v1
entity: sdlc-stage:maintainer/design-review
rubric: sdlc-stage-quality
subjectHash: de488f5ba20d
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: pass
    reason: >-
      The machine half of the exit criterion is gated: the report-ui job in
      .github/workflows/ci.yml (lines 299-321) fails when `npm run check`
      finds a type error or a stale bundle (312-315) or when `npm run probe`
      finds a failing story (318-321). The panel half is judgement by design
      (design-audit/SKILL.md step 4), and no CI step checks that a
      reader-visible change has a docs/audits/ record, but the rubric fails
      only when nothing in checks would fail.
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      I ran every listed command without a secret or a person: `npm ci` in 2
      s, `check` (tsc, then the Vite bundle) in 0.5 s, `build-storybook` in
      1.3 s, `probe` reported "53 stories × 4 views: 212 passed, 0 failed" in
      41 s, and fixtures.sh exited 0 in 17 s. The panel step is scripted by
      the design-audit skill's capture script and auditor brief. Chromium's
      install is in the docs (maintainer-sdlc.md, the Node 22 + Playwright
      row), not in the stage's commands.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      npm dependencies are lockfile-pinned, and TypeScript 7.0.2 and Vite
      8.3.5 are the versions ui/ already pins (D01M880QMWD7Z7FTGKJT99AHWBX),
      so the stage adds no second bundler. fixtures.sh installs actionlint,
      scorecard and staticcheck as SHA-256-pinned releases through
      scripts/ci-tools.sh and zizmor and ruff through `seikika tools install
      portal`. Its one build, `cargo build --locked`, is the renderer under
      change, which the fixtures must come from; CI's report-ui job compiles
      no Rust.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      Nothing in the stage adds a crate, builtin or schema
      (portal/sdlc/stages/maintainer.yaml, the design-review record). The
      audit tier works on any served page: the capture script takes a --url or
      --storybook (docs/design/design-audit.md covers any custom view). The
      probe tier covers only report-ui's own stories, so a third party's view
      gets the panel but not the probe.
  - criterion: fast-feedback
    verdict: pass
    reason: >-
      The fastest gate, `npm --prefix report-ui run check`, took 0.5 s here
      (tsc 0.25 s, the bundle check 0.2 s) and the full probe 41 s, both
      local; docs/design/maintainer-sdlc.md's timing table records 0.5 s, 1.3
      s and 33 s, and report-ui/README.md gives the same loop with timings.
  - criterion: beyond-one-reference
    verdict: pass
    reason: >-
      The probe ran 53 stories over five fixtures from three portals
      (report-ui/README.md): Seikika for Seikika, the OpenFGA portal
      (examples/openfga-portal), and repo-portal-starter. The panel must put
      at least one task on the second portal (design-audit/SKILL.md step 1).
      All three are repository portals, and ui/ has no stories.
summary: >-
  Fast, runnable by an agent, pinned tools shared with ui/, three
  reference portals, and now a type check of the report data in the
  fastest gate. Running fixtures.sh on this tree showed the stage's known
  gap twice: the new decision file and this stage's stale assessment
  changed s4s.json and starter.json, and on two runs first openfga.json
  and then openfga-unmeasured.json changed only in the order of two
  OpenSSF Scorecard evidence lines, so fixture output is not fully
  deterministic. No CI step regenerates fixtures or checks that a
  reader-visible change carries a docs/audits/ record, and the minimal UI
  in ui/ has neither stories nor probes.
