apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:maintainer/design-review
rubric: sdlc-stage-quality
subjectHash: e303d41d3cfa
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: executable-exit
    verdict: pass
    reason: >-
      The machine half of the exit criterion is gated: the report-ui job in
      .github/workflows/ci.yml (lines 271-289) fails when `npm run check`
      finds the bundle stale (282-283) or `npm run probe` finds a failing
      story (286-289). The panel half is judgement by design
      (plugins/toolbox-operator/skills/design-audit/SKILL.md lines 39-53), and
      no CI step checks that a reader-visible change has a docs/audits/
      record, but the rubric fails only when nothing in checks would fail.
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      I ran every listed command without a secret or a person: `check` passed
      in 0.15 s, `build-storybook` in 1.4 s, `probe` reported "53 stories × 4
      views: 212 passed, 0 failed" in 33.7 s, and fixtures.sh rewrote all five
      fixtures. The panel step is scripted: capture.cjs over
      pages-openfga--overview from the Storybook build wrote five screenshots
      and metrics.json in 5.6 s, and the skill gives the auditor brief
      (SKILL.md lines 61-86). Chromium's install is in the docs
      (maintainer-sdlc.md line 93, SKILL.md line 64), not in the stage's
      commands.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      With ~/go/bin and /tmp/toolbox-ci-tools off PATH and TOOLBOX_CI_TOOLS
      set to a fresh empty directory, report-ui/scripts/fixtures.sh exited 0
      in 15.7 s and installed actionlint, scorecard and staticcheck itself as
      SHA-256-pinned releases (scripts/ci-tools.sh lines 15-27); zizmor and
      ruff come from portal/'s pins through `toolbox tools install` (line 27;
      dry run: pip install ruff==0.14.0, zizmor==1.32.0). npm deps are
      lockfile-pinned and CI's report-ui job compiles no Rust. The one build,
      `cargo build --locked` (fixtures.sh line 17), is the renderer under
      change, which the fixtures must come from.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      Nothing in the stage adds a crate, builtin or schema
      (portal/sdlc/stages/maintainer.yaml lines 61-91). Its audit tier works
      on any served page: capture.cjs takes a --url or --storybook, and
      outside this repo the skill installs playwright@1.65.1 and
      axe-core@4.14.1 at pins (design-audit/SKILL.md lines 61-74;
      docs/design/design-audit.md lines 9-11 cover any custom view). The probe
      tier covers only report-ui's own stories, so a third party's view gets
      the panel but not the probe.
  - criterion: fast-feedback
    verdict: pass
    reason: >-
      The fastest gate, `npm --prefix report-ui run check`, took 0.15 s here
      and the full probe 33.7 s, both local; docs/design/maintainer-sdlc.md
      lines 46-48 record 0.1 s, 1.5 s and 33 s, and report-ui/README.md lines
      22-28 give the same loop.
  - criterion: beyond-one-reference
    verdict: pass
    reason: >-
      The probe ran 53 stories over five fixtures from three portals
      (report-ui/README.md lines 41-47): Toolbox for Toolbox, the OpenFGA
      portal over openfga/openfga at d67ba7b (examples/openfga-portal/fetch.sh
      line 9), and repo-portal-starter. The panel must put at least one task
      on the second portal (design-audit/SKILL.md lines 22-25). All three are
      repository portals (docs/design/design-audit.md lines 92-93), and ui/
      has no stories.
summary: >-
  Fast, runnable by an agent, released and pinned tools, three reference
  portals. The stage's own gap shows when you run it: fixtures.sh on this
  tree changed t4t.json and starter.json (`git diff --stat`: 2 files, 2
  insertions, 2 deletions; links-resolve on
  docs/audits/toolbox-report-2026-11-24-3.md went pass to fail mid-edit),
  and no CI step catches that drift. Nothing checks that a reader-visible
  change carries a docs/audits/ record, and the minimal UI in ui/ has
  neither stories nor probes.
