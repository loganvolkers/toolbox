apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:user/deploy
rubric: sdlc-stage-quality
subjectHash: 559017a54590
assessor: {kind: agent, name: cursor-assessor-22, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      scripts/m3-acceptance.sh:49-52 creates a PAT for the person alice and
      checks /v1/me and a 401 for an unknown token. It never creates a service
      identity, never scopes access below the subject's own relations, and
      never calls from CI as an app. The exit criterion ("a service identity
      with scoped access calls the portal from CI") is not exercised.
    suggestion: >-
      Once `service:<name>` principals exist, add an m3 step that mints a
      service token, grants it one relation, and asserts one allowed and one
      denied read.
  - criterion: agent-can-complete
    verdict: fail
    reason: >-
      `toolbox token create` requires the portal's Postgres via --database-url
      or DATABASE_URL (crates/toolbox-cli/src/main.rs:538-548). An app
      developer therefore needs an operator to mint a token with database
      access, and the token borrows a person's identity (--user).
    suggestion: >-
      Let a signed-in user mint a token for a service they own through the API
      or MCP, without database access.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      Tokens come from the released binary (`toolbox token create`), and apps
      send them as a bearer (crates/toolbox-authz/src/authn.rs:5-6). Nothing
      is built from source.
  - criterion: decoupled-from-core
    verdict: fail
    reason: >-
      Service identities need a new principal type with its own OpenFGA
      relations (docs/design/user-sdlc.md:79-80, still "planned" at line 55).
      OIDC mode takes a single issuer and subject claim per portal
      (crates/toolbox-authz/src/authn.rs:52-55, 93-95), so a CI OIDC token
      can't be added alongside human sign-in without changes to toolbox-authz.
    suggestion: >-
      Add service principals (and, ideally, accept CI OIDC tokens such as
      GitHub Actions' as a second issuer that maps to them), so operators
      grant apps access in the manifest.
# Codex evaluated the two added criteria. Earlier verdicts retain their original attribution.
  - criterion: fast-feedback
    verdict: fail
    reason: >-
      portal/sdlc/stages/user.yaml lists toolbox token create.
      docs/design/user-sdlc.md gives no measured local time to the stage exit.
    suggestion: >-
      Measure and record the fastest local check that demonstrates this stage
      exit in docs/design/user-sdlc.md.
  - criterion: beyond-one-reference
    verdict: fail
    reason: >-
      portal/sdlc/stages/user.yaml lists scripts/m3-acceptance.sh as evidence.
      The declared checks name no second exercised reference for this stage
      exit.
    suggestion: >-
      Exercise this exit on a second reference and cite the result in
      portal/sdlc/stages/user.yaml.
summary: >-
  Partial. Apps can authenticate only with a person's PAT, and minting one
  needs the portal's database URL. Service identities with scoped access
  are designed in user-sdlc.md but need core work, and nothing tests the
  exit criterion.
