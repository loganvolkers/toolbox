apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:user/build
rubric: sdlc-stage-quality
subjectHash: 5d797c4fd3e7
assessor: {kind: agent, name: cursor-assessor-22, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      The exit criterion is a typed client compiled from the portal's OpenAPI.
      No crate generates OpenAPI (`rg -i openapi crates/` finds nothing),
      though docs/v1-spec.md:96 and §7.2 (line 291) assign it to toolbox-api.
      The only check, crates/toolbox-api/tests/mcp.rs, tests MCP tool schemas
      and results (tools_list_describes_every_input at line 80), not a REST
      contract or a client.
    suggestion: >-
      Generate /v1/openapi.json per portal in toolbox-api. Add a test that
      generates a TypeScript client from it for the reference portal and
      type-checks a small app against it, and list that test as the check.
  - criterion: agent-can-complete
    verdict: fail
    reason: >-
      An agent can build on MCP today (described inputs, mcp.rs:80-121) or on
      `toolbox query -o json`. It cannot reach the exit criterion, because
      there is no OpenAPI document and no client generator, and no generated
      user plugin (docs/design/user-sdlc.md:47-48, "Planned").
    suggestion: >-
      Once OpenAPI exists, document the generator invocation in user-sdlc.md
      and add a skill, so an agent goes from portal URL to compiled client in
      one documented path.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      An app calls a running portal over /v1 or /mcp, or through the released
      `toolbox mcp` bridge. Nothing in Toolbox is rebuilt (user-sdlc.md §2,
      lines 33-41).
  - criterion: decoupled-from-core
    verdict: fail
    reason: >-
      The typed-client exit cannot be met without adding OpenAPI generation to
      toolbox-api (docs/v1-spec.md:96, user-sdlc.md §5 item 1, line 78). A
      user cannot produce the document from outside, since REST response
      shapes are defined only in Rust (crates/toolbox-api/src/routes.rs).
    suggestion: >-
      Ship the OpenAPI document from the server, so users generate clients
      with off-the-shelf tools and never touch this repository.
# Codex evaluated the two added criteria. Earlier verdicts retain their original attribution.
  - criterion: fast-feedback
    verdict: fail
    reason: >-
      portal/sdlc/stages/user.yaml lists toolbox query. docs/design/user-
      sdlc.md gives no measured local time to the stage exit.
    suggestion: >-
      Measure and record the fastest local check that demonstrates this stage
      exit in docs/design/user-sdlc.md.
  - criterion: beyond-one-reference
    verdict: fail
    reason: >-
      portal/sdlc/stages/user.yaml lists crates/toolbox-api/tests/mcp.rs as
      evidence. The declared checks name no second exercised reference for
      this stage exit.
    suggestion: >-
      Exercise this exit on a second reference and cite the result in
      portal/sdlc/stages/user.yaml.
summary: >-
  Partial. Apps can be built today on MCP, whose tool schemas are
  contract-tested, but the stage's exit, a typed client from per-portal
  OpenAPI, needs core work that has not started. OpenAPI generation is the
  single change that would flip three criteria.
