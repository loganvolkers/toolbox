apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:operator/preview
rubric: sdlc-stage-quality
subjectHash: e1c0151edc7e
assessor: {kind: agent, name: cursor-assessor-21, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      Both `commands` and `checks` are empty, and the status is `designed`
      (portal/sdlc/stages/operator.yaml:69-79). Nothing creates a preview URL
      per PR or checks that it is torn down on merge. `toolbox-dev/preview`
      and `toolbox preview gc` exist only in docs/design/sdlc.md §5 and §8.
    suggestion: >-
      Build the compose adapter first (sdlc.md:58, `toolbox preview up`) and a
      CI job that brings a preview up, probes `/readyz`, and tears it down.
      List that job under `checks:`.
  - criterion: agent-can-complete
    verdict: fail
    reason: >-
      No command or Action exists (`commands: []`,
      portal/sdlc/stages/operator.yaml:75; no `preview` subcommand in
      crates/toolbox-cli/src/main.rs:43-322), so an agent would have to invent
      the environment, the GitHub Deployment and the teardown itself. Hosting
      a per-PR URL also needs cloud or cluster credentials, which the stage
      does not mention. The only listed doc, docs/design/sdlc.md, describes
      the target design (§5, lines 103-121) rather than steps that work today.
    suggestion: >-
      Until `toolbox-dev/preview` exists, document a do-it-yourself preview:
      FROM the release image (image/Dockerfile:3-4) with the PR's portal
      copied in, run with `toolbox serve --fixtures`. Say which secrets the
      hosting step needs.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      By design, a preview runs the PR's built image, and "one artifact flows
      through all" environments, promoted by digest
      (docs/design/sdlc.md:44-45, 58). That image is FROM the released server
      image, whose binaries come from checksum-verified release archives with
      nothing compiled (image/Dockerfile:1-4,
      .github/workflows/image.yml:40-57).
  - criterion: decoupled-from-core
    verdict: fail
    reason: >-
      The designed stage needs new Toolbox surfaces: the `toolbox-dev/preview`
      Action, `toolbox preview gc`, and a server-side redacted production
      sample export (docs/design/sdlc.md:103-121). An operator cannot meet the
      exit criterion without that work in this repository.
    suggestion: >-
      Make the fixtures and synthetic modes possible with the existing image
      and `serve --fixtures` alone, so only the redacted-sample mode waits on
      core changes.
# Codex evaluated the two added criteria. Earlier verdicts retain their original attribution.
  - criterion: fast-feedback
    verdict: fail
    reason: >-
      portal/sdlc/stages/operator.yaml defines the stage exit but declares no
      runnable local check for it. docs/design/sdlc.md documents the intended
      workflow.
    suggestion: >-
      Add a runnable local check for this exit and record its measured time in
      docs/design/sdlc.md.
  - criterion: beyond-one-reference
    verdict: fail
    reason: >-
      portal/sdlc/stages/operator.yaml declares no executable reference for
      the exit, and docs/design/sdlc.md describes the workflow without
      supplying a second exercised reference.
    suggestion: >-
      Exercise this exit on a second reference and cite the result in
      portal/sdlc/stages/operator.yaml.
summary: >-
  Preview is design only: no command, no check and no Action. An operator
  or agent cannot carry it out today. The intended artifact flow is sound,
  since it reuses the release image, and a documented DIY recipe on that
  image would unblock fixture-based previews before M6.
