apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:operator/validate
rubric: sdlc-stage-quality
subjectHash: 1f1c4770cc7e
assessor: {kind: agent, name: cursor-assessor-21, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: pass
    reason: >-
      "toolbox validate reports 0 errors" is the command's exit code: 0 when
      valid, 1 on errors, 2 when the manifest can't be loaded (`toolbox
      --help`; plugins/toolbox-operator/skills/validate/SKILL.md). I saw exit
      1 on a broken copy of the starter. The listed check,
      scripts/validate-parity.py, guards the validator itself against
      examples/reference-portal/tools/validate.py, and CI runs it
      (.github/workflows/ci.yml:38-39).
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      The validate skill is a three-step loop: run, read, fix. `--format json`
      gives machine-readable output, and each diagnostic names the file and
      JSON path. docs/v1-spec.md:131 also requires errors from included files
      and package fragments to name that file. No person or secret is
      involved.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      Validation runs the released `toolbox` binary
      (scripts/install-release.sh lines 6-12), with the JSON Schemas compiled
      into it (AGENTS.md repository layout, `schema/`). Nothing is built or
      installed beyond the CLI.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      Operators validate their own manifest, including the kinds and schemas
      they declare in it, against the binary they already have. Validating a
      new portal needs no change in this repository, as
      examples/repo-portal-starter shows (ci.yml:65).
summary: >-
  The cleanest operator stage. The exit criterion is the command's exit
  code, the skill is a tight loop, and errors point at the file and path.
  The listed check proves the validator rather than an operator's portal,
  which suits a stage whose command is its own check.
