apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:operator/monitor
rubric: sdlc-stage-quality
subjectHash: b7ece568fc20
assessor: {kind: agent, name: cursor-composer, model: composer}
at: 2026-11-22
verdicts:
  - criterion: executable-exit
    verdict: pass
    reason: >-
      scripts/m4-acceptance.sh exercises serve health, readiness and the
      metrics endpoint; experiments/otel-testbed/scripts/score.sh (CI job
      otel-testbed) asserts OTLP export of http.server.request spans, catalog
      metric names, service.name and log/trace_id correlation against a pinned
      otelcol-contrib file exporter. Exit criterion's lag/catalog signals are
      toolbox_snapshot_lag_seconds and related series on /metrics and OTLP.
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      An agent runs toolbox serve with OTEL_EXPORTER_OTLP_ENDPOINT and
      experiments/otel-testbed/scripts/score.sh (or docker compose + the same
      rubric) using only docs/design/observability.md and the testbed README.
      Remaining gap is the Grafana / toolbox-ops pack, not the observability
      contract itself.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      Monitoring uses the released toolbox binary's /metrics and OTLP export;
      the testbed pins otelcol-contrib from its GitHub release (SHA-256 in
      pin.env). Operators do not rebuild Toolbox to observe lag.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      An operator configures OTEL_* and scrape targets against a deployed
      portal; they do not add crates or builtins to this repository to monitor
      freshness.
summary: >-
  Snapshot lag and catalog metrics are observable via /metrics and OTLP.
  The local collector testbed and CI score gate prove export completeness;
  Grafana pack remains deferred.
