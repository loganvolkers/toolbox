apiVersion: seikika.com/assessment/v1
entity: sdlc-stage:operator/deploy
rubric: sdlc-stage-quality
subjectHash: e1b44c93a5e2
assessor: {kind: agent, name: cursor-assessor-21, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      `checks: []` (portal/sdlc/stages/operator.yaml:80-93). Nothing deploys
      an image and rolls it back. .github/workflows/image.yml builds and
      attests the server image but never runs it, and no tag has gone through
      it yet (the maintainer/release gap at
      portal/sdlc/stages/maintainer.yaml:90-93).
    suggestion: >-
      Add a CI job that builds an operator image FROM the server image with
      examples/repo-portal-starter copied to /portal, runs it with Postgres,
      waits for `/readyz`, then swaps to the previous tag and checks again.
      List the job under `checks:`.
  - criterion: agent-can-complete
    verdict: fail
    reason: >-
      There is no published image to deploy: v0.1.0 and v0.1.1 have none until
      a person runs `gh workflow run image.yml -f tag=<tag>`
      (docs/RELEASING.md:62-66). There is no `seikika build`, and the listed
      doc, docs/plan.md §6.2, is design. The only command listed is `seikika
      serve`, which runs a server but neither deploys nor rolls back. Cloud
      Run also needs credentials the stage doesn't name.
    suggestion: >-
      Publish the image for the latest tag. Add an operator page: write a
      Dockerfile FROM ghcr.io/<owner>/seikika:<version> with COPY portal/
      /portal/, set DATABASE_URL, deploy, and roll back by redeploying the
      previous digest. List the secrets it needs.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      The designed path compiles nothing. image/Dockerfile:1-4 is the release
      binaries plus a SHA-256-pinned OpenFGA, and operators build FROM it and
      copy their portal in. image.yml:40-57 downloads and checksum-verifies
      the release archives instead of building from source.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      An operator's image is two lines on top of the server image
      (image/Dockerfile:3-4, `CMD ["serve", "/portal"]`). Deploy targets are
      the operator's own tooling (docs/design/sdlc.md:154-155), so no crate or
      schema change is needed to ship a portal.
# Codex evaluated the two added criteria. Earlier verdicts retain their original attribution.
  - criterion: fast-feedback
    verdict: fail
    reason: >-
      portal/sdlc/stages/operator.yaml defines the stage exit but declares no
      runnable local check for it. docs/plan.md documents the intended
      workflow.
    suggestion: >-
      Add a runnable local check for this exit and record its measured time in
      docs/plan.md.
  - criterion: beyond-one-reference
    verdict: fail
    reason: >-
      portal/sdlc/stages/operator.yaml declares no executable reference for
      the exit, and docs/plan.md describes the workflow without supplying a
      second exercised reference.
    suggestion: >-
      Exercise this exit on a second reference and cite the result in
      portal/sdlc/stages/operator.yaml.
summary: >-
  The pieces are closer than the stage record says: a release-built server
  image and a FROM-and-COPY recipe exist, so the gap "no published base
  image" in portal/sdlc/stages/operator.yaml is partly stale. No image has
  been published and nothing checks a deploy or rollback, so the stage
  can't be completed or verified yet.
