apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:operator/build-connector
rubric: sdlc-stage-quality
subjectHash: 2a5ee852aa40
assessor: {kind: agent, name: cursor-grok, model: grok-4.7}
at: 2026-11-20
verdicts:
  - criterion: executable-exit
    verdict: pass
    reason: >-
      The stage's command toolbox connector test runs the kit in
      crates/toolbox-connect/src/conformance.rs and fails on a protocol
      violation. crates/toolbox-cli/tests/install.rs fails a tampered release
      archive.
  - criterion: agent-can-complete
    verdict: unsure
    reason: >-
      docs/design/connector-control.md and
      schema/connector-messages.schema.json describe the protocol, and the
      stage lists toolbox connector test, install, doctor and push. The stage
      gap is that there is no scaffold or non-Rust SDK, and
      connector-control.md does not say which form to choose.
    suggestion: >-
      Add toolbox connector new, as docs/design/package-author-sdlc.md
      proposes, ending at a passing conformance run.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      An in-image connector can be github:owner/repo@v1, which toolbox install
      downloads (crates/toolbox-api/src/artifacts.rs). A remote connector
      pushes to /v1/ingest and does not compile Toolbox.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      connectors.rs binary_for resolves github: packages from the install
      cache (D90). An operator does not add a crate or a builtin to this
      repository; builtin: remains only for the connectors that ship in the
      image.
summary: >-
  An operator can install a released connector without a crate change.
  What is missing is a scaffold outside Rust.
