apiVersion: toolbox.dev/assessment/v1
entity: sdlc-stage:operator/test
rubric: sdlc-stage-quality
subjectHash: 16badcd9c8c5
assessor: {kind: agent, name: cursor-assessor-21, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: pass
    reason: >-
      `toolbox test` exits 1 when any expectation fails (`toolbox --help`). On
      a scratch copy of examples/repo-portal-starter, I prefixed one
      expectation with `false &&`: the run printed one FAIL and exited 1. The
      listed check, portal/tests/standards.test.yaml, runs in CI through
      `toolbox test portal` (.github/workflows/ci.yml:64).
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      The test-file format is specified in docs/v1-spec.md:547 (`name` plus
      `assert[] {name, expect}` in CEL with `entity()` and `score()`). The
      test skill (plugins/toolbox-operator/skills/test/SKILL.md) covers
      expectations and action cases under `runs:`, and
      portal/tests/standards.test.yaml gives many worked examples. Everything
      runs over local fixtures, with no secret.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      Tests run the released CLI over the portal's committed fixtures. Package
      tests come with the package (packages/*/tests, run in CI at
      ci.yml:67-71), so an operator builds and installs nothing extra.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      Expectations, fixtures and action cases live in the operator's portal
      (tests/*.test.yaml, fixtures/). The starter
      (examples/repo-portal-starter) and every package (packages/*/tests, run
      by .github/workflows/ci.yml:68) test themselves this way, with no change
      to Toolbox's crates.
summary: >-
  Operators can pin rule meaning with CEL expectations over fixtures, and
  a failed expectation exits 1, as I confirmed. The format is specified,
  the skill is clear and the repository has many worked examples. No gaps
  found.
