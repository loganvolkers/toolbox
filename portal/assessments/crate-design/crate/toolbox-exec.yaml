apiVersion: toolbox.dev/assessment/v1
entity: crate:toolbox-exec
rubric: crate-design
subjectHash: c853e92bc40c
assessor: {kind: agent, name: cursor-assessor-24, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-responsibility
    verdict: pass
    reason: >-
      The crate docs state one job, action runs, and name its parts: the
      preview layer, executors, the CI drivers, the forge drivers, the
      lifecycle with confirm tokens and verification, and approval grants
      (crates/toolbox-exec/src/lib.rs:1-5). The forge/CI split keeps that one
      job: a forge driver only opens a review and names a token's user, and CI
      is explicitly not a forge capability (src/forge/mod.rs:1-5); a CI driver
      only starts, tracks and reads back a run (src/ci/mod.rs:1-14). That is
      the built M5 layer in docs/design/action-runs.md:9-16 and the split in
      docs/design/forges.md:15-22 (D01M87T16JRH53YV6VVWM8PH169). The spec cell
      is behind the crate: docs/v1-spec.md:95 still says only the Executor
      trait plus stdio, HTTP, GitHub Actions and webhook, and the diagram
      still draws runs and exec as two roles (v1-spec.md:78-79). The crate
      docs, not that cell, are what the code does, and they describe one job.
  - criterion: small-contract
    verdict: fail
    reason: >-
      toolbox-api and toolbox-cli are the only dependents, and both reach past
      the lifecycle the crate documents. They assign `run.state = "approved"`
      directly (crates/toolbox-cli/src/run.rs:582,
      crates/toolbox-api/src/actions.rs:880), and the CLI also assigns
      `"awaiting_approval"` before replaying a grant
      (crates/toolbox-cli/src/run.rs:756). `Run::set` is what records the
      event (src/run.rs:261-268), so those transitions leave no event, and
      `state` is a free string checked only against `TERMINAL`
      (src/run.rs:247-258). The CLI also downcasts the `Executor` trait object
      to the concrete `Change` and `Command` types and reads their public
      `remote` and `base` fields
      (crates/toolbox-cli/src/action_tests.rs:179-191; the types are
      src/executor/change.rs:18-31 and src/executor/command.rs:11-15, through
      `Executor::downcast` at src/executor/mod.rs:161-165). Nine public items
      have no doc comment, including `Run::set`, `Event`, `Approval`,
      `TERMINAL` and `Grant` (facts: undocumented). The public
      `ForgeDriver::auth` also takes `reqwest::RequestBuilder`
      (src/forge/mod.rs:33); no other crate calls it today.
    suggestion: >-
      Make `Run.state` private and route the approved and awaiting-approval
      transitions through `Run::set`, so every change is an event. Stop
      downcasting in toolbox-cli: pass the remote and base the test needs as
      fields of the preview or the run, not of `Change`. Document `Run::set`,
      `Event`, `Approval`, `TERMINAL` and `Grant`, and give
      `ForgeDriver::auth` a Toolbox header type so the trait does not name
      reqwest.
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      The crate wraps none of the charter defaults (cel-rust, OpenFGA, DBOS,
      Postgres, React; charter goal 3). Postconditions go through
      toolbox-expr's `Expr` and `with_vars` (src/check.rs:8,
      src/check.rs:106-118), not cel's types. reqwest is the HTTP client for
      the forge and CI drivers (crates/toolbox-exec/Cargo.toml:12);
      toolbox-api and toolbox-cli depend on reqwest themselves for their own
      servers, not because this crate's signatures force them to. Swapping
      reqwest would change `ForgeDriver::auth` only, which no other crate
      calls.
  - criterion: tests-match-risk
    verdict: fail
    reason: >-
      The riskiest paths, and where they stand: confirm tokens bind the
      preview, the actor and the entity, and expire (src/run.rs:701-746); an
      approval cannot be the requester, and a refusal is recorded
      (src/run.rs:749-793); a grant opens only with its key, and a forged body
      does not (src/grant.rs:125-143); the executor protocol and the three CI
      drivers (GitHub Actions, GitLab CI, the HTTP bridge) are tested against
      a fake server (src/executor/protocol.rs:495, src/ci/github.rs:257,
      src/ci/gitlab.rs:260, src/ci/service.rs:193); a landing change is tested
      against a real git base (src/executor/change.rs:688). Two paths of the
      same rank have no test in this crate. `verify` is the crate's own
      invariant, "done means observed" (src/run.rs:10-11, src/run.rs:378-442):
      nothing in the crate drives a held postcondition, `held_before` ending
      `unverified`, a non-boolean, or the deadline. The forge half of the
      split is the same shape of HTTP the CI half tests, and it has none:
      `Github::open_review` and `Gitlab::open_review` / `whoami`
      (src/forge/github.rs:26-45, src/forge/mod.rs:62-74) have no
      `#[cfg(test)]` in `src/forge/`. `prepare` (src/prepare.rs:71) and the
      precondition loop in `check` (src/check.rs:159-166) are also untested;
      only `validate_inputs` is (src/check.rs:248).
    suggestion: >-
      Add a `verify` test with a fake `Observer` for a postcondition that
      holds, one that already held, a non-boolean, and a deadline of zero. Add
      a fake-server test for `Github::open_review` and for GitLab's
      `PRIVATE-TOKEN` header and `whoami`, on the same double `ci/mod.rs`
      uses. Add one `prepare` case whose postcondition already holds.
summary: >-
  toolbox-exec is one job, the action run, and the forge/CI split keeps it
  that way: forge drivers open reviews, CI drivers start runs. Callers
  still write `run.state` by hand and downcast to `Change` and `Command`,
  so the lifecycle API is not what they use. Tokens, approvals, grants,
  the executor protocol and the CI drivers are tested directly; the
  verification loop and the forge HTTP drivers are not.
