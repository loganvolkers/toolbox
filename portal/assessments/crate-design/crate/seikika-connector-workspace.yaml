verdicts:
  - criterion: one-responsibility
    verdict: fail
    reason: >-
      crates/seikika-connector-workspace/src/main.rs still introduces three
      record kinds even though it exposes many more.
      crates/seikika-connector-workspace/src/clones.rs also owns federation
      clone maintenance, beyond the read-only job described in the opening
      lines.
    suggestion: >-
