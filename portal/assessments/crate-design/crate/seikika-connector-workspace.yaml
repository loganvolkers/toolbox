  - criterion: small-contract
    verdict: pass
    reason: >-
      crates/seikika-connector-workspace/Cargo.toml builds a binary.
      docs/reference/workspace-connector.md describes its configuration,
      including opt-in evidence hashing for declared records.
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      crates/seikika-connector-workspace/src/main.rs emits records through the
      connector protocol. The parser choices in
      crates/seikika-connector-workspace/Cargo.toml stay behind the binary
      boundary.
  - criterion: tests-match-risk
    verdict: fail
    reason: >-
      crates/seikika-connector-workspace/src/data.rs checks that linked
      evidence changes only opt-in hashes.
      crates/seikika-connector-workspace/src/rust.rs still lacks exact
      regression assertions for the complexity and documentation metrics that
      drive downstream scores.
    suggestion: >-
      Add a small Rust fixture with known complexity, undocumented items and
      unwraps, and assert the emitted metrics.
