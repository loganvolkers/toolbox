apiVersion: toolbox.dev/assessment/v1
entity: crate:toolbox-expr
rubric: crate-design
subjectHash: 7d5eb7ce29d4
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-23
verdicts:
  - criterion: one-responsibility
    verdict: pass
    reason: >-
      The crate owns one thing, the expression language, and its crate docs
      say so and list its four parts: static checks, compile and evaluate,
      lazy lists, analysis (crates/toolbox-expr/src/lib.rs:1-16). That matches
      its row in docs/v1-spec.md:89 ("CEL compile and evaluate (cel-rust),
      custom functions"). Analysis for the meta standards is CEL analysis, not
      a second job. The row's "error mapping to `unknown`" happens in the
      caller (crates/toolbox-derive/src/lib.rs:756), which is the right place
      but isn't what the spec row says.
  - criterion: small-contract
    verdict: pass
    reason: >-
      Callers use only re-exported, documented items: toolbox-derive
      (crates/toolbox-derive/src/lib.rs:15,
      crates/toolbox-derive/src/testing.rs:10) and toolbox-api
      (crates/toolbox-api/src/routes.rs:16,
      crates/toolbox-api/src/actions.rs:15) use Expr, ExprValue, Env, Scope,
      with_vars, with_vals and lazy_map. toolbox-model uses check, Site and
      CelIssue (crates/toolbox-model/src/validate.rs:756-760), and toolbox-cli
      uses analysis::analyse (crates/toolbox-cli/src/meta.rs:183). All 27
      public items are documented, Expr::compile included now
      (crates/toolbox-expr/src/eval.rs:214).
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      cel-rust is a dependency of this crate alone
      (crates/toolbox-expr/Cargo.toml:11; no other crate's Cargo.toml names
      `cel`), and the crate docs state the contract (lib.rs:15-16). The last
      leak the previous review found is closed: Scope now has one lifetime
      instead of cel Context's shape (crates/toolbox-expr/src/eval.rs:107), so
      toolbox-derive writes `Scope<'_>` (crates/toolbox-derive/src/lib.rs:231,
      732, 790, 810) and a swap would not touch it. ExprValue and Lazy keep
      their cel values in pub(crate) fields (eval.rs:13, 111).
  - criterion: tests-match-risk
    verdict: pass
    reason: >-
      The riskiest paths are the JSON-CEL conversion every score goes through,
      lazy lists, the declared-function probe and the static checks. Each has
      a direct test now: u64 above i64::MAX, floats, int compared with double
      (a cel-rust behaviour rules rely on), non-finite floats, a duration with
      no JSON form and a one-line compile error
      (crates/toolbox-expr/src/eval.rs:320-341), plus round trips
      (eval.rs:275), lazy size, iteration, indexing and out of bounds
      (eval.rs:250), Env functions (eval.rs:296), `declared`
      (crates/toolbox-expr/src/analysis.rs:168) and the site checks
      (crates/toolbox-expr/src/lib.rs:149-187). The built test binary runs all
      10 and they pass. Small gaps remain: a lazy list indexed by a string or
      negative number (crates/toolbox-expr/src/lazy.rs:80-90), non-string map
      keys (eval.rs:93-95), and check()'s undeclared-function branch
      (lib.rs:112-123) is tested only through analysis. CEL conformance is
      still unmeasured (docs/questions.md:18).
    suggestion: >-
      To close the remaining gaps: add a test indexing a lazy list with `'a'`
      and `-1`, one converting `{1: 'x'}` to JSON, and a check() case for
      `entity.xs.join(',')` expecting UndeclaredFunctions. Then run a slice of
      the cel-spec conformance suite (Q10) and record it in
      docs/research-log.md.
summary: >-
  One job, a small documented contract, and cel-rust fully behind it: the
  single-lifetime Scope closed the last leak. The new conversion test
  covers the edges the previous review asked for. Only minor error
  branches and CEL conformance (Q10) stay untested.
