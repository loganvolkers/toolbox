apiVersion: toolbox.dev/assessment/v1
entity: crate:toolbox-expr
rubric: crate-design
subjectHash: c89cc824bc80
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-23
verdicts:
  - criterion: one-responsibility
    verdict: pass
    reason: >-
      The crate owns one thing, the expression language, and its crate docs
      say so and list its four parts: static checks, compile and evaluate,
      lazy lists, analysis (crates/toolbox-expr/src/lib.rs:1-17). That matches
      its row in docs/v1-spec.md:89 ("CEL compile and evaluate (cel-rust),
      custom functions"). The new analysis function, required_equalities
      (crates/toolbox-expr/src/analysis.rs:150-184), reads a filter's AST so
      the API can narrow a list before evaluating it; that is still CEL
      analysis, and the crate docs now name that use too. The row's "error
      mapping to `unknown`" happens in the caller
      (crates/toolbox-derive/src/lib.rs:832), which is the right place but
      isn't what the spec row says.
  - criterion: small-contract
    verdict: pass
    reason: >-
      Callers use only re-exported, documented items: toolbox-derive
      (crates/toolbox-derive/src/lib.rs:15,
      crates/toolbox-derive/src/testing.rs:10) and toolbox-api
      (crates/toolbox-api/src/routes.rs:17,
      crates/toolbox-api/src/actions.rs:15) use Expr, ExprValue, Env, Scope,
      with_vars, with_vals and lazy_map. toolbox-model imports Site
      (crates/toolbox-model/src/validate.rs:13) and calls check, matching on
      CelIssue (validate.rs:775-779), and toolbox-cli calls analysis::analyse
      (crates/toolbox-cli/src/meta.rs:183, crates/toolbox-cli/src/model.rs:28,
      160). The one addition, analysis::required_equalities, takes a string
      and returns (field, value) string pairs, so no cel type crosses it
      (crates/toolbox-api/src/routes.rs:212). All 28 public items are
      documented.
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      cel-rust is a dependency of this crate alone
      (crates/toolbox-expr/Cargo.toml:11; no other crate's Cargo.toml names
      `cel`), and the crate docs state the contract (lib.rs:16-17). Scope has
      one lifetime instead of cel Context's shape
      (crates/toolbox-expr/src/eval.rs:107), ExprValue and Lazy keep their cel
      values in pub(crate) fields (eval.rs:13, 111), and required_equalities
      walks cel's AST inside the crate, so a swap would reimplement it here
      and leave toolbox-api untouched.
  - criterion: tests-match-risk
    verdict: pass
    reason: >-
      The riskiest paths are the JSON-CEL conversion every score goes through,
      lazy lists, the static checks and, new, the equalities the API trusts to
      narrow a list: a wrong one would hide entities a filter accepts. Each
      branch has a direct test: u64 above i64::MAX, floats, int compared with
      double, non-finite floats, a duration with no JSON form and a one-line
      compile error (crates/toolbox-expr/src/eval.rs:339-360); int, uint and
      bool map keys (eval.rs:284-291, the branch at eval.rs:93-95); round
      trips (eval.rs:294); lazy size, iteration, indexing, out of bounds and a
      string or negative index (eval.rs:249-282, the branch at
      crates/toolbox-expr/src/lazy.rs:80-90); Env functions (eval.rs:315);
      `declared` (analysis.rs:228); check()'s variable, syntax and
      undeclared-function branches (lib.rs:149-200, the last at 177-185); and
      required_equalities both ways round under `&&` and refusing `||`, `!`, a
      non-literal, a number, a nested field, has() and invalid CEL
      (analysis.rs:190-212). All 13 pass under `cargo test -p toolbox-expr`.
      What stays unmeasured is cel-rust itself against the CEL spec, an open
      question the project tracks (docs/questions.md:18), not a branch of this
      crate.
    suggestion: >-
      Run a slice of the cel-spec conformance suite through Expr (Q10) and
      record the result in docs/research-log.md.
summary: >-
  One job, a small documented contract, and cel-rust fully behind it. The
  new required_equalities stays inside that contract (strings in, strings
  out) and is tested against the shapes that would make list narrowing
  unsound; the error branches the previous review left open now have
  tests. Only CEL conformance (Q10) stays unmeasured.
