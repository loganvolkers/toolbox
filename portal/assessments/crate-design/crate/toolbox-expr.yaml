apiVersion: toolbox.dev/assessment/v1
entity: crate:toolbox-expr
rubric: crate-design
subjectHash: 1703d8857e04
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-23
verdicts:
  - criterion: one-responsibility
    verdict: pass
    reason: >-
      The crate owns one thing, the expression language, and its crate docs
      say so and list its four parts: static checks, compile and evaluate,
      lazy lists, analysis (crates/toolbox-expr/src/lib.rs:1-17). That matches
      its row in docs/v1-spec.md:89 ("CEL compile and evaluate (cel-rust),
      custom functions"). The new analysis function, required_equalities
      (crates/toolbox-expr/src/analysis.rs:150-184), reads a filter's AST so
      the API can narrow a list before evaluating it; that is still CEL
      analysis, and the crate docs now name that use too. The row's "error
      mapping to `unknown`" happens in the caller
      (crates/toolbox-derive/src/lib.rs:756), which is the right place but
      isn't what the spec row says.
  - criterion: small-contract
    verdict: pass
    reason: >-
      Callers use only re-exported, documented items: toolbox-derive
      (crates/toolbox-derive/src/lib.rs:15,
      crates/toolbox-derive/src/testing.rs:10) and toolbox-api
      (crates/toolbox-api/src/routes.rs:16,
      crates/toolbox-api/src/actions.rs:15) use Expr, ExprValue, Env, Scope,
      with_vars, with_vals and lazy_map. toolbox-model uses check, Site and
      CelIssue (crates/toolbox-model/src/validate.rs:756-760), and toolbox-cli
      uses analysis::analyse (crates/toolbox-cli/src/meta.rs:183). The one
      addition, analysis::required_equalities, takes a string and returns
      (field, value) string pairs, so no cel type crosses it
      (crates/toolbox-api/src/routes.rs:212). All 28 public items are
      documented.
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      cel-rust is a dependency of this crate alone
      (crates/toolbox-expr/Cargo.toml:11; no other crate's Cargo.toml names
      `cel`), and the crate docs state the contract (lib.rs:16-17). Scope has
      one lifetime instead of cel Context's shape
      (crates/toolbox-expr/src/eval.rs:107), ExprValue and Lazy keep their cel
      values in pub(crate) fields (eval.rs:13, 111), and required_equalities
      walks cel's AST inside the crate, so a swap would reimplement it here
      and leave toolbox-api untouched.
  - criterion: tests-match-risk
    verdict: pass
    reason: >-
      The riskiest paths are the JSON-CEL conversion every score goes through,
      lazy lists, the declared-function probe, the static checks and, new, the
      equalities the API trusts to narrow a list: a wrong one would hide
      entities a filter accepts. Each has a direct test: u64 above i64::MAX,
      floats, int compared with double, non-finite floats, a duration with no
      JSON form and a one-line compile error
      (crates/toolbox-expr/src/eval.rs:320-341), round trips (eval.rs:275),
      lazy size, iteration, indexing and out of bounds (eval.rs:250), Env
      functions (eval.rs:296), `declared` (analysis.rs:228), the site checks
      (lib.rs:150-189), and required_equalities both ways round under `&&` and
      refusing `||`, `!`, a non-literal, a number, a nested field, has() and
      invalid CEL (analysis.rs:190-212). All 11 pass. Small gaps remain: a
      lazy list indexed by a string or negative number
      (crates/toolbox-expr/src/lazy.rs:80-90), non-string map keys
      (eval.rs:93-95), and check()'s undeclared-function branch
      (lib.rs:113-124) is tested only through analysis. CEL conformance is
      still unmeasured (docs/questions.md:18).
    suggestion: >-
      To close the remaining gaps: add a test indexing a lazy list with `'a'`
      and `-1`, one converting `{1: 'x'}` to JSON, and a check() case for
      `entity.xs.join(',')` expecting UndeclaredFunctions. Then run a slice of
      the cel-spec conformance suite (Q10) and record it in
      docs/research-log.md.
summary: >-
  One job, a small documented contract, and cel-rust fully behind it. The
  new required_equalities stays inside that contract (strings in, strings
  out) and is tested against the shapes that would make list narrowing
  unsound. Only minor error branches and CEL conformance (Q10) stay
  untested.
