apiVersion: seikika.com/assessment/v1
entity: crate:seikika-connector-git-files
rubric: crate-design
subjectHash: 71fe5c40d4f6
assessor: {kind: agent, name: cursor-assessor-19, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-responsibility
    verdict: pass
    reason: >-
      One job: files in an org's repositories, read from a local checkout or
      through the GitHub contents API, as records
      (crates/seikika-connector-git-files/src/main.rs:1-10). The docs cover
      the whole-file `catalog-info` mode, `splitKinds` (one record per
      Backstage document) and `files` presence records. All three are "files
      in repositories", the `git-files` entry of docs/v1-spec.md:100 and
      docs/v1-spec.md:356-357. One small mismatch: the doc comment says a line
      that is exactly `---` separates documents (main.rs:31-32), but the code
      splits on any line that starts with `---` (main.rs:35).
  - criterion: small-contract
    verdict: pass
    reason: >-
      A binary with no dependents. It uses only `Out`, `Source` and
      `run_stdio` from the SDK
      (crates/seikika-connector-git-files/src/main.rs:14;
      crates/seikika-connect/src/sdk.rs:9-132). Its capabilities follow its
      configuration (main.rs:300-310), so the conformance kit compares exactly
      the kinds the manifest declares.
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      It wraps none of the charter defaults. Its dependencies are reqwest,
      serde_json, serde_norway, tokio and seikika-connect
      (crates/seikika-connector-git-files/Cargo.toml). It carries its own
      base64 decoder (main.rs:274-289), a copy of the one in
      crates/seikika-connector-github/src/main.rs:368-383.
  - criterion: tests-match-risk
    verdict: fail
    reason: >-
      The riskiest paths are:
      1. splitting multi-document YAML;
      2. parsing a split external id (`…/<path>#<kind>:<name>`) in
      `refresh_one` and reporting `not_found` correctly (main.rs:230-271);
      3. the contents-API mode (repository paging and base64,
      main.rs:127-170).

      Three unit tests cover splitting, external ids and base64
      (main.rs:393-432). The conformance kit runs only in `root` mode
      without `splitKinds` (scripts/m4-acceptance.sh:34). The one manifest
      that sets `splitKinds: true`, examples/acme-live/seikika.yaml:29, is not
      run by CI or any script. So the split refresh branch and the API mode
      have no test at any level, although tools/mock_github.py already serves
      `contents/catalog-info.yaml`
      (examples/reference-portal/tools/mock_github.py:87-88).
    suggestion: >-
      Run `seikika connector test` a second time in scripts/m4-acceptance.sh
      with `{"apiUrl": <mock>, "splitKinds": true, "files": ["README.md"]}`
      against the mock GitHub, so API mode and split refresh go through the
      kit. Add a unit test for `refresh_one` with a `#component:<name>` id
      that hits, one that misses and one with a foreign org prefix.
summary: >-
  A focused connector with accurate crate docs and a minimal SDK
  footprint. The parsing helpers are unit-tested, but the conformance kit
  only drives the simplest mode. The split-kinds refresh and the
  contents-API mode carry the most logic and are untested, though the
  existing GitHub mock could cover them cheaply.
