apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-skill
rubric: scorecard-quality
subjectHash: 2a7f79025146
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      Every rule scores one SKILL.md directory for the agents that load it, in
      one layer: maintainer (portal/README.md:26,
      docs/design/toolbox-for-toolbox.md:48). The `track: operator`
      (portal/standards/skills.yaml:78) is the report's grouping
      (portal/campaigns.yaml:36), not an SDLC layer. Putting the credential
      and hidden-text rules in the floor mixes safety with usability, but
      docs/design/thresholds.md:19-21 argues it: they are killer items for
      anything injected into a prompt, so bronze means "loadable and safe to
      load".
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      The order makes sense: bronze is load and route, silver is follow, gold
      is limits, evals and a small bundle (skills.yaml:52-53). Bronze is
      reachable, since all 43 live skills hold it (portal/results.json). But
      two of the three gold rules are nearly free. one-level-deep passes 43 of
      43 because a skill with no extra files has 0 hops and 0 files.
      states-boundaries passes 40 of 43 with one "Do not …" sentence, which
      costs less than bronze's description-says-when. So gold is in practice
      has-evals alone (42 of 43 fail), and `[{},{},{}]` satisfies that (see
      the has-evals assessment). Also, has-evals' evals/evals.json counts
      against one-level-deep's three-file limit
      (crates/toolbox-connector-workspace/src/skills.rs:401-403), so the gold
      rules pull against each other.
    suggestion: >-
      Make has-evals read the cases (a non-empty `prompt` each), and exclude
      evals/ from supportFiles. Move one-level-deep to silver beside
      within-body-budget, since both bound what is loaded. Then gold asks for
      real limits and real cases, per thresholds.md's "gold asks for what
      lower levels don't already imply" (thresholds.md:24-25).
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      The design deferred description overlap (SkillEvaluator Tier 2) because
      "four skills do not need it" (docs/design/skill-standards.md:108-110).
      The plugin now ships 43 skills, with close pairs a router has to tell
      apart: plan and review-plan, report and report-ux, assess-entity and
      assess-brief, tools-install and install
      (plugins/toolbox-operator/skills/). The deferral's own condition no
      longer holds, and nothing in the card catches two descriptions that
      claim the same trigger.
    suggestion: >-
      Add a gold rule: the description's word overlap with its nearest sibling
      (e.g. Jaccard over non-stop words, computed by the workspace connector
      across the skills glob) stays under a stated bound, with the nearest
      sibling as evidence. Record the bound in docs/design/thresholds.md.
  - criterion: actionable
    verdict: pass
    reason: >-
      Raising add-scorecard from bronze to silver needs one fenced command in
      SKILL.md. The evidence "no fenced code block in SKILL.md" and the fix
      (skills.yaml:143-149) say exactly that, and code_fences counts it
      (skills.rs:309-321). Each further gold rule names a file
      (evals/evals.json, SKILL.md) and has evidence that states the gap
      (portal/tests/standards.test.yaml:350-365). Every rule has evidence and
      a fix that names a place, and `toolbox report` shows the result.
summary: >-
  A well-sourced card. Its levels follow the Agent Skills spec and
  Anthropic's checklist, and every fix names the file to change. But gold
  is close to a single rule. one-level-deep and states-boundaries are
  almost free, has-evals is met by empty objects, and the eval file counts
  against the file limit. Description overlap was deferred for a
  four-skill catalog and is now a real gap at 43 skills.
