apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/meta-scorecard
rubric: scorecard-quality
subjectHash: 76e001a81dcf
assessor: {kind: agent, name: campaign-review-cards-r3}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All seven rules (portal/standards/meta.yaml:600-685) are about a
      scorecard's form: tested, no empty level, described, explained, a
      fixture ladder, rules tested, and every level reached. They read facts
      that crates/toolbox-cli/src/meta.rs:236-245 emits, for one audience,
      standard authors. The description limits gold to well-formed, not good
      (portal/standards/meta.yaml:577-580, D01M831P5QWJQ4A2FT85N5MXJQF).
      Whether a card is good is left to review-scorecard.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze (tested, every level has rules) is the floor the ratchet holds
      new cards to (portal/standards/meta.yaml:598). Silver adds a
      description, a rationale, a two-outcome fixture ladder and every rule
      tested. Gold (fixtures at every level,
      portal/standards/meta.yaml:674-685) implies silver's ladder rule and
      asks for more, as docs/design/thresholds.md:47-48 and :60 set out. Every
      rung is reachable: portal/results.json has 11 cards at bronze, 22 at
      silver and 21 at gold. The card's own fixtures reach only bronze (the
      brief's fixtureRealLevels), so it fails its own gold.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Same version as the last review, and its finding still holds. Lesson
      L12, "achievable in context"
      (docs/design/scorecards-for-scorecards.md:92), has no rule, and the rule
      proposed for it, `ratchetable`, is still listed as next
      (docs/design/scorecards-for-scorecards.md:142). The table at
      docs/design/scorecards-for-scorecards.md:115 credits
      fixtures-reach-every-level with L12, but fixtures supply the very
      connector data that the ratchet skips, so a level whose only rules read
      a skipped connector still passes. For example,
      maintainer-ci-reliability's gold is a single `dataFrom: github-actions`
      rule (packages/github-actions/fragments/github-actions.yaml:457-475).
      docs/design/thresholds.md:71-74 argues that this one card is reachable
      in the published report, which is a limit argued for one card, not a
      check. crates/toolbox-cli/src/meta.rs emits no `dataFrom` fact to check
      it against, and `liveEntities` is collected but "information only"
      (portal/standards/meta.yaml:22), so a card that scores nothing live also
      passes.
    suggestion: >-
      Emit, for each level, the connectors its rules read (`dataFrom`) from
      crates/toolbox-cli/src/meta.rs, and add a silver `levels-decidable` rule
      that fails when every rule of a level reads a volatile or skipped
      connector, with evidence that names the level and the connector. Then
      stop crediting fixtures-reach-every-level with L12 in
      docs/design/scorecards-for-scorecards.md §3.1.
  - criterion: actionable
    verdict: pass
    reason: >-
      Each fix names a field or place: `description:`, `rationale:` and
      `links:`, portal/fixtures/ (portal/standards/meta.yaml:621-685). Each
      rule's evidence names the card, the empty levels, the untested rules or
      the levels no fixture reaches, and
      portal/tests/standards.test.yaml:294-319 pins them. I traced raising
      maintainer-ci-reliability to gold: the evidence would name silver. One
      workflow-runs record at about 8% firstTryFailRate and 10 or more decided
      runs in portal/fixtures/github-actions.ndjson, beside a workflow record
      in portal/fixtures/workspace.ndjson, would reach it. every-rule-tested's
      fix names no file, but its evidence lists the rules, and the manifest's
      `tests:` list says where expectations go.
summary: >-
  Same version as the last review. A sound, form-only ladder, and its
  fixes lead somewhere. What is still missing is a check that a level can
  be decided where it is read: the lesson L12 rule stays proposed, and the
  rule that claims to cover L12 can't see the gap, because fixtures fill
  in the data the ratchet skips.
