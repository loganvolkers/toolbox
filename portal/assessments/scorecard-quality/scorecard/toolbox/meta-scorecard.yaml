apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/meta-scorecard
rubric: scorecard-quality
subjectHash: 5218cfdab7b5
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      Its six rules (portal/standards/meta.yaml:472-519) all ask whether a
      scorecard is well-formed: tested, no empty level, described, and a
      fixture ladder that is exercised. One audience, standard authors; the
      description limits gold to "well-formed, not good" (meta.yaml:464-467,
      D01M831P5QWJQ4A2FT85N5MXJQF). The new `title:` changes no rule.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze (tested, every level has rules), silver (described, a fixture
      ladder with a real level, every rule tested) and gold (fixtures reach
      every level, meta.yaml:511-519) build on each other, as
      docs/design/thresholds.md:47-48 and :60 set out. A ladder of one real
      level plus `skipped` fails silver, because fixtures-show-the-ladder
      counts `fixtureRealLevels` and `none` only (meta.yaml:493-505). In
      portal/results.json the 53 cards spread 11 bronze, 22 silver and 20
      gold, so each level separates cards.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Lesson L12, "achievable in context"
      (docs/design/scorecards-for-scorecards.md:92), still has no rule; its
      proposed `ratchetable` is listed as next at line 142. An all-unknown
      level stops the climb (crates/toolbox-derive/src/lib.rs:1261-1263), so a
      level whose rules all read a connector the ratchet skips is never
      granted where it gates. maintainer-ci-reliability gold
      (fail-rate-under-5) and maintainer-ci-speed silver (fast-feedback) are
      each one `dataFrom: github-actions` rule
      (packages/github-actions/fragments/github-actions.yaml:347-362,
      :390-397). thresholds.md:71-74 now argues those levels are reachable in
      the published report, which runs the connector, but no meta-scorecard
      rule tells a card that is reachable somewhere from one that is reachable
      nowhere.
    suggestion: >-
      Emit, per scorecard level, whether every rule in it reads a volatile or
      skipped connector (`dataFrom`), and add a silver `levels-decidable` rule
      that fails on such a level unless the card names where it is decided,
      with evidence naming the level and the connector.
  - criterion: actionable
    verdict: pass
    reason: >-
      I tried scorecard:toolbox/maintainer-ci-security, bronze and failing
      every-rule-tested in portal/results.json. The evidence is
      `untestedRules` (meta.yaml:506-510), which the brief names:
      least-privilege-token and zizmor-clean. In a scratch worktree I added
      one expectation for each to portal/tests/standards.test.yaml; `toolbox
      test portal` passed (132 of 132) once I corrected zizmor-clean's outcome
      on release.yml from my guessed `fail` to `waived`, and the brief then
      listed no untested rule. The fix names no file ("Add an expectation for
      each untested rule") and the evidence doesn't say which fixture decides
      a rule, but the manifest's `tests:` list gives the file and `toolbox
      test` catches a wrong guess.
summary: >-
  Re-assessed after the scorecard gained a human title. The ladder holds
  and its fixes work; I raised one card's untested rules to tested in a
  scratch copy. Still missing is a check that each level can be decided
  where it is read.
