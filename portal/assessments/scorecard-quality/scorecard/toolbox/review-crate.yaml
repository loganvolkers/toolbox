verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All five rules (portal/standards/crates.yaml:268-322) read one thing,
      the crate-design assessment of a crate and its review, for one audience,
      maintainers. The card is advisory (`ratchet: {advisory: true}`,
      crates.yaml:266), as D79 and D01M831P5QWJQ4A2FT85N5MXJQF set out.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is no open finding, stale ones included (crates.yaml:269-278).
      Silver is a current review. Every gold rule also needs a current review
      and adds something more: clean and cited, no doubts, and a second
      assessor's grounded review of the assessment (`independently-reviewed`,
      crates.yaml:310-322), as docs/design/thresholds.md:55 states. Fixtures
      reach none, bronze and gold (portal/tests/standards.test.yaml:894-920).
      No fixture sits at silver, so that rung is untested, but it is still a
      coherent step.
  - criterion: no-obvious-gap
    verdict: pass
    reason: >-
      The gap the last review named is closed. Gold now needs a current,
      grounded review of the crate-design assessment by a different named
      assessor (`reviewIndependent`, crates.yaml:84-92), computed in
      crates/toolbox-connect/src/assessment.rs:232-295 and unit-tested at
      :376-404. The two stale hash descriptions are fixed (crates.yaml:51-54,
      crates/toolbox-connector-workspace/src/rust.rs:392-394). Assessor
      identity is still a self-chosen name, which thresholds.md:63-70 records
      as not checked, and why: git can't tell the agents apart either.
  - criterion: actionable
    verdict: pass
    reason: >-
      I tried crate:toolbox-expr, the one crate with a live assessment
      (portal/assessments/crate-design/crate/toolbox-expr.yaml). The fix for
      `independently-reviewed` gives the exact brief command
      (crates.yaml:318-322). I ran it, `toolbox assess brief
      assessment:crate-design/crate:toolbox-expr --portal portal`, and it
      printed the assessment-quality rubric and the file to write. The bronze
      and silver fixes point at the failing criteria's suggestions and the
      crate brief (crates.yaml:275-285).
summary: >-
  Independence is now required at gold and the hash descriptions are
  right, so the ladder has no obvious gap. It is still untested at silver,
  and assessor identity is a self-declared name, which is a documented
  limit.
