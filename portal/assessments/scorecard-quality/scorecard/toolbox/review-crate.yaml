apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/review-crate
rubric: scorecard-quality
subjectHash: cdaf7219a194
assessor: {kind: agent, name: campaign-review-cards}
at: 2026-11-23
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All four rules (portal/standards/crates.yaml:245-286) read one
      crate-design assessment for one audience, maintainers, and the card is
      advisory (`ratchet: {advisory: true}`), as D79 and
      D01M831P5QWJQ4A2FT85N5MXJQF set out.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is "no open finding", and a stale review's failures still count
      and are labelled as stale (crates.yaml:247-250), so a one-byte edit no
      longer hides a finding. Silver is a current review, and gold a current
      review that is clean, cited and without doubts
      (docs/design/thresholds.md:52). Gold passes-review is no longer
      redundant: it adds `reviewUncited`, which bronze and silver don't read.
      The fixtures reach none, bronze and gold (facts in the brief).
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Two earlier gaps are closed: the hash now covers src/, tests/ and
      Cargo.toml (crates/toolbox-connector-workspace/src/rust.rs:271-276), and
      an uncited review can't reach gold. Independence is still missing.
      Nothing stops the agent that wrote a crate from assessing it and taking
      it to gold. thresholds.md:58-62 says independence is checked "on the
      assessment, by review-assessment", but review-crate's gold doesn't
      depend on that review, and docs/design/meta-standards-review.md (M8)
      still lists "give crate assessments the same check" as open. The kind's
      `hash` description in crates.yaml still says "src/ files", and so does
      the first doc comment on source_hash.
    suggestion: >-
      Let the assessment connector emit, on each assessment record, whether a
      current review-assessment by another assessor exists, and make gold
      passes-review require it for the crate's assessment. Fix the two stale
      descriptions of the hash.
  - criterion: actionable
    verdict: pass
    reason: >-
      I tried crate:toolbox-expr, at none from the earlier failing review
      (portal/tests/standards.test.yaml:864-868). The bronze evidence lists
      the failing criteria and the fix sends the agent to their suggestions in
      portal/assessments/. Silver's fix gives the exact `toolbox assess brief`
      command, and the no-doubts fix now says to cite the missing source and
      re-assess (crates.yaml:275-286), which can actually pass the rule.
summary: >-
  The ladder and fixes are sound now, and staleness no longer hides a
  finding. The remaining gap is independence: a crate's author can still
  assess it to gold.
