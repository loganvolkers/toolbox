apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-crate
rubric: scorecard-quality
subjectHash: eeddffc0c0cf
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      Every rule serves one question: can a maintainer or agent change this
      crate safely? That is stated in the rationale
      (portal/standards/crates.yaml:148-154) and set by `track: maintainer`
      (:163). Docs, asserting and passing tests, clippy, function size and
      complexity, and unwraps are all properties of the code under change.
      There is no CI-speed or security rule mixed in, and assessed design
      judgement lives on a separate card, review-crate (crates.yaml:347-372).
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Silver and gold tighten the same facts in steps: doc coverage 80 to 100
      (crates.yaml:252, 293), function length 150 to 80 (:264, :305),
      complexity 30 to 15 (:277, :317). Bronze holds the prerequisites (crate
      doc, asserting tests, tests pass, clippy). Gold adds few-unwraps. Today
      all 17 measured crates reach bronze and five reach gold (git-files,
      gitlab, runner, workspace and expr in portal/results.json), so bronze is
      reachable and gold is reachable but not given. One caveat: in the
      ratchet's run, the bronze runner rules are `unknown` and drop out
      (portal/toolbox.yaml:29; results.json), so CI's clippy and test steps
      (.github/workflows/ci.yml:23-24) stand in for them.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Nothing scores lint suppressions or the lint configuration that
      clippy-clean depends on. `unsafe_code = "forbid"` and `clippy::all =
      warn` live in `[workspace.lints]` (Cargo.toml:56-60) and reach a crate
      only while its Cargo.toml says `[lints] workspace = true`. All 18 crates
      do today, but no rule would notice one dropping it, and then unsafe code
      and every clippy warning would pass. `#[allow(clippy::...)]` also passes
      clippy-clean with no trace: two sit unexplained at
      crates/toolbox-exec/src/executor/change.rs:340 and
      crates/toolbox-exec/src/run.rs:447. `forbid(unsafe_code)` is the usual
      Rust crate-safety standard, and this repository already chose it; the
      card just doesn't hold it.
    suggestion: >-
      Add a bronze `inherits-workspace-lints` rule: the workspace connector
      reports `lintsInherited` from each crate's Cargo.toml. Add a gold
      `suppressions-explained` rule over a connector list of
      `allow(clippy::`/`allow(` attributes without `reason =`, or turn on
      clippy's `allow_attributes_without_reason` in `[workspace.lints]`.
  - criterion: actionable
    verdict: fail
    reason: >-
      Most rules locate the work. Long and complex functions come with
      file:line and a count (crates.yaml:98-109), undocumented items with
      file:line, and clippy with its messages. few-unwraps doesn't: its
      evidence is one count, `9 unwrap/expect calls in 269 lines`
      (crates.yaml:332-334), with no place. Its fix's "document the invariant"
      doesn't lower that count. Raising toolbox-connector-scim from silver to
      gold, where few-unwraps is its only failing rule (results.json), needs a
      grep to find the seven `lock().unwrap()` calls in src/main.rs:67-174.
      That is outside the card's evidence and the portal's tools. Separately,
      function `at` lines point at the first doc line rather than at `fn`
      (toolbox-exec change.rs:337 against 341).
    suggestion: >-
      Have the connector emit `unwrapSites` (file:line outside tests) and make
      that few-unwraps' evidence, and reword its fix to what lowers the count.
      Set each function's `at` to its `fn` line.
summary: >-
  A coherent maintainer card with a real ladder (80 to 100% docs, 150 to
  80 lines, complexity 30 to 15), reachable at every level. It leaves
  unscored the workspace lint inheritance that carries
  `forbid(unsafe_code)`, and the suppressions that let clippy-clean pass.
  One rule, few-unwraps, gives agents a count with no place to act on. Six
  of its twelve rules have no test (brief facts), and the rule assessments
  beside this file find that function length counts doc comments.
