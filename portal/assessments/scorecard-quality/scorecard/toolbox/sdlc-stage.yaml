apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/sdlc-stage
rubric: scorecard-quality
subjectHash: 4e6680bf7ae9
assessor: {kind: agent, name: campaign-review-cards-r4}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All six rules (portal/standards/sdlc.yaml:177-258) ask one question: is
      a catalogued SDLC stage defined, can it be carried out, and is it built?
      They serve one audience, the maintainers who curate the catalogue (D87,
      docs/decisions/D01M7WQBZHG0000000000000000.md). The stages span four
      layers, but the question and the audience stay the same, and the
      rationale states it as "each stage has a gate an agent can run"
      (portal/standards/sdlc.yaml:161-164).
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze means the stage is declared and documented, silver that an agent
      can run it and CI checks it, and gold that it is built with no gaps
      (portal/standards/sdlc.yaml:177-258). The climb stops at the first level
      that fails, so gold needs the silver facts. The gold `built` rule is
      cheap to satisfy (a status edit). docs/design/thresholds.md:86-88 states
      that and justifies it (D01M831P5QWJQ4A2FT85N5MXJQF): tying gold to a
      review would drop the stage a level on every edit. The live spread in
      portal/results.json is 8 bronze, 12 silver and 6 gold, so each rung
      separates stages. No fixture sits at silver (the brief's
      fixtureRealLevels are bronze and gold).
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      The earlier finding, that nothing asks whether the checks pass, is now a
      stated limit with a backstop. docs/design/thresholds.md:77-80 says a
      stage can't read another entity's score, so the stage names its
      workflows (`ciWorkflows`, from
      crates/toolbox-connector-workspace/src/data.rs:184-198) and
      maintainer-ci-reliability scores them. One small error there: the doc
      says ciWorkflows appears in the gold rule's evidence, but that evidence
      shows only gaps or the status (portal/standards/sdlc.yaml:248). What is
      still uncaught is a "check" that checks nothing. `automated` counts any
      `crates/**/*.rs` as run by CI whenever some workflow runs `cargo test`
      (crates/toolbox-connector-workspace/src/data.rs:235-237). It also counts
      any workflow that names a path, whatever triggers that workflow has
      (data.rs:161-182). So operator/build-connector reaches silver by listing
      crates/toolbox-connect/src/conformance.rs
      (portal/sdlc/stages/operator.yaml:29), a source file with no test in it.
      Its `automated` passes, and it would keep passing if the kit stopped
      rejecting bad connectors. The `automated` rationale says CI "keeps it
      true after every change" (portal/standards/sdlc.yaml:241-244), which
      this doesn't deliver.
    suggestion: >-
      In crates/toolbox-connector-workspace/src/data.rs, count a Rust check
      only if it is a test target (under tests/) or contains a #[test]. Count
      a workflow only if it triggers on push or pull_request, not only on
      workflow_dispatch or workflow_call. Add a demo stage in
      portal/fixtures/workspace.ndjson that lists a test-less source file and
      fails `automated`. Correct docs/design/thresholds.md:79, or add
      ciWorkflows to the `built` evidence.
  - criterion: actionable
    verdict: pass
    reason: >-
      I traced raising sdlc-stage:maintainer/plan, which is at bronze in
      portal/results.json with agent-operable and automated failing, and has
      no commands or checks (portal/sdlc/stages/maintainer.yaml:3-13). The
      fixes name `commands:`, `checks:`, portal/sdlc/stages/<layer>.yaml and
      .github/workflows (portal/standards/sdlc.yaml:224-238). Adding `python3
      scripts/decision-id.py` as a command (python3 is a known program,
      crates/toolbox-connector-workspace/src/data.rs:107-128) and the script
      as a check, which .github/workflows/ci.yml:32 runs, would reach silver.
      The gold fix now also says where pass/fail lives (the ciWorkflows field,
      portal/standards/sdlc.yaml:249-252).
summary: >-
  Whether a stage's checks pass is now a stated limit, handed to
  maintainer-ci-reliability through ciWorkflows. The ladder and fixes
  hold. The gap that remains: `automated` takes any Rust source file as a
  check whenever CI runs `cargo test`, so build-connector reaches silver
  on a check with no test in it.
