apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/sdlc-stage
rubric: scorecard-quality
subjectHash: b8f585301ec6
assessor: {kind: agent, name: blind-review-2026-11-23}
at: 2026-11-23
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All five rules (portal/standards/sdlc.yaml:101-146) ask one question,
      whether a stage of the SDLC catalogue is defined, operable and built,
      for the maintainers who curate the catalogue (D87,
      docs/decisions/D01M7WQBZHG0000000000000000.md). The stages belong to
      four layers, but the scorecard's audience is one.
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      Gold `built` (sdlc.yaml:141-145) is self-declared: setting `status:
      built` and `gaps: []` in portal/sdlc/stages/<layer>.yaml is a two-line
      edit, cheaper than bronze `documented` (writing a doc that exists) or
      silver `automated`. Nothing ties `built` to the listed checks running or
      passing.
    suggestion: >-
      Derive gold from facts: every `checks:` path is run by a CI workflow,
      every command resolves, and a fresh sdlc-stage-quality review passes
      executable-exit. Then `status` becomes a description, not a gate.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Missing `commands-resolve`: commands are free strings, and only docs and
      checks are path-checked (portal/toolbox.yaml data source, `paths: [docs,
      checks]`), so `commands: [echo]` passes agent-operable. Also missing
      `checks-run-in-ci`: maintainer-agent-doc already checks that the
      commands AGENTS.md names run in CI (D82, D83), but a stage's checks can
      list a script no workflow runs.
    suggestion: >-
      Resolve each command against the Command entities from `toolbox
      describe` or against scripts/ paths, and add `checks-run-in-ci` using
      the workflow records the workspace connector already reads.
  - criterion: actionable
    verdict: pass
    reason: >-
      I tried sdlc-stage:operator/verify (bronze, failing agent-operable and
      automated in a live report). The evidence names layer and stage, and
      documented's fix names portal/sdlc/stages/<layer>.yaml. Listing a
      command and a check raises it to silver, though, as above, too easily.
summary: >-
  Readable and actionable, but every rung above bronze can be claimed by
  editing the declaration it scores.
