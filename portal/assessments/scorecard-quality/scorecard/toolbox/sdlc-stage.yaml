apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/sdlc-stage
rubric: scorecard-quality
subjectHash: 00c1715b64e4
assessor: {kind: agent, name: campaign-review-cards-r3}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All six rules (portal/standards/sdlc.yaml:167-243) ask one question:
      whether a catalogued SDLC stage is defined, can be carried out, and is
      built. The audience is the maintainers who curate the catalogue (D87,
      docs/decisions/D01M7WQBZHG0000000000000000.md). The stages span four
      layers, but the question and the audience do not change, and the
      rationale states it as "each stage has a gate an agent can run"
      (portal/standards/sdlc.yaml:150-154).
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is a stage that is declared and documented, silver one that an
      agent can run and CI checks, and gold one that is built with no gaps
      (portal/standards/sdlc.yaml:167-243). The climb stops at the first level
      that fails, so gold needs the silver facts.
      docs/design/meta-standards-review.md:89 names `built` as a gold rule
      cheaper than a bronze one (a two-line edit), and
      docs/design/thresholds.md:75-77 states and justifies leaving it that way
      (D01M831P5QWJQ4A2FT85N5MXJQF): tying gold to a review would drop the
      stage a level on every edit. The live spread in portal/results.json is 8
      bronze, 12 silver and 6 gold, so each rung separates stages. No fixture
      sits at silver (the brief's fixtureRealLevels are bronze and gold).
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Nothing asks whether a stage's checks pass. Silver `automated` asks only
      that CI names each check, and any file under .github/workflows/ counts
      as run whatever its triggers or state
      (crates/toolbox-connector-workspace/src/data.rs:203-204). Gold then
      reads the declared status. So maintainer/verify, whose exit criterion is
      "The milestone's acceptance script passes in CI"
      (portal/sdlc/stages/maintainer.yaml:44-60), would keep its level with
      that script red on main. That contradicts the `built` rationale, "stages
      that work today" (portal/standards/sdlc.yaml:241-243). The two links
      that remain are justified elsewhere: whether the checks prove the exit
      criterion is the judged sdlc-stage-quality rubric's `executable-exit`
      (portal/standards/sdlc.yaml:401-405), and
      docs/design/thresholds.md:75-77 justifies only not tying gold to a
      review, not ignoring run results.
    suggestion: >-
      Add a gold `checks-green` rule that joins each workflow running a
      stage's checks to its workflow-runs record (failingStreak 0, from the
      github-actions connector, so the rule is `unknown` where that connector
      is skipped and gold is then decided by `built` alone). Pin it with a
      demo stage whose workflow is red in portal/fixtures/.
  - criterion: actionable
    verdict: pass
    reason: >-
      I traced raising sdlc-stage:maintainer/plan, at bronze with
      agent-operable and automated failing in portal/results.json. The fixes
      name `commands:`, `checks:`, portal/sdlc/stages/<layer>.yaml and
      .github/workflows (portal/standards/sdlc.yaml:213-229). Adding `python3
      scripts/decision-id.py` as a command (python3 is a known program,
      crates/toolbox-connector-workspace/src/data.rs:107-128) and
      scripts/decision-id.py as a check, which .github/workflows/ci.yml:31
      runs, would reach silver. has-exit-criterion's fix names no file
      (portal/standards/sdlc.yaml:182-184), but its evidence quotes the field
      and the other fixes name the stage file.
summary: >-
  Same version as the last review. One concern, a ladder whose cheap gold
  rule is a stated, justified trade-off, and fixes an agent can follow.
  The open gap: a stage reaches gold when CI names its checks, whether or
  not they pass, so "built" can describe a stage whose gate is red.
