apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/cli-skill
rubric: scorecard-quality
subjectHash: c46ce7a65213
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      The card asks one question: can a coding agent be routed to this command
      through a skill (portal/standards/cli.yaml:214-224)? It deliberately
      covers operator and user commands alike. Their layer is computed
      (cli.yaml:15-18), and docs/design/cli-skills.md:42-43 says the layer
      cards, operator-cli and user-cli, keep scoring help, docs, args and
      tests. Skill file quality is left to maintainer-skill (D94), so the
      level means one thing.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      One level, argued in the rationale ("One level is enough:
      maintainer-skill scores the skill file itself", cli.yaml:220-224).
      Bronze is reachable and reached: all 34 commands from `toolbox describe`
      have a skill naming their invocation. The cli-skill-coverage campaign
      records short 0 (portal/campaigns.yaml:112-120; portal/results.json),
      and the baseline is compact because the floor is the top level. With no
      upper level, there is no gold to judge as worth reaching.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      The fix and the design say the skill carries "the flags and the exit
      codes" and "what not to do" (cli.yaml:239-241, cli-skills.md:38-40). But
      no rule compares what a skill tells an agent to type with what the
      command accepts. A skill that names a renamed or removed `--flag` still
      passes, and so does a mention of a command that no longer exists, since
      mentionsCommand ignores unresolved targets
      (portal/standards/docs.yaml:35). Skills drifting from the CLI is the
      obvious failure for a card whose purpose is routing agents to working
      invocations, and the data is already on the Command entity (`args`,
      cli.yaml:11).
    suggestion: >-
      Add a silver rule: every `--flag` in the command's own skill is one of
      the command's `args` (capture `toolbox <cmd> … --flag` in the workspace
      connector and compare it in CEL). Add a fixture skill that names a flag
      the command lacks.
  - criterion: actionable
    verdict: pass
    reason: >-
      The rule's evidence names the missing invocation (`missing skill for
      toolbox push`, portal/tests/standards.test.yaml:62-69). Its fix names
      the path, plugins/toolbox-operator/skills/<slug>/SKILL.md, which the
      docs glob already scans (portal/toolbox.yaml:100). Following it for push
      in the fixture portal takes the command from none to bronze. The new
      file is then scored by maintainer-skill's bronze ratchet
      (portal/standards/skills.yaml:80).
summary: >-
  A focused, one-level card that is fully met today, with a fix that names
  the exact file. Its gap is staleness. Nothing checks that the flags a
  skill tells agents to pass still exist, though the fix asks for them and
  the Command entity already lists its args. Its one rule also passes on
  mentions in other skills (see the has-skill assessment).
