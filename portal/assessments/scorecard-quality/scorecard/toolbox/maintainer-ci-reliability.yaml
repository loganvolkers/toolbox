apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-ci-reliability
rubric: scorecard-quality
subjectHash: ebf9d3d3f6b4
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-23
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      cancels-superseded-runs and fast-feedback moved to their own
      maintainer-ci-speed card
      (packages/github-actions/fragments/github-actions.yaml:341-373), with
      the reason in docs/design/thresholds.md:34. Every remaining rule answers
      whether a red or green run on the default branch can be believed
      (github-actions.yaml:239-243): streak, still running, first-try fail
      rate, hidden failures and job timeouts, the last because a hung job
      gives no answer. All serve maintainers.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze holds the prerequisites of the fail rate (failures-visible,
      still-running, timeouts) and a loose 20% bound, per the principle in
      docs/design/thresholds.md:22-23; silver and gold tighten the same rate
      to 10% and 5% and add a floor of 10 decided runs
      (github-actions.yaml:306-338, thresholds.md:31 and :57). few-reruns,
      which sat above the rate it guarded, is gone because re-runs now count
      in the rate (crates/toolbox-connector-github/src/runs.rs:59-65).
      Fixtures reach bronze and gold (demo/steady.yml reaches gold,
      portal/tests/standards.test.yaml:182-199), and gold is not implied by
      silver.
  - criterion: no-obvious-gap
    verdict: pass
    reason: >-
      The gaps the last review named are closed: a disabled workflow fails
      still-running (github-actions.yaml:260-269), and silver and gold need
      minDecidedRuns (packages/github-actions/toolbox-package.yaml:37-42).
      Against the research its design doc cites, the card covers GitHub's
      failure-rate metric and approximates flaky tests by first-try failures
      (docs/design/github-actions-standards.md:64-65 and :89); per-job history
      is a tracked open item (github-actions-standards.md:161). still-running
      reads only GitHub's state, not lastRunAt, so a push workflow whose
      triggers stopped firing keeps its old history; that is a refinement of
      an existing rule, not a missing standard.
  - criterion: actionable
    verdict: fail
    reason: >-
      Every fix now names a place, and the run rules' evidence lists failed
      run URLs (runs.rs:83-89). But those are only runs that still failed;
      runs that passed on a re-run raise firstTryFailRate without being
      listed. demo/slow.yml shows it: firstTryFailRate 40, failedRuns []
      (portal/fixtures/github-actions.ndjson:2). An agent raising that
      workflow to bronze, or a flaky one to silver, gets a fix that says "open
      the failed runs in the evidence" (github-actions.yaml:281-282 and
      :318-322) and an evidence list with nothing to open. Below 10 runs, the
      silver and gold evidence says more runs are needed but the fix doesn't
      say how to get them.
    suggestion: >-
      Have crates/toolbox-connector-github/src/runs.rs list the runs that
      passed only on a re-run (first-attempt URL) alongside failedRuns, append
      them in the three fail-rate rules' evidence, and add to the silver and
      gold fixes that a workflow under 10 decided runs rises only as more runs
      land (e.g. `gh workflow run <file>` for a workflow_dispatch one).
summary: >-
  Now one concern with a sound ladder: speed moved out, re-runs count in
  the rate, disabled and barely run workflows can't claim a tier. One
  thing holds it back: flaky runs that passed on a re-run count against a
  workflow but are absent from the evidence the fixes send an agent to.
