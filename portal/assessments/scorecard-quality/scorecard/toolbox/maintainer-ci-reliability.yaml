apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-ci-reliability
rubric: scorecard-quality
subjectHash: 1a9b78ee52d6
assessor: {kind: agent, name: campaign-review-cards-r4}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All eight rules ask one question for maintainers: whether a run on the
      default branch can be believed. They cover the red streak, a workflow
      still running and recently run, the first-try fail rate, hidden failures
      and job timeouts
      (packages/github-actions/fragments/github-actions.yaml:359-512). Speed
      is on its own card (maintainer-ci-speed,
      packages/github-actions/fragments/github-actions.yaml:512), for the
      reason docs/design/thresholds.md:35 gives. The new recently-run rule
      (packages/github-actions/fragments/github-actions.yaml:396-415) is the
      same concern: old green history standing in for current runs.
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      For a workflow that never runs on the default branch, silver and gold
      ask nothing beyond bronze. Every run rule starts with
      `!entity.onDefaultBranch ||`, and that includes fail-rate-under-10 and
      fail-rate-under-5, which are the whole of silver and gold
      (packages/github-actions/fragments/github-actions.yaml:471, :494). Such
      a workflow therefore reaches gold on the two static bronze rules alone,
      with no run read and minDecidedRuns skipped. That goes against "Gold
      asks for what lower levels don't already imply"
      (docs/design/thresholds.md:24). It is what portal/results.json records:
      the only gold workflow is .github/workflows/image.yml, which is
      workflow_call and workflow_dispatch only. Meanwhile ci.yml, codeql.yml
      and pages.yml, which do run on main, stay at bronze or none, because the
      ratchet can't grant their silver or gold (ratchetBlindLevels in the
      brief; docs/design/thresholds.md:50). So the one gold on the card is the
      workflow whose reliability is never measured. For workflows that run on
      main the ladder is sound: bronze holds the prerequisites, and silver and
      gold tighten the first-try rate to 10% and 5% over at least 10 decided
      runs (packages/github-actions/toolbox-package.yaml:26-46).
    suggestion: >-
      Stop granting silver and gold without run history. Either drop the
      `!entity.onDefaultBranch ||` bypass from fail-rate-under-10 and
      fail-rate-under-5, so an off-branch workflow stops at bronze with
      evidence such as "no run history on the default branch", or move
      off-branch workflows out of the run rules' scope (`skipped`). Pin it in
      portal/tests/standards.test.yaml with
      workflow:.github/workflows/release.yml, which the fixtures already mark
      as off-branch, not reaching silver.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Both earlier findings are fixed. recently-run catches an active workflow
      that stopped running
      (packages/github-actions/fragments/github-actions.yaml:396-415, at
      daysSinceLastRun in crates/toolbox-connector-github/src/runs.rs:112),
      and docs/design/thresholds.md:33-34 now gives the correct 60-day rule.
      Two failure modes are still not caught. First, a retry inside the run
      hides a first-try failure just as a re-run used to. The detectors look
      for `|| true`, `set +e`, a `shell:` without -e and the skip conditions
      (crates/toolbox-connector-workspace/src/workflows.rs:150-157, :172-186),
      but not for a retry action or a test runner's retry flag. The silver fix
      even recommends "retry the step in the workflow file"
      (packages/github-actions/fragments/github-actions.yaml:483), which
      lowers firstTryFailRate without fixing anything. Second,
      `onDefaultBranch` and `skipped_on_default` recognise only `main` and
      `master` (crates/toolbox-connector-workspace/src/workflows.rs:93-98,
      :182), although the package makes the branch a parameter
      (packages/github-actions/toolbox-package.yaml:22-25). In a portal with
      `branch: develop`, a `push: branches: [develop]` workflow counts as
      off-branch and passes every run rule. docs/design/thresholds.md:64-88
      states neither limit.
    suggestion: >-
      Add retries to hiddenFailures in
      crates/toolbox-connector-workspace/src/workflows.rs: a `uses:` of a
      retry action, or a `run:` with a test runner's retry flag (for example
      nextest `--retries`, pytest `--reruns`). Change the silver fix to
      quarantine a flake rather than retry it. Pass the package's `branch`
      parameter to the workspace connector, so `onDefaultBranch` and the skip
      detection use it. Add a fixture of each to
      portal/fixtures/workspace.ndjson.
  - criterion: actionable
    verdict: pass
    reason: >-
      Both earlier findings are fixed. failedRuns now links a re-run's failed
      first attempt (`/attempts/1`,
      crates/toolbox-connector-github/src/runs.rs:92-104, unit-tested at
      :212-213), so "Open the failed runs in the evidence" leads somewhere.
      Workflows that never run on main are no longer held to run history
      (crates/toolbox-connector-workspace/src/workflows.rs:64-99, pinned for
      release.yml at portal/tests/standards.test.yaml:1601-1603). I traced
      raising workflow:.github/workflows/ci.yml from none
      (portal/results.json: every-job-has-timeout failing on 5 jobs). The
      evidence lists the jobs, and the fix says to set `timeout-minutes` on
      each in the workflow file, which reaches bronze. The silver and gold
      fixes name the test, the workflow file or the pull request check. One
      thing is stale: the demo/slow.yml fixture still has `failedRuns: []` at
      40% first-try failures (portal/fixtures/github-actions.ndjson:2), a
      shape the connector no longer produces.
summary: >-
  The round-3 findings are closed: a workflow that stopped running is
  caught, a re-run's failed attempt is linked, and workflows that never
  run on main are exempt. That exemption now gives silver and gold for
  free: the only gold workflow is one whose runs are never read. A retry
  inside a run, which the silver fix itself recommends, hides flakes from
  the first-try rate, and the default branch is hard-coded to main or
  master although the package makes it a parameter.
