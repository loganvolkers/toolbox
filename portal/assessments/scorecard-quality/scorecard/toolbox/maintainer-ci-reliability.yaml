apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-ci-reliability
rubric: scorecard-quality
subjectHash: c350fd673fc2
assessor: {kind: agent, name: campaign-review-cards-r3}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      Every rule asks whether a run on the default branch can be believed:
      streak, still running, first-try fail rate, hidden failures and job
      timeouts
      (packages/github-actions/fragments/github-actions.yaml:351-475), for
      maintainers. Speed moved to its own maintainer-ci-speed card
      (packages/github-actions/fragments/github-actions.yaml:478) for the
      reason docs/design/thresholds.md:34 gives. every-job-has-timeout's
      rationale argues partly from runner cost
      (packages/github-actions/fragments/github-actions.yaml:431-434), which
      is the speed card's argument, but a hung job also withholds the verdict,
      so it fits here.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze holds the prerequisites (failures-visible and still-running,
      which keep the rate honest, per docs/design/thresholds.md:22-23 and
      :32-33) with a 20% bound; silver and gold tighten the same rate to 10%
      and 5% over at least 10 decided runs
      (packages/github-actions/toolbox-package.yaml:26-46), so gold implies
      silver and asks more. Re-runs count as failures
      (crates/toolbox-connector-github/src/runs.rs:58-65), so no rung is
      cheaper than the one below. No fixture sits at silver (the brief's
      fixtureRealLevels are bronze and gold), although
      portal/tests/standards.test.yaml:196 pins fail-rate-under-10 passing on
      demo/steady.yml.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Unchanged since the last review (same hash c350fd673fc2): a workflow
      that stops running is still not caught. still-running reads only
      GitHub's `state`
      (packages/github-actions/fragments/github-actions.yaml:367-385), and its
      rationale now says that a workflow whose triggers stop matching "stays
      active and is not caught here"
      (packages/github-actions/fragments/github-actions.yaml:382), but no doc
      says why that is left out. docs/design/thresholds.md:33 still says
      GitHub disables any workflow after 60 days, though the rule's own link
      says it only does so for scheduled ones. The connector already sends
      `lastRunAt` (crates/toolbox-connector-github/src/runs.rs:93), and only
      main-not-stuck-red's evidence reads it, so a push workflow whose
      `paths:` filter no longer matches keeps its last 100 green runs and
      passes every run rule indefinitely.
    suggestion: >-
      Add a bronze `recently-run` rule (or extend still-running) that fails
      when `entity.runs.lastRunAt` is older than a chosen window, with the
      window justified in docs/design/thresholds.md, and fixtures of a stale
      active workflow on each side in portal/fixtures/github-actions.ndjson.
      Correct thresholds.md:33 to say that GitHub disables only scheduled
      workflows.
  - criterion: actionable
    verdict: fail
    reason: >-
      Not fixed: `failedRuns` lists only runs whose final conclusion failed
      (crates/toolbox-connector-github/src/runs.rs:84-89), but runs that
      passed only on a re-run also raise firstTryFailRate (runs.rs:61-65).
      demo/slow.yml fails bronze at firstTryFailRate 40 with `failedRuns: []`
      (portal/fixtures/github-actions.ndjson:2), so the fix "Open the failed
      runs in the evidence"
      (packages/github-actions/fragments/github-actions.yaml:398, :448, :470)
      leaves the agent nothing to open. Separately, the connector reads runs
      with `?branch=main` (crates/toolbox-connector-github/src/main.rs:55 and
      :242). .github/workflows/release.yml runs only on pull_request and tag
      pushes, so by my reading it never gets a run on main and its silver
      evidence will always say "only 0 decided runs", with no fix that
      applies.
    suggestion: >-
      List the runs that passed only on a re-run (with the attempt number)
      next to failedRuns in crates/toolbox-connector-github/src/runs.rs, and
      add them to the three fail-rate rules' evidence. Either leave workflows
      that never run on the default branch out of the run rules (`appliesTo`,
      or `unknown` when there were no runs on the branch), or tell the agent
      in the silver and gold fixes how a workflow gets more decided runs.
summary: >-
  Same version as the last review, and neither of its findings is fixed.
  The card covers one concern with a sound ladder. A push workflow whose
  triggers stop matching keeps passing on old green history. Flaky runs
  that passed on a re-run count against a workflow but are missing from
  the evidence the fixes point to. And a workflow that never runs on main
  is held at bronze with nothing it can do about it.
