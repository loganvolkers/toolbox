apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-ci-reliability
rubric: scorecard-quality
subjectHash: 1d5a657389b8
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      cancels-superseded-runs and fast-feedback live on their own
      maintainer-ci-speed card
      (packages/github-actions/fragments/github-actions.yaml:476-531), with
      the reason in docs/design/thresholds.md:34. Every remaining rule answers
      whether a red or green run on the default branch can be believed
      (github-actions.yaml:330-334): streak, still running, first-try fail
      rate, hidden failures and job timeouts, the last because a hung job
      gives no answer. All serve maintainers. The new rationale says the same
      ("red means something broke and green means nothing did",
      github-actions.yaml:335-340), and the track comes from a package
      parameter (`${param:track}`, :347), which changes no rule.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze holds the prerequisites of the fail rate (main-not-stuck-red,
      still-running, failures-visible, timeouts) and a loose 20% bound
      (github-actions.yaml:351-432), per thresholds.md:22-23; silver and gold
      tighten the same rate to 10% and 5% and add a floor of 10 decided runs
      (github-actions.yaml:433-473, thresholds.md:57;
      packages/github-actions/toolbox-package.yaml). The rationale's "silver
      and gold each halve the share" matches 20, 10 and 5. Re-runs count in
      the rate (`passed_on_retry`,
      crates/toolbox-connector-github/src/runs.rs:59-65). Fixtures reach gold
      (demo/steady.yml, portal/tests/standards.test.yaml:195-200), and gold is
      not implied by silver.
  - criterion: no-obvious-gap
    verdict: pass
    reason: >-
      A disabled workflow fails still-running (github-actions.yaml:367-383),
      whose rationale now links GitHub's page on why workflows get disabled,
      and silver and gold need minDecidedRuns. Against the research its design
      doc cites, the card covers GitHub's failure-rate metric and approximates
      flaky tests by first-try failures
      (docs/design/github-actions-standards.md:64 and :89); per-job history is
      a tracked open item (github-actions-standards.md:161). still-running
      reads only GitHub's state, not lastRunAt, so a push workflow whose
      triggers stopped firing keeps its old history; that is a refinement of
      an existing rule, not a missing standard.
  - criterion: actionable
    verdict: fail
    reason: >-
      Every fix names a place, and the run rules' evidence lists failed run
      URLs (`failedRuns`, runs.rs:84-89). But those are only runs that still
      failed; runs that passed on a re-run raise firstTryFailRate without
      being listed. demo/slow.yml shows it: firstTryFailRate 40, failedRuns []
      (portal/fixtures/github-actions.ndjson:2). An agent raising that
      workflow to bronze, or a flaky one to silver, gets a fix that says "Open
      the failed runs in the evidence" (github-actions.yaml:395-402 and
      :446-449) and an evidence list with nothing to open. The new rationale
      explains why re-runs count but doesn't say where to find them. Below 10
      runs the silver and gold evidence says more runs are needed, but the
      fixes don't say how to get them.
    suggestion: >-
      Have crates/toolbox-connector-github/src/runs.rs list the runs that
      passed only on a re-run (first-attempt URL) alongside failedRuns, append
      them in the three fail-rate rules' evidence, and add to the silver and
      gold fixes that a workflow under 10 decided runs rises only as more runs
      land (e.g. `gh workflow run <file>` for a workflow_dispatch one).
summary: >-
  Re-assessed after the scorecard gained a rationale, links and a track
  parameter. One concern with a sound ladder, and the rationale matches
  it: speed lives apart, re-runs count in the rate, disabled and barely
  run workflows can't claim a tier. Flaky runs that passed on a re-run
  still count against a workflow but are absent from the evidence the
  fixes send an agent to.
