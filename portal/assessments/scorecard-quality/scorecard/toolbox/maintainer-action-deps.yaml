apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-action-deps
rubric: scorecard-quality
subjectHash: b82a21579937
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      One rule, one question for maintainers: is each third-party action
      pinned in every workflow that runs it
      (packages/github-actions/fragments/github-actions.yaml:534-571;
      portal/README.md:20). It is the per-action view of the same defect that
      pinned-to-sha scores per workflow, kept apart for the incident question
      (github-actions.yaml:532-533,
      docs/design/github-actions-standards.md:145-146).
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      Bronze is reachable (15 of 15 actions bronze in portal/results.json),
      and the rationale explains the single level
      (github-actions.yaml:540-544). But the card is a constituent of the
      repository level (portal/toolbox.yaml:30-33), which needs every
      constituent at rank 2 for silver
      (portal/standards/repository.yaml:166-174), and a bronze-only card's top
      rank is 1 (crates/toolbox-derive/src/lib.rs:1296-1304). So this card
      holds maintainer-repo at bronze for good, whatever else improves
      (results.json: maintainer-repo bronze), and there is no higher level on
      the card to reach.
    suggestion: >-
      Give the card silver and gold worth reaching, for example silver "no
      known-vulnerable ref" and gold "every SHA's version comment matches its
      tag", both fed by a token-holding zizmor run (see no-obvious-gap). Or
      drop it from policy.repoRollup and let maintainer-ci-security carry
      pinning into the repository level.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      The card exists for the "who uses tj-actions/changed-files?" incident,
      but nothing on it says whether a ref is a known-vulnerable or impostor
      commit. zizmor runs `--offline` (github-actions.yaml:17-22), and with -v
      zizmor 1.32.0 logs that it skips known-vulnerable-actions,
      impostor-commit and ref-version-mismatch without a token. A scratch
      workflow with tj-actions/changed-files pinned by SHA got no findings and
      would read bronze here. GitHub's secure-use guide and zizmor's audit
      list (github-actions-standards.md:55, 68-70) both name these checks.
    suggestion: >-
      Add a connector that runs zizmor with GH_TOKEN (or reads GitHub's
      advisory database for the `actions` ecosystem), skipped in the ratchet
      like `github-actions`, and a `dataFrom` rule on ActionDependency that
      fails when any used ref is a known-vulnerable or impostor commit.
  - criterion: actionable
    verdict: pass
    reason: >-
      The one rule's evidence hands over the SHA pin the repository already
      writes, comment included (D01M84EPMMR9740K4N25G7A6FAY,
      portal/tests/standards.test.yaml:214-223), and its fix gives `git
      ls-remote` for actions with no pin yet. An agent can raise a fixture
      action to bronze from those alone. The rule's own assessment notes that
      a hint can carry another version.
summary: >-
  A focused, actionable card for the per-action pinning question. It stops
  at "pinned", though: a known-vulnerable SHA reads bronze because
  zizmor's token-only audits never run, and being bronze-only inside the
  lowest-level rollup caps the repository level at bronze for good.
