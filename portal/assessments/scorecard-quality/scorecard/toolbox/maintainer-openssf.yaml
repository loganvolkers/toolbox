apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-openssf
rubric: scorecard-quality
subjectHash: 63a4b5194091
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      One concern as OpenSSF defines it, supply-chain security health, for
      maintainers, carried unchanged by D01M82E93XAPNE0WFXEPJZ59WG4
      (packages/openssf-scorecard/fragments/openssf-scorecard.yaml:110-136).
      License and Fuzzing aren't security controls on their face, but
      Scorecard scores them as security risks, and redrawing its boundary
      would break the carry the decision chose
      (docs/design/openssf-template.md:13-34).
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      One level, ten, with the gap to 10 as a measure the ratchet holds
      (fragment :113-118, :142), and `newEntitiesAtLeast: none` so a check
      added in a new Scorecard release doesn't fail the gate (:136). The climb
      is the measure, not tiers, as openssf-template.md:42 describes. All ten
      carried checks are at ten (portal/results.json), and the fixtures cover
      pass, fail-with-gap and inconclusive
      (portal/tests/standards.test.yaml:1150-1160).
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Vulnerabilities, the Scorecard check about known advisories, is left out
      for a sound reason: it reads 10 when OSV is unreachable and moves with
      each advisory (portal/toolbox.yaml:363-380; openssf-template.md:83-88).
      But nothing replaces it in the maintainer cards, while the same section
      counts 23 open advisories against Cargo.lock. The only advisory rule in
      this portal compares Toolbox with Backstage
      (portal/standards/backstage-comparison.yaml:602-618, track vs-backstage)
      and isn't a maintainer gate. Open item O5 (openssf-template.md:115)
      names the fix but it isn't built.
    suggestion: >-
      Build O5: run osv-scanner offline against a pinned advisory snapshot (or
      cargo-audit with a pinned database) as a connector, and add a maintainer
      rule with a measure of open advisories so the ratchet stops new ones
      while the 23 are paid down.
  - criterion: actionable
    verdict: pass
    reason: >-
      The rule's evidence is Scorecard's Warn lines plus the check's
      documentation (fragment :144-149). On the Pinned-Dependencies fixture
      those lines name each file and line and the digest to write
      (portal/fixtures/maintainer-openssf.ndjson:1). Each record carries a
      `command` that reruns Scorecard alone on the tracked files, so an agent
      can raise a check and confirm it.
summary: >-
  A faithful carry of OpenSSF Scorecard with a measure-based ratchet,
  tested on all three outcomes, and actionable through Scorecard's own
  details. The gap is the check it leaves out: Vulnerabilities is excluded
  for a good reason, but nothing replaces it while 23 advisories stay
  open. Scorecard's presence checks also let a no-op fuzz target score 10,
  as the `ten` rule's assessment shows.
