apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/meta-connector
rubric: scorecard-quality
subjectHash: 212082c12558
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All four rules (portal/standards/meta.yaml:857-897) ask whether a
      portal's connector declaration gets its records into the portal mapped,
      tested and current. The audience is the portal author, as the
      description says (meta.yaml:836-840). The health of connector code
      belongs to maintainer-connector (portal/standards/connectors.yaml:51-53)
      and is kept apart.
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      Bronze (records-mapped, has-fixtures) takes map rules and fixture data.
      Silver and gold each take one manifest line per record, because
      freshness-declared and refreshable read only the `freshness:` and
      `refresh:` keys (crates/toolbox-cli/src/model.rs:220, 232-233). Gold is
      meant to cost connector support for refresh by id, but nothing ties it
      to the capabilities the connector registers
      (crates/toolbox-connect/src/hub.rs:409-415). As checked, gold is cheaper
      than bronze. 7 of the 11 described connectors are gold
      (portal/results.json).
    suggestion: >-
      Have gold read what the package registers (see the refreshable
      assessment), so that it costs connector support. The ladder would then
      rise in cost as well as order: data, then a currency bound, then fixes
      an agent can confirm.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Missing: a floor rule that `config:` holds no literal credential and
      reads secrets through `${env:…}` or `${secret:…}` (D55;
      examples/reference-portal/toolbox.yaml:42-43 shows the intended form).
      The connector declaration is where a portal manifest carries credentials
      (Connector.config, crates/toolbox-model/src/manifest.rs:122), yet the
      connector record emits no config facts (model.rs:229-235), and validate
      has no secret check. thresholds.md puts credentials in the floor of ten
      scorecards (docs/design/thresholds.md:35), including
      maintainer-connector for connector crates (connectors.yaml:174-184), but
      not this one. A second, smaller gap: fixtures per declared record kind,
      since has-fixtures counts lines for the whole connector.
    suggestion: >-
      Emit `literalSecrets`: config values that match maintainer-connector's
      secret patterns and aren't `${…}` placeholders. Add a bronze
      `no-hardcoded-secrets` with them as evidence, and a `withoutFixtures`
      list per record kind.
  - criterion: actionable
    verdict: fail
    reason: >-
      Three fixes name a place: `map: - from:`, fixtures/<connector>.ndjson
      and `freshness:` (meta.yaml:861-883). refreshable's fix doesn't
      (meta.yaml:891-892). I tried raising connector:toolbox/workspace from
      silver to gold. Its evidence is ['assessment']
      (portal/tests/standards.test.yaml:833), and the fix says to support
      refresh. That means changing the workspace connector, where assessment
      refresh is excluded on purpose
      (crates/toolbox-connector-workspace/src/main.rs:1330-1333), and then
      adding a `refresh:` key in portal/toolbox.yaml:210-230 that the fix
      never names.
    suggestion: >-
      Rewrite refreshable's fix to name both the manifest's `refresh:` key and
      the connector's registered capability.
summary: >-
  The card has one clear concern, and its bronze and silver fixes work.
  Its gold is a manifest declaration nothing compares with the connector,
  so gold costs less than bronze, and gold's fix names no place. A rule
  against literal credentials in `config:` is missing, though every other
  card that handles credentials has one at bronze.
