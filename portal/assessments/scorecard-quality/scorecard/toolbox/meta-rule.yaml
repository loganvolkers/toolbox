apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/meta-rule
rubric: scorecard-quality
subjectHash: ffb22b77dfe1
assessor: {kind: agent, name: blind-review-2026-11-23}
at: 2026-11-23
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All eight rules (portal/standards/meta.yaml:289-357) judge one thing,
      the deterministic authoring quality of a rule: explained, tested,
      decided on fixtures, evidence, readable CEL. They serve one audience,
      standard authors, as docs/design/scorecards-for-scorecards.md:97-104
      lays out.
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      Gold `always-explains` (meta.yaml:351-355) passes with a constant
      `evidence: "['x']"`, which is cheaper than bronze `tested` (writing an
      expectation). Live rules already reach it that way: maintainer-site
      titled uses `['no title']` (portal/standards/site.yaml:57), and
      cancels-superseded-runs uses a constant string. Gold `readable` is met
      by moving logic into a computed field, as
      portal/assessments/rule-quality/rule/toolbox/meta-rule/readable.yaml
      already found.
    suggestion: >-
      Make gold "evidence reads the entity" (the rule record's
      `evidence.fields` is already in the brief's facts: non-empty), and move
      always-explains to silver next to shows-evidence.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Two rules are missing. (1) A fix that names a place: explains-fix counts
      5 words (meta.yaml:296), while the design's own lesson L1
      (scorecards-for-scorecards.md:78) is that fixes naming the file and
      field worked. (2) A test that asserts an outcome: test_mentions
      (crates/toolbox-cli/src/meta.rs:28-54) credits any expectation that
      names the card and the rule, including a tautology (`rules['r'] ==
      rules['r']`). It also crosses every card and rule named in one
      expectation, so naming card A next to card B's rule counts as testing
      A's rule too.
    suggestion: >-
      Add `fix-names-place` (the fix mentions a path, a field the check reads,
      or a command) and `evidence-reads-entity`. Make `tested` require one
      expectation comparing the rule's outcome with 'fail' and one with
      'pass', within the same score() call.
  - criterion: actionable
    verdict: pass
    reason: >-
      I tried rule:repo/repo-hygiene/codeowners-catch-all (level none, failing
      `tested` in portal/results.json). The evidence names the card and rule,
      and the fix gives the expectation's shape. One expectation in
      examples/repo-portal-starter/tests raises it to bronze, with no other
      source needed.
summary: >-
  One concern and actionable, but its gold is cheaper than its bronze, and
  `tested` can be satisfied by a tautology.
