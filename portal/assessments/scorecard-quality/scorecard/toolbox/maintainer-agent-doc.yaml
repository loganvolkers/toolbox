apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/maintainer-agent-doc
rubric: scorecard-quality
subjectHash: 756b5d168272
assessor: {kind: agent, name: cursor-assessor-11, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      Every rule is about one artifact, the instructions an agent loads before
      changing this repo, for one layer: the maintainer SDLC
      (docs/design/agents-md-standards.md:61-62). Single source, links,
      commands, size, decision log and CI-run commands all ask whether those
      instructions are one, current and true. The two safety rules are not a
      second concern. They are the floor every card in this portal carries
      (docs/design/thresholds.md:19-21,35), and the rationale says so
      (portal/standards/agent-docs.yaml:51-56).
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is one source, working links and the two killer items. Silver
      adds how to test and a size. Gold adds the decision log and the
      requirement that silver's commands actually run in CI
      (agent-docs.yaml:68-171), so checks-run-in-ci builds on has-commands.
      That follows D75 as amended by D01M83G9F4EEGN1GTP14HEYB8B6. Aliases
      inherit the canonical file's commands and log by decision (D82, D83),
      which is why their silver and gold rules are `!canonical ||`. No fixture
      sits at silver, though: the fixtures reach none, bronze and gold
      (portal/fixtures/workspace.ndjson:28-30,58), so that level is only
      implied.
  - criterion: no-obvious-gap
    verdict: pass
    reason: >-
      Against the research the design doc cites (agents-md-standards.md:30-37:
      the agents.md README, the v1.1 proposal, alias practice), each adopted
      item has a rule: filename, a command, the line ceiling, aliases pointing
      at the canonical file, and the decision log. Judging the prose, and
      whether harnesses behave the same, are deliberately not gates (D75,
      D82). The weaknesses I found are inside existing rules, not missing
      ones: Markdown comments are uncounted by no-hidden-instructions, and an
      alias's restatement goes unmeasured by single-source.
  - criterion: actionable
    verdict: pass
    reason: >-
      Every fix names the place to change (the brief reports fixNamesPlace for
      all eight rules). Raising the partial fixture
      (portal/tests/standards.test.yaml:478-489) to gold needs only what the
      fixes say: name `cargo test` in AGENTS.md, move detail out to get under
      500 lines, link docs/decisions, and run or drop `cargo nope`. Its
      evidence names each gap ('0 command lines', '600 lines', 'cargo nope').
      no-hidden-instructions gives a count without a line, but its fix says
      which characters to search for.
summary: >-
  A coherent card for the files agents load in this repo, with a ladder
  that follows D75, D82, D83 and the bronze move for safety items, and
  fixes an agent can act on. The weaknesses are in the measures (see the
  rule assessments): a mention counts as a pointer, words count as
  commands, a script directory counts as a script, and HTML comments
  aren't counted. No fixture sits at silver, and agents-md-standards.md §4
  still lists the safety rules at gold.
