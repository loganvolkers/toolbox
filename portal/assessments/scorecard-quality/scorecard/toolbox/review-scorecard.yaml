apiVersion: toolbox.dev/assessment/v1
entity: scorecard:toolbox/review-scorecard
rubric: scorecard-quality
subjectHash: b1119b759866
assessor: {kind: agent, name: cursor-assessor-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All four rules (portal/standards/meta.yaml:1015-1073) read one thing,
      the scorecard-quality assessment of a toolbox scorecard (`appliesTo`,
      meta.yaml:1014). They serve one audience, the people who write this
      portal's standards (`track: standards`, meta.yaml:1011).
      portal/README.md:25 files the card as advisory alongside the other
      review-* cards. The description and rationale (meta.yaml:992-1002) state
      the one concern: whether a scorecard measures one thing and climbs a
      real ladder.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is no open finding, the default for an unreviewed scorecard.
      Silver is a current review. Both gold rules repeat the fresh condition
      and add something: clean and cited (passes-review), and no doubts
      (no-doubts). Neither gold rule is cheaper than bronze. Ranking "reviewed
      with findings" at none, below "not reviewed", is deliberate
      (D01M831P5QWJQ4A2FT85N5MXJQF, point 1). The fixtures reach every level:
      meta-rule none, user-cli bronze, maintainer-ci-security silver and
      operator-cli gold (portal/tests/standards.test.yaml:896-915).
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Missing: a second-assessor rule. The card's own rationale says the
      signal came from an adversarial review by a fresh agent, which failed
      every form-gold scorecard it sampled (meta.yaml:997-1002,
      docs/design/meta-standards-review.md:77-80). Yet the card accepts a
      review by the scorecard author's own agent. review-crate requires
      `independently-reviewed` at gold (portal/standards/crates.yaml:433-453),
      and review-assessment rejects self-review
      (portal/standards/assessments.yaml:105-112). The Scorecard kind has no
      `reviewIndependent` field (meta.yaml:50-80), although the connector
      computes it for every assessment
      (crates/toolbox-connect/src/assessment.rs:232-295).
    suggestion: >-
      Add `reviewIndependent` to the Scorecard kind, copied from the
      scorecard-quality assessment's `independentReview` as crates.yaml:84-92
      does. Add a gold `independently-reviewed` rule, with a fixture scorecard
      that has a grounded review by a second assessor.
  - criterion: actionable
    verdict: fail
    reason: >-
      I raised this scorecard with its own fixes. The silver fix's `toolbox
      assess brief` (meta.yaml:1036-1039) gave the file to write
      (portal/assessments/scorecard-quality/scorecard/toolbox/review-scorecard.yaml),
      and writing it makes the review fresh. Its failing criteria then put the
      card at none, as bronze intends. The bronze and passes-review fixes
      point at portal/assessments/. The gold no-doubts fix, "Resolve what the
      assessor was unsure of: usually a level whose purpose isn't written
      down" (meta.yaml:1065-1067), names no file and no command, and doesn't
      say to re-assess. An agent at silver with an unsure verdict isn't told
      where to go.
    suggestion: >-
      Rewrite the no-doubts fix as review-crate's is (crates.yaml:424-428):
      read the unsure verdict's suggestion in the assessment file, write the
      missing purpose into the scorecard's `description:` or `rationale:`,
      then re-assess with `toolbox assess brief scorecard:<id> --portal
      portal`.
summary: >-
  Fails on no-obvious-gap and actionable. The card has one concern and a
  ladder that fixtures reach at every level, and a campaign works off its
  findings (portal/campaigns.yaml:121-135). Unlike review-crate, it
  doesn't require the second assessor whose independence produced the
  card's motivating evidence, and its gold no-doubts fix names no place to
  act.
