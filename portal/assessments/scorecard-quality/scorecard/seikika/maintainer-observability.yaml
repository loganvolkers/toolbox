apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/maintainer-observability
rubric: scorecard-quality
subjectHash: e762b3a45a1f
assessor: {kind: agent, name: cursor-assessor-09, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All eight rules concern Seikika's own runtime-telemetry contract: the
      crate, catalog, scrape, logs, alerts, the monitor review and the OTLP
      testbed. All are things maintainers change in this repository, and the
      card is on the maintainer track
      (portal/standards/observability.yaml:91-114). `assessed-monitor` reaches
      into the operator layer's monitor stage, but only as evidence that the
      telemetry serves operators, and D01M81ADN8C10EA1Z1VNRY3A5JZ groups it
      with the crate checks explicitly.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      The ladder in the rationale (observability.yaml:101-103) is ordered by
      dependency. Bronze is the crate, catalog, `service.name` doc and scrape
      test. Silver adds logs, alerts and a reviewed monitor stage, all of
      which need the crate. Gold is an export proven against a real collector,
      which the lower levels don't imply. The one live entity is gold
      (portal/results.json), and the fixtures reach none, bronze and gold
      (portal/tests/standards.test.yaml:1107-1149). Because every rule only
      checks that a path exists, each level costs the same to pass: the order
      is sound, but the cost doesn't climb.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Nothing checks that the cataloged and alerted metrics are actually
      emitted. `seikika_connector_lag_seconds` and
      `seikika_index_freshness_seconds` are initialised once with placeholder
      labels (crates/seikika-telemetry/src/metrics_prom.rs:150-152) and set by
      no other crate, yet the rationale names connector lag as what goes
      unnoticed (observability.yaml:99-101), and
      ops/alerts/index-freshness.yaml alerts on the second. Nor does any rule
      cover D01M81ADN8C10EA1Z1VNRY3A5JZ's "other crates emit only via
      `tracing` and catalog helpers". No rule checks that the code's names
      match METRIC_CATALOG.md either.
    suggestion: >-
      Add rules for: every catalog metric that isn't a declared stub has a
      setter called outside seikika-telemetry, and every alert's metric is one
      of those; no crate but seikika-telemetry depends on opentelemetry crates
      directly (from the workspace connector's dependency records); and
      METRIC_CATALOG.md matches `catalog::names::REQUIRED`.
  - criterion: actionable
    verdict: pass
    reason: >-
      Every rule's evidence is the exact missing path, computed from
      `missingPaths` (observability.yaml:38-77), and every fix names the file
      or directory to create. Raising the demo-partial fixture
      (portal/fixtures/workspace.ndjson:82) from bronze to silver means
      creating the three paths its evidence lists. The only soft spot is
      `assessed-monitor`'s elided
      "portal/assessments/.../operator/monitor.yaml", which its evidence and
      `seikika assess brief` resolve.
summary: >-
  A focused, actionable maintainer card with a sensible ladder from
  instrumentation to review to a collector-proven export, motivated by
  D01M81ADN8C10EA1Z1VNRY3A5JZ. Every rule checks only that a file exists,
  and the repository's one entity is gold even though two of its cataloged
  gauges are never updated and one alert watches such a gauge. The missing
  standard is whether the declared telemetry is actually emitted.
