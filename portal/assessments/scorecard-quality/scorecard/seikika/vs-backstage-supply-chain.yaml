apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/vs-backstage-supply-chain
rubric: scorecard-quality
subjectHash: a9d89a264321
assessor: {kind: agent, name: cursor-assessor-17, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All four rules answer what an adopter inherits and whether they can
      verify it: package count, known and high advisories, and provenance
      (portal/standards/backstage-comparison.yaml:565-576). That is one
      concern, ISO 25010 security resistance (F8,
      docs/design/backstage-comparison.md:53), for one audience: the platform
      or security reviewer deciding whether to deploy.
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      Bronze is unreachable now. It requires `knownVulns == 0` (:603), and two
      of Seikika's five advisories are unmaintained notices for chrono and
      chrono-tz, which can't go without dropping CEL's `timestamp()` and
      `duration()` (experiments/backstage-compare/RESULTS.md:195-199). That
      rule shares bronze with a package bar Seikika clears by 40% (605 ≤
      1,000) and with high == 0, which it passes. So the strictest rule and
      the easiest ones sit on one rung, and portal/results.json has Seikika at
      none on this card for that one rule. Only high == 0 and provenance were
      pre-registered (experiments/backstage-compare/README.md:46-47).
    suggestion: >-
      Make bronze high-vulnerabilities, provenance and packages. Move
      known-vulnerabilities to silver, with a reason in
      backstage-comparison.md. Optionally add a gold that verifies every
      release asset and the image.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      RESEARCH.md F8 lists OpenSSF Scorecard per check alongside packages,
      advisories and provenance
      (experiments/backstage-compare/RESEARCH.md:64), and records Backstage's
      5.7 with 0 on Pinned-Dependencies, Token-Permissions and
      Dangerous-Workflow (:324). No rule here reads it, although CI already
      installs the Scorecard CLI (.github/workflows/ci.yml:44) and this portal
      scores itself with it in `maintainer-openssf` (portal/seikika.yaml:370).
      A published SBOM per release, SSDF PS.3, is also absent.
    suggestion: >-
      Add a `scorecard-checks` rule on the OpenSSF checks both products can be
      scored on (Pinned-Dependencies, Token-Permissions, Dangerous-Workflow),
      fed by the Scorecard CLI in footprint.py, and an `sbom` rule that a
      release ships an SPDX or CycloneDX file.
  - criterion: actionable
    verdict: fail
    reason: >-
      Try raising Seikika from none to bronze, the one raise this card needs.
      The failing rule's evidence is "5 known vulnerabilities", and its fix
      scans only Cargo.lock (backstage-comparison.yaml:611-612). Three of the
      five are in the OpenFGA binary (RESULTS.md:200-202), whose pin is at
      image/Dockerfile:8-10, and the other two are blocked by `cel`'s chrono
      feature. The provenance fix sends agents to hand-edit
      .github/workflows/release.yml, which D98 forbids. So the fixes can't
      take Seikika up a level.
    suggestion: >-
      Rewrite the vulnerability fixes to scan footprint.py's three targets and
      name the OpenFGA pin, and point the provenance fix at
      dist-workspace.toml:20-21. The level change above makes bronze
      reachable.
summary: >-
  A focused scorecard with real weight, but its bronze is out of reach:
  zero advisories, unmaintained notices included, keeps Seikika at none,
  and the fixes don't reach the OpenFGA advisories. OpenSSF Scorecard and
  SBOMs are the obvious missing rules. Both are in the research brief.
