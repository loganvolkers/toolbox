apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/review-sdlc-stage
rubric: scorecard-quality
subjectHash: cfe649f1045a
assessor: {kind: agent, name: cursor-assessor-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All four rules (portal/standards/sdlc.yaml:331-392) read one thing, the
      sdlc-stage-quality review of a stage. They answer one question, whether
      an agent can carry the stage out with released artifacts and without
      changing the core (rationale, sdlc.yaml:314-319). The stages come from
      four layers, but no rule splits by layer, so a level means the same
      thing for each stage. One documentation slip: the portal/README.md:25
      row lists review-rule, review-scorecard, review-crate and
      review-assessment but not this card, so the README doesn't say whom it
      serves, although the rubric description says the README should.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is no open finding, silver a current review, and gold a clean,
      cited review with no doubts. Each gold rule repeats `fresh`, and none is
      cheaper than bronze. That matches the review-* row in
      docs/design/thresholds.md:55. The fixtures reach none
      (demo-partial/ship), bronze and gold (demo-done/plan)
      (portal/tests/standards.test.yaml:1071-1091), but no demo stage sits at
      silver, so that rung is untested. The description (sdlc.yaml:309-313)
      names none, silver and gold but never says what bronze is.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Missing: a second-assessor rule. A stage's assessment is often written
      by the agent that built the stage, and the review judges whether "an
      agent can carry it out", which is easy to over-claim. review-crate
      requires a different assessor's grounded review at gold
      (portal/standards/crates.yaml:433-453), on the evidence in
      D01M831P5QWJQ4A2FT85N5MXJQF that one of three reviews was self-review.
      The SdlcStage kind has no `reviewIndependent` field (sdlc.yaml:96-125).
      The connector's `link_reviews` already computes one for every assessment
      (crates/seikika-connect/src/assessment.rs:232-295).
    suggestion: >-
      Add `reviewIndependent` to SdlcStage, copied from the assessment's
      `independentReview` as crates.yaml:84-92 does. Add a gold
      `independently-reviewed` rule, with a demo stage whose
      sdlc-stage-quality assessment has a grounded review by a second assessor
      in portal/fixtures/workspace.ndjson.
  - criterion: actionable
    verdict: fail
    reason: >-
      I tried operator/build-connector, whose live review has
      `agent-can-complete: unsure`
      (portal/assessments/sdlc-stage-quality/sdlc-stage/operator/build-connector.yaml).
      To reach gold, its no-doubts fix says only "Resolve what the assessor
      was unsure of, usually a missing measurement or an unstated exit
      criterion" (sdlc.yaml:385-386). It names neither the stage file
      (portal/sdlc/stages/operator.yaml:15-31) nor a re-assessment. A
      measurement added to a check script doesn't change the stage hash
      (crates/seikika-connector-workspace/src/data.rs:250), so the unsure
      review stays fresh. The bronze, silver and passes-review fixes do name
      portal/assessments/ or the brief command (sdlc.yaml:338-374).
    suggestion: >-
      Rewrite the no-doubts fix to name the assessment file's suggestion, the
      stage entry in portal/sdlc/stages/<layer>.yaml and `seikika assess brief
      sdlc-stage:<layer>/<stage> --portal portal`, as review-crate's no-doubts
      fix does (crates.yaml:424-428).
summary: >-
  Fails on no-obvious-gap and actionable. The card has one concern and the
  shared review-* ladder. It lacks the second-assessor rule that
  review-crate has, and its gold no-doubts fix names no place to act. Also
  worth fixing: no fixture reaches silver, the README's scorecard table
  leaves the card out, and close-review-findings
  (portal/campaigns.yaml:121-135) doesn't include it, although its
  findings rationale says stage findings "went unacted for days".
