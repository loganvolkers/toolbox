verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      One rule, `no-findings`, over one kind, the Python files this repository
      maintains, with one tool, ruff 0.14.0, and track `maintainer`
      (portal/seikika.yaml:384-413;
      packages/sarif/seikika-package.yaml:131-168). The globs cover all 13
      tracked .py files outside experiments/, which the comment at
      seikika.yaml:383 deliberately leaves out.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      A single `clean` level with `ratchet: {newEntitiesAtLeast: clean}` and a
      campaign to zero is the SARIF slot's design: the tool owns the rules,
      and the box adds clean plus a ratchet (seikika-package.yaml:138-142,
      151-152, 170-178). There are no rungs to mix. Clean is reachable now: I
      ran `ruff check --no-cache --ignore-noqa` 0.14.0 over the three globs
      and got "All checks passed!" on 13 files. The baseline's
      `"maintainer-python": {}` is compaction of an all-clean card
      (crates/seikika-cli/src/report.rs:440-467), not missing data.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      ruff runs with its defaults plus PGH004 and RUF100 (ruff.toml:8-9), so
      the bugbear (B) and bandit-derived (S) rules are off. On this checkout,
      `ruff check --select S602,S310,B` finds scripts/take-it-out.py:79
      calling subprocess with `shell=True`, 6 unchecked `urlopen` calls in
      examples/acme-live/deploy/ and examples/reference-portal/tools/, and 3
      unused loop variables in reference.py. Formatting isn't checked either:
      `ruff format --check` would reformat 11 of 13 files. For scripts that
      shell out and open URLs, the security subset is the obvious standard to
      leave out only on purpose, and ruff.toml gives no reason.
    suggestion: >-
      In ruff.toml, the tool's own config, add `extend-select = ["B", "S602",
      "S603", "S310"]` (or the whole `S` set with per-file ignores for S101 in
      tests), and fix or justify the hits. Decide whether `ruff format
      --check` belongs as a second SARIF-slot include or is out of scope, and
      say so in the seikika.yaml comment.
  - criterion: actionable
    verdict: pass
    reason: >-
      The evidence is `line N: <rule> <message>` per active finding
      (seikika-package.yaml:159-162), each record carries the command that
      reproduces it alone, and the fix says to fix it or add a commented
      per-file ignore in ruff.toml, noting that `# noqa` is ignored
      (seikika.yaml:409-413). On the fixture messy.py, removing the unused
      `os` import named in the evidence makes it clean
      (portal/tests/standards.test.yaml:1099-1104).
summary: >-
  A clean application of the SARIF slot: one level, a ratchet, the tool's
  own config, and evidence that reproduces outside the box. Every
  maintained file is clean today. The gap is in what ruff is asked to
  check: the defaults leave out the security and bugbear rules that flag
  this repo's `shell=True` and `urlopen` calls, and formatting isn't
  checked.
