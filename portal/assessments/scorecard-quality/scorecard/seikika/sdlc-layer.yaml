entity: scorecard:seikika/sdlc-layer
rubric: scorecard-quality
subjectHash: 53a8ea2638b4
assessor: {kind: agent, name: cursor-assessor-13, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All three rules ask whether one SDLC layer's stage catalogue is
      complete: declared, then none missing in fact, then all built
      (portal/standards/sdlc.yaml:265-303). The audience is the maintainers
      curating the catalogue, on track `evidence`, per D87
      (D01M7WQBZHG0000000000000000). It deliberately sits apart from
      sdlc-stage, which judges each stage on its own (sdlc.yaml:252-256).
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze (every listed stage declared) is a prerequisite of silver (each
      has a doc that exists and names it), which is in turn below gold (all
      built), as docs/design/thresholds.md:58 lays out. Live, the levels
      spread: package-author is bronze and the other three are silver
      (portal/results.json), so each rung separates layers, and gold is the
      real goal the rationale names. Gold reads only `status` and not gaps
      (sdlc.yaml:31), which makes it softer than sdlc-stage's `built` but not
      cheaper than silver.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Two standards are missing. First, nothing checks a layer's stage list
      against the loop docs/sdlc.md:6 says every layer needs (plan, build,
      test, deploy, monitor). package-author lists no plan or monitor stage
      and user no plan stage (portal/sdlc/layers.yaml:19, 42), yet both can
      reach gold. Second, the layer's own `doc` is collected as `missingPaths`
      (sdlc.yaml:19; portal/seikika.yaml:164), but no rule reads it, so a
      layer whose design doc is gone still scores.
    suggestion: >-
      Add a bronze `doc-exists` rule (`entity.missingPaths.size() == 0`), and
      a silver `covers-the-loop` rule over a declared loop policy that maps
      each loop step to one of the layer's stages, listing unmapped steps as
      evidence.
  - criterion: actionable
    verdict: pass
    reason: >-
      I tried sdlc:package-author, at bronze and failing nothing-missing on
      `package` and `distribute`. The evidence names both stages. The fix says
      to write a doc or section that names each, point `docs:` at it in
      portal/sdlc/stages/<layer>.yaml, and set a status other than missing
      (sdlc.yaml:281-286). That is enough to reach silver. The gold fix points
      at sdlc-stage for what each listed stage lacks (sdlc.yaml:298).
summary: >-
  A focused layer card with a real ladder that separates the four layers
  today, and fixes an agent can follow. It misses two standards: whether a
  layer's stages cover the loop docs/sdlc.md requires, and whether the
  layer's own doc exists, which is collected and never read. Gold trusts
  the declared status and ignores open gaps.
