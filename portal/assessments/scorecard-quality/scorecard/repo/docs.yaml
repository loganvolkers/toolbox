apiVersion: toolbox.dev/assessment/v1
entity: scorecard:repo/docs
rubric: scorecard-quality
subjectHash: 35762ee89891
assessor: {kind: agent, name: cursor-assessor-18, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      One concern, links in a pilot repository's Markdown resolving, for its
      maintainers (examples/repo-portal-starter/toolbox.yaml:156-179). The
      description and rationale both say this is where the starter begins.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      A single bronze level with one rule, so no level can mix rules. Bronze
      is reachable in any repository with no broken relative links. The
      fixtures don't show that: their only doc fails (brief: fixtureRealLevels
      empty), and portal/results.json lists this card under meta-scorecard
      `fixtures-reach-every-level`.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Link checkers such as lychee and markdown-link-check also check
      reference-style links and `#fragment` anchors. This card's only measure
      drops fragments and reads only inline links
      (crates/toolbox-connector-workspace/src/main.rs:297-318). A renamed
      heading breaks links without failing any build, the same failure its
      rationale names (examples/repo-portal-starter/toolbox.yaml:161-164), and
      the card leaves it out.
    suggestion: >-
      Have the connector resolve `#fragment` against the target file's
      headings and read reference-style definitions, then either fold them
      into links-resolve or add a silver `anchors-resolve`. Add a fixture doc
      that passes, so bronze is shown.
  - criterion: actionable
    verdict: pass
    reason: >-
      The rule's evidence lists the broken targets and the entity is the doc
      itself (examples/repo-portal-starter/toolbox.yaml:171-175), so an agent
      knows the file and the link to fix. With that, README.md in the fixture
      would reach bronze by fixing `docs/runbook.md`
      (examples/repo-portal-starter/tests/standards.test.yaml).
summary: >-
  A small, focused, actionable starter card. It misses anchors and
  reference-style links, which break the same way as the file links it
  checks. Its fixtures never show a passing doc, so the meta scorecard
  flags it.
