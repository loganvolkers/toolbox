at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      no-obvious-gap in
      portal/assessments/scorecard-quality/scorecard/toolbox/operator-cli.yaml
      says exit codes are stated in the help of validate and test only.
      Report's help says regressions exit 1
      (crates/toolbox-cli/src/main.rs:103-104) and doctor's help says exit 1
      when something is missing (main.rs:313). The rest holds. layer is user
      only with an MCP tool or the name mcp (portal/standards/cli.yaml:15-18;
      CLI_MCP_TOOLS at main.rs:401-413), and appliesTo is operator
      (cli.yaml:96). run is the app developer's story
      (docs/design/federated-actions.md:117), token create is user
      authenticate (docs/design/user-sdlc.md:51), and install, tools install
      and doctor are the package-author loop
      (docs/design/package-author-sdlc.md:49-50 and :192-193). vendor is not
      named there. portal/results.json has 16 operator commands at silver and
      6 at bronze (plan, push, token-create, vendor, connector-drive,
      connector-records), 22 in scope. The ladder is
      docs/design/toolbox-for-toolbox.md:105. Serve, push, derive, install,
      doctor and the connector subcommands have no format flag
      (main.rs:118-124, :265-271, :289-320, :689-711). The capture needs the
      word toolbox and a command (portal/toolbox.yaml:111-114); assess.rs:68
      and ratchet.rs:54 call the binary without that text.
    suggestion: >-
      Drop "only", and name report and doctor as commands whose help already
      states an exit code. Keep the missing --format list, which the structs
      support.
  - criterion: complete
    verdict: pass
    reason: >-
      one-concern fails because the fallback layer mixes the user and
      package-author commands the citations name. The ladder matches the
      design table and silver is still unmet for six commands. The missing
      --format gap is real even though the exit-code sentence overclaims. An
      integration test written like the existing helpers does not match the
      capture, so actionable fails.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The layer expression, the 22 in-scope rows and the capture regex are
      fixed. A second assessor still fails one-concern and actionable after
      correcting the exit-code sentence.
  - criterion: actionable
    verdict: pass
    reason: >-
      An explicit layer, a --format json rule for the commands whose structs
      lack one, and a capture that sees the test helpers (or a fix that
      requires the literal "toolbox <command>") would change the three fails
      in
      portal/assessments/scorecard-quality/scorecard/toolbox/operator-cli.yaml.
summary: >-
  The mixed layer, the six commands still at bronze, and the test helper
  the capture misses are all in the cited files. The assessment overclaims
  that only validate and test document an exit code: report and doctor do
  too. Correct that sentence; the three fails still stand.
