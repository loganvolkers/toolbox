      workflow that isn't active (github-actions.yaml:260-269). minDecidedRuns
      defaults to 10 (packages/github-actions/toolbox-package.yaml:37-42).
      Runs that passed on a retry count in firstTryFailRate
      (crates/toolbox-connector-github/src/runs.rs:59-65, 82), while
      failedRuns lists only runs that still failed (runs.rs:83-89).
      demo/slow.yml shows 40 and [] (portal/fixtures/github-actions.ndjson:2).
      Scoring the fixtures with `toolbox report portal --fixtures` puts
      demo/steady.yml at gold. One nit:
      docs/design/github-actions-standards.md:65 still says "re-run rate",
      though :89 supports the claim.
  - criterion: complete
    verdict: pass
    reason: >-
      Keeping the timeout rule on this card is backed by
      docs/design/github-actions-standards.md:17 and :86, which list it as
      reliability. Bronze is reachable: demo/steady.yml passes it, and
      docs/design/thresholds.md:31 calls it the next step for this repo's
      ci.yml. I found no missed failure. The same empty-evidence problem also
      reaches the gold fix
      (packages/github-actions/fragments/github-actions.yaml:335-338), which
      the actionable fail already covers.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on something the sources state, not on taste. Rule
      placement rests on
      packages/github-actions/fragments/github-actions.yaml:239-338 and
      docs/design/github-actions-standards.md:86. The ladder rests on
      docs/design/thresholds.md:22-23, :31 and :57. The actionable fail rests
      on a concrete fixture whose evidence has no run to open
      (portal/fixtures/github-actions.ndjson:2): raising demo/slow.yml to
      bronze from the evidence alone fails the same way.
  - criterion: actionable
    verdict: pass
    reason: >-
      The suggestion in
      portal/assessments/scorecard-quality/scorecard/toolbox/maintainer-ci-reliability.yaml
      targets the failing criterion directly. Listing the first-attempt URLs
      of runs that passed on a retry, from
      crates/toolbox-connector-github/src/runs.rs, in the three fail-rate
