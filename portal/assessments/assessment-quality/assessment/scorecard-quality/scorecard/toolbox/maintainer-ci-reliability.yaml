verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      portal/assessments/scorecard-quality/scorecard/toolbox/maintainer-ci-reliability.yaml
      says what its reason claims. The speed card is
      packages/github-actions/fragments/github-actions.yaml:365-397, its
      reason docs/design/thresholds.md:34; the description is :263-267, bronze
      :272-328, silver and gold :330-362, still-running :284-293, the fixes
      :305-312 and :342-346. minDecidedRuns defaults to 10
      (packages/github-actions/toolbox-package.yaml:37-39); passed_on_retry is
      crates/toolbox-connector-github/src/runs.rs:59-65 and failedRuns :84-89,
      failed runs only. demo/slow.yml has 40 and []
      (portal/fixtures/github-actions.ndjson:2). github-actions-standards.md
      :64, :89 and :161 match. Two nits: steady's gold assertions are
      portal/tests/standards.test.yaml:196-200, not 195-199, and
      thresholds.md:22-23 names only failures-visible as a prerequisite, not
      the streak or timeouts.
  - criterion: complete
    verdict: pass
    reason: >-
      I found no failure the sources show that the assessment missed. Bronze
      is reachable now: portal/results.json scores codeql, image, pages,
      scale-slo and version-packages at bronze. The fixtures reach gold, as
      the meta-scorecard facts confirm (fixtureLevels gold 1), though none
      sits at silver: meta-scorecard already fails fixtures-reach-every-level
      for this card in portal/results.json, which is a test gap, not a broken
      ladder. The gold fix
      (packages/github-actions/fragments/github-actions.yaml:359-362) sends an
      agent to the same empty failedRuns. The assessment names only the bronze
      and silver fixes, but its suggestion covers all three.
  - criterion: reproducible
    verdict: unsure
    reason: >-
      one-concern, levels-are-a-ladder and actionable rest on what the sources
      state. The actionable fail rests on
      portal/fixtures/github-actions.ndjson:2, and on a fix
      (packages/github-actions/fragments/github-actions.yaml:305-306) that
      says to open runs the evidence doesn't list. no-obvious-gap rests on
      taste. Its reason concedes that still-running reads only
      entity.runs.state (github-actions.yaml:287), while thresholds.md:33
      justifies the rule by stale history that "reads green". It then calls
      the gap "a refinement, not a missing standard", which no source says. If
      GitHub auto-disables only scheduled workflows (my recollection, not
      verified here), a push-triggered workflow that stopped running is never
      caught, and a second assessor could fail no-obvious-gap.
    suggestion: >-
      Ground the no-obvious-gap verdict in a source: either cite a tracked
      open item for lastRunAt staleness (e.g. add one to
      docs/design/github-actions-standards.md §7) and keep the pass, or mark
      no-obvious-gap unsure or fail, name the missing freshness rule, and cite
      GitHub's docs on which workflows it disables.
  - criterion: actionable
    verdict: pass
    reason: >-
      The suggestion in
      portal/assessments/scorecard-quality/scorecard/toolbox/maintainer-ci-reliability.yaml
      targets the failing criterion. Listing the URLs of runs that passed only
      on a re-run (passed_on_retry, already counted at
      crates/toolbox-connector-github/src/runs.rs:59-65 and :82) in the three
      fail-rate rules' evidence would give demo/slow.yml runs to open, and
      saying in the silver and gold fixes how a workflow under 10 decided runs
      rises closes the second case. Both would turn actionable to pass.
summary: >-
  A well-cited assessment: every line it points to says what it claims,
  except one test range one line early, and its actionable fail reproduces
  on demo/slow.yml with a suggestion that fixes it. Its no-obvious-gap
  pass waves off a gap it found itself, that still-running reads only
  GitHub's state, as a refinement, which rests on taste.
