      doc comment; the allow is :341 and fn change_run is :342, so "337
      against 341" is neither the doc start (:338) nor the fn.
    suggestion: >-
      Cite .github/workflows/ci.yml:24-25 for clippy and test. Cite
      portal/standards/crates.yaml:252 and :294, :264 and :307, :278 and :108
      for the ladder. Cite change.rs:341 for the allow and :338 against :342
