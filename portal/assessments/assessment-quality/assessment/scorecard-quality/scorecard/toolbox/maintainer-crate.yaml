      allow attributes. actionable fails because few-unwraps evidence is one
      count (portal/standards/crates.yaml:332-334) and "document the
      invariant" does not lower it. The off-by-one lines do not hide a third
      fail or make a pass wrong.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The ladder numbers in portal/standards/crates.yaml:252-317, the lint
      inheritance and the count-only evidence are in the files. A second
      assessor fails no-obvious-gap and actionable and passes the other two
      without deciding how many allows are too many.
  - criterion: actionable
    verdict: pass
    reason: >-
      An inherits-workspace-lints rule and a suppressions-explained rule would
