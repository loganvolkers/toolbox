  - criterion: complete
    verdict: pass
    reason: >-
      one-concern and levels-are-a-ladder pass on the text that is there: one
      maintainer question (portal/standards/crates.yaml:148-154), the same
      facts tightened from 80 to 100, 150 to 80 and 30 to 15, and gold
