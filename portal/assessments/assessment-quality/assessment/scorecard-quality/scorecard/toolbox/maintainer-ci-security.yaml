  - criterion: actionable
    verdict: pass
    reason: >-
      The suggestions in
      portal/assessments/scorecard-quality/scorecard/toolbox/maintainer-ci-security.yaml
      move actionlint-clean to the reliability card, and add a networked
      zizmor rule plus pin checks for images and top-level write scopes. Each
      closes the gap it is attached to. The two passes need no suggestion.
summary: >-
  The assessment holds. actionlint-clean makes syntax part of the security
  level, and the offline uses:-only checks miss known-vulnerable actions,
  container image pins and a top-level write-all token. The ladder and the
  fixtures are otherwise what the manifest and the results say.
