      portal/tests/standards.test.yaml:124-131 and :149-154.
      thresholds.md:19-21 is the killer-item principle the silver token rule
      sits above.
  - criterion: complete
    verdict: pass
    reason: >-
      one-concern fails because a syntax error drops a workflow below security
      bronze. levels-are-a-ladder passes: bronze is the direct routes, silver
      the medium findings and risky write tokens, gold the rest of zizmor, and
      gold is not implied by the lower zizmor rules. no-obvious-gap fails on
