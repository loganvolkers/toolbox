verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Most citations in
      portal/assessments/scorecard-quality/scorecard/seikika/maintainer-plugin.yaml
      hold. In portal/standards/plugins.yaml, 90-173 is the rules, 63 leaves
      skills to maintainer-skill and 86 is `track: operator`.
      portal/README.md:33 says "1. Maintainer", and
      portal/campaigns.yaml:36-41 is the operator track. In
      crates/seikika-connector-workspace/src/plugins.rs, 73-108 reads no
      `cwd`, `url`, `type` or `env`, and 114 rejects `..` in a command. Spec
      §4.1, §7.2.1 and §9.2
      (https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md)
      say what is claimed. docs/design/agent-plugins.md:18 and :200 promise
      schema validation. Two citations don't hold. The gold principle is
      docs/design/thresholds.md:24-25, not 23-24. And no-secret-headers'
      shapes are not all "already" caught by bronze. The header check parses
      the value (plugins.rs:96-99), while bronze scans raw text
      (hygiene.rs:110-111), so a `\u`-escaped header token fails only the gold
      rule.
    suggestion: >-
      Cite thresholds.md:24-25 and qualify the overlap claim. The ladder
      verdict still holds on paths-stay-inside and thresholds.md:35.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts are right. One concern: every rule is a 1.0.0 conformance
      check of one package, and the track field is explained. The ladder fails
      because gold mostly restates lower levels. The gaps (`cwd`, remote
      `url`, server `type`, `env` secrets) are spec MUSTs that
      plugins.rs:73-108 never reads. The actionable pass was traced on the
      partial fixture.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each fail is grounded in a source: thresholds.md's gold principle, and
      the §7.2.1 MUSTs set against the fields plugins.rs reads. A second
      assessor would reach the same pass, fail, fail, pass.
  - criterion: actionable
    verdict: pass
    reason: >-
      Folding no-secret-headers into bronze, moving `cwd` containment to
      silver and giving gold full schema validation re-levels the ladder.
      Schema validation plus `cwd` and HTTPS rules covers the named gaps. Each
      suggestion targets its own verdict.
summary: >-
  Solid: the gaps it names are real spec MUSTs the connector never reads,
  and gold adds little over bronze and silver. It fails `supported` on two
  details: thresholds.md:23-24 should be 24-25, and the claim that bronze
  already catches every header shape ignores JSON escapes, which only the
  header check decodes.
