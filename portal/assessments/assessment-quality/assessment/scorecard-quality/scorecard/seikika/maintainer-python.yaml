summary: >-
  The maintainer-python assessment is right about the shape of the card
  and about ruff's defaults leaving shell=True and urlopen unchecked. It
  fails supported because the SARIF rule text is fragments/sarif.yaml, not
  lines past the end of seikika-package.yaml, and the maintained trees
  have three urlopen calls, not six.
