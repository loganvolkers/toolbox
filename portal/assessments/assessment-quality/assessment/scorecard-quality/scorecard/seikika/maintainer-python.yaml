      lines; the clean level, ratchet, evidence and fix are
      packages/sarif/fragments/sarif.yaml:67-79. The urlopen count is wrong:
      those two directories contain three urlopen calls, at
      examples/acme-live/deploy/facade.py:31,
      examples/acme-live/deploy/scim_seed.py:36 and
      examples/reference-portal/tools/scim_feed.py:15, not six.
    suggestion: >-
      Cite packages/sarif/fragments/sarif.yaml:67-79 for the clean level, the
      ratchet and the evidence format. Recount urlopen as the three calls
      above, or list six sites if a ruff run really reports six.
  - criterion: complete
    verdict: pass
    reason: >-
      one-concern, the single clean rung and actionable all match the SARIF
      slot and the fixture. no-obvious-gap still fails on the sources that do
