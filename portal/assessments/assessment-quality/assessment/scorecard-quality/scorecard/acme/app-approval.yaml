at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/scorecard-quality/scorecard/acme/app-approval.yaml
      hold. In examples/reference-portal/toolbox.yaml, `levels` and
      `appliesTo` are at 266-267, the rationale at 258-261, the fix at
      272-274, and `steward` and `reviewed` at 18-19 and 29-30.
      docs/examples/approved-github-apps.md:64 names "grant expiry and review
      cadence", and :100-101 keeps administration and repository_creation out
      of self-service. tests/apps.test.yaml pins renovate bronze and
      snyk-security none. fixtures/github.ndjson:11 shows the `administration:
      read` an agent would have to find by diffing.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts are right. A single-rule, single-level card for security
      passes one-concern and levels-are-a-ladder. no-obvious-gap fails, since
      the policy stores `reviewed` dates that no rule reads
      (toolbox.yaml:18-19, 29-30). The design calls cadence optional (:64),
      but the sensitive-permission rule stands on its own (:100-101).
      actionable fails because the only rule has no evidence and no named
      place (toolbox.yaml:269-274).
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on manifest lines and design text a second assessor
      can read. The only judgement, whether an optional cadence is an
      "obvious" gap, is backed by the second, non-optional gap at design
      :100-101.
  - criterion: actionable
    verdict: pass
    reason: >-
      Evidence naming the changed permissions plus a fix naming
      `policies.approvedApps.<slug>.permissions` flips actionable.
      `no-sensitive-permissions` and a review-age rule fill the gaps. The
      example CEL can't run as written: the expression environment has no
      `now` (rg finds none in crates/toolbox-expr or crates/toolbox-derive),
      and `reviewed` is a bare YAML date. A review-age rule needs a computed
      fact (e.g. review age in days) instead.
summary: >-
  An accurate assessment. Every citation holds, both fails follow from the
  manifest and the design, and the snyk-security fixture confirms what an
  agent would have to find by hand. The review-cadence example CEL uses
  `now`, which the CEL environment doesn't provide. The rule idea still
  holds.
