apiVersion: seikika.com/assessment/v1
entity: assessment:rule-quality/rule:seikika/maintainer-plugin/no-hardcoded-secrets
rubric: assessment-quality
subjectHash: ede6b588732b
assessor: {kind: agent, name: cursor-reviewer-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/seikika/maintainer-plugin/no-hardcoded-secrets.yaml
      hold. crates/seikika-connector-workspace/src/plugins.rs:29-34 and
      178-184 pass both files to hygiene.rs, whose patterns are lines 16-27,
      and hygiene.rs:5-7 calls them "the floor, not the scanner". Spec §7.2.1
      and §9.2
      (https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md)
      forbid secrets in `headers` and `env`.
      portal/tests/standards.test.yaml:709-710 pins 'mcp.json:6
      aws-access-key'. portal/standards/plugins.yaml:165-170 is the evidence,
      fix and rationale. docs/design/thresholds.md:35 puts credential rules at
      bronze, and docs/design/plugin-standards.md:50 still shows gold.
  - criterion: complete
    verdict: fail
    reason: >-
      hard-to-game should fail. "JSON offers no concatenation" misses JSON's
      `\u` escapes. The scan runs over raw text lines (hygiene.rs:74-79,
      110-111), not parsed values. An env value written as
      `"\u0041KIAIOSFODNN7EXAMPLE"` is the same key once parsed, but the AWS
      pattern (hygiene.rs:17) does not match the raw line. I checked both
      forms with that regex: the raw line doesn't match and the parsed value
      does. That keeps the credential working and clears the evidence, the
      suppression case in the rubric's guidance
      (portal/standards/meta.yaml:1164-1166). Only plugin.json and mcp.json
      are scanned (plugins.rs:29-32), so moving the key into a bundled file
      the server reads also clears it, though the key still ships.
    suggestion: >-
      Fail hard-to-game on the escape route. Suggest scanning parsed JSON
      string values as well as raw lines, as `mcp_facts` already does for
      headers (plugins.rs:96-100), and scanning every file in the plugin
      directory.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The verdicts it gives rest on code (plugins.rs:29-34, hygiene.rs:16-27)
      and spec text, not taste. The missed hard-to-game route is a fact about
      the scanner, recorded under complete.
  - criterion: actionable
    verdict: pass
    reason: >-
      A literal-value check on env keys and header names matching
      `(key|token|secret|password|auth)` would flag both cases the
      measures-intent reason names: a hex `API_KEY` and a Bearer
      `Authorization` header. That flips the verdict.
summary: >-
  Citations and the measures-intent fail hold: shape matching misses the
  opaque tokens plugins actually carry in `env` and `headers`. But
  hard-to-game should not pass. The scan reads raw text, so a JSON `\u`
  escape hides a matched key without removing it, and files other than the
  two JSON manifests are never read.
