entity: assessment:rule-quality/rule:seikika/maintainer-plugin/stdio-command
rubric: assessment-quality
subjectHash: af920648c1a1
assessor: {kind: agent, name: cursor-reviewer-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Most citations in
      portal/assessments/rule-quality/rule/seikika/maintainer-plugin/stdio-command.yaml
      hold. crates/seikika-connector-workspace/src/plugins.rs:110-115 accepts
      `${PLUGIN_ROOT}/…`, `${PLUGIN_DATA}/…` and `bin/tool`, and 81-84 reads
      only `command`. The spec §7.2.1 quotes ("bare executable name or a
      plugin-relative path beginning with `./`", no placeholder expansion in
      `command`) are verbatim
      (https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md).
      portal/standards/plugins.yaml:132, 133-134 and 136-139 are the evidence,
      fix and rationale. D81 and docs/design/plugin-standards.md:47 set
      silver. One claim doesn't hold. docs/design/agent-plugins.md:22 does not
      have "the same misreading". It says the command is "a single token, bare
      or `./…`", which matches the spec. The docs that accept
      `${PLUGIN_ROOT}/` are plugin-standards.md:47 and the field description
      at plugins.yaml:33.
    suggestion: >-
      Point the misreading, and the correction in the suggestion, at
      plugin-standards.md:47 and plugins.yaml:33 instead of
      agent-plugins.md:22.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts are right. measures-intent fails on the looser grammar
      (plugins.rs:113). hard-to-game fails because `sh` with `-c` in `args`
      passes (plugins.rs:81-84). fix-leads-to-pass passes, because both of the
      fix's examples satisfy the check, even though one breaks the spec.
      threshold-justified passes on D81.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Both fails follow from the regex at plugins.rs:113 and the fields read
      at plugins.rs:81-84, set against spec §7.2.1's wording.
  - criterion: actionable
    verdict: pass
    reason: >-
      Restricting the token to a bare name or `./…` flips measures-intent, and
      flagging shells run with `-c` flips hard-to-game. The doc correction
      names the wrong file, but that doesn't affect either verdict.
summary: >-
  Correct and well sourced: the token regex is looser than spec §7.2.1,
  the fix recommends a form the spec forbids, and `sh -c` in `args`
  passes. It fails `supported` on one claim: agent-plugins.md:22 states
  the spec's grammar correctly. The misreading is in
  plugin-standards.md:47 and plugins.yaml:33.
