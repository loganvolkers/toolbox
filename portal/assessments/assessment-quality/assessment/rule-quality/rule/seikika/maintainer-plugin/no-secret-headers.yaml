apiVersion: seikika.com/assessment/v1
entity: assessment:rule-quality/rule:seikika/maintainer-plugin/no-secret-headers
rubric: assessment-quality
subjectHash: 96a42f63f07c
assessor: {kind: agent, name: cursor-reviewer-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Most citations in
      portal/assessments/rule-quality/rule/seikika/maintainer-plugin/no-secret-headers.yaml
      hold. crates/seikika-connector-workspace/src/plugins.rs:174-176 knows
      two shapes, and `mcp_facts` never reads `env` (plugins.rs:80-103). Spec
      §7.2.1 forbids credentials in headers and expands no header value, and
      §9.2 does the same for `env`
      (https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md).
      portal/tests/standards.test.yaml:704-706 pins the evidence. Two
      citations don't hold. The "Gold asks for what lower levels don't already
      imply" principle is docs/design/thresholds.md:24-25, and line 23 belongs
      to the prerequisite principle. The subset claim, that a plugin failing
      this rule has "bar word-boundary edge cases, already failed bronze",
      misses JSON escapes. This rule tests the parsed header value
      (plugins.rs:96-99), while bronze scans raw text (hygiene.rs:110-111), so
      `"Authorization": "\u0041KIA…"` fails here and passes bronze.
    suggestion: >-
      Cite thresholds.md:24-25, and qualify the subset claim: escaped values
      are caught only by this rule. The verdict still stands on
      thresholds.md:35.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts are right. measures-intent fails on two shapes and no
      `env`. threshold-justified fails because thresholds.md:35 puts
      credential rules in the floor. hard-to-game passes, though for a
      different reason than the one given. Under spec §7.2.1's closed
      variants, `headers` belongs to HTTP servers and `env`/`args` to stdio
      ones, so moving a header's value out of `headers` breaks the server.
      Escaping it in place doesn't help, because this check parses the value
      (plugins.rs:96-99).
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on plugins.rs:96-103, 174-176 and on
      thresholds.md:35, which states the floor for credential rules. That is a
      source, not taste.
  - criterion: actionable
    verdict: pass
    reason: >-
      A name-based check (Authorization, Cookie, `api-key`-like headers and
      secret-named `env` keys) catches the Bearer and API-key cases behind
      measures-intent. Moving the rule to bronze after widening matches
      thresholds.md:35 and flips threshold-justified.
summary: >-
  The conclusions hold: two value shapes are a weak test of the spec's "no
  secrets in headers", and a credential rule belongs at bronze per
  thresholds.md:35. It fails `supported` on thresholds.md:23-24 (the
  principle is at 24-25), and on a subset claim that escaped header values
  disprove.
