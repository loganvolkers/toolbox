verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/seikika/meta-assessment/cites-everything.yaml
      hold. In crates/seikika-connect/src/assessment.rs, `uncited` is 202, the
      URL regex 29-33 returns true at 34-35 before any lookup, the repository
      branch is 43-45, `known_id` is 124-149 and the doc comment is 10-14. In
      portal/standards/assessments.yaml, the rule is 204-215, evidence 207,
      fix 208-211, rationale 212-215 and `supported` 321-325.
      docs/design/thresholds.md:24-25 is the gold principle, and
      docs/design/scorecards-for-scorecards.md:295 and D80 name "cited
      everything". portal/results.json lists
      assessment:sdlc-stage-quality/sdlc-stage:operator/monitor as the only
      meta-assessment entity below gold, with two cites-everything items.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts match the sources. `https://example.com` matches the URL
      regex at assessment.rs:31, so a cheap route to gold exists, and
      hard-to-game is a fail. The fix names every form `cites` accepts
      (assessments.yaml:208-211, assessment.rs:10-14), so fix-leads-to-pass
      passes. The two uncited reasons in
      portal/assessments/sdlc-stage-quality/sdlc-stage/operator/monitor.yaml
      (reuses-artifacts and decoupled-from-core) name no path, and adding one
      would clear them.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Any second assessor reading assessment.rs:29-46 finds a zero-cost
      citation that passes the check, so hard-to-game fails whichever route
      they name. The other three verdicts rest on line-cited code and on D80.
  - criterion: actionable
    verdict: fail
    reason: >-
      The hard-to-game suggestion in
      portal/assessments/rule-quality/rule/seikika/meta-assessment/cites-everything.yaml
      closes only the URL branch. The reason itself says that citing an
      unrelated existing path also passes. Appending `docs/plan.md` to each
      reason costs the same as appending `https://example.com`: it resolves at
      assessment.rs:61-67 and has no bearing on the verdict. The reason waves
      that route off as "a false statement a review can catch", but a
      placeholder URL is just as visible in review. With the suggestion in
      place, the cheapest way to pass is still a citation that says nothing,
      so hard-to-game would still fail.
    suggestion: >-
      Either make the suggestion close both routes, or pass hard-to-game and
      say why review is the accepted backstop. To close both, require each
      reason to cite the judged entity's own definition, or a file that
      defines it, as review-assessment's `groundedIn` does for reviews
      (portal/standards/assessments.yaml:97-104;
      crates/seikika-connect/src/assessment.rs:253-271). For the backstop,
      cite docs/design/thresholds.md:63-70, which already accepts such false
      statements for assessor names.
summary: >-
  The citations and the three passes are sound, and the URL route is real.
  The suggestion leaves an equally cheap route open: an unrelated existing
  path. The assessment noted that route but dismissed it on grounds that
  apply just as well to the URL, so following the suggestion wouldn't turn
  hard-to-game to pass.
