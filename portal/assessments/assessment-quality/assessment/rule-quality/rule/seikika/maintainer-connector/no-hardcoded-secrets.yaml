verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The hard-to-game reason in
      portal/assessments/rule-quality/rule/seikika/maintainer-connector/no-hardcoded-secrets.yaml
      says that `concat!("gh", "p_…")` leaves secretHits empty, because
      split_prefix (hygiene.rs:42-51) only matches an exact prefix and "the
      whole-token pattern never sees the joined string". The code says
      otherwise. crates/seikika-connector-workspace/src/hygiene.rs:88-103
      joins a line's string literals and runs patterns() and split_prefix on
      the result. The test at hygiene.rs:189-197 asserts that exactly
      `concat!("gh", "<token>")` is reported as split-token-prefix. That logic
      landed in 781adf9, a day before this assessment. The other citations
      hold: connectors.rs:210-232 (data files scanned) and 234-262 (cfg(test)
      covers the next item), hygiene.rs:13-33 (no `AIza` and no bare `sk-`
      shape; line 20 needs ant/proj/live), hygiene.rs:5-7, and
      portal/standards/connectors.yaml:178-180 and 186. So does
      docs/design/thresholds.md:35.
    suggestion: >-
      Re-judge hard-to-game against hygiene.rs:88-103. Name a route it misses,
      such as a token split across lines inside `concat!(\n "gh",\n "p_…"\n)`,
      which is checked one line at a time (hygiene.rs:74).
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts are right even though one reason is not. secrets_in_lines
      checks each line on its own (hygiene.rs:74-104), so a prefix split
      across lines, or across two `const`s, still passes. That keeps
      hard-to-game a fail. measures-intent fails correctly on the shapes
      missing from hygiene.rs:16-27. fix-leads-to-pass is right: the evidence
      is `path:line kind` (hygiene.rs:82, 102), and connectors.yaml:178-180
      says where tokens go. threshold-justified is right per thresholds.md:35.
  - criterion: reproducible
    verdict: pass
    reason: >-
      A second assessor would reach the same four verdicts from
      hygiene.rs:13-33, 74-104 and connectors.yaml:174-187. They would just
      cite the multi-line split for hard-to-game instead of the one-line
      `concat!` that hygiene.rs:191 shows is caught.
  - criterion: actionable
    verdict: fail
    reason: >-
      The measures-intent suggestion would add the missing shapes to
      hygiene.rs:16-27 and turn that verdict. The hard-to-game suggestion asks
      to flag adjacent literals in `concat!` or `+` and to add the
      `concat!("gh", ...)` test. Both already exist (hygiene.rs:88-103,
      189-197), so following it changes nothing, and the multi-line route
      keeps the verdict a fail.
    suggestion: >-
      Suggest joining the literals of a whole `concat!(...)` expression, or of
      consecutive lines, before matching, with a multi-line fixture in
      hygiene.rs tests. Or carry a scanner over the built binary through the
      SARIF slot, as hygiene.rs:5-7 suggests.
summary: >-
