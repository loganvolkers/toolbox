verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      portal/assessments/rule-quality/rule/seikika/review-crate/assessed.yaml
      lands. portal/standards/crates.yaml has the `hash` field at 51-55,
      reviewState at 56-62, the advisory ratchet at 372, the fix at 394-397
      and the rationale at 398-401. In
      crates/seikika-connector-workspace/src/rust.rs, `rust_files` keeps only
      `.rs` files (364-373) and `source_hash` chains it over src/ and tests/
      (395-400). The `include_str!` sites are at
      crates/seikika-store/src/pg.rs:12-14,
      crates/seikika-cli/src/report.rs:1401-1402 and
      crates/seikika-cli/src/find.rs:19, and tests/cases.json is pulled in by
      crates/seikika-model/tests/reference.rs:69. The schema's `minLength: 10`
      is at schema/assessment.schema.json:36. The CI step is at
      .github/workflows/ci.yml:95-98, and the stale exit at
      crates/seikika-cli/src/assess.rs:134-142. One small imprecision:
      crates/seikika-api/src/assess.rs:137-168 also rejects an unknown rubric
      or criterion, not "only" a missing verdict. That leaves the gaming route
      unchanged.
  - criterion: complete
    verdict: pass
    reason: >-
      Both fails match the rule-quality guidance
      (portal/standards/meta.yaml:1159-1166). The migrations sit outside src/
      (crates/seikika-store/migrations/), so they test intent rather than the
      field's wording. But report.html, seikika-report.js and
      tool-catalog.yaml sit under src/ and are not hashed, so a
      behaviour-changing edit leaves the review fresh. fix-leads-to-pass and
      threshold-justified are right: the review-* row at
      docs/design/thresholds.md:55 and C1 at
      docs/design/meta-standards-review.md:136 state silver.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on code a second assessor can read: the extension
      filter at crates/seikika-connector-workspace/src/rust.rs:368 and the
      schema's single length constraint (schema/assessment.schema.json:36).
      Neither fail depends on taste.
  - criterion: actionable
    verdict: unsure
    reason: >-
      The measures-intent suggestion (hash every file under src/ and tests/
      plus `include_str!` targets) would close the cited gap. The hard-to-game
      suggestion adds `reviewCitesCrate`, which requires one cited path under
      the crate. The named route, "Reviewed it, fine.", then fails. "Reviewed
      crates/<name>/src/lib.rs, fine." still passes, though. The same assessor
      counts a single grounding citation as a cheap route when it fails
      independently-reviewed
      (portal/assessments/rule-quality/rule/seikika/review-crate/independently-reviewed.yaml:29-36).
    suggestion: >-
      Make the hard-to-game suggestion require more than one token citation.
      For example, require that each crate-design criterion's reason cites a
      file under the crate's `path` (per-criterion `cited`, from
      crates/seikika-connect/src/assessment.rs:220-228). Or argue why one
      citation is enough at silver.
summary: >-
  Trustworthy. Every citation checks out, and both fails are real:
  non-Rust files under src/ are not in the crate hash, and a schema-valid
  all-pass file reaches silver. The one doubt is whether the hard-to-game
  suggestion would flip its verdict, because one cited crate path is the
  kind of single-citation bar the same assessor calls cheap elsewhere.
