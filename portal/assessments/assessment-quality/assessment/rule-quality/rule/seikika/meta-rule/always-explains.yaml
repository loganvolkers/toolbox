    reason: >-
      Every citation in
      portal/assessments/rule-quality/rule/seikika/meta-rule/always-explains.yaml
      holds. hasEvidence is `r.evidence.is_some()`
      (crates/seikika-cli/src/meta.rs:256). The rule is meta.yaml:512-521,
      evidence-tracks-check starts at 524, and evidenceTracksCheck is 131-142
      with `entity.hasEvidence` at 139. `entity.name` counts as an evidence
      field because analysis.rs:80-84 records every `entity.<field>` select.
      thresholds.md:22-23 and :46, and scorecards-for-scorecards.md:82 and
      :104, say what is claimed. has-help and only-approved-apps have
      hasEvidence false (portal/fixtures/surfaces.ndjson lines 14 and 16). The
      test block is standards.test.yaml:279-284, one line off from the cited
      278-284. results.json shows exactly the six acme rules failing.
  - criterion: complete
    verdict: pass
    reason: >-
      The four verdicts match the sources. The check is presence only
      (meta.yaml:514), so measures-intent passes against a fix that asks only
      for `evidence:` (meta.yaml:516). A constant `['failed']` is the "empty
      doc comment" route the rubric names (meta.yaml:1164-1165), so
      hard-to-game is a correct fail. No number is involved, so
      threshold-justified rests on the prerequisite principle.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on code (meta.rs:256, meta.yaml:139-142) and on a
      gaming route anyone can write in one line. No verdict depends on taste.
  - criterion: actionable
