entity: assessment:rule-quality/rule:seikika/meta-rule/evidence-tracks-check
rubric: assessment-quality
subjectHash: 24bd49823848
assessor: {kind: agent, name: cursor-reviewer-36, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/seikika/meta-rule/evidence-tracks-check.yaml
      match. evidenceTracksCheck is true when evidence.fields is non-empty,
      whatever the field (portal/standards/meta.yaml:138-142).
      rule:demo/sprawling/hides-the-list checks gaps.size() == 0 with evidence
      ['has gaps'] and empty evidence fields
      (portal/fixtures/surfaces.ndjson). has-skill checks documentedIn and its
      evidence reads only name (portal/standards/cli.yaml:237-238). The rule's
      evidence quotes nodes and loops and the fix says to build evidence from
      what the check reads (meta.yaml:526-533). thresholds.md:46 states gold,
      the 8-node allowance, the 68-of-219 measurement and lessons L1 and L2.
      portal/results.json fails the rule on exactly six rules, all acme. The
      fixture pins both outcomes at
      portal/tests/standards.test.yaml:1326-1332.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent and hard-to-game fail because any evidence field,
      including name, satisfies meta.yaml:138-139 and bypasses the size() == 0
      guard on the same expression. fix-leads-to-pass is right: evidence built
      from the check's field reads a field the computed expression accepts.
      The gold bar and the 8-node allowance are the measured row at
      thresholds.md:46.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The computed expression is one boolean (meta.yaml:138-142). Rewriting
      ['has gaps'] as [entity.name + ' has gaps'] makes evidence.fields
      non-empty. A second assessor gets the same two fails from that
      expression and the has-skill evidence at cli.yaml:238.
  - criterion: actionable
    verdict: pass
    reason: >-
      The suggestion in
      portal/assessments/rule-quality/rule/seikika/meta-rule/evidence-tracks-check.yaml
      counts an evidence field only when the check also reads it, or the
      evidence loops, and it excludes name. That removes the entity.name
      bypass both fails describe. The two passes need no suggestion.
summary: >-
  The fix and the measured gold placement are right. The computed field is
  looser than the rationale: evidence that reads any field, including
  name, counts as tracking the check, so appending entity.name defeats the
  size() == 0 guard. Live, six acme rules fail it, and the fixtures pin
  both outcomes.
