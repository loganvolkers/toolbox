    suggestion: >-
      Attach a hard-to-game suggestion that changes this rule's own check. For
      example, count as unsure any criterion that a later assessment at the
      same subjectHash, by the same assessor, turned from `unsure` to `pass`.
summary: >-
  Trustworthy. The citations hold, both fails are real, and the strongest
  finding is that a doc edit leaves the hash and the fresh unsure in
