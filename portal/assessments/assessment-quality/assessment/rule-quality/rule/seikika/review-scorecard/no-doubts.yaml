      portal/tests/standards.test.yaml:910-913,
      plugins/seikika-operator/skills/assess-entity/SKILL.md:23-24,
      crates/seikika-cli/src/assess.rs:134-142, crates.yaml:424-428 and
      docs/design/thresholds.md:55 say what is claimed. The scorecard hash
      covers description and rationale (crates/seikika-cli/src/meta.rs:249),
      so the claim that a thresholds.md edit leaves the review fresh is right.
  - criterion: complete
    verdict: pass
    reason: >-
      hard-to-game fails correctly: rewriting `unsure` as `pass` passes the
      check (meta.yaml:1061), and nothing else at gold reads who wrote it.
      fix-leads-to-pass fails correctly. The fix names no file, command or
      re-assessment (meta.yaml:1065-1067), and the link points outside the
      hashed scorecard. measures-intent and threshold-justified are right.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Both fails follow from the rule text and the hash (meta.yaml:1059-1073,
      meta.rs:249). The contrast with review-crate is read from
      crates.yaml:433-436, not from taste.
  - criterion: actionable
    verdict: unsure
    reason: >-
      The fix-leads-to-pass suggestion names the assessment file, the YAML
      fields and the brief command, so following it makes the rule passable.
      The hard-to-game suggestion adds a sibling gold rule,
      independently-reviewed, and leaves this rule's check (meta.yaml:1061)
