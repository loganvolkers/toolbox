verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Four of the fragment citations in
      portal/assessments/rule-quality/rule/seikika/maintainer-openssf/ten.yaml
      point past the end of the file:
      packages/openssf-scorecard/fragments/openssf-scorecard.yaml is 117 lines
      long. The rule `ten` is 91-102 (cited 138-149). The null-score comment
      is 93 (cited 140-141), the evidence 97-99 (cited 144-146) and `tracked:
      true` line 15 with the header at 1-4 (cited 48-62). The claims
      themselves are true. The other sources land: scorecard.rs:12-40,
      .clusterfuzzlite/build.sh:6-17 (a no-op), and no workflow under
      .github/workflows mentions fuzzing. portal/results.json has Fuzzing at
      `ten`. Also landing: openssf-template.md:28-32, 80 and 83-88,
      portal/seikika.yaml:366-367, the fixture's line 1, and the package tests
      at 7-14.
    suggestion: >-
      Correct the fragment ranges to 91-102 (rule), 93 (null), 97-99
      (evidence) and 15 (tracked).
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts match the sources. The rule carries Scorecard verbatim, so
      measures-intent passes. The presence-only Fuzzing 10 from a no-op target
      shows a cheap pass, so hard-to-game fails. Warn lines plus docs make
      fix-leads-to-pass pass, and threshold-justified passes on
      D01M82E93XAPNE0WFXEPJZ59WG4.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The hard-to-game fail rests on files anyone can read:
      .clusterfuzzlite/build.sh and portal/results.json, plus the absence of a
      CFLite workflow.
  - criterion: actionable
    verdict: fail
    reason: >-
      None of the hard-to-game suggestions changes this rule's verdict.
      Fuzzing something real, or waiving Fuzzing, changes the repository's
      score, not whether a no-op target can still pass `ten`. A local rule
      "beside the carried check" is another rule. The rubric fails exactly
      this case (portal/standards/assessments.yaml:345-346). Under
      D01M82E93XAPNE0WFXEPJZ59WG4 the check can't be reinterpreted, so the
      assessment should say what, if anything, could flip it.
    suggestion: >-
      State that a carried check's gameability can only change through
      Scorecard itself, for example an upstream issue asking Fuzzing to verify
      that a target runs. Or say that under the carry decision the fail is
      accepted and the local rule is the mitigation, not a fix to this
      verdict.
summary: >-
  The judgement is sound: a clean carry, gamed in this repository by a
  no-op fuzz target that Scorecard credits for presence. But four
  citations into the 117-line OpenSSF fragment point past its end. The
  hard-to-game suggestions improve the repository and add other rules
  without changing this rule's verdict.
