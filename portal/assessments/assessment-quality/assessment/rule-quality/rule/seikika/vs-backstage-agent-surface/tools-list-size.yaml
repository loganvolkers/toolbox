entity: assessment:rule-quality/rule:seikika/vs-backstage-agent-surface/tools-list-size
rubric: assessment-quality
subjectHash: 2f1562b51db4
assessor: {kind: agent, name: cursor-reviewer-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/seikika/vs-backstage-agent-surface/tools-list-size.yaml
      hold:
      - surface.py:166-167 serialises `tools` compactly, :189 counts its
        bytes, and :185-188 record the tool count and names.
      - RESEARCH.md:276 asks for o200k tokens.
      - results/r3/surface-seikika.json lists 14 tools. builtin_tools() in
        mcp.rs:20-98 now lists 17, the extra three being run_action,
        get_run and list_runs.
      - `tools/list` returns builtin_tools() (mcp.rs:1023).
      - The bar is README.md:52 and ADJUDICATION.md:113.
      - 6,473 B and 20,500 B are in portal/comparisons.
  - criterion: complete
    verdict: fail
    reason: >-
      hard-to-game should fail, for the same reason the same assessor failed
      it on get-entity-size: only bytes are rewarded. Emptying descriptions or
      dropping inputSchema in mcp.rs:20-98 shrinks the count and hurts agents.
      That is the rubric's "empty doc comment" route
      (portal/standards/meta.yaml:1165-1166). The reason's safeguard, that
      tool count and names are recorded (surface.py:185-188), doesn't cover
      it. Empty descriptions keep the names, and snapshot.py:29-30 carries
      neither field into the record the rule reads.
    suggestion: >-
      Fail hard-to-game. Suggest feeding a quality floor into the record, for
      example the share of tools with a non-empty description and an
      inputSchema (RESEARCH.md:277, F13(b)), and checking it beside the bytes.
  - criterion: reproducible
    verdict: unsure
    reason: >-
      A second assessor could reach either verdict on hard-to-game. Its pass
      here rests on judging tool deletion an obvious regression, while
      get-entity-size failed the same size-only structure. That makes the
      verdict depend on taste, not on what surface.py checks.
    suggestion: >-
      Judge hard-to-game on what the record checks (surface.py, snapshot.py),
      as get-entity-size does, not on whether a gamed result would look bad in
      raw output.
  - criterion: actionable
    verdict: pass
    reason: >-
      The assessment has no fail or unsure verdicts
      (portal/assessments/rule-quality/rule/seikika/vs-backstage-agent-surface/tools-list-size.yaml),
      so no suggestion is owed.
summary: >-
  The citations are accurate, and the note that the record predates three
  action tools is useful. But hard-to-game passes on a rule that rewards
  bytes alone, so emptied descriptions or schemas would pass it. The same
  assessor failed the same weakness on get-entity-size.
