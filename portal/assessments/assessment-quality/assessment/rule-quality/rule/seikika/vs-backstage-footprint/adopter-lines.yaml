at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The starter counts in
      portal/assessments/rule-quality/rule/seikika/vs-backstage-footprint/adopter-lines.yaml
      hold. owned() is experiments/backstage-compare/footprint.py:44-54, the
      Seikika call skips tests and fixtures at :154, lines are raw at :53, and
      the rule's rationale and fix are
      portal/standards/backstage-comparison.yaml:429-435.
      examples/repo-portal-starter/README.md is 95 lines and
      tests/standards.test.yaml plus fixtures/workspace.ndjson are 39 + 5. The
      bar is "—" at experiments/backstage-compare/README.md:43, and
      experiments/backstage-compare/RESULTS.md:261-265 lists 500 among bars
      written after the smoke rounds.
      experiments/backstage-compare/RESEARCH.md:58 is a comparative bar. Two
      claims do not. experiments/backstage-compare/footprint.py:157 is
      owned(BS_SRC), which counts lines of CODE suffixes
      (experiments/backstage-compare/footprint.py:36) and skips node_modules,
      .git, dist and yarn.lock; it does not count every line of the tree, and
      it does not state 1,357 (that figure is
      experiments/backstage-compare/RESULTS.md:187).
      examples/repo-portal-starter/README.md:4-5 says to copy seikika.yaml and
      add the report action, not only seikika.yaml.
    suggestion: >-
      Cite experiments/backstage-compare/RESULTS.md:187 for 1,357, and say
      Backstage's count is owned() with the default skip, so tests and
      fixtures are included and node_modules is not. Quote
      examples/repo-portal-starter/README.md:4-5 as copy seikika.yaml and add
      the report action.
  - criterion: complete
    verdict: pass
    reason: >-
      The three fails and the pass are right. The number includes README prose
      and excludes the 44 lines the adopter keeps under tests and fixtures
      (experiments/backstage-compare/footprint.py:154), directory skips and
      raw lines are cheaper than moving rules into a package, the fix names
      that move (portal/standards/backstage-comparison.yaml:430-431), and 500
      was not the pre-registered bar
      (experiments/backstage-compare/README.md:43,
      experiments/backstage-compare/RESULTS.md:261-265). The loose Backstage
      sentence does not hide another criterion.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The file sets and the post-hoc bar are in the sources. A second assessor
      fails measures-intent, hard-to-game and threshold-justified from
      experiments/backstage-compare/footprint.py:44-54 and :154 and
      experiments/backstage-compare/RESULTS.md:261-265, without deciding
      whether 500 is a reasonable round number.
  - criterion: actionable
    verdict: pass
    reason: >-
      Counting the files the README tells the adopter to keep, after yamark
      format or as YAML nodes, would remove both the README inflation and the
      tests/fixtures skip, which is what measures-intent and hard-to-game fail
      on. Justifying 500 in docs/design/thresholds.md, or dropping the
      absolute bar, is what would pass threshold-justified.
summary: >-
  The wrong file set and the after-the-fact bar of 500 are real. The
  Backstage aside overstates
  experiments/backstage-compare/footprint.py:157, which does not count
  every line and does not contain 1,357, and the starter README also asks
  for the report action. The verdicts survive those two sentences.
