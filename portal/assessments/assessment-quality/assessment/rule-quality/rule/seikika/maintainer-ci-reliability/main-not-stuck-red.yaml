verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The threshold-justified reason in
      portal/assessments/rule-quality/rule/seikika/maintainer-ci-reliability/main-not-stuck-red.yaml
      says "The only source for '3' is the rule's own rationale" and "Nothing
      records whether 3 was chosen or measured". But
      docs/design/github-actions-standards.md:88 states the number: thresholds
      are "Seikika's proposal (20 / 10 / 5%, 3 failures in a row), not a
      published standard". That labels 3 as chosen. The other citations
      land:
      - crates/seikika-connector-github/src/runs.rs:66-69, 91 (streak), 9-10
        and 84-89 (failedRuns);
      - packages/github-actions/fragments/github-actions.yaml:355-358 and
        363-366;
      - portal/tests/standards.test.yaml:155-166;
      - thresholds.md:57 and github-actions-standards.md:121.
      "Below 3 means the branch went green since its last two failures" is
      loose wording. It means at least one of the newest three decided runs
      didn't fail.
    suggestion: >-
      Cite github-actions-standards.md:88 and judge threshold-justified
      against it: a labelled proposal whose rationale gives the reason.
  - criterion: complete
    verdict: unsure
    reason: >-
      The rubric says "unsure when no source states the number"
      (portal/standards/meta.yaml:1178-1180). A source does state it
      (github-actions-standards.md:88). The verdict should therefore be pass,
      a labelled choice with its reason in the rule's rationale
      (github-actions.yaml:363-366), or fail if a bare "proposal" is judged
      unjustified. It should not be unsure. The other three verdicts are
      right. Cancelled runs are not decided (runs.rs:9-10), and a decided run
      that didn't fail is the only thing that resets the streak
      (runs.rs:66-69).
    suggestion: >-
      Re-judge threshold-justified as pass, citing
      github-actions-standards.md:88 and the rationale, or as fail with a
      reason why a labelled proposal isn't justification. Adding a
      thresholds.md row would settle it either way.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The measures-intent, hard-to-game and fix-leads-to-pass verdicts rest on
      runs.rs and the rule's text, and would repeat. The threshold divergence
      comes from a source the assessor missed, not from taste, and is recorded
      under supported and complete.
  - criterion: actionable
    verdict: pass
    reason: >-
      Adding a main-not-stuck-red row to docs/design/thresholds.md that labels
      3 as chosen, with its reason, would turn threshold-justified into a
      pass. It is the one non-pass verdict in
      portal/assessments/rule-quality/rule/seikika/maintainer-ci-reliability/main-not-stuck-red.yaml.
summary: >-
  Its code findings are right: the streak counts only decided runs and is
  reset only by one that didn't fail. But its threshold reason claims no
  source states or labels the 3.
  docs/design/github-actions-standards.md:88 calls it Seikika's proposal,
  so the unsure rests on a missed source and should be re-judged.
