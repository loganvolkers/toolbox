entity: assessment:rule-quality/rule:seikika/maintainer-ci-reliability/every-job-has-timeout
rubric: assessment-quality
subjectHash: e33926c5e362
assessor: {kind: agent, name: cursor-reviewer-09, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      portal/assessments/rule-quality/rule/seikika/maintainer-ci-reliability/every-job-has-timeout.yaml
      checks out. crates/seikika-connector-workspace/src/workflows.rs:254 sets
      `timeout` from the key's presence or a `uses:` call, and line 285 lists
      the jobs without it. The rationale is at
      packages/github-actions/fragments/github-actions.yaml:431-434. The
      ghalint rows are docs/design/github-actions-standards.md:59 and 86, and
      the ladder row is docs/design/thresholds.md:57. Parsing the workflows
      confirms the live misses: rust, report-action, reference-portal, ui and
      typescript-builder in ci.yml, and plan, build-local-artifacts,
      build-global-artifacts, host and announce in release.yml. That is five
      evidence entries per file in portal/results.json. The release.yml caveat
      holds too: D01M7Y5VWNAWB8K1DNMY31KQPQ0 calls the file "not edited by
      hand", dist-workspace.toml:24 sets `allow-dirty = ["ci"]`, and
      portal/waivers.yaml waives only the zizmor rules.
  - criterion: complete
    verdict: pass
    reason: >-
      The hard-to-game fail is the real weakness. workflows.rs:254 reads
      `job.get("timeout-minutes").is_some()`, so `timeout-minutes: 360`
      passes. That value is the default the rationale objects to
      (github-actions.yaml:431-433). The measures-intent pass is defensible,
      because the name and the fix (github-actions.yaml:428-430) ask only for
      the key, and reusable-workflow calls really can't carry one.
      threshold-justified passes for a presence-only rule, as
      portal/standards/meta.yaml:1178-1180 directs.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on one line of code (workflows.rs:254) or on cited
      docs. A second assessor would find the 360-minute route and the ghalint
      source in the same places, so the verdicts in
      portal/assessments/rule-quality/rule/seikika/maintainer-ci-reliability/every-job-has-timeout.yaml
      would repeat.
  - criterion: actionable
    verdict: pass
    reason: >-
      The one fail, hard-to-game, comes with a suggestion: record the numeric
      value and fail at or above 360, or above a justified `maxJobTimeout`.
      That closes the route its reason names (workflows.rs:254). Setting the
      bound below the default is what makes the cheap pass cost something.
summary: >-
  A trustworthy assessment. Its citations land, including the live misses
  and the release.yml decision caveat, and its one fail names a real
  presence-only loophole at workflows.rs:254, with a fix for it.
