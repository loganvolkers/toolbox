verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Most of
      portal/assessments/rule-quality/rule/seikika/sdlc-stage/automated.yaml
      matches. executed() collects run:, uses: and with: only
      (crates/seikika-connector-workspace/src/data.rs:173-198), a workflow
      path always counts (crates/seikika-connector-workspace/src/data.rs:204),
      and a .rs file under crates/ counts when CI runs cargo test
      (crates/seikika-connector-workspace/src/data.rs:207-209).
      rust-toolchain.toml is catted into a hash at
      actions/report/action.yml:98, and maintainer/build lists it
      (portal/sdlc/stages/maintainer.yaml:23). Both stages are gold in
      portal/results.json. The rule text is
      portal/standards/sdlc.yaml:220-234, the fixture fail is
      portal/tests/standards.test.yaml:1053-1054, and silver is
      docs/design/thresholds.md:57. The monitor example does not hold.
      portal/results.json is not passed as --baseline in any run, uses or with
      value. It appears in a comment (.github/workflows/ci.yml:75-76) and a
      step name (:109), which executed() skips. The stage passes because the
      ancestor directory portal is the with: value portal: portal
      (.github/workflows/ci.yml:112), and run_by_ci treats that as executing
      every file under portal/
      (crates/seikika-connector-workspace/src/data.rs:210-217).
    suggestion: >-
      Replace the --baseline sentence with the ancestor match: a check under
      portal/ passes because with: portal: portal names the directory. Keep
      the rust-toolchain and cargo-test examples, which the sources support.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent and hard-to-game still fail. A hashed toolchain file and
      any crates/*.rs file count (actions/report/action.yml:98,
      crates/seikika-connector-workspace/src/data.rs:207-209), and listing
      .github/workflows/ci.yml passes every stage
      (crates/seikika-connector-workspace/src/data.rs:204). maintainer/build,
      maintainer/test and maintainer/monitor each list
      .github/workflows/ci.yml (portal/sdlc/stages/maintainer.yaml:23, 40 and
      108). The fix at portal/standards/sdlc.yaml:227-230 does lead to a path
      notInCi will accept, and silver is the docs/design/thresholds.md:57
      wording. The wrong monitor mechanism is not a missed criterion.
  - criterion: reproducible
    verdict: pass
    reason: >-
      crates/seikika-connector-workspace/src/data.rs:150-218 is explicit about
      what counts as run. A second assessor fails the first two criteria and
      passes the last two from that function and
      portal/standards/sdlc.yaml:220-234, whether or not they notice the
      portal/ ancestor match.
  - criterion: actionable
    verdict: pass
    reason: >-
      Counting only a workflow file, a program or first argument of a run:
      command, or a uses: ./path action would drop the cat'd toolchain, the
      baseline JSON and a bare .github/workflows/ci.yml listing, which is what
      the two suggestions change. Requiring a job id such as
      .github/workflows/ci.yml#test would do the same for the hard-to-game
      route.
summary: >-
  The rule really counts mentions, and the toolchain, cargo-test and
  .github/workflows/ci.yml routes are as described. The monitor example is
  not: portal/results.json passes because the directory portal is a with:
  value, not because a workflow passes it as --baseline. The verdicts
  still stand.
