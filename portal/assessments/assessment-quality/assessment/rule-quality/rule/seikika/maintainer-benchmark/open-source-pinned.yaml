    reason: >-
      The verdicts are right, and the graphify-ab case strengthens the
      measures-intent fail. threshold-justified rightly fails rather than
      being unsure. A source does state a number, and it differs from the
      rule's: "at least two open-source repositories" (dx-benchmarks.md:122).
  - criterion: reproducible
