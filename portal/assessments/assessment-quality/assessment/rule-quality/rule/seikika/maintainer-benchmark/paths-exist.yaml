entity: assessment:rule-quality/rule:seikika/maintainer-benchmark/paths-exist
rubric: assessment-quality
subjectHash: a74a865dc21d
assessor: {kind: agent, name: cursor-reviewer-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/seikika/maintainer-benchmark/paths-exist.yaml
      hold. `missing()` skips an empty path and uses `exists()`
      (crates/seikika-connector-workspace/src/data.rs:87). `not_naming` is
      data.rs:220-233. The sdlc-stage `naming` is portal/seikika.yaml:170, and
      the benchmark source is portal/seikika.yaml:172-174. In
      portal/standards/benchmarks.yaml, the fix and rationale are 275-281 and
      hypothesisGaps is 166-172. In docs/design/dx-benchmarks.md, the bronze
      row is 224 and the result row 75. One understatement: `prompts` is set
      on eight live entries (for example
      portal/benchmarks/actions-gitlab.yaml:46), not just connector-ab and
      actions-ab.
  - criterion: complete
    verdict: pass
    reason: >-
      The three fails and the pass are right. An empty readme passes
      (data.rs:87), and any existing file passes. The fix never mentions
      `prompts`, although the check reads it (portal/seikika.yaml:174).
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict follows from data.rs:77-93 and the fix text, and a second
      assessor can confirm both by reading them.
  - criterion: actionable
    verdict: fail
    reason: >-
      Two of the suggestions would fail honest entries rather than close the
      gaming routes. First, `naming: [readme, results]` cannot work for
      benchmarks. `not_naming` matches the entry's `name` field (data.rs:223),
      and benchmark entries have only `id`
      (portal/benchmarks/s4s-fresh-agent.yaml:3). With an empty name, every
      readable document is listed (data.rs:229), so all 19 entries would fail.
      The suggestion also names a `namelessDocs` fact, but the connector emits
      `notNaming` (data.rs:267). Second, counting a directory only when it
      holds a README would fail all eight committed `prompts` directories,
      none of which has one (for example experiments/actions-gitlab/prompts).
      Requiring `results` once an entry has run duplicates resultGaps
      (benchmarks.yaml:200-201). Only the `readme == ''` gap works as written.
    suggestion: >-
      Have `not_naming` fall back to the entry's `id` when it has no `name`,
      and name the `notNaming` fact. Drop the directory-README condition, or
      exempt `prompts`. Leave `results` to results-recorded.
summary: >-
  The verdicts and citations hold: an empty or generic path passes, and
  the fix omits `prompts`. But the main suggestion relies on a name-based
  detector that benchmark entries can't satisfy, under a fact name that
  doesn't exist, and the directory-README rule would fail every prompts
  directory. Following the suggestions would turn the rule red rather than
  make it hard to game.
