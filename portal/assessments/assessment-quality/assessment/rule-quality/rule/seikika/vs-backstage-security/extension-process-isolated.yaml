  - criterion: reproducible
    verdict: unsure
    reason: >-
      measures-intent and the F7 citations are stable. The pass on
      fix-leads-to-pass is a judgement that a currently true architectural
      fact need not name the file the check reads. A second assessor applying
      meta.yaml:1172-1173 would fail it; one who treats the design doc as the
