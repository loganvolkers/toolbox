      comparative standings, not a one-level ladder. The scorecard's levels:
      [bronze] is backstage-comparison.yaml:458, uncited.
    suggestion: >-
      Drop the decision as the source of a single bronze level, or cite
      backstage-comparison.yaml:458 for the level list and the decision only
      for what a comparison scorecard is.
  - criterion: complete
    verdict: fail
    reason: >-
      fix-leads-to-pass should fail. The check is
      entity.extensionProcessIsolated (backstage-comparison.yaml:533), whose
      value is the hand-written boolean at
      experiments/backstage-compare/facts.yaml:21-25. The fix
