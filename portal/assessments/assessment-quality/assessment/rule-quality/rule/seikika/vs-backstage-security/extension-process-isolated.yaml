    suggestion: >-
      Apply the criterion's "data the fix does not mention" test to
      facts.yaml:21-25 and record fail or pass from that, so the verdict is
      not whether the rule happens to pass today.
  - criterion: actionable
    verdict: pass
    reason: >-
      portal/assessments/rule-quality/rule/seikika/vs-backstage-security/extension-process-isolated.yaml
