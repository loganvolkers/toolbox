verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Most citations in
      portal/assessments/rule-quality/rule/seikika/vs-backstage-security/extension-process-isolated.yaml
      hold: the rationale is
      portal/standards/backstage-comparison.yaml:540-543, in-image connectors
      are child processes (crates/seikika-api/src/connectors.rs:262 and
      :316-318), ingest requires a connector token
      (crates/seikika-api/src/routes.rs:674-681, route at :33), the boolean is
