summary: >-
  The process-isolation pass is grounded in the child-process spawn and
  the adjudication, but the assessment is not fully trustworthy. It
  attributes a single bronze level to a decision that does not say that,
  and it passes fix-leads-to-pass even though the check reads a boolean
  the fix never names. A second assessor can reasonably fail that
  criterion.
