rubric: assessment-quality
subjectHash: 65e515747129
assessor: {kind: agent, name: cursor-reviewer-37, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      portal/assessments/rule-quality/rule/seikika/vs-backstage-capabilities/community.yaml
      matches the sources. The rationale is people who stay
      (portal/standards/backstage-comparison.yaml:1069-1072) and the check is
      contributors >= 10 (line 1060). facts.yaml:94-98 sets Seikika to 4,
      "anonymous included; three are agents", and the value is typed there
      rather than fetched. RESEARCH.md:31-33 scores project health with
      OpenSSF Scorecard checks, and line 64 says report Scorecard per check.
      The fix is CONTRIBUTING.md, good first issues and cargo test
      (backstage-comparison.yaml:1066-1068); there is no CONTRIBUTING.md at
      the repository root. RESULTS.md:261-265 and ADJUDICATION.md:123 record
      the post-hoc bar of >= 10 and say the standing does not depend on it.
      The 4 versus 2,826 figure is facts.yaml:183 and ADJUDICATION.md:94, not
      on the lines the reason numbers, and it is not needed for the unsure.
  - criterion: complete
    verdict: pass
    reason: >-
      A raw all-time count, agents included, is not the rationale's "people
      who keep the project alive", so measures-intent fails. Editing the typed
      4, or counting more agent accounts if the count were fetched, is cheaper
      than new human contributors, so hard-to-game fails. The fix cannot by
      itself move the value from 4 to 10. No cited doc states where 10 comes
      from, so unsure is the threshold the rubric asks for
      (portal/standards/meta.yaml:1178-1180).
  - criterion: reproducible
    verdict: pass
    reason: >-
      The count, the agent note and the post-hoc bar are written down. A
      second assessor reaches unsure on 10 for the same reason: the deviation
      discloses the bar and names no source for the number.
  - criterion: actionable
    verdict: pass
    reason: >-
      Counting recent human contributors, or scoring the OpenSSF checks, would
      change measures-intent and hard-to-game. Splitting the rule into levers
      the fix can achieve would change fix-leads-to-pass. Stating a source for
      10, or replacing it, would resolve the unsure. Each suggestion in
      portal/assessments/rule-quality/rule/seikika/vs-backstage-capabilities/community.yaml
      is attached to the verdict it would change.
summary: >-
  Trustworthy. The rule counts a hand-typed all-time total that includes
  agents, the bar of 10 was written after the smoke rounds with no source,
  and the fix cannot produce six more contributors. The three fails and
  the unsure are what those files support, and each suggestion would
  change its own verdict.
