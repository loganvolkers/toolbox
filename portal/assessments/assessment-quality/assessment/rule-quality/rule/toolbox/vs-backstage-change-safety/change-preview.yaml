verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-change-safety/change-preview.yaml
      check out. crates/toolbox-cli/src/main.rs:894-899 loads one fixture
      snapshot and recomputes the base manifest over it. The PlanDiff fields
      are at crates/toolbox-derive/src/plan.rs:41-51, and
      crates/toolbox-derive/tests/reference.rs:72-117 is the plan test. The
      record copy is snapshot.py:85, Backstage's evidence is called weakly
      evidenced at ADJUDICATION.md:290-292, and the bar is at README.md:50 and
      ADJUDICATION.md:111. The scorecard text is at
      backstage-comparison.yaml:99-101, 664-667, 693-694 and 696-699.
      Searching crates/*/tests, scripts/*.sh and ci.yml finds nothing that
      runs `toolbox plan`. One overstatement: facts.yaml:46-47's evidence does
      say "between two manifests". The qualification is missing only from the
      boolean and from the field (:99-101), and measures-intent rests on
      those, so the verdict holds.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent is a fail on the scorecard's own words. It counts "a
      catalog edit" as a change (backstage-comparison.yaml:665), but `plan`
      uses the same snapshot for both sides (main.rs:894-898). hard-to-game
      fails on a hand-typed value. D01M857ZB468ZM2YS6GNSEG6YB9 §3 (lines
      35-36) says a comparison "is re-run and not hand-edited".
      fix-leads-to-pass meets the rubric's "needs data the fix doesn't
      mention" (portal/standards/meta.yaml:1172-1173). threshold-justified is
      a boolean with a pre-registered bar. No failure is missed.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The one judgement is whether a connector-fed catalog edit is "a change".
      backstage-comparison.yaml:664-667 says it is, so a second assessor would
      reach the same verdict. The other three verdicts rest on code and file
      contents anyone can read.
  - criterion: actionable
    verdict: pass
    reason: >-
      Each suggestion would change its verdict. Narrowing the field or diffing
      a candidate input snapshot fixes measures-intent. A harness probe on two
      bench manifests replaces the hand-typed value for hard-to-game. Naming
      plan.rs, main.rs and the record step gives fix-leads-to-pass a place to
      start and a way to update the record.
summary: >-
  A trustworthy assessment. Every code and document citation lands, and
  the three fails follow from the scorecard's own definition of a change,
  from a value typed into facts.yaml, and from a fix that doesn't point
  there. The one slip is saying the fact lacks the "two manifests"
  qualification, which its evidence string actually has. That changes no
  verdict.
