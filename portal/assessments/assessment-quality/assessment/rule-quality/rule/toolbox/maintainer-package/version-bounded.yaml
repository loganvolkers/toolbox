verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      is_wildcard in
      portal/assessments/rule-quality/rule/toolbox/maintainer-package/version-bounded.yaml
      is crates/toolbox-connector-workspace/src/npm.rs:72-92. It special-cases
      only "latest" (npm.rs:77) and a leading ">" (npm.rs:80); the per-part
      test (npm.rs:83-91) does not look for ">". So "next", "^1.0.0 || >=2"
      and "npm:left@*" are not wildcards, and "leftpad@next" or a caret plus
      "|| >=0" clears a "latest" hit. Evidence is wildcardRanges
      (portal/standards/packages.yaml:90), the fixture is ['leftpad@*'] at
      portal/tests/standards.test.yaml:557-558, and the boundary is
      package-standards.md:26-28, D76 and packages.yaml:50.
  - criterion: complete
    verdict: pass
    reason: >-
      Those three specs are unbounded in the sense the rationale describes and
      the check does not see them, so measures-intent and hard-to-game fail.
      Rewriting a listed spec as ^x.y.z passes is_wildcard, so
      fix-leads-to-pass is right. There is no numeric threshold.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The three specs can be stepped through is_wildcard without running the
      connector. The scratch-manifest result the reason reports is what that
      function returns.
  - criterion: actionable
    verdict: pass
    reason: >-
      Parsing every "||" part and npm: alias, and treating other dist-tags as
      wildcards, would flag the specs
      portal/assessments/rule-quality/rule/toolbox/maintainer-package/version-bounded.yaml
      names, which changes both fails. The two passes need no suggestion.
summary: >-
  Trustworthy. The matcher misses other dist-tags, a ">=" inside an OR,
  and an npm alias, which is what the cited function does. Both fails
  follow, and a range parse would change them. The fix and the bronze
  boundary are cited correctly.
