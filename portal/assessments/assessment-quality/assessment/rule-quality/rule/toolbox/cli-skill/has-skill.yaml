entity: assessment:rule-quality/rule:toolbox/cli-skill/has-skill
rubric: assessment-quality
subjectHash: d219a6215373
assessor: {kind: agent, name: cursor-reviewer-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      portal/assessments/rule-quality/rule/toolbox/cli-skill/has-skill.yaml
      lands where it says. In portal/standards/cli.yaml, the check is 237, the
      fix 239-241, documentedIn 19-22, args 11 and the ratchet 233.
      portal/standards/docs.yaml:48 maps mentionsCommand, the capture regex is
      portal/toolbox.yaml:111-114, the plugins/**/*.md glob is 100, the
      fixture is portal/tests/standards.test.yaml:62-69, and the whitespace
      join is crates/toolbox-connector-workspace/src/main.rs:406. I reapplied
      the capture regex to every SKILL.md against `target/debug/toolbox
      describe`. It gave 34 commands, and 15 of them are also named by another
      skill, the same 15 the reason lists: validate by add-action, find-tools
      and vendor, plan by review-plan, and the assess-* leaves by
      assess-entity.
  - criterion: complete
    verdict: pass
    reason: >-
      Nothing the sources show is missed. The bare-invocation route under
      hard-to-game is real at the ratchet floor. maintainer-skill's bronze
      rules are frontmatter, description, pronouns, hidden text and secrets.
      has-procedure and has-example are silver
      (portal/standards/skills.yaml:82-130), so a skill whose body is only
      `toolbox push` reaches bronze on both cards. fix-leads-to-pass and
      threshold-justified are right: the fix path is in the docs glob
      (portal/toolbox.yaml:100), and the rule's bar has no number
      (cli.yaml:232-237).
  - criterion: reproducible
    verdict: unsure
    reason: >-
      Whether measures-intent fails depends on how the rule's intent is read.
      The assessment reads "has-skill" and the fix's <slug>/SKILL.md as "the
      command's own skill". But D94
      (docs/decisions/D01M7X1Y5T00000000000000000.md) defines bronze as "a
      `SKILL.md` whose text mentions `toolbox <command>`", and
      docs/design/cli-skills.md:21-23 says "The match is the invocation, not a
      filename convention". So validate passing through add-action's mention
      is the decided behaviour. The reason does not engage with that text, so
      a second assessor citing D94 could pass measures-intent.
    suggestion: >-
      Address D94 and cli-skills.md:21-23 directly in measures-intent. Either
      argue that a passing mention in another skill falls short of "a
      procedure an agent can be routed to" (cli-skills.md:17), or move the
      own-skill concern to hard-to-game, where the index-skill route already
      makes the case without depending on the reading.
  - criterion: actionable
    verdict: unsure
    reason: >-
      measures-intent's suggestion closes both misfires it names: requiring
      the command's own skill removes the other-skill mentions, and deriving
      parents from `toolbox describe` fixes the hand-listed regex
      (portal/toolbox.yaml:111-114). hard-to-game's suggestion closes the
      index-skill and passing-aside routes. It leaves the third route the
      reason names, an own skill whose body is only the invocation, to "a
      silver rule" on flags. That rule is a different rule, so has-skill's
      cheapest pass would still be the bare skill
      (portal/assessments/rule-quality/rule/toolbox/cli-skill/has-skill.yaml,
      hard-to-game).
    suggestion: >-
      Either fold a content requirement into has-skill itself, such as the
      skill naming at least one of the command's `args` or one exit code. Or
      drop the bare-body route from the hard-to-game reason as
      maintainer-skill's job (cli.yaml:223-224), so the remaining suggestion
      flips the verdict.
summary: >-
  A careful, well-cited assessment. Every line number holds, and its "15
  of 34 commands" count reproduces exactly. Two soft spots. The
  measures-intent fail rests on reading the rule as "own skill", while D94
  defines bronze as any SKILL.md mention, and the reason doesn't address
  that. The hard-to-game suggestion pushes one of its three routes onto a
  different rule.
