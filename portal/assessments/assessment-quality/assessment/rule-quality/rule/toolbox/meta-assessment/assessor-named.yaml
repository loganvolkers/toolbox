apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:toolbox/meta-assessment/assessor-named
rubric: assessment-quality
subjectHash: 5f8611df8149
assessor: {kind: agent, name: cursor-reviewer-04, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      portal/assessments/rule-quality/rule/toolbox/meta-assessment/assessor-named.yaml
      lands where it says. The `assessorName` mapping is at
      portal/standards/assessments.yaml:124 and the rule at 176-187, with its
      fixed evidence at 180. `selfReviewed` is at 105-112 and the ratchet at
      165. schema/assessment.schema.json:20 gives `assessor.name` a bare
      string type with no pattern or minLength. In
      crates/toolbox-connect/src/assessment.rs:290, `!by.is_empty() && *by !=
      own` accepts any non-empty name. docs/design/thresholds.md:63-70 is the
      self-declared-name limit. Fixture line 43 of
      portal/fixtures/workspace.ndjson has no name, and 16 of the 17 fixture
      assessors carry one. portal/tests/standards.test.yaml:960-970 pins one
      unnamed fail and one named pass. D01M831P5QWJQ4A2FT85N5MXJQF does say
      that blank descriptions and guidance don't count.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts are the ones the sources support. Nothing trims the name.
      The CEL `size() > 0` (assessments.yaml:178) and link_reviews
      (assessment.rs:290) both take `" "`, so hard-to-game fails under the
      rubric's "empty doc comment" guidance
      (portal/standards/meta.yaml:1164-1166). The brief's template writes
      `name: ""` (crates/toolbox-api/src/assess.rs:78), and the rule fails
      that, so measures-intent rightly passes. threshold-justified rightly
      passes on a rule with no number (meta.yaml:1179).
  - criterion: reproducible
    verdict: pass
    reason: >-
      The one judgement is whether a whitespace name counts as gaming, given
      that any fake name is no dearer. The assessment ties it to the rubric's
      blank case and to D01M831P5QWJQ4A2FT85N5MXJQF, and keeps the fake-name
      route apart as the limit documented at docs/design/thresholds.md:63-70.
      A second assessor reading those would reach the same split.
  - criterion: actionable
    verdict: pass
    reason: >-
      The hard-to-game suggestion in
      portal/assessments/rule-quality/rule/toolbox/meta-assessment/assessor-named.yaml
      changes this rule's own check to `matches('\\S')`. It adds `"pattern":
      "\\S"` at schema/assessment.schema.json:20 and a failing fixture. With
      that, a blank name fails the rule, so the verdict it is attached to
      would turn to pass.
summary: >-
  Trustworthy. Every line citation checks out, and the whitespace-name
  route is real: the CEL check, the schema and link_reviews all accept `"
  "`. The three passes rest on code and decisions a second assessor can
  read. The suggestion fixes the rule itself, not a neighbour.
