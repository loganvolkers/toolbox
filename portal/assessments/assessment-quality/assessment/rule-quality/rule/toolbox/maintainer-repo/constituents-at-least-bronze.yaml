verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/toolbox/maintainer-repo/constituents-at-least-bronze.yaml
      land where they say. crates/toolbox-derive/src/lib.rs:930-934 filters
      `summaries` by `watch`, and 1183-1188 skips a card with no rows or no
      level. portal/toolbox.yaml:30-43 is `repoRollup`, and
      portal/tests/standards.test.yaml:782-792 is the repository-level test.
      portal/standards/repository.yaml:159 and 160-162 are the evidence and
      the fix. packages/github-actions/fragments/github-actions.yaml:552 is
      `levels: [bronze]`, and docs/design/repo-level.md:13-24 is the
      lowest-constituent table. Two phrasings are loose without changing a
      verdict. First, "no code reads repoRollup apart from the report JSON"
      overlooks the CEL that derives `watch` from it (repository.yaml:44-45),
      though nothing validates the names. Second, no fixture shows
      acme/unsafe's supply-chain card reaching bronze; that example is
      hypothetical.
  - criterion: complete
    verdict: pass
    reason: >-
      Both fails follow from the code. A watched name with no summary drops
      out (lib.rs:930-934), so `cards.all(...)` holds over whatever remains,
      and on an empty list it is true. Nothing guards deleting a name from
      portal/toolbox.yaml:30-43. fix-leads-to-pass is right because every
      rollup card has a bronze rung: the shortest ladder is
      github-actions.yaml:552. threshold-justified is the definition in D86
      (docs/decisions/D01M7WMSMS50000000000000000.md:9). Live, the repository
      is bronze with this rule passing (portal/results.json), as the reason
      says.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Both fails rest on code a second assessor can read (lib.rs:930-934,
      1183-1188) and on a one-word edit to a fixture's `watchOverride`
      (portal/fixtures/workspace.ndjson:61). They don't rest on taste.
  - criterion: actionable
    verdict: pass
    reason: >-
      Two checks would close the misfire measures-intent names: requiring
      `cards.size() == entity.watch.size()` and having `toolbox validate`
      reject unknown `repoRollup` names. hard-to-game's ratchet guard on
      `repoRollup` removals removes the cheap route it names
      (portal/toolbox.yaml:30-43).
summary: >-
  A sound assessment. Its fails on measures-intent and hard-to-game rest
  on lib.rs:930-934, which drops unknown watched names, and on an
  unguarded `repoRollup`. Every line citation resolves. Two sentences
  overreach slightly: one says no code reads `repoRollup`, the other cites
  a fixture that doesn't exist. Neither changes a verdict.
