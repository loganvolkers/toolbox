verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/toolbox/review-crate/no-doubts.yaml
      hold. portal/standards/crates.yaml has reviewUnsure at 70-74, the check
      at 420, the fix at 424-428, the rationale at 429-432 and
      independently-reviewed at 433-436.
      crates/toolbox-connect/src/assessment.rs:181-190 builds `unsure`.
      portal/standards/assessments.yaml:326-332 is `complete`, and
      docs/design/meta-standards-review.md:111 flags the questions.md route.
      portal/tests/standards.test.yaml:920-928 shows toolbox-expr failing and
      toolbox-derive passing. That `tests-match-risk` is the unsure criterion
      is in the fixture record (portal/fixtures/workspace.ndjson:48), not in
      the cited test lines, but it is true.
  - criterion: complete
    verdict: fail
    reason: >-
      hard-to-game should not pass. The rule-quality guidance fails a rule
      that "a suppression would pass" (portal/standards/meta.yaml:1164-1166),
      and rewriting `unsure` as `pass` passes this rule on its own. The
      summary concedes that "taken alone, the check is only as honest as the
      assessor". The pass leans on independently-reviewed, but the same
      assessor failed that rule's hard-to-game: a self-chosen second name and
      one shared citation are enough
      (portal/assessments/rule-quality/rule/toolbox/review-crate/independently-reviewed.yaml:26-36).
      By the assessor's own findings, the guard is cheap, so the cheapest way
      to pass no-doubts is still to flip the verdict.
    suggestion: >-
      Fail or mark hard-to-game unsure, naming the flip route. Then attach a
      suggestion that holds even with independently-reviewed's gap. For
      example, record a criterion that a later assessment at the same
      subjectHash changes from `unsure` to `pass`, and require a different
      assessor for that change.
  - criterion: reproducible
    verdict: unsure
    reason: >-
      The hard-to-game pass rests on a judgement the sources don't settle:
      whether a sibling gold rule's protection counts toward this rule's own
      hard-to-game. The same assessor fails the identical check on
      review-scorecard and review-sdlc-stage because they lack that sibling
      (portal/assessments/rule-quality/rule/toolbox/review-scorecard/no-doubts.yaml:17-29).
      A second assessor who judges the rule alone would fail it.
    suggestion: >-
      State, with a source, whether rule-quality judges a rule alone or
      alongside the other rules at its level. Then apply that the same way to
      all three review-* no-doubts rules.
  - criterion: actionable
    verdict: pass
    reason: >-
      There are no fail or unsure verdicts in
      portal/assessments/rule-quality/rule/toolbox/review-crate/no-doubts.yaml,
      so there are no suggestions to judge.
summary: >-
  Not yet trustworthy on hard-to-game. The citations hold, and
  measures-intent, fix-leads-to-pass and threshold-justified are right.
  But the pass relies on independently-reviewed as a guard, and the same
  assessor found that guard cheap to forge. Taken alone, the rule passes
  on an unsure rewritten as a pass.
