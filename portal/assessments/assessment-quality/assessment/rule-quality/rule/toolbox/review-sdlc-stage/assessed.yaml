assessor: {kind: agent, name: cursor-reviewer-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      portal/assessments/rule-quality/rule/toolbox/review-sdlc-stage/assessed.yaml
      holds. crates/toolbox-connector-workspace/src/data.rs:250 hashes only
      the YAML entry `e`. portal/standards/sdlc.yaml has the rubric
      description ("its docs and checks, and try its commands") at 397-399,
      executable-exit at 401-405, the fix at 355-358, the rationale at 359-362
      and the advisory ratchet at 330. In portal/sdlc/stages/operator.yaml,
      operator/validate's check is scripts/validate-parity.py (41) and
      operator/plan has `checks: []` (65).
      portal/tests/standards.test.yaml:1081-1085 has demo-gap/release stale
      and failing, and demo-done/plan passing.
      schema/assessment.schema.json:32-36 and
      crates/toolbox-api/src/assess.rs:157-166 are as described.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent fails correctly. The rubric judges the checks and
      commands (sdlc.yaml:397-405), but a rewrite of
      scripts/validate-parity.py leaves the entry hash at data.rs:250
      unchanged. hard-to-game fails correctly, because nothing below gold
      reads citations (sdlc.yaml:351, 365-367). fix-leads-to-pass and
      threshold-justified are right.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Both fails follow from data.rs:250 and the silver check at
      sdlc.yaml:351. The suggestion to leave shared docs out of the hash is a
      stated trade-off, not a verdict.
  - criterion: actionable
    verdict: unsure
    reason: >-
      Folding `checks:` and `commands:` file contents into the stage hash
      would flip measures-intent for the cited case. The hard-to-game
      suggestion requires one path from the stage's checks, docs or stage
      file. "Commands look right, see portal/sdlc/stages/operator.yaml." then
      passes, still without trying a command, which is the route the reason
      names. The same assessor makes that objection to citation-only gold
      (portal/assessments/rule-quality/rule/toolbox/review-sdlc-stage/passes-review.yaml:21-26).
    suggestion: >-
      Make the hard-to-game suggestion something a cited stage file can't
      satisfy. For example, require the `executable-exit` reason to cite one
      of the stage's `checks:` paths and the `agent-can-complete` reason to
      cite a `commands:` entry, or argue why one citation is enough at silver.
summary: >-
  Trustworthy on its verdicts. The stage hash covers the declaration, not
  the checks the rubric judges, and silver accepts an all-pass file. The
  hard-to-game suggestion would still pass a review that cites only the
  stage file, which the same assessor objects to on passes-review.
