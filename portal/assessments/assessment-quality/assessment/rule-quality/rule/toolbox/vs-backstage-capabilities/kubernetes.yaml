apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:toolbox/vs-backstage-capabilities/kubernetes
rubric: assessment-quality
subjectHash: 9109221da501
assessor: {kind: agent, name: cursor-reviewer-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-capabilities/kubernetes.yaml
      hold: - backstage-comparison.yaml:151-153 is the field. -
      RESEARCH.md:120 is "Kubernetes view". - facts.yaml:88 and 176 are the
      two facts. - snapshot.py:85 overlays them. - The rule links
      docs/design/connector-control.md. - README.md:53 and ADJUDICATION.md:114
      are the bar.
  - criterion: complete
    verdict: fail
    reason: >-
      fix-leads-to-pass should fail. The fix, "Add a connector that reads
      workloads from the Kubernetes API" (backstage-comparison.yaml:1020),
      names no code or config place. The reason itself concedes that the fix
      doesn't say how a workload maps to its component. It also omits the
      facts.yaml:88 edit and the snapshot.py rerun without which the value
      stays false. That is "vague" and "needs data the fix doesn't mention"
      (portal/standards/meta.yaml:1172-1173). The same assessor failed the
      equally place-less notifications and docs fixes.
    suggestion: >-
      Fail fix-leads-to-pass. Suggest a fix naming a connector binary, a
      workload kind related to its component by label, and "then update
      facts.yaml and rerun snapshot.py".
  - criterion: reproducible
    verdict: unsure
    reason: >-
      fix-leads-to-pass passes here but fails on notifications for "names a
      channel but no code or config place". Both fixes name a mechanism and no
      place, so the verdict depends on the assessor's leniency, not on the fix
      text.
    suggestion: >-
      Apply one test across the capability rules: a fix for a false capability
      passes only if it names the code or config to change and the
      facts.yaml/snapshot.py step.
  - criterion: actionable
    verdict: pass
    reason: >-
      The hard-to-game suggestion adds a kind cluster with one labelled
      Deployment, and sets `capKubernetes` only when each product shows it.
      That would make the fact measured and change the verdict.
summary: >-
  The citations are accurate and the hard-to-game fail is right. But
  fix-leads-to-pass passes a fix that names no place, no
  workload-to-component mapping (the reason concedes this) and no
  facts.yaml step. The same assessor failed equally vague fixes on
  notifications and docs.
