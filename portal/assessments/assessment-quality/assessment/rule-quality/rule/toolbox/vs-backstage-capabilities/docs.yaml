verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      measures-intent cites RESEARCH.md:115 for "TechDocs page render". In
      experiments/backstage-compare/RESEARCH.md, line 115 is "full-text
      search", and TechDocs is 116. The fix-leads-to-pass reason quotes
      docs/v1-spec.md:68 "Not yet: ... the UI pages" for the UI extension
