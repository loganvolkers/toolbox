  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent rightly fails. The rationale's harm is a leaked agent
      token, and Backstage's MCP-capable token deletes
      (ADJUDICATION.md:489-490) while the rule scores it a pass. Disclosure in
      the rationale doesn't make the pass mean the intent. The other three
