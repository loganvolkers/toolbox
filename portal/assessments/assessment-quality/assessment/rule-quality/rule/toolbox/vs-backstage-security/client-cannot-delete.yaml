verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The substantive citations in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-security/client-cannot-delete.yaml
      hold. backstage-comparison.yaml:502-505 is the rationale, admitting the
      MCP token. surface.py:161-162 probes the client token and 183-184
      requires both a non-2xx status and the entity still there.
      ADJUDICATION.md:482-490 records a plugin-scoped MCP token deleting with
