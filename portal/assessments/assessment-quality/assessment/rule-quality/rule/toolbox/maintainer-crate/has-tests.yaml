apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:toolbox/maintainer-crate/has-tests
rubric: assessment-quality
subjectHash: 465173f810f1
assessor:
  kind: agent
  name: cursor-assessment-reviewer
  model: claude-opus-5.5
at: 2026-11-23
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      portal/assessments/rule-quality/rule/toolbox/maintainer-crate/has-tests.yaml
      says what its reason claims. In
      crates/toolbox-connector-workspace/src/rust.rs, helpers are built per
      file (433, 453) and are any non-test fn that asserts (255-290). Calls
      match on the method name or last path segment (230, 237-246). Only the
      macros `assert*`/`debug_assert*`, `panic` and `unreachable` count
      (214-223), and any unwrap or expect is an assert (225-235). `trivial`
      rejects only `true`/`! false` and same-token sides (183-211). The
      has-tests check, evidence and fix are at
      portal/standards/crates.yaml:158-169, and testsPerKloc counts the same
      tests (crates.yaml:42-47, 170-179). docs/design/thresholds.md:36-37
      match too. I re-ran target/debug/toolbox-connector-workspace on a
      scratch crate whose `add` returns `a - b`. A lone
      `"1".parse::<i32>().unwrap()` test, `assert!(1 == 1)`, and `Vec::new()`
      next to an unwrapping `Cfg::new` were all counted as asserting. A
      tests/common helper and a closure-form `prop_assert!` were listed as
      asserting nothing. Two imprecisions don't change a verdict. A block-form
      `proptest! { #[test] fn .. }` test isn't counted at all, rather than
      listed. A production fn that uses `?`, not only one that unwraps, also
      becomes a helper.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts are the ones the sources support. measures-intent and
      hard-to-game fail on routes that
      crates/toolbox-connector-workspace/src/rust.rs leaves open today, and
      the rubric's "could pass while missing the intent"
      (portal/standards/meta.yaml:811-813) makes the latent misfires enough.
      fix-leads-to-pass holds: a direct non-trivial `assert!` sets `found` in
      the listed test (rust.rs:214-219, 145), whatever the cause, and the fix
      asks for one (portal/standards/crates.yaml:166-169). threshold-justified
      rests on docs/design/thresholds.md:36. The scratch run found more of the
      same, which only strengthens the two fails. An unwrap inside a macro's
      tokens, such as `println!("{}", x.unwrap())`, is invisible (visit_macro
      doesn't parse tokens, rust.rs:222). `let _ = load("x")` passes when
      `load` uses `?` (rust.rs:250-251 via 255-290), which is a further
      hard-to-game route. No criterion that passed should have failed.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on code or text a second assessor can read, not on
      taste. The fails rest on
      crates/toolbox-connector-workspace/src/rust.rs:214-235 and 433/453, and
      they reproduce on a scratch crate through
      target/debug/toolbox-connector-workspace. The passes rest on
      portal/standards/crates.yaml:158-169 and
      docs/design/thresholds.md:36-37. The one judgement call is failing
      measures-intent when none of the 15 live crates hits a misfire. All pass
      has-tests in portal/results.json, and the two placeholder crates are
      skipped by appliesTo (crates.yaml:149). The rubric's guidance asks
      whether an entity could pass or fail wrongly, though, not whether one
      does (portal/standards/meta.yaml:811-813).
  - criterion: actionable
    verdict: pass
    reason: >-
      Both suggestions in
      portal/assessments/rule-quality/rule/toolbox/maintainer-crate/has-tests.yaml
      target the verdict they are attached to. measures-intent's suggestion
      names a change for each misfire its reason cites. It would collect
      helpers per crate, replacing the per-file sets at
      crates/toolbox-connector-workspace/src/rust.rs:433 and 453, and resolve
      calls by path rather than by last segment (rust.rs:230, 237-246). It
      would add `ensure!` and `prop_assert*` to the macro list
      (rust.rs:217-218), and stop counting unwrap-only production fns as
      helpers (rust.rs:255-290). hard-to-game's suggestion to require a crate
      item would close the parse-unwrap and `assert!(1 == 1)` routes. Its
      cargo-mutants slot would close what static rules can't, such as
      `assert!(add(1, 1) >= i32::MIN)`. So the second part is what would flip
      that verdict.
summary: >-
  The re-assessment now judges the code that exists. Every citation into
  rust.rs, crates.yaml and thresholds.md checks out, and a scratch run of
  the connector reproduces both failing routes: a lone parse-unwrap test,
  and `Vec::new()` counted because of `Cfg::new`. Two details are
  understated without changing a verdict. A block-form proptest test isn't
  counted at all, and a production fn that only uses `?` also becomes a
  helper, so `let _ = load("x")` passes too.
