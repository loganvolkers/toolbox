apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:toolbox/maintainer-crate/tests-pass
rubric: assessment-quality
subjectHash: accf82738f25
assessor: {kind: agent, name: cursor-reviewer-23, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The measures-intent reason in
      portal/assessments/rule-quality/rule/toolbox/maintainer-crate/tests-pass.yaml
      says "No other test in crates/*/tests skips itself". The code
      contradicts it. crates/toolbox-cli/tests/serve.rs:36-40 returns early as
      root ("skipping: root reads every process's environment"). The unit test
      at crates/toolbox-api/src/confine.rs:82-91 also returns early on a
      kernel without Landlock unless TOOLBOX_REQUIRE_LANDLOCK is set. Both
      landed on 2026-11-24 (71d8655, 63dc91b), before this assessment. The
      other citations hold, with small drift. The OpenFGA early returns are at
      crates/toolbox-authz/tests/fga.rs:59-68 and
      crates/toolbox-api/tests/authz.rs:21-27. is_cfg_disabled is
      crates/toolbox-connector-workspace/src/rust.rs:51-59, and
      parse_cargo_test is crates/toolbox-connector-runner/src/main.rs:93-113.
      The check is portal/standards/crates.yaml:214-216, not 213-215. The fix
      is 223-228, not 222-227. The runner command is
      portal/toolbox.yaml:258-269, and the fixture test is
      portal/tests/standards.test.yaml:1272-1275.
    suggestion: >-
      Drop the "no other test skips itself" claim and cite serve.rs:36-40 and
      confine.rs:82-91. Update the crates.yaml and standards.test.yaml line
      numbers.
  - criterion: complete
    verdict: fail
    reason: >-
      measures-intent should fail, not pass. The runner job sets only
      TOOLBOX_REQUIRE_OPENFGA (portal/toolbox.yaml:262-264), while CI also
      sets TOOLBOX_REQUIRE_LANDLOCK (.github/workflows/ci.yml:51). So on a
      runner kernel without Landlock,
      a_confined_connector_cannot_read_a_sibling returns early and cargo
      reports it as passed (main.rs:103-104). The serve.rs credential test
      does the same when the runner runs as root. In both cases the rule
      passes, though a test that guards a security property never ran: an
      honest test passes while missing the intent, which is what the rubric's
      measures-intent guidance fails. This is the same gap the assessment says
      was closed for OpenFGA. hard-to-game (fail), fix-leads-to-pass and
      threshold-justified (docs/design/thresholds.md:38) are right.
    suggestion: >-
      Fail measures-intent. Suggest that the runner job also set
      TOOLBOX_REQUIRE_LANDLOCK, and that serve.rs fail rather than skip under
      a TOOLBOX_REQUIRE_* variable. Or suggest that the rule compare the
      runner's passed count with the workspace's test count.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The verdicts rest on code: the two exact spellings at rust.rs:56 and the
      exit-0-means-pass match at main.rs:103-104. The env lists at
      portal/toolbox.yaml:262-264 and ci.yml:51 are also code, as are the
      early returns, so a second assessor reading them reaches one answer.
      That answer differs from this assessment only on measures-intent, for
      the reason under complete.
  - criterion: actionable
    verdict: pass
    reason: >-
      The one fail, hard-to-game, comes with a suggestion that would turn it.
      Flagging any non-`test` cfg on a `#[test]` closes `#[cfg(miri)]` and
      `#[cfg(windows)]` at rust.rs:51-59. Comparing the runner's
      passed+failed+ignored count (main.rs:94-102) with the workspace's test
      counts would expose any test cargo didn't run.
summary: >-
  hard-to-game, fix-leads-to-pass and threshold-justified are right, and
  the hard-to-game suggestion would change its verdict. The
  measures-intent pass rests on "no other test skips itself", which
  serve.rs:36-40 and confine.rs:82-91 contradict. Both predate the
  assessment, and the runner sets TOOLBOX_REQUIRE_OPENFGA but not
  TOOLBOX_REQUIRE_LANDLOCK, so a skipped security test passes the rule.
