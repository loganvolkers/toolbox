verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/toolbox/maintainer-crate/simple-functions.yaml
      hold. The counter (crates/toolbox-connector-workspace/src/rust.rs:74-92)
      ignores `?` and `let ... else`. A connector rerun shows exactly four
      functions at 15: GitFiles::handle
      (crates/toolbox-connector-git-files/src/main.rs:312), Runner::execute
      (runner src/main.rs:529), Ci::recheck (exec src/ci/mod.rs:193) and
      conformance `run` (connect src/conformance.rs:71). GitFiles::handle's
      five `?` are at main.rs:327, 337, 342, 352 and 367. Six crates fail, as
      results.json says. The rationale, fix, evidence and links are
      portal/standards/crates.yaml:322-325, 318-321, 104-109 and 326-328. The
      counting rule is written at docs/design/toolbox-for-toolbox.md:240-241.
  - criterion: complete
    verdict: pass
    reason: >-
      threshold-justified was left unsure because the NIST PDF couldn't be
      read. It can be read. NIST SP 500-235 §2.5 (printed p. 15) says McCabe's
      10 "has significant supporting evidence, but limits as high as 15 have
      been used successfully as well". It reserves limits over 10 for projects
      with "several operational advantages", such as experienced staff and a
      comprehensive test plan. So the linked source states 15 only
      conditionally, and neither the rule nor thresholds.md argues that those
      conditions hold. Unsure remains right until someone does. The other
      three verdicts hold.
  - criterion: reproducible
    verdict: pass
    reason: >-
      measures-intent rests on rust.rs:74-92 and the five `?` in
      GitFiles::handle. hard-to-game rests on the same reasoning as the
      bounded-complexity assessment. The unsure is about access, which the
      reason names, not taste. With §2.5 quoted, a second assessor still lands
      on unsure or fail, not pass, because the conditions go unargued.
  - criterion: actionable
    verdict: pass
    reason: >-
      Counting `?` and `let ... else` would put GitFiles::handle at 20 and
      make the gold bound mean what its rationale says. The suggestion to
      quote the NIST passage in a thresholds.md row, or to label 15 as chosen,
      settles threshold-justified. The passage is §2.5 above.
summary: >-
  An accurate assessment. Four live functions sit exactly at 15, one with
  five uncounted `?`, and every citation checks out. The unsure on 15 was
  honest about access: NIST §2.5 allows 15 only for teams with listed
  advantages, which nothing here argues, so the unsure stands, and quoting
  that passage is the next step.
