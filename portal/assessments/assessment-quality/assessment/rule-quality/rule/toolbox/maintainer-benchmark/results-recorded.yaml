      reason cites. spec-ab is blocked with an empty outcome
      (portal/benchmarks/spec-ab.yaml:13-15) and is the only live
      results-recorded failure in portal/results.json. The fix at
      benchmarks.yaml:349-351 and the §2 and §4 citations
      (dx-benchmarks.md:75, :140-141) do hold.
    suggestion: >-
      Point the evidence pins at standards.test.yaml:1204 and :1257, the gold
      row at dx-benchmarks.md:227, and say archived with a non-empty outcome
      and results path clears resultGaps the same way complete does.
  - criterion: complete
    verdict: pass
    reason: >-
      The four passes are still the right calls. resultGaps
      (benchmarks.yaml:200-202) separates an unrun benchmark (`not run yet`)
      from a run one missing an outcome or a results path, which is what the
      rule's name and the gold row ask. An empty `ran` is noted and is not, by
      itself, a pass. Gold with no numeric threshold is justified at
      dx-benchmarks.md:227 and benchmarks.yaml:352-354.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The verdicts follow the check and the design table. The wrong line
      numbers are mechanical; a second reading of resultGaps and the gold row
      still passes all four criteria.
  - criterion: actionable
