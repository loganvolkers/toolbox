    reason: >-
      portal/assessments/rule-quality/rule/toolbox/maintainer-benchmark/results-recorded.yaml
      has no fail or unsure verdict, so there is no suggestion to apply.
summary: >-
  The rule is judged correctly, but three citations in the assessment do
  not land. The evidence pins are at standards.test.yaml:1204 and :1257,
  not :1191 and :1244, and the gold sentence is dx-benchmarks.md:227, not
  the silver row at :226. Archived entries clear the gap the same way
  complete ones do.
