verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Two of the four citations in
      portal/assessments/rule-quality/rule/toolbox/meta-connector/records-mapped.yaml
      land on unrelated code. The fix cited at
      portal/standards/meta.yaml:813-826 is the end of has-shape and the
      computed-readable rule. records-mapped is meta.yaml:857-866, with its
      fix at 861-863, and it was at 857 when the assessment was written
      (b15820e). "MapRule has no filter" cites
      crates/toolbox-model/src/manifest.rs:127-134, which is the end of
      Connector and the start of Kind. MapRule is manifest.rs:192-199 (172 at
      b15820e). The claims themselves hold: MapRule has only from, source, id,
      set and relations. connector_record is
      crates/toolbox-cli/src/model.rs:204-234 with the `record` substring test
      at 212, and docs/design/scorecards-for-scorecards.md:209 puts
      records-mapped at bronze.
    suggestion: >-
      Re-cite the fix as portal/standards/meta.yaml:861-863 (the rule is
      857-866) and MapRule as crates/toolbox-model/src/manifest.rs:192-199.
  - criterion: complete
    verdict: pass
    reason: >-
      The four passes follow from the code. model.rs:205-219 builds the mapped
      set from map rules whose `from` names this connector and whose `set` or
      a relation mentions `record`. The check is `entity.unmapped.size() == 0`
      (meta.yaml:859). The fix names the `map: - from: <connector>/<record>`
      shape (meta.yaml:862-863). The substring route (model.rs:212) is
      acknowledged: it needs a deliberately fake `set`, no cheaper than
      copying a field. There is no number, and the level is stated at
      scorecards-for-scorecards.md:209.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on model.rs:204-234 and MapRule's fields
      (manifest.rs:192-199). The one judgement, that `{'note': 'record'}` is
      deliberate deception no cheaper than a real mapping, is argued from the
      code at model.rs:212, so a second assessor reading it reaches the same
      pass.
  - criterion: actionable
    verdict: pass
    reason: >-
      Every verdict in
      portal/assessments/rule-quality/rule/toolbox/meta-connector/records-mapped.yaml
      is pass, so it has no suggestions to judge.
summary: >-
  The four passes are right, and connector_record (model.rs:204-234) is
  cited correctly. Two citations point at the wrong code, though: the fix
  at meta.yaml:813-826 (computed-readable; records-mapped is 857-866) and
  MapRule at manifest.rs:127-134 (now 192-199). Both were already wrong
  when the summary said the line numbers were updated.
