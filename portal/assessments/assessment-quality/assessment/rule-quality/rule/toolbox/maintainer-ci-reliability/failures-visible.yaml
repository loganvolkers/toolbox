apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:toolbox/maintainer-ci-reliability/failures-visible
rubric: assessment-quality
subjectHash: e6263d0909e1
assessor: {kind: agent, name: cursor-reviewer-09, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/toolbox/maintainer-ci-reliability/failures-visible.yaml
      land:
      - crates/toolbox-connector-workspace/src/workflows.rs:106-167
        (`masks_exit`, `skipped_on_default`, `hidden_failures`), 109 (the
        mask list), 115-128 (literal ref comparisons only) and 157-161 (a
        substring search over later steps);
      - portal/tests/standards.test.yaml:743 (`['jobs.deploy']`);
      - docs/design/thresholds.md:22 and 32.
      The report-action step (.github/workflows/ci.yml:244, 251) uses the
      outcome escape hatch. portal/results.json shows no failures-visible
      failure, so all 7 workflows pass.
  - criterion: complete
    verdict: fail
    reason: >-
      measures-intent should have failed. Two kinds of misfire show in
      workflows.rs:106-111.
      - Pass while missing the intent: routes such as `cmd || echo failed`,
        which the assessment files under hard-to-game, hide a failure without
        any gaming.
      - Fail while meeting the intent: `masks_exit` substring-matches the
        whole squashed script. A step that runs `set +e`, captures `$?` and
        then fails on it is flagged, though it hides nothing. So are a benign
        `rm -f x || true` cleanup and `|| true` inside a comment or an echoed
        string.
      The rubric's guidance names both directions: "could pass while missing
      the intent ... or fail while meeting it" (portal/standards/meta.yaml:1160-1161).
      The pass reason checks only that the flagged patterns match the fix.
    suggestion: >-
      Fail measures-intent. Name the over-match: `set +e` followed by an
      explicit status check, `|| true` on a cleanup command, and matches in
      comments or strings. Name the under-match too, such as `|| echo` and
      event-based skips. Suggest masking only the last command of a line,
      outside comments, and accepting `set +e` when a later line tests `$?`.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Every verdict is tied to a line of workflows.rs or thresholds.md that a
      second assessor can read. The disagreement over measures-intent comes
      from a missed source reading, not taste, and is recorded under complete.
  - criterion: actionable
    verdict: pass
    reason: >-
      The one fail, hard-to-game, has a suggestion that would close each route
      its reason names: - treat any `||` fallback that doesn't re-fail as
      masking (workflows.rs:109); - flag `if:` conditions that exclude push
      events (workflows.rs:115-128); - require the outcome to be compared, not
      just mentioned (workflows.rs:157-161).
summary: >-
  Well-cited, and its hard-to-game findings are real. But it passes
  measures-intent while workflows.rs:106-111 also flags scripts that hide
  nothing, such as `set +e` with a later status check, a `|| true`
  cleanup, or the text in a comment. The rubric counts a rule that fails
  while meeting its intent as a measures-intent fail.
