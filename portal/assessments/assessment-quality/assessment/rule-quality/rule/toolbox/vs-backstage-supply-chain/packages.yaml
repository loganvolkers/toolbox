verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The count and the bar claims in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-supply-chain/packages.yaml
      hold. experiments/backstage-compare/RESULTS.md:188 is 605 as 388 crates,
      142 Go modules and 75 npm packages, against Backstage's 2,791, and
      footprint.py:84-108 plus line 163 is that sum, including dev
      dependencies (line 86). backstage-comparison.yaml:596-597 is the `cargo
      tree -e normal` fix, and :598-601 is the "runs, scans and updates"
      rationale. 142 plus 75 is the 217 the fix ignores. README.md:46 sets
      only "high = 0", RESULTS.md:261-265 lists the 1,000-package bar among
      bars written after the smoke rounds, and RESEARCH.md:64 is the
      comparative F8 bar. ADJUDICATION.md:206 objects that only Cargo.lock was
      counted. The hard-to-game example does not follow the code it cites.
      cargo_packages (footprint.py:84-88) drops lock entries with no `source`
      line. `cargo vendor` leaves registry `source` lines in Cargo.lock, so it
      does not remove those entries. A path crate copied under crates/ does.
    suggestion: >-
      Drop `cargo vendor` from the hard-to-game reason. The route the cited
      function allows is replacing a registry dependency with a workspace path
      crate that has no `source` line.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent passes: the sum at footprint.py:163 is the set the
      rationale describes. hard-to-game still fails, because a workspace path
      copy is omitted by footprint.py:86-88 while the adopter still builds it.
      fix-leads-to-pass fails because `cargo tree -e normal` hides the dev and
      build dependencies the lockfile count includes, and the fix never
      mentions the Go or npm packages. The 1,000 bar has no pre-registered
      source, which is the threshold fail.
  - criterion: reproducible
    verdict: pass
    reason: >-
      RESULTS.md:188, the lockfile counter and the README bar are enough for a
      second assessor to pass measures-intent and fail the other three. The
      cargo-vendor example is not what decides the fail.
  - criterion: actionable
    verdict: pass
    reason: >-
      Counting workspace members that are not authored here would close the
      path-crate route. Pointing the fix at `cargo tree -e all`, the npm
      lockfile and `go version -m` would make the fix list the set that is
      counted. Justifying 1,000, or scoring only the comparison, would change
      the threshold verdict. Each suggestion is attached to the fail it would
      move.
summary: >-
  The 605-package count, the mismatched fix and the after-the-fact 1,000
  bar all match the files. The hard-to-game reason overreaches on one
  example: cargo vendor does not drop `source` lines, while a workspace
  path crate does.
