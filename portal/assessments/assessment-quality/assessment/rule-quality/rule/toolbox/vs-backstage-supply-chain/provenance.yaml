apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:toolbox/vs-backstage-supply-chain/provenance
rubric: assessment-quality
subjectHash: 6e2c1533682e
assessor: {kind: agent, name: cursor-reviewer-33, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Almost every citation in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-supply-chain/provenance.yaml
      holds. The field is "percent of its release artifacts"
      (portal/standards/backstage-comparison.yaml:69-71), footprint.py:58-61
      keeps only `x86_64-unknown-linux-gnu.tar.xz`, dist-workspace.toml:13
      lists five targets and :11 the two installers, image.yml:74 is the
      attest step, `gh attestation verify` is footprint.py:75-78, the fix is
      backstage-comparison.yaml:645-646, and D98
      (docs/decisions/D01M7XJYYDS0000000000000000.md:9) says `dist plan` fails
      when release.yml differs. One attribution is short: "five packages" is
      footprint.py:32-33 (`BS_PACKAGES`), not the loop at 141-149, which only
      shows that each package's latest version is read.
    suggestion: >-
      Cite footprint.py:32-33 for the five package names, and 141-149 for the
      latest-tag lookup.
  - criterion: complete
    verdict: pass
    reason: >-
      Both fails and both passes are right. Selecting one archive
      (footprint.py:59-60) is not "every release artifact"
      (backstage-comparison.yaml:71). The cryptographic check cannot be
      handwritten (footprint.py:76-77), so the cheapest pass of the check that
      exists is a real attestation, which is hard-to-game. Editing release.yml
      by hand is what D98 forbids; the attest switch is
      dist-workspace.toml:20-21. 100% is README.md:47 and
      experiments/backstage-compare/ADJUDICATION.md:110.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The narrow filter is footprint.py:59-60 and the forbidden edit is D98. A
      second assessor fails measures-intent and fix-leads-to-pass from those
      and passes the other two.
  - criterion: actionable
    verdict: pass
    reason: >-
      Verifying every release asset, and pointing the fix at
      `github-attestations` in dist-workspace.toml:20-21 plus image.yml:74,
      would make the measured percent cover the artifacts the field names and
      would stop an agent editing release.yml. Both suggestions in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-supply-chain/provenance.yaml
      change the fails they are attached to.
summary: >-
  The measure and the fix fails are right: only the Linux x86_64 archive
  is verified, and the fix sends agents to edit release.yml, which D98
  reserves for dist. The five Backstage packages are named at
  footprint.py:32-33, not in the latest-tag loop at 141-149.
