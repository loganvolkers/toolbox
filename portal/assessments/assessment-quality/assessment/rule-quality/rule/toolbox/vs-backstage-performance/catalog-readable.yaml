at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Most citations in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-performance/catalog-readable.yaml
      land. measure.py:166-167 and 264-267 are the probe and the timing.
      README.md:22 is the bulk POST, and RESEARCH.md:90-91 (§1.1) names the
      git-files connector. README.md:37 has the 60 s bar, and plan.md:921 and
      v1-spec.md:523 have the 60 s freshness budget. Two citations don't hold.
      hard-to-game says "a partial snapshot that answers c{n-1} first would
      fail the gate". But loaded_s is taken at measure.py:267, and the gate
      runs only after a 2 s sleep (measure.py:268-273). A catalog that
      completes within that window passes the gate with its early time kept.
      The gate catches only a catalog that is still incomplete. Second,
      D01M857ZB468ZM2YS6GNSEG6YB9 says nothing about levels. The single bronze
      level is backstage-comparison.yaml:222.
    suggestion: >-
      Say the gate refuses a catalog that never completes, not one that
      completes late. Cite backstage-comparison.yaml:222 for the level.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts stand. Toolbox publishes a snapshot only after a full
      recompute (crates/toolbox-api/src/state.rs:161-183), so c{n-1} readable
      means every component is readable. Exploiting the gate's timing would
      mean deliberately publishing partial snapshots, which is not the
      cheapest way to pass. The bulk-POST deviation is named in
      measures-intent, and it is the remote connector's real path
      (docs/design/connector-control.md:51).
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on harness code, the pre-registered bar and the
      plan's budget. A second assessor reading measure.py:258-273 and
      README.md:37 reaches the same four passes.
  - criterion: actionable
    verdict: pass
    reason: >-
      There are no fail or unsure verdicts in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-performance/catalog-readable.yaml,
      so no suggestion is needed.
summary: >-
  The four passes are right. Toolbox's atomic snapshot makes the last-id
  probe sound, and the bar is the plan's 60 s freshness budget. But the
  hard-to-game reason credits the equivalence gate with stopping an early
  partial pass, which it can't: the gate runs after the time is taken. The
  level is also attributed to a decision that doesn't set it.
