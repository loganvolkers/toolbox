apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:toolbox/vs-backstage-performance/ready
rubric: assessment-quality
subjectHash: 9980018ec54c
assessor: {kind: agent, name: cursor-reviewer-16, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Almost every citation in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-performance/ready.yaml
      holds. RESEARCH.md:150 asks for cold start "with a populated database".
      measure.py:141-144 drops the database and 258-264 times readiness before
      `load`. routes.rs:144-160 is `readyz`, and v1-spec.md:515 says ready
      means first recompute plus OpenFGA. README.md:36 has the 10 s bar,
      ADJUDICATION.md:103-107 implements it and 384-386 is R3.2. Plan line 923
      says < 60 s, v1-spec line 526 says ≤ 15 s, and
      portal/comparisons/toolbox.yaml:10 has readyS 0.9. The exception is the
      citation of D01M857ZB468ZM2YS6GNSEG6YB9 for "Bronze is the comparative
      scorecard's only level". That decision defines standings from values
      (its §2) and says nothing about levels. The single level comes from
      `levels: [bronze]` at portal/standards/backstage-comparison.yaml:222.
    suggestion: >-
      Cite backstage-comparison.yaml:222 for the single level, and keep the
      decision only for "the standing comes from the values".
  - criterion: complete
    verdict: unsure
    reason: >-
      The measures-intent fail is right, and so are fix-leads-to-pass and
      threshold-justified. hard-to-game says nothing in the code can be
      changed to make the rule pass without a faster start. But the value ends
      when the product's own readiness endpoint returns 200
      (experiments/backstage-compare/measure.py:155-156, 260-262), and that
      endpoint is product code (crates/toolbox-api/src/routes.rs:144-160). A
      `readyz` that answered before the first snapshot would lower readyS and
      pass the rule. It would leave catalog-readable and recovery unchanged.
      The Cloud Run startup probe that relies on readyz (docs/v1-spec.md:515)
      is what makes that unattractive, so this is a judgement rather than a
      clear fail.
    suggestion: >-
      Have hard-to-game weigh the self-reported readiness. Either pass it
      while naming what deters a lying readyz, or mark it unsure. For the
      rule, time ready as "first authorized read answers" rather than the
      product's own probe.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The measures-intent fail rests on lines a second assessor reads the same
      way: the rationale's "crashed or rescheduled instance"
      (backstage-comparison.yaml:237-238), RESEARCH.md:150 and the
      drop-and-recreate in measure.py:141-144. The other verdicts rest on
      pre-registered bars and the harness code.
  - criterion: actionable
    verdict: pass
    reason: >-
      The one fail, measures-intent, offers two routes. Timing readyS on a
      restart against the populated database, as RESEARCH.md:150 asks, would
      make the value match the rationale. So would narrowing the rationale to
      an empty first start. Either changes that verdict to pass.
summary: >-
  A careful assessment whose measures-intent fail (an empty-database start
  timed against a rescheduled-instance rationale) checks out line by line.
  Two points weaken it. It cites D01M857ZB468ZM2YS6GNSEG6YB9 for the
  single bronze level, which that decision does not set. Its hard-to-game
  pass overlooks that the timed endpoint is the product's own readyz.
