verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Some citations in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-performance/get-latency.yaml
      land: measure.py:92-94 and 172-175, routes.rs:412-437 (`get_entity`),
      ADJUDICATION.md:540-542, README.md:109-112, plan.md:920 and
      RESEARCH.md:60 (F4, Dean and Barroso). Three do not hold. First,
      ADJUDICATION.md:197 is the request-logging threat. The spread over all
      10,000 ids is line 198. Second, line 198 does not call that spread
      uncached: Toolbox's reads are "authorization-cache hits after the
      first", and many users and snapshot churn were not tested. Third,
      D01M857ZB468ZM2YS6GNSEG6YB9 says nothing about levels; the single bronze
      level is backstage-comparison.yaml:222.
    suggestion: >-
      Cite ADJUDICATION.md:198 and call the 1.08 ms p95 a cached spread. For
      the uncached case, cite the check budget, p95 ≤ 10 ms
      (docs/v1-spec.md:524). Cite backstage-comparison.yaml:222 for the level.
  - criterion: complete
    verdict: fail
    reason: >-
      hard-to-game should not pass on "Throughput counts only 200 responses".
      That is true of the rps (measure.py:128-130). But the p95 is oha's
      percentile over every response, errors included (measure.py:124-127),
      and snapshot.py:43 copies p95ms without checking `ok`. A server that
      answered fast 401s, 404s or 429s under load would lower getP95Ms and
      pass. ok = 1.0 in round 3 only because the adjudicator checked it by
      hand (ADJUDICATION.md:385-386). measures-intent still passes: even an
      uncached check fits the 50 ms bar (docs/v1-spec.md:524).
    suggestion: >-
      Fail hard-to-game, or mark it unsure, naming measure.py:124-127 and
      snapshot.py:43. Suggest that snapshot.py refuse a read with ok < 1, or
      take the p95 over 200s only.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on harness code and a pre-registered bar. A second
      assessor would trace the same `get_entity` path and the same oha output.
      They would also find the p95 error gap, which is a fact of measure.py,
      not taste.
  - criterion: actionable
    verdict: pass
    reason: >-
      There are no fail or unsure verdicts in
      portal/assessments/rule-quality/rule/toolbox/vs-backstage-performance/get-latency.yaml,
      so no suggestion is needed.
summary: >-
  The measures-intent, fix and threshold passes hold, though for a
  slightly different reason than stated. The 10,000-id spread is line 198,
  not 197, and it is still mostly cache hits, not uncached. The
  hard-to-game pass is wrong: only throughput discounts errors, so a p95
  taken over fast errors would pass.
