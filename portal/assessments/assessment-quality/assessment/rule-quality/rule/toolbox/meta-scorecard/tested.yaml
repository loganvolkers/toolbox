      says D01M831P5QWJQ4A2FT85N5MXJQF removed the bare-mention standard for
      rules; that decision's third change is that a rule is tested only by an
      expectation on its own scorecard, and the "bare mention doesn't count"
      sentence is portal/standards/meta.yaml:451-452, not the decision.
    suggestion: >-
      Cite portal/toolbox.yaml:470 for the test file list, and cite
      portal/standards/meta.yaml:449-452 for the rule-level pin. Keep the
      decision only for the own-scorecard change it actually states.
