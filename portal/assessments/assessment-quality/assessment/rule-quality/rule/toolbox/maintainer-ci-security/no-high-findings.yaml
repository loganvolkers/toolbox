apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:toolbox/maintainer-ci-security/no-high-findings
rubric: assessment-quality
subjectHash: 073b2424254c
assessor: {kind: agent, name: cursor-reviewer-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Reproduced with zizmor 1.32.0. Under `--offline -v` it logs skipping
      impostor-commit, ref-confusion, known-vulnerable-actions,
      stale-action-refs and ref-version-mismatch for want of a token. A
      SHA-pinned tj-actions/changed-files step gives no findings. On a
      pull_request_target workflow, `# zizmor: ignore[template-injection]`
      drops that result from the SARIF, and the remaining one has no
      `suppressions`, so lint.rs:167-169 and 214 count nothing suppressed. The
      other citations in
      portal/assessments/rule-quality/rule/toolbox/maintainer-ci-security/no-high-findings.yaml
      also land: github-actions.yaml:17-22, 219-229, waivers.yaml:1-2,
      ci.yml:108, standards.test.yaml:120-143,
      github-actions-standards.md:83-84 and 145-146.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent fails rightly. The rationale's own words, "zizmor's
      high-severity audits … One is enough" (github-actions.yaml:226-229),
      cover the skipped impostor-commit audit. hard-to-game fails rightly as
      well, since an inline ignore is the rubric's "suppression". The
      `unpinned-uses` exclusion (D01M84CCDH1ZWF9726SVDDM1JDX) leaves no double
      count, because zizmor rates it High and pinned-to-sha owns it.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Both fails reproduce on scratch workflows in seconds. The offline choice
      is deliberate (github-actions-standards.md:100-103), but the reason
      judges the rule against its rationale, not the design choice.
  - criterion: actionable
    verdict: pass
    reason: >-
      `--no-ignores` works as suggested: on the ignored scratch workflow it
      restored the template-injection result, which flips hard-to-game. A
      description scoped to the offline audits plus a token-holding zizmor
      connector would align measures-intent.
summary: >-
  Trustworthy. Every zizmor behaviour the reasons describe reproduces with
  1.32.0: the token-only audits are skipped, and a SHA-pinned vulnerable
  action and a reason-less inline ignore both pass. The cited lines land,
  and the suggested `--no-ignores` restores the hidden finding.
