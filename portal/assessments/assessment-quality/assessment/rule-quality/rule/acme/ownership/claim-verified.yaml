assessor: {kind: agent, name: cursor-reviewer-18, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/acme/ownership/claim-verified.yaml
      mostly hold. crates/toolbox-derive/src/lib.rs:957-989 is `authority` and
      1313-1333 is `codeowners_for`. In examples/reference-portal/toolbox.yaml
      the rule is at 197-206, its fix at 200-202, the links at 179-183 and the
      scorecard rationale at 173-178. fixtures/github.ndjson:8 gives ledger `*
      @acme/platform`, fixtures/git-files.ndjson gives its claim
      `group:payments`, and fixtures/idp.ndjson gives every group a
      `githubTeam`. One line is off: `teamField` is at toolbox.yaml:106, not
      :105 (that line is `path`).
  - criterion: complete
    verdict: fail
    reason: >-
      measures-intent should fail. The rule can fail while meeting its intent.
      `codeowners_for` matches a pattern only as `*`, as `/` plus the exact
      path, or through a `glob` where `*` is literal per character
      (lib.rs:1320, 1336-1356). GitHub's `/*` and `**/catalog-info.yaml` both
      cover the root catalog-info.yaml. Neither matches here. `/*` is not `*`,
      its prefix-stripped `*` is not the path, and `glob` fails on the leading
      `/`. `**/` needs a `/` in the path. So a repository whose CODEOWNERS
      says `/* @acme/payments` gets `unverified` and fails silver with a
      correctly backed claim. The assessment cites these exact lines and calls
      the check "D17's rule". The rubric fails a rule that can "fail while
      meeting it" (portal/standards/meta.yaml:1160-1161). The other three
      verdicts are right.
    suggestion: >-
      Fail measures-intent. Name the gitignore-style patterns `/*` and
      `**/catalog-info.yaml` that `codeowners_for` misses. Suggest matching
      CODEOWNERS with a gitignore-compatible matcher (e.g. the `ignore`
      crate's gitignore builder), with fixtures for both patterns.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The pattern misfire is in code a second assessor can read, so once it is
      noticed it isn't a matter of taste. The hard-to-game pass leaves review
      to branch-protected, as the scorecard rationale does
      (toolbox.yaml:173-178), and would reproduce.
  - criterion: actionable
    verdict: pass
    reason: >-
      There are no fail or unsure verdicts in
      portal/assessments/rule-quality/rule/acme/ownership/claim-verified.yaml,
      so no suggestion is needed. The summary's note that the fix should
      mention the IdP's `githubTeam` mapping is a sound improvement for
      fix-leads-to-pass.
summary: >-
  The citations hold apart from one off-by-one, and three verdicts are
  right. The assessment cites `codeowners_for` but misses that its matcher
  isn't gitignore-compatible. Valid catch-alls such as `/*` and
  `**/catalog-info.yaml` leave a backed claim `unverified`, so
  measures-intent should fail.
