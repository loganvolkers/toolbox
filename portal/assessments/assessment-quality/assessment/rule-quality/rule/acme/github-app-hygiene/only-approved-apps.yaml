apiVersion: toolbox.dev/assessment/v1
entity: assessment:rule-quality/rule:acme/github-app-hygiene/only-approved-apps
rubric: assessment-quality
subjectHash: 5f06d757c547
assessor: {kind: agent, name: cursor-reviewer-18, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/rule-quality/rule/acme/github-app-hygiene/only-approved-apps.yaml
      hold. In examples/reference-portal/toolbox.yaml the check is at 246, the
      `eligible` keys at 26 and 32, and the actions at 304-364. The scorecard
      rationale is at 232-236. `rg eligible` over crates/ and the reference
      portal's tools finds nothing that evaluates it, only a test fixture
      (crates/toolbox-derive/tests/reference.rs:79).
      crates/toolbox-connector-github/src/main.rs:207-215 calls `GET
      /user/installations/{id}/repositories`, the limit that
      docs/examples/approved-github-apps.md:148 and docs/questions.md Q14
      describe. `request-new-app` appears only at design :70. One line is off:
      app-approval's `appliesTo` is at toolbox.yaml:267, not :268.
  - criterion: complete
    verdict: fail
    reason: >-
      hard-to-game should be unsure, not pass. A one-line `sketchy-bot: {}`
      under `policies.approvedApps` makes checkout-web pass this rule
      (toolbox.yaml:246). app-approval would then fail githubapp:sketchy-bot,
      but that is a different entity's score, and nothing in it holds this
      repository's level down. Copying the app's current permissions passes
      both. Whether either edit gets a security review depends on who owns the
      inline policy block, which nothing in the portal enforces
      (toolbox.yaml:13-14, no CODEOWNERS in examples/reference-portal/). The
      same assessor made the same point for permissions-match-snapshot and
      judged it unsure there
      (portal/assessments/rule-quality/rule/acme/app-approval/permissions-match-snapshot.yaml).
      The other three verdicts are right. The eligibility half of
      measures-intent is arguable, since the rule's name and rationale
      (toolbox.yaml:244-253) promise only "approved list". The fail stands on
      the incomplete installation listing alone.
    suggestion: >-
      Make hard-to-game unsure, with the same reason as the sibling
      assessment: the cheapest pass is a policy edit, and whether that is
      reviewed depends on CODEOWNERS for a policy file the portal doesn't
      have.
  - criterion: reproducible
    verdict: unsure
    reason: >-
      Two verdicts are judgement calls. On hard-to-game, the assessor reached
      opposite answers here and in the sibling assessment on the same policy
      edit question. On measures-intent, eligibility is read as part of
      "approved" although the rule never says so (toolbox.yaml:244-253). A
      second assessor could reasonably differ on both. The listing gap and the
      missing `request-new-app` would reproduce.
    suggestion: >-
      Rest measures-intent on the installation-listing gap (main.rs:207-215,
      Q14), and present eligibility as a separate gap at scorecard level.
      Align hard-to-game with the sibling assessment.
  - criterion: actionable
    verdict: pass
    reason: >-
      Each suggestion would change its verdict. Evaluating `eligible` and
      returning unknown on an incomplete listing addresses both
      measures-intent routes. Evidence naming the unapproved apps, plus a fix
      pointing at `remove-app` (toolbox.yaml:341-364) rather than the missing
      `request-new-app`, fixes fix-leads-to-pass.
summary: >-
  The citations hold and the measures-intent and fix-leads-to-pass fails
  are right. hard-to-game is passed on the assumption that policy edits
  get security review, an assumption the same assessor rated unsure for
  the sibling rule. A bare policy key raises this repository's score
  without touching any permissions snapshot. Eligibility is a stretch as
  part of this rule's intent.
