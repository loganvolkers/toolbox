verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/sdlc-stage-quality/sdlc-stage/package-author/package.yaml
      land. portal/sdlc/stages/package-author.yaml:80-81 is `commands: []` and
      `checks: []`. crates/seikika-model/src/package.rs:105-106 is
      `content_hash` over a directory, and package.rs:85-91 keys checkouts by
      version. docs/design/packages.md:206-213 is the §4.4 archive and OCI
      proposal. packages/github-actions/fragments/github-actions.yaml:59-66
      pins tools by version and installer ids, with no checksum, and
      schema/manifest.schema.json has no checksum field. load.rs:344-351
      compares the directory hash with seikika.lock.
  - criterion: complete
    verdict: fail
    reason: >-
      reuses-artifacts should not fail. The guidance fails a stage "when
      consumers compile Seikika or install tools by hand" and passes it "when
      nothing is built or installed in the stage"
      (portal/standards/sdlc.yaml:417-418). The stage has no commands
      (package-author.yaml:80). Consumers compile nothing. They `seikika
      install` a tag pinned by content hash
      (crates/seikika-cli/src/install.rs:194-218, load.rs:344-351), and they
      install tools with `seikika tools install` at pinned versions
      (github-actions.yaml:57-62), not by hand. What the reason describes (no
      archive, no tool checksums) is the missing exit criterion, which
      executable-exit and agent-can-complete already count. The other three
      fails are right. The tool-pin checksum half needs a schema change, so
      decoupled-from-core fails too.
    suggestion: >-
      Pass reuses-artifacts, or mark it unsure. Keep the archive and checksum
      gap under executable-exit and agent-can-complete, where it belongs.
  - criterion: reproducible
    verdict: unsure
    reason: >-
      The same assessor passed reuses-artifacts for user/monitor, a stage with
      `commands: []`, because "Nothing is built or installed in the stage"
      (portal/assessments/sdlc-stage-quality/sdlc-stage/user/monitor.yaml,
      reuses-artifacts). Here it fails the same criterion on equally empty
      commands. A second assessor could reach either verdict. The other three
      verdicts follow from `checks: []`, `commands: []` and the resolver code.
    suggestion: >-
      Apply sdlc.yaml:417-418 the same way across stages. Judge what the stage
      builds or installs, not what it fails to produce.
  - criterion: actionable
    verdict: pass
    reason: >-
      Each suggestion would change its verdict. `seikika package build` with a
      twice-built CI diff gives executable-exit a check (package.yaml lines
      15-18). An archive command plus checksummed `tools:` gives an agent
      something to run (lines 27-28). An archive format the resolver accepts
      removes the core dependency (lines 48-50).
summary: >-
  The citations hold, and executable-exit, agent-can-complete and
  decoupled-from-core fail correctly. reuses-artifacts should not fail.
  Consumers compile nothing and install nothing by hand
  (sdlc.yaml:417-418), and the same assessor passed the criterion for
  user/monitor, which also has no commands.
