  - criterion: reproducible
    verdict: unsure
    reason: >-
      executable-exit rests on reading `checks:` loosely. The rubric fails a
      stage "when nothing in `checks:` would fail if the exit criterion were
      not met" (portal/standards/sdlc.yaml:403-405). The only listed check is
