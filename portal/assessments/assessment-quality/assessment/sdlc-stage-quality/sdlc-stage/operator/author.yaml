      `seikika.yaml /portal: "owner" is a required property` and exited 1, and
      the pristine copy exited 0.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts fit the stage (portal/sdlc/stages/operator.yaml:3-14). The
      TypeScript route is the recorded gap (line 14), and the assessment
      correctly scopes agent-can-complete to the YAML route the CLI supports.
      It also surfaces a defect the stage omits, the `--dev` flag. No source I
