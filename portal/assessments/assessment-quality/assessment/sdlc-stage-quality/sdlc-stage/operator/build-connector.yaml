apiVersion: toolbox.dev/assessment/v1
entity: assessment:sdlc-stage-quality/sdlc-stage:operator/build-connector
rubric: assessment-quality
subjectHash: d8e2a4fed420
assessor: {kind: agent, name: cursor-reviewer-38, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Three of the four reasons in
      portal/assessments/sdlc-stage-quality/sdlc-stage/operator/build-connector.yaml
      match the stage at portal/sdlc/stages/operator.yaml:15-33. toolbox
      connector test runs crates/toolbox-connect/src/conformance.rs (the CLI
      calls conformance::run and exits 1 when a check fails,
      crates/toolbox-cli/src/main.rs:1138-1162), and
      crates/toolbox-connect/src/conformance.rs:5 and :109 validate messages
      against the connector schema. crates/toolbox-cli/tests/install.rs:174
      refuses a tampered archive. The stage lists those two checks and the
      four commands, and its gap is "no scaffold or SDK outside Rust".
      binary_for resolves github: packages from the install cache
      (crates/toolbox-api/src/connectors.rs:213-219, D90). The
      reuses-artifacts path does not exist:
      crates/toolbox-api/src/artifacts.rs is not a file. toolbox install's
      github: download is crates/toolbox-model/src/artifacts.rs:1-5,
      re-exported by crates/toolbox-api/src/lib.rs:6.
    suggestion: >-
      Cite crates/toolbox-model/src/artifacts.rs for the download, and
      crates/toolbox-api/src/connectors.rs:213-219 for the cache lookup. The
      claim that toolbox install downloads github:owner/repo@v1 is that file's
      header.
  - criterion: complete
    verdict: pass
    reason: >-
      executable-exit passes because the stage's checks are the conformance
      kit and the install test, and a protocol failure exits 1
      (main.rs:1158-1162). agent-can-complete is rightly unsure: the stage gap
      names the missing scaffold, and docs/design/connector-control.md
      describes stdio and remote HTTP (docs/design/connector-control.md:50-52)
      without a rule for which one an operator should build. reuses-artifacts
      and decoupled-from-core still pass from the model file and binary_for:
      an operator installs a released package or pushes to /v1/ingest, and
      does not add a crate to this repository. The wrong path is not a missed
      fail.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The stage record at portal/sdlc/stages/operator.yaml:15-33, the
      conformance exit and binary_for are enough for a second assessor to pass
      three criteria and stay unsure on agent-can-complete. The unsure is the
      missing scaffold the stage itself lists, not a preference about Rust.
  - criterion: actionable
    verdict: pass
    reason: >-
      Adding toolbox connector new, which
      docs/design/package-author-sdlc.md:126 already proposes, and ending at a
      passing conformance run, would remove the gap the stage records and give
      agent-can-complete a command instead of an open choice. That is the
      verdict the suggestion is attached to.
summary: >-
  The stage assessment is right about the conformance exit, the missing
  scaffold and install-from-a-release. It cites
  crates/toolbox-api/src/artifacts.rs, which is not a file; the download
  lives in crates/toolbox-model/src/artifacts.rs.
