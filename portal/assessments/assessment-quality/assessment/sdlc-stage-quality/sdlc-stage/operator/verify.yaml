    reason: >-
      executable-exit fails because checks is empty, so nothing fails when the
      named command is absent. agent-can-complete fails because the command
      does not exist and matching the plan needs plan --remote.
      reuses-artifacts passes because the design points a released CLI at a
      URL and builds nothing. decoupled-from-core fails because the exit
      criterion needs a new subcommand in this repository's CLI.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The three fails are the empty checks list, the missing subcommand and
      the design section. A second assessor reading operator.yaml:99-104 and
      the Command enum reaches the same verdicts.
  - criterion: actionable
