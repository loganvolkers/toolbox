summary: >-
  The verify assessment is trustworthy. The stage's exit criterion names
  seikika verify, the CLI has no such subcommand, and the probes exist
  only in the design. The readiness endpoints the interim checklist would
  use are already in detach.rs. All four review criteria pass.
