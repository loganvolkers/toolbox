apiVersion: seikika.com/assessment/v1
entity: assessment:sdlc-stage-quality/sdlc-stage:operator/monitor
rubric: assessment-quality
subjectHash: d592f134cc90
assessor: {kind: agent, name: cursor-reviewer-31, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      portal/assessments/sdlc-stage-quality/sdlc-stage/operator/monitor.yaml
      says scripts/m4-acceptance.sh exercises serve health, readiness and the
      metrics endpoint. The script waits on /readyz
      (scripts/m4-acceptance.sh:40) and reads /v1/views/ops (:46, :57). It
      never requests /metrics. The catalog, lag and trace_id checks are in
      experiments/otel-testbed/scripts/score.sh (:110, :144, :156, :175),
      which CI runs (.github/workflows/ci.yml:116-129) and which the stage
      does not list. The stage's checks are only m4-acceptance.sh
      (portal/sdlc/stages/operator.yaml:116). pin.env does pin otelcol-contrib
      by SHA-256, and the Grafana gap is the stage's own gaps text (:119-122).
      score.sh defaults SEIKIKA to target/debug/seikika (score.sh:13), not a
      released binary.
    suggestion: >-
      Attribute /metrics, snapshot lag and trace_id to score.sh, and say
      m4-acceptance.sh checks readiness and the ops view only.
  - criterion: complete
    verdict: fail
    reason: >-
      executable-exit should fail. The exit criterion requires the ops view
      and metrics to show freshness and snapshot lag, and OTLP and /metrics to
      carry the catalog (operator.yaml:112-114). The only entry in checks: is
      m4-acceptance.sh, which still passes if /metrics and the OTLP export are
      absent. score.sh would fail, and it is not in checks:.
      agent-can-complete can stay a pass: observability.md:31-33 names the
      testbed. decoupled-from-core can stay a pass: an operator sets OTEL_* on
      a deployed portal. reuses-artifacts is the closer call and can stay a
      pass for an operator scraping a running portal, with the testbed's debug
      binary noted above.
    suggestion: >-
      Fail executable-exit until portal/sdlc/stages/operator.yaml lists
      experiments/otel-testbed/scripts/score.sh under checks:, or until
      m4-acceptance.sh itself fails when /metrics lacks the catalog.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Whether m4 requests /metrics is a search of the script, and the checks
      list is one line in operator.yaml. A second assessor fails
      executable-exit for that reason. The other three passes are the same
      reading of the stage file and observability.md.
  - criterion: actionable
    verdict: pass
    reason: >-
      All four verdicts in the reviewed assessment are pass, so it attaches no
      suggestion. The missed fail is named here; there is no suggestion on
      that file to judge against a fail.
summary: >-
  Not trustworthy on executable-exit. m4-acceptance.sh checks readiness
  and the ops view and never requests /metrics. The lag, catalog and
  trace_id checks are in score.sh, which is not in the stage's checks
  list, so that criterion should have failed. The other three passes can
  stand.
