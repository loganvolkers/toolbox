summary: >-
  A sound assessment. The citations now hold at the current commit, the
  counts are right (28 documented public items, 13 passing tests), and the
  new tests reach the branches the previous review said were untested,
  which I checked by instrumenting a scratch copy. The only overstatement
  is "each branch has a direct test", which misses to_cel's trivial Null
  arm (eval.rs:48) and changes no verdict.
