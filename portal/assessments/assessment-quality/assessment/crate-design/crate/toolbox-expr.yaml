verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation now says what its reason claims. The callers are at
      crates/toolbox-derive/src/lib.rs:15 and 832 (`Err(_) => "unknown"`),
      testing.rs:10, crates/toolbox-api/src/routes.rs:17 and 212,
      actions.rs:15, crates/toolbox-model/src/validate.rs:13 and 775-779,
      crates/toolbox-cli/src/meta.rs:183 and model.rs:28, 160. The crate's own
      lines hold: lib.rs:1-17, 16-17, 149-200 and 177-185, eval.rs:13, 93-95,
      107, 111, 249-282, 284-291, 294, 315 and 339-360, lazy.rs:80-90, and
      analysis.rs:150-184, 190-212 and 228. So do docs/v1-spec.md:89,
      docs/questions.md:18 and Cargo.toml:11. The counts hold too: pubItems
      and pubDocumented are 28, and `cargo test -q -p toolbox-expr` runs 13
      tests that all pass. In a scratch copy, `'a'` and `-1` reach
      LazyList::get's type-error and out-of-bounds arms. One phrase
      overstates: "each branch has a direct test" misses to_cel's Null arm
      (eval.rs:48), which no test feeds JSON null. It is a one-line identity
      mapping, and the verdict doesn't rest on it.
  - criterion: complete
    verdict: pass
    reason: >-
      The gaps the previous review named now have direct tests. check()
      reports UndeclaredFunctions for `join` and keeps the declared `size`
      (lib.rs:177-185). Int, uint and bool map keys become JSON strings
      (eval.rs:284-291). Bad lazy indexes are refused (eval.rs:272-281). No
      other risky path in the crate is left untested. The workspace members
      (Cargo.toml:3-5, experiments excluded) name `cel` only in
      crates/toolbox-expr/Cargo.toml. No public signature names a cel type.
      The spec row's "error mapping to `unknown`" sits in the caller, and
      one-responsibility says so openly. Its rubric fails only missing, stale
      or multi-job crate docs, and lib.rs:1-17 is none of those.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict follows from something the sources state, not from taste.
      one-responsibility rests on the crate docs
      (crates/toolbox-expr/src/lib.rs:1-17) against the spec row
      (docs/v1-spec.md:89). small-contract rests on the callers' imports
      (crates/toolbox-derive/src/lib.rs:15,
      crates/toolbox-api/src/routes.rs:17,
      crates/toolbox-model/src/validate.rs:13 and 775-779) and the brief's
      pubItems and pubDocumented, both 28. replaceable-defaults rests on
      crates/toolbox-expr/Cargo.toml:11 being the only workspace `cel`
      dependency (Cargo.toml:3-5) and on the pub(crate) fields at
      crates/toolbox-expr/src/eval.rs:13 and 111. tests-match-risk no longer
      calls indirect coverage "small". Each branch it lists has a named test
      (crates/toolbox-expr/src/lib.rs:177-185, eval.rs:249-291), and `cargo
      test -q -p toolbox-expr` reports "13 passed; 0 failed". A second
      assessor reading those files reaches pass.
  - criterion: actionable
    verdict: pass
    reason: >-
      No verdict is fail or unsure, so no suggestion has a verdict to change.
      The one optional suggestion, a cel-spec conformance slice through Expr
      recorded in docs/research-log.md (Q10, docs/questions.md:18), is
      concrete. It targets the residual risk the reason names: cel-rust
      behaviour the crate relies on, such as comparing int with double
