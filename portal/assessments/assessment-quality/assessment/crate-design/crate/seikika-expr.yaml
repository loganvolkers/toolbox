summary: >-
  A trustworthy assessment. Its citations hold at the current tree, the
  test count (14, all passing) reproduces, and its verdicts follow from
  the crate docs, the callers' imports and the tests. Three details are
  off: eval.rs:234 should be 235; "no other Cargo.toml names `cel`"
  ignores the experiments that Cargo.toml:5 excludes from the workspace;
  and the analysis:: items are public through the module, not re-exported.
  None of them changes a verdict.
