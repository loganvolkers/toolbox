entity: assessment:crate-design/crate:seikika-api
rubric: assessment-quality
subjectHash: 7e066f5d9aa7
assessor: {kind: agent, name: cursor-reviewer-19, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in portal/assessments/crate-design/crate/seikika-api.yaml
      hold. crates/seikika-api/src/lib.rs:1-2 is the pre-M4 doc, lib.rs:4-15
      the pub modules, and the Cargo description says MCP and the UI "arrive
      in M4". docs/v1-spec.md:94 and :96 are the seikika-connect and
      seikika-api rows. state.rs:90, 93 and 94 hold `dyn Authorizer`, `dyn
      Store` and `Option<PgStore>`. `pg.try_lead` is state.rs:278, `pg.runs`
      and `put_run`/`put_spent` are actions.rs:158-159 and 189-194, and the
      file backend sits beside them. The CLI uses `binary_for`,
      `resolve_config`, `approval_key_for`, `signing_seed` and `served_dir` at
      exactly the cited lines (report.rs:162-163 and 1445-1446,
      install.rs:331, main.rs:1126, run.rs:314 and 687, detach.rs:28 and 195).
      DELETION_THRESHOLD (connectors.rs:22) and `connector_of`
      (routes.rs:654-671) match no test or script, and nothing sets
      SEIKIKA_CONNECTOR_TOKENS. The only tests in connectors.rs:580-622 cover
      env scrubbing and secret resolution. `markdown` spans mcp.rs:619-996,
      which is 378 lines. One aside is loose, though no verdict rests on it:
      "no `rmcp` in any Cargo.toml" ignores
      experiments/build-cost/Cargo.toml:17. No workspace crate uses rmcp,
      which is the point the reason makes.
  - criterion: complete
    verdict: pass
    reason: >-
      All four fails are what the rubric's guidance asks for
      (portal/standards/crates.yaml:463-492). The docs are stale, which is
      one-responsibility's named fail. seikika-cli reaches into
      `connectors`/`actions` internals, which fails small-contract. A public
      signature names `PgStore`, which fails replaceable-defaults (lib.rs:43).
      Untested ingest guards are among the "protocol handling" risks. I found
      no further failure the sources show. The fixture-side kind check in
      seikika-model/src/messages.rs:56-67 is tested (tests/cases.json:27), but
      it is validation, not the server's ingest path, so the assessment is
      right to call the server path untested.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on something a second assessor can grep: the doc text
      at lib.rs:1-2, the `seikika_api::` uses in crates/seikika-cli, the `pg:
      Option<PgStore>` parameter at lib.rs:43, and searches for
      DELETION_THRESHOLD and connector_tokens that match no test. None of it
      rests on taste.
  - criterion: actionable
    verdict: pass
    reason: >-
      Each suggestion in
      portal/assessments/crate-design/crate/seikika-api.yaml:28-112 would flip
      its verdict. Rewriting the docs and the spec rows fixes the staleness.
      Moving the five helpers and making the modules `pub(crate)` removes the
      internal reach. A run-store trait drops `PgStore` from `app_state_with`.
      The four ingest tests cover the three untested guards. One detail is
      off: "401 with another connector's token" would authenticate as that
      other connector (routes.rs:660-664), not return 401. The author of that
      test would find this at once, and the rest of the suggestion stands.
summary: >-
  A trustworthy assessment. Its line-level citations into seikika-api,
  seikika-cli and v1-spec §4 check out, the four fails follow the rubric's
  own guidance, and the suggestions would flip them. The only slips are
  minor and change no verdict: an aside overlooks rmcp in an experiment's
  Cargo.toml, and one test step expects 401 for another connector's token.
