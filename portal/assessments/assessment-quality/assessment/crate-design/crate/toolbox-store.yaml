apiVersion: toolbox.dev/assessment/v1
entity: assessment:crate-design/crate:toolbox-store
rubric: assessment-quality
subjectHash: 485a9d838c01
assessor: {kind: agent, name: cursor-reviewer-20, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      portal/assessments/crate-design/crate/toolbox-store.yaml land.
      v1-spec.md:91 is the spec row. lib.rs:1-3 still says "`PgStore` arrives
      with M2". In pg.rs, `pub pool: PgPool` is 17-20 and try_lead 238-247
      returns `PoolConnection<Postgres>`. The revision Conflict is
      pg.rs:132-138, the token lookup 325-328 and the runs and spent tokens
      337-377. lib.rs:68 is the trait's next-revision rule, and MemStore's
      put_native (lib.rs:135-148) keeps the highest revision. The leaks are
      server.rs:90 `install_tuple_view(&pg.pool, …)`, openfga.rs:414,
      toolbox-authz Cargo.toml:18 (sqlx) and state.rs:278. actions.rs:158-159
      reads runs and spent tokens back, and the lib.rs tests are at 233, 265
      and 279. One detail is wrong: routes.rs:647-648 maps Conflict to 412
      PRECONDITION_FAILED, not 409. The claim that only Postgres can produce
      it still holds.
  - criterion: complete
    verdict: pass
    reason: >-
      All four fails match the sources. The docs are stale: lib.rs:1-3 and the
      Cargo description omit tokens, runs and publication. sqlx crosses into
      toolbox-cli, toolbox-api and toolbox-authz. Postgres is a charter
      default named in the criterion (crates.yaml:479), so the sqlx leak is
      squarely replaceable-defaults. PgStore has no test in the crate. rg
      finds no revision-conflict, token-revocation or token-expiry check in
      scripts/m*-acceptance.sh or crates/toolbox-api/tests, and
      crates/toolbox-api/tests/api.rs:21 uses MemStore. I found nothing
      missed.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Every verdict rests on code facts: a public sqlx field and return type,
      a crate doc contradicted by pg.rs, two stores that disagree on revisions
      (pg.rs:133 against lib.rs:140), and an rg search for tests. None rests
      on taste.
  - criterion: actionable
    verdict: pass
    reason: >-
      Each suggestion would change the verdict it is attached to. A rewritten
      lib.rs:1-3 fixes one-responsibility. A private `pool`, an opaque
      LeaderGuard, a tuple-view method and the same revision rule in SharedMem
      remove each small-contract finding. Keeping sqlx inside the crate
      answers replaceable-defaults. A Postgres-gated test of Conflict, revoked
      or expired tokens and the run/spent round trip covers the three paths
      that tests-match-risk names as untested.
summary: >-
  A sound assessment. Its citations land and its four fails are the ones
  the code shows: stale docs, sqlx crossing into three crates, MemStore
  and PgStore disagreeing on revisions, and an untested Postgres half. The
  one slip is calling the conflict response 409. routes.rs:648 returns
  412, which doesn't change any verdict.
