apiVersion: toolbox.dev/assessment/v1
entity: assessment:crate-design/crate:toolbox-api
rubric: assessment-quality
subjectHash: 42eea9d501d7
assessor: {kind: agent, name: codex-independent-reviewer}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      crates/toolbox-api/src/lib.rs and Cargo.toml still describe future
      milestones, and the production MCP implementation in src/mcp.rs is
      handwritten. The rmcp claim now applies to the workspace manifests. The
      build-cost experiment declares rmcp outside that workspace.
  - criterion: complete
    verdict: pass
    reason: >-
      All four crate findings follow the rubric. crates/toolbox-api/src/lib.rs
      has stale crate docs and accepts a concrete PgStore.
      crates/toolbox-cli/src/report.rs calls server connector helpers.
      crates/toolbox-api/src/confine.rs tests confinement, while
      crates/toolbox-api/tests/api.rs lacks direct tests for connector bearer
      identity and mass deletion protection.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The public signatures in crates/toolbox-api/src/lib.rs and the caller
      imports in crates/toolbox-cli/src/report.rs independently establish the
      API boundary findings. The missing ingest cases can be checked against
      crates/toolbox-api/src/routes.rs and tests/api.rs.
  - criterion: actionable
    verdict: pass
    reason: >-
      Updating the introduction and spec would address the scope drift.
      Extracting the shared helpers and placing storage behind a trait would
      narrow the public server contract. The updated test proposal matches
      connector_of in crates/toolbox-api/src/routes.rs, which authenticates
      each configured token as its assigned connector.
summary: >-
  The crate review identifies four current failures and ties them to
  concrete documentation, API boundaries and ingest behavior. Its proposed
  regression tests now reflect how connector bearer tokens are scoped.
