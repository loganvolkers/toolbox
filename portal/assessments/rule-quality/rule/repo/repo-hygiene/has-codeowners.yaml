apiVersion: toolbox.dev/assessment/v1
entity: rule:repo/repo-hygiene/has-codeowners
rubric: rule-quality
subjectHash: 7cc56ad2e1fe
assessor: {kind: agent, name: cursor-assessor-18, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The fix and rationale promise that changes are routed to an owning team
      (examples/repo-portal-starter/toolbox.yaml:106-110). The check is
      `has(entity.codeowners)` (:105). The connector sets `codeowners`
      whenever one of the three files exists, even an empty or comment-only
      one, with `rules: []`
      (crates/toolbox-connector-workspace/src/repo.rs:66-72, :37-51). Such a
      file routes nothing, and GitHub requests no reviewer.
    suggestion: >-
      Check `has(entity.codeowners) && entity.codeowners.rules.exists(r,
      r.owners.size() > 0)`, and make the evidence say "CODEOWNERS names no
      owner" in that case.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `touch .github/CODEOWNERS` is the cheapest pass and takes no decision
      about owners. The four fixture repositories
      (examples/repo-portal-starter/fixtures/workspace.ndjson) have either no
      file or a populated one, so the empty case isn't covered.
    suggestion: >-
      Require at least one rule with an owner, as above, and add an empty
      CODEOWNERS fixture that fails.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the three locations searched
      (examples/repo-portal-starter/toolbox.yaml:105), which are GitHub's, in
      GitHub's order (repo.rs:10-11). The fix names .github/CODEOWNERS. Adding
      that file passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Bronze ("a README and a CODEOWNERS file") is set by
      the scorecard rationale
      (examples/repo-portal-starter/toolbox.yaml:79-80) and the starter's
      README table (examples/repo-portal-starter/README.md).
summary: >-
  A fine bronze floor, but it tests that the file exists, not that it
  names anyone. An empty CODEOWNERS passes while routing no review. The
  fix and evidence are good. Requiring one owned rule would make the check
  match the fix's promise.
