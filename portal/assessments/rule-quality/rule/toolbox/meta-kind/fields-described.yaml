apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/meta-kind/fields-described
rubric: rule-quality
subjectHash: 6a2f2e90d652
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `undescribedFields` is computed from the kind's Field entities over
      `fieldOf`, keeping those with `!f.described`
      (portal/standards/meta.yaml:232-236). Each field uses the same filled()
      test as meta-field's `described` (crates/toolbox-cli/src/model.rs:154).
      So passing means every field of the kind has a description, as the name
      says. kind:toolbox/Crate's evidence ['codeLines'] is pinned
      (portal/tests/standards.test.yaml:797-802).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      It inherits meta-field's placeholder route (model.rs:281-285), and here
      the route scales. kind:toolbox/Crate lists 24 undescribed fields, Skill
      22 and Connector 18 (portal/results.json, meta-kind evidence), so one
      placeholder word per field reaches gold far more cheaply than saying
      what each field means, its unit and its source.
    suggestion: >-
      Tighten filled() for field descriptions: reject one equal to the field
      name, or matching TODO/TBD. Then this rule and meta-field's `described`
      close together.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists the field names (meta.yaml:747), and the fix names
      the `description:` key. Describing each listed field in the kind's
      `fields:` empties the list.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Gold is placed by
      docs/design/scorecards-for-scorecards.md:207. The rationale cites 16
      kinds with undescribed fields on the first run (meta.yaml:751-754,
      scorecards-for-scorecards.md:214-215). Asking for every field is
      something silver, the kind's own description, doesn't imply, as
      thresholds.md requires of gold (docs/design/thresholds.md:24-25).
summary: >-
  An exact aggregate of meta-field's description check, at a sensible
  gold. Its weakness is the same cheap placeholder, multiplied by the
  number of fields: dozens per kind for the T4T kinds that fail it today.
