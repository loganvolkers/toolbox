apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/review-scorecard/no-open-findings
rubric: rule-quality
subjectHash: f73e4d2e4dd6
assessor: {kind: agent, name: cursor-assessor-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `reviewFailing` is the latest scorecard-quality assessment's `failing`
      list whether or not it is fresh (portal/standards/meta.yaml:57-63). A
      finding against a scorecard therefore stays open until a new assessment
      closes it, and the evidence marks stale ones (meta.yaml:1019-1021). The
      fixture puts meta-rule, with `no-obvious-gap` failing, at fail
      (portal/tests/standards.test.yaml:902-906). An unreviewed scorecard
      passing is intended by D01M831P5QWJQ4A2FT85N5MXJQF, point 1: findings
      sit below "not reviewed".
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Both the fix (meta.yaml:1022-1025) and the campaign that targets this
      card, close-review-findings (portal/campaigns.yaml:121-135), say a
      disputed finding is answered "in a new, independent assessment". The
      check reads only the current file's `failing`. The scorecard's own
      author can therefore re-write
      portal/assessments/scorecard-quality/scorecard/toolbox/<name>.yaml with
      `pass`, at the same hash, under the same assessor name. That passes
      bronze and counts toward the campaign's 100% target without touching the
      scorecard.
    suggestion: >-
      Count a finding as closed only when the scorecard's hash changed since
      the failing review, or when the passing verdict comes from a different
      assessor. The connector can compare against the assessment file's
      previous committed version. Then the campaign's word "independent" is
      checked, not just stated.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the failing criteria. Their suggestions are in the
      assessment under portal/assessments/, which the fix points at. A change
      to the scorecard to act on them alters its hash
      (crates/toolbox-cli/src/meta.rs:249), and CI's `toolbox assess check`
      then demands the new review that clears `failing`
      (.github/workflows/ci.yml:95-98).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Bronze is "no open finding, current or stale" in
      docs/design/thresholds.md:55. The ordering is
      D01M831P5QWJQ4A2FT85N5MXJQF, point 1, and change C1 in
      docs/design/meta-standards-review.md:136.
summary: >-
  Fails on hard-to-game. The rule keeps findings visible through
  staleness, and a campaign works them off. Nothing checks the
  independence that both the fix and the campaign promise, so the cheapest
  way to close a finding is to rewrite it. No review-scorecard fixture has
  a stale failing review.
