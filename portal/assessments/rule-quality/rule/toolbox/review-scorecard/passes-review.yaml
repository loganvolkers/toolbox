apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/review-scorecard/passes-review
rubric: rule-quality
subjectHash: 7d3f42361ae5
assessor: {kind: agent, name: cursor-assessor-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check is "fresh, nothing failing, nothing uncited"
      (portal/standards/meta.yaml:1044-1047). That is a current review that
      passes and can be checked, as the rationale says (meta.yaml:1055-1058).
      Unsure verdicts are left to no-doubts at the same level. The fixtures
      pin both failure branches: meta-rule fails on `no-obvious-gap`, and
      maintainer-ci-security on "actionable cites nothing that resolves"
      (portal/tests/standards.test.yaml:897-906).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Over silver and bronze, the only thing this rule adds is `uncited`
      (docs/design/meta-standards-review.md:113, M8 at line 167). `uncited`
      accepts any path that exists or any decision id
      (crates/toolbox-connect/src/assessment.rs:10-45). Route, from the
      fixture: maintainer-ci-security's uncited `actionable` reason gains
      "(see packages/github-actions/fragments/github-actions.yaml)" or "per
      D79", the verdict and the judgement stay as they were, and the card goes
      from silver to gold. A citation that resolves doesn't show that the
      reason is true.
    suggestion: >-
      Require citations grounded in the subject. At least one cited path
      should be the scorecard's defining file or a link the scorecard lists,
      using the `cited` list the connector already computes
      (assessment.rs:220-228). Or merge this rule with no-doubts into one gold
      "clean, grounded review" and drop the duplicate fresh/failing clauses,
      as M8 proposes.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix is to act on the failing criteria's suggestions and re-assess
      (meta.yaml:1052-1054). The evidence covers the other branch:
      "<criterion> cites nothing that resolves" (meta.yaml:1049-1051).
      Re-assessing under the assess-entity skill, which asks each reason to
      cite what was read
      (plugins/toolbox-operator/skills/assess-entity/SKILL.md:20-22), fixes
      that branch too.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Gold for "a current review that passes, cites what resolves"
      is in docs/design/thresholds.md:55 and change C1 in
      docs/design/meta-standards-review.md:136. M8 there calls this gold rule
      redundant, but thresholds.md still states the level, so the level is
      justified as written.
summary: >-
  Fails on hard-to-game. The rule's own contribution, beyond the lower
  levels, is that every reason cites something real. Since any existing
  path or decision id counts, a scorecard can reach gold by appending a
  citation to a reason, with no new judgement. The meta-standards review
  already flags it as redundant (M8).
