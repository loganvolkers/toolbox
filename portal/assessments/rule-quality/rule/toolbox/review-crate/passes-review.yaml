apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/review-crate/passes-review
rubric: rule-quality
subjectHash: b7adbaeae8eb
assessor: {kind: agent, name: campaign-review-rules-r4}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check is a current crate-design assessment with no failing or
      uncited criterion that cites a file inside the crate
      (portal/standards/crates.yaml:412-416, reviewCitesCrate at :84-92),
      which is what its rationale claims (crates.yaml:424-428); the hash
      covers src/, tests/ and Cargo.toml (crates.yaml:51-55).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The round-3 route is closed in its literal form: an assessment citing
      only docs/plan.md now fails, because citesSubject requires a cited path
      under crates/<name>/ (crates/toolbox-connect/src/assessment.rs:226-236).
      But one such path anywhere in the assessment is enough. An all-pass
      crate-design assessment whose reason for replaceable-defaults cites
      crates/<name>/Cargo.toml and whose other three reasons read "Fine; see
      docs/plan.md" passes this rule, though every crate-design criterion is
      about the crate's own code (portal/standards/crates.yaml:469-505). The
      round-3 suggestion was per reason. It is a cursory review, not a false
      statement; the gold sibling independently-reviewed (crates.yaml:445-464)
      needs a second assessor, whose review can be the same kind of stamp (see
      review-assessment/passes-review).
    suggestion: >-
      In record_in, record per reason whether it cites a path under
      crates/<name>/ (citedPerReason is already there), expose the criteria
      that don't (e.g. reviewOutsideCrate), and require it empty for pass
      verdicts here; add a fixture assessment with one crate citation and
      three doc citations that stays below gold.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names portal/assessments/, re-assessment and citing
      crates/<name>/src/ (portal/standards/crates.yaml:421-423), and the
      evidence lists failing and uncited criteria and says when no crate file
      is cited (crates.yaml:417-420); following it passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Gold is stated in D01M831P5QWJQ4A2FT85N5MXJQF and the review-* ladder at
      docs/design/thresholds.md:57, which names the crate citation; it asks
      for more than bronze and silver imply.
summary: >-
  Independent round-4 review of e3c0da1. A crate assessment must now cite
  the crate, closing the "see docs/plan.md" route, but a single crate path
  anywhere in it satisfies the rule, so one cited Cargo.toml and three
  unsupported passes still reach gold.
