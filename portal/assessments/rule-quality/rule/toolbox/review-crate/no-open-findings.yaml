apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/review-crate/no-open-findings
rubric: rule-quality
subjectHash: ffdf2841884f
assessor: {kind: agent, name: cursor-assessor-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `reviewFailing` reads the `failing` list of the crate-design assessment
      whether or not it is fresh (portal/standards/crates.yaml:63-69). A stale
      review's findings therefore stay open, as the rationale claims
      (crates.yaml:385-388) and the evidence labels (crates.yaml:378-380).
      That closes M7 (docs/design/meta-standards-review.md:166). Passing while
      unreviewed is intended: open findings drop the crate to none, below "not
      reviewed yet" (D01M831P5QWJQ4A2FT85N5MXJQF, point 1). The fixture shows
      toolbox-expr at none with `replaceable-defaults`
      (portal/tests/standards.test.yaml:920-922). Only review-rule's fixtures
      cover the stale-finding branch (standards.test.yaml:858-870); no crate
      fixture has a stale failing review.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The fix says a wrong finding should be answered "in a new assessment by
      another assessor" (portal/standards/crates.yaml:381-384), but the check
      reads only the latest file's `failing`. The cheapest route is for the
      same assessor to overwrite
      portal/assessments/crate-design/crate/<name>.yaml with `pass` at the
      same subjectHash and change nothing in the crate. Bronze passes, and
      nothing records that a finding was dropped rather than fixed. Deleting
      the file also makes the review `missing` and passes bronze.
    suggestion: >-
      Keep a criterion open until the crate's hash changes or a different
      assessor passes it. The connector could read the previous committed
      version of the assessment file and carry its `failing` list forward when
      the new file has the same subjectHash and the same `assessor.name`. Add
      a crate fixture with a stale failing review to test the stale branch.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names each failing criterion, and the assessment in
      portal/assessments/ holds a `suggestion` for each, which the meta
      scorecards push assessors to write (`unsuggested`,
      crates/toolbox-connect/src/assessment.rs:199-201). The fix says to act
      on the suggestions and re-assess. A crate change makes the review stale,
      CI's `toolbox assess check portal` then demands a new review
      (.github/workflows/ci.yml:95-98), and that review clears `failing`.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Bronze is "no open finding, current or stale" in
      docs/design/thresholds.md:55. That open findings come first is
      D01M831P5QWJQ4A2FT85N5MXJQF, point 1, with change C1 in
      docs/design/meta-standards-review.md:136.
summary: >-
  Fails on hard-to-game. Measuring stale findings works, so a one-byte
  edit no longer hides a failing review. A finding can still be closed by
  rewriting the verdict, by the same assessor, at the same hash, which the
  fix itself says should take another assessor. No crate fixture exercises
  the stale branch.
