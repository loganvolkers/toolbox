apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-site/titled
rubric: rule-quality
subjectHash: 691d2b1adf7e
assessor: {kind: agent, name: blind-review-2026-11-23}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      fm_string (crates/toolbox-connector-workspace/src/site.rs:40-52) trims
      each frontmatter line before it matches `title:`. A nested key such as
      Starlight's `hero:` / `  title: X` therefore counts as the page title
      when there is no top-level one, and a folded `title: >-` yields the
      literal ">-". The rule can pass for a page that has no title.
    suggestion: >-
      Parse the frontmatter with a YAML parser and read the top-level `title`
      string only.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempts: `title: x` passes, and so does `title: "  "`.
      site.rs:46-49 trims and then strips the quotes, which leaves two spaces,
      and `size() > 0` (portal/standards/site.yaml:56) is true, so a blank
      heading passes.
    suggestion: >-
      Trim after stripping quotes, require a minimum length (e.g. 2 words or 8
      characters), and flag titles that are duplicated across pages.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      "Set the frontmatter title" names the exact place, and setting one
      passes site.yaml:56.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is stated in docs/design/site-standards.md:23 and :47 ("Empty
      title ... fail bronze"). There is no number.
summary: >-
  A floor that is meant to be trivial, but a line-based parser lets nested
  keys and whitespace through.
