apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/meta-assessment/cites-for-findings
rubric: rule-quality
subjectHash: 44ab8df68131
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      With the repository at hand, cites()
      (crates/toolbox-connect/src/assessment.rs:15-45) counts a path only if
      it exists, a bare file name only if exactly one file has it
      (assessment.rs:70-75, 81-120), and a D or Q id only if the repository
      has it (assessment.rs:124-149). Passing means "every finding cites
      something a reader can open"; whether it supports the reason is left to
      review-assessment, as docs/design/scorecards-for-scorecards.md:288-298
      lays out.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Both cheap routes from the last review are closed and pinned by
      crates/toolbox-connect/src/assessment.rs:361-371: "see README.md" no
      longer resolves because many files share the name, and a bare `https://`
      no longer counts because a URL needs a dotted host
      (assessment.rs:30-35). What remains is a deliberate false citation (an
      unrelated existing path, or a URL that is never fetched); that is what
      assessment-quality's `supported` criterion catches
      (portal/standards/assessments.yaml:319-323), so the cheapest honest move
      is to cite the file actually read.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix now names the forms the code accepts (an existing path, a unique
      file name, an existing D or Q id, a full URL) and says a section sign or
      a bare number alone doesn't count
      (portal/standards/assessments.yaml:193-198), matching
      crates/toolbox-connect/src/assessment.rs:10-14. Following it makes a
      listed criterion leave `uncited`.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Silver ("findings cite something checkable") is stated in
      docs/design/scorecards-for-scorecards.md:295 and D80, with gold for
      every reason.
summary: >-
  Re-assessed after the rule gained a rationale: its check, evidence, fix
  and level are the same as on main, as is the code the reasons cite, so
  the verdicts stand; line numbers are updated for the rationale lines
  inserted above them. The rationale states the why without claiming more
  than the check sees. The earlier findings are fixed: citations must
  resolve, a shared file name or a bare `https://` no longer counts, and
  the fix matches the code. The design doc's row at
  docs/design/scorecards-for-scorecards.md:295 still offers `§4` and "a
  number" as checkable and should be updated to match the fix.
