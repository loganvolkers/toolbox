apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-ci-reliability/fail-rate-under-20
rubric: rule-quality
subjectHash: 625283ec5521
assessor: {kind: agent, name: campaign-review-rules-r3}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check reads firstTryFailRate
      (packages/github-actions/fragments/github-actions.yaml:386-389), which
      counts a run that passed only on a later attempt as failed
      (crates/toolbox-connector-github/src/runs.rs:59-65 and :82), so it is
      the share of runs that went red, not the share left red after re-runs.
      Cancelled runs are left out but shown beside it (runs.rs:78-80), and an
      empty history gives null, so the rule is unknown rather than passing.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The rule leans on failures-visible to stop failures being hidden (its
      fix says so, github-actions.yaml:396-403), but that detector is still a
      list of literal strings
      (crates/toolbox-connector-workspace/src/workflows.rs:104-111) and two
      `!=` patterns (workflows.rs:113-126). I ran a scratch workflow through
      target/debug/toolbox-connector-workspace: steps `cargo test ||true` (no
      space), `cargo test || echo flaky`, a step with `shell: bash {0}` (no
      -e, so only the last line's status counts) and a job with `if:
      github.event_name == 'pull_request'` all gave hiddenFailures []. Each is
      a one-line suppression that keeps a flaky job out of the rate, cheaper
      than fixing it; none falsifies anything.
    suggestion: >-
      In masks_exit (workflows.rs:104-111), match `||` with any whitespace and
      treat any right-hand side other than `exit <non-zero>` or `false` as
      masking; flag a step or `defaults.run` `shell:` without `-e`; in
      skipped_on_default, evaluate the `if:` with github.ref =
      refs/heads/<default>, ref_name = <default> and event_name = push, and
      flag it when it is false. Add each case to the workflows.rs tests.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      Unchanged since the last review: the fix says to open the failed runs in
      the evidence, but failedRuns lists only runs whose final conclusion
      failed (crates/toolbox-connector-github/src/runs.rs:84-89), while the
      rate also counts runs that passed on a re-run. The portal's fixture
      shows it: demo/slow.yml has firstTryFailRate 40 and failedRuns []
      (portal/fixtures/github-actions.ndjson:2), so it fails the rule
      (portal/tests/standards.test.yaml:186) and the evidence names no run to
      open, in exactly the flaky case the first-try rate exists to catch.
    suggestion: >-
      In runs.rs, add the runs that passed on a later attempt to failedRuns
      (with their first attempt's URL, `<html_url>/attempts/1`) or to a
      `retriedRuns` list the evidence appends, and pin it with the
      demo/slow.yml fixture in portal/tests/standards.test.yaml.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      docs/design/thresholds.md:31 labels 20% as chosen, anchored to a
      measurement (`ci` on main failed 32 of its last 100 runs, 2026-11-20 to
      2026-11-23), says each level halves it, and explains the first-attempt
      count and the 10-run minimum for silver and gold; the number is a
      package parameter (packages/github-actions/toolbox-package.yaml:26).
summary: >-
  Independent re-review; the rule and the code it reads are unchanged
  since the last review (runs.rs last changed in 781adf9, workflows.rs
  only reformatted since), and both findings were checked against them and
  still hold. The rate itself is sound. A failure can still be hidden from
  it with `||true`, `|| echo`, `shell: bash {0}` or an event-name `if:`
  (all confirmed with the connector), and runs that passed on a re-run
  raise the rate without appearing in the evidence the fix points to. Line
  numbers refer to main at fb5c546; an uncommitted working-tree change to
  runs.rs lists retried runs' first attempts, which would close the
  fix-leads-to-pass finding once it lands.
