apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-ci-reliability/still-running
rubric: rule-quality
subjectHash: 240e421c74bd
assessor: {kind: agent, name: cursor-assessor-09, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check reads GitHub's own workflow `state`, copied as returned by the
      workflows API (crates/toolbox-connector-github/src/main.rs:252).
      Anything but `active` (`disabled_inactivity`, `disabled_manually`,
      `disabled_fork`) fails, which is exactly the disabled workflow whose
      stale green history the rationale describes
      (packages/github-actions/fragments/github-actions.yaml:377-382). The
      rationale admits the limit: a workflow whose triggers stop matching
      stays active.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The state is set by GitHub, not the repository: the connector copies the
      workflow's `state` from the Actions API
      (crates/toolbox-connector-github/src/main.rs:234-252), and the check
      reads only that (packages/github-actions/fragments/github-actions.yaml:
      370). So the only ways to pass are the two the fix names: re-enable the
      workflow or delete its file. Either is the right outcome. Re-enabling
      also puts the workflow back under the run-history rules, which then
      judge its runs.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the command (`gh workflow enable <file>`) or the Actions
      tab, and the alternative, deleting the file from .github/workflows/.
      Either changes `state` to `active` or removes the entity on the next
      refresh, which comes within the 15-minute freshness of workflow-runs
      (github-actions.yaml:55). The disabled demo fixture fails and ci.yml
      passes (portal/tests/standards.test.yaml:187-190).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number in the check. docs/design/thresholds.md:33 places it
      at bronze as a principle: GitHub disables a workflow after 60 days
      without activity, and its old history then reads green. The rule's link
      to GitHub's disable-and-enable documentation is the source for that.
summary: >-
  A small, honest bronze rule: it reads a state only GitHub sets, its fix
  is the two legitimate outcomes, and both outcomes are fixture-tested.
  Its known blind spot, a workflow whose triggers never match, is stated
  in its own rationale.
