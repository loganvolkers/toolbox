apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-ci-reliability/failures-visible
rubric: rule-quality
subjectHash: d4e11a2aa73d
assessor: {kind: agent, name: cursor-assessor-09, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The parse flags exactly the patterns the fix and
      docs/design/thresholds.md:32 name: job or step `continue-on-error`, `||
      true`, `|| :`, `|| exit 0` and `set +e` in a `run:`, and an `if:` that
      skips on main. A step allowed to fail passes when a later step reads its
      `steps.<id>.outcome`
      (crates/toolbox-connector-workspace/src/workflows.rs:106-167). The
      report-action job's expected-failure step passes this way, and all 7
      live workflows pass.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Each detector matches a closed list of strings. `cmd || echo failed`
      swallows the exit status but isn't among the masks (workflows.rs:109).
      `if: github.event_name == 'pull_request'` skips a job on every push to
      main, but only literal `github.ref != 'refs/heads/main'` or `ref_name`
      comparisons count as skips (workflows.rs:115-128). A later step that
      merely echoes `steps.<id>.outcome` counts as asserting it, because the
      check is a substring search over later steps (workflows.rs:157-161).
    suggestion: >-
      Treat any `||` fallback that doesn't re-fail (not `|| exit 1` or `||
      false`) as masking. Flag job and step `if:` conditions that exclude
      `push` events or the default ref. Require the outcome to be compared
      (`== 'failure'` or `== 'success'`) in an `if:` or a test expression, not
      just mentioned.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names each spot as `jobs.<id>` or `jobs.<id>.steps[i]`,
      tagged "skipped on the default branch" or "the script swallows its exit
      status" (workflows.rs:136-164; pinned as `['jobs.deploy']` in
      portal/tests/standards.test.yaml:741-743). The fix gives the removal for
      each pattern, plus the `id:` and outcome escape hatch the check accepts
      (workflows.rs:157-161).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. docs/design/thresholds.md:32 justifies bronze with
      no allowance as a prerequisite of the fail-rate rules, which a hidden
      failure would read as green. That is the doc's "a prerequisite sits
      below what depends on it" principle (thresholds.md §1).
summary: >-
  A well-placed prerequisite rule: its evidence and fix line up and are
  pinned by tests, and it is justified as the floor under the fail-rate
  tiers. Its detection is a fixed list of strings, so `|| echo`,
  event-based skips and an outcome that is echoed rather than asserted all
  slip through.
