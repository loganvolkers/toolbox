apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-ci-reliability/cancels-superseded-runs
rubric: rule-quality
subjectHash: 6d696f4865ef
assessor: {kind: agent, name: blind-review-2026-11-23}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `concurrency` is true for any top-level concurrency key
      (crates/toolbox-connector-workspace/src/workflows.rs:147), and
      `cancel-in-progress` is never read. `concurrency: {group: ci,
      cancel-in-progress: false}` passes while cancelling nothing in progress,
      and its static group makes every PR's pending run replace another
      branch's.
    suggestion: >-
      Extract `cancelInProgress` and whether the group expression varies by
      ref (`github.ref`, `github.head_ref` or the PR number), and check both
      for pull_request workflows.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempt: add one line, `concurrency: ci`. The check at
      packages/github-actions/fragments/github-actions.yaml:270 passes, and
      superseded runs still run to the end.
    suggestion: >-
      Check the extracted cancel-in-progress and per-ref group, as above.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The literal snippet in the fix
      (packages/github-actions/fragments/github-actions.yaml:272),
      `concurrency: {group: ${{ github.workflow }}-${{ github.ref }},
      cancel-in-progress: true}`, is not valid YAML: a `{` is not allowed in a
      plain scalar inside a flow mapping, and PyYAML stops with "expected ','
      or '}', but got '{'". Pasted into ci.yml, which also runs on push to
      main, `cancel-in-progress: true` would cancel main runs, and the
      fail-rate rules ignore cancelled runs
      (docs/design/github-actions-standards.md:97).
    suggestion: >-
      Give a block-style snippet with the group quoted, and `cancel-in-progress:
      ${{ github.event_name == 'pull_request' }}`, so main keeps every run.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Silver is stated in docs/design/github-actions-standards.md:86, where
      the source is labelled "secondary: common practice". There is no number.
summary: >-
  Any concurrency key passes, and the fix's own snippet doesn't parse.
