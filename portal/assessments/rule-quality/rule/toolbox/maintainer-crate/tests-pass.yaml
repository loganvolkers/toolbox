apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-crate/tests-pass
rubric: rule-quality
subjectHash: 805f15bb72c8
assessor: {kind: agent, name: campaign-review-rules-r3}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The runner's test job sets only TOOLBOX_REQUIRE_OPENFGA
      (portal/toolbox.yaml:255-266), and since the last review two security
      tests were added that return early as passed:
      crates/toolbox-api/src/confine.rs:82-91 skips without Landlock unless
      TOOLBOX_REQUIRE_LANDLOCK is set, which CI sets
      (.github/workflows/ci.yml:52-53) and the runner does not, and
      crates/toolbox-cli/tests/serve.rs:36-41 skips whenever it runs as root,
      with no override at all. On a host without Landlock, or as root, the
      rule reports toolbox-api and toolbox-cli as passing while those tests
      never ran: the case its rationale names
      (portal/standards/crates.yaml:229-232). The last review's "no other test
      skips itself" no longer holds.
    suggestion: >-
      Add TOOLBOX_REQUIRE_LANDLOCK=1 to the runner's test job in
      portal/toolbox.yaml; give the serve.rs root skip a TOOLBOX_REQUIRE_*
      override that fails instead; and have the runner count a fixed marker
      line (e.g. `skipped:`) that every self-skipping test prints, failing the
      rule when any appears.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      is_cfg_disabled still matches only `any()` and `not(all())`
      (crates/toolbox-connector-workspace/src/rust.rs:50-59). A scratch crate
      with a failing test under `#[cfg(miri)]`, run through
      target/debug/toolbox-connector-workspace, gave disabledTests [], and
      cargo never compiles it on Linux, so the runner reports pass
      (crates/toolbox-connector-runner/src/main.rs:92-114). `miri` and
      `windows` are well-known cfgs, so the unexpected_cfgs lint stays quiet.
      An early `return` behind an environment test, the pattern above, also
      passes. Both are one-line suppressions, not falsification.
    suggestion: >-
      List in disabledTests any `#[test]` (or its module) gated by a cfg other
      than `test` or a declared feature; better, compare the runner's passed +
      failed + ignored for unit and integration suites with the workspace's
      unitTests + integrationTests, so a test cargo didn't run shows up
      whatever hid it.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix's `cargo test -p <crate>` is the runner's command
      (portal/toolbox.yaml:255-266), the evidence carries counts, the output
      tail on failure (crates/toolbox-connector-runner/src/main.rs:108-111)
      and each compiled-out test with file and line (rust.rs:134-141), and the
      fix names each removal: failures, `#[ignore]`, the always-false
      `#[cfg(...)]` (portal/standards/crates.yaml:223-228).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze with no ignored or compiled-out test is a stated principle in
      docs/design/thresholds.md:38, which also records the OpenFGA
      requirement; there is no other number.
summary: >-
  Independent re-review. The rule is unchanged, but the code around it
  moved: two self-skipping security tests (Landlock confinement, the
  same-user environment test) arrived on 2026-11-24, and the runner job
  requires neither, so the rule can report pass for tests that never ran.
  `#[cfg(miri)]` on a failing test still passes (confirmed with the
  connector).
