apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-crate/tests-pass
rubric: rule-quality
subjectHash: 3f7a0e734ff4
assessor: {kind: agent, name: campaign-review-rules}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Ignored tests now fail the rule (portal/standards/crates.yaml:162-165),
      and the OpenFGA tests fail when TOOLBOX_REQUIRE_OPENFGA is set
      (crates/toolbox-authz/tests/fga.rs:59-68). But CI sets that variable
      only in its own test job (.github/workflows/ci.yml:49). The rule reads
      the runner, whose job is a bare `cargo test -q -p {crate}`
      (portal/toolbox.yaml:213-216), and parse_cargo_test calls any exit 0
      `pass` (crates/toolbox-connector-runner/src/main.rs:93-114). Where the
      runner has no openfga binary, toolbox-authz passes while its M3
      exit-criterion test returned early. docs/design/thresholds.md §2 says
      otherwise.
    suggestion: >-
      Set TOOLBOX_REQUIRE_OPENFGA=1 in the runner's test job in
      portal/toolbox.yaml (or have the runner fail a crate whose output says
      "skipping:"), so the rule and CI agree.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `#[ignore]` is closed, but `#[cfg(any())]` (or `#[cfg(miri)]`) on the
      failing test is just as cheap: cargo never compiles it, so it is neither
      failed nor ignored, and parse_cargo_test (runner main.rs:93-114) reports
      `pass`. An early `return;` at the top of the test works too. has-tests
      still counts the test, because the syn walker
      (crates/toolbox-connector-workspace/src/rust.rs:38-42) ignores cfg on
      test functions.
    suggestion: >-
      Have the workspace connector list `#[test]` functions gated by a cfg
      other than `test` (and tests whose first statement is `return`), and add
      them to this rule's evidence alongside ignored tests.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix's `cargo test -p <crate>` is the runner's command
      (portal/toolbox.yaml:215), the evidence carries counts and the last 2000
      characters of output on failure (runner main.rs:108-112), and the fix
      names `#[ignore]` for the ignored case.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze with no ignored test is stated as a principle in
      docs/design/thresholds.md §2 ("An ignored test never runs"). There is no
      other number.
summary: >-
  Ignored tests now count, but the runner job doesn't set
  TOOLBOX_REQUIRE_OPENFGA, so self-skipping tests still pass, and
  `#[cfg(any())]` hides a failing test as cheaply as `#[ignore]` did.
