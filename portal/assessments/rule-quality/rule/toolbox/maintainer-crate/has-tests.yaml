apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-crate/has-tests
rubric: rule-quality
subjectHash: 0b84033f7e01
assessor: {kind: agent, name: campaign-review-rules-r3}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The detector is unchanged since 781adf9. Helpers are collected per file
      (crates/toolbox-connector-workspace/src/rust.rs:256-290) and matched by
      the last path segment (rust.rs:225-247), and only macros named
      `assert*`/`debug_assert*`, `panic` and `unreachable` count
      (rust.rs:214-223). So a test whose check is in tests/common/mod.rs or
      another module, or that uses `anyhow::ensure!` or `prop_assert_eq!`, is
      listed as asserting nothing while it does, and any production function
      in the file that merely unwraps becomes a "helper" whose name makes an
      unrelated call count. None of the 17 live crates hits these today, so
      the misfires are latent.
    suggestion: >-
      Collect helpers per crate (including tests/common) and resolve calls by
      path rather than last segment; count `ensure!`, `prop_assert*` and
      `bail!` as checks; count a production function as a helper only when it
      asserts, not when it only unwraps.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Any `.unwrap()` or `.expect()` counts as an assert (rust.rs:225-235). I
      ran a scratch crate through target/debug/toolbox-connector-workspace
      whose only running test is `#[test] fn smoke() {
      "1".parse::<i32>().unwrap(); }` beside a broken `add` returning `a - b`:
      unitTests 2 and testsWithoutAsserts [], so the check
      (portal/standards/crates.yaml:178-182) passes on a crate whose tests
      check nothing it defines. That is the rubric's trivial test, not
      deception, and the same tests pad tests-scale-with-code
      (crates.yaml:194-196).
    suggestion: >-
      Count an assert, unwrap or `?` only when the expression reaches an item
      the crate defines (a `crate::`/`super::` path, a `use`d crate item, or
      the crate's name in tests/), and treat an assert whose condition has no
      identifiers as trivial. For a measure that resists this, carry
      cargo-mutants' missed mutants in a slot and let a rule read them.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names each test as `path (file:line) asserts nothing`, or
      says there is no #[test] (portal/standards/crates.yaml:183-185,
      rust.rs:145-151), and the fix says to add a test or give each listed
      test an assert (crates.yaml:186-189). A direct non-trivial `assert!` in
      the listed test passes whatever caused the listing.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      "At least one test, and every test asserts" is stated at bronze in
      docs/design/thresholds.md:36 as a principle with a measurement (two
      tests here asserted nothing on 2026-11-23); the size-relative bar is the
      silver rule, justified at thresholds.md:37.
summary: >-
  Independent re-review; the rule and rust.rs are unchanged since the last
  review and its findings still hold. A lone `"1".parse::<i32>().unwrap()`
  passes on a broken crate (confirmed with the connector), and per-file,
  bare-name helper resolution misses `ensure!`, `prop_assert!` and
  tests/common checks.
