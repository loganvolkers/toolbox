apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-crate/tests-scale-with-code
rubric: rule-quality
subjectHash: 7b6e4a100f8d
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The rule claims only a floor that "flags crates that are untested or
      nearly so", not coverage (portal/standards/crates.yaml:204-207).
      `testsPerKloc` divides `#[test]` and `#[tokio::test]` functions in src/
      and tests/ by code lines (crates.yaml:42-47;
      crates/toolbox-connector-workspace/src/rust.rs:44-48, 134-135). It
      counts disabled and assert-free tests too (rust.rs:134-152), but those
      fail the bronze has-tests and tests-pass rules first, so they can't
      carry a crate to silver. It misses tests generated by macros: a
      `proptest!` test on a scratch crate wasn't counted. No crate here uses
      proptest, rstest or test_case today (no match under crates/), so the gap
      is latent.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A one-line test that unwraps something unrelated counts and is not
      flagged. On a scratch crate, `#[test] fn pad1() {
      "1".parse::<i32>().unwrap(); }` and `fn pad2() { Some(1).unwrap(); }`
      raised `unitTests` by 2 with `testsWithoutAsserts` empty, because any
      `unwrap` counts as an assert (rust.rs:225-235). toolbox-api and
      toolbox-derive sit at 3 tests per 1,000 lines today, so a few such tests
      would hold them over 2 as they grow, and cost less than real tests. The
      root cause is in has-tests' assert detection, which this rule inherits.
    suggestion: >-
      Only count an `unwrap`/`expect`/`?` as an assert when the expression
      reaches a crate item (a `crate::`/`super::` path, or the crate's name in
      tests/), and treat literal-only expressions as trivial. A fixture test
      should pin `"1".parse::<i32>().unwrap()` as asserting nothing.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence states the arithmetic: tests per 1,000 lines, the test
      count and the line count (crates.yaml:197-200; pinned as `0 tests per
      1,000 lines (0 tests, 182 lines)` at
      portal/tests/standards.test.yaml:1269). So the number of tests to add is
      computable. The fix says to add tests until 2 per 1,000 and points at
      thresholds.md for the reason (crates.yaml:201-203). Adding real
      asserting tests passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      docs/design/thresholds.md:37 gives 2 as measured: on 2026-11-23 crates
      ranged from 0 to 14 per 1,000 lines, with a median near 6, and the three
      below 2 gained tests in the same change. It sits at silver because
      bronze's has-tests passes with one test whatever the size
      (crates.yaml:204-207). Today the lowest crates are at 3 (toolbox-api,
      toolbox-derive).
summary: >-
  A measured, honestly scoped silver floor with arithmetic evidence, and
  the bronze rules filter out disabled and assert-free tests. It can be
  padded with trivial `unwrap` tests that has-tests accepts, and it misses
  macro-generated tests, though none exist here today.
