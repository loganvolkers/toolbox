apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-ci-security/no-write-tokens-on-risky-triggers
rubric: rule-quality
subjectHash: 0c1088fa7d6f
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `jobsWithWrite` lists only jobs whose own `permissions:` grants write
      (crates/toolbox-connector-workspace/src/workflows.rs:255, 286). A
      workflow-level grant is ignored, and so is a job that inherits the
      default token. A scratch workflow with `on: issue_comment` and top-level
      `permissions: write-all`, run through
      target/debug/toolbox-connector-workspace, gave riskyTriggers
      ["issue_comment"], topWriteScopes ["*"] and jobsWithWrite [], so it
      passes. That is the shape portal/waivers.yaml:8-11 says dist's release
      template uses ("workflow-level contents:write").
    suggestion: >-
      Map `topWriteScopes` into the Workflow kind and check
      `entity.riskyTriggers.size() == 0 || (entity.topWriteScopes.size() == 0
      && entity.jobsWithWrite.size() == 0)`, with evidence naming
      `workflow-level write` when it applies, and add a fixture with a
      workflow-level write on a risky trigger.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The cheapest pass is hoisting the job's `permissions: {contents: write}`
      to the top of the file: one move, no split, and every job now holds the
      write token, which is worse than before. Splitting the privileged steps
      into another workflow, as the fix asks
      (packages/github-actions/fragments/github-actions.yaml:291-292), costs
      more.
    suggestion: >-
      The check above closes it; the evidence should also name the jobs that
      inherit a workflow-level write.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names each risky trigger and each job with a write token
      (github-actions.yaml:287-290), and portal/tests/standards.test.yaml
      :132-143 pins it failing on a release.yml whose high finding is waived.
      Moving the privileged steps to a workflow without those triggers empties
      `riskyTriggers` there and the writes here.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      D70 puts it at silver but gives no reason, and neither
      docs/design/github-actions-standards.md:83 nor docs/design/thresholds.md
      has one. Its rationale describes a privileged credential within reach of
      untrusted input (github-actions.yaml:294-297), the kind of killer item
      thresholds.md :19-21 says goes in the floor. Bronze's no-high-findings
      does flag these triggers (zizmor reported issue_comment as high
      dangerous-triggers on a scratch file), but once that is waived or
      ignored, as the release.yml test shows, a workflow with a write token on
      a risky trigger still reads bronze and passes the bronze ratchet.
    suggestion: >-
      Move the rule to bronze, or add a row to docs/design/thresholds.md
      explaining why silver is right given that waivers excuse the zizmor
      finding at bronze.
summary: >-
  Aimed at the most dangerous workflow shape, with good evidence, but it
  reads only job-level permissions, so a workflow-level write token on
  issue_comment passes, and hoisting a job's write to the top is the
  cheapest way to pass. Its silver placement is unexplained and lets a
  waived dangerous trigger with write access sit at bronze.
