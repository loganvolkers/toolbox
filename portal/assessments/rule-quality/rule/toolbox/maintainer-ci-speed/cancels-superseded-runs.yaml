apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-ci-speed/cancels-superseded-runs
rubric: rule-quality
subjectHash: e80dfa2a39d7
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `cancels_superseded` passes when the group contains one of five ref
      strings and `cancel-in-progress` isn't literally false
      (crates/toolbox-connector-workspace/src/workflows.rs:76-87, 91-104).
      So `group: ci-${{ github.ref }}-${{ github.run_id }}`, unique per run
      and so never cancelling, passes, and so does `cancel-in-progress: ${{
      github.event_name == 'push' }}`, which is never true on a pull
      request: any expression other than `false` counts as truthy. Workflows
      on `pull_request_target` are exempt
      (packages/github-actions/fragments/github-actions.yaml:500), though a
      push to the fork's branch supersedes their runs the same way.
    suggestion: >-
      In cancels_superseded, reject a group that also contains
      `github.run_id`, `github.run_number` or `github.sha`, and treat a
      `cancel-in-progress` expression as true only if it is `true` or mentions
      `pull_request`; extend the check to `'pull_request_target' in
      entity.triggers`. Add both cases to the unit test at workflows.rs
      :393-421.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The cheapest pass is pasting the fix's block, which does the right
      thing; the misfires above are mistakes, not shortcuts. The rule reads
      the parsed YAML: cancels_superseded looks only at the `concurrency`
      value's `group` and `cancel-in-progress`
      (crates/toolbox-connector-workspace/src/workflows.rs:76-86), so a
      comment or a step name can't satisfy it.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix is literal YAML (github-actions.yaml:506-511), and the unit test
      at workflows.rs:416-420 pins that exact group and expression as
      cancelling. The evidence tells the two failure cases apart (no group, or
      a group that doesn't vary by ref or doesn't cancel), matching the live
      failures on codeql.yml and release.yml in portal/results.json.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. docs/design/thresholds.md:34 places it at bronze on the speed
      card as a principle: it saves runner time and isn't a correctness
      property, so it doesn't hold a reliable workflow back.
summary: >-
  A cheap, well-placed rule with a copy-paste fix that its unit test pins.
  The check is lexical: a group that also varies by run id, or a
  cancel-in-progress expression that is never true for pull requests,
  passes while cancelling nothing, and pull_request_target workflows are
  exempt.
