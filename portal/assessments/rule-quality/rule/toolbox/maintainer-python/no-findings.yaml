apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-python/no-findings
rubric: rule-quality
subjectHash: 08a4eb27c85a
assessor: {kind: agent, name: campaign-review-rules}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check is ruff's own active-finding count from its SARIF
      (packages/sarif/fragments/sarif.yaml:58-67), run with the repository's
      ruff.toml (portal/toolbox.yaml:329-349), so passing means "ruff finds
      nothing". One caveat on scope, not on the rule: the file globs miss
      maintained Python such as examples/acme-live/deploy/facade.py, which is
      clean under ruff 0.14.0 today.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The bare `# noqa` route is closed by PGH004 and RUF100 in ruff.toml, but
      a coded one isn't: `import os  # noqa: F401` makes ruff 0.14.0 emit zero
      SARIF results (I checked; same command as the scorecard). So the finding
      is invisible to both `active` and `total`, and nothing asks for the
      "comment saying why" the fix wants. Appending `# noqa: <code>` is
      cheaper than fixing.
    suggestion: >-
      Have the sarif connector (or a small companion check) count `# noqa:`
      comments in the listed files as suppressed findings, so countSuppressed
      and the ratchet see them, or require a reason after the code (`# noqa:
      F401 -- why`).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists `line N: RULE message` per finding
      (sarif.yaml:62-66), the record's command reruns ruff alone, and the fix
      names ruff.toml for deliberate ignores. Fixing or ignoring the listed
      findings passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no tuned number. One level, `clean`, means zero findings, and
      `newEntitiesAtLeast: clean` (packages/sarif/fragments/sarif.yaml:55-56)
      matches the scorecard's "a new file must arrive clean".
summary: >-
  A faithful carrier for ruff with bare noqa now forbidden, but a coded `#
  noqa` with no reason still hides a finding from every count.
