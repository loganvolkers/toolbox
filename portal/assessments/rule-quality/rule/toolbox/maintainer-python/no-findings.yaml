apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-python/no-findings
rubric: rule-quality
subjectHash: cb54f3333d9c
assessor: {kind: agent, name: campaign-review-rules-r3}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check is ruff's own finding count from its SARIF
      (packages/sarif/fragments/sarif.yaml:70-73), run with the repository's
      ruff.toml and --ignore-noqa (portal/toolbox.yaml:393-403), so passing
      means "ruff, as configured here, finds nothing". The three globs
      (portal/toolbox.yaml:404-407) cover all 13 tracked Python files outside
      experiments/ (git ls-files), scripts/take-it-out.py and
      examples/acme-live/deploy/facade.py among them. A Python file added
      elsewhere, such as under plugins/, would fall outside the scope
      silently, but none exists today.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Inline `# noqa` no longer hides anything (--ignore-noqa,
      portal/toolbox.yaml:400-402), but one line in ruff.toml still does: a
      `[lint] ignore` entry or a `[lint.per-file-ignores]` line makes the
      finding vanish from the SARIF, so it is in neither `active` nor `total`.
      The fix asks for "a comment saying why" (portal/toolbox.yaml:409-413)
      and the comment in portal/toolbox.yaml:400-401 says it is "reviewed with
      a reason", but nothing checks the comment and .github/CODEOWNERS covers
      only .github/, not ruff.toml. That is a suppression, the rubric's own
      example of a cheap route.
    suggestion: >-
      Add ruff.toml to .github/CODEOWNERS so an ignore needs an owner's
      review, and have a rule fail on any `ignore` or `per-file-ignores` entry
      in ruff.toml without a comment line above it (the workspace connector
      can read the TOML).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists `line N: RULE message` per finding
      (packages/sarif/fragments/sarif.yaml:75-78), each record's command
      reruns ruff alone, and the fix names both routes, fixing or a per-file
      ignore in ruff.toml, and warns that `# noqa` won't help
      (portal/toolbox.yaml:409-413).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No tuned number: the one level, clean, means zero findings, and
      `newEntitiesAtLeast: clean` (packages/sarif/fragments/sarif.yaml:67-68)
      matches the scorecard's description that a new file must arrive clean.
summary: >-
  Independent re-review; rule, config and ruff.toml are unchanged since
  the last review, and its finding still holds. A faithful carrier for
  ruff over all the maintained Python; a one-line ignore in ruff.toml,
  with no required reason or reviewer, still hides a finding from every
  count.
