apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-python/no-findings
rubric: rule-quality
subjectHash: aa504c339631
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check is ruff's own finding count from its SARIF
      (packages/sarif/fragments/sarif.yaml:58-61), run with the repository's
      ruff.toml (portal/toolbox.yaml:339-360), so passing means "ruff finds
      nothing". The previous scope caveat is fixed: the globs now include
      examples/acme-live/deploy/*.py (portal/toolbox.yaml:360), and every
      tracked Python file outside experiments/ matches one of the three globs
      (scripts/take-it-out.py, examples/acme-live/deploy/facade.py,
      examples/reference-portal/tools/validate.py among them).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The inline routes are closed: with --ignore-noqa
      (portal/toolbox.yaml:353-355) ruff 0.14.0 still reports F401 under `#
      noqa: F401`, `# ruff: noqa` and `# ruff: noqa: F401` (I ran each). The
      route left is one line in ruff.toml: a `[lint.per-file-ignores]` entry
      or a `[lint] ignore` makes the finding vanish from the SARIF, so it is
      in neither `active` nor `total` and the ratchet can't see it (I checked:
      zero results). The fix asks for "a comment saying why"
      (portal/toolbox.yaml:362-366), but nothing checks that, and
      .github/CODEOWNERS covers only .github/, not ruff.toml.
    suggestion: >-
      Add ruff.toml to .github/CODEOWNERS so an ignore needs an owner's
      review. Have the workspace connector report ruff.toml ignore entries
      without a comment line above them, and fail this rule (or a sibling
      rule) on any.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists `line N: RULE message` per finding
      (packages/sarif/fragments/sarif.yaml:63-66), the record's `command`
      reruns ruff alone (sarif.yaml:35-37), and the fix names
      `[lint.per-file-ignores]` in ruff.toml for deliberate style and warns
      that `# noqa` won't help (portal/toolbox.yaml:362-366). Fixing or
      ignoring the listed findings passes, as the fixtures show
      (portal/tests/standards.test.yaml:1073-1082).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no tuned number. The one level, `clean`, means zero findings,
      and `newEntitiesAtLeast: clean`
      (packages/sarif/fragments/sarif.yaml:55-59) matches the scorecard's own
      description, "a new file must arrive clean" (sarif.yaml:49-52).
summary: >-
  A faithful carrier for ruff that now covers all the maintained Python,
  and --ignore-noqa closes every inline suppression. A one-line ignore in
  ruff.toml, with no reason and no required reviewer, still hides a
  finding from every count.
