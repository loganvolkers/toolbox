apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/sdlc-layer/nothing-missing
rubric: rule-quality
subjectHash: 859d51b163b0
assessor: {kind: agent, name: campaign-review-rules-r3}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      stagesMissing counts a stage declared missing or with an empty `namedIn`
      (portal/standards/sdlc.yaml:21-30), and the connector leaves out of
      `namedIn` every listed doc that doesn't exist or never mentions the
      stage's name (crates/toolbox-connector-workspace/src/data.rs:256-267,
      tested at :331-339). The check says what the fix says
      (sdlc.yaml:279-286), and live only package-author fails, on its two
      `status: missing` stages (portal/sdlc/stages/package-author.yaml:83 and
      :101).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      "Names the stage" is a case-insensitive substring test
      (crates/toolbox-connector-workspace/src/data.rs:220-233), and stage
      names are common words. Changing `status: missing` to `designed` at
      portal/sdlc/stages/package-author.yaml:83 and :101 passes the layer:
      their listed doc, docs/design/packages.md, contains "package" throughout
      and "distribute" once, about other tools (docs/design/packages.md:229),
      while the stage's own gaps say the registry is undecided
      (package-author.yaml:103). The flip is a false claim in a committed
      file, but it is exactly the route the rule's rationale says it closes
      (portal/standards/sdlc.yaml:287-291), so the check does not stop it. The
      mapping also falls back to every listed doc when the connector has no
      `naming:` (sdlc.yaml:139).
    suggestion: >-
      Match the stage as a Markdown heading or a whole word near the layer's
      name, or let `docs:` entries be `path#anchor` and check the anchor
      exists; fall back to `[]` rather than `record.docs` at
      portal/standards/sdlc.yaml:139.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the file (portal/sdlc/stages/<layer>.yaml), the `docs:`
      and `status:` keys and their values, and both conditions the connector
      checks (portal/standards/sdlc.yaml:281-286); the evidence says which
      failed ("(no doc that exists and names it)", sdlc.yaml:28-30).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. docs/design/thresholds.md:59 states the sdlc-layer ladder on
      the principle that a prerequisite sits below what depends on it
      (thresholds.md:22-23).
summary: >-
  Independent re-review; the rule and data.rs's naming test are unchanged
  since the last review, and its finding still holds: naming is a
  substring test on common words, so flipping a status passes when a
  shared doc happens to contain the stage's name.
