apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/sdlc-layer/nothing-missing
rubric: rule-quality
subjectHash: 4ac985d3d1ff
assessor: {kind: agent, name: campaign-review-rules}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      stagesMissing (portal/standards/sdlc.yaml:21-28) now also counts a stage
      with no doc, but it tests only `s.docs.size() == 0`. It never reads the
      stage's missingPaths, so a `docs:` entry naming a file that doesn't
      exist counts as a doc. The fix says the opposite: "A status alone
      doesn't count; a doc that exists does" (sdlc.yaml:212-215). Only the
      stage's own `documented` rule (sdlc.yaml:154) checks existence.
    suggestion: >-
      Compute stagesMissing as `s.status == 'missing' || s.docs.size() == 0 ||
      s.missingPaths.exists(p, p in s.docs)` (or have the connector give a
      stage a `docsExisting` list), so a declared but absent doc counts as
      missing.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempt: the two live failures, package-author/package and
      package-author/distribute, already list docs/design/packages.md
      (portal/sdlc/stages/package-author.yaml:82-83 and 100-101). Changing
      `status: missing` to `status: designed` on those two lines takes the
      layer to silver with no new design. A stage with no doc can point
      `docs:` at README.md, or at a path that doesn't exist.
    suggestion: >-
      Use the existence check above, and require each stage's doc to mention
      the stage (its name or id), as sdlc-stage's review rubric would judge;
      or tie silver to review-sdlc-stage having no open findings.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The earlier fail is fixed: the fix now names
      portal/sdlc/stages/<layer>.yaml, the `docs:` key and the `status:`
      values (sdlc.yaml:212-215), and doing all three empties stagesMissing.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. docs/design/thresholds.md §3 now states the sdlc-layer ladder
      (every stage declared, no stage missing in fact, every stage built) on
      the principle that a prerequisite sits below what depends on it, which
      resolves the earlier unsure.
summary: >-
  The fix and the ladder are fixed, but the check still trusts a status
  flip when any doc path is listed, even one that doesn't exist.
