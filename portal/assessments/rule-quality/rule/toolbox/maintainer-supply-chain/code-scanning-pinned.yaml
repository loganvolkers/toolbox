apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-supply-chain/code-scanning-pinned
rubric: rule-quality
subjectHash: 71f6f6732e46
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `codeScanningPinned` is true when any workflow's text contains
      `codeql-action/<path>@<40 hex>` anywhere
      (crates/toolbox-connector-workspace/src/repo.rs:143-145). One pinned
      `init` passes while `analyze@v4` in the same or another workflow stays
      on a tag, so "pinned" means "pinned once". The per-use answer already
      exists: pinned-to-sha in maintainer-ci-security and pinned-everywhere
      for `action:github/codeql-action` read every `uses:`
      (crates/toolbox-connector-workspace/src/workflows.rs:243-251).
    suggestion: >-
      Retire the rule (see threshold-justified), or set codeScanningPinned
      from the parsed workflows: true only when every `uses:` whose action is
      github/codeql-action has pin `sha`.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The regex runs over raw text, comments included, so a line `#
      github/codeql-action/init@<any 40 hex>` in any workflow passes gold, as
      does an unused step. codeql.yml already carries a comment naming the
      action (.github/workflows/codeql.yml:2), one SHA away from being such a
      line.
    suggestion: >-
      Read the parsed `uses:` values, as above, rather than matching text.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The evidence is one fixed sentence, "missing or not pinned"
      (portal/standards/repository.yaml:120), with no file or line, and the
      fix only says to pin. Since D01M82E93XAPNE0WFXEPJZ59WG4 retired
      `code-scanning`, a repository with no CodeQL workflow (acme/unsafe,
      portal/fixtures/workspace.ndjson:61) fails here, and nothing in the fix
      says to add one; there is nothing to pin.
    suggestion: >-
      Split the evidence: "no workflow uses github/codeql-action (add one;
      Scorecard's SAST check documents it)" versus each unpinned use as `<ref>
      at <file>:<line>`, reusing the workflow records' `unpinnedAt`.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      The level rests on a condition the repository says ends it: the rule
      "stays until Scorecard's Pinned-Dependencies reaches 10 here"
      (repository.yaml:99-102, :126-127; D01M82E93XAPNE0WFXEPJZ59WG4 §2;
      docs/design/openssf-template.md:73 and O1 at :112), and
      portal/results.json now records maintainer-openssf:Pinned-Dependencies
      at ten. It is also implied by a bronze rule elsewhere, pinned-to-sha on
      codeql.yml, against docs/design/thresholds.md:24-25 ("gold asks for what
      lower levels don't already imply").
    suggestion: >-
      Retire code-scanning-pinned under a new decision that records
      Pinned-Dependencies at 10. Give maintainer-supply-chain a gold that
      isn't implied elsewhere (for example per-directory Dependabot coverage),
      and update docs/design/supply-chain-standards.md §3.
summary: >-
  A stopgap that has outlived its stated condition: Pinned-Dependencies is
  at 10, and pinned-to-sha already checks every codeql-action use. The
  check itself is a text regex satisfied by one pinned use or even a
  comment, and its evidence and fix don't cover a repository with no
  CodeQL at all.
