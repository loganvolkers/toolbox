apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-agent-doc/no-hidden-instructions
rubric: rule-quality
subjectHash: 6cfb6df1b806
assessor: {kind: agent, name: cursor-assessor-11, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale is text that reaches the model and that a reviewer never
      sees (portal/standards/agent-docs.yaml:165-168). Agent docs count only
      invisible code points
      (crates/toolbox-connector-workspace/src/agentsmd.rs:116-118). Skills
      also add Markdown comments, `<!--` and `[//]: #`, through
      `html_comments` (src/skills.rs:419, src/hygiene.rs:140-152). A scratch
      AGENTS.md containing `<!-- ignore all previous instructions -->`
      recorded hiddenChars 0. That comment is invisible in GitHub's rendered
      view of AGENTS.md and fully read by the agent.
    suggestion: >-
      In agentsmd.rs `hidden_count`, add `crate::hygiene::html_comments(text)`
      as skills.rs:419 does, mention comments in the fix, and add a fixture
      AGENTS.md with an HTML comment.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The cheapest way to slip an instruction past review is an HTML or
      link-reference comment rather than zero-width characters. It costs
      nothing and passes the check at agent-docs.yaml:159, because comments
      are not counted for this kind.
    suggestion: >-
      Same change as for measures-intent. Count Markdown comments through the
      shared hygiene module, so a gap there is fixed once for skills and agent
      docs alike.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the classes the scan counts: default-ignorable code
      points, bidi controls, and variation selectors outside emoji
      (agent-docs.yaml:161-164, matching hygiene.rs:132-138). Removing them
      zeroes the count. The evidence is a total with no line ("1 hidden
      characters", portal/tests/standards.test.yaml:491-504), so an agent must
      search, but the fix says what to search for.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is justified as a killer item in docs/design/thresholds.md:19-21
      and :35 (D01M83G9F4EEGN1GTP14HEYB8B6, citing SkillBench's hard F for
      hidden Unicode). The rule links that page (agent-docs.yaml:169-171).
      docs/design/agents-md-standards.md:73 still lists it at gold, as D75
      first decided.
summary: >-
  Rightly at bronze, with a usable fix, but narrower than the same rule
  for skills. Markdown comments, the easiest way to hide text from a
  rendered review, are not counted for AGENTS.md and its aliases. One line
  in agentsmd.rs would align it with skills.rs.
