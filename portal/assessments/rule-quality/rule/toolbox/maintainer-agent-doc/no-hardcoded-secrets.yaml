apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-agent-doc/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 106b8e9e7a71
assessor: {kind: agent, name: cursor-assessor-11, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The detector knows these shapes: AWS, GitHub, `sk-ant|proj|live`,
      Stripe, Slack, PEM private keys and URL passwords
      (crates/toolbox-connector-workspace/src/hygiene.rs:13-33). Its own doc
      calls them "the floor, not the scanner" (hygiene.rs:5-7). A scratch
      AGENTS.md holding a legacy OpenAI `sk-` key of 48 characters, a Google
      `AIzaSy…` key and `password=hunter2hunter2` reported only the Slack
      token on the same line. An instruction file's likeliest credential is an
      `export X_API_KEY=…` setup line, and most of those shapes pass.
    suggestion: >-
      Add the Google API key, JWT and legacy `sk-` shapes to hygiene.rs, plus
      assignments to names ending in KEY, TOKEN, SECRET or PASSWORD with a
      literal value. Better, run gitleaks or trufflehog in a SARIF slot and
      let this rule read its findings for the file, as the hygiene module's
      own note suggests.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      For text files the split-prefix detection is off: `secrets()` passes
      `code = false` (hygiene.rs:110-112). So a token broken across two lines
      or wrapped mid-token in Markdown is not seen, and the prompt still
      carries it. Any credential of an unlisted shape also passes with no
      effort.
    suggestion: >-
      Same change as for measures-intent. In Markdown, also join each line
      with the next before matching, so a token wrapped at the prefix is
      found.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `path:line kind` (hygiene.rs:82), e.g. ['CLAUDE.md:2
      aws-access-key'] on the unsafe fixture
      (portal/tests/standards.test.yaml:491-504). The fix says to remove that
      credential (portal/standards/agent-docs.yaml:147-149). Removing it
      empties the list.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is justified as a killer item in docs/design/thresholds.md:19-21
      and :35, moved from gold by D01M83G9F4EEGN1GTP14HEYB8B6. The rule links
      that page (agent-docs.yaml:154-156). The design doc's ladder still lists
      it at gold (docs/design/agents-md-standards.md:72), as D75 originally
      decided. That doc is stale, but the placement is justified.
summary: >-
  Correctly at bronze, and the fix works, but the detector is a floor of
  seven shapes. Common keys (Google, legacy OpenAI, password assignments)
  and tokens wrapped across lines pass. Feeding a real scanner's findings
  into the rule would make the bronze promise hold. agents-md-standards.md
  §4 still places this rule at gold.
