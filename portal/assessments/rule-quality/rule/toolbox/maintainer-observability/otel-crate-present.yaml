apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-observability/otel-crate-present
rubric: rule-quality
subjectHash: ea2220eeb033
assessor: {kind: agent, name: cursor-assessor-09, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The check passes when the declared `crate` path exists
      (portal/standards/observability.yaml:38-42, computed from `missingPaths`
      in crates/toolbox-connector-workspace/src/data.rs:77-93). The fix
      promises a crate "with opentelemetry dependencies", and the rationale
      (observability.yaml:123-125) and D01M81ADN8C10EA1Z1VNRY3A5JZ promise the
      *sole* bootstrap. The check reads neither. Today both hold:
      crates/toolbox-telemetry/Cargo.toml:10-19 has the OTel dependencies, and
      no other crate's Cargo.toml names opentelemetry. But an empty directory
      would pass, and so would a second crate setting up its own exporter.
    suggestion: >-
      Check the workspace connector's `crate:toolbox-telemetry` record (it
      exists and lists dependencies) for `opentelemetry_sdk` and
      `opentelemetry-otlp`. Add a companion check that no other crate depends
      on them directly, which is the sole-bootstrap part of
      D01M81ADN8C10EA1Z1VNRY3A5JZ.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The record names its own evidence
      (portal/observability/runtime.yaml:10). Any existing directory passes,
      `crate: crates` for one, and `crate: ""` passes too, because `missing()`
      skips empty paths (data.rs:87), so `"" in missingPaths` is false.
    suggestion: >-
      Don't let the checklist choose the path: derive the crate from the
      workspace's crate records (or fix the expected name in the rule), and
      treat an empty or absent path as missing.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the missing path itself (`missingCrate`, e.g.
      `crates/missing-telemetry` in the demo-unsafe fixture,
      portal/fixtures/workspace.ndjson:83), and the fix names
      crates/toolbox-telemetry and the workspace. Creating the crate passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no threshold. Bronze follows from D01M81ADN8C10EA1Z1VNRY3A5JZ,
      which makes the crate the one owner of bootstrap and the metric catalog,
      and from the scorecard rationale that bronze is "the crate and catalog
      that keep Prometheus and OTLP names from drifting"
      (observability.yaml:101-102).
summary: >-
  A justified bronze floor that checks the wrong thing: whether a path
  exists, rather than whether the crate has the OTel dependencies and is
  the only one that does. Because the checklist declares its own path, an
  empty or unrelated directory passes, and the real crate passes only by
  coincidence.
