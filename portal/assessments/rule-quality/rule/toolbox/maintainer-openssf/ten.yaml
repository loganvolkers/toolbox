verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The rule's name and fix claim only Scorecard's own verdict: pass means
      Scorecard scored the check 10
      (packages/openssf-scorecard/fragments/openssf-scorecard.yaml :138-149),
      read with nothing reinterpreted
      (crates/toolbox-connector-runner/src/scorecard.rs:12-40). A -1 is null,
      so an inconclusive check is unknown, not failing (:140-141). That is the
      carry-as-is that D01M82E93XAPNE0WFXEPJZ59WG4 decides. The run is on
      tracked files (`tracked: true`, fragment :48-62), so local and CI agree.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Fuzzing reads ten here (portal/results.json) because
      .clusterfuzzlite/build.sh builds `fuzz_noop`, a libFuzzer target whose
      body returns 0 and touches no Toolbox code (build.sh:6-17), and no
      workflow under .github/workflows runs ClusterFuzzLite. Scorecard credits
      the config's presence, so a no-op file took the check from 0
      (docs/design/openssf-template.md:80) to 10, cheaper than fuzzing
      anything. The ratchet now guards that 10.
    suggestion: >-
      Either fuzz something real (a cargo-fuzz target over the manifest or CEL
      parser, run by a ClusterFuzzLite workflow), or waive Fuzzing in
      portal/waivers.yaml with a decision saying the 10 is presence only. And
      add a local rule beside the carried check that fails when the fuzz
      targets cover no workspace crate (the A + S arm, openssf-template.md
      O6).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is Scorecard's Warn lines plus the check's documentation
      URL (fragment :144-146). For Pinned-Dependencies the fixture's Warn
      lines name each file and line and the digest to write
      (portal/fixtures/maintainer-openssf.ndjson:1), and the test pins the gap
      and three evidence items
      (packages/openssf-scorecard/tests/standards.test.yaml :7-14). Each
      record's `command` reruns Scorecard alone.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Ten is Scorecard's maximum, kept as OpenSSF defines it
      (D01M82E93XAPNE0WFXEPJZ59WG4; docs/design/openssf-template.md:28-32),
      with the gap to 10 as the measure. Vulnerabilities is excluded with a
      measured reason, a score that reads 10 when OSV is unreachable
      (openssf-template.md:83-88; portal/toolbox.yaml:366-367).
summary: >-
  A clean carry of OpenSSF Scorecard: the rule means exactly what
  Scorecard says, inconclusive checks are unknown, and the evidence and
  reproduce command come from the tool. It inherits Scorecard's presence
  checks, though: this repository's Fuzzing 10 comes from a no-op fuzz
  target no workflow runs, and the ratchet now protects that number.
