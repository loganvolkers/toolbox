apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/vs-backstage-performance/list-throughput
rubric: rule-quality
subjectHash: dd3bde14933e
assessor: {kind: agent, name: cursor-assessor-16, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale is about filters that scan every entity and stall as the
      catalog grows (portal/standards/backstage-comparison.yaml:314-317). But
      the only filter measured is `entity.owner=='group:gN'` with one kind
      (measure.py:168-170). Since `916f596`, that shape is served from a
      per-snapshot field index, and `||`, `in`, numeric comparisons and nested
      selects still fall back to the full scan (ADJUDICATION.md:155-162). So
      passing shows that the indexed shape is fast at 10k. It does not show
      that a filter which still scans copes at 10k, which is the risk the
      rationale names.
    suggestion: >-
      Add a second list URL to measure.py with a filter the index cannot
      narrow, such as `entity.owner in [...]` or an `||` of two owners, and
      score `listRps` as the slower of the two. Otherwise narrow the rationale
      to owner-equality filters.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Only 200 responses count toward the rate (measure.py:128-130). The
      equivalence gate (measure.py:270-273) refuses a run whose lists do not
      page out the corpus's owner and component pairs, which rules out the
      empty-list speed that flattered Backstage in rounds 1 and 2
      (RESULTS.md:40-47).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names `list_entities` in crates/toolbox-api/src/routes.rs. That
      is where round 1's loss, 198/s at 10k, was fixed: `916f596` took it to
      3,900/s (RESULTS.md:136-144, 168-169). The harness and snapshot.py
      (run.sh:4) then update the record.
  - criterion: threshold-justified
    verdict: unsure
    reason: >-
      The 20/s bar is pre-registered (README.md:39; ADJUDICATION.md §3.1), but
      no source derives it. It sits far below the plan's 500 RPS across 3
      replicas for reads, queries included (docs/plan.md:920). Round 1's 198/s
      passed it by about 10 times while Toolbox was 2.4 times behind
      (RESULTS.md:102-107), so the bar played no part in that verdict.
    suggestion: >-
      Derive the bar from the plan's read SLO, for example about 170/s per
      replica, or say in docs/design/thresholds.md why 20/s is the floor.
summary: >-
  The measurement is robust (gate-checked, 200s only), and the fix names
  the function that fixed the last loss. But the rule's rationale is about
  scanning filters, while the one filter measured is the indexed shape, so
  a scanning filter's collapse at 10k would go unseen. The 20/s bar is
  unexplained and too low to have caught round 1.
