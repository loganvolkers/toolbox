apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/vs-backstage-performance/catalog-readable
rubric: rule-quality
subjectHash: 03804e851b08
assessor: {kind: agent, name: cursor-assessor-16, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The value runs from exec until the last component is readable through
      the authorized API (measure.py:166-167 and 264-267), so it covers ingest
      and recompute, and it reads through OpenFGA. Before any timing, an
      equivalence gate checks that every owner's components are served
      (measure.py:270-273). The rationale limits the rule to the first ingest
      (portal/standards/backstage-comparison.yaml:253-256), which is what it
      measures. One caveat: Toolbox's catalog arrives as a single bulk POST to
      /v1/ingest (README.md:22), not through the git-files connector that
      RESEARCH.md §1.1 (lines 90-91) named. A connector-fed portal could be
      slower and still pass.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Readability is probed on the last generated id, component:c{n-1}, with
      the client's PAT. The gate pages out every owner's components and
      compares a SHA-256 against the corpus (measure.py:97-108, 270-273). Only
      a server that publishes the whole catalog can pass early. A partial
      snapshot that answers c{n-1} first would fail the gate.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix points at the ingest and recompute timings in the serve logs and
      at the derive laps. Those are the two components of the value. It also
      names the harness to rerun, and run.sh:4 says snapshot.py writes the
      record. An agent following it measures the right things and refreshes
      portal/comparisons/toolbox.yaml.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The 60 s bar is pre-registered in README.md:37 and matches the product's
      own freshness budget: webhook to visible in under 60 s p95
      (docs/plan.md:921, docs/v1-spec.md:523). ADJUDICATION.md §3.1 confirms
      that the scorecard implements it as written. Bronze is the single level
      of a comparative scorecard (D01M857ZB468ZM2YS6GNSEG6YB9).
summary: >-
  A good rule: it times the first full, authorized, gate-checked ingest,
  and its bar is the plan's 60 s freshness budget. Its only blind spot is
  the ingest path: the harness bulk-posts the catalog rather than feeding
  it through a connector. Toolbox's 2.15 s against Backstage's 26.61 s is
  far from the bar either way.
