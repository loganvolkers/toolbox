apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/review-assessment/passes-review
rubric: rule-quality
subjectHash: 3cc92c205b47
assessor: {kind: agent, name: campaign-review-rules-r4}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check needs a current review with no failing criterion, no uncited
      reason, and grounding in the assessment it reviews
      (portal/standards/assessments.yaml:287-297, reviewGrounded at :108-116),
      and independence is held at silver, where `assessed` refuses a
      self-review (assessments.yaml:272-286). That is the gold the ladder in
      docs/design/thresholds.md:57 describes.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      ground() now requires every reason to cite a source the subject cites or
      its own file (crates/toolbox-connect/src/assessment.rs:244-292), which
      closes one grounded reason plus any file for the rest. But it accepts
      the same shared source for every criterion. Most rule-quality
      assessments cite docs/design/thresholds.md for threshold-justified (for
      example
      portal/assessments/rule-quality/rule/toolbox/maintainer-site/titled.yaml
      and
      portal/assessments/rule-quality/rule/toolbox/meta-rule/readable.yaml),
      so a review by another name whose four reasons each read "Consistent
      with docs/design/thresholds.md." is grounded, cited and passing, and
      reaches gold without checking anything. That is the round-3 route
      unchanged. It is a rubber stamp, the trivial-test analogue, and states
      nothing false; the self-declared name is the separate limit
      thresholds.md:65-72 states.
    suggestion: >-
      Ground per criterion: a review's reason for criterion C must cite a
      source the subject's reason for C cites (other than the subject's own
      file), or, for a fail or unsure, any source; and reject a review whose
      reasons are identical across criteria. Add a fixture review that cites
      one shared page for every verdict and stays below gold.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix separates failed criteria (revise the assessment) from items
      marked "fix the review" (its reasons must cite the assessment's file or
      its sources), matching the evidence's labels
      (portal/standards/assessments.yaml:292-303).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Gold is stated in D01M831P5QWJQ4A2FT85N5MXJQF and in the review-* ladder
      at docs/design/thresholds.md:57 (a current review that passes, cites
      what resolves and is grounded); it asks for more than bronze and silver
      do.
summary: >-
  Independent round-4 review of e3c0da1. Per-reason grounding closes a
  review that grounds one reason and cites anything for the rest, but not
  the round-3 route: citing one page the assessment also cites, such as
  thresholds.md, for every criterion still reaches gold.
