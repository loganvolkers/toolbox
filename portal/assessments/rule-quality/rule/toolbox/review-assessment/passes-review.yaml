apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/review-assessment/passes-review
rubric: rule-quality
subjectHash: 7a94e79ab59d
assessor: {kind: agent, name: campaign-review-rules}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check reads a current review with no failing criterion and no
      uncited reason (portal/standards/assessments.yaml:190-197, with
      reviewUncited at :72-79). Self-review is held back by silver `assessed`
      (`!entity.selfReviewed`, assessments.yaml:179-189), and doubts by
      `no-doubts`, so the card's gold means what docs/design/thresholds.md §3
      says.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempt: the assessment's own author writes the review under a
      different `assessor.name`, with every verdict `pass` and a reason such
      as "Fine; see README.md." selfReviewed compares only the self-declared
      names (assessments.yaml:81-87), and any existing file name resolves in
      cites() (crates/toolbox-connect/src/assessment.rs:41-47), so the review
      is cited and the rule passes. thresholds.md §3 accepts the rename as "a
      false statement in a committed file", but writing a fake review is still
      far cheaper than getting a real one.
    suggestion: >-
      Have the workspace connector record the git author of each assessment
      file (`git log -1 --format=%ae`), and treat a review whose author
      matches the assessment's as self-review; tighten cites() as suggested
      for cites-for-findings.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The evidence has two kinds of entry: failing criteria, and "<criterion>
      cites nothing that resolves" (assessments.yaml:193-197). The second is a
      defect in the review's reasons, not in the assessment, yet the fix says
      "Revise the assessment where the review found it unsupported"
      (assessments.yaml:199-201). An agent following it edits the wrong file.
      The edit only helps by accident, because it makes the review stale.
    suggestion: >-
      Add to the fix: "If the evidence says a criterion cites nothing, the
      review is at fault: have it redone with reasons that cite a file,
      decision or URL."
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Gold is stated in D01M831P5QWJQ4A2FT85N5MXJQF and in the ladder in
      docs/design/thresholds.md §3 ("a current review that passes, cites what
      resolves"). It now asks for something the lower levels don't
      (reviewUncited empty), so the earlier "implied by bronze and silver"
      fail is fixed.
summary: >-
  Gold now adds something, but a renamed self-review citing any existing
  file still passes, and the fix sends an agent to the wrong file when the
  review is the one that is uncited.
