apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/sdlc-stage/built
rubric: rule-quality
subjectHash: 57ef826bf03b
assessor: {kind: agent, name: cursor-assessor-13, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The check is `entity.status == 'built' && entity.gaps.size() == 0`
      (portal/standards/sdlc.yaml:237), two values the author writes. The
      rationale promises "stages that work today with nothing left open"
      (sdlc.yaml:240-243). maintainer/plan passes this rule with `commands:
      []` and `checks: []` (portal/sdlc/stages/maintainer.yaml). Its only
      failures in portal/results.json are agent-operable and automated, so the
      report shows `built: pass` on a stage nothing runs or verifies. The
      scorecard's ladder keeps it at bronze. But the rule's own outcome says
      something its facts don't, and sdlc-layer's rationale rejects exactly
      this: "A status is the author's own claim" (sdlc.yaml: 287-291).
    suggestion: >-
      Make the rule self-contained: `entity.status == 'built' &&
      entity.gaps.size() == 0 && entity.commands.size() > 0 &&
      entity.unresolvedCommands.size() == 0 && entity.checks.size() > 0 &&
      entity.notInCi.size() == 0`, so `built: pass` never appears on a stage
      without a runnable command and a CI check.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The cheapest pass is to edit two YAML fields: set `status: built` and
      empty `gaps:`. Nothing checks that the gaps were closed. thresholds.md
      acknowledges this and relies on the silver facts to bound it, rather
      than tying gold to a review (docs/design/thresholds.md:75-77,
      D01M831P5QWJQ4A2FT85N5MXJQF). That bounds the level, not this rule.
    suggestion: >-
      Besides the conjunction above, make each gap a checkable item (a
      question id like `Q16`, or a path or command that must exist) so the
      connector can report gaps that are still open even after the list is
      emptied.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists the open gaps, or the status when there are none
      (sdlc.yaml:238). The fix says to close them, set `status: built` and
      empty `gaps:` (sdlc.yaml:239). Following it passes, as for the fixture
      demo-partial/ship with `rebuilds from source`
      (portal/tests/standards.test.yaml:1055-1056).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. docs/design/thresholds.md:57 gives "status built with no
      gaps" as sdlc-stage's gold, and thresholds.md:75-77 explains why gold
      reads the declared status rather than a review. 7 of 26 live stages pass
      it (portal/results.json), so it separates stages.
summary: >-
  A gold rule that reads only what the author declares. It passes
  maintainer/plan, which has no command and no check, and two edits pass
  it anywhere. The ladder limits the damage, but the rule's outcome claims
  more than its facts show. Folding the silver facts into the check would
  make `built: pass` mean what the name says.
