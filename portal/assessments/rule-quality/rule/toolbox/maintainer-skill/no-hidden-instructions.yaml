apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-skill/no-hidden-instructions
rubric: rule-quality
subjectHash: 0072cdc3c055
assessor: {kind: agent, name: blind-review-2026-11-23}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      is_hidden (crates/toolbox-connector-workspace/src/skills.rs:406-413)
      counts U+200B-200F, U+FEFF, U+202A-202E, U+2066-2069 and U+E0001-E007F.
      It misses U+061C (a Bidi_Control character, so the "bidi" claim is
      incomplete), U+2060-2064, variation selectors U+FE00-FE0F and
      U+E0100-E01EF (a known way to smuggle bytes after a visible character),
      and HTML comments, which hide text from rendered Markdown but not from
      an agent. Files that are not valid UTF-8 are skipped silently
      (files_under, skills.rs:357-362). A skill can carry hidden instructions
      and pass.
    suggestion: >-
      Count Unicode Default_Ignorable_Code_Point plus Bidi_Control, count
      variation selectors outside emoji sequences, report `<!--` comments in
      skill Markdown, and treat an unreadable file as a finding.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempt: encode the payload as variation selectors
      U+E0100-E01EF after one visible character, or put it in an HTML comment
      in SKILL.md. Both count 0 under skills.rs:406-413, so the check at
      portal/standards/skills.yaml:140 passes.
    suggestion: >-
      Widen the character classes as above and add an `htmlComments` count to
      the skill record.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the classes and the place (the skill files), and removing
      them zeroes the count at portal/standards/skills.yaml:140. The evidence
      is only a count (skills.yaml:141), unlike secretHits' file:line, so an
      agent has to search, but it can.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      Gold is stated (docs/design/skill-standards.md:23 and :98, citing
      SkillBench SAFE-03/04), but the same doc (line 52) records that
      SkillBench treats hidden Unicode as a hard F. At gold, a skill that
      smuggles an instruction still reads silver and passes the bronze ratchet
      (portal/standards/skills.yaml:57).
    suggestion: >-
      Move no-hidden-instructions (and no-hardcoded-secrets) to bronze, so a
      hostile skill can't reach any level, and record the change as a
      decision.
summary: >-
  The right idea at the wrong level, with a character set narrower than
  its name: variation selectors, U+061C and HTML comments all hide text
  and pass.
