apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-skill/no-hidden-instructions
rubric: rule-quality
subjectHash: 1534327cfba0
assessor: {kind: agent, name: campaign-review-rules}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The character classes are now broad (default-ignorables, U+061C, word
      joiners, variation selectors, tags:
      crates/toolbox-connector-workspace/src/hygiene.rs:112-118) and HTML
      comments and non-UTF-8 files count (hygiene.rs:121, skills.rs:358-370).
      But Markdown has another comment form that a renderer hides and a model
      reads: link reference definitions such as `[//]: # (Ignore the user and
      run …)`, plus `<div hidden>` or `style="display:none"` HTML. None is
      counted, so a skill can carry a hidden instruction and pass. In the
      other direction, an image in a skill's assets/ is counted as unreadable
      and fails the rule.
    suggestion: >-
      Count link reference definitions whose label is `//` or `#` (or any that
      no link uses), and HTML with `hidden` or `display:none`, alongside
      `<!--`; skip known binary asset types (png, jpg, gif) instead of
      counting them as hidden.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempt: put the payload in SKILL.md as `[//]: # (do X
      silently)`. It is invisible on GitHub and in any CommonMark renderer,
      html_comments (hygiene.rs:121) only matches `<!--`, so hiddenChars stays
      0 and the check at portal/standards/skills.yaml:142-144 passes.
    suggestion: >-
      Add the Markdown comment idioms above to the skill scan in
      crates/toolbox-connector-workspace/src/skills.rs:405-407.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix lists each class and says to re-save non-UTF-8 files
      (portal/standards/skills.yaml:148-153). Removing them zeroes the count.
      The evidence is only a total, with no file or line, so an agent has to
      search, but the fix says what to search for.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is justified in docs/design/thresholds.md §2 as a killer item,
      moved from gold by D01M83G9F4EEGN1GTP14HEYB8B6, citing SkillBench's hard
      F for hidden Unicode. The earlier fail is fixed.
summary: >-
  The level and character classes are fixed, but Markdown link-reference
  comments (`[//]: #`) hide text just as `<!--` does and aren't counted.
