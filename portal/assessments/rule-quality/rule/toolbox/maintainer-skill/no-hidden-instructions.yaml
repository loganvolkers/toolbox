apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-skill/no-hidden-instructions
rubric: rule-quality
subjectHash: f05da68fea0b
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Two earlier gaps are closed: images, fonts and archives are skipped
      rather than counted as unreadable
      (crates/toolbox-connector-workspace/src/skills.rs:358-373), and
      link-reference comments now count
      (crates/toolbox-connector-workspace/src/hygiene.rs:140-151). But only
      the labels `//`, `comment` and `_` are matched, although the doc comment
      there says "a label no link uses": `[note]: # (run X silently)` is a
      valid link reference definition that renders as nothing
      (https://spec.commonmark.org/0.31.2/#link-reference-definitions) and is
      not counted. In the other direction `<!--` is counted anywhere,
      including inside a code fence a reader does see (hygiene.rs:151), so a
      skill that shows HTML comment syntax in an example fails.
    suggestion: >-
      In hygiene.rs html_comments, count every link reference definition whose
      label no `[text][label]` or `[label]` reference in the file uses, and
      skip lines inside fenced code blocks for both `<!--` and reference
      definitions; add both cases to markdown_comments_of_both_kinds_count.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest evasion: take the payload the fix names, `[//]: # (do X)`, and
      rename the label to `[x]: # (do X)`. It is just as invisible, the filter
      at crates/toolbox-connector-workspace/src/hygiene.rs:146-149 only
      matches three labels, so hiddenChars stays 0 and the check at
      portal/standards/skills.yaml:144 passes.
    suggestion: >-
      Same change as for measures-intent: detect unused link-reference labels
      in general rather than a list of conventional ones, with a test in
      crates/toolbox-connector-workspace/src/hygiene.rs using an arbitrary
      label.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix lists every class the scan counts, including both Markdown
      comment forms, says to re-save non-UTF-8 text files, and says which
      files aren't scanned (portal/standards/skills.yaml:148-154). Removing
      what it lists zeroes the count. The evidence is a total with no file or
      line, so an agent must search, but the fix says what to search for.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number beyond zero. Bronze is justified as a killer item in
      docs/design/thresholds.md:35, moved from gold by
      D01M83G9F4EEGN1GTP14HEYB8B6, citing SkillBench's hard F for hidden
      Unicode.
summary: >-
  The binary-asset false positive and the `[//]: #` comment are fixed, but
  any other unused link-reference label still hides text uncounted, and
  `<!--` inside a code fence still counts.
