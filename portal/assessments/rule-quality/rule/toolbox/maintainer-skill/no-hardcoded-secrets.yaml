apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-skill/no-hardcoded-secrets
rubric: rule-quality
subjectHash: fee70586bcfe
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rule says no credential reaches installs
      (portal/standards/skills.yaml:258-262), but secretHits matches eight
      provider shapes only
      (crates/toolbox-connector-workspace/src/hygiene.rs:13-34). A scratch
      skill's scripts/helper.js held a GitLab `glpat-…`, a Google `AIza…` key
      and a legacy OpenAI `sk-` key of 48 characters. Through
      target/debug/toolbox-connector-workspace it reported secretHits []. The
      connector says these patterns are "the floor, not the scanner"
      (hygiene.rs:5-7), so passing means "none of eight shapes", not "no
      credential". No live skill carries one (43 of 43 pass).
    suggestion: >-
      Add the common missing shapes (glpat-, AIza, npm_, legacy sk- of 48
      characters, Azure and GCP service-account JSON `private_key_id`). When
      gitleaks or trufflehog is installed, read its SARIF through the runner
      slot and merge it into secretHits. Keep the regexes as the floor.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Skill files are scanned as text, with `code` false
      (crates/toolbox-connector-workspace/src/skills.rs:412,
      hygiene.rs:110-112). So the split-literal detection the same module has
      for code (hygiene.rs:85-104) is off for a skill's scripts/. In the
      scratch run, `"gh" + "p_" + 36 characters` in helper.js was not
      reported, though the connector record scan would catch it. Splitting a
      token is the cheapest evasion, and it lands in a file every install
      runs.
    suggestion: >-
      In scan_files, call secrets_in_lines with `code` true for files with a
      script extension (.js, .cjs, .mjs, .ts, .py, .sh, .rb). Add a fixture
      skill with a split token in scripts/ that must fail.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence gives `file:line kind` without the secret, e.g. `SKILL.md:9
      github-token` (portal/tests/standards.test.yaml:370). The fix says to
      remove it and refer to the secret by name, which clears the finding.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is the killer-item principle in docs/design/thresholds.md:19-21
      and 34: a credential at gold passed the bronze ratchet, so
      D01M83G9F4EEGN1GTP14HEYB8B6 moved it to the floor. Several docs still
      say gold and are stale: docs/design/skill-standards.md:99,
      portal/README.md:26 and docs/design/toolbox-for-toolbox.md:109.
summary: >-
  The level is justified and the fix and evidence work. The rule is weaker
  than its rationale. It matches eight provider shapes, so GitLab, Google
  and legacy OpenAI keys pass. Skill scripts are scanned as text, so a
  token split across string literals passes, though the connector catches
  that in code elsewhere. Three design docs still list the rule at gold.
