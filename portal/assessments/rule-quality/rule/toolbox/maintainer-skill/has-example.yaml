apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-skill/has-example
rubric: rule-quality
subjectHash: 2ed5921d460f
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The fix asks for a block with a concrete command, input or output
      (portal/standards/skills.yaml:147-149). But code_fences counts every
      opening ``` line, whatever the block holds
      (crates/toolbox-connector-workspace/src/skills.rs:309-321). On a scratch
      skill, an empty fence pair counted as one block through
      target/debug/toolbox-connector-workspace, and so did a fence wrapping a
      numbered prose list. In the other direction, an example given only as an
      indented code block or inline code fails. The five live failures
      (add-permission, add-scorecard, assess-entity, review-plan,
      toolbox-authoring in portal/results.json) really have no example, so the
      misfire is latent.
    suggestion: >-
      Count a fence only when it has at least one non-blank line. Count it as
      an example only if that line starts with a command the portal knows
      (`toolbox`, or a `commands` capture match) or the block has an info
      string such as yaml, json or sh. Add an empty-fence fixture that must
      fail.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The check is `entity.codeFences > 0` (portal/standards/skills.yaml:145),
      and code_fences counts each opening ``` line
      (crates/toolbox-connector-workspace/src/skills.rs:309-320), so the
      cheapest pass is two lines of ``` with nothing between them. That takes
      less work than writing the example, and nothing a reviewer sees in the
      rendered page flags it.
    suggestion: >-
      Same as above: require a non-blank line inside the fence.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The check is one comparison, so the constant evidence "no fenced code
      block in SKILL.md" is the whole answer
      (portal/tests/standards.test.yaml:354-355). The fix names the file and
      the construct, and adding any fenced block passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule has no number beyond "at least one". Silver is "an agent can
      follow it" (portal/standards/skills.yaml:52-53;
      docs/design/skill-standards.md:21, 92), and Anthropic's examples pattern
      is the cited source (skills.yaml:154-156). That puts it above the
      loadability floor, and D72 records the ladder.
summary: >-
  The level and the fix are sound, and the five live failures are skills
  that do lack an example. But the fact counts fences, not examples, so an
  empty ``` pair passes, at less cost than writing a real command.
  Requiring a non-blank line, or a command or info string, would make
  passing mean what the fix says.
