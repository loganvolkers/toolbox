apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-skill/valid-frontmatter
rubric: rule-quality
subjectHash: 687166dd8a3b
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      frontmatterErrors re-implements the skills-ref validator's checks
      (crates/toolbox-connector-workspace/src/skills.rs:85-275): the allowed
      fields, the name's shape, length and match with the directory,
      description presence and its 1024 limit, compatibility ≤ 500, metadata
      as a string map, and allowed-tools as a string. docs/research-log.md:75
      records skills-ref 0.1.1 accepting every skill in the plugin, and all 43
      live skills have no frontmatter errors, so the two agree on this
      catalog. The one stated difference, no NFKC normalisation of names, is
      documented (docs/design/skill-standards.md:69). It could only reject a
      non-ASCII name that a harness would load.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Every error names a spec requirement, and the only way to clear it is to
      meet that requirement: rename the directory or the name, drop the extra
      field, or shorten the description. The unit tests pin an uppercase name,
      an extra `version` field and a directory mismatch (skills.rs:615-649).
      There is no cheaper edit that passes.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the validator's own messages, e.g. "Directory name
      'unsafe' must match skill name 'Unsafe'"
      (portal/tests/standards.test.yaml:370). The fix names the four areas
      they cover (portal/standards/skills.yaml:86-87), and each message says
      exactly what to change.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The limits are the Agent Skills spec's: name ≤ 64, description ≤ 1024,
      compatibility ≤ 500 (skills.rs:12-14;
      docs/design/skill-standards.md:46). Bronze is argued in the rationale: a
      harness that cannot parse the frontmatter does not load the skill, so
      every later rule is moot (skills.yaml:89-92, D72).
summary: >-
  A sound rule. It reproduces the spec validator's checks, agrees with
  skills-ref on all 43 skills, and its evidence is the validator's own
  wording. It sits at bronze because a skill the harness can't load does
  nothing. The only divergence, no NFKC normalisation, is documented and
  can only err towards rejecting a name.
