apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-skill/within-body-budget
rubric: rule-quality
subjectHash: 143d3020e398
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The rationale is the cost of loading the body when the skill is selected
      (portal/standards/skills.yaml:180-183). bodyLines and estimatedTokens
      are measured on exactly that body, after the frontmatter
      (crates/toolbox-connector-workspace/src/skills.rs:47-48, 100-113).
      Characters divided by 4 is an estimate, and it is named as one in the
      fact, the evidence and the doc (docs/design/skill-standards.md:71). The
      largest live body is add-action at 206 lines and about 2,464 tokens,
      inside both bounds.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The cheapest pass is to move detail into references/, and that is the
      spec's own progressive-disclosure pattern and what the fix asks for.
      Moving text into the description instead is capped at 1024 characters by
      valid-frontmatter (skills.rs:226-233). The one-level-deep rule's file
      count then caps how far references can sprawl (skills.yaml:266-281).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence states both measures ("600 lines, ~6000 tokens
      (characters/4)", portal/tests/standards.test.yaml:358-359). The fix
      gives both bounds, the same estimate and where to move the detail.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      500 lines and about 5000 tokens are the Agent Skills spec's guidance
      (docs/design/skill-standards.md:46, 94; the rule links the spec's
      progressive-disclosure section). Silver fits "an agent can follow it"
      (skills.yaml:52, D72).
summary: >-
  A sound rule. It measures the body that is loaded on selection, labels
  its token count as an estimate, takes both bounds from the spec, and its
  cheapest fix is the spec's own progressive disclosure. The largest live
  skill is well under budget.
