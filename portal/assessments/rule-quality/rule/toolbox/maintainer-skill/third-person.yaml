apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-skill/third-person
rubric: rule-quality
subjectHash: 8ba82140260d
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The pronoun list is you, your, yours, i, we, my, our, ours
      (crates/toolbox-connector-workspace/src/skills.rs:45). Words split on
      everything but letters, digits and apostrophes (skills.rs:277-282), so
      contractions are single words that are not on the list. A scratch skill
      described as "Helps when you're editing a portal and you'll need it"
      reported pronouns [] through target/debug/toolbox-connector-workspace
      and passed. "me", "us", "yourself", "we're" and "I'm" are missed the
      same way. Second person through contractions is common in descriptions,
      which is the case Anthropic's guidance warns about. All 43 live skills
      pass.
    suggestion: >-
      Add the contractions and objects (you're, you'll, you've, you'd,
      yourself, me, us, we're, we'll, i'm, i've, i'll) to the list in
      skills.rs:45, or strip `'re|'ll|'ve|'d|'m` before matching. Add a
      contraction fixture that must fail.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The check needs a non-empty description with no listed pronoun
      (portal/standards/skills.yaml:116), so emptying the description does not
      pass. The cheapest way to clear a listed pronoun is to rewrite the
      sentence without it, which is what the rule wants. Nobody rewrites "you"
      as "you're" to evade it; the contraction gap is a detection gap
      (crates/toolbox-connector-workspace/src/skills.rs:45, 277-282), judged
      above.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names each pronoun found (`pronoun: you`,
      portal/tests/standards.test.yaml:370), or says the description is empty.
      The fix lists the words to drop, and the check passes once none is left
      and the description is non-empty (portal/standards/skills.yaml:116).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule has no number. Bronze follows from the description being
      injected into the routing prompt beside every other skill's
      (skills.yaml:123-126; docs/design/skill-standards.md:90). The source is
      Anthropic's best practices, which ask for third person (D72).
summary: >-
  The level, fix and evidence are fine and the cheapest fix is the right
  one. But the word list misses contractions and object pronouns, so "when
  you're editing" passes a rule meant to keep second person out of the
  routing prompt. Adding the contractions would close the gap.
