apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/vs-backstage-security/owner-only-fields
rubric: rule-quality
subjectHash: a4c3d4e0177b
assessor: {kind: agent, name: cursor-assessor-16, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The fact (experiments/backstage-compare/facts.yaml:15-20) claims both
      halves of the rationale: fields hidden behind `can_view_details`, and
      filters that cannot probe them. It cites two tests that exercise each
      half: facets_actions_and_revocation and
      a_filter_cannot_probe_a_hidden_facet
      (crates/toolbox-api/tests/authz.rs:89, 248). The adjudicator checked
      that the narrowed list path keeps the guard, because a redacted field is
      an object and never matches a string (ADJUDICATION.md:164-179).
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The value is hand-set in facts.yaml. But its evidence is two tests that
      CI runs on every push (.github/workflows/ci.yml:24 and 52, the latter
      with OpenFGA, for toolbox-api). Removing facets or the filter guard
      fails CI before anyone could keep the fact `true` honestly. The
      adjudicator read every cited test (ADJUDICATION.md:250-254).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names both places: the facet logic in
      crates/toolbox-api/src/access.rs (`facet_needs` and `hides_details` at
      lines 219 and 243), and the tests that pin it in
      crates/toolbox-api/tests/authz.rs. These are the same files the fact
      cites.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule is boolean. It is RESEARCH.md F6 probe P5, a non-owner reading
      an owner-only field (RESEARCH.md:185). Backstage's side rests on its
      threat model, quoted in facts.yaml:105-110. Single bronze level per
      D01M857ZB468ZM2YS6GNSEG6YB9.
summary: >-
  A sound rule. The fact is hand-set but backed by two CI-run tests, one
  for hiding and one for filter probing, and the fix names those same
  files. It is one of the two rules on which Toolbox is ahead of Backstage
  on security.
