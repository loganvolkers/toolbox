apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/vs-backstage-security/extension-process-isolated
rubric: rule-quality
subjectHash: 23bbad84fc8a
assessor: {kind: agent, name: cursor-assessor-16, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The rationale is that an extension in the server's process can read its
      memory and crash or stall it
      (portal/standards/backstage-comparison.yaml:540-543). Toolbox's data
      extensions are connectors. In-image ones are spawned as child processes
      (crates/toolbox-api/src/connectors.rs:262, 316-318), and remote ones
      write only through /v1/ingest with a connector token
      (crates/toolbox-api/src/routes.rs:674-681). Each runs in its own
      process, which is the claim in facts.yaml:21-25. The adjudicator kept
      this fact as a fair "ahead" (ADJUDICATION.md:273).
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The value is hand-set in facts.yaml:21-25, but the property is
      architectural. A connector speaks NDJSON over stdin and stdout or HTTP
      (docs/design/connector-control.md:50), and there is no in-process plugin
      API to load one into the server. Asserting `true` without the process
      boundary would contradict the code the adjudicator reads.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix, "Run every connector as its own process, as
      docs/design/connector-control.md says", states the property and the
      design that defines it (connector-control.md:50-70). It names a doc
      rather than spawn_in_image in connectors.rs. Since the rule passes
      today, the fix only has to steer a regression, and the doc leads there.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule is boolean. It is RESEARCH.md F7 (extension isolation, lines 63
      and 194-207), grounded in Parnas and in Backstage's threat model ("no
      boundary between plugins that run on the same host"). Single bronze
      level per D01M857ZB468ZM2YS6GNSEG6YB9.
summary: >-
  A sound rule. Process isolation is a structural property of Toolbox's
  connector protocol, and the adjudication upheld it as a win. The fix
  could name crates/toolbox-api/src/connectors.rs instead of only the
  design doc. That would help, but the doc points to the same property.
