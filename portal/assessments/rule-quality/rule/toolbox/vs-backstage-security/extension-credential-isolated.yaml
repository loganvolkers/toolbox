apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/vs-backstage-security/extension-credential-isolated
rubric: rule-quality
subjectHash: bd3a16519e70
assessor: {kind: agent, name: cursor-assessor-16, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The fact is judged against the brief's malicious-canary standard, not
      against accidental inheritance (RESEARCH.md F7, lines 194-207). The
      round 3 adjudicator read the datastore password and the OpenFGA key out
      of /proc/<openfga>/mem as a same-user process (ADJUDICATION.md:426-452).
      On that evidence the fact is `false`
      (experiments/backstage-compare/facts.yaml:26-37). So a pass would mean
      what the rationale says: one compromised integration is not a
      compromised portal.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The value is a hand-set boolean in
      experiments/backstage-compare/facts.yaml:26-37, and no script in the
      harness runs the canary. Rounds 1 and 2 scored it `true` on evidence the
      adjudicator found too thin: a test of the allowlist constant, while a
      same-UID connector could still read the server's environment
      (ADJUDICATION.md:266-273). It took a second adjudication to score it
      `false`. The cheapest way to pass is still to rewrite the fact's
      evidence.
    suggestion: >-
      Script the F7 canary (attempts 1, 3 and 4 at least) as a connector that
      surface.py runs on the image. Derive extensionCredentialIsolated from
      the canary's successes instead of
      experiments/backstage-compare/facts.yaml.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix says to start connectors with a cleared environment and an
      allowlist, in crates/toolbox-api/src/connectors.rs. That is already done
      (`env_clear` at connectors.rs:316-318, tested by
      connectors_inherit_no_server_credentials at :589), and the rule still
      fails. The leak is OpenFGA's memory. The step after round 3 is a
      Landlock domain per connector (crates/toolbox-api/src/confine.rs:1-5),
      and RESULTS.md:250-257 says the fact stays false until the canary is
      rerun on the image. The fix names neither.
    suggestion: >-
      Rewrite the fix as: "Confine each in-image connector so that it cannot
      read sibling processes (crates/toolbox-api/src/confine.rs), then rerun
      the F7 canary on the image and update
      experiments/backstage-compare/facts.yaml through snapshot.py."
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule is boolean. RESEARCH.md F7 sets the target at zero canary
      successes beyond the extension's own config (RESEARCH.md:63). The rule
      links the round 3 results and adjudication R3.3. Single bronze level per
      D01M857ZB468ZM2YS6GNSEG6YB9.
summary: >-
  The intent is right and is now judged strictly: a same-user canary read
  OpenFGA's secrets, so the rule fails for both products. But the value is
  a hand-set fact that was overclaimed once, and the fix describes a step
  already taken. An agent following it cannot turn the fail into a pass.
  Landlock confinement plus a rerun of the canary on the image is the real
  path.
