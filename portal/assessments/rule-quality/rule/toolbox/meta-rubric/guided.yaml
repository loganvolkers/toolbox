apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/meta-rubric/guided
rubric: rule-quality
subjectHash: 3b825aeb5ae4
assessor: {kind: agent, name: campaign-review-rules}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      guides() (crates/toolbox-cli/src/model.rs:287-295) now needs at least
      five words and an outcome word, so the empty guidance the last review
      found no longer counts. A deterministic check can't tell whether
      guidance makes assessors agree; meta-rubric's gold `discriminates` and
      the review rubrics carry that judgement.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempt: `guidance: Fail when the answer is no.` Six words,
      contains "fail", and it restates the question, which the code comment at
      model.rs:287-288 says should not count. The outcome test is a substring
      match too, so words such as "failure", "bypass" or "compass" satisfy it.
      That is cheaper than real guidance and passes
      portal/standards/meta.yaml:767-773.
    suggestion: >-
      Match the outcome words as whole words, and require the guidance to name
      something besides the outcome that the question doesn't already say,
      e.g. reject guidance whose content words are a subset of the question's
      plus "fail/pass/unsure/when/answer/no/yes".
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists the criterion names, and the fix asks for `guidance:`
      "saying what counts as fail" (meta.yaml:771-773), which naturally names
      an outcome in more than five words, so following it passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Silver is stated in docs/design/scorecards-for-scorecards.md:292, and
      the five words and the outcome word are a labelled choice in
      docs/design/thresholds.md §2 (the `explains-fix`, `guided` row).
summary: >-
  An empty string no longer passes, but a restated question such as "Fail
  when the answer is no." still does.
