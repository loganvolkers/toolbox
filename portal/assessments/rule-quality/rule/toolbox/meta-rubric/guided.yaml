apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/meta-rubric/guided
rubric: rule-quality
subjectHash: d4ab6372856b
assessor: {kind: agent, name: campaign-review-rules-r4}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      guides() now needs an outcome word, a condition and at least three
      content words that are neither in the question nor filler
      (crates/toolbox-cli/src/model.rs:286-358), so the round-3 padded
      restatement fails and short real guidance such as "Fail when the fix
      names no file." passes (test at model.rs:414-420). For an honest author
      that is guidance saying where the line is; docs/design/thresholds.md:46
      labels it a lexical floor.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Generic evaluative words count as content: "Fail when the result looks
      wrong or incomplete." has `Fail`, `when` and four words outside the
      FILLER list (model.rs:295-336) and outside any rule-quality question, so
      by guides()' logic it is guided for every criterion, though it tells
      assessors nothing about where to draw the line. Writing it is cheaper
      than real guidance and falsifies nothing. The backstop thresholds.md:46
      names, assessors' agreement, is listed as a gap
      (docs/design/meta-standards-review.md:127 and :163).
    suggestion: >-
      Require a concrete anchor in the guidance: a code span, a quoted
      example, "e.g.", or a noun for a place in the subject (file, fix,
      evidence, test, field, check, doc); or add evaluative filler (wrong,
      bad, incomplete, unclear, poor, correct, looks, result, issue, problem)
      to FILLER. Add the sentence above to guidance_must_say_what_fails.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The round-3 finding is fixed: the fix now says to state when to fail in
      words the question doesn't use, with an example
      (portal/standards/meta.yaml:1147-1151), and the evidence names all three
      conditions per listed criterion (meta.yaml:1143-1146), which are the
      three guides() tests.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The outcome, condition and three-word bar are labelled as chosen, with
      the two cases that motivated them, in docs/design/thresholds.md:46;
      silver is the scorecard's "guidance lets assessors agree" step above
      described and used (portal/standards/meta.yaml:1105-1109).
summary: >-
  Independent round-4 review of e3c0da1. Both round-3 findings are fixed:
  a padded restatement is no longer guided, and the fix and evidence now
  say the bar. Vague guidance built from generic words ("the result looks
  wrong") still passes for any question, which only assessor calibration,
  not yet built, would catch.
