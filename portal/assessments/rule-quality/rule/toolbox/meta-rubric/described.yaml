verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The check is filled(r.description) (crates/toolbox-cli/src/model.rs:274,
      281-285). The rationale says the assessor reads the description "to
      learn what to judge and which sources to read"
      (portal/standards/meta.yaml:1104-1106), and the fix asks for both
      (meta.yaml:1101-1102), but a description that names no source passes.
      Unlike a field's unit, sources can be checked: all five live rubric
      descriptions say "Read …" and name a path or command
      (meta.yaml:1150-1153, 1184-1187; portal/standards/crates.yaml:457,
      sdlc.yaml:395, assessments.yaml:314 and the lines after each).
    suggestion: >-
      Emit `namesSources`: the description contains a repository path, a
      `toolbox` command or a "Read" clause. Check it together with
      `described`, or as its own silver rule.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `description: Judge it.` passes. The ratchet holds new rubrics only to
      bronze (meta.yaml:1095), so a new rubric can arrive whose only guide for
      the assessor is its criteria.
    suggestion: >-
      The sources check above closes this route. Two words can't name what to
      read.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the rubric (meta.yaml:1100), and the fix says what
      the description must contain. rubric:demo/vague is the pinned failing
      fixture (portal/tests/standards.test.yaml:984-985).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Bronze ("described and used") is set by
      docs/design/scorecards-for-scorecards.md:295 and D80, and the card's
      rationale calls it the floor for a new rubric (meta.yaml:1083-1086).
summary: >-
  The right floor at the right level, with a clear fix. The check sees
  only that some text exists, while both the rationale and the fix say a
  rubric's description exists to point the assessor at sources, and that
