apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/vs-backstage-agent-surface/get-entity-size
rubric: rule-quality
subjectHash: 3b5c82ffbb0b
assessor: {kind: agent, name: cursor-assessor-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `mcpGetEntityBytes` is the byte length of the text an agent actually
      receives from one `tools/call` of each product's get tool
      (experiments/backstage-compare/surface.py:167-192), on the same gen.py
      component for both arms, so it is the cost the rationale names
      (portal/standards/backstage-comparison.yaml:852-854). Caveat: the
      component carries a handful of fields (gen.py:29-35), so it measures a
      small entity, not a field-rich one.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The cheapest pass is to return less, not the right fields:
      surface.py:191 records only that the reply is non-empty and not an error
      (`mcpGetEntityOk`), and snapshot.py:29-30 does not even carry that flag
      into portal/comparisons/, so a get that answered with the id alone would
      pass at a few bytes and look "ahead" of Backstage's 580 B.
    suggestion: >-
      In surface.py, assert that the get reply contains the component's owner,
      system and lifecycle (as the list equivalence gate does for owners),
      copy `mcpGetEntityOk` into the product record, and make the check
      `entity.mcpGetEntityOk && entity.mcpGetEntityBytes <= 4096.0`.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the place that renders the reply: the `get` arm of
      `markdown()` in crates/toolbox-api/src/mcp.rs:651-664 writes one line
      per field plus provenance, so trimming it shrinks exactly what
      surface.py counts. It omits rerunning surface.py and snapshot.py, which
      the performance fixes do mention, but the evidence string makes the
      value to beat plain.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The 4 KB bar was pre-registered before the run
      (experiments/backstage-compare/README.md:52) and the adjudication found
      it implemented as written (ADJUDICATION.md:113). The bar is loose
      (Toolbox 253 B, Backstage 580 B in portal/comparisons/), but the
      comparative standing with `tolerance: 0.1` decides ahead or behind, per
      D01M857ZB468ZM2YS6GNSEG6YB9.
summary: >-
  A sound, pre-registered measure of what one entity read costs an agent,
  with a fix that names the rendering code. Its weakness is that size
  alone is rewarded: nothing checks that the smaller reply still carries
  the entity's fields, so a stripped get would pass and look ahead.
