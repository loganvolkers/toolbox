apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-docs/cites-sources
rubric: rule-quality
subjectHash: 4f6d85eee23c
assessor: {kind: agent, name: cursor-assessor-11, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `hasSources` is true for any heading whose text, after an optional
      number, starts with "Sources"
      (crates/toolbox-connector-workspace/src/main.rs:431-439). The rationale
      is that a reader can check claims about other tools against primary
      sources (portal/standards/docs.yaml:160-163). An empty `## Sources`
      heading passes: a scratch design doc ending in one recorded hasSources
      true. The section's content is never read, neither whether it lists
      anything nor whether any entry is external.
    suggestion: >-
      Have doc_record report the number of list items or links under the
      Sources heading. Check `entity.sourceCount > 0` for design docs, and add
      a fixture with an empty Sources section.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Appending an empty `## Sources` heading is the cheapest pass, and it
      cites nothing. docs/design/dashboards.md, the failing fixture
      (portal/tests/standards.test.yaml:38-42), would reach silver with one
      heading line.
    suggestion: >-
      Same change as for measures-intent: require at least one entry under the
      heading.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is a fixed sentence (docs.yaml:156), and the fix says to
      end the design doc with a `## Sources` section, citing AGENTS.md working
      rules (:157-159). Adding that heading anywhere sets hasSources, so
      following the fix passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Silver matches the docs ladder
      (docs/design/toolbox-for-toolbox.md:104) and AGENTS.md's working rule
      "Put sources at the end of each design doc". The rule links that rule
      (docs.yaml:164-166). Its rationale ties it to trusting a design doc, as
      silver is defined (:87-89).
summary: >-
  Grounded in an explicit working rule and placed at silver for good
  reason, with a fix that passes. But the check reads a heading, not its
  content, so an empty Sources section earns silver. Counting the entries
  under the heading would make it measure citation.
