apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/user-mcp/described
rubric: rule-quality
subjectHash: 12f010ce4898
assessor: {kind: agent, name: cursor-assessor-14, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The fix asks for "what it returns and when an agent should call it"
      (portal/standards/cli.yaml:276-277), but the check counts characters
      (cli.yaml:272). Most live tools pass on the "what" alone: `search` is
      "Find entities by name or title." (31) and `get` is "One entity with its
      fields and where each came from." (52)
      (crates/toolbox-api/src/mcp.rs:26, 31), neither of which says when to
      prefer it over `query` or `graph`, the choice the rationale says
      descriptions exist for (cli.yaml:280-281).
    suggestion: >-
      Either narrow the fix to what the check sees ("at least 20 characters
      saying what it returns"), or leave the length as the floor and move the
      "when to call it" half into a rubric criterion the review asks, so the
      rule doesn't promise more than it measures.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Twenty characters rules out an empty or one-word description, so the
      cheapest pass is a sentence about the tool, written in one place
      (`builtin_tools`, crates/toolbox-api/src/mcp.rs:20-97). Twenty
      characters of filler would pass but would show up in every client's
      `tools/list`.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence quotes the current description and its length, which an
      agent can grep in crates/toolbox-api/src/mcp.rs, and writing at least 20
      characters there passes. The fix doesn't name that file, unlike
      inputs-described's (cli.yaml:300-302), but the quoted text finds it.
  - criterion: threshold-justified
    verdict: unsure
    reason: >-
      Bronze is set in docs/design/toolbox-for-toolbox.md:108 ("Described;
      annotated"), but the 20-character floor has no source:
      docs/design/thresholds.md has no row for it, and the CLI's has-help uses
      10 for the same purpose (cli.yaml:100). The shortest live description is
      31 characters (`search`).
    suggestion: >-
      Add a row to docs/design/thresholds.md stating 20 as chosen or measured
      (17 live tools range from 31 to 289 characters) and how it relates to
      has-help's 10.
summary: >-
  A reasonable floor that keeps descriptions from being empty, at the
  right level, but the fix promises a "when to call it" that a length
  check can't see, and most live descriptions omit it. The number 20 also
  needs a line in thresholds.md. No fixture fails it (3 pass), so its fail
  path is untested.
