apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/user-mcp/annotated
rubric: rule-quality
subjectHash: 8ac02cc1b3ad
assessor: {kind: agent, name: cursor-assessor-14, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale says Toolbox owes the client accurate annotations
      (portal/standards/cli.yaml:290-292, docs/authorization.md:292-296), and
      the fix asks for idempotent and openWorld hints on writes, but the check
      is only `has(entity.annotations.readOnlyHint)` (cli.yaml:283). A write
      tool that sets `readOnlyHint: false` and nothing else passes, as does a
      write that claims `true`. Under the MCP spec a missing `readOnlyHint`
      means false and a missing `destructiveHint` means true
      (https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/schema/2025-06-18/schema.ts),
      so the case the rule catches, an absent hint, is the safe one; the
      unsafe one, a wrong `true`, passes.
    suggestion: >-
      Add the tool's effect to `toolbox describe`'s `mcp-tool` record (for
      example the REST method its handler calls, POST for `run_action` and
      `refresh_entity`) and check that tools which write set `readOnlyHint:
      false` and an explicit `destructiveHint`, and that reads set `true`.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      15 of the 17 live tools carry exactly `{"readOnlyHint": true}`
      (crates/toolbox-api/src/mcp.rs:20-97), so the cheapest way to add a new
      write tool is to copy a neighbour, and it passes. The contract test only
      asserts `readOnlyHint` is a boolean
      (crates/toolbox-api/tests/mcp.rs:112), so nothing else catches it.
    suggestion: >-
      Check the hint against the tool's effect as above, or keep a list of
      write tools in the contract test and assert their hints.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the tool, and setting `annotations.readOnlyHint` on
      it in `builtin_tools` (crates/toolbox-api/src/mcp.rs:20) passes. The fix
      names no file, but every built-in tool is defined there.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Bronze follows the safety-critical principle in
      docs/design/thresholds.md:19-21 and is set in
      docs/design/toolbox-for-toolbox.md:108: Toolbox delegates
      prompt-injection defence to the client's approval layer
      (docs/authorization.md:292-296), which acts on these hints.
summary: >-
  Bronze is the right level for a hint clients gate approvals on, and
  every tool has one today, with `run_action` and `refresh_entity` marked
  correctly. But the check sees only presence, so the dangerous mistake, a
  write that claims to be read-only, passes; and copying a neighbour makes
  that the cheapest path. It also has no failing fixture (3 pass).
