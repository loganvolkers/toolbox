apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/meta-rule/fix-names-a-place
rubric: rule-quality
subjectHash: b7f2424afd06
assessor: {kind: agent, name: cursor-assessor-02, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The third disjunct of fixNamesPlace passes any rule whose evidence reads
      a field or loops, whatever the fix says
      (portal/standards/meta.yaml:150-154). The field description says this is
      for evidence that "lists the places" (meta.yaml:144-149), but it doesn't
      require that. Two examples pass while naming no place.
      meta-rule/explains-fix's fix ("Write a fix an agent can act on: what to
      change, and where.") passes because its evidence reads `fixWords`, a
      count. The fix "Make it right." on rule:demo/sprawling/hides-the-list
      would pass as soon as its evidence concatenated `entity.name`.
    suggestion: >-
      Accept the evidence route only when the evidence returns the list the
      check filters, i.e. it reads a list field the check also reads, or it
      loops. Never accept it for a scalar or for `name`. Pin
      meta-rule/explains-fix failing this rule in
      portal/tests/standards.test.yaml.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The regex alternatives are cheap to hit without naming a place. Any
      backtick passes, as does any slash word such as "and/or" or "pass/fail"
      (the `[A-Za-z0-9_.-]+/...` arm), and so does any check field longer than
      3 characters that the fix happens to contain, e.g. "fixture" in "Add
      fixture records" for decided-on-fixtures (meta.yaml:150-153; brief
      facts: fixNamesPlace true there).
    suggestion: >-
      Drop the bare-backtick arm and require a code span that looks like a
      key, path or command (contains `:`, `/`, `.` or `toolbox `). Require the
      slash arm to have a file extension or a known top-level directory.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence quotes the failing fix (meta.yaml:561-563), and the fix
      lists the accepted forms: a path, the checked field, a `toolbox`
      command, or listed items (meta.yaml:564-567). Adding any one of these
      matches the regex.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      docs/design/thresholds.md:46 places it at gold with a measurement: 217
      of 219 rules met it after code spans were added to 19 toolbox rules
      (2026-11-23). Lessons L1 and L2 are its basis
      (docs/design/scorecards-for-scorecards.md:81-82).
summary: >-
  The intent is right (lesson L1) and the gold level is measured. The
  check is a lenient lexical net. Any evidence that reads a field exempts
  the fix entirely, and a single backtick or slash passes. Meta-rule's own
  explains-fix, whose fix names no place, passes it. Live it fails 2 acme
  rules (portal/results.json); both outcomes are pinned
  (portal/tests/standards.test.yaml:1309-1329).
