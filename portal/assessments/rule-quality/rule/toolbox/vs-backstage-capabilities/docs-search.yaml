apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/vs-backstage-capabilities/docs-search
rubric: rule-quality
subjectHash: acc60056ae93
assessor: {kind: agent, name: cursor-assessor-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The brief's scenario is "full-text search" (RESEARCH.md:114), and the
      rule asks for search inside documentation, which is what Backstage's
      search with the TechDocs collator does (facts.yaml:164-166). Toolbox
      fails honestly: `search` finds entities by name or title only
      (crates/toolbox-api/src/mcp.rs:26, facts.yaml:75-79).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `capDocsSearch` is a hand-written boolean (facts.yaml:75-79) that
      snapshot.py:85 copies into the record; changing `value: false` to `true`
      passes with no search change, and no probe in surface.py looks for a
      word that occurs only in a document body.
    suggestion: >-
      Give one gen.py component a documentation page containing a unique word,
      and have surface.py search each product for it; set `capDocsSearch` only
      when the component comes back.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix names the command but not the code (the `q` filter behind
      /v1/entities in crates/toolbox-api/src/reads.rs) or where document text
      would come from: Toolbox carries no component docs yet (`capDocs` false,
      facts.yaml:80), and the v1 scope is full-text search over entities only
      (docs/v1-spec.md:48). It also omits that the fact changes only when
      facts.yaml is edited and snapshot.py rerun.
    suggestion: >-
      Name the data and the code: "Ingest each component's docs text as a
      field (git-files connector), include it in the entity search in
      crates/toolbox-api/src/reads.rs, then rerun
      experiments/backstage-compare (surface.py, snapshot.py)."
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Boolean with no threshold; the bar "each capability true" was
      pre-registered (experiments/backstage-compare/README.md:53) and the
      scenario comes from the D47 audit (D01M7V8P2VY0000000000000000).
summary: >-
  A fair rule that records a real Toolbox loss. Its fix stops at intent:
  it depends on component docs Toolbox doesn't carry yet and names neither
  the search code nor the rerun, and the fact itself is an editable
  boolean.
