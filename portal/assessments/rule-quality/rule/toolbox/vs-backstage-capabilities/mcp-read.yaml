apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/vs-backstage-capabilities/mcp-read
rubric: rule-quality
subjectHash: c0057f3d5364
assessor: {kind: agent, name: cursor-assessor-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      "Read the catalog over MCP" (backstage-comparison.yaml:158) is the
      brief's "MCP read tool" scenario (RESEARCH.md:123); both products pass,
      with 13 and 9 read-only tools (results/r3/surface-toolbox.json,
      facts.yaml:93 and 181), which is the parity the rule reports.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      facts.yaml:93 says "14 MCP tools, 13 read-only (surface.py)", but the
      value is still a typed boolean: surface.py:186-187 measures
      `mcpReadOnlyTools`, and snapshot.py:29-30 drops it, so editing
      facts.yaml passes regardless of what the server lists.
    suggestion: >-
      Add `mcpReadOnlyTools` to SURFACE in snapshot.py, drop `capMcpRead` from
      facts.yaml, and check `entity.mcpReadOnlyTools >= 1.0` (or derive
      `capMcpRead` from it), so the measured count decides.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      "Keep the MCP read tools." names no file or tool; for a regression an
      agent has to find on its own that they are the readOnlyHint entries of
      builtin_tools() in crates/toolbox-api/src/mcp.rs:20-98.
    suggestion: >-
      Name the place: "Keep the read-only tools (search, get, query, graph,
      owner_of) in builtin_tools() in crates/toolbox-api/src/mcp.rs."
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Boolean, no threshold; "each capability true" is pre-registered
      (experiments/backstage-compare/README.md:53, ADJUDICATION.md:114).
summary: >-
  A correct parity rule whose evidence already cites a measurement the
  pipeline throws away. Feeding `mcpReadOnlyTools` through snapshot.py and
  naming mcp.rs in the fix would make it both hard to game and actionable.
