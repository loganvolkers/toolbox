apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-schema/local-refs
rubric: rule-quality
subjectHash: 2e9eda1abb34
assessor: {kind: agent, name: cursor-assessor-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      externalRefs is every `$ref` string not starting with `#`
      (crates/toolbox-connector-workspace/src/specs.rs:47-66). On a scratch
      schema run through target/debug/toolbox-connector-workspace, this got
      both directions wrong. `"$ref": "https://x#/$defs/a"`, pointing at the
      document's own `$id`, was listed as external, though it resolves inside
      the file. `"$dynamicRef": "https://evil.example/s.json"` was not listed
      at all. A false fail for a legitimate style and a blind spot for a
      2020-12 keyword.
    suggestion: >-
      Resolve each `$ref` and `$dynamicRef` against the document's `$id` (and
      nested `$id`s) and flag only those whose base is a different resource.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The cheapest pass is to inline the definition under `$defs` and point a
      fragment at it, which is what the fix asks
      (portal/standards/schemas.yaml:118-120). Hiding a remote reference
      behind `$dynamicRef` is no cheaper, and for a schema.rs document it
      would still fail to compile.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists the offending references (schemas.yaml:117, pinned as
      `https://example.invalid/other.json` in
      portal/tests/standards.test.yaml:610-611), and the fix says to point
      each at a fragment in this file. Doing so empties the list.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      Gold should ask for what lower levels don't already imply
      (docs/design/thresholds.md:24). For a document schema.rs compiles, which
      is how all four live ones reach silver's wired-in, a remote `$ref`
      already breaks the build. jsonschema is built without `resolve-http` or
      `resolve-file` (Cargo.toml:23, `default-features = false`), so its
      default retriever returns "`resolve-http` feature or a custom resolver
      is required" for any remote URI (jsonschema 0.61.2
      src/retriever.rs:314-317), and schema.rs:25 `expect`s the compile to
      succeed. D77 places the rule but gives no reason for gold
      (docs/decisions/D01M7W5BEAG0000000000000000.md).
    suggestion: >-
      Move local-refs to bronze as a cheap floor (it fails before anything
      compiles), and give gold something wired-in doesn't imply, such as a
      test that validates a sample good and bad instance against the schema.
summary: >-
  The rule's purpose is real, but its check treats a `$ref` to the
  document's own `$id` as remote and misses `$dynamicRef`. At gold it adds
  little: a compiled schema with a remote `$ref` already fails the build,
  because jsonschema is built without remote resolution. Evidence and fix
  are clear.
