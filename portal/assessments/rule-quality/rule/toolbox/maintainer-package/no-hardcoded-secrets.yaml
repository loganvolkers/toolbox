apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-package/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 9920e1c736bb
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The manifest text goes through the shared detector
      (crates/toolbox-connector-workspace/src/npm.rs:225-227 ->
      hygiene.rs:110-112), whose shapes are AWS, GitHub, Anthropic/OpenAI
      project, Stripe, Slack, private keys and URL passwords
      (hygiene.rs:17-26). It has no pattern for npm's own access tokens
      (`npm_` plus 36 characters), the credential most likely to end up in an
      npm manifest, for example in a `publish` script. The npm-specific home
      for a token, `.npmrc` beside package.json
      (`//registry.npmjs.org/:_authToken=`), is not read by this record at
      all. hygiene.rs:5-7 calls these patterns "the floor, not the scanner",
      but the rationale (portal/standards/packages.yaml:180-183) reads as if
      any credential is caught.
    suggestion: >-
      Add `npm_[A-Za-z0-9]{36}` to hygiene.rs (it helps every card that shares
      it) and scan a sibling `.npmrc` into this record's `secretHits`,
      flagging an `_authToken`/`_auth`/`_password` value that is not a
      `${VAR}` reference.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      A hit is a `file:line kind` (portal/tests/standards.test.yaml:565-566
      pins ['package.json:4 aws-access-key']). JSON has no string
      concatenation, so the split-prefix dodges hygiene.rs guards for code do
      not apply; the only way to clear a hit is to change that line, and the
      cheap change is removing the credential.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names file, line and credential kind
      (crates/toolbox-connector-workspace/src/hygiene.rs:110-112; fixture
      portal/tests/standards.test.yaml:565-566), and the fix says to remove it
      (portal/standards/packages.yaml:176-179); removing the matched text
      empties `secretHits`. The rationale adds that the credential must be
      revoked (portal/standards/packages.yaml:180-183), which the fix could
      repeat but the rule cannot check.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is justified in docs/design/thresholds.md:35: credential rules
      are killer items and were moved from gold to the floor by
      D01M83G9F4EEGN1GTP14HEYB8B6 so the ratchet cannot let one through.
      docs/design/package-standards.md:72 still lists this rule at gold; the
      design doc lags the manifest.
summary: >-
  Placed and justified correctly at bronze, with file:line evidence. Its
  reach is the shared high-precision floor, which has no npm-token pattern
  and never reads `.npmrc`, so the credential an npm manifest is most
  likely to leak is the one it misses. package-standards.md §4 still shows
  it at gold.
