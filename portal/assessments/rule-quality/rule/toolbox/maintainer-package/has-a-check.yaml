apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-package/has-a-check
rubric: rule-quality
subjectHash: 64a4198d4125
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `check_scripts` counts which of the keys `test`, `build`, `check` and
      `typecheck` exist
      (crates/toolbox-connector-workspace/src/npm.rs:140-148), whatever they
      contain and whether anything runs them. The rationale is that without
      one "CI has nothing to run" (portal/standards/packages.yaml:132-133),
      but the rule never looks at CI. Live case:
      scripts/playwright-ci/package.json passes through its `check` script,
      and no workflow runs it; ci.yml:167-173 only runs `npm ci --prefix`. npm
      init's default `"test": "echo \"Error: no test specified\" && exit 1"`
      also counts (a scratch manifest with it reported `checkScripts: 1`).
    suggestion: >-
      Count a script only when a workflow runs it for this package (`npm run
      <name>`, `npm test`, `npm run-script` in a job whose working-directory
      is the package, as `ci_uses_install` already locates), and skip npm
      init's placeholder test. Rename the fact `ciCheckScripts`.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `"test": "true"` or `"build": ""` adds a key and passes silver at no
      cost and with no check behind it, since only key presence is read
      (npm.rs:145-147).
    suggestion: >-
      Requiring that CI runs the script (above) makes a no-op script visible
      in the workflow; also reject bodies that are empty, `true`, `exit 0` or
      npm init's placeholder.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the count ('0 check scripts', pinned for the partial
      fixture at portal/tests/standards.test.yaml:541-543), and the fix names
      the four script names that count. Adding any of them to package.json
      `scripts` passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The number is one script (`> 0`) at silver. The source table in
      docs/design/package-standards.md:34 cites npm's developer guide (keep a
      smoke test in `scripts.test`,
      https://docs.npmjs.com/cli/v12/using-npm/developers/) and D76
      (docs/decisions/D01M7W56B7R0000000000000000.md) places it at silver with
      the lockfile.
summary: >-
  The rule counts script names, not checks, and never asks whether CI runs
  them. A no-op `test` passes, and so does scripts/playwright-ci's
  `check`, which no workflow runs. Tie the fact to the workflows that
  already feed `ciUsesInstall`.
