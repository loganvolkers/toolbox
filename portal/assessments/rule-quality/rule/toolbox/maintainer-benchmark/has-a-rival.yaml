apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-benchmark/has-a-rival
rubric: rule-quality
subjectHash: d0c9d7f8c6f3
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      rivalGaps is set only when `rival` is empty (benchmarks.yaml:159-165).
      The fix asks for a named arm without Toolbox (benchmarks.yaml:286-289).
      Whether it is the *strongest* alternative (dx-benchmarks.md:66, step 3
      at :119-121) is a judgement left to review. The one live failure,
      t4t-fresh-agent (rival '', portal/benchmarks/t4t-fresh-agent.yaml), is a
      dogfood run that really had no rival arm, so the rule fires where the
      intent is missing.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Any non-empty string passes: rivalGaps is set only when `entity.rival ==
      ''` (portal/standards/benchmarks.yaml:159-164), and the rule checks just
      its size (:284). For the one failing entry, whose honest answer is
      "there was no rival", `rival: none` or `rival: n/a` would make it pass
      silver without changing the benchmark. A rival named in the catalog
      doesn't have to appear among the arms in the pre-registered README
      either.
    suggestion: >-
      Treat `none`, `n/a`, `-` and `tbd` (case-insensitive) as empty in
      rivalGaps. Better, add a `rivalNotInReadme` fact: the readme names no
      word of the rival, using the same file read as `not_naming`
      (crates/toolbox-connector-workspace/src/data.rs:220-233).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence ("no rival arm: name the strongest alternative a team would
      use", benchmarks.yaml:164-165) and the fix's list of acceptable rival
      kinds lead to filling `rival`, which clears the gap (both outcomes
      pinned at portal/tests/standards.test.yaml:1171 and :1236).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Silver is where dx-benchmarks.md §6 puts "It names a
      rival arm" (docs/design/dx-benchmarks.md:225). L1 and L4
      (dx-benchmarks.md:89-91) show why a declared but unpitted benchmark sits
      below one with a rival.
summary: >-
  Right concern, right level and a clear fix. It is a presence check, and
  a placeholder like `none` would pass it on the one live entry that
  genuinely lacks a rival. Rejecting placeholders, or asking the README to
  name the rival, closes that.
