apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-connector/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 01f1f1fc0e24
assessor: {kind: agent, name: campaign-review-rules-r3}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Scope is right: Rust sources outside cfg(test) items and the connector's
      other text files are scanned
      (crates/toolbox-connector-workspace/src/connectors.rs:210-262). Pattern
      coverage is not: the shapes at
      crates/toolbox-connector-workspace/src/hygiene.rs:13-33 have no Google
      API key and no bare `sk-` key. A scratch connector with `const G: &str =
      "AIzaSy…"` (39 characters) and `"sk-"` plus 48 characters, run through
      target/debug/toolbox-connector-workspace, reported no secretHits, so a
      published credential of a common provider passes the rule.
    suggestion: >-
      Carry gitleaks or trufflehog findings through the SARIF slot, as
      hygiene.rs:5-7 says is the right home, keeping these patterns as the
      floor; until then add `AIza[0-9A-Za-z_-]{35}` and a bare `sk-` key of 40
      or more characters to patterns(), with a test each.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The last review's `concat!("gh", "p_…")` route is in fact closed:
      literals on one line are joined and matched
      (crates/toolbox-connector-workspace/src/hygiene.rs:85-104, tested at
      :181-199), and my scratch run flagged it as split-token-prefix. But the
      join is per line. The same `concat!(` with `"gh",` and `"p_…",` on their
      own lines, the layout rustfmt gives a long call, or `const A = "gh"` and
      `const B = "p_…"` joined by format!, gave no hit in the same run. The
      code names splitting as "the cheapest way to dodge" (hygiene.rs:35-36);
      one newline still does it. It is evasion of the scanner, but it
      falsifies nothing, and the credential still ships.
    suggestion: >-
      Join string literals per statement rather than per line (collect the
      literals of one macro call or expression with syn, up to the `;`), and
      flag a constant whose whole value is a token prefix (`"gh"`, `"ghp_"`,
      `"sk-"`); add the multi-line concat! and the two-constant case to the
      hygiene.rs tests.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `path:line kind` (hygiene.rs:67-107) and the fix says
      where tokens belong instead, the environment or TOOLBOX_CONNECTOR_CONFIG
      (portal/standards/connectors.yaml:178-180). Removing the listed literals
      empties secretHits.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Bronze is justified as a killer item in
      docs/design/thresholds.md:35 (D01M83G9F4EEGN1GTP14HEYB8B6): at gold a
      connector carrying a credential still read silver and passed the bronze
      ratchet. The rule links that page
      (portal/standards/connectors.yaml:186-187).
summary: >-
  Independent re-review; the rule and hygiene.rs are unchanged since
  781adf9. The previous concat! finding was out of date (one-line splits
  are caught), but a split across lines or constants still passes, and
  Google and bare OpenAI-style keys are not recognised; all three
  confirmed with the connector on a scratch crate.
