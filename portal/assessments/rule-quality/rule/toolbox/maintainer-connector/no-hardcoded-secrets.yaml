apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-connector/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 66e365ff235c
assessor: {kind: agent, name: blind-review-2026-11-23}
at: 2026-11-23
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      secret_patterns
      (crates/toolbox-connector-workspace/src/connectors.rs:275-283) has five
      shapes. It misses PEM private keys (the credential a GitHub App
      connector holds), GitHub `gho_`/`ghs_`/`ghu_`/`ghr_` tokens, Stripe's
      real `sk_live_` (underscore, where the pattern has `sk-live-`), and URLs
      with an embedded password. production_lines (connectors.rs:227-268) also
      skips every line after a `#[cfg(test)]` that isn't followed by a `mod`
      line, so a `#[cfg(test)] use ...;` near the top hides the rest of the
      file. I reproduced that with a line-for-line port of take_test_module.
    suggestion: >-
      Add PEM, `gh[ousr]_` and `sk_live_` shapes. Skip only the braced item
      after `#[cfg(test)]`, and stop arming at the next non-attribute line. Or
      carry gitleaks through the SARIF slot
      (docs/design/toolbox-and-tools.md).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempts: write the token as `concat!("ghp_", "...")`, or put
      `#[cfg(test)] use std::collections::HashMap;` above the constant. Either
      way secretHits is empty and the check at
      portal/standards/connectors.yaml:120 passes.
    suggestion: >-
      Fix the cfg(test) skip as above. Splitting literals can't be stopped by
      regex, which is one more reason to carry a real scanner.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `file:line kind` (connectors.rs:216), and the fix names
      where tokens belong (the environment or TOOLBOX_CONNECTOR_CONFIG).
      Removing the listed lines passes.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      Gold is stated (portal/standards/connectors.yaml:43-45,
      docs/design/connector-standards.md:22 and :88), but a pasted credential
      is the most severe finding in the scorecard. At gold, a connector with a
      live AWS key still reads silver and passes the bronze ratchet
      (connectors.yaml:51). The doc gives no reason why a leak ranks with "CI
      runs it". Common practice (GitHub push protection, gitleaks pre-commit;
      secondary, from general knowledge) blocks any credential outright.
    suggestion: >-
      Move no-hardcoded-secrets to bronze, here and in maintainer-skill and
      maintainer-site, and record it as a decision.
summary: >-
  A narrow regex at the top of the ladder. A cfg(test) parsing bug blinds
  it to most of a file, and a credential leak shouldn't still leave a
  connector at silver.
