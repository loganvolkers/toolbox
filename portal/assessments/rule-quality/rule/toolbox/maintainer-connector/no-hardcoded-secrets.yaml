apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-connector/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 01f1f1fc0e24
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The earlier gap is closed: secrets now also scans the connector's other
      text files, which `include_str!` can compile in, and skips binaries
      (crates/toolbox-connector-workspace/src/connectors.rs:210-232), and the
      cfg(test) skip covers only the next item (connectors.rs:234-262). What
      remains is pattern coverage: the shapes in
      crates/toolbox-connector-workspace/src/hygiene.rs:13-33 miss common
      provider keys a connector could carry, such as a Google API key (`AIza`
      plus 35 characters) or an OpenAI key without the `ant`, `proj` or `live`
      infix, so such a credential is published and the rule passes.
    suggestion: >-
      Carry gitleaks or trufflehog findings through the SARIF slot, as
      hygiene.rs:5-7 says is the right home, and keep these patterns as the
      floor; until then add the Google API key shape and a bare `sk-` key of
      OpenAI's length to patterns(), with a test each.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempt: split the token below its prefix, `concat!("gh",
      "p_…")`. split_prefix (hygiene.rs:42-51) only catches a literal that is
      exactly `"ghp_"` and similar, and the whole-token pattern never sees the
      joined string, so secretHits stays empty. Moving the token into a data
      file no longer works, because those files are scanned.
    suggestion: >-
      Flag string literals that are a strict prefix of a token prefix when
      they sit next to another literal in `concat!` or `+`, or rely on a
      scanner that inspects the built binary; add the `concat!("gh", ...)`
      case to the connectors.rs tests.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `path:line kind` (hygiene.rs:68-108), and the fix says
      where tokens belong (the environment or TOOLBOX_CONNECTOR_CONFIG,
      portal/standards/connectors.yaml:178-180). Removing the listed literals
      empties secretHits.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is justified in docs/design/thresholds.md:35 as a killer item
      (D01M83G9F4EEGN1GTP14HEYB8B6): at gold a connector with a credential
      still read silver and passed the bronze ratchet. The rule's link now
      names that row (connectors.yaml:186).
summary: >-
  Re-assessed after the link was retitled to say what it explains; the
  check, evidence, fix and level are unchanged, but the code had moved on
  since the last assessment, so the reasons are re-judged against it. Data
  files are now scanned, which closes the `include_str!` route; the rule
  still misses provider shapes such as Google API keys, and a token split
  below its prefix with `concat!` still passes.
