apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-connector/no-hardcoded-secrets
rubric: rule-quality
subjectHash: b97401c9209c
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The pattern gaps found earlier are closed (PEM keys, gh[pousr]_,
      sk_live_, URL passwords and split prefixes in
      crates/toolbox-connector-workspace/src/hygiene.rs:13-46), and the
      cfg(test) skip now covers only the next item (connectors.rs:233-262).
      But rust_files
      (crates/toolbox-connector-workspace/src/connectors.rs:83-92) scans only
      `.rs` files. A credential in the connector's own directory, such as
      `src/token.txt` compiled in with `include_str!` or a JSON config next to
      Cargo.toml, is hardcoded into the binary, and the rule passes.
    suggestion: >-
      Scan every tracked file under the connector's directory with
      hygiene::secrets (text files), not only `.rs`; keep the cfg(test) skip
      for Rust sources only.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Cheapest attempt: move the token into `src/token.txt` and write `const
      TOKEN: &str = include_str!("token.txt");`. secretHits stays empty
      because only `.rs` lines are scanned (connectors.rs:83-92, 210-217).
      Splitting below the prefix also passes: `concat!("gh", "p_…")` doesn't
      match split_prefix (hygiene.rs:37-46), which only catches a literal that
      is exactly `"ghp_"` and similar.
    suggestion: >-
      Scan non-Rust files in the crate, and flag
      `include_str!`/`include_bytes!` of a file that holds a credential shape.
      For splitting, carry gitleaks through the SARIF slot, as hygiene.rs:5-7
      itself says it is the right home.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `path:line kind` (hygiene.rs:63-88), and the fix says
      where tokens belong (the environment or TOOLBOX_CONNECTOR_CONFIG,
      portal/standards/connectors.yaml:168-178). Removing the listed literals
      empties secretHits.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is now justified in docs/design/thresholds.md §2 as a killer item
      (D01M83G9F4EEGN1GTP14HEYB8B6): at gold a connector with a credential
      still read silver and passed the bronze ratchet. The earlier fail is
      fixed.
summary: >-
  Re-assessed after the rule gained a rationale: its check, evidence, fix
  and level are the same as on main, as is the code the reasons cite, so
  the verdicts stand; line numbers are updated for the rationale lines
  inserted above them. The rationale states the why without claiming more
  than the check sees. Patterns, the cfg(test) bug and the level are
  fixed, but only `.rs` files are scanned, so `include_str!` of a token
  file passes.
