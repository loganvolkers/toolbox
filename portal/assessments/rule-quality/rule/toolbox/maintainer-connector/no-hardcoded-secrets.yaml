apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-connector/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 01f1f1fc0e24
assessor: {kind: agent, name: campaign-review-rules-r4}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Google and bare `sk-` keys are now recognised
      (crates/toolbox-connector-workspace/src/hygiene.rs:20-22), but every
      shape is a fixed provider prefix (hygiene.rs:13-35). A scratch connector
      run through target/debug/toolbox-connector-workspace with `const
      SCIM_TOKEN: &str = "<40 hex chars>"` and `let password =
      "Xk29!qPz7wLmN3vR"` gave secretHits []; this repository's own SCIM
      connector takes exactly such a prefixless bearer token
      (crates/toolbox-connector-scim/src/main.rs:6). The same run had a
      full-length `ghp_` token in `#[cfg(test)] mod tests`, also not counted,
      because those lines are dropped
      (crates/toolbox-connector-workspace/src/connectors.rs:234-246), though
      the rationale says a credential in the tree is published with it
      (portal/standards/connectors.yaml:181-184). A connector can pass while
      publishing a credential.
    suggestion: >-
      Add a keyword-assignment pattern to patterns(): an identifier containing
      token, secret, password or api_key bound to a literal of 16 or more
      characters with mixed character classes, as gitleaks' generic-api-key
      rule does; and scan cfg(test) lines for whole provider tokens too,
      exempting only obvious fixtures (one repeated character, or `fake`,
      `example`, `test` in the value). Add both cases to the connectors.rs
      tests.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The round-3 route is closed: a `concat!(` whose `"gh",` and `"p_…",` sit
      on their own lines is joined until it closes (hygiene.rs:103-117), and
      my scratch run flagged it as split-token-prefix. A credential used by
      production code can't be moved into cfg(test) to dodge the scan. What
      still passes, `const P = "gh"` and `const Q = "p_…"` joined at run time
      (confirmed on the scratch crate), is a deliberate split, which
      docs/design/thresholds.md:81-85 states is out of reach of a lexical
      check, with review of the change as a backstop. One backstop it names,
      secret scanning under maintainer-supply-chain, is ungated there
      (docs/design/supply-chain-standards.md:39), so the backstop is review
      plus GitHub's own scanning outside the portal.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `path:line kind` (hygiene.rs:70-125) and the fix says
      where tokens go instead, the environment or TOOLBOX_CONNECTOR_CONFIG
      (portal/standards/connectors.yaml:178-180); removing the listed literal
      empties secretHits.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Bronze is justified as a killer item in
      docs/design/thresholds.md:36 (D01M83G9F4EEGN1GTP14HEYB8B6), and the rule
      links that page (portal/standards/connectors.yaml:185-187).
summary: >-
  Independent round-4 review of e3c0da1. Both round-3 findings are fixed
  (Google and bare sk- keys, a concat! split across lines), confirmed with
  the connector. What remains is coverage: a prefixless credential, the
  kind the SCIM connector uses, and any real token in a test module pass.
  The two-constant split still passes but takes intent, a limit the design
  states.
