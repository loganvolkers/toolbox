apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-connector/config-documented
rubric: rule-quality
subjectHash: a2b00969bf79
assessor: {kind: agent, name: cursor-assessor-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale is that an operator should not have to read the source to
      wire the connector in (portal/standards/connectors.yaml:97-100), but the
      check is a substring test for `TOOLBOX_CONNECTOR_CONFIG`, `--toolbox` or
      `--listen` anywhere in the crate doc
      (crates/toolbox-connector-workspace/src/connectors.rs:119-123). Naming
      the variable is not documenting its keys: github's doc lists them
      (crates/toolbox-connector-github/src/main.rs:3), but a doc that names
      the variable with stale or no keys passes, and scim's real settings
      (`TOOLBOX_SCIM_TOKEN`, crates/toolbox-connector-scim/src/main.rs:6) are
      not what the check looks for; it passes on the `--listen` mention.
    suggestion: >-
      Require the doc to show the config shape: for an in-image connector, a
      JSON object after `TOOLBOX_CONNECTOR_CONFIG` whose keys appear in the
      source's config parsing; for a remote one, a usage line with the flags.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A scratch crate whose only doc line was "Unlike `--toolbox` flag ones,
      it reads nothing." reported configDocumented true when run through
      target/debug/toolbox-connector-workspace. Any sentence containing one of
      the three tokens, even one that denies it, passes.
    suggestion: >-
      Match a usage line (`toolbox-connector-<name> --toolbox`) or a config
      object (`TOOLBOX_CONNECTOR_CONFIG`: `{...}`) rather than a bare token.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the crate doc and the exact tokens the check looks for
      (connectors.yaml:93-96), and the evidence says the crate docs name
      neither (:92), as pinned for crates/demo/unsafe in
      portal/tests/standards.test.yaml:416-417.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      A yes/no rule with no number. Bronze follows the "how to configure it"
      question in docs/design/connector-standards.md:20 and D73
      (docs/decisions/D01M7W4FRJR0000000000000000.md).
summary: >-
  The right bronze question with a token check: any crate doc that
  mentions `TOOLBOX_CONNECTOR_CONFIG`, `--toolbox` or `--listen` passes,
  including one that says it reads nothing. All six live connectors
  document real config, so the weakness is latent. Fix and level are fine;
  the check should look for a config shape or usage line, not a word.
