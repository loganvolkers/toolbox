apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-connector/closes-snapshots
rubric: rule-quality
subjectHash: 920f40ed36c5
assessor: {kind: agent, name: cursor-assessor-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The fix asks that every resync kind end with `snapshot_complete`
      (portal/standards/connectors.yaml:130-132), but snapshotComplete is
      `source.contains("snapshot_complete")` over all crate text
      (crates/toolbox-connector-workspace/src/connectors.rs:40). One mention
      covers a connector that closes one kind and leaves the rest open. That
      is the deletion-by-omission failure the rationale names (:133-136). The
      conformance kit checks per kind
      (crates/toolbox-connect/src/conformance.rs:168-170), but only for
      connectors CI runs it on. The six live connectors call it for real (e.g.
      crates/toolbox-connector-github/src/main.rs:433).
    suggestion: >-
      Compare the kinds passed to `snapshot_complete(` with the kinds passed
      to `record(` in production code, or read the conformance kit's per-kind
      result where CI runs it.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Two cheap passes, both confirmed on a scratch crate run through
      target/debug/toolbox-connector-workspace: a comment `// TODO: emit
      snapshot_complete` set snapshotComplete true, and a doc that says the
      connector "is not push-only" set pushOnly true, because pushOnly is
      `doc.contains("push-only")` (connectors.rs:134-136), and that exempts
      the rule entirely.
    suggestion: >-
      Ignore comments and test modules for snapshotComplete, and derive
      pushOnly from the code (run_remote without run_stdio, or no `resync` in
      the registered capabilities) rather than a phrase in the doc.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence says resync never sends `snapshot_complete`
      (connectors.yaml:129, pinned for crates/demo/partial in
      portal/tests/standards.test.yaml:398-400), and the fix names the message
      to send and where (the end of each resync kind). Adding the call passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      A yes/no rule. Silver is D73's "`snapshot_complete` ... (a push-only
      connector is exempt)" (docs/decisions/D01M7W4FRJR0000000000000000.md),
      and docs/design/connector-standards.md:21, 84 places it with the
      protocol shapes.
summary: >-
  The right silver rule, with a check that can't tell one closed kind from
  all of them and can't tell a call from a comment. Its push-only
  exemption can be claimed by any doc containing the word, even "not
  push-only". All live connectors really call it, so the gaps are latent.
  Fix and level are fine.
