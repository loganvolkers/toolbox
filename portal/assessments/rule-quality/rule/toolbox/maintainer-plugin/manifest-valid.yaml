apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/maintainer-plugin/manifest-valid
rubric: rule-quality
subjectHash: e95a26a50505
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `schemaOk` only compares the `$schema` string with the 1.0.0 URL
      (crates/toolbox-connector-workspace/src/plugins.rs:41); the manifest is
      never validated against that schema. Agent Plugins 1.0.0 §5.2-5.4
      (https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md)
      makes the manifest closed and says an `author` with any field other than
      name, email and url "makes the manifest invalid"; the schema types
      `version` as a string. A scratch plugin.json with `"author":
      {"name":"a","twitter":"b"}` and `"version": 1` reported `schemaOk:
      true`, so it passes. Conversely the rule requires a description, which
      the 1.0.0 schema does not (only `$schema` and `name` are required), so
      "valid" here means more and less than the spec.
    suggestion: >-
      Validate plugin.json against the vendored 1.0.0 plugin.schema.json in
      the connector (the repo already compiles JSON Schemas, schema/), emit
      `schemaErrors`, and check `schemaErrors.size() == 0`; keep the
      description as a separate, named rule.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `descriptionChars` counts the raw string without trimming
      (plugins.rs:23,40), unlike the npm connector (npm.rs:22), so
      `"description": " "` passes; the scratch plugin above reported
      `descriptionChars: 1` for a single space.
    suggestion: >-
      Trim before counting, and set a floor such as maintainer-skill's 20
      characters (portal/standards/skills.yaml:99).
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix describes the name as "1–64 lowercase letters, digits, dots and
      hyphens" (portal/standards/plugins.yaml:96-97), but `name_ok` also
      requires alphanumeric ends and no `--` or `..` (plugins.rs:52-70; spec
      §5.5). The unsafe fixture's name is "Bad--name"
      (portal/fixtures/workspace.ndjson:55); lowercasing it as the fix
      describes gives "bad--name", which still fails, and the evidence ('name
      bad--name') does not say why. The evidence also reports only the first
      failing condition (plugins.yaml:93-94), so a manifest with all three
      problems takes three rounds.
    suggestion: >-
      State the full grammar in the fix ("…, starting and ending with a letter
      or digit, with no -- or .."), and make the evidence list every failing
      part, e.g. a list built from the three conditions.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The number (1–64 characters) is the spec's (§5.5 of the 1.0.0 text
      above), restated in docs/design/agent-plugins.md:19. Bronze comes from
      D81 (docs/decisions/D01M7WMSMS00000000000000000.md: "bronze is the 1.0.0
      schema, a legal name, a description") and
      docs/design/plugin-standards.md:44.
summary: >-
  The name grammar is checked faithfully, but "manifest-valid" checks the
  `$schema` string, not the schema: an invalid `author` or a numeric
  `version` passes, and a one-space description counts. The fix omits half
  the name grammar, so the fixture's own name stays failing after
  following it.
