assessor: {kind: agent, name: cursor-assessor-02, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      D01M868BY0KJNEYE9WBFZYEYFYH says T4T "requires both" rationale and links
      through explains-why on meta-scorecard. The fix asks for a rationale
      covering why the standard exists and why its levels sit where they do,
      "with `links:`" (portal/standards/meta.yaml:636-639). The check reads
      only `explained`, a non-blank rationale (meta.rs:242). The `links` count
      is collected (meta.rs:243, meta.yaml:40-42) and read by no rule, so a
      linkless card passes. Every live card has links today, so the gap is
      latent.
    suggestion: >-
      Check `entity.explained && entity.links > 0`, and add a linkless fixture
      card to portal/fixtures/surfaces.ndjson pinned failing.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `rationale: Good practice.` passes (model.rs:283-285 trims only). The
      scorecard-quality rubric has no criterion on the rationale
      (meta.yaml:1182-1216), so nothing checks that it gives the risk or the
      level reasoning the fix asks for.
    suggestion: >-
      Require a word floor like meta-rubric's `guided` (model.rs:287-289), or
      add a scorecard-quality criterion asking whether the rationale says why
      the levels are where they are.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the card (`scorecard sprawling has no rationale`,
      portal/tests/standards.test.yaml:264-272), and the fix names
      `rationale:`. Following it passes.
  - criterion: threshold-justified
    verdict: unsure
    reason: >-
      D01M868BY0KJNEYE9WBFZYEYFYH puts it at silver, against bronze for the
      rule-level twin, without saying why. The meta-scorecard ladder in
      docs/design/thresholds.md:60 lists silver as "Described, a fixture
      ladder…, every rule tested" and omits it. Only the card's rationale
      mentions "a reason" at silver (meta.yaml:584-585).
    suggestion: >-
      Add a thresholds.md row giving the reason for silver (e.g. as for
      `described`, the reference portal's oracle), and add it to the silver
      cell of the ladder at thresholds.md:60.
summary: >-
  It is pinned both ways and its fix works. The check is narrower than the
  decision and the fix: links are required on paper but never read, and a
  placeholder rationale passes. Its silver level, unlike the rule-level
  twin's bronze, has no written reason. All 53 live cards pass it
  (portal/results.json).
