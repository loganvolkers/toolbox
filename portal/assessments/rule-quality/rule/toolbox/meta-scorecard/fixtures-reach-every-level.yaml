apiVersion: toolbox.dev/assessment/v1
entity: rule:toolbox/meta-scorecard/fixtures-reach-every-level
rubric: rule-quality
subjectHash: b04b8ec025ca
assessor: {kind: agent, name: cursor-assessor-02, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale says a level no fixture reaches may have rules that "never
      pass together" (portal/standards/meta.yaml:682-684). But a fixture is
      placed at a level when its known rules pass. Unknown rules are ignored
      unless every rule at that level is unknown
      (crates/toolbox-derive/src/lib.rs:1261-1288). So a fixture entity
      carrying data for one rule per level reaches gold, and fixtureRealLevels
      (meta.yaml:43-49, from meta.rs:131-139) counts that rung as exercised
      although its other rules were never evaluated together.
    suggestion: >-
      Have the connector record, per level, whether some fixture entity
      reached it with every rule at that level decided (pass or waived, no
      unknown), and compare against that list.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Following from the above, the cheapest route to gold is a sparse
      synthetic record per missing level, carrying only one passing field per
      level, rather than a realistic entity. Live, 28 of 53 cards fail this
      rule (portal/results.json), so that shortcut is tempting.
    suggestion: >-
      Same change: count only levels reached with no unknown rule at or below
      them.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists each missing level (`no fixture entity reaches
      silver` for scorecard:toolbox/user-cli, portal/tests/
      standards.test.yaml:1306-1308). The fix says to add fixture entities
      reaching them and names portal/fixtures/, where the store loads them
      (crates/toolbox-store/src/lib.rs:215).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      docs/design/thresholds.md:48 places it at gold: the silver ladder needs
      only two outcomes, so every level is the further step. The basis is
      lessons L4 and L12 (docs/design/scorecards-for-scorecards.md:115).
summary: >-
  The right gold for a scorecard, with a clear fix and both outcomes
  pinned (portal/tests/standards.test.yaml:1292-1308). Because levels are
  granted over known rules only, a sparse fixture can reach a level
  without exercising its rules together. Meta-scorecard itself fails it
  live, two levels short (portal/results.json).
