apiVersion: toolbox.dev/assessment/v1
entity: rule:acme/ownership/has-tier
rubric: rule-quality
subjectHash: 3669d846a912
assessor: {kind: agent, name: cursor-assessor-18, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The approval policy reads the tier
      (examples/reference-portal/toolbox.yaml:27 and the action's `approval`,
      :319-321), and `has(entity.tier)` is true when catalog-info or a native
      edit sets it (sources, :116). The value is an enum of "0"-"3" (:95), so
      set means usable. All four fixture repositories pass, platform-infra
      through the native edit
      (examples/reference-portal/fixtures/native.json).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The repository team sets the tier in its own catalog-info.yaml, and no
      authority backs it (sources, examples/reference-portal/toolbox.yaml:
      116). Ownership has a CODEOWNERS authority
      (examples/reference-portal/toolbox.yaml:99-106); the tier has none. Tier
      "2" or "3" passes the rule and also turns off security approval for app
      installs (`entity.tier in ['0', '1'] ? 'security' : 'none'`,
      examples/reference-portal/toolbox.yaml:27). So the cheapest pass is the
      least scrutinised tier, which is the opposite of the rationale's "tell a
      critical repository from a sandbox" (:213-216).
    suggestion: >-
      Give `tier` an authority like ownership's (only the platform team's
      native edit, or a catalog-info.yaml line owned by platform in
      CODEOWNERS, counts). Or add a rule that flags a catalog-info tier lower
      than the platform's native one.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names both sources the kind accepts: `spec.tier` in
      catalog-info.yaml, or a native edit by the platform team
      (examples/reference-portal/toolbox.yaml:210-212, :116). It doesn't list
      the allowed values "0"-"3" (:95), but `toolbox validate` rejects others.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Silver is justified in the scorecard rationale (a
      tier that approvals depend on,
      examples/reference-portal/toolbox.yaml:176-177) and in the rule's own
      rationale (:213-216).
summary: >-
  Sound as a completeness check, but the self-declared tier can be gamed:
  claiming a low tier passes the rule and also skips security approval for
  app installs. No fixture repository fails it, and no test asserts it
  (brief: tested false, fixture fail 0), so its failing path isn't
  exercised.
