apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-plugin/portable-components
rubric: rule-quality
subjectHash: 48f6a350c480
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `misplaced_skills` flags every SKILL.md under the plugin that is not at
      `skills/<name>/SKILL.md`
      (crates/seikika-connector-workspace/src/plugins.rs:121-163), including
      those inside a reverse-domain extension directory. Agent Plugins 1.0.0
      §8 and §8.2
      (https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md)
      put client-specific files exactly there (`com.example.client/`), so a
      plugin that follows the spec fails. Meanwhile the walk skips every
      dot-directory (plugins.rs:133), so a skill parked in a vendor location
      such as `.claude/skills/y/SKILL.md`, invisible to a compliant harness,
      is not flagged. A scratch plugin with both reported only
      `com.example.client/skills/x/SKILL.md`.
    suggestion: >-
      Skip top-level directories whose name is a reverse-domain namespace
      (contains a dot and matches `^[a-z0-9-]+(\.[a-z0-9-]+)+$`), and stop
      skipping dot-directories inside the plugin root, so vendor-only skill
      locations are reported.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      For a skill that should be portable, the cheapest way to clear the
      evidence is `git mv` into `skills/<name>/`, which is the fix. Hiding the
      file under a dot-directory also clears it, but then no harness loads the
      skill and maintainer-skill (skills glob `plugins/**/SKILL.md`,
      portal/seikika.yaml:128) still reports it, so the dodge buys nothing.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix's second sentence says "Client-specific files go under a
      reverse-domain directory" (portal/standards/plugins.yaml:107-108).
      Following it for a client-specific SKILL.md, e.g.
      `com.example.client/skills/x/SKILL.md`, leaves the same path in the
      evidence, as the scratch run above showed, because the walker does not
      exempt those directories. Only the first sentence leads to a pass.
    suggestion: >-
      Either exempt reverse-domain top-level directories in plugins.rs, as
      above, or drop the second sentence so the fix offers only the move that
      passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No threshold. Bronze follows from spec §6.1 and §7.1 (skills are
      discovered only from immediate children of `skills/`) and D81
      (docs/decisions/D01M7WMSMS00000000000000000.md: "skills only at
      skills/<name>/SKILL.md"); docs/design/agent-plugins.md:20 records the
      same rule.
summary: >-
  The core of the rule, that skills must sit at `skills/<name>/SKILL.md`,
  is right and sits at the right level. The walker contradicts the spec it
  cites: it flags client files in reverse-domain directories, which the
  fix tells you to use, and ignores skills hidden in dot-directories.
