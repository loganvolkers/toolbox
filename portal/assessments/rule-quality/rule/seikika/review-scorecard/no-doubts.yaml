apiVersion: seikika.com/assessment/v1
entity: rule:seikika/review-scorecard/no-doubts
rubric: rule-quality
subjectHash: 12e44ccb87da
assessor: {kind: agent, name: cursor-assessor-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check is "fresh and no criterion unsure"
      (portal/standards/meta.yaml:1061), and `reviewUnsure` is the current
      assessment's `unsure` list (meta.yaml:64-70). The fixture separates the
      cases: user-cli, with no review, fails and maintainer-ci-security passes
      (portal/tests/standards.test.yaml:910-913). Passing means the latest
      scorecard-quality review settled every criterion, as the name says.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The cheapest route is to re-assess and write `pass` wherever the
      assessor was unsure. A `fail` would drop the card to none through
      no-open-findings (meta.yaml:1016-1018), so `pass` is the only cheap
      answer. On this card nothing but the assessor's own word stands in the
      way. Unlike review-crate, which pairs no-doubts with a second assessor's
      review at gold (portal/standards/crates.yaml:433-436), review-scorecard
      has no independence rule (meta.yaml:1015-1073). The assess-entity
      skill's "say unsure rather than guess"
      (plugins/seikika-operator/skills/assess-entity/SKILL.md:23-24) is
      advice, not a check.
    suggestion: >-
      Add review-crate's gold `independently-reviewed` rule to this card:
      expose `reviewIndependent` on Scorecard from the same `link_reviews`
      output (crates/seikika-connect/src/assessment.rs:232-295). A second
      assessor's `complete` criterion
      (portal/standards/assessments.yaml:326-332) then has to accept any
      unsure that was turned into a pass.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix is "Resolve what the assessor was unsure of: usually a level
      whose purpose isn't written down" (meta.yaml:1065-1067). It names no
      file to edit and no command, and it never says to re-assess. The
      evidence lists only criterion names. Writing a level's purpose into
      docs/design/thresholds.md, where the link points, leaves the scorecard's
      hash and its fresh `unsure` verdict unchanged, so the rule still fails.
      Only an edit to the scorecard's own YAML makes the review stale and
      makes CI demand a new one (crates/seikika-cli/src/assess.rs:134-142).
    suggestion: >-
      Use the shape of review-crate's no-doubts fix (crates.yaml:424-428):
      read the unsure verdicts and their suggestions in
      portal/assessments/scorecard-quality/scorecard/<portal>/<name>.yaml,
      write the missing purpose into the scorecard's `description:` or
      `rationale:`, then re-assess with `seikika assess brief scorecard:<id>
      --portal portal`.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Gold for "no doubts" is in docs/design/thresholds.md:55,
      which the rule links (meta.yaml:1071-1073), and change C1 in
      docs/design/meta-standards-review.md:136.
summary: >-
  Fails on hard-to-game and fix-leads-to-pass. The check is right, but on
  this card no second assessor backs it, so an unsure can quietly become a
  pass. The fix names no file and no re-assessment, so following it can
  leave the fresh unsure verdict in place. review-crate's version of the
  same rule shows how to fix both.
