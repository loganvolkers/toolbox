entity: rule:seikika/maintainer-site/titled
rubric: rule-quality
subjectHash: 578cfb03f3fd
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The earlier finding is fixed: the frontmatter is parsed as YAML and only
      the top-level `title` string is read, trimmed after unquoting
      (crates/seikika-connector-workspace/src/site.rs:41-53), so a nested
      `hero: {title: …}`, a folded `>-` or `"  "` no longer counts. Passing
      means the page has a title Starlight can show.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      A placeholder such as `title: TODO` passes, but writing a real title
      costs the same as a placeholder, so the cheapest way to pass is
      effectively the right one. The cheap evasions the earlier review found
      (blank, nested) now fail (site.rs:46-53; test at site.rs:373). Duplicate
      placeholders are caught by unique-title at gold
      (portal/standards/site.yaml:137-148).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the top-level `title:` key, the minimum length and the
      page's frontmatter (portal/standards/site.yaml:84-87), and the evidence
      says whether it is missing or too short.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      docs/design/thresholds.md §2 states 3 characters as a labelled choice:
      the shortest real titles are words such as "Run", and two characters is
      a placeholder.
summary: >-
  Re-assessed after the rule gained a rationale: its check, evidence, fix
  and level are the same as on main, as is the code the reasons cite, so
  the verdicts stand; line numbers are updated for the rationale lines
  inserted above them. The rationale states the why without claiming more
  than the check sees. Fixed since the last review: a real YAML read, a
  stated minimum, and no cheap evasion that beats writing a title.
