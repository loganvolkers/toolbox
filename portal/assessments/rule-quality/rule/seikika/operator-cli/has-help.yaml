apiVersion: seikika.com/assessment/v1
entity: rule:seikika/operator-cli/has-help
rubric: rule-quality
subjectHash: 342b95f0e2a7
assessor: {kind: agent, name: cursor-assessor-14, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `about` is clap's `get_about()` for each leaf subcommand
      (crates/seikika-cli/src/main.rs:1206-1238), which is exactly the line
      `seikika <command> --help` prints first, so passing means an agent's
      first `--help` says what the command does (the rationale,
      portal/standards/cli.yaml:107-110). Every one of the 22 operator
      commands has one today, from `push` to `run`, whose about is a full
      paragraph on list, preview and confirm.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The 10-character floor (cli.yaml:100) rejects a missing or one-word help
      such as `/// Run.`, so the cheapest pass is a one-line `///` summary on
      the variant, which is the right thing. Filler of 10 characters would
      pass, but it costs as much as a true sentence and is visible in
      `--help`.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the variant in crates/seikika-cli/src/main.rs. That holds
      even for the commands whose flags live elsewhere: `Report` and `Run` are
      variants of the `Command` enum at main.rs:105 and main.rs:115, and their
      help comes from the variant's doc comment, not from the `run::Options`
      struct's own "`seikika run`'s flags."
      (crates/seikika-cli/src/run.rs:22), as `seikika describe` shows.
  - criterion: threshold-justified
    verdict: unsure
    reason: >-
      The bronze level is stated in docs/design/seikika-for-seikika.md:105 and
      argued in the rationale, but no source gives the number 10.
      docs/design/thresholds.md has no row for has-help, and user-mcp's
      equivalent `described` uses 20 (cli.yaml:272) without saying why the two
      floors differ.
    suggestion: >-
      Add a has-help row to docs/design/thresholds.md that states 10 as
      measured or chosen (the shortest live operator about, `token create`'s,
      is 78 characters; the shortest command about of all, `graph`'s
      "Neighbours of an entity", is 23), and say why command help and MCP
      descriptions use different floors, or align them.
summary: >-
  A sound bronze rule: it reads the exact text `--help` prints, its floor
  stops empty and one-word help, and its fix points at the right enum even
  for `run` and `report`. The only open point is the number 10, which no
  doc states. No fixture fails it (2 pass, 0 fail in
  portal/fixtures/surfaces.ndjson) and no expectation in
  portal/tests/standards.test.yaml names it, so its fail path is untested.
