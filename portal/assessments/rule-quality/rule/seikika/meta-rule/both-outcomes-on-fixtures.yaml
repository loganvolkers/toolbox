apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-rule/both-outcomes-on-fixtures
rubric: rule-quality
subjectHash: 085f18358403
assessor: {kind: agent, name: cursor-assessor-02, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `fixture.pass` and `fixture.fail` are counted from the derived scores of
      the portal's own fixtures, per (scorecard, rule), with unknown kept
      separate (crates/seikika-cli/src/meta.rs:131-151, 253, 262). So passing
      means the rule was evaluated both ways on fixtures, and its evidence was
      evaluated on the failing one. That is the claim in the rationale
      (portal/standards/meta.yaml:477-480).
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Neither count can be raised without a fixture record that makes the rule
      actually pass or fail, because unknown outcomes don't count
      (meta.rs:141-145). Adding such a record is the intended work. Whether a
      test pins the outcomes is left to pins-both-outcomes
      (meta.yaml:541-557), which is a reasonable split.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence gives both counts (`fixtures: 3 pass, 0 fail` for
      rule:seikika/maintainer-ci-security/least-privilege-token in
      portal/fixtures/surfaces.ndjson), so the agent knows which outcome is
      missing, and the fix says to add an entity with that outcome. "The
      fixtures" refers to the portal's fixtures directory loaded by
      crates/seikika-store/src/lib.rs:215. The fix doesn't name that path, but
      the target is unambiguous.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The thresholds (more than 0 of each) are the definition, not a tunable
      number. Silver sits above decided-on-fixtures (bronze, one outcome),
      following the prerequisite principle in docs/design/thresholds.md:22-23
      and lesson L4 (docs/design/scorecards-for-scorecards.md:84, 103). The
      card's rationale names it as silver's addition (meta.yaml:398-400).
summary: >-
  A sound rule. It measures what it says from outcome counts that ignore
  unknowns, it can only be raised by real fixtures, and its evidence shows
  which outcome is missing. Live it fails 13 of 272 rules
  (portal/results.json). Its tests pin only the fail outcome
  (portal/tests/standards.test.yaml:235-241), which pins-both-outcomes
  reports separately.
