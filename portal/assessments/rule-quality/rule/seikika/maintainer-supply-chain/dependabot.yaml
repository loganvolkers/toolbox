apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-supply-chain/dependabot
rubric: rule-quality
subjectHash: 89268b5d9e47
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale is that an ecosystem Dependabot doesn't cover ages
      unnoticed (portal/standards/repository.yaml:91-95), but the check asks
      only whether the three names cargo, npm and github-actions appear
      (crates/seikika-connector-workspace/src/repo.rs:129-135), whatever the
      repository uses and wherever its manifests are. This repository passes
      while scripts/playwright-ci/package.json, which ci.yml copies and
      installs (.github/workflows/ci.yml:170), the hash-pinned
      scripts/requirements-yamark.txt (ci.yml:36) and the digest-pinned base
      in image/Dockerfile:6 get no update PRs: .github/dependabot.yml lists
      npm only for /ui, /site and /experiments/typescript-builder, and neither
      pip nor docker.
    suggestion: >-
      In repo.rs, derive the wanted (ecosystem, directory) pairs from the
      tracked manifests (Cargo.toml roots, package.json, requirements*.txt,
      Dockerfile, workflows), parse dependabot.yml as YAML, and list each
      uncovered pair as `<ecosystem> in <dir>`, with fixtures for a covered
      and an uncovered directory.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The ecosystems come from a regex over the raw text
      (`package-ecosystem:\s*["']?([A-Za-z0-9_-]+)`, repo.rs:174), not a YAML
      parse, so a comment line `# package-ecosystem: npm` closes the npm gap.
      An `updates` entry for any directory, even one with no manifest, does
      too.
    suggestion: >-
      Parse .github/dependabot.yml with serde_norway as the workflows parser
      does, read `updates[].package-ecosystem` and `directory`, and check that
      each directory holds a manifest of that ecosystem.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists the missing ecosystems, pinned as ['cargo', 'npm',
      'github-actions'] for acme/unsafe (portal/tests/standards.test.yaml
      :722-728), and the fix names the file and the entries to add
      (repository.yaml:88-90). One `updates` entry per listed ecosystem
      empties the gaps.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Bronze is D85's placement, and D01M82E93XAPNE0WFXEPJZ59WG4 §2
      says why it stays beside Scorecard's Dependency-Update-Tool: that check
      asks only that a tool exists. The rationale repeats it
      (repository.yaml:93-95).
summary: >-
  Its reason to exist, per-ecosystem coverage beyond Scorecard, is right,
  but the check is three fixed names found by regex. Comments count,
  directories don't, and pip and docker aren't asked for, so this
  repository passes with a CI npm manifest, a pip requirements file and a
  base image that get no updates.
