apiVersion: seikika.com/assessment/v1
entity: rule:seikika/vs-backstage-performance/list-latency
rubric: rule-quality
subjectHash: 9d0baf63fb06
assessor: {kind: agent, name: cursor-assessor-16, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The rationale is the "what does this team own" question
      (portal/standards/backstage-comparison.yaml:299-302). The measured read
      is exactly that: the first 100 components of each of the 50 owners,
      filtered on `entity.owner=='group:gN'` (measure.py:168-175). The
      equivalence gate proves that both arms return the same owner and
      component pairs (measure.py:270-273). It only exercises the equality
      shape that the per-snapshot index narrows (ADJUDICATION.md:155-162).
      That shape is the rule's stated question, so passing means what the name
      says.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The gate stops a run unless every owner's full list matches the corpus
      digest (measure.py:270-273). That defect class let Backstage's lists
      return nothing quickly in rounds 1 and 2 (RESULTS.md:40-47), and it can
      no longer pass a run. Only 200s count toward the measured reads.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names `list_entities` in crates/seikika-api/src/routes.rs, where
      the candidate selection and the field-index narrowing live
      (routes.rs:205-215). It is the same place round 1's loss was fixed
      (`916f596`, RESULTS.md:136-144). Rerunning the harness then refreshes
      the record through snapshot.py (run.sh:4).
  - criterion: threshold-justified
    verdict: unsure
    reason: >-
      The 500 ms p95 was pre-registered (README.md:39; ADJUDICATION.md §3.1),
      but no source derives it. It is looser than the product's own read SLO
      for get, query and search, under 200 ms p99 (docs/plan.md:920). So a
      list could pass this rule while missing the plan's budget. Round 1's 118
      ms p95 (RESULTS.md:129) passed the bar while Seikika was behind.
    suggestion: >-
      State why list gets 500 ms, against the plan's 200 ms p99 for queries.
      Otherwise tighten the bar to the plan's figure and record the choice in
      docs/design/thresholds.md.
summary: >-
  The rule measures the question it names, an owner's components, behind
  an equivalence gate that defeats empty-list shortcuts, and its fix names
  the function that was fixed last time. The bar is the weak part: it is
  looser than the plan's read SLO and no source argues for it, so round
  1's real loss passed it.
