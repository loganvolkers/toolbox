apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-ci-speed/fast-feedback
rubric: rule-quality
subjectHash: 7bd0d19876b7
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      "Feedback" is the wait on a pull request, but `p90Seconds` is the p90 of
      `updated_at - run_started_at` over runs on the configured branch, main
      (crates/seikika-connector-github/src/runs.rs:12-15, 70, 96;
      packages/github-actions/fragments/github-actions.yaml:49-52). That
      leaves out PR runs and queue time, which GitHub's performance metrics
      report (docs/design/github-actions-standards.md:64). It counts cancelled
      runs, whose cut-short times pull the p90 down (runs.rs:44, 70), and a
      re-run moves `updated_at`, so a run re-run hours later counts as hours
      long.
    suggestion: >-
      Have the github connector also read pull_request runs (`event=
      pull_request`) and report their p90 from `created_at` (queue included)
      to the first attempt's end, over decided runs only. Read that field
      here, and keep the main-branch figure as context.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Because only main is measured, `if: github.event_name == 'pull_request'`
      on the slow job makes main's runs fast while PR feedback stays as slow.
      failures-visible only catches skips written as `github.ref !=
      'refs/heads/main'`
      (crates/seikika-connector-workspace/src/workflows.rs:115-128), so
      nothing flags it. That is one line, cheaper than speeding the job up.
    suggestion: >-
      Measuring pull request runs, as above, closes this route; until then,
      have skipped_on_default treat an `if:` that needs event_name ==
      'pull_request' as a skip on the default branch.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix's third option, "move long suites off the PR path"
      (github-actions.yaml:524-526), moves them onto the main-branch runs the
      rule measures, which raises the p90. The evidence is one number,
      `p90Seconds / 60` in integer division (:523), so a 959-second p90 reads
      "15 min" and fails a 15-minute bound, and it names no job: per-job
      timing is open item G5 (docs/design/github-actions-standards.md:161). An
      agent can't tell which job to split or cache.
    suggestion: >-
      Print the p90 in seconds or with one decimal, list the slowest jobs with
      their p90 from the runs' jobs endpoint (G5), and drop "move long suites
      off the PR path" from the fix while the rule reads main.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      docs/design/thresholds.md:34 labels the 15 minutes a chosen bound (the
      point where developers switch task), the rationale says so
      (github-actions.yaml:527-529), and the number is a package parameter
      (packages/github-actions/seikika-package.yaml:49-53). Silver above the
      cheaper bronze rule on its own card is explained in the same row.
summary: >-
  The bound is honestly labelled a choice, but the measure is main-branch
  run time without queue time, including cancelled runs and re-run gaps,
  not pull request feedback. So skipping a slow job on push passes, and
  the fix's advice to move suites off the PR path makes the measured
  number worse. The evidence names no job and rounds the minutes down.
