apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-example/cites-the-design
rubric: rule-quality
subjectHash: a650629ce5d4
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      citesDesign is true when the text contains `docs/` anywhere, or matches
      `(?i)\b(D\d+|D<ULID>)\b` (crates/seikika-connector-workspace/src/
      examples.rs:38-42). That accepts `site/src/content/docs/`,
      `docs/research-log.md` (not a design), a lower-case `d3`, and hypothesis
      labels like connector-repair-ab's D1-D3
      (docs/design/dx-benchmarks.md:236). The cited decision doesn't have to
      exist. The `docs/decisions` clause is subsumed by `docs/`. I checked all
      41 live passes, and each does cite docs/design/, docs/decisions/ or a
      real decision id, so the misreads are latent. maintainer-docs already
      resolves cited decision ids (portal/tests/standards.test.yaml:651).
    suggestion: >-
      Set citesDesign only for a link or path to `docs/design/*.md` or
      `docs/decisions/*.md` that exists, or an upper-case decision id (legacy
      `D<n>` or `D` plus a ULID) that names a file under docs/decisions/.
      Reuse the maintainer-docs id resolution rather than a second regex.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Any write-up containing the four characters `docs/`, or a token like
      `D1`, passes gold. That is cheaper than finding the design the example
      demonstrates, which is the work the rationale asks for
      (portal/standards/examples.yaml:94-96).
    suggestion: >-
      The resolution above makes the cheapest pass a citation that exists.
      Also require the cited design doc's path to appear as a Markdown link,
      so links-resolve covers it.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the fixed string "does not point at a design doc or a
      decision" (examples.yaml:89, pinned at
      portal/tests/standards.test.yaml:646-647). Linking
      `docs/design/<topic>.md` or `docs/decisions/<id>.md` as the fix says
      (examples.yaml:91-93) contains `docs/` and passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Gold is set by D78 ("gold is a pointer at the design
      or a decision", docs/decisions/D01M7W5G0T00000000000000000.md:9) and
      docs/design/example-standards.md:25, :61. It asks for something bronze
      and silver don't imply, as docs/design/thresholds.md:24 requires of a
      gold rule.
summary: >-
  A sensible gold rule with a clear fix, whose detector is a substring and
  a case-insensitive regex. `docs/` anywhere, `d3` or a hypothesis label
  passes it, and cited ids aren't resolved. Live passes are genuine today,
  but the check doesn't guarantee it.
