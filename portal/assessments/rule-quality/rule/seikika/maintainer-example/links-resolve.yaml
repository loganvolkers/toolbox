apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-example/links-resolve
rubric: rule-quality
subjectHash: 8f13fb4a5ca6
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The link regex `\]\(([^)\s#]+)(?:#[^)]*)?\)`
      (crates/seikika-connector-workspace/src/examples.rs:45) misses valid
      CommonMark links. `[a](gone.md "title")`, `[a](<my file.md>)` and the
      reference definition `[a]: gone.md` give no match, so a dead target in
      any of those forms passes; I ran the pattern on each to confirm. In the
      other direction, `resolve()` drops the leading `/` of a root-relative
      link (examples.rs:67-84), so `/docs/x.md`, which GitHub resolves from
      the repository root, is looked up under the file's directory and fails.
      Links inside code fences count too. All 47 live entries pass, so these
      are latent.
    suggestion: >-
      Parse links with a Markdown parser (pulldown-cmark gives inline,
      reference and autolinks, and skips code), or extend the regex to allow
      an optional title and `<...>`. Resolve a leading `/` from the root,
      URL-decode the target, and add a test for each form.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      When the rule fires, the cheapest move is to remove or fix the listed
      link, which the fix allows (portal/standards/examples.yaml:70-71). For a
      target that was deleted, that is the right action. The title-form gap
      above would hide a dead link, but nobody reaches for it to dodge the
      rule, and wrapping a link in backticks doesn't dodge it.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the exact list of dead targets (`missingFiles`;
      `['nope.md']` pinned at portal/tests/standards.test.yaml:644-645), and
      the fix says to fix or remove them, which empties the list.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Bronze is set by D78 ("bronze is a heading and
      resolving links", docs/decisions/D01M7W5G0T00000000000000000.md:9) and
      docs/design/example-standards.md:22, :59. A drifted link makes a copy
      incomplete (examples.yaml:72-74), which is a floor-level defect.
summary: >-
  The right bronze rule with a clear fix and no cheap dodge. Its regex
  extractor misses titled, angle-bracket and reference-style links and
  misreads root-relative ones, so "links resolve" holds only for the plain
  inline form. A Markdown parser would fix it.
