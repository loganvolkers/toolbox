apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-connector/exercised-in-ci
rubric: rule-quality
subjectHash: a819489d8cd7
assessor: {kind: agent, name: cursor-assessor-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      A "CI file" is any scripts/*.sh or workflow
      (crates/seikika-connector-workspace/src/connectors.rs:204-208), whether
      or not a workflow runs the script, and a conformance line is any line
      naming the package and "connector test" (:196-199), comments included.
      For a push-only connector, any file that names the package counts
      (portal/standards/connectors.yaml:162-163). scim's name in the image
      build loop (.github/workflows/image.yml:50) would pass alone. Today the
      real lines run: scripts/m4-acceptance.sh:33-34 and :41 under
      .github/workflows/ci.yml:177, scripts/gitlab-acceptance.sh:217 under
      ci.yml:200, and ci.yml:103-105.
    suggestion: >-
      Count a script only when a workflow `run:` invokes it, skip comment
      lines, and for push-only connectors require a line that starts the
      binary, not one that only names it.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      On a scratch repo, a new scripts/notes.sh holding only the comment `#
      someday: seikika connector test -- seikika-connector-fake` gave
      conformanceMentions 1 through target/debug/seikika-connector-workspace,
      so gold passed with nothing running the kit.
    suggestion: >-
      Ignore `#` comment lines and scripts no workflow calls, as above.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence gives both counts (connector-test lines and CI files,
      connectors.yaml:164-166, pinned at 0 and 0 for crates/demo/partial in
      portal/tests/standards.test.yaml:406-407), and the fix says to run
      `seikika connector test` on the binary from CI, or an acceptance script
      for a push connector (connectors.yaml:167-169). The live lines follow
      that form and pass.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Gold is D73's "a CI conformance line (or an acceptance script for a push
      connector)" (docs/decisions/D01M7W4FRJR0000000000000000.md). It meets
      docs/design/thresholds.md:24 (gold asks for what lower levels don't
      imply): the static silver rules infer shapes and the kit runs them.
summary: >-
  The right gold rule, and the live connectors really are run by CI, but
  the check counts any line in any scripts/*.sh, including comments and
  scripts no workflow calls. For push-only connectors, a mere mention
  counts. One comment in a new script reached gold on a scratch repo. Fix
  and level are well grounded.
