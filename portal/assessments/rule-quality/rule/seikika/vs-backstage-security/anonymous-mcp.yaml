apiVersion: seikika.com/assessment/v1
entity: rule:seikika/vs-backstage-security/anonymous-mcp
rubric: rule-quality
subjectHash: e840e4304a86
assessor: {kind: agent, name: cursor-assessor-16, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The probe posts `tools/list` to /mcp with no credentials
      (experiments/backstage-compare/surface.py:159-160). In Seikika, every
      MCP request that carries an id goes through `state.caller` before any
      method is dispatched (crates/seikika-api/src/mcp.rs:1010-1013). Refusing
      tools/list therefore means tools/call and initialize are refused too,
      which is the "side door" the rationale names
      (portal/standards/backstage-comparison.yaml:492-493). Only notifications
      without an id get 202 without auth (mcp.rs:1007-1009), and those return
      no data.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The check sits before the method switch (mcp.rs:1010-1015), so no
      per-method exemption is possible. The probe runs against the default
      mode off loopback, with SEIKIKA_* removed (surface.py:59). The only ways
      to pass are a refusal at that gate or at the transport.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix, "Authenticate /mcp as the REST API does, in
      crates/seikika-api/src/mcp.rs", names the handler and the mechanism.
      `handle` calls the same `AppState::caller` that REST uses
      (crates/seikika-api/src/access.rs:32-51).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule is boolean. Its basis is RESEARCH.md F6 (secure defaults, lines
      177-192) applied to the agent surface F13. Single bronze level per
      D01M857ZB468ZM2YS6GNSEG6YB9.
summary: >-
  A good rule: one probe covers every MCP method, because the gate in
  mcp.rs comes before dispatch, and the fix names that gate. Both products
  pass today (401 each, RESULTS.md:181), so it holds parity.
