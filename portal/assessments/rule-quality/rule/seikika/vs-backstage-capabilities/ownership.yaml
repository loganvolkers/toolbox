assessor: {kind: agent, name: cursor-assessor-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      "Show who owns what, through groups" (backstage-comparison.yaml:131-133)
      matches the brief's "ownership view" scenario (RESEARCH.md:113). Seikika
      answers it with `seikika owner` and the `owner_of` MCP tool, which also
      reports whether the claim is verified
      (crates/seikika-api/src/mcp.rs:44), and the corpus gives every component
      a group owner (gen.py:29-33).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The value is `capOwnership: {value: true}` on one line of
      experiments/backstage-compare/facts.yaml:73, which snapshot.py:85 copies
      into the record unchecked; nothing in the harness asks either product
      who owns a component.
    suggestion: >-
      Add a probe to surface.py that calls each product's owner tool or route
      for component:c1 and checks the answer is the group gen.py assigned
      (group:g1), and derive `capOwnership` from it.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the CLI command and the MCP tool (`owner_of`, mcp.rs:44)
      whose presence is the evidence in
      experiments/backstage-compare/facts.yaml:73; restoring them after a
      regression is exactly what would make the fact true again.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No threshold: a pass/fail capability, pre-registered as "true" in
      experiments/backstage-compare/README.md:53 and confirmed by
      ADJUDICATION.md:114.
summary: >-
  A sound ownership rule backed by a real tool that goes further than
  Backstage's (it says whether the claim is verified). Its fact is
  asserted rather than probed, so a small surface.py probe would make it
  trustworthy.
