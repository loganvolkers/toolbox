apiVersion: seikika.com/assessment/v1
entity: rule:seikika/vs-backstage-capabilities/community
rubric: rule-quality
subjectHash: d8617028b6f4
assessor: {kind: agent, name: cursor-assessor-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale is people who fix bugs, review and keep the project alive
      when a maintainer leaves (backstage-comparison.yaml:1069-1072), but
      `contributors` is GitHub's all-time count with anonymous and agent
      accounts included: Seikika's 4 has three agents
      (experiments/backstage-compare/facts.yaml:94-98). A bot or one-off typo
      fixes raise it without adding anyone who stays, and the brief scored
      project health through OpenSSF Scorecard checks, not a raw count
      (RESEARCH.md:31-33, 64).
    suggestion: >-
      Count distinct human contributors with commits in the last 90 days, or
      read OpenSSF Scorecard's Contributors and Maintained checks, as the
      brief's F8 row proposes.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Agent identities already count toward the 4
      (experiments/backstage-compare/facts.yaml:96-97), so six more agent or
      bot accounts would pass with no new person; the number is also typed
      into experiments/backstage-compare/facts.yaml:94-95 rather than fetched
      by a script.
    suggestion: >-
      Fetch the count in footprint.py from the GitHub API, excluding bot and
      agent accounts and anonymous entries, and restrict it to a recent
      window.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      CONTRIBUTING.md (absent at the repository root today), good first issues
      and a green `cargo test` (the fix,
      portal/standards/backstage-comparison.yaml:1066-1068) invite
      contributors but cannot make six more people contribute, so following
      the fix alone does not move `entity.contributors >= 10.0` (line 1060)
      from the 4 in experiments/backstage-compare/facts.yaml:94-95; the rule
      measures an outcome the maintainers don't control.
    suggestion: >-
      Either split the rule: a pass/fail on the levers (CONTRIBUTING.md, a
      good-first-issue label with open issues, a fresh-clone build in CI) plus
      a reported, unscored contributor value, or say in the fix that the count
      only moves as outside contributors arrive.
  - criterion: threshold-justified
    verdict: unsure
    reason: >-
      The ≥ 10 bar was written after the smoke rounds, as a disclosed
      deviation (experiments/backstage-compare/RESULTS.md:261-265,
      ADJUDICATION.md:123), and no doc gives a source for 10. The comparative
      standing does not depend on it (4 vs 2,826), but the level does.
    suggestion: >-
      State where 10 comes from (for example a bus-factor or OpenSSF
      threshold) in docs/design/thresholds.md or the rule's rationale, or
      replace it with the OpenSSF check score.
summary: >-
  The weakest rule on this card: a project-health count, agents included,
  inside a functional-completeness scorecard, with a post-hoc bar and a
  fix that cannot by itself reach it. The loss it records is real; the
  rule should measure human, recent contributors and likely move to a
  project-health card.
