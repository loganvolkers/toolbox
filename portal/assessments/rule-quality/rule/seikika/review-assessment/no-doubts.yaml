apiVersion: seikika.com/assessment/v1
entity: rule:seikika/review-assessment/no-doubts
rubric: rule-quality
subjectHash: 30671c0479ca
assessor: {kind: agent, name: cursor-assessor-04, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check needs a current review with no unsure criterion
      (portal/standards/assessments.yaml:295-307; `reviewUnsure` at :81-86).
      In practice the doubt is `reproducible`, which the rubric marks unsure
      "when a verdict rests on taste" (assessments.yaml:334-339). It was
      unsure in all three first reviews
      (docs/design/scorecards-for-scorecards.md:321-324), so passing means a
      reviewer found the verdicts grounded in what the sources state.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Clearing a doubt means a new review: the reviewer flips the verdict, or
      the assessment is edited, its hash changes and the review goes stale
      (portal/standards/assessments.yaml:67-73). The level also needs silver's
      different reviewer (assessments.yaml:259-262), so the assessor can't
      flip it alone. That a reviewer can flip unsure to pass without a new
      source is the same judgement the rule relies on, and silver's
      independence check guards it, not this rule.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix is "resolve what the reviewer was unsure of, usually by citing
      the source a verdict rests on" (assessments.yaml:301-302). Citing the
      source means editing the assessment, which changes its hash. The review
      then goes stale and the rule still fails, now with "no current review"
      (assessments.yaml:298-300), until another assessor reviews it again, and
      the fix never says so. review-crate's no-doubts fix ends with "then
      re-assess with `seikika assess brief …`"
      (portal/standards/crates.yaml:425-428).
    suggestion: >-
      Append to the fix: "in the assessment file under portal/assessments/,
      then have another assessor review it again: `seikika assess brief
      <assessment id> --portal portal`."
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. "No doubts" at gold is in the gold cell of
      docs/design/thresholds.md:55. It adds to silver what silver doesn't
      imply, as thresholds.md:24-25 requires of gold.
summary: >-
  It measures what it says and can't be cleared by the assessor alone,
  because gold needs silver's independent reviewer. Its fix stops half
  way: citing the source edits the assessment, which makes the review
  stale, and the fix doesn't say a new review is needed. review-crate's
  version of this rule says so.
