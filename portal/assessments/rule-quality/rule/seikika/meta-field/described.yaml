apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-field/described
rubric: rule-quality
subjectHash: 6a6f12a66310
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `described` is filled(description), meaning non-blank after trimming
      (crates/seikika-cli/src/model.rs:154, 281-285). That is what the name
      claims. The fix asks for meaning, unit and source
      (portal/standards/meta.yaml:796-797), which no check can read, but the
      field record already carries `sources` and `computed` as facts
      (model.rs:155). Judging the prose itself is left to readers.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A blank description no longer passes (model.rs:281-285), but `TODO` or
      the field's own name does. 205 fields fail only this rule today
      (portal/results.json, meta-field), so a placeholder per field is the
      cheapest way to move most of the card from bronze to silver.
    suggestion: >-
      Reject placeholders: a description equal to the field name (ignoring
      case and camelCase splits), or matching TODO, TBD, FIXME or
      "description". Short real descriptions such as "Its criteria."
      (meta.yaml:360) and "The kind's name." (meta.yaml:209) still pass.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names Kind.field (meta.yaml:795), and the fix names the
      `description:` key and what to write. Crate.codeLines is the pinned
      failing fixture (portal/tests/standards.test.yaml:811-813). Any
      non-blank text the fix leads to passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Silver follows the card's rationale: a value in some fixture
      is the floor, and "a description and a declared shape sit above it"
      (meta.yaml:764-769, docs/design/scorecards-for-scorecards.md:208). The
      first run found 129 undescribed fields, including every field of the
      reference portal and the starter (scorecards-for-scorecards.md:216-217),
      so as a bronze rule it would have put both example portals' fields at
      none.
summary: >-
  A correct presence check with a justified level and a fix that works.
  Its weakness is the cheap route: any placeholder word passes, and over
  200 fields stand one placeholder away from silver.
