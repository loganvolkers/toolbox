apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-field/populated-in-fixtures
rubric: rule-quality
subjectHash: 6244162f4711
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale says the rule catches a field that is "empty or wrong on
      every entity" (portal/standards/meta.yaml:789-791). But population
      counts any non-null value (crates/seikika-cli/src/model.rs:110-122), so
      `[]`, `""`, `0` and `false` all count, including defaults a map rule
      writes itself. S4S's Rule map sets `'links': has(record.links) ?
      record.links : 0` (meta.yaml:197). None of the 8 rule records in
      portal/fixtures/surfaces.ndjson has a `links` key, yet
      field:seikika/Rule.links is gold in portal/results.json. Its mapping
      from the record has never run in a test.
    suggestion: >-
      Count a value only if some fixture record carries the key the map reads
      for the field, or skip values equal to the map rule's literal fallback
      and values that are empty.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A field that fails can pass by changing its map rule's fallback from
      `null` to a literal, without touching a fixture. Scorecard.liveEntities
      fails today with `has(record.liveEntities) ? record.liveEntities : null`
      (meta.yaml:91). Changing `null` to `0` passes it and makes live entities
      show 0 instead of unknown. That costs the same as adding a fixture value
      and exercises nothing.
    suggestion: >-
      The same fix as above: count only values that come from a fixture
      record's key, not from the map rule's fallback.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix says to give a fixture record "a value for the field"
      (meta.yaml:786-787), but fixture records hold connector keys, and map
      rules rename them. Field.fieldType reads `record.type`,
      Field.fixtureWithValue reads `record.fixture.withValue`
      (meta.yaml:297-300), and Kind.fieldCount reads `record.fields`
      (meta.yaml:243). Adding a key named after the field leaves the field
      null. The evidence ("none of N fixture Kind entities has a value") names
      neither the fixture file nor the record key. When N is 0, the right fix
      is meta-kind's in-fixtures instead.
    suggestion: >-
      Emit for each field the map rule's `from` and the record keys its `set:`
      reads for that field (model.rs:27-45 already extracts CEL fields). Then
      have the evidence say "set <key> on a <connector>/<record> record in
      fixtures/<connector>.ndjson".
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      "At least one entity", at bronze. The ratchet comment says "a new field
      must have a value somewhere in the fixtures" (meta.yaml:778), the card's
      rationale calls it the floor (meta.yaml:767-769), and
      docs/design/scorecards-for-scorecards.md:208 places it.
summary: >-
  The right floor, but "non-null" is weaker than "exercised": a map rule's
  own fallback value passes the rule. Rule.links is gold with no fixture
  record carrying `links`. The fix also says "the field" where it should
  say the record key the map reads, so following it literally can leave
  the field null.
