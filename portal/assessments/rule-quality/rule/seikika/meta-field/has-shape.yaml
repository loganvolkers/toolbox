apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-field/has-shape
rubric: rule-quality
subjectHash: 2ebe042ffc1a
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `opaque` is `type: object`, or `type: list` with `items: object`
      (crates/seikika-cli/src/model.rs:156). A `list` with no `items` is just
      as shapeless but isn't flagged, and neither is `items: json` or any
      other string: the schema makes `items` optional and free text
      (schema/manifest.schema.json, `$defs/field`). The miss is latent today.
      Every `list` field in portal/, the starter, the reference portal and
      packages/ declares `items` (160 by my count), 155 of them scalar.
    suggestion: >-
      Treat a `list` without `items`, or with `items` outside the scalar and
      ref types (string, integer, number, boolean, ref), as opaque.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      For a list of objects, the cheapest pass is deleting its `items: object`
      line. No code reads `items` against entity values. The derive
      diagnostics are map.error, relation.dropped, computed.error,
      tuples.error, options.error and compare.missing
      (crates/seikika-derive/src/lib.rs:349-735), none of them about types. A
      field such as Crate.tests, one of the opaque fields the first run named
      (docs/design/scorecards-for-scorecards.md:217), would reach gold with
      one deleted line and unchanged data.
    suggestion: >-
      The suggestion above closes this route too: a list whose items aren't a
      declared scalar or ref stays opaque.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names Kind.field and its type
      (portal/standards/meta.yaml:805-807). The manifest has no way to declare
      an object's keys (Field in
      crates/seikika-model/src/manifest.rs:150-162), so replacing the object
      with typed fields or a list of strings is the only honest route, and the
      fix names it. Rule.check is the pinned failing case
      (portal/tests/standards.test.yaml:817-820).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Gold is placed by
      docs/design/scorecards-for-scorecards.md:208, the rationale explains
      what an undeclared shape costs (meta.yaml:811-814), and the first run
      found 20 opaque objects (scorecards-for-scorecards.md:217).
summary: >-
  The fix is right and gold fits a rule that asks for real restructuring.
  The check equates "has a shape" with "isn't an object", though, so a
  list with no `items` passes. Deleting `items: object` reaches gold
  without changing the data.
