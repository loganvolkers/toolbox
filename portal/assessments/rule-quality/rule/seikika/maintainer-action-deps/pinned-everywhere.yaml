apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-action-deps/pinned-everywhere
rubric: rule-quality
subjectHash: a8d053f29dfc
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `pins` holds only the uses in files the `workflows` globs match
      (crates/seikika-connector-workspace/src/workflows.rs:339-363), and this
      portal's globs are `.github/workflows/*.y*ml` and
      `actions/*/action.y*ml` (portal/seikika.yaml:126). A composite action
      under .github/actions/, GitHub's common place for one, isn't read, so an
      action pinned in ci.yml but used by tag in
      .github/actions/setup/action.yml reads "pinned everywhere". The package
      hard-codes the same `actions/*` glob for zizmor
      (packages/github-actions/fragments/github-actions.yaml:25).
    suggestion: >-
      Add `.github/actions/**/action.y*ml` to the workflows globs here, in
      packages/github-actions/tests/seikika.yaml:16 and in the zizmor job's
      `files`, and say in the package README that every local action directory
      must be globbed.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The cheapest pass is pasting the pin hint, and the hint can be another
      version. `pin_for` falls back to any SHA pin on the same path when none
      matches the ref's tag (workflows.rs:314-333). A scratch workflow with
      `actions/cache@v5` beside `actions/cache@<sha> # v4.2.0` got the hint
      `actions/cache@v5, pinned elsewhere as actions/cache@<sha> # v4.2.0`, so
      pasting it downgrades a major version and passes. The unit test at
      workflows.rs:495-513 does the same for `@main`.
    suggestion: >-
      Add a hint only when the version comment is within the ref's tag;
      otherwise give the ref alone so the fix's `git ls-remote` is used. Or
      word it `pinned elsewhere at a different version as …`, and pin that
      with a test.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is each non-SHA ref with the pin already written elsewhere,
      comment included (D01M84EPMMR9740K4N25G7A6FAY), pinned by
      portal/tests/standards.test.yaml:214-223. The fix covers the case
      without a hint with `git ls-remote` and the annotated-tag peel.
      Replacing every listed ref with a SHA makes `pins` all `sha`.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. D70 sets "SHA-pinned everywhere" as the card's bronze, and
      the card's rationale explains a single level: an action is pinned in
      every workflow or it isn't (github-actions.yaml:540-544). Pinning is a
      floor item by docs/design/thresholds.md:19-21.
summary: >-
  It answers the incident question, which workflows run an action at which
  refs, with evidence that hands over the pin as the repository writes it.
  But the hint can carry another version's SHA, so the cheapest pass may
  be a silent downgrade, and composite actions outside `actions/*` are
  invisible to "everywhere".
