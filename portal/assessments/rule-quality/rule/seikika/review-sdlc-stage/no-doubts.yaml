apiVersion: seikika.com/assessment/v1
entity: rule:seikika/review-sdlc-stage/no-doubts
rubric: rule-quality
subjectHash: 5a1cbbc8ca27
assessor: {kind: agent, name: cursor-assessor-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check is "fresh and the current review's `unsure` is empty"
      (portal/standards/sdlc.yaml:381, fields at sdlc.yaml:110-116). Passing
      means the latest sdlc-stage-quality review decided every criterion,
      which the rationale says a stage "an agent is meant to carry out alone"
      needs (sdlc.yaml:388-391). The fixture separates the cases:
      demo-gap/plan, with no review, fails and demo-done/plan passes
      (portal/tests/standards.test.yaml:1088-1091).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The cheap route is to re-assess with `pass` wherever the assessor was
      unsure. In the live portal, operator/build-connector carries an
      `agent-can-complete: unsure`
      (portal/assessments/sdlc-stage-quality/sdlc-stage/operator/build-connector.yaml).
      Re-writing that verdict as `pass` passes this rule, and writing `fail`
      would drop the stage to none, so `pass` is the cheap answer.
      review-sdlc-stage has no second-assessor rule (sdlc.yaml:331-392); only
      review-crate does (portal/standards/crates.yaml:433-436). Nothing but
      the assessor's own word separates a settled doubt from a guess.
    suggestion: >-
      Add `reviewIndependent` to SdlcStage from the connector's `link_reviews`
      (crates/seikika-connect/src/assessment.rs:232-295) and a gold
      `independently-reviewed` rule. A reviewer's `complete` criterion
      (portal/standards/assessments.yaml:326-332) then has to accept any
      unsure that was turned into a pass.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix, "Resolve what the assessor was unsure of, usually a missing
      measurement or an unstated exit criterion" (sdlc.yaml:385-386), names no
      file and no command, and it doesn't say to re-assess. If the missing
      piece is added to a stage's doc or check script rather than its YAML
      entry, the stage hash doesn't change
      (crates/seikika-connector-workspace/src/data.rs:250). The review stays
      fresh with its `unsure`, CI raises nothing, and the rule keeps failing.
    suggestion: >-
      Name the places and the loop, as review-crate's no-doubts fix does
      (crates.yaml:424-428): read the unsure verdict's suggestion in
      portal/assessments/sdlc-stage-quality/sdlc-stage/<layer>/<stage>.yaml,
      add the measurement or `exitCriterion` in
      portal/sdlc/stages/<layer>.yaml, then re-assess with `seikika assess
      brief sdlc-stage:<layer>/<stage> --portal portal`.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Gold for "no doubts" is in the review-* row of
      docs/design/thresholds.md:55, which names sdlc-stage, and change C1 in
      docs/design/meta-standards-review.md:136.
summary: >-
  Fails on hard-to-game and fix-leads-to-pass. The check is correct. No
  second assessor stands behind it, and a live stage shows the flip it
  invites. The fix names neither the stage file nor a re-assessment, and
  because the stage hash covers only the declaration, a fix made in a
  check script doesn't even stale the doubtful review.
