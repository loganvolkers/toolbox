apiVersion: seikika.com/assessment/v1
entity: rule:seikika/review-crate/independently-reviewed
rubric: rule-quality
subjectHash: 32e666d3be4a
assessor: {kind: agent, name: cursor-assessor-05, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `reviewIndependent` (portal/standards/crates.yaml:84-92) is set by
      `link_reviews` (crates/seikika-connect/src/assessment.rs:232-295). It
      takes the verdict of an assessment-quality review whose subjectHash is
      the crate-design assessment's current hash, whose assessor name is set
      and different, and which is grounded (cites the assessment's file or a
      file the assessment cites). The check also needs the crate review to be
      fresh and that verdict to be `pass` (crates.yaml:435). Passing therefore
      means a second, named assessor engaged with the current assessment and
      found it sound, which is what the name and the fix (crates.yaml:441-445)
      promise. The unit test covers three cases that leave the field empty:
      the same assessor, an ungrounded review and an old hash
      (assessment.rs:376-404).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Both conditions are cheap to meet without an independent review.
      Identity is the self-declared `assessor.name` (assessment.rs:240-245),
      which docs/design/thresholds.md:62-70 records as unchecked. Grounding
      needs only one cited path that the subject shares or the subject's own
      path (assessment.rs:253-270). The review's own `uncited` list is
      computed but not read here, an open item (M8,
      docs/design/meta-standards-review.md:167). Route: the crate's own
      assessor writes an assessment-quality file under another name, with four
      `pass` verdicts, one of which mentions
      portal/assessments/crate-design/crate/<name>.yaml. That makes
      `reviewIndependent == 'pass'`.
    suggestion: >-
      In `link_reviews`, count only a review that has a verdict for every
      assessment-quality criterion and an empty `uncited`, and ground each
      `supported` reason in a source the assessment cites, not just one. Also
      compare commit identity where it differs, for example the
      `Co-authored-by` trailer or the cloud agent id of the commit that added
      the review.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix gives the brief command for the assessment entity, whose id
      `assessment:<rubric>/<entity>` matches the Assessment map
      (portal/standards/assessments.yaml:120-122). It states the grounding
      condition ("cite the assessment file or the sources it cites") and that
      the reviewer must be someone else. The evidence says which half is
      missing (crates.yaml:436-440). A second assessor who follows it and
      finds the assessment sound passes. Acting on a failing review changes
      the assessment's hash, which makes the review stale and calls for a new
      one. The fix's "act on what that review fails" implies this without
      saying it.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Gold for a second assessor's grounded, passing review is in the review-*
      row of docs/design/thresholds.md:55. Point 2 of
      D01M831P5QWJQ4A2FT85N5MXJQF justifies it: one of three assessment
      reviews was self-review (docs/design/meta-standards-review.md:86), which
      the rationale repeats (crates.yaml:446-450).
summary: >-
  Fails on hard-to-game only. The rule measures the right thing and closes
  the self-review route that D01M831P5QWJQ4A2FT85N5MXJQF found. Its
  independence still rests on a self-chosen name, and a renamed reviewer
  needs to cite the assessment file only once. Like every fresh-gated rule
  on this card, it also inherits the crate hash's blind spot for non-Rust
  sources.
