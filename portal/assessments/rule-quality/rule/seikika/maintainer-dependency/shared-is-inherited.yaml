apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-dependency/shared-is-inherited
rubric: rule-quality
subjectHash: 394461f0e83f
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rule's point is that members inherit one requirement, so theirs
      can't drift (portal/standards/dependencies.yaml:114-120). But
      `inherited` only checks that the name is a key under
      `[workspace.dependencies]` in the root Cargo.toml
      (crates/seikika-connector-workspace/src/deps.rs:43-44, 59, 70-88). It
      doesn't check that members write `workspace = true`. regex, the live
      failure, would pass with one root line while seikika-cli,
      seikika-connect, seikika-connector-runner and
      seikika-connector-workspace each keep `regex = "1"`
      (crates/seikika-cli/Cargo.toml:20 and the others). The line parser also
      misses a `[workspace.dependencies.foo]` subtable, and a renamed key,
      since records use the package name (deps.rs:27).
    suggestion: >-
      Read each member's Cargo.toml (or cargo metadata's raw manifest) and set
      `inherited` only when every member that names the dependency uses
      `workspace = true`. Parse the root manifest with a TOML parser rather
      than by lines. Add a fixture where the workspace declares the crate but
      a member doesn't inherit it.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Adding `regex = "1"` to the root `[workspace.dependencies]` and leaving
      the four members untouched passes (deps.rs:70-88). That is one line
      instead of five, and it leaves the drift the rationale warns about. The
      fixtures can't tell the two apart, because `inherited` is hand-set
      (portal/fixtures/workspace.ndjson, `dependency:cargo:focused`).
    suggestion: >-
      Same connector change as above, so the field means "every user inherits"
      rather than "the workspace mentions it".
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `usedBy`, the crates that declare it
      (dependencies.yaml:113; pinned as `['a', 'b']` at
      portal/tests/standards.test.yaml:437-445). The fix says to declare it
      once in `[workspace.dependencies]` and inherit it
      (dependencies.yaml:114-116). Doing both passes. Doing only the first
      half also passes, as above.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The only number is "more than one crate", which follows from the
      definition of shared. docs/design/dependency-standards.md:20 sets it at
      gold. The rationale's argument that drift leads to duplicate versions
      makes it the step above silver's one-version
      (dependencies.yaml:118-120). The Cargo inheritance link documents the
      mechanism.
summary: >-
  The right gold rule, with a clear fix, but its field asks a weaker
  question than its rationale. It sees that the workspace declares the
  crate, not that members inherit it, so one root line passes regex while
  four members keep their own requirement. Reading member manifests would
  close that.
