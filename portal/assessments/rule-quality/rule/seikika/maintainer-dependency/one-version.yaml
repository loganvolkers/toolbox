apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-dependency/one-version
rubric: rule-quality
subjectHash: badb68957b64
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `versions` holds every Cargo.lock package of that name
      (crates/seikika-connector-workspace/src/deps.rs:90-114), so `size() ==
      1` is what the name and fix say: the lockfile resolves the crate to one
      version. cargo-deny's `multiple-versions` ban, cited in the rationale
      (portal/standards/dependencies.yaml:106-109), measures the same thing.
      One caveat: the rationale's "both compiled into the binary" doesn't hold
      for the one live failure. syn 2 comes in only through proc-macro crates
      (sqlx-macros-core, tracing-attributes, prost-derive in Cargo.lock),
      which compile for the host, so the cost is build time.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Cargo.lock is generated, so `versions` can't be shortened by hand: the
      connector collects every lockfile version of the name
      (crates/seikika-connector-workspace/src/deps.rs:90-114). The only ways
      to pass are to unify the versions or to drop a dependency, which is
      exactly what the rule asks for. The check is a bare
      `entity.versions.size() == 1` (portal/standards/dependencies.yaml: 100),
      so there is no exemption list to add a name to.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix offers two moves: move the direct requirement onto the newer
      release, or drop what pulls in the other one
      (dependencies.yaml:102-105). For the only live failure, syn (2.0.119 and
      3.0.10, portal/results.json), neither works. We already require the
      newer `^3` (crates/seikika-connector-workspace/Cargo.toml:17). syn 2 is
      pulled by sqlx-macros-core, tracing-attributes and prost-derive, and syn
      3 by serde_derive and tokio-macros (Cargo.lock), so dropping syn
      wouldn't remove either copy. The evidence lists only versions
      (dependencies.yaml:101), not who pulls each one in.
    suggestion: >-
      Put each version's dependents in the evidence (they are in Cargo.lock's
      `dependencies` lists). Name `cargo tree -i syn@2` in the fix, and say
      what to do when the duplicate is entirely transitive: wait for the
      upstream, or record a reviewed exemption (the analogue of cargo-deny's
      `skip`).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The bar is "exactly one", with no tuning.
      docs/design/dependency-standards.md:19 puts it at silver together with
      `locked`, and :33 explains why transitive duplicates show up on the
      direct crate. The cargo-deny comparison is sourced at
      dependency-standards.md:99-100.
summary: >-
  A faithful lockfile check that can't be gamed, with a sourced silver
  level. Its fix doesn't fit the one live case: syn's duplicate is
  entirely transitive, with proc-macros on both majors, so neither
  suggested move clears it. The evidence also doesn't say who pulls each
  version in.
