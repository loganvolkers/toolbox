apiVersion: seikika.com/assessment/v1
entity: rule:seikika/vs-backstage-agent-surface/mcp-by-default
rubric: rule-quality
subjectHash: 63ab125b461c
assessor: {kind: agent, name: cursor-assessor-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The rationale is that an add-on MCP leaves each adopter to install and
      secure it (portal/standards/backstage-comparison.yaml:822-825), and the
      fact records exactly that: Seikika's `serve` hosts /mcp and `seikika
      mcp` bridges stdio (experiments/backstage-compare/facts.yaml:55-59),
      while Backstage's create-app 0.9.4 installs plugin-mcp-actions-backend
      (facts.yaml:147-149).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `mcpByDefault` is a hand-written boolean in facts.yaml that
      snapshot.py:85 copies over the measured facts, so flipping `value:` is a
      one-line pass. The harness already proves the fact: surface.py:164-166
      asserts a 200 `tools/list` on the default install, but that result does
      not feed this field.
    suggestion: >-
      Drop `mcpByDefault` from facts.yaml and have surface.py set it from the
      authenticated `tools/list` probe on each arm's shipped config (true when
      it returns at least one tool), so only a running product can pass.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names both endpoints that make the fact true, /mcp from `seikika
      serve` (crates/seikika-api/src/mcp.rs:999-1023, `handle`) and stdio from
      `seikika mcp`; restoring either after a regression restores the fact.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      A boolean with no threshold, pre-registered as "true" in
      experiments/backstage-compare/README.md:52 and confirmed in
      ADJUDICATION.md:113. Bronze is the only level of this comparative card
      (D01M857ZB468ZM2YS6GNSEG6YB9), and the rule is parity by design.
summary: >-
  A clear parity rule that states a real adoption cost, but its fact is
  asserted in facts.yaml rather than probed, although surface.py already
  makes the probe that would prove it. Wiring that probe into the field
  would make it as trustworthy as the size rules beside it.
