apiVersion: seikika.com/assessment/v1
entity: rule:seikika/vs-backstage-supply-chain/packages
rubric: rule-quality
subjectHash: 14ca61566503
assessor: {kind: agent, name: cursor-assessor-17, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      Seikika's 605 is everything it ships: Cargo.lock entries that have a
      `source` (388), the Go modules built into OpenFGA (142, from `go version
      -m`) and the UI's npm lockfile (75) (footprint.py:84-108, 163;
      RESULTS.md:188). Backstage's 2,791 is its yarn.lock resolutions
      (footprint.py:104-108). Both counts include development dependencies,
      which is what an adopter's lockfile scanner sees. That matches the
      rationale, "code an adopter runs, scans and updates"
      (portal/standards/backstage-comparison.yaml:598-601). The adjudication's
      earlier objection, that only Cargo.lock was counted
      (ADJUDICATION.md:206), was fixed in round 3.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      cargo_packages() counts only lock entries with a `source` line
      (footprint.py:84-88). Vendoring a dependency as a workspace path crate,
      for example with `cargo vendor` or a copy under crates/, removes it from
      the       count while the adopter still runs and patches it. That is
      cheaper than removing the dependency, and it makes supply-chain risk
      worse, not better.
    suggestion: >-
      Count vendored code as well: treat workspace members not authored here
      (no `seikika-` prefix, or a vendored/ path) as third-party, or count
      crates by `cargo metadata` origin rather than by whether the lock entry
      has a `source` line.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix says to list dependencies with `cargo tree -e normal` and drop
      or feature-gate them in Cargo.toml (backstage-comparison.yaml:596-597).
      But `-e normal` hides the dev and build dependencies that Cargo.lock,
      and so the count, includes (footprint.py:86, "dev dependencies too").
      The fix also ignores the 217 packages that come from OpenFGA's Go
      modules and the UI's npm lockfile (RESULTS.md:188).
    suggestion: >-
      Point the fix at what footprint.py counts: "List third-party entries in
      Cargo.lock (`cargo tree -e all --workspace`), ui/package-lock.json and
      `go version -m` on the OpenFGA binary, and drop the heaviest subtrees.
      Then rerun footprint.py."
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      The bar of 1,000 packages has no source. The pre-registered README sets
      no package bar (experiments/backstage-compare/README.md:46 sets only
      "high = 0"), and RESULTS.md:261-265 lists it among the bars written
      after the smoke rounds. RESEARCH.md F8 sets a comparative bar only
      (Seikika ≤ Backstage, RESEARCH.md:64).
    suggestion: >-
      Justify 1,000 (for example as a review budget in
      docs/design/thresholds.md), or score only the comparative value.
summary: >-
  A fair count over everything Seikika ships, which round 3 fixed.
  Vendoring a dependency into the workspace hides it from the count. The
  fix's `cargo tree -e normal` lists a different set from the one counted
  and misses the Go and npm packages, and the bar of 1,000 was set after
  the smoke rounds.
