apiVersion: seikika.com/assessment/v1
entity: rule:seikika/vs-backstage-supply-chain/provenance
rubric: rule-quality
subjectHash: 239544528f32
assessor: {kind: agent, name: cursor-assessor-17, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The field is "percent of its release artifacts with verifiable
      provenance" (portal/standards/backstage-comparison.yaml:69-71), but
      footprint.py:58-61 selects only the release assets that match
      `x86_64-unknown-linux-gnu.tar.xz`. dist-workspace.toml:13 builds five
      targets plus shell and PowerShell installers (:11), and the image is
      attested separately (.github/workflows/image.yml:74). An unattested
      macOS, Windows or aarch64 archive, or installer, would leave the
      measured 100% unchanged. Backstage is scored on the latest npm version
      of five packages (footprint.py:141-149), not the versions it installs.
    suggestion: >-
      Verify every asset of the release (`gh release view --json assets`, with
      no target filter) and the image digest with `gh attestation verify`. For
      Backstage, check the versions in its yarn.lock.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Provenance is checked cryptographically: `gh attestation verify <file>
      -R seikika/seikika` per archive (footprint.py:75-78). The attestation
      must be signed through the repository's OIDC identity in its workflow,
      so it can't be produced by hand. The cheapest pass is keeping
      `github-attestations = true` (dist-workspace.toml:20-21), which is the
      intent.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix says "Attest every artifact in .github/workflows/release.yml"
      (backstage-comparison.yaml:645-646). That file must stay the bytes
      `dist` generates, and `dist plan` fails if it's hand-edited (D98). The
      setting that attests artifacts is `github-attestations = true` in
      dist-workspace.toml:20-21, with the image attested in
      .github/workflows/image.yml. An agent who followed the fix literally
      would break the release check.
    suggestion: >-
      Change the place to "dist-workspace.toml (`github-attestations`), then
      `dist generate`; the image's attest step is in
      .github/workflows/image.yml". Keep `gh attestation verify` as the check.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      100% was registered before the run
      (experiments/backstage-compare/README.md:47) and confirmed by the
      adjudication (ADJUDICATION.md:110). The rule links the SLSA build track
      (backstage-comparison.yaml:651-653), and D90 makes attested distribution
      the policy.
summary: >-
  The bar is right and can't be faked, but the measure and the fix need
  correcting. Only one of five targets' archives is verified, so "100%" is
  narrower than it reads. The fix sends agents to edit release.yml, which
  D98 reserves for `dist`.
