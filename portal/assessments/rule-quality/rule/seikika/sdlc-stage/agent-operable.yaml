apiVersion: seikika.com/assessment/v1
entity: rule:seikika/sdlc-stage/agent-operable
rubric: rule-quality
subjectHash: cb9ea2ac766a
assessor: {kind: agent, name: cursor-assessor-13, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      A command resolves when its first word is one of 20 known programs or a
      path that exists (crates/seikika-connector-workspace/src/data.rs:
      108-145). The arguments are never looked at. `bash
      scripts/never-written.sh` and `python3 scripts/gone.py` resolve because
      `bash` and `python3` are known, yet the rationale names "a script that
      was never written" as what the rule catches
      (portal/standards/sdlc.yaml:217-219). `make` passes with no Makefile,
      and `seikika no-such-command` passes too. All live commands do resolve
      today: no stage uses an interpreter with a missing script.
    suggestion: >-
      When the program is an interpreter (`bash`, `python`, `python3`, `node`,
      `npx`) or `make`, also resolve its first path-like argument, or the
      Makefile. For `seikika`, check the subcommand against `seikika
      describe`'s command records.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `commands: ["seikika --help"]` or `["git status"]` passes silver for any
      stage. That is cheaper than finding the command that carries the stage
      out, and nothing relates the command to the stage's intent or exit
      criterion (sdlc.yaml:206-207). maintainer/plan, with `commands: []`,
      fails today (portal/sdlc/stages/maintainer.yaml); one such line would
      lift it.
    suggestion: >-
      Require at least one listed command to appear in the stage's
      `exitCriterion` or in a listed check, so the command is the gate rather
      than any runnable line.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the stage when `commands:` is empty, or each command
      that runs no known tool or file (sdlc.yaml:208-211). The fix says to
      list a command starting with a known tool or an existing script, and to
      fix or remove each flagged one (sdlc.yaml:212-215). That passes, as with
      the fixture demo-gap/release (portal/tests/standards.test.yaml:
      1051-1052).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. docs/design/thresholds.md:57 gives "commands that resolve" as
      sdlc-stage's silver, the step from declared and documented to runnable
      by an agent that the scorecard rationale describes (sdlc.yaml:150-154).
summary: >-
  The right silver idea, but "resolves" means only that the first word is
  a known program, so an interpreter running a script that doesn't exist
  passes, despite the rationale saying it is caught. Any harmless command
  such as `seikika --help` is enough. The fix and evidence are clear.
