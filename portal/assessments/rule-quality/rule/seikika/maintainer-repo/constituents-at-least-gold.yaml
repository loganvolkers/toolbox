apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-repo/constituents-at-least-gold
rubric: rule-quality
subjectHash: 10904522b52b
assessor: {kind: agent, name: cursor-assessor-13, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Two constituents can never reach rank 3. maintainer-docs has `levels:
      [bronze, silver]` (portal/standards/docs.yaml:97) and
      maintainer-action-deps has `levels: [bronze]`
      (packages/github-actions/fragments/github-actions.yaml:552), and both
      are in portal/seikika.yaml:30-43. So this rule fails on the live
      repository whatever its quality: 6 evidence lines in
      portal/results.json, two of them these permanently short cards. On the
      fixtures it passes only because repo:acme/focused watches the gold
      plugin card alone (portal/fixtures/workspace.ndjson:59). A watched name
      with no summary still drops out of `cards`
      (crates/seikika-derive/src/lib.rs:930-934), so gold is also reachable
      vacuously.
    suggestion: >-
      Bind each card's top rank next to `rank` in `constituent_summaries`
      (lib.rs:1174-1192) and check `cards.all(c, c.rank >= 3 || c.rank ==
      c.top)`, and require `cards.size() == entity.watch.size()`.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      For maintainer-docs and maintainer-action-deps, the only way to pass is
      to delete them from `repoRollup`. Deleting all six lagging names (adding
      maintainer-docs and maintainer-package to the four that fail silver) is
      one edit to portal/seikika.yaml with no decision. The ratchet reads the
      result as gold and an improvement.
    suggestion: >-
      Make a `repoRollup` removal a ratchet regression unless accepted, and
      remove the structural cap so that work on the cards is the only way to
      pass.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix is "Raise each constituent in the evidence to gold"
      (portal/standards/repository.yaml:180). The evidence names
      maintainer-docs and maintainer-action-deps, which have no gold rung.
      Unlike the silver rule, the fix doesn't even warn about the cap, so an
      agent following it would look for a gold rule in docs.yaml that doesn't
      exist.
    suggestion: >-
      Once the cap is fixed, keep this fix. Until then, name the capped cards'
      options: add a gold rung, or remove the card from `policy.repoRollup`
      with a decision.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Gold as "every counted scorecard reaches gold" is D86
      (D01M7WMSMS50000000000000000) and docs/design/repo-level.md:19-24. It is
      the definition of the level, not a chosen number.
summary: >-
  Unreachable as configured. maintainer-docs stops at silver and
  maintainer-action-deps at bronze, so no work on the repository can
  satisfy "every constituent at gold". Its fix sends an agent looking for
  gold rules that don't exist. Only the single-card fixture reaches it,
  and a misspelt watched name reaches it vacuously.
