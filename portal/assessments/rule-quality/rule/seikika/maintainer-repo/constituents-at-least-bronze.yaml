apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-repo/constituents-at-least-bronze
rubric: rule-quality
subjectHash: 14f515f5fc47
assessor: {kind: agent, name: cursor-assessor-13, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `cards` holds only the watched scorecards that have a counted entity and
      a rule that isn't unknown (crates/seikika-derive/src/lib.rs:930-934,
      1183-1188). A name in `watch` or `policy.repoRollup` that matches no
      scorecard drops out without a trace, and `cards.all(...)` over the
      remaining list still passes. Nothing checks those names: no code reads
      `repoRollup` apart from the report JSON (crates/seikika-cli/src/
      report.rs:1391). I tested this on a scratch copy of portal/. With
      repo:acme/unsafe watching `maintainer-supply-chian` instead of
      `maintainer-supply-chain`, the repository scored gold and the standards
      test at portal/tests/standards.test.yaml:782-792 failed. If a
      constituent is renamed, the rule keeps saying "every counted scorecard
      reaches bronze" while one of them is no longer counted. Every card's
      ladder has a rung 1, so the rank comparison itself is sound here.
    suggestion: >-
      Bind the number of watched names next to `cards` (or emit a placeholder
      entry with rank 0 and level `unscored` for a watched name with no
      summary), and add `cards.size() == entity.watch.size()` to the check,
      with the missing names in the evidence. Have `seikika validate` reject a
      `repoRollup` entry that names no scorecard.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      When a constituent drops to none, the cheapest way back to bronze is to
      delete its name from `policy.repoRollup`. That is one line in
      portal/seikika.yaml:30-43, needs no decision, and the ratchet reads it
      as an improvement, since the repository level rises. D86
      (D01M7WMSMS50000000000000000) says the constituents are declared there,
      but nothing guards the list. A misspelt name, as tested above, has the
      same effect. Today the live repository passes, with every constituent at
      least bronze (portal/results.json).
    suggestion: >-
      Record the constituents in the baseline and have the ratchet treat a
      removal from `repoRollup` as a regression unless it is accepted with
      `--accept`, or require a waiver-style decision id beside each exclusion.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `<card> is <level>` for each constituent below rank 1
      (portal/standards/repository.yaml:159). The fix says to raise each of
      them to bronze (repository.yaml:160-162). Every card in the rollup has a
      bronze rung, including the one-level maintainer-action-deps
      (packages/github-actions/fragments/github-actions.yaml:552). So raising
      the named card with its own fixes makes this rule pass, as the acme/
      unsafe fixture shows when its supply-chain card reaches bronze.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      D86 (D01M7WMSMS50000000000000000) and docs/design/repo-level.md:13-24
      define the repository's level as its lowest constituent, so bronze means
      every counted card has reached its own bronze rung. The level is the
      definition itself, not a tuned number.
summary: >-
  A sound floor with one hole. Bronze is meaningful for every constituent
  and its fix works. But a watched card that is renamed, misspelt or
  unscored drops out of `cards` without a trace, and I reproduced a
  fixture repository going from none to gold that way. Deleting a lagging
  card from `repoRollup` is an unguarded one-line way to pass.
