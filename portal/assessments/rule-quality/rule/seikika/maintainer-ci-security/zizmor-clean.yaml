apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-ci-security/zizmor-clean
rubric: rule-quality
subjectHash: 558a3221c70d
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale says each finding is fixed or ignored "with a written
      reason" (packages/github-actions/fragments/github-actions.yaml
      :317-321), and the card's rationale says gold "leaves nothing zizmor
      flags unexplained" (:185-186). The check only asks that zizmor's SARIF
      has no result other than unpinned-uses (:308-309). An ignored finding
      isn't in that SARIF (on a scratch workflow the ignored result vanished,
      with no `suppressions` entry for
      crates/seikika-connector-runner/src/lint.rs :167-169 to read), so a bare
      `# zizmor: ignore[x]` passes as well as one with a reason like
      .github/workflows/ci.yml:108.
    suggestion: >-
      Have the workspace connector list inline `zizmor: ignore[...]` comments
      and zizmor.yml ignores per workflow, each with the text after it, and
      add to this rule's check that every ignore has a reason (some text after
      the closing bracket).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      For a low finding such as `self-repository` or an informational one, the
      cheapest pass is a 30-character ignore comment, with no review and no
      entry in portal/waivers.yaml (whose waivers each cite a decision,
      waivers.yaml:1-2). Resolving the finding costs more, and the gold level
      reads the same either way.
    suggestion: >-
      The reason check above makes a bare ignore fail; together with evidence
      listing the ignores, a reviewer sees every trade-off.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix says "resolve or explicitly ignore (with a reason)" but gives
      neither the command (no-high-findings gives one,
      github-actions.yaml:223-225) nor the ignore syntax, and it speaks of
      "low and informational" findings while the check counts every severity.
      On release.yml, where high and medium findings are waived for the lower
      rules (portal/waivers.yaml:4-27), this rule's evidence lists those high
      findings under a fix that doesn't mention them. The rule has no links
      (brief: links 0).
    suggestion: >-
      Write the fix as "Fix or ignore each finding in the evidence (`zizmor
      --offline .github/workflows actions`); to ignore one, add `# zizmor:
      ignore[<audit>] <reason>` to its line", and link
      https://docs.zizmor.sh/usage/#ignoring-results.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Gold matches D70 ("then zizmor-clean") and
      docs/design/thresholds.md:24-25: low and informational findings aren't
      implied by the bronze and silver zizmor rules, and its rationale calls
      it polish beyond the direct risks.
summary: >-
  The right gold idea: every zizmor finding fixed or explained. But "with
  a reason" isn't measured: a bare inline ignore removes the finding from
  zizmor's output, so the cheapest gold is a comment. The fix lacks the
  command and the ignore syntax, and the rule has no tests or links.
