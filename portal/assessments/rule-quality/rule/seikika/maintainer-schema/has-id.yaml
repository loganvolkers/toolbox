apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-schema/has-id
rubric: rule-quality
subjectHash: 70cbfd7fa503
assessor: {kind: agent, name: cursor-assessor-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The fix and name ask for an absolute https `$id`
      (portal/standards/schemas.yaml:76-78), and the check,
      `schemaId.startsWith('https://')` (:74) on the trimmed `$id`
      (crates/seikika-connector-workspace/src/specs.rs:29), tests exactly
      that. The JSON Schema core text cited in
      docs/design/schema-standards.md:32 asks for an absolute base URI. All
      four live documents carry one under seikika.com.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A scratch schema with `"$id": "https://x"`, run through
      target/debug/seikika-connector-workspace, passed. A placeholder is the
      cheapest pass, and nothing checks that ids are unique across documents
      or follow one scheme. The live ids already differ in shape:
      crates/seikika-model/schema/assessment.schema.json uses
      `https://seikika.com/schema/assessment.schema.json`, while the other
      three use `https://seikika.com/schemas/<name>/v1...json`.
    suggestion: >-
      Require the id to sit under the project's namespace with a version
      segment (e.g. `^https://seikika\.dev/schemas/[a-z-]+/v[0-9a-z]+\.json$`)
      and to be unique among the catalogued schemas.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence shows the current `$id`, or "no $id" (schemas.yaml:75,
      pinned for schema/demo/unsafe in
      portal/tests/standards.test.yaml:606-607). The fix says to set an
      absolute https URI, which passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      A yes/no rule. Bronze is D77's "an absolute `https` `$id`"
      (docs/decisions/D01M7W5BEAG0000000000000000.md).
summary: >-
  The check matches the fix and the spec, but any `https://` string
  passes, including a placeholder. The live ids don't share one scheme
  (assessment's lacks the `/schemas/<name>/v1` form), and the rule can't
  see that. Evidence, fix and level are fine; a namespace-and-version
  pattern plus uniqueness would make the identity stable.
