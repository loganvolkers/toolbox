apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-crate/fully-documented
rubric: rule-quality
subjectHash: 495fe1928edc
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Gold claims "no public item has to be read in source to be used"
      (portal/standards/crates.yaml:297-299), and the fix says "every item".
      But the connector counts only `pub` structs, enums, traits, type
      aliases, consts, statics, free functions and inherent methods
      (crates/seikika-connector-workspace/src/rust.rs:293-304, 342-347). It
      skips pub fields, enum variants, `pub mod`, trait method declarations
      and exported macros, which are exactly what a caller reads. On a scratch
      crate, `pub struct S { pub undocumented_field: u8 }` listed only `S`. It
      also treats `#[doc(hidden)]` as documented, because any `doc` attribute
      counts (rust.rs:40-42), so 100% can include items that rustdoc hides.
      rustc's `missing_docs` lint checks this exact property, including fields
      and variants.
    suggestion: >-
      Count fields, variants, trait items and `pub mod`, and don't treat
      `#[doc(hidden)]` as a doc. Better: run rustc's `missing_docs` lint
      through the runner (`RUSTFLAGS=-Wmissing-docs cargo check`), which sees
      only reachable items, and read its warnings as the evidence.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      An empty `///` passes: on the scratch crate, `/// \n pub struct
      EmptyDoc;` was counted as documented, and `#[doc(hidden)]` was too. At
      100% the gap between gaming and doing it right is largest:
      seikika-connect has 18 undocumented items (portal/results.json), each
      closable with a blank `///`.
    suggestion: >-
      Have the connector require a non-empty first doc line (at least a few
      words), and add a fixture item whose only doc is an empty `///`, with a
      test expecting it in `undocumented`.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `entity.undocumented`, each entry `path (file:line)`
      (rust.rs:119-124; for example `FieldChange (src/plan.rs:11)` in
      portal/fixtures/workspace.ndjson). The fix is to document every item
      listed (crates.yaml:296). Doing that makes `pubDocumented` equal
      `pubItems`, so `docCoverage` (crates.yaml:93-97) reaches 100.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      100% is "all", not a tuned number. The gold placement is argued in the
      rationale (crates.yaml:297-299) and matches the linked Rust API
      Guidelines (crates.yaml:300-302) and v0's gold column in
      docs/design/seikika-for-seikika.md:103. Eight of 17 crates are there
      today (brief facts: live pass 8), so it is reachable.
summary: >-
  Right goal at the right level, with precise evidence. But "every item"
  measures only some public items: it skips fields, variants and modules,
  counts `#[doc(hidden)]` as documented, and passes an empty `///`.
  rustc's `missing_docs` already measures this property more completely,
  and using it would fit AGENTS.md's ask to prefer an existing tool.
