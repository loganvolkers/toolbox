entity: rule:seikika/maintainer-crate/simple-functions
rubric: rule-quality
subjectHash: ba79bbdf5846
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Gold's rationale is "few enough paths that each can be tested"
      (portal/standards/crates.yaml:322-325), but the counter ignores `?` and
      `let ... else` (crates/seikika-connector-workspace/src/rust.rs:74-92).
      At 15 that decides outcomes. Four live functions sit exactly at 15 and
      pass: seikika-connector-git-files' GitFiles::handle (src/main.rs:312),
      seikika-connector-runner's Runner::execute, seikika-exec's Ci::recheck
      and seikika-connect's conformance `run`. GitFiles::handle has five `?`
      (src/main.rs:327, 337, 342, 352, 367), each an error path a test could
      cover, so a count that included them would be 20.
    suggestion: >-
      Count `?` and `let ... else` as branches, and add a fixture function at
      14 plus two `?` that fails. Or take clippy's `cognitive_complexity` from
      the runner, with the gold bound in `clippy.toml`.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      There is no suppression to add: the connector ignores `#[allow]`. A
      rename leaves the count unchanged (rust.rs:157-165). Getting from 17 to
      15 by extracting a helper is the intended fix (crates.yaml:318-321).
      Rewriting two `if`s as `?` also gets there without removing a path, but
      that is idiomatic Rust, not an empty change. Four crates peak at exactly
      15, which may mean code is being fitted to the bound; it is not evidence
      of gaming.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists each function over 15 with file:line and its count
      (`complexFunctions`, crates.yaml:104-109). The fix gives the bound and
      says to simplify them. It doesn't say what is counted, which is written
      only in docs/design/seikika-for-seikika.md:240-241, but extracting
      branches into named helpers reliably lowers the count. So the six
      failing crates (brief facts: live fail 6) have what they need.
  - criterion: threshold-justified
    verdict: unsure
    reason: >-
      15 is stated as v0's gold in docs/design/seikika-for-seikika.md:103 with
      no reason, and docs/design/thresholds.md has no row for it. The rule
      links NIST SP 500-235 (crates.yaml:326-328), the usual source for
      McCabe's limit of 10, which is commonly cited as allowing up to 15 for
      strong teams. Only the landing page was readable in this session (the
      report is a PDF), so whether it actually supports 15 is unverified.
    suggestion: >-
      Quote the NIST passage that supports 15, with its section, in a
      thresholds.md row, or label 15 as chosen. Also note that the counter
      omits `?`, which NIST's method would count as a decision.
summary: >-
  A well-placed gold rule with precise evidence, but at 15 the counter's
  blind spot for `?` and `let ... else` decides outcomes: four functions
  sit exactly on the bound, one with five uncounted error paths. 15 may be
  NIST's upper limit, but neither the rule nor thresholds.md says so, and
  the source couldn't be read here.
