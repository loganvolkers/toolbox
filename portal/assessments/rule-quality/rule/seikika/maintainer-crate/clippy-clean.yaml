apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-crate/clippy-clean
rubric: rule-quality
subjectHash: 39772810b713
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The runner job runs `cargo clippy -q -p {crate} --all-targets
      --message-format=json` (portal/seikika.yaml:271-281). parse_clippy
      counts only compiler messages whose `manifest_path` is this crate's own,
      and returns `pass` only with zero warnings and zero errors and a
      successful run (crates/seikika-connector-runner/src/main.rs:117-160).
      The lint set is the workspace's `clippy::all = warn` (Cargo.toml:59-60),
      the same set CI fails on with `-D warnings`
      (.github/workflows/ci.yml:23). So `pass` means what the name says. In
      the ratchet's own run the runner is skipped, so all 17 crates read
      `unknown` (portal/results.json) and CI's clippy step does the gating.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A suppression passes. `#[allow(clippy::...)]` on an item, or
      `#![allow(clippy::all)]` at the crate root, silences the warning for
      both this rule and CI's `-D warnings`, and nothing counts allow
      attributes. Two live today: `#[allow(clippy::too_many_arguments)]` at
      crates/seikika-exec/src/executor/change.rs:340 and
      crates/seikika-exec/src/run.rs:447, neither with a reason. For a warning
      that is awkward to fix, an allow is the cheapest pass.
    suggestion: >-
      Add `allow_attributes_without_reason = "warn"` to
      `[workspace.lints.clippy]`, so every suppression must carry `reason =
      "..."`, and prefer `#[expect(...)]`, which warns once the lint no longer
      fires. Or have the workspace connector count `allow(clippy::`
      attributes, and add a rule that lists those without a reason.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is clippy's own messages as `file:line lint message`
      (runner main.rs:131-145; the fixture pins `src/main.rs:12
      clippy::needless_return ...` in portal/tests/standards.test.yaml:82-88).
      The fix names the command that reproduces them
      (portal/standards/crates.yaml:240-242). Two gaps, neither common:
      messages are capped at 20 (main.rs:131), and when clippy can't run
      (status `error` with no compiler errors) the reason is stored in
      `clippy.output` (main.rs:157-159), which the evidence doesn't read. Even
      so, rerunning the named command shows the remaining warnings.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number: zero warnings. Bronze is justified in the rule's
      rationale (crates.yaml:243-246): CI already fails on any warning
      (.github/workflows/ci.yml:23), so a crate below this bar can't merge. It
      sits in the floor next to has-tests and tests-pass, which
      docs/design/seikika-for-seikika.md:103 lists as v0's bronze.
summary: >-
  A faithful mirror of CI's clippy gate, with a reproducible command and
  precise evidence. It never decides in the ratchet itself, because the
  runner is skipped there. Its weakness is suppressions: an allow passes
  both this rule and CI, and two unexplained `too_many_arguments` allows
  sit in seikika-exec today.
