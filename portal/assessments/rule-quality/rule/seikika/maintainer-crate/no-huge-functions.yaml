apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-crate/no-huge-functions
rubric: rule-quality
subjectHash: 11dfca6a57dd
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      A function's `lines` is its syn span from first to last token
      (crates/seikika-connector-workspace/src/rust.rs:70-72, 160-165). For an
      item, that span starts at its outer attributes, and `///` comments are
      attributes. So doc comments, `#[allow]`s, blank lines and inner comments
      all count as "lines of function". seikika-exec's change_run is reported
      at src/executor/change.rs:337, its first `///` line; `fn` is at 341,
      after three doc lines and an attribute. On a scratch crate, a 73-line
      function with 12 `///` lines reported 85. Clippy's `too_many_lines`,
      which the rule links (portal/standards/crates.yaml:273-275), counts only
      the body's code lines. So the measure penalises documentation that the
      same scorecard asks for elsewhere.
    suggestion: >-
      Measure from the opening brace of the body to its closing brace, and
      skip blank and comment-only lines, as clippy does. Set `at` to the `fn`
      line, and add a fixture function whose doc comment would push it over
      the bound if counted.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      For a function just over 150, the cheapest pass is to delete its doc
      comment or squeeze out blank lines. For a private function, deleting its
      docs costs nothing on any other rule, since only `pub` items are counted
      for documentation (rust.rs:114-125). Splitting into named steps is the
      intended fix, but it costs more. The four crates failing today
      (seikika-api, seikika-connect, seikika-derive, seikika-model) are far
      over (up to 472 lines), so for them the shortcut wouldn't work.
    suggestion: >-
      Count code lines of the body only (see above). Deleting comments then
      changes nothing, and the only way under the bound is to shorten the
      code.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists each function over 150 as `name at file:line: N
      lines` (crates.yaml:265-267). Splitting it into named steps
      (crates.yaml:268) brings each piece under the bound, because every
      function is measured separately (rust.rs:160-165). The `at` line points
      at the doc comment rather than at `fn`, but that is next to the
      function.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      150 lines appears in docs/design/seikika-for-seikika.md:89-90 and :103
      ("more than 150 is huge"), with no reason. docs/design/thresholds.md has
      no row for it. The linked clippy lint defaults to 100 body code lines
      (`too-many-lines-threshold`,
      https://doc.rust-lang.org/clippy/lint_configuration.html), and it
      measures differently, so it neither gives 150 nor matches what is
      counted here.
    suggestion: >-
      Add a thresholds.md row. Measure the function-length distribution from
      the workspace records (every function is listed) and pick an outlier
      percentile, or label 150 as chosen and give the reason. Once doc lines
      are no longer counted, revisit the number.
summary: >-
  A useful silver outlier guard with exact evidence and a clear fix. But
  it counts doc comments, attributes and blank lines as function length,
  so documenting a function moves it towards failing, and deleting docs is
  the cheap way back under. 150 has no stated reason, and the clippy lint
  it links uses 100 code lines.
