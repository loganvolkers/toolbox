apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-benchmark/pre-registered
rubric: rule-quality
subjectHash: 1ff88bbcc0de
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The check is `hypotheses.size() == 0` (benchmarks.yaml:166-172), but the
      fix promises "each with a bar written in its README before it ran"
      (benchmarks.yaml:299-300). Three live entries pass without that. spec-ab
      lists `[R7]`, while its README's bar table is S1-S3 and never names R7
      (experiments/spec-ab/README.md:55-61). backstage-compare lists F1-F14,
      which appear only in experiments/backstage-compare/RESEARCH.md, not in
      its readme. security-ab's single hypothesis is the sentence "H1-H5 in
      experiments/security-ab/README.md"
      (portal/benchmarks/security-ab.yaml:10). Nothing compares the README's
      date with `ran`, either.
    suggestion: >-
      Have the connector emit `hypothesesNotInReadme`: hypothesis ids that the
      readme file doesn't contain, read like `not_naming`
      (crates/seikika-connector-workspace/src/data.rs:220-233). Check that it
      is empty, then fix spec-ab (R7 to S1-S3) and backstage-compare (point
      readme at the file holding F1-F14).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Typing any id passes. s4s-fresh-agent fails only because its list is
      empty, so `hypotheses: [H1]` would take it past this rule. That would
      record a bar after the run, which is what the rationale says the rule
      prevents (benchmarks.yaml:301-304, L1 at dx-benchmarks.md:89).
    suggestion: >-
      The README cross-check above. For "before it ran", have the connector
      record the readme's first-commit date from git and fail when it is after
      `ran`.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence "no hypothesis with a pre-registered bar"
      (benchmarks.yaml:171-172) plus the fix's "name the hypotheses ... (§4
      step 5)" leads to filling `hypotheses`, which clears it (fail pinned at
      portal/tests/standards.test.yaml:1238). Writing the README table the fix
      also asks for goes beyond what the check needs.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Silver matches dx-benchmarks.md §6 ("its
      hypotheses", docs/design/dx-benchmarks.md:225), and L1
      (dx-benchmarks.md:89) is the evidence that pre-registration earns its
      keep.
summary: >-
  The intent is the most important one in the scorecard, but the check is
  a non-empty list. spec-ab (R7 against a README bar of S1-S3) and
  backstage-compare (F1-F14 not in its README) pass without their catalog
  hypotheses being pre-registered where the readme points. Cross-checking
  ids against the README, and its date against `ran`, would make the name
  true.
