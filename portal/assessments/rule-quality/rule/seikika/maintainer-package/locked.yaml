apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-package/locked
rubric: rule-quality
subjectHash: c64f631fed9a
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `lockfile` walks from the package directory up to the checkout root and
      returns the first of four lockfile names that exists
      (crates/seikika-connector-workspace/src/npm.rs:113-138). That accepts a
      `package-lock.json` at any ancestor, although npm only uses a parent's
      lockfile for declared workspaces; a nested non-workspace package with a
      root lockfile passes while every install of it re-resolves. The fix
      itself limits the ancestor case to pnpm-lock.yaml / yarn.lock
      (portal/standards/packages.yaml:114-117), and
      docs/design/package-standards.md:95 concedes that the walk does not
      prove the lockfile covers the package.
    suggestion: >-
      Accept an ancestor lockfile only when that ancestor's workspace config
      (package.json `workspaces`, pnpm-workspace.yaml) includes this package,
      and check that the lockfile lists the package's path (`packages` keys in
      package-lock v3, `importers` in pnpm-lock.yaml).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The check is only `is_file()` on a name (npm.rs:125): `touch
      package-lock.json` passes. A scratch package with an empty
      package-lock.json run through target/debug/seikika-connector-workspace
      reported `lockfile: "package-lock.json"`. The connector's own unit test
      uses a `{}` lockfile as the passing case (npm.rs:270). An empty file
      records none of the integrity hashes the fix cites.
    suggestion: >-
      Parse the lockfile and require that it lists at least the manifest's
      direct dependencies (or, for a package with none, that it parses and has
      `lockfileVersion`); emit `lockfileCovers` and check it.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the lockfile name or 'no lockfile beside package.json or
      at the workspace root' (packages.yaml:111-113; pinned for the partial
      fixture at portal/tests/standards.test.yaml:538-540). Running `npm
      install` and committing the package-lock.json beside the manifest, as
      the fix says, makes it pass.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No numeric threshold. Silver is set by D76
      (docs/decisions/D01M7W56B7R0000000000000000.md: "silver is a sibling
      lockfile") and the OpenSSF npm guide the rule links, which asks every
      application to commit a lockfile
      (https://github.com/ossf/package-manager-best-practices/blob/main/published/npm.md,
      "Lockfiles and commands", recommendation 7).
summary: >-
  The standard is right and sourced, but the check proves only that a file
  with a lockfile's name exists somewhere above the manifest. An empty
  file or an unrelated root lockfile passes. Parsing the lockfile for this
  package's entries would make "locked" mean locked.
