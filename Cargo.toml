[workspace]
resolver = "3"
members = ["crates/*"]
# Experiments are standalone crates with their own lockfiles and pinned dependencies.
exclude = ["experiments"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
repository = "https://github.com/loganvolkers/toolbox"
# No `license` field until the project licence is decided (Q1).

[workspace.dependencies]
toolbox-model = { path = "crates/toolbox-model" }
toolbox-expr = { path = "crates/toolbox-expr" }
anyhow = "1"
cel = "0.16"
clap = { version = "4.6", features = ["derive"] }
jsonschema = { version = "0.61", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
