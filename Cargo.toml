[workspace]
resolver = "3"
members = ["crates/*"]
# Experiments are standalone crates with their own lockfiles and pinned dependencies.
exclude = ["experiments"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
repository = "https://github.com/loganvolkers/toolbox"
# No `license` field until the project licence is decided (Q1).

[workspace.dependencies]
toolbox-model = { path = "crates/toolbox-model" }
toolbox-expr = { path = "crates/toolbox-expr" }
toolbox-store = { path = "crates/toolbox-store" }
toolbox-derive = { path = "crates/toolbox-derive" }
anyhow = "1"
cel = "0.16"
clap = { version = "4.6", features = ["derive", "env"] }
jsonschema = { version = "0.61", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "aws_lc_rs"] }
toolbox-authz = { path = "crates/toolbox-authz" }
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util", "net"] }
toolbox-api = { path = "crates/toolbox-api" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
