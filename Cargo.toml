[workspace]
resolver = "3"
members = ["crates/*"]
# Experiments are standalone crates with their own lockfiles and pinned dependencies.
exclude = ["experiments"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
publish = false
repository = "https://github.com/loganvolkers/toolbox"
license = "MIT"

[workspace.dependencies]
toolbox-model = { path = "crates/toolbox-model" }
toolbox-expr = { path = "crates/toolbox-expr" }
toolbox-store = { path = "crates/toolbox-store" }
toolbox-derive = { path = "crates/toolbox-derive" }
anyhow = "1"
cel = "0.16"
clap = { version = "4.6", features = ["derive", "env"] }
jsonschema = { version = "0.61", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
async-trait = "0.1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "aws_lc_rs"] }
toolbox-authz = { path = "crates/toolbox-authz" }
sha2 = "0.11"
walkdir = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util", "io-std", "net", "fs"] }
toolbox-api = { path = "crates/toolbox-api" }
toolbox-secrets = { path = "crates/toolbox-secrets" }
toolbox-telemetry = { path = "crates/toolbox-telemetry" }
# Operational telemetry (D6, plan §6.3): OTel contract + Prometheus /metrics.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-rustls"] }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
prometheus = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "std"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["tracing-log"] }
# The binaries' global allocator: glibc malloc was 38% of the full-recompute profile (docs/research-log.md, *Scale profile*).
mimalloc = { version = "0.1.52", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
