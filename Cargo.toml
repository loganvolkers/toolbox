[workspace]
resolver = "3"
members = ["crates/*"]
# Experiments are standalone crates with their own lockfiles and pinned dependencies.
exclude = ["experiments"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
publish = ["crates-io"]
repository = "https://github.com/seikika/seikika"
license = "MIT"

[workspace.dependencies]
seikika-connect = { path = "crates/seikika-connect", version = "=0.2.1" }
seikika-model = { path = "crates/seikika-model", version = "=0.2.1" }
seikika-expr = { path = "crates/seikika-expr", version = "=0.2.1" }
seikika-store = { path = "crates/seikika-store", version = "=0.2.1" }
seikika-derive = { path = "crates/seikika-derive", version = "=0.2.1" }
seikika-exec = { path = "crates/seikika-exec", version = "=0.2.1" }
cel = "0.16"
clap = { version = "4.6", features = ["derive", "env"] }
jsonschema = { version = "0.63", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
async-trait = "0.1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "aws_lc_rs"] }
seikika-authz = { path = "crates/seikika-authz", version = "=0.2.1" }
sha2 = "0.11"
# Ed25519 for approval grants between portals (seikika-exec::grant); already built for rustls.
aws-lc-rs = "1.19"
walkdir = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "tls-rustls-aws-lc-rs-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util", "io-std", "net", "fs"] }
seikika-api = { path = "crates/seikika-api", version = "=0.2.1" }
seikika-secrets = { path = "crates/seikika-secrets", version = "=0.2.1" }
seikika-telemetry = { path = "crates/seikika-telemetry", version = "=0.2.1" }
# Operational telemetry (D6, plan §6.3): OTel contract + Prometheus /metrics.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "grpc-tonic", "http-proto", "reqwest-rustls"] }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
prometheus = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "std"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["tracing-log"] }
# The binaries' global allocator: glibc malloc was 38% of the full-recompute profile (docs/research-log.md, *Scale profile*).
mimalloc = { version = "0.1.52", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
