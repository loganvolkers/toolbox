<toolbox-report>
<script type="application/json">{"portal":"Toolbox for Toolbox","scorecards":{"cli-skill":{"kind":"Command","levels":["bronze"],"owner":"group:maintainers","rules":{"has-skill":{"check":"entity.documentedIn.filter(p, p.endsWith('SKILL.md')).size() > 0","fix":"Add plugins/toolbox-operator/skills/<slug>/SKILL.md that includes the invocation toolbox <command>, with the flags and the exit codes.","level":"bronze"}}},"maintainer-action-deps":{"kind":"ActionDependency","levels":["bronze"],"owner":"group:maintainers","rules":{"pinned-everywhere":{"check":"entity.pins.all(p, p == 'sha')","fix":"Pin this action to a full commit SHA in every workflow that uses it.","level":"bronze"}}},"maintainer-agent-doc":{"kind":"AgentDoc","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"checks-run-in-ci":{"check":"!entity.canonical || entity.ciMissingCommands.size() == 0","fix":"Run each command in the evidence from a GitHub Actions workflow, or remove it from the check procedure. Commands that appear only in a markdown table are the track index and are not required.","level":"gold"},"has-commands":{"check":"!entity.canonical || entity.commandLines > 0","fix":"Name the build or test command in AGENTS.md (cargo, npm, pnpm, yarn, pytest, or toolbox). An alias inherits the canonical file's commands.","level":"silver"},"links-resolve":{"check":"entity.missingFiles.size() == 0","fix":"Fix or remove the relative links in the evidence. An agent follows them.","level":"bronze"},"names-the-decision-log":{"check":"!entity.canonical || entity.mentionsDecisions","fix":"Link the canonical AGENTS.md at the decision log, so an agent edits the log instead of treating this file as the only source of truth.","level":"gold"},"no-hardcoded-secrets":{"check":"entity.secretHits.size() == 0","fix":"Remove the credential in the evidence. An instruction file is loaded into the agent's prompt.","level":"gold"},"no-hidden-instructions":{"check":"entity.hiddenChars == 0","fix":"Remove zero-width and bidi characters. They are invisible to a reviewer and visible to a model.","level":"gold"},"single-source":{"check":"entity.canonical || entity.pointsAtAgents","fix":"Keep instructions in AGENTS.md. An alias such as CLAUDE.md should link to it, not restate a second set of rules.","level":"bronze"},"within-budget":{"check":"entity.lines <= 500","fix":"Keep the file under 500 lines. Move detail into a linked document. The agents.md v1.1 proposal uses 500 lines as the point where a file should be split.","level":"silver"}}},"maintainer-ci-reliability":{"kind":"Workflow","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"cancels-superseded-runs":{"check":"entity.concurrency || !('pull_request' in entity.triggers)","fix":"Add `concurrency: {group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true}` so a new push cancels the old run.","level":"silver"},"every-job-has-timeout":{"check":"entity.jobsWithoutTimeout.size() == 0","fix":"Set `timeout-minutes` on every job; the default is 360 minutes of a hung runner.","level":"bronze"},"fail-rate-under-10":{"check":"has(entity.runs) && entity.runs.failRate <= 10","fix":"Track failures to their causes: flaky tests, infrastructure, or real breakage merged to main.","level":"silver"},"fail-rate-under-20":{"check":"has(entity.runs) && entity.runs.failRate <= 20","fix":"Find the failing jobs (`toolbox get workflow:<path>` shows run data) and fix or quarantine their causes.","level":"bronze"},"fail-rate-under-5":{"check":"has(entity.runs) && entity.runs.failRate <= 5","fix":"Keep main green: failures should be rare enough that each one gets looked at.","level":"gold"},"fast-feedback":{"check":"has(entity.runs) && entity.runs.p90Seconds <= 900","fix":"Keep the p90 run under 15 minutes: split slow jobs, cache builds, move long suites off the PR path.","level":"gold"},"few-reruns":{"check":"has(entity.runs) && entity.runs.rerunRate <= 5","fix":"Re-runs mean flakiness: find the flaky jobs and fix or isolate them instead of retrying.","level":"silver"},"main-not-stuck-red":{"check":"has(entity.runs) && entity.runs.failingStreak < 3","fix":"Fix main before anything else: a red default branch hides new failures.","level":"bronze"}}},"maintainer-ci-security":{"kind":"Workflow","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"actionlint-clean":{"check":"entity.type == 'action' || entity.actionlint.total == 0","fix":"Fix what actionlint reports (`actionlint` in the repository root).","level":"bronze"},"least-privilege-token":{"check":"entity.type == 'action' || entity.topPermissions || entity.jobsWithoutPermissions.size() == 0","fix":"Declare `permissions:` at the top of the workflow (read-only, e.g. `contents: read`) and grant writes per job.","level":"bronze"},"no-high-findings":{"check":"entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule != 'unpinned-uses').size() == 0","fix":"Fix zizmor's high-severity findings (`zizmor --offline .github/workflows actions`); see https://docs.zizmor.sh/audits/.","level":"bronze"},"no-medium-findings":{"check":"entity.zizmor.counts.medium == 0","fix":"Fix zizmor's medium findings (e.g. `artipacked`: set `persist-credentials: false` on checkout).","level":"silver"},"no-write-tokens-on-risky-triggers":{"check":"entity.riskyTriggers.size() == 0 || entity.jobsWithWrite.size() == 0","fix":"Don't combine pull_request_target/workflow_run/issue_comment with write permissions; split privileged steps into a separate workflow.","level":"silver"},"pinned-to-sha":{"check":"entity.unpinned.size() == 0","fix":"Pin every third-party `uses:` to a full commit SHA (with the tag in a comment), or adopt a workflow lockfile; let Dependabot update them.","level":"bronze"},"zizmor-clean":{"check":"entity.zizmor.total == 0","fix":"Resolve or explicitly ignore (with a reason) zizmor's low and informational findings.","level":"gold"}}},"maintainer-connector":{"kind":"Connector","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"closes-snapshots":{"check":"entity.pushOnly || entity.snapshotComplete","fix":"End every resync kind with snapshot_complete. A push-only connector is exempt: it has no resync.","level":"silver"},"config-documented":{"check":"entity.configDocumented","fix":"Document the configuration in the crate doc: TOOLBOX_CONNECTOR_CONFIG for an in-image connector, or the --toolbox and --listen flags for a remote one.","level":"bronze"},"described":{"check":"entity.descriptionChars > 0 && entity.crateDoc","fix":"Add a Cargo.toml description and a //! crate doc that says what the connector emits.","level":"bronze"},"exercised-in-ci":{"check":"entity.conformanceMentions > 0 || (entity.pushOnly && entity.ciMentions > 0)","fix":"Run toolbox connector test on this binary from CI. A push-only connector has no resync for that kit; an acceptance script must start it instead.","level":"gold"},"has-tests":{"check":"entity.tests >= 1","fix":"Add a unit test that does not need the upstream API: a parser, a record shape, or a capabilities case.","level":"silver"},"names-its-kinds":{"check":"entity.documentedKinds.size() > 0 || entity.genericKinds","fix":"Name each record kind in the source (record or snapshot_complete) or, for a generic runner, document that kinds come from the job config.","level":"silver"},"no-hardcoded-secrets":{"check":"entity.secretHits.size() == 0","fix":"Remove the hardcoded credentials in the evidence. Read tokens from the environment or from TOOLBOX_CONNECTOR_CONFIG.","level":"gold"},"reports-missing-ids":{"check":"entity.pushOnly || entity.reportsNotFound","fix":"A refresh of an unknown external id must send not_found. A push-only connector is exempt: the provider sends deletes.","level":"silver"},"speaks-the-protocol":{"check":"entity.transport == 'stdio' || entity.transport == 'remote' || entity.transport == 'both'","fix":"Serve commands with run_stdio (in-image) or run_remote (long-poll). A connector that does neither is not on the control channel.","level":"bronze"}}},"maintainer-crate":{"kind":"Crate","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"bounded-complexity":{"check":"entity.maxComplexity <= 30","fix":"Simplify the functions in the evidence (extract match arms, early returns).","level":"silver"},"clippy-clean":{"check":"has(entity.clippy) && entity.clippy.status == 'pass'","fix":"Fix the clippy warnings in the evidence (`cargo clippy -p <crate> --all-targets`).","level":"bronze"},"crate-docs":{"check":"entity.crateDoc","fix":"Start the crate's lib.rs or main.rs with //! docs: what it is and which spec section it implements.","level":"bronze"},"few-unwraps":{"check":"entity.unwraps * 100 <= entity.codeLines","fix":"At most one unwrap/expect per 100 lines outside tests: return errors or document the invariant.","level":"gold"},"fully-documented":{"check":"entity.docCoverage == 100","fix":"Document every item in the evidence.","level":"gold"},"has-tests":{"check":"entity.unitTests + entity.integrationTests > 0","fix":"Add a #[test] for the crate's main behaviour, or an integration test in tests/.","level":"bronze"},"no-huge-functions":{"check":"entity.maxFnLines <= 150","fix":"Split the functions in the evidence into named steps.","level":"silver"},"public-api-documented":{"check":"entity.docCoverage >= 80","fix":"Add /// docs to the public items in the evidence.","level":"silver"},"short-functions":{"check":"entity.longFunctions.size() == 0","fix":"Keep functions at 80 lines or fewer; split those in the evidence.","level":"gold"},"simple-functions":{"check":"entity.complexFunctions.size() == 0","fix":"Keep cyclomatic complexity at 15 or lower; simplify those in the evidence.","level":"gold"},"tests-pass":{"check":"has(entity.tests) && entity.tests.status == 'pass'","fix":"Run `cargo test -p <crate>` and fix the failures in the evidence.","level":"bronze"}}},"maintainer-dependency":{"kind":"Dependency","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"from-a-registry":{"check":"!entity.git","fix":"Depend on a crates.io release. A git dependency is not reproducible from the registry and is not reviewed here.","level":"bronze"},"locked":{"check":"entity.versions.size() > 0","fix":"Run cargo generate-lockfile so Cargo.lock records this dependency. The lockfile is what makes the build reproducible.","level":"silver"},"one-version":{"check":"entity.versions.size() == 1","fix":"The lockfile resolves this crate to more than one version. Move the direct requirement onto the newer release, or drop the dependency that pulls the other one in.","level":"silver"},"shared-is-inherited":{"check":"entity.usedBy.size() <= 1 || entity.inherited","fix":"Declare this dependency once in [workspace.dependencies] and inherit it. It is used by more than one crate, so two requirements can drift.","level":"gold"},"version-bounded":{"check":"!entity.wildcard && entity.requirements.size() > 0","fix":"Replace the requirement in the evidence with a caret, tilde or exact version. An empty requirement, *, or a bare >= has no ceiling.","level":"bronze"}}},"maintainer-docs":{"kind":"Doc","levels":["bronze","silver"],"owner":"group:maintainers","rules":{"cited-decisions-exist":{"check":"entity.missingDecisions.size() == 0","fix":"The decision ids in the evidence are not rows of docs/decisions.md. Cite a decision that exists, or add the row.","level":"bronze"},"cites-sources":{"check":"entity.area != 'design' || entity.hasSources","fix":"End the design doc with a ## Sources section (AGENTS.md working rules).","level":"silver"},"links-resolve":{"check":"entity.brokenLinks.size() == 0","fix":"Fix or remove the relative links in the evidence.","level":"bronze"},"names-sdlc-layer":{"check":"entity.counts.sdlc <= entity.counts.layeredSdlc","fix":"Say which SDLC you mean: maintainer, operator or user (docs/sdlc.md, D63).","level":"bronze"},"status-banner":{"check":"entity.area != 'design' || entity.hasStatus","fix":"Start the design doc with a *Status:* line saying what is decided and what is built.","level":"silver"}}},"maintainer-example":{"kind":"Example","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"cites-the-design":{"check":"entity.citesDesign","fix":"Link the write-up at the design doc or the decision it demonstrates, so the example is not a second source of truth.","level":"gold"},"has-a-heading":{"check":"entity.title != ''","fix":"Start the write-up with a level-1 heading that names the example.","level":"bronze"},"links-resolve":{"check":"entity.missingFiles.size() == 0","fix":"Fix or remove the relative links in the evidence. An agent follows them to the files the example depends on.","level":"bronze"},"no-hardcoded-secrets":{"check":"entity.secretHits.size() == 0","fix":"Remove the credential in the evidence. An example is copied and read by agents.","level":"gold"},"says-how-to-check":{"check":"entity.commandLines > 0","fix":"Name the command that checks this example (toolbox, cargo, npm, python, fga, or a ./run script). A reader should be able to reproduce it.","level":"silver"}}},"maintainer-package":{"kind":"PackageJson","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"ci-installs-from-the-lockfile":{"check":"!entity.ciUsesInstall","fix":"Change this package's CI install from npm install to npm ci. npm ci installs the lockfile as written and does not rewrite it.","level":"gold"},"described":{"check":"entity.descriptionChars > 0","fix":"Add a description. npm's package.json document says to put a description in it, so a reader can tell packages apart.","level":"gold"},"engines-declared":{"check":"entity.engines","fix":"Set engines.node to the Node version this package is developed with. That is the field npm documents for the runtime.","level":"gold"},"from-a-registry":{"check":"entity.gitRanges.size() == 0","fix":"Depend on a registry version. The evidence names a git URL or a tarball URL instead of a version the registry serves.","level":"bronze"},"has-a-check":{"check":"entity.checkScripts > 0","fix":"Add a test, build, check or typecheck script. npm's guidance is to keep a smoke test, and this repository runs build and check in CI.","level":"silver"},"locked":{"check":"entity.lockfile != ''","fix":"Commit a lockfile beside package.json. package-lock.json records an integrity hash for every installed package.","level":"silver"},"named":{"check":"entity.name != ''","fix":"Set name in package.json. npm uses it as the package identity, including when the package is private.","level":"bronze"},"no-hardcoded-secrets":{"check":"entity.secretHits.size() == 0","fix":"Remove the credential in the evidence. The manifest is committed and read by the installer.","level":"gold"},"publish-intent":{"check":"entity.private || entity.version != ''","fix":"Set private to true for a package this repository does not publish, or set version before publishing. npm refuses to publish a private package.","level":"bronze"},"version-bounded":{"check":"entity.wildcardRanges.size() == 0","fix":"Replace the ranges in the evidence. A star, x, latest or unbounded minimum can move without a review. Caret and tilde ranges stay bounded.","level":"bronze"}}},"maintainer-plugin":{"kind":"Plugin","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"manifest-valid":{"check":"entity.schemaOk && entity.nameOk && entity.descriptionChars > 0","fix":"Point $schema at the 1.0.0 plugin schema, use a name of 1–64 lowercase letters, digits, dots and hyphens, and write a description.","level":"bronze"},"mcp-declared":{"check":"entity.hasMcp && entity.mcpSchemaOk","fix":"Add mcp.json next to plugin.json with the 1.0.0 mcp schema. A tool that exists only in a vendor config is a harness lock-in.","level":"silver"},"no-hardcoded-secrets":{"check":"entity.secretHits.size() == 0","fix":"Remove the credential in the evidence from plugin.json or mcp.json.","level":"gold"},"no-secret-headers":{"check":"entity.headerSecrets.size() == 0","fix":"Remove the secret in the evidence. MCP authorization is client-managed. Headers must not carry credentials.","level":"gold"},"paths-stay-inside":{"check":"entity.pathEscapes.size() == 0","fix":"Drop the .. segments in the evidence. Plugin paths stay inside the plugin root.","level":"gold"},"portable-components":{"check":"entity.misplacedSkills.size() == 0","fix":"Move each skill to skills/<name>/SKILL.md. Client-specific files go under a reverse-domain directory, not beside the manifest.","level":"bronze"},"stdio-command":{"check":"entity.commandToken","fix":"Set command to one token (./bin/toolbox-mcp or ${PLUGIN_ROOT}/bin/tool). Do not use a shell string.","level":"silver"}}},"maintainer-repo":{"kind":"Repository","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"constituents-at-least-bronze":{"check":"cards.all(c, c.rank >= 1)","fix":"The repository level is the lowest constituent scorecard. Raise each one in the evidence to bronze.","level":"bronze"},"constituents-at-least-gold":{"check":"cards.all(c, c.rank >= 3)","fix":"Raise each constituent in the evidence to gold.","level":"gold"},"constituents-at-least-silver":{"check":"cards.all(c, c.rank >= 2)","fix":"Raise each constituent in the evidence to silver. A card whose highest level is bronze caps the repository at bronze.","level":"silver"}}},"maintainer-schema":{"kind":"JsonSchema","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"described":{"check":"entity.descriptionChars > 0","fix":"Add a root description saying which contract this document is. Readers and agents meet the schema before the code.","level":"bronze"},"draft-2020-12":{"check":"entity.draft202012","fix":"Set $schema to https://json-schema.org/draft/2020-12/schema. The binary compiles schemas as that draft and no other.","level":"bronze"},"has-id":{"check":"entity.schemaId.startsWith('https://')","fix":"Set $id to an absolute https URI. That is the schema's canonical identity in JSON Schema 2020-12.","level":"bronze"},"local-refs":{"check":"entity.externalRefs.size() == 0","fix":"Point $ref at a fragment in this file. The compiler embeds the document and does not fetch a remote schema.","level":"gold"},"no-hardcoded-secrets":{"check":"entity.secretHits.size() == 0","fix":"Remove the credential in the evidence. A schema is compiled into the binary and published with the repository.","level":"gold"},"titled":{"check":"entity.titleChars > 0","fix":"Add a title. JSON Schema defines title as the short name of the document.","level":"silver"},"wired-in":{"check":"entity.wired","fix":"Compile the document from crates/toolbox-model/src/schema.rs, or apply it from the reference portal validator. A schema file nothing loads is not a contract.","level":"silver"}}},"maintainer-site":{"kind":"SitePage","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"described":{"check":"entity.descriptionChars > 0","fix":"Set the frontmatter description. It is the summary a reader and a search index see.","level":"bronze"},"links-resolve":{"check":"entity.missingFiles.size() == 0","fix":"Fix or remove the links in the evidence. A root-relative link must include the site base and name a content page, a file under site/public, or an Astro page under site/src/pages.","level":"bronze"},"no-hardcoded-secrets":{"check":"entity.secretHits.size() == 0","fix":"Remove the credential in the evidence. A docs page is published to GitHub Pages.","level":"gold"},"reachable":{"check":"entity.inSidebar","fix":"Add the page's directory to the sidebar autogenerate list, or link its slug. Leave draft unset.","level":"silver"},"titled":{"check":"entity.title.size() > 0","fix":"Set the frontmatter title. Starlight uses it as the page heading and the document title.","level":"bronze"}}},"maintainer-skill":{"kind":"Skill","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"description-says-when":{"check":"entity.descriptionChars >= 20 && entity.descriptionChars <= 1024 && entity.triggerCues.size() > 0","fix":"Say what the skill does and when to use it in the description (20 to 1024 characters), including when, whenever, before, or after.","level":"bronze"},"has-evals":{"check":"entity.evalCases >= 3","fix":"Add at least three eval cases to evals/evals.json (a JSON array, or an object with an evals array). One element is one prompt. Running them is a separate, non-gating step.","level":"gold"},"has-example":{"check":"entity.codeFences > 0","fix":"Add a fenced code block in SKILL.md with a concrete command, input, or output.","level":"silver"},"has-procedure":{"check":"entity.numberedSteps >= 3","fix":"Write at least three numbered steps in SKILL.md so an agent can follow the procedure.","level":"silver"},"links-resolve":{"check":"entity.missingFiles.size() == 0","fix":"Fix or remove the relative links in the evidence. Paths are relative to the file that contains them.","level":"silver"},"no-hardcoded-secrets":{"check":"entity.secretHits.size() == 0","fix":"Remove the hardcoded credentials in the evidence. Refer to a secret by name instead of pasting it into the skill.","level":"gold"},"no-hidden-instructions":{"check":"entity.hiddenChars == 0","fix":"Remove hidden Unicode from the skill files: zero-width characters, bidi overrides, and Unicode tags.","level":"gold"},"one-level-deep":{"check":"entity.linkDepth <= 1 && entity.supportFiles <= 3","fix":"Keep references one hop from SKILL.md and the skill to at most three supporting files. Focused skills outperform large bundles.","level":"gold"},"portable-paths":{"check":"entity.windowsPaths.size() == 0","fix":"Replace the Windows paths in the evidence with forward-slash paths relative to the skill directory.","level":"silver"},"states-boundaries":{"check":"entity.boundaryCues.size() > 0","fix":"Name a limit, an error path, or a prerequisite in the body (never, do not, limitation, prerequisite, troubleshooting, or on error).","level":"gold"},"third-person":{"check":"entity.descriptionChars > 0 && entity.pronouns.size() == 0","fix":"Rewrite the description in third person. Drop you, your, I, we, my, and our; the description is loaded into the agent's prompt.","level":"bronze"},"valid-frontmatter":{"check":"entity.frontmatterErrors.size() == 0","fix":"Fix the Agent Skills frontmatter errors in the evidence (name, description, directory match, allowed fields).","level":"bronze"},"within-body-budget":{"check":"entity.bodyLines <= 500 && entity.estimatedTokens <= 5000","fix":"Keep the SKILL.md body under 500 lines and about 5000 tokens (characters divided by 4). Move detail into references/.","level":"silver"}}},"maintainer-supply-chain":{"kind":"Repository","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"code-scanning":{"check":"entity.codeScanning","fix":"Add a code scanning workflow that uses github/codeql-action. Alert counts stay a report, not a gate.","level":"bronze"},"code-scanning-pinned":{"check":"entity.codeScanningPinned","fix":"Pin github/codeql-action to a 40-character commit, the same way other actions are pinned.","level":"gold"},"dependabot":{"check":"entity.dependabotGaps.size() == 0","fix":"Add .github/dependabot.yml updates for the ecosystems in the evidence (cargo, npm, github-actions).","level":"bronze"},"security-policy":{"check":"entity.securityPolicy","fix":"Add SECURITY.md at the repository root, under .github/, or under docs/, with how to report a vulnerability.","level":"bronze"},"workflows-have-owners":{"check":"entity.workflowOwners","fix":"Add a CODEOWNERS rule that covers .github/workflows (a catch-all * does). Workflow changes should have an owner.","level":"silver"}}},"meta-assessment":{"kind":"Assessment","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"assessor-named":{"check":"has(entity.assessorName) && entity.assessorName.size() > 0","fix":"Set `assessor.name` to the agent harness or person who made the assessment.","level":"bronze"},"cites-everything":{"check":"entity.uncited.size() == 0","fix":"Cite a source in every reason, passes included, so a reviewer can check the verdict.","level":"gold"},"cites-for-findings":{"check":"entity.uncited.filter(c, c in entity.failing || c in entity.unsure).size() == 0","fix":"Cite what each listed fail or unsure reason rests on: a file path, a decision id (D71), a section (§4) or a number.","level":"silver"},"suggests-fixes":{"check":"entity.unsuggested.size() == 0","fix":"Add a `suggestion:` to each listed fail or unsure verdict: the change that would make it pass.","level":"bronze"}}},"meta-connector":{"kind":"PortalConnector","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"freshness-declared":{"check":"entity.withoutFreshness.size() == 0","fix":"Declare `freshness:` for each listed record kind, so stale data shows as stale rather than current.","level":"silver"},"has-fixtures":{"check":"entity.fixtureRecords > 0","fix":"Add fixtures/<connector>.ndjson with representative records, so tests run without the live system.","level":"bronze"},"records-mapped":{"check":"entity.unmapped.size() == 0","fix":"Map each listed record kind to a kind (`map: - from: <connector>/<record>`), or stop declaring it.","level":"bronze"},"refreshable":{"check":"entity.records.all(r, r in entity.refreshable)","fix":"Support refresh by external id for each listed record kind, so an agent can see its fix land.","level":"gold"}}},"meta-field":{"kind":"Field","levels":["bronze","silver","gold"],"owner":"group:maintainers","rules":{"described":{"check":"entity.described","fix":"Add a `description:` to the field: what it means, its unit, and where it comes from.","level":"silver"},"has-shape":{"check":"!entity.opaque","fix":"Replace the object with typed fields (or a list of strings), so CEL, validation and agents know its shape.","level":"gold"},"populated-in-fixtures":{"check":"entity.fixtureWithValue > 0","fix":"Give at least one fixture record a val <script>
// <toolbox-report>: the scorecard report as a custom element.
//
// Data is a child <script type="application/json">, or the src attribute (a URL of that JSON).
// A host page projects its own chrome into the slots header, nav, and footer. Those children
// stay in light DOM; this file does not read or concatenate them. The scorecard tabs are
// inside the shadow tree and are not a slot.
(function () {
  if (customElements.get("toolbox-report")) return;

  var template = document.createElement("template");
  template.innerHTML = [
    "<style>",
    ":host{display:block;color:var(--fg);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}",
    ":host{--bg:#fbfbfa;--fg:#1d1d1b;--muted:#6b6b66;--line:#e4e3df;--card:#fff;--accent:#2f5d8a;",
    "--none:#b4433a;--bronze:#9a6a2f;--silver:#6f7a86;--gold:#a8861d;--skipped:#9a9a94;--pass:#2f7d4f}",
    "@media (prefers-color-scheme:dark){:host{--bg:#161615;--fg:#ecebe7;--muted:#a3a29c;--line:#2e2e2b;--card:#1e1e1c;",
    "--accent:#86b3e0;--none:#e0786f;--bronze:#d5a463;--silver:#b3bdc8;--gold:#e2c25a;--skipped:#7d7d77;--pass:#6fc493}}",
    "main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}",
    "h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}",
    ".meta{color:var(--muted);font-size:13px;margin-bottom:20px}",
    "nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}",
    "nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}",
    "nav button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600}",
    "section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}",
    ".head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}",
    ".sub{color:var(--muted);font-size:13px}",
    ".bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 4px;background:var(--line)}",
    ".legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}",
    ".dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}",
    "input[type=search]{width:100%;margin:12px 0 8px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}",
    "details{border-top:1px solid var(--line);padding:6px 0}",
    "summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none}",
    "summary::-webkit-details-marker{display:none}",
    ".lvl{font-size:12px;font-weight:600;min-width:58px}",
    "code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}",
    ".fails{color:var(--muted);font-size:13px;overflow-wrap:anywhere}",
    ".rule{margin:8px 0 0 68px}.rule b{font-weight:600}",
    ".rule ul{margin:4px 0 0;padding-left:18px}.rule li{overflow-wrap:anywhere}",
    ".fix{color:var(--muted);font-size:13px}",
    "::slotted(*){display:block;max-width:1100px;margin:0 auto;padding:12px 16px 0;box-sizing:border-box}",
    "@media (max-width:600px){.rule{margin-left:0}summary{flex-wrap:wrap}.fails{flex-basis:100%}}",
    "</style>",
    '<slot name="header"></slot>',
    '<slot name="nav"></slot>',
    "<main>",
    '<h1 id="title"></h1>',
    '<div class="meta" id="meta"></div>',
    '<nav id="tabs" aria-label="Scorecards"></nav>',
    '<div id="cards"></div>',
    "</main>",
    '<slot name="footer"></slot>',
  ].join("");

  function el(t, a) {
    var e = document.createElement(t);
    var kids = Array.prototype.slice.call(arguments, 2).filter(function (k) {
      return k !== "";
    });
    Object.assign(e, a || {});
    kids.forEach(function (k) {
      e.append(k);
    });
    return e;
  }

  class ToolboxReport extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      var root = this.attachShadow({ mode: "open" });
      root.append(template.content.cloneNode(true));
      var inline = this.querySelector('script[type="application/json"]');
      if (inline) {
        this.render(root, JSON.parse(inline.textContent), true);
        return;
      }
      var src = this.getAttribute("src");
      if (!src) return;
      var self = this;
      fetch(src)
        .then(function (r) {
          if (!r.ok) throw new Error("report " + src + ": " + r.status);
          return r.json();
        })
        .then(function (data) {
          self.render(root, data, false);
        })
        .catch(function (e) {
          root.getElementById("meta").textContent = String(e);
        });
    }

    render(root, D, ownPage) {
      var color = function (l) {
        return "var(--" + (["none", "bronze", "silver", "gold", "skipped"].indexOf(l) >= 0 ? l : "accent") + ")";
      };
      if (ownPage) document.title = D.portal + " — scorecards";
      root.getElementById("title").textContent = D.portal;
      root.getElementById("meta").textContent =
        "Scorecards at snapshot " + D.snapshot + " · generated by toolbox report";
      var cards = Object.keys(D.scorecards);
      var active = location.hash.slice(1) || cards[0];
      var tabs = root.getElementById("tabs");
      function drawCard() {
        tabs.replaceChildren.apply(
          tabs,
          cards.map(function (c) {
            return el("button", {
              textContent: c,
              ariaPressed: String(c === active),
              onclick: function () {
                active = c;
                location.hash = c;
                drawCard();
              },
            });
          }),
        );
        var sc = D.scorecards[active];
        var rows = Object.entries(D.scores[active] || {});
        var order = ["none"].concat(sc.levels, ["skipped"]);
        var tally = {};
        rows.forEach(function (pair) {
          tally[pair[1].level] = (tally[pair[1].level] || 0) + 1;
        });
        var bar = el(
          "div",
          { className: "bar" },
          ...order
            .filter(function (l) {
              return tally[l];
            })
            .map(function (l) {
              return el("span", {
                style: "flex:" + tally[l] + ";background:" + color(l),
                title: l + ": " + tally[l],
              });
            }),
        );
        var legend = el(
          "div",
          { className: "legend" },
          ...order
            .filter(function (l) {
              return tally[l];
            })
            .map(function (l) {
              return el(
                "span",
                {},
                el("span", { className: "dot", style: "background:" + color(l) }),
                l + " " + tally[l],
              );
            }),
        );
        var list = el("div");
        var search = el("input", {
          type: "search",
          placeholder: "Filter by entity or failing rule…",
          ariaLabel: "Filter",
        });
        var draw = function () {
          var q = search.value.toLowerCase();
          var shown = rows
            .filter(function (pair) {
              return pair[1].level !== "skipped";
            })
            .sort(function (a, b) {
              return order.indexOf(a[1].level) - order.indexOf(b[1].level) || a[0].localeCompare(b[0]);
            })
            .filter(function (pair) {
              if (!q) return true;
              if (pair[0].toLowerCase().indexOf(q) >= 0) return true;
              return Object.entries(pair[1].rules || {}).some(function (ro) {
                return ro[1] !== "pass" && ro[0].indexOf(q) >= 0;
              });
            });
          list.replaceChildren.apply(
            list,
            shown.map(function (pair) {
                var id = pair[0];
                var r = pair[1];
                var failing = Object.entries(r.rules || {}).filter(function (ro) {
                  return ro[1] !== "pass";
                });
                var summary = el(
                  "summary",
                  {},
                  el("span", {
                    className: "lvl",
                    textContent: r.level,
                    style: "color:" + color(r.level),
                  }),
                  el("code", { textContent: id }),
                  el("span", {
                    className: "fails",
                    textContent: failing
                      .map(function (ro) {
                        return ro[0];
                      })
                      .join(", "),
                  }),
                );
                var body = failing.map(function (ro) {
                  var n = ro[0];
                  var o = ro[1];
                  var ev = (r.evidence || {})[n];
                  var items = ev == null ? [] : Array.isArray(ev) ? ev : [ev];
                  var rule = sc.rules[n] || {};
                  return el(
                    "div",
                    { className: "rule" },
                    el("div", {}, el("b", { textContent: n }), " (" + (rule.level || "") + ", " + o + ")"),
                    rule.fix ? el("div", { className: "fix", textContent: rule.fix }) : "",
                    items.length
                      ? el(
                          "ul",
                          {},
                          ...items.slice(0, 50).map(function (i) {
                            return el("li", {}, el("code", { textContent: typeof i === "string" ? i : JSON.stringify(i) }));
                          }),
                        )
                      : "",
                  );
                });
                var details = el("details", {}, summary);
                body.forEach(function (node) {
                  details.append(node);
                });
                return details;
              }),
          );
        };
        search.oninput = draw;
        draw();
        root.getElementById("cards").replaceChildren(
          el(
            "section",
            {},
            el(
              "div",
              { className: "head" },
              el("h2", { textContent: active }),
              el("span", {
                className: "sub",
                textContent: sc.kind + " · levels " + sc.levels.join(" < ") + " · owner " + sc.owner,
              }),
            ),
            bar,
            legend,
            search,
            list,
          ),
        );
      }
      drawCard();
    }
  }

  customElements.define("toolbox-report", ToolboxReport);
})();

</script>
