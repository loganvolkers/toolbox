# Keep the three ecosystems maintainer-supply-chain scores (cargo, npm, github-actions).
version: 2
updates:
  - {package-ecosystem: cargo, directory: /, schedule: {interval: weekly}}
  - package-ecosystem: cargo
    directory: /experiments/build-cost
    # Keep the recorded benchmark inputs pinned. Security PRs use a separate limit.
    open-pull-requests-limit: 0
    schedule: {interval: weekly}
  - package-ecosystem: cargo
    directory: /experiments/derived-state-scale
    schedule: {interval: weekly}
  # One pnpm workspace and lockfile cover ui, ui-kit, report-ui, and site.
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    ignore:
    # vue-tsc needs the JavaScript compiler entry point removed in TypeScript 7.
    - {dependency-name: typescript, versions: [">=7.0.0"]}
  - package-ecosystem: npm
    directory: /experiments/typescript-builder
    schedule: {interval: weekly}
    ignore:
    # Move Node and its types together after choosing the supported runtime.
    - dependency-name: '@types/node'
      update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
