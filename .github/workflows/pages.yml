name: pages

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
  schedule: [{cron: 23 9 * * *}]

permissions: {contents: read}

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # actions: read lets the published report score run history (maintainer-ci-reliability);
    # the ratchet in ci.yml skips that connector because run history changes with time.
    permissions: {contents: read, actions: read}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: pages}
      - uses: ./.github/actions/build-embedded-ui # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
      # The portal report is generated for this commit, not committed (D92, D01M7YAXH89ZJQ7Q4HP77NMHBX8).
      # `seikika doctor` fails the build if a pinned tool is missing, so no rule turns `unknown`.
      - name: This repository's portal report
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          cargo build --locked
          scripts/ci-tools.sh "$RUNNER_TEMP/tools" openfga actionlint scorecard osv-scanner rustsec-osv shellcheck shfmt bats
          export PATH="$RUNNER_TEMP/tools:$PATH" OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$RUNNER_TEMP/tools"
          target/debug/seikika tools install .seikika --via pipx   # the pins in the portal's tools:
          target/debug/seikika doctor .seikika
          # On main, score live run history too; pull requests keep the deterministic report.
          skip=runner
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then skip=runner,github-actions; fi
          # The baseline gives each campaign its recorded start, so the report shows progress since then.
          target/debug/seikika report .seikika --skip "$skip" --baseline .seikika/results.json -o web --out npm/site/.generated
      - name: Public organization federation snapshot
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          export PATH="$RUNNER_TEMP/tools:$PATH"
          install -D -m 0644 npm/site/.generated/report.json examples/github-org-federation/publications/seikika.json
          target/debug/seikika report examples/github-org-federation/public.yaml -o web --out npm/site/.generated/organization
      - run: pnpm check:packages
      # CLI reference is built from clap (`seikika describe` + --help) in Astro;
      # fail if the committed fingerprint is stale.
      - name: CLI docs up to date
        working-directory: npm/site
        run: pnpm check:cli-docs
        env:
          SEIKIKA_BIN: ${{ github.workspace }}/target/debug/seikika
      - name: Build docs and Storybook
        run: pnpm docs:build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          SEIKIKA_BIN: ${{ github.workspace }}/target/debug/seikika
          SEIKIKA_REPORT_DATA: ${{ github.workspace }}/npm/site/.generated/report.json
          SEIKIKA_ORG_REPORT_DATA: ${{ github.workspace }}/npm/site/.generated/organization/report.json
      - run: >-
          pnpm --filter @seikika/astro-report exec playwright install --with-deps
          chromium
      - name: Smoke test the published UI paths
        run: |
          pnpm --filter @seikika/astro-report smoke
          node npm/report-ui/scripts/federation.mjs
        env:
          SEIKIKA_OPENFGA_BIN: ${{ runner.temp }}/tools/openfga
          SEIKIKA_BIN: ${{ github.workspace }}/target/debug/seikika
          SEIKIKA_ORG_REPORT_DATA: ${{ github.workspace }}/npm/site/.generated/organization/report.json
      - name: upload
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: {path: npm/site/dist}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
