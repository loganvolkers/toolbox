name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish new versions to crates.io
        type: boolean
        default: false

permissions: {contents: read}

concurrency: {group: publish-crates, cancel-in-progress: false}

jobs:
  package:
    if: >-
      github.repository == 'seikika/seikika' && github.ref ==
      'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Verify the crates.io archives
        env: {CARGO_PROFILE_DEV_DEBUG: "0", CARGO_INCREMENTAL: "0"}
        run: cargo package --workspace --exclude seikika-durable --locked

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crates-io-publish
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish the verified workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --exclude seikika-durable --locked --no-verify
