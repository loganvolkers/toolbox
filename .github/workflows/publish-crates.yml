name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish new versions to crates.io
        type: boolean
        default: false

permissions: {contents: read}

concurrency: {group: publish-crates, cancel-in-progress: false}

jobs:
  package:
    if: >-
      github.repository == 'seikika/seikika' && github.ref ==
      'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      packages: ${{ steps.pending.outputs.packages }}
      version: ${{ steps.pending.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - name: Verify the crates.io archives and downstream SDK
        env: {CARGO_PROFILE_DEV_DEBUG: "0", CARGO_INCREMENTAL: "0"}
        run: |
          cargo package --workspace --locked
          python3 scripts/check-crates-release.py sdk target/package

      - name: Find unpublished crates
        id: pending
        if: inputs.publish
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.publish != []) | [.name, .version] | @tsv' > "$RUNNER_TEMP/crates.tsv"
          version=$(awk -F '\t' '$1 == "seikika-cli" {print $2}' "$RUNNER_TEMP/crates.tsv")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          pending=()
          while IFS=$'\t' read -r name version; do
            index="$RUNNER_TEMP/crate-index.jsonl"
            status=$(curl --silent --show-error --retry 3 --max-time 20 \
              --output "$index" --write-out '%{http_code}' \
              "https://index.crates.io/${name:0:2}/${name:2:2}/$name")
            case "$status" in
              200)
                if jq -se --arg version "$version" 'any(.[]; .vers == $version)' "$index"; then
                  echo "$name@$version is already published"
                else
                  result=$?
                  if [[ "$result" != 1 ]]; then exit "$result"; fi
                  pending+=(--package "$name")
                fi
                ;;
              404) pending+=(--package "$name") ;;
              *) echo "crates.io index returned HTTP $status for $name" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/crates.tsv"
          echo "packages=${pending[*]}" >> "$GITHUB_OUTPUT"

  publish:
    if: inputs.publish && needs.package.outputs.packages != ''
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crates-io-publish
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish the verified workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PUBLISH_PACKAGES: ${{ needs.package.outputs.packages }}
        shell: bash
        run: |
          read -r -a packages <<< "$PUBLISH_PACKAGES"
          cargo publish --locked --no-verify "${packages[@]}"

      - name: Record OIDC publication
        run: >-
          echo "Published new crates using crates.io Trusted Publishing (GitHub
          OIDC)." >> "$GITHUB_STEP_SUMMARY"

  registry-smoke:
    if: >-
      !cancelled() && inputs.publish && needs.package.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: [package, publish]
    uses: ./.github/workflows/crates-registry-smoke.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
    with:
      version: ${{ needs.package.outputs.version }}
