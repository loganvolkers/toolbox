# Code scanning (maintainer-supply-chain). Alert counts are not a gate; the workflow's presence is.
# github/codeql-action v4.39.4. Dependabot updates the pin.
name: codeql
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: 0 6 * * 1}]
permissions: {contents: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # The Rust extractor runs build scripts and compiles proc macros even in build-mode none.
      - name: Cache Rust extractor dependencies and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/codeql-rust-target
          key: codeql-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: {languages: "rust,javascript-typescript,python", build-mode: none}
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-rust-target
  benchmark-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read, security-events: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # The Rust extractor runs build scripts and compiles proc macros even in build-mode none.
      - name: Cache Rust extractor dependencies and build artifacts
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/codeql-rust-target
          key: codeql-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust
          build-mode: none
          config: |
            paths-ignore: ["experiments/**"]
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: {upload: never, upload-database: false}
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-rust-target
  benchmark-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read, security-events: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # The Rust extractor runs build scripts and compiles proc macros even in build-mode none.
      - name: Cache Rust extractor dependencies and build artifacts
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/codeql-rust-target
          key: codeql-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust
          build-mode: none
          config: |
            paths: [experiments]
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: {upload: never, upload-database: false}
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-rust-target
