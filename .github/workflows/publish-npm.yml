name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish new versions to npm
        type: boolean
        default: false

permissions: {contents: read}

concurrency: {group: publish-npm, cancel-in-progress: false}

jobs:
  pack:
    if: >-
      github.repository == 'seikika/seikika' && github.ref ==
      'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, package-manager-cache: false}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack public packages
        run: >-
          pnpm --filter @seikika/ui --filter @seikika/astro-report pack
          --pack-destination "$RUNNER_TEMP/npm-packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions: {id-token: write}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24, package-manager-cache: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: npm-packages, path: npm-packages}
      - name: Publish with npm trusted publishing
        shell: bash
        run: |
          for package in ui astro-report; do
            archives=("$PWD"/npm-packages/seikika-"$package"-*.tgz)
            if [[ ${#archives[@]} != 1 || ! -f "${archives[0]}" ]]; then
              echo "Expected one tarball for @seikika/$package" >&2
              exit 1
            fi
            archive=${archives[0]}
            version=$(tar -xOzf "$archive" package/package.json | jq -er \
              --arg name "@seikika/$package" 'select(.name == $name) | .version')
            version_url="https://registry.npmjs.org/@seikika%2f$package/$version"
            status=$(curl --silent --show-error --retry 3 --max-time 20 \
              --output /dev/null --write-out '%{http_code}' "$version_url")
            case "$status" in
              200) echo "@seikika/$package@$version is already published" ;;
              404)
                npm publish "$archive" --registry=https://registry.npmjs.org --access public --ignore-scripts
                curl --fail --silent --show-error --retry-all-errors --retry 24 --retry-delay 10 \
                  --retry-max-time 240 --max-time 20 --output /dev/null "$version_url"
                ;;
              *) echo "npm returned HTTP $status for @seikika/$package@$version" >&2; exit 1 ;;
            esac
          done
