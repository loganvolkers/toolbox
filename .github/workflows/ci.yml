# CI for the Toolbox repository: the Rust workspace, the reference portal and the experiments that
# act as contracts. Every job is a check an agent can also run locally (see AGENTS.md).
name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 (cargo registry and target/, keyed by Cargo.lock and toolchain)
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - run: >-
          python3 -m pip install --require-hashes -r
          examples/reference-portal/tools/requirements.txt
      - name: Decision ids encode as ULIDs (D01M7XKEXQH4HG5371629M50E2G)
        run: python3 scripts/decision-id.py --self-test
      - name: Portable changeset applicator fixtures
        run: python3 scripts/test-apply-changesets.py
      - name: YAML is formatted (yamark 0.6.1, D97)
        run: |
          python3 -m pip install --require-hashes -r tools/requirements-yamark.txt
          yamark format --check $(git ls-files '*.yaml' '*.yml' ':!.github/workflows/release.yml')
      - name: M0 parity with tools/validate.py
        run: cargo build --locked && python scripts/validate-parity.py
      - name: >-
          Install OpenFGA, actionlint and OpenSSF Scorecard from their releases,
          SHA-256-pinned (no compile, D90)
        run: |
          scripts/ci-tools.sh "$RUNNER_TEMP/tools" openfga actionlint scorecard
          echo "TOOLBOX_OPENFGA_BIN=$RUNNER_TEMP/tools/openfga" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Tests that need OpenFGA (authz, .fga.yaml through the Authorizer)
        run: cargo test --locked -p toolbox-authz -p toolbox-api
      - name: toolbox validate, test and derive on the reference portal
        run: |
          target/debug/toolbox validate examples/reference-portal
          target/debug/toolbox test examples/reference-portal
          target/debug/toolbox derive examples/reference-portal --out /tmp/derived
          for f in expected/entities.json expected/scorecards.json expected/options.json expected/orphans.json authz/tuples.expected.json; do
            cmp /tmp/derived/$f examples/reference-portal/$f
          done
      - name: Toolbox for Toolbox (D65) — the standards' own tests
        run: |
          target/debug/toolbox validate portal
          target/debug/toolbox test portal
          target/debug/toolbox validate examples/repo-portal-starter
          target/debug/toolbox test examples/repo-portal-starter
          # Packages test themselves, in their own portal with their own parameters (D89)
          for t in packages/*/tests; do
            target/debug/toolbox validate "$t"
            target/debug/toolbox test "$t"
          done
      # The ratchet, through the same action pilot repos use (D66, D69), with the binaries built above.
      # Fails on any regression, and when portal/results.json is out of date (update it with
      # `toolbox report portal --skip runner --baseline portal/results.json --update`).
      - name: >-
          CI linters for the ratchet, at the versions the committed baseline was
          made with
        run: |
          # The pins live in the portal's tools: (one place); pip installs the PyPI ones (D01M800DHD0Z1RTPH7CM46GZS3B)
          target/debug/toolbox tools install portal --via pip
          actionlint -version   # installed with OpenFGA above
          target/debug/toolbox doctor portal   # every connector resolves, every tool at its pinned version (D90)
      - name: >-
          The portal's STANDARD.md is current (generated from the manifest, like
          the baseline)
        run: |
          target/debug/toolbox report portal --skip runner,github-actions -o standard > /tmp/STANDARD.md
          diff -u portal/STANDARD.md /tmp/STANDARD.md
      - name: >-
          Take-it-out (docs/design/toolbox-and-tools.md, B1) — the tools in the
          box give the same findings alone
        run: >-
          TOOLBOX=target/debug/toolbox python3 scripts/take-it-out.py portal
          ci-lint maintainer-python maintainer-openssf
      - name: Toolbox for Toolbox — agent assessments are valid and briefs build (D79)
        run: |
          target/debug/toolbox assess check portal --skip runner,github-actions
          target/debug/toolbox assess brief rule:toolbox/meta-rule/tested --portal portal --fixtures -o json > /dev/null
      - name: >-
          Toolbox for Toolbox — connector conformance (the protocol checks every
          connector must pass)
        run: |
          target/debug/toolbox connector test --name workspace --portal portal -- target/debug/toolbox-connector-workspace
          target/debug/toolbox connector test --name surfaces --portal portal -- target/debug/toolbox-connector-runner
          target/debug/toolbox connector test --name ci-lint --portal portal -- target/debug/toolbox-connector-runner
      # The pages workflow generates site/public/report. The ratchet verdict below is the gate.
      - name: Toolbox for Toolbox — ratchet against portal/results.json
        uses: ./actions/report
        with:
          portal: portal
          skip: runner,github-actions
          toolbox-dir: target/debug
          artifact-name: toolbox-for-toolbox-report
  otel-testbed:
    # Local Collector + score.sh (design §13 / experiments/otel-testbed). No SaaS backends.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: otel-testbed}
      - run: cargo build --locked -p toolbox-cli
      - name: OTel testbed rubric (experiments/otel-testbed/scripts/score.sh)
        run: experiments/otel-testbed/scripts/score.sh
  acceptance:
    # The acceptance scripts (M2–M4: Postgres, OpenFGA, connectors, a browser) in their own job, so a
    # failure here doesn't hide the checks in `rust` that run after it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - name: OpenFGA from its release, SHA-256-pinned (D90)
        run: |
          scripts/ci-tools.sh "$RUNNER_TEMP/tools" openfga
          echo "TOOLBOX_OPENFGA_BIN=$RUNNER_TEMP/tools/openfga" >> "$GITHUB_ENV"
      - name: >-
          PostgreSQL 16, the version the acceptance scripts pin (the runner image
          may carry another)
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y -q postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
      - name: M2 acceptance (Postgres, ingest API, read-your-writes, restart)
        run: PGDIR=$RUNNER_TEMP/pg scripts/m2-acceptance.sh
      - name: >-
          M3 acceptance (Postgres + OpenFGA over the tuple view, facets, A10,
          PATs, revocation)
        run: PGDIR=$RUNNER_TEMP/pg3 scripts/m3-acceptance.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - name: Playwright for the A11 browser check
        run: |
          set -euo pipefail
          cp -a scripts/playwright-ci "$RUNNER_TEMP/pw"
          npm ci --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: >-
          M4 acceptance (real connectors only, A1–A5, A11 in a browser, SCIM
          revocation, conformance kit)
        run: PGDIR=$RUNNER_TEMP/pg4 scripts/m4-acceptance.sh
  report-action:
    # The report action as a pilot repo runs it: builds toolbox from the action's own source (cached),
    # then scores a repository set up from the starter portal (D69).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: A pilot repository, set up from the starter
        run: |
          mkdir -p "$RUNNER_TEMP/pilot/.toolbox" "$RUNNER_TEMP/pilot/.github"
          cp examples/repo-portal-starter/toolbox.yaml "$RUNNER_TEMP/pilot/.toolbox/"
          cp README.md "$RUNNER_TEMP/pilot/"
          echo '* @acme/pilot' > "$RUNNER_TEMP/pilot/.github/CODEOWNERS"
          git -C "$RUNNER_TEMP/pilot" init -q
          git -C "$RUNNER_TEMP/pilot" remote add origin https://github.com/acme/pilot.git
      - name: First run creates the baseline (mode update)
        id: first
        uses: ./actions/report
        with:
          working-directory: ${{ runner.temp }}/pilot
          mode: update
          artifact-name: pilot-first-run
      # The passing ci path through the action is the Toolbox-for-Toolbox step above, on every run;
      # crates/toolbox-cli/tests/ratchet.rs covers every verdict through the CLI.
      - name: Check the action's outputs
        run: |
          test "${{ steps.first.outputs.result }}" = pass
          test -s "$RUNNER_TEMP/pilot/.toolbox/results.json"
          test -s "${{ steps.first.outputs.html }}"
          grep -q "repository:acme/pilot" "${{ steps.first.outputs.report }}"
      - name: A pull request makes something worse (an individual in CODEOWNERS)
        run: echo '/docs/ @alice' >> "$RUNNER_TEMP/pilot/.github/CODEOWNERS"
      - name: Then the ratchet fails the job (mode ci)
        id: regressed
        continue-on-error: true
        uses: ./actions/report
        with:
          working-directory: ${{ runner.temp }}/pilot
          artifact-name: pilot-regressed
      - name: Check it failed, and that the verdict names the regression (D96)
        env:
          OUTCOME: ${{ steps.regressed.outcome }}
        run: |
          test "$OUTCOME" = failure
          verdict="$RUNNER_TEMP/toolbox-report/verdict.json"
          jq -e '.result == "regressed" and .exitCode == 1' "$verdict"
          jq -e '.regressions[] | select(.entity == "repository:acme/pilot" and .message == "owners-are-teams now fails")' "$verdict"
  scale-gate:
    # Instruction counts of one full recompute (serial path and rayon workers) against the committed
    # baseline, under Callgrind: repeatable, unlike wall-clock time on a shared runner. The 10 s
    # budget on 4 vCPU (v1-spec §10.4) is timed weekly by scale-slo.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: scale-release}
      - name: Valgrind (Callgrind)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind
          valgrind --version
      - run: cargo build --release --locked -p toolbox-derive --example scale
      - name: Scale gate (scripts/scale-gate.py)
        run: python3 scripts/scale-gate.py --ci
  reference-portal:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: examples/reference-portal}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - run: python3 -m pip install --require-hashes -r tools/requirements.txt
      - name: The fga CLI from its release, SHA-256-pinned
        run: |
          ../../scripts/ci-tools.sh "$RUNNER_TEMP/tools" fga
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - run: python tools/validate.py
      - run: python tools/reference.py --check
      - run: fga model test --tests authz/model.fga.yaml
  ui:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - name: The embedded build (ui/dist) matches the source
        run: npm run build && git diff --exit-code -- dist
  typescript-builder:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: experiments/typescript-builder}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
