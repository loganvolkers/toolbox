# CI for the Toolbox repository: the Rust workspace, the reference portal and the experiments that
# act as contracts. Every job is a check an agent can also run locally (see AGENTS.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r examples/reference-portal/tools/requirements.txt
      - name: M0 parity with tools/validate.py
        run: cargo build --locked && python scripts/validate-parity.py
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - name: Install OpenFGA (the co-process Toolbox supervises, D38)
        run: go install github.com/openfga/openfga/cmd/openfga@v1.22.1 && echo "TOOLBOX_OPENFGA_BIN=$(go env GOPATH)/bin/openfga" >> "$GITHUB_ENV"
      - name: Tests that need OpenFGA (authz, .fga.yaml through the Authorizer)
        run: cargo test --locked -p toolbox-authz -p toolbox-api
      - name: M2 acceptance (Postgres, ingest API, read-your-writes, restart)
        run: PGDIR=$RUNNER_TEMP/pg scripts/m2-acceptance.sh
      - name: M3 acceptance (Postgres + OpenFGA over the tuple view, facets, A10, PATs, revocation)
        run: PGDIR=$RUNNER_TEMP/pg3 scripts/m3-acceptance.sh
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Playwright for the A11 browser check
        run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.64.1 && "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium && echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: M4 acceptance (real connectors only, A1–A5, A11 in a browser, SCIM revocation, conformance kit)
        run: PGDIR=$RUNNER_TEMP/pg4 scripts/m4-acceptance.sh
      - name: toolbox validate, test and derive on the reference portal
        run: |
          target/debug/toolbox validate examples/reference-portal
          target/debug/toolbox test examples/reference-portal
          target/debug/toolbox derive examples/reference-portal --out /tmp/derived
          for f in expected/entities.json expected/scorecards.json expected/options.json expected/orphans.json authz/tuples.expected.json; do
            cmp /tmp/derived/$f examples/reference-portal/$f
          done
      - name: Toolbox for Toolbox (D65) — the standards' own tests
        run: |
          target/debug/toolbox validate portal
          target/debug/toolbox test portal
          target/debug/toolbox validate examples/repo-portal-starter
          target/debug/toolbox test examples/repo-portal-starter
      # The ratchet, through the same action pilot repos use (D66, D69), with the binaries built above.
      # Fails on any regression, and when portal/results.json is out of date (update it with
      # `toolbox report portal --skip runner --baseline portal/results.json --update`).
      - name: Toolbox for Toolbox — ratchet against portal/results.json
        uses: ./actions/report
        with:
          portal: portal
          skip: runner
          toolbox-dir: target/debug
          artifact-name: toolbox-for-toolbox-report
  report-action:
    # The report action as a pilot repo runs it: builds toolbox from the action's own source (cached),
    # then scores a repository set up from the starter portal (D69).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A pilot repository, set up from the starter
        run: |
          mkdir -p "$RUNNER_TEMP/pilot/.toolbox" "$RUNNER_TEMP/pilot/.github"
          cp examples/repo-portal-starter/toolbox.yaml "$RUNNER_TEMP/pilot/.toolbox/"
          cp README.md "$RUNNER_TEMP/pilot/"
          echo '* @acme/pilot' > "$RUNNER_TEMP/pilot/.github/CODEOWNERS"
          git -C "$RUNNER_TEMP/pilot" init -q
          git -C "$RUNNER_TEMP/pilot" remote add origin https://github.com/acme/pilot.git
      - name: First run creates the baseline (mode update)
        id: first
        uses: ./actions/report
        with:
          working-directory: ${{ runner.temp }}/pilot
          mode: update
          artifact-name: pilot-first-run
      - name: Then the ratchet passes (mode ci)
        id: ratchet
        uses: ./actions/report
        with:
          working-directory: ${{ runner.temp }}/pilot
          artifact-name: pilot-ci
      - name: Check the action's outputs
        run: |
          test "${{ steps.first.outputs.result }}" = pass
          test -s "$RUNNER_TEMP/pilot/.toolbox/results.json"
          test "${{ steps.ratchet.outputs.result }}" = pass
          test -s "${{ steps.ratchet.outputs.html }}"
          grep -q "repository:acme/pilot" "${{ steps.ratchet.outputs.report }}"
  scale-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full recompute at 100k entities / 2M relations / 100 rules within 10 s (v1-spec §10.4)
        run: cargo run --release --locked -p toolbox-derive --example scale
  reference-portal:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: examples/reference-portal}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.26"}
      - run: pip install -r tools/requirements.txt
      - run: go install github.com/openfga/cli/cmd/fga@v0.8.2
      - run: python tools/validate.py
      - run: python tools/reference.py --check
      - run: fga model test --tests authz/model.fga.yaml
  ui:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - name: The embedded build (ui/dist) matches the source
        run: npm run build && git diff --exit-code -- dist
  typescript-builder:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: experiments/typescript-builder}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npm run check
