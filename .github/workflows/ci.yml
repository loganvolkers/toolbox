# CI for the Seikika repository: the Rust workspace, the reference portal and the experiments that
# act as contracts. Every job is a check an agent can also run locally (see AGENTS.md).
name: ci
on:
  push: {branches: [main]}
  pull_request: {types: [opened, synchronize, reopened, labeled, unlabeled]}
permissions: {contents: read}
# A new push to a pull request cancels its superseded run. On main, a running
# workflow can finish, while GitHub can replace a pending run in the same group.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: ./.github/actions/build-embedded-ui # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 (cargo registry and target/, keyed by Cargo.lock and toolchain)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - run: >-
          python3 -m pip install --require-hashes -r
          examples/reference-portal/tools/requirements.txt
      - name: Decision ids encode as ULIDs (D01M7XKEXQH4HG5371629M50E2G)
        run: python3 scripts/decision-id.py --self-test
      - name: Portable changeset applicator fixtures
        run: python3 scripts/test-apply-changesets.py
      - name: Assessment planner, result validation and admission fixtures
        run: python3 scripts/test-assessment-pr.py
      - name: YAML is formatted (yamark 0.6.1, D97)
        run: |
          python3 -m pip install --require-hashes -r scripts/requirements-yamark.txt
          yamark format --check $(git ls-files '*.yaml' '*.yml' ':!.github/workflows/release.yml' ':!pnpm-lock.yaml')
      - name: M0 parity with tools/validate.py
        run: cargo build --locked && python scripts/validate-parity.py
      - name: Organization federation standards
        run: |
          target/debug/seikika validate examples/github-org-federation/public.yaml
          target/debug/seikika test examples/github-org-federation
      - name: >-
          Install OpenFGA, actionlint, OpenSSF Scorecard and osv-scanner from
          their releases, SHA-256-pinned (no compile, D90), and the pinned RustSec
          database
        run: |
          scripts/ci-tools.sh "$RUNNER_TEMP/tools" openfga actionlint scorecard osv-scanner rustsec-osv shellcheck shfmt bats
          echo "SEIKIKA_OPENFGA_BIN=$RUNNER_TEMP/tools/openfga" >> "$GITHUB_ENV"
          echo "OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Shell regression tests
        run: |
          shfmt -i 2 -ci -d tests/shell/*.bats
          bats tests/shell
      - name: >-
          Tests that need OpenFGA (authz, .fga.yaml through the Authorizer) or
          Landlock
        # A missing binary or a kernel without Landlock fails these tests here instead of skipping them (tests-pass).
        env: {SEIKIKA_REQUIRE_OPENFGA: "1", SEIKIKA_REQUIRE_LANDLOCK: "1"}
        run: cargo test --locked -p seikika-authz -p seikika-api
      - name: seikika validate, test and derive on the reference portal
        run: |
          target/debug/seikika validate examples/reference-portal
          target/debug/seikika test examples/reference-portal
          target/debug/seikika derive examples/reference-portal --out /tmp/derived
          for f in expected/entities.json expected/scorecards.json expected/options.json expected/orphans.json authz/tuples.expected.json; do
            cmp /tmp/derived/$f examples/reference-portal/$f
          done
      - name: Seikika for Seikika (D65) — the standards' own tests
        run: |
          target/debug/seikika validate portal
          target/debug/seikika test portal
          target/debug/seikika validate examples/repo-portal-starter
          target/debug/seikika test examples/repo-portal-starter
          for t in examples/github-org-federation examples/github-org-federation/children/*; do
            target/debug/seikika validate "$t"
            target/debug/seikika test "$t"
          done
          # Packages test themselves, in their own portal with their own parameters (D89)
          for t in packages/*/tests; do
            target/debug/seikika validate "$t"
            target/debug/seikika test "$t"
          done
      # The ratchet, through the same action pilot repos use (D66, D69), with the binaries built above.
      # Fails on any regression, and when portal/results.json is out of date (update it with
      # `seikika report portal --skip runner --baseline portal/results.json --update`).
      - name: >-
          CI linters for the ratchet, at the versions the committed baseline was
          made with
        run: |
          # The pins live in the portal's tools: (one place); pip installs the PyPI ones (D01M800DHD0Z1RTPH7CM46GZS3B)
          target/debug/seikika tools install portal --via pip
          actionlint -version   # installed with OpenFGA above
          target/debug/seikika doctor portal   # every connector resolves, every tool at its pinned version (D90)
      - name: >-
          The portal's STANDARD.md is current (generated from the manifest, like
          the baseline)
        run: |
          target/debug/seikika report portal --skip runner,github-actions -o standard > /tmp/STANDARD.md
          diff -u portal/STANDARD.md /tmp/STANDARD.md
      - name: >-
          Take-it-out (docs/design/seikika-and-tools.md, B1) — the tools in the
          box give the same findings alone
        run: >-
          SEIKIKA=target/debug/seikika python3 scripts/take-it-out.py portal
          ci-lint maintainer-python maintainer-openssf maintainer-advisories
      - name: Seikika for Seikika — agent assessments are valid and briefs build (D79)
        env:
          REQUIRE_FRESH_ASSESSMENTS: ${{ contains(github.event.pull_request.labels.*.name, 'require-fresh-assessments') }}
        run: |
          args=()
          if [[ "$REQUIRE_FRESH_ASSESSMENTS" == "true" ]]; then
            args+=(--require-fresh)
          fi
          target/debug/seikika assess check portal --skip runner,github-actions "${args[@]}"
          target/debug/seikika assess brief rule:seikika/meta-rule/tested --portal portal --fixtures -o json > /dev/null
      - name: Plan PR assessments and run selected repository probes
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ASSESSMENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          evidence="$RUNNER_TEMP/assessment-rust"
          mkdir -p "$evidence"
          python3 scripts/assessment-pr.py plan --base "$ASSESSMENT_BASE" --out "$evidence/plan.json"
          python3 scripts/assessment-pr.py check --base "$ASSESSMENT_BASE" --evidence-dir "$evidence" \
            --only onboarding --only acceptance-diagnostics --only sdk-docs
      - name: Archive PR plan and repository probe evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assessment-rust
          path: ${{ runner.temp }}/assessment-rust
      - name: >-
          Seikika for Seikika — connector conformance (the protocol checks every
          connector must pass)
        run: |
          target/debug/seikika connector test --name workspace --portal portal -- target/debug/seikika-connector-workspace
          target/debug/seikika connector test --name surfaces --portal portal -- target/debug/seikika-connector-runner
          target/debug/seikika connector test --name ci-lint --portal portal -- target/debug/seikika-connector-runner
      # The Pages workflow generates the report snapshot. The ratchet verdict below is the gate.
      - name: Seikika for Seikika — ratchet against portal/results.json
        uses: ./actions/report # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          portal: portal
          skip: runner,github-actions
          seikika-dir: target/debug
          artifact-name: seikika-for-seikika-report
  rust-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/build-embedded-ui # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
  crates-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {CARGO_PROFILE_DEV_DEBUG: "0", CARGO_INCREMENTAL: "0"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/build-embedded-ui # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: crates-archives}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - name: Verify the crates.io archives
        run: |
          cargo package --workspace --locked --allow-dirty
          python3 scripts/check-crates-release.py sdk target/package
  otel-testbed:
    # Local Collector + score.sh (design §13 / experiments/otel-testbed). No SaaS backends.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: otel-testbed}
      - uses: ./.github/actions/build-embedded-ui # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
      - run: cargo build --locked -p seikika-cli -p seikika-connector-gitlab
      - name: OTel testbed rubric (experiments/otel-testbed/scripts/score.sh)
        run: |
          experiments/otel-testbed/scripts/score.sh
          OTEL_TESTBED_PROTOCOL=http/protobuf experiments/otel-testbed/scripts/score.sh
  github-connector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: github-connector}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "24"}
      - run: cargo build --locked -p seikika-connector-github
      - run: >-
          npm --prefix scripts/github-emulate ci --ignore-scripts --no-audit
          --no-fund
      - name: GitHub connector integration with Emulate
        run: npm --prefix scripts/github-emulate test
  acceptance:
    # The acceptance scripts (M2–M5: Postgres, OpenFGA, connectors, a browser, actions) in their own job, so a
    # failure here doesn't hide the checks in `rust` that run after it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/build-embedded-ui # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
      - run: cargo build --locked
      - name: >-
          M5 acceptance (self-service actions in repos and through an org portal;
          no network, no Postgres)
        run: scripts/m5-acceptance.sh
      - name: OpenFGA from its release, SHA-256-pinned (D90)
        run: |
          scripts/ci-tools.sh "$RUNNER_TEMP/tools" openfga
          echo "SEIKIKA_OPENFGA_BIN=$RUNNER_TEMP/tools/openfga" >> "$GITHUB_ENV"
      - name: >-
          PostgreSQL 16, the version the acceptance scripts pin (the runner image
          may carry another)
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y -q postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
      - name: M2 acceptance (Postgres, ingest API, read-your-writes, restart)
        run: PGDIR=$RUNNER_TEMP/pg scripts/m2-acceptance.sh
      - name: >-
          M3 acceptance (Postgres + OpenFGA over the tuple view, facets, A10,
          PATs, revocation)
        run: PGDIR=$RUNNER_TEMP/pg3 scripts/m3-acceptance.sh
      - name: Playwright for the A11 browser check
        run: |
          set -euo pipefail
          cp -a scripts/playwright-ci "$RUNNER_TEMP/pw"
          npm ci --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: >-
          M4 acceptance (real connectors only, A1–A5, A11 in a browser, SCIM
          revocation, conformance kit)
        run: PGDIR=$RUNNER_TEMP/pg4 scripts/m4-acceptance.sh
  gitlab-acceptance:
    # Federated actions on a real GitLab: GitLab CE and a GitLab Runner in Docker on the runner
    # (scripts/gitlab/harness.sh, docs/design/forges.md §6). Its own job, because GitLab's first
    # boot is slow and needs memory the other acceptance scripts don't.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Start GitLab before building the connectors
        run: scripts/gitlab/harness.sh start
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: gitlab-acceptance}
      - uses: ./.github/actions/build-embedded-ui # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
      - run: >-
          cargo build --locked -p seikika-cli -p seikika-connector-gitlab -p
          seikika-connector-workspace
      - name: GitLab CE 19.6.1 and a shell runner with seikika mounted
        run: scripts/gitlab/harness.sh up
      - name: >-
          GitLab acceptance (merge requests, a child's own pipeline with signed
          approvals, refusals, a hybrid org, the gitlab-pipeline executor, GitLab
          group approvers through the gitlab connector)
        run: scripts/gitlab-acceptance.sh
      - name: GitLab's logs, when it failed
        if: failure()
        run: >-
          docker logs --tail 200 seikika-gitlab; docker logs --tail 200
          seikika-gitlab-runner
  report-action:
    # The report action as a pilot repo runs it: builds seikika from the action's own source (cached),
    # then exercises the bundled and composable actions with a starter portal.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Setup rejects a release archive with a mismatched checksum
        run: bash scripts/test-action-install.sh
      - name: A pilot repository, set up from the starter
        run: |
          mkdir -p "$RUNNER_TEMP/pilot/.seikika" "$RUNNER_TEMP/pilot/.github"
          cp -r examples/repo-portal-starter/{seikika.yaml,tests,fixtures} "$RUNNER_TEMP/pilot/.seikika/"
          cp README.md "$RUNNER_TEMP/pilot/"
          echo '* @acme/pilot' > "$RUNNER_TEMP/pilot/.github/CODEOWNERS"
          git -C "$RUNNER_TEMP/pilot" init -q
          git -C "$RUNNER_TEMP/pilot" remote add origin https://github.com/acme/pilot.git
      - name: First run creates the baseline (mode update)
        id: first
        uses: ./actions/report # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
          mode: update
          artifact-name: pilot-first-run
      # The passing ci path through the action is the Seikika-for-Seikika step above, on every run;
      # crates/seikika-cli/tests/ratchet.rs covers every verdict through the CLI.
      - name: Check the action's outputs
        env:
          RESULT: ${{ steps.first.outputs.result }}
          HTML: ${{ steps.first.outputs.html }}
          REPORT: ${{ steps.first.outputs.report }}
        run: |
          test "$RESULT" = pass
          test -s "$RUNNER_TEMP/pilot/.seikika/results.json"
          test -s "$HTML"
          grep -q "repository:acme/pilot" "$REPORT"
      - name: Set up the same CLI for independent steps
        id: setup
        uses: ./actions/setup # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          seikika-dir: ${{ runner.temp }}/seikika-bin
      - name: Use the CLI without scoring or publishing
        working-directory: ${{ runner.temp }}/pilot
        run: |
          seikika validate .seikika
          seikika test .seikika
          cd .seikika
          test -s results.json
          sha256sum results.json > "$RUNNER_TEMP/pilot-baseline.sha256"
          mv results.json "$RUNNER_TEMP/pilot-results.json"
      - name: Build a portal before the operator adopts a baseline
        id: site
        uses: ./actions/build-portal # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
      - name: Require an explicit baseline when the operator enables the gate
        id: missing
        continue-on-error: true
        uses: ./actions/ratchet # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
      - name: Confirm the portal was built and the missing baseline was rejected
        working-directory: ${{ runner.temp }}/pilot/.seikika
        env:
          OUTCOME: ${{ steps.missing.outcome }}
          VERDICT: ${{ steps.missing.outputs.verdict }}
          INDEX: ${{ steps.site.outputs.index }}
        run: |
          test ! -e results.json
          test -s "$INDEX"
          test "$OUTCOME" = failure
          jq -e '.result == "missing-baseline" and .exitCode == 1' "$VERDICT"
          mv "$RUNNER_TEMP/pilot-results.json" results.json
      - name: The independent ratchet passes against a clean baseline
        id: clean
        uses: ./actions/ratchet # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
      - name: Improve a score without updating the baseline
        run: printf 'License fixture\n' > "$RUNNER_TEMP/pilot/LICENSE"
      - name: Strict mode requires the improvement to be recorded
        id: stale
        continue-on-error: true
        uses: ./actions/ratchet # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
      - name: Regression-only mode allows the same improvement
        id: check
        uses: ./actions/ratchet # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
          mode: check
      - name: Compare enforcement modes on the same change
        env:
          STRICT_OUTCOME: ${{ steps.stale.outcome }}
          STRICT_VERDICT: ${{ steps.stale.outputs.verdict }}
          CHECK_VERDICT: ${{ steps.check.outputs.verdict }}
        run: |
          test "$STRICT_OUTCOME" = failure
          jq -e '.result == "stale" and .exitCode == 1 and (.improvements | length > 0)' "$STRICT_VERDICT"
          jq -e '.result == "stale" and .exitCode == 0 and (.regressions | length == 0)' "$CHECK_VERDICT"
      - name: A pull request makes something worse (an individual in CODEOWNERS)
        run: echo '/docs/ @alice' >> "$RUNNER_TEMP/pilot/.github/CODEOWNERS"
      - name: Then the ratchet fails the job (mode ci)
        id: regressed
        continue-on-error: true
        uses: ./actions/report # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
          artifact-name: pilot-regressed
      - name: Check it failed, and that the verdict names the regression (D96)
        env:
          OUTCOME: ${{ steps.regressed.outcome }}
          VERDICT: ${{ steps.regressed.outputs.verdict }}
        run: |
          test "$OUTCOME" = failure
          jq -e '.result == "regressed" and .exitCode == 1' "$VERDICT"
          jq -e '.regressions[] | select(.entity == "repository:acme/pilot" and .message == "owners-are-teams now fails")' "$VERDICT"
      - name: Regression-only mode still blocks a real regression
        id: gate
        continue-on-error: true
        uses: ./actions/ratchet # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
          mode: check
      - name: Build a portal for an Astro host despite the score regression
        id: web
        uses: ./actions/build-portal # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          working-directory: ${{ runner.temp }}/pilot
          format: web
      - name: Check independent results and unchanged baseline
        working-directory: ${{ runner.temp }}/pilot/.seikika
        env:
          BIN: ${{ steps.setup.outputs.bin-dir }}
          CLEAN_VERDICT: ${{ steps.clean.outputs.verdict }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_VERDICT: ${{ steps.gate.outputs.verdict }}
          SITE_DIR: ${{ steps.site.outputs.directory }}
          INDEX: ${{ steps.site.outputs.index }}
          WEB_DIR: ${{ steps.web.outputs.directory }}
          WEB_JSON: ${{ steps.web.outputs.report-json }}
        run: |
          test "$(command -v seikika)" = "$BIN/seikika"
          jq -e '.result == "pass"' "$CLEAN_VERDICT"
          test "$GATE_OUTCOME" = failure
          jq -e '.result == "regressed" and .exitCode == 1' "$GATE_VERDICT"
          test "$SITE_DIR" != "$WEB_DIR"
          test "$SITE_DIR/index.html" = "$INDEX"
          test ! -e "$SITE_DIR/report.json"
          grep -q 'repository:acme/pilot' "$INDEX"
          test -s "$WEB_DIR/seikika-report.js"
          jq -e '.catalog | tostring | contains("repository:acme/pilot")' "$WEB_JSON"
          sha256sum --check "$RUNNER_TEMP/pilot-baseline.sha256"
  scale-gate:
    # Instruction counts of one full recompute (serial path and rayon workers) against the committed
    # baseline, under Callgrind: repeatable, unlike wall-clock time on a shared runner. The 10 s
    # budget on 4 vCPU (v1-spec §10.4) is timed weekly by scale-slo.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: scale-release}
      - name: Valgrind (Callgrind)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind
          valgrind --version
      - run: cargo build --release --locked -p seikika-derive --example scale
      - name: Scale gate (scripts/scale-gate.py)
        run: python3 scripts/scale-gate.py --ci
  reference-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: examples/reference-portal}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - run: python3 -m pip install --require-hashes -r tools/requirements.txt
      - name: The fga CLI from its release, SHA-256-pinned
        run: |
          ../../scripts/ci-tools.sh "$RUNNER_TEMP/tools" fga
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - run: python tools/validate.py
      - run: python tools/reference.py --check
      - run: fga model test --tests authz/model.fga.yaml
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {ASTRO_TELEMETRY_DISABLED: "1"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Embedded assets stay out of Git
        run: |
          paths=(crates/seikika-api/ui-dist crates/seikika-cli/report-dist)
          test -z "$(git ls-files -- "${paths[@]}")"
          for path in "${paths[@]}"; do
            git check-ignore "$path"
          done
      - name: Pack the public npm packages
        run: >-
          pnpm --filter @seikika/ui --filter @seikika/astro-report pack
          --pack-destination "$RUNNER_TEMP"
      - run: >-
          pnpm --filter @seikika/astro-report exec playwright install --with-deps
          chromium
      - run: pnpm storybook:build
      - name: Probe every story at desktop and mobile widths in light and dark mode
        run: pnpm storybook:probe
      - name: Record assessment evidence for changed report states
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ASSESSMENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 scripts/assessment-pr.py check --base "$ASSESSMENT_BASE"
          --evidence-dir "$RUNNER_TEMP/assessment-ui" --only report-states
      - name: Archive report state evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assessment-ui
          path: ${{ runner.temp }}/assessment-ui
  typescript-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: experiments/typescript-builder}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "22"}
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  merge-readiness:
    if: ${{ always() }}
    needs:
      - rust
      - rust-workspace
      - crates-archives
      - otel-testbed
      - github-connector
      - acceptance
      - gitlab-acceptance
      - report-action
      - scale-gate
      - reference-portal
      - ui
      - typescript-builder
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all test jobs to pass
        env: {RESULTS: "${{ toJSON(needs) }}"}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
