name: Crates.io smoke tests

on:
  workflow_call:
    inputs:
      version:
        description: Exact workspace version to test after publishing
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/crates-registry-smoke.yml
      - scripts/check-crates-release.py
  schedule: [{cron: 23 14 * * 1}]

permissions: {contents: read}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs: {version: "${{ steps.select.outputs.version }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13"}
      - name: Select the registry version
        id: select
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION:-$(python3 scripts/check-crates-release.py latest)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing Seikika $version from crates.io" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: version
    name: Smoke (${{ matrix.runner }}, ${{ matrix.resolution }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
        resolution: ${{ fromJSON(inputs.version != '' && '["locked"]' || '["locked","fresh"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13"}
      - run: rustup show active-toolchain
      - name: Set up Linux integration checks
        if: matrix.runner == 'ubuntu-24.04'
        env:
          TOOLS: ${{ runner.temp }}/release-tools
        run: |
          scripts/ci-tools.sh "$TOOLS" openfga
          echo "SEIKIKA_OPENFGA_BIN=$TOOLS/openfga" >> "$GITHUB_ENV"
      - name: Install and exercise published binaries
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RESOLUTION: ${{ matrix.resolution }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          flags=()
          if [[ "$RUNNER_LABEL" == ubuntu-24.04 ]]; then flags+=(--full); fi
          python scripts/check-crates-release.py install "$RELEASE_VERSION" --resolution "$RESOLUTION" "${flags[@]}"
