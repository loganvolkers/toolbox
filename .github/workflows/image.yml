# The server image (D90): built from a published release's Linux archives, not from source, pushed
# to GHCR and attested. release.yml calls it after dist announces a release (post-announce-jobs);
# a `release: published` trigger would never fire, because dist creates the release with
# GITHUB_TOKEN and events from that token start no workflows. Run it by hand for an existing tag.
name: image

on:
  workflow_call:
    inputs:
      plan:
        description: >-
          dist's plan manifest, which dist passes to every post-announce job. The
          tag is the caller's ref (the pushed release tag), so this is not read.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the image from, e.g. v0.2.0
        required: true

# Explicit least privilege at the top level; the image job elevates only what it needs.
permissions: {contents: read}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: image-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: The release's Linux binaries, checksum-verified
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/stage-image-archives.sh dl image "$TAG"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seikika" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
