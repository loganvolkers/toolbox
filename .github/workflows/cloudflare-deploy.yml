name: Cloudflare portal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-deploy.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/**
      - examples/cloudflare-containers/**
      - scripts/ci-tools.sh
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare deployment environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions: {contents: read}

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name ==
      'workflow_dispatch' || vars.CLOUDFLARE_AUTO_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.target || 'production' }}
    concurrency:
      group: cloudflare-portal-${{ inputs.target || 'production' }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: {node-version: 24}
    - name: Build and stage Seikika
      id: stage
      shell: bash
      run: |
        cargo build --locked --release --workspace
        directory=$(mktemp -d "$RUNNER_TEMP/seikika-cloudflare.XXXXXX")
        bash examples/cloudflare-containers/stage.sh examples/cloudflare-containers/seikika-forks "$directory"
        "$directory/bin/seikika" validate "$directory/portal"
        npm ci --ignore-scripts --no-audit --no-fund --prefix "$directory"
        npm --prefix "$directory" run check
        echo "directory=$directory" >> "$GITHUB_OUTPUT"
    - name: Deploy the Worker and Container
      shell: bash
      working-directory: ${{ steps.stage.outputs.directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        SEIKIKA_URL: ${{ vars.SEIKIKA_URL }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        : "${CLOUDFLARE_API_TOKEN:?Set the environment secret CLOUDFLARE_API_TOKEN}"
        : "${CLOUDFLARE_ACCOUNT_ID:?Set the environment variable CLOUDFLARE_ACCOUNT_ID}"
        : "${CLOUDFLARE_WORKER_NAME:?Set the environment variable CLOUDFLARE_WORKER_NAME}"
        if [[ "${SEIKIKA_URL:-}" != https://* ]]; then
          echo 'Set the environment variable SEIKIKA_URL to the portal HTTPS URL.' >&2
          exit 1
        fi
        ./node_modules/.bin/wrangler deploy --name "$CLOUDFLARE_WORKER_NAME"
    - name: Verify portal readiness
      shell: bash
      env:
        SEIKIKA_URL: ${{ vars.SEIKIKA_URL }}
      run: |
        curl --fail --silent --show-error --proto '=https' \
          --retry 12 --retry-connrefused --max-time 35 --retry-max-time 240 \
          "${SEIKIKA_URL%/}/readyz" | jq --exit-status '.ready == true'
