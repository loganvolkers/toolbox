# Build the two release images from real cargo-dist archives without publishing.
name: image rehearsal
on:
  pull_request:
    paths:
      - .github/workflows/image*.yml
      - .github/workflows/release.yml
      - dist-workspace.toml
      - image/**
      - mise.toml
      - scripts/stage-image-archives.sh
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  archives:
    name: Image archives (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # Use cargo-dist's release runners for the Linux ABI.
          - {runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {key: "image-rehearsal-${{ matrix.target }}"}
      - name: Read the pinned mise version
        id: mise
        run: |
          version=$(sed -n 's/^min_version = "\([^"]*\)"$/\1/p' mise.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "${{ steps.mise.outputs.version }}"
          install: false
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false
      - name: Build release archives
        env: {TARGET: "${{ matrix.target }}"}
        run: |
          mise trust
          mise exec cargo-dist -- dist build --artifacts=local --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "image-archives-${{ matrix.target }}"
          path: |
            target/distrib/*-${{ matrix.target }}.tar.xz
            target/distrib/*-${{ matrix.target }}.tar.xz.sha256
          if-no-files-found: error
  image:
    name: image rehearsal
    needs: archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: image-archives-*, merge-multiple: true, path: dl}
      - name: Verify checksums and stage binaries
        run: scripts/stage-image-archives.sh dl image
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: "type=oci,dest=${{ runner.temp }}/seikika-image.tar"
