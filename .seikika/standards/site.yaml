# Public docs site (docs/design/site-standards.md).
# Included by .seikika/seikika.yaml; see .seikika/README.md for the layout.

kinds:
  - name: SitePage
    description: One Starlight content page of the public docs site.
    identityFrom: [connector:workspace]
    fields:
      path:
        type: string
        description: Path of the content file from the repository root.
      slug:
        type: string
        description: Starlight slug. Empty for the home page.
      title:
        type: string
        description: >-
          Top-level frontmatter title, trimmed. Empty when the page has none, or
          only a blank or nested one.
      duplicateTitle:
        type: boolean
        description: Another content page has the same title (ignoring case).
      descriptionChars:
        type: integer
        description: Characters in the frontmatter description.
      draft: {type: boolean, description: The page is a draft.}
      sidebarHidden:
        type: boolean
        description: The page sets sidebar.hidden or hidden.
      inSidebar:
        type: boolean
        description: A reader can reach the page from the sidebar, and it is not a draft.
      missingFiles:
        type: list
        items: string
        description: Link targets that are neither a content page nor a file.
      secretHits:
        type: list
        items: string
        description: >-
          Lines matching a credential shape (cloud and provider tokens, private
          keys, URLs with a real password).
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/site-page
      id: "'site-page:' + record.path"
      set: >-
        {'path': record.path, 'slug': record.slug, 'title': record.title,
         'duplicateTitle': record.duplicateTitle,
         'descriptionChars': record.descriptionChars, 'draft': record.draft,
         'sidebarHidden': record.sidebarHidden, 'inSidebar': record.inSidebar,
         'missingFiles': record.missingFiles, 'secretHits': record.secretHits}

scorecards:
  # A page is part of the site when it is titled, described, linked, and reachable from the sidebar.
  - name: maintainer-site
    title: Public docs pages
    kind: SitePage
    description: >-
      Each public docs page: titled, described, linked, reachable from the
      sidebar, free of credentials, and not sharing its title
      (docs/design/site-standards.md).
    rationale: >-
      The site is what outside readers see of Seikika, served from GitHub
      Pages, so an untitled page, a dead link or a leaked credential is a
      public defect. Bronze is a page that stands on its own; silver puts it
      where readers can find it; gold keeps pages distinguishable in search
      and navigation.
    links:
    - title: Site standards
      url: https://github.com/seikika/seikika/blob/main/docs/design/site-standards.md
    - title: 'Decision: a Starlight docs site'
      url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M7X0RYD00000000000000000.md
    owner: group:maintainers
    track: docs
    levels: [bronze, silver, gold]
    ratchet: {newEntitiesAtLeast: bronze}
    rules:
    - name: titled
      level: bronze
      check: entity.title.size() >= 3
      evidence: >-
        [entity.title == '' ? 'no top-level title' : 'title "' + entity.title +
        '" is shorter than 3 characters']
      fix: >-
        Set a top-level `title:` of at least 3 characters in the page's
        frontmatter. Starlight uses it as the page heading and the document
        title.
      rationale: >-
        An untitled page reaches readers, browser tabs and search results with
        no name, so nobody can recognise it before opening it.
      links:
      - title: Starlight frontmatter
        url: https://starlight.astro.build/reference/frontmatter/
    - name: described
      level: bronze
      check: entity.descriptionChars > 0
      evidence: "['no description']"
      fix: >-
        Set `description:` in the page's frontmatter. It is the summary a reader
        and a search index see.
      rationale: >-
        Without a description, search engines and link previews fall back to
        whatever text they scrape, and a reader cannot judge the page before
        opening it.
      links:
      - title: Starlight frontmatter
        url: https://starlight.astro.build/reference/frontmatter/
    - name: links-resolve
      level: bronze
      check: entity.missingFiles.size() == 0
      evidence: entity.missingFiles
      fix: >-
        Fix or remove the links in the evidence. A root-relative link must
        include the site base and name a content page, a file under site/public,
        or an Astro page under npm/site/src/pages.
      rationale: >-
        GitHub Pages serves the site under /seikika and Starlight does not
        rewrite a link that already starts with /, so a link that misses the
        base or names no page is a 404 for every reader.
    - name: reachable
      level: silver
      check: entity.inSidebar
      evidence: "['not in the sidebar']"
      fix: >-
        Add the page's directory to the sidebar `autogenerate` list in
        `site/astro.config.mjs`, or link its slug there. Leave `draft` unset.
      rationale: >-
        The sidebar is how a reader of the site finds a page. One it does not
        list exists only for someone who already has the URL.
    - name: no-hardcoded-secrets
      level: bronze
      check: entity.secretHits.size() == 0
      evidence: entity.secretHits
      fix: >-
        Remove the credential in the evidence. A docs page is published to
        GitHub Pages.
      rationale: >-
        A credential on a page is public as soon as the site deploys, and stays
        in the repository history after the page is fixed, so it has to be
        revoked.
    - name: unique-title
      level: gold
      check: "!entity.duplicateTitle"
      evidence: >-
        ['another page is also titled "' + entity.title + '"']
      fix: >-
        Give the page a `title:` no other page in npm/site/src/content/docs
        uses, so search results and the sidebar tell them apart.
      rationale: >-
        Two pages with one title look the same wherever titles are listed, so
        readers open the wrong one or assume one is a duplicate.
    facets: {summary: public, details: public}
