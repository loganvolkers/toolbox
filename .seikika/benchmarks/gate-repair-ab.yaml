    fitAudit: >-
      dc42499 fits (P5): it touches no harness file, and box-ab friction #4
      and root-causes C1 predate the registration. It overstated one use:
      actions/report passes --out, so only the evidence marking reaches it. No
      rival friction blocked arm B (P4). 76a1140 fits too: no harness file,
      and its summary reaches the actions/report CI log. 3f1b225 is a
      harness-only fix of round 3's silent reviewdog pass. c1f9b22 fits, with
      one caution: its five-line gap fill is what quotes the planted typo.
      eb45c5d gives the rival the same quoting, harness-only, and is not shown
      to make it stronger; 295b0d3 is harness-only and works against arm A
      (ADJUDICATION.md)
    spread: >-
