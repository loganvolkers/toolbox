apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-example/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 9aa55bb005c3
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      secretHits uses the shared shape list
      (crates/seikika-connector-workspace/src/hygiene.rs:13-33): AWS, GitHub,
      `sk-ant/proj/live`, Stripe, Slack, PEM private keys and URL passwords.
      It errs both ways for this catalog. It has no GitLab (`glpat-`), Google
      API key (`AIza`) or npm (`npm_`) shape, although
      experiments/actions-gitlab and examples/secret-vault-gcp are examples
      for exactly those platforms. And AWS's published documentation key
      AKIAIOSFODNN7EXAMPLE is flagged as a credential (asserted in
      crates/seikika-connector-workspace/src/examples.rs:136-147), so an
      example that copies AWS's own placeholder fails while leaking nothing.
      Markdown is scanned with `code=false` (hygiene.rs:110-112), so split
      prefixes inside a fenced snippet go unseen. The module calls itself "the
      floor, not the scanner" (hygiene.rs:5-7).
    suggestion: >-
      Add `glpat-`, `AIza[0-9A-Za-z_-]{35}` and `npm_[A-Za-z0-9]{36}` shapes.
      Treat AWS's documented `...EXAMPLE` keys as placeholders, as
      `placeholder()` already does for URL passwords (hygiene.rs:53-64), and
      scan fenced code blocks with `code=true`. Or put gitleaks' SARIF in a
      slot when it is installed.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      When the rule fires, the cheapest fix is to replace the value with
      `${TOKEN}` or `<token>`. Those are recognised placeholders
      (hygiene.rs:60-63) and the right thing to do in an example that is
      copied verbatim (rationale, .seikika/standards/examples.yaml:104-107).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `path:line kind` (hygiene.rs:82; `README.md:3
      aws-access-key` pinned at .seikika/tests/standards.test.yaml:649-650).
      Removing the credential on that line, as the fix says, empties the list.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze, with no allowance, is justified as a killer item in
      docs/design/thresholds.md:34 (moved from gold by
      D01M83G9F4EEGN1GTP14HEYB8B6, so the bronze ratchet can't let a
      credential through). docs/design/example-standards.md:62 still shows it
      at gold, and D78's text says the same; that doc lags the decision, but
      the level itself is justified.
summary: >-
  Correctly placed at bronze as a killer item, with an exact line in the
  evidence and a cheap correct fix. The shared detector misses the token
  shapes of platforms this repo's examples cover (GitLab, GCP, npm), and
  flags AWS's published placeholder key, so it is a floor rather than a
  measure of "no credential". example-standards.md still lists the rule at
  gold.
