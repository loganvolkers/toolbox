apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-docs/names-sdlc-layer
rubric: rule-quality
subjectHash: 5fdf62b2d2b3
assessor: {kind: agent, name: cursor-assessor-11, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The `layeredSdlc` count (.seikika/seikika.yaml:119-124) accepts more
      than a named layer. It accepts "agent SDLC", though agent is not one of
      the four layers in docs/sdlc.md:10-15, and any "SDLC has", "SDLC
      stage(s)" or "SDLC in Seikika". A scratch design doc whose only mentions
      were "The SDLC has gaps. Every SDLC stage. agent SDLC." counted
      layeredSdlc 3 and sdlc 3, so it passed with no layer named. Lowercase
      "sdlc" is not counted at all (`\bSDLC\b`, seikika.yaml:119). D63 asks
      that documents name the layer they mean
      (docs/decisions/D01M7VRXEZ80000000000000000.md).
    suggestion: >-
      Drop `agent`, `has` and `SDLC stages?` from the layered alternation, or
      require one of the four layer words nearby. Keep only "SDLC layers" and
      `"SDLC"` as model-level escapes. Make `sdlc` case-insensitive, and add a
      fixture line for each removed escape.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A writer who doesn't know the layer can write "agent SDLC" (AGENTS.md's
      own charter wording) or "the SDLC stages" and pass without deciding
      whose loop the doc is about. Choosing an escape costs the same one word
      as naming a layer, and needs no thought.
    suggestion: >-
      Same change as for measures-intent. Once only the four layer words
      count, the one-word fix is also the right one.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      Prefixing each bare mention with a layer word passes
      (.seikika/standards/docs.yaml:116-118). The evidence gives only a count
      ("1 mention(s)", docs.yaml:113-115) with no line numbers, unlike File
      records (main.rs:462-477), so an agent must grep for SDLC. The fix lists
      three layers ("maintainer, operator or user", citing D63) and omits
      package author, added by D87 and named in docs/sdlc.md:3-4. A
      package-author doc following the fix literally would name the wrong
      layer, but it would still pass.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number: every mention must name a layer. Bronze follows D63
      and the docs ladder (docs/design/seikika-for-seikika.md:104). The
      rationale (docs.yaml:119-121) explains that a bare "SDLC" leaves the
      reader guessing whose loop it is.
summary: >-
  The intent is decided (D63) and placed at bronze, but the regex exempts
  "agent SDLC", "SDLC has" and "SDLC stages", so a doc can pass without
  naming a layer. The fix lists three layers where D87 made four, and the
  evidence is a count without lines. Tightening the regex and updating the
  fix to four layers would fix both.
