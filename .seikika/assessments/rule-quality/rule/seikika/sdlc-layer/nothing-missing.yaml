apiVersion: seikika.com/assessment/v1
entity: rule:seikika/sdlc-layer/nothing-missing
rubric: rule-quality
subjectHash: 859d51b163b0
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The earlier fail is fixed. stagesMissing now counts a stage that is
      declared missing or has an empty `namedIn`
      (.seikika/standards/sdlc.yaml:21-30), and the connector leaves out of
      `namedIn` every listed doc that doesn't exist or never mentions the
      stage's name (crates/seikika-connector-workspace/src/data.rs:258-267,
      unit-tested at :331-339 with a missing and a silent doc). The check now
      says what the fix says (sdlc.yaml:280-285), and the live result is
      right: only package-author fails, on its two `status: missing` stages
      (.seikika/sdlc/stages/package-author.yaml:83 and :101).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      "Names the stage" is a case-insensitive substring test
      (crates/seikika-connector-workspace/src/data.rs:220-233), and most stage
      names are common words (plan, build, test, verify, deploy, monitor,
      package; .seikika/sdlc/stages/). Cheapest attempt: change `status:
      missing` to `designed` at .seikika/sdlc/stages/package-author.yaml:83
      and :101. The listed docs/design/packages.md says "package" in its title
      and "distribute" once, in a sentence about how other tools distribute
      (docs/design/packages.md:229), so both stages pass and the layer reaches
      silver with no new design, while the stage's own gaps say the registry
      is undecided (package-author.yaml:103). The fallback at
      .seikika/standards/sdlc.yaml:139 also treats every listed doc as naming
      the stage when the connector isn't configured with `naming:`.
    suggestion: >-
      Match the stage as a heading or a whole word near the layer, e.g.
      require a Markdown heading or anchor containing the stage name (or let
      `docs:` entries be `path#anchor` and check the anchor exists), and in
      .seikika/standards/sdlc.yaml:139 fall back to `[]` instead of
      `record.docs` so an unconfigured connector can't pass the rule.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the file (.seikika/sdlc/stages/<layer>.yaml), the `docs:`
      and `status:` keys and the allowed values, and states both conditions
      the connector checks: the doc must exist and name the stage
      (.seikika/standards/sdlc.yaml:280-285). The evidence says which
      condition failed ("(no doc that exists and names it)", sdlc.yaml:29-30),
      which .seikika/tests/standards.test.yaml:1286-1289 pins.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. docs/design/thresholds.md:59 states the sdlc-layer ladder (no
      stage missing in fact: a doc that exists and names the stage, whatever
      its status says) on the principle that a prerequisite sits below what
      depends on it (thresholds.md:22-23).
summary: >-
  Re-assessed after the rule gained a rationale: its check, evidence, fix
  and level are the same as on main, as is the code the reasons cite, so
  the verdicts stand; line numbers are updated for the rationale lines
  inserted above them. The rationale states the why without claiming more
  than the check sees. The check now means what the fix says, existence
  included, but naming is a substring test on common words, so flipping a
  status still passes when a shared doc happens to contain the stage's
  name.
