apiVersion: seikika.com/assessment/v1
entity: rule:seikika/sdlc-layer/stages-declared
rubric: rule-quality
subjectHash: 859e8235e271
assessor: {kind: agent, name: cursor-assessor-13, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The check compares two lists the same author writes: a layer's `stages:`
      in .seikika/sdlc/layers.yaml and the stage records in
      .seikika/sdlc/stages/<layer>.yaml (`definedStages`,
      .seikika/standards/sdlc.yaml:20, 266-269). The rationale is that an
      undeclared stage could let a layer reach gold while skipping it
      (sdlc.yaml:272-276). But a stage left out of layers.yaml is just as
      invisible, and nothing checks the list against the loop docs/sdlc.md:6
      says every layer needs (plan, build, test, deploy, monitor). Today the
      package author layer lists no plan or monitor stage, and the user layer
      no plan stage (.seikika/sdlc/layers.yaml:10-19, 37-42). All four layers
      pass.
    suggestion: >-
      Declare the required loop once, for example as a policy `sdlcLoop:
      [plan, build, test, deploy, monitor]` with a per-layer `covers:` map
      from each loop step to the layer's stage name. Check that every step
      maps to a declared stage, and list the unmapped steps as evidence.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      If a stage listed in layers.yaml has no record, deleting it from the
      list (one word in `stages: [...]`) passes. That is cheaper than the fix,
      which asks for a stage record with status, exit criterion and docs, and
      the deletion also takes the stage out of nothing-missing and
      every-stage-built, which read only declared records (sdlc.yaml:20-31).
    suggestion: >-
      Tie the layer's stage list to something outside layers.yaml (the loop
      policy above, or the layer doc's stage table), so that removing a stage
      from the list is itself a visible failure.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the list of stages named in layers.yaml with no record
      (sdlc.yaml:269). The fix says to declare each in
      .seikika/sdlc/stages/<layer>.yaml, even as `missing`
      (sdlc.yaml:270-271). Adding a record with that `name` and `layer` puts
      it into `definedStages`. The fixture sdlc:demo-gap, missing `build`,
      shows the evidence (.seikika/tests/standards.test.yaml:1060-1061).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. docs/design/thresholds.md:58 places "every stage declared" at
      bronze for sdlc-layer, below "nothing missing" and "every stage built".
      That follows the prerequisite principle at thresholds.md:22-23: the
      higher rules can't see an undeclared stage.
summary: >-
  A sensible bronze consistency check with a working fix. It only compares
  layers.yaml with the stage files, both written by the same author, so a
  layer can drop a stage from its list and pass. Two layers already skip
  steps of the plan, build, test, deploy, monitor loop that docs/sdlc.md
  says every layer needs.
