apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-agent-doc/has-commands
rubric: rule-quality
subjectHash: f0841d1751e2
assessor: {kind: agent, name: cursor-assessor-11, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `commandLines` counts lines in which the words cargo, npm, pnpm, yarn,
      pytest or seikika appear anywhere, case-insensitively
      (crates/seikika-connector-workspace/src/agentsmd.rs:69-72). The words
      don't have to be a command. A scratch AGENTS.md with no build or test
      instruction ("# Seikika", "We never use npm here.") recorded
      commandLines 3, so the rule passes without saying how to test. Here,
      every line naming the product counts (16 lines of AGENTS.md contain
      "Seikika"). The reverse also happens: an AGENTS.md whose only test
      instructions are `go test ./...` or `make test` fails, although D75 asks
      only for "a test or build command"
      (docs/decisions/D01M7W4Y2K00000000000000000.md).
    suggestion: >-
      Count backtick or fenced invocations only, reusing the invocation regex
      `ci_missing` already applies (agentsmd.rs:40-42). Widen the tool list to
      common build runners (make, just, go, uv, bun, gradle, mvn), and add a
      fixture whose only mention is the bare word "Seikika".
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A canonical file passes by mentioning npm or Seikika in prose. The
      partial fixture fails only because its text has none of the six words
      (.seikika/fixtures/workspace.ndjson:29, commandLines 0). Any mention,
      even "we do not use npm", passes at silver
      (.seikika/standards/agent-docs.yaml:92-95).
    suggestion: >-
      Same change as for measures-intent: count command invocations in code
      spans or fences, not words on a line.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix says to name a build or test command in AGENTS.md and lists the
      tools that count (agent-docs.yaml:96-98), so following it sets
      commandLines above 0. The evidence "0 command lines" is pinned on the
      partial fixture (.seikika/tests/standards.test.yaml:478-489).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The number is "at least one". D75 puts "a test or build command in the
      canonical file" at silver
      (docs/decisions/D01M7W4Y2K00000000000000000.md), as does
      docs/design/agents-md-standards.md:22,67. The agents.md README example
      has a testing section (agents-md-standards.md:34).
summary: >-
  The intent and level are well grounded, but the measure is a word count.
  Any line that mentions npm or the word Seikika counts as a command line,
  so here the rule can't fail, and a Go or Make project fails it. Counting
  invocations in code spans, as checks-run-in-ci already does, would close
  both directions.
