apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-agent-doc/links-resolve
rubric: rule-quality
subjectHash: c5fa9c1a255d
assessor: {kind: agent, name: cursor-assessor-11, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The agent-doc record uses its own link checker
      (crates/seikika-connector-workspace/src/agentsmd.rs:74-95), not the one
      Doc records use (src/main.rs:297-318). It differs both ways. It requires
      `is_file()` (agentsmd.rs:88), so a link to a directory fails, and it
      doesn't drop fenced or inline code, so a link written as an example
      fails. A scratch AGENTS.md with `[the dir](sub/)` and a fenced
      `[example](not-a-file.md)` reported missingFiles ["not-a-file.md",
      "sub/"]. A broken reference-style link (`[r]: missing-ref.md`) or `<a
      href>` was not reported. The same AGENTS.md is also a Doc
      (docs/design/agents-md-standards.md:43-45), so a directory link fails
      here and passes maintainer-docs.
    suggestion: >-
      Call main.rs `links_in` from agentsmd.rs instead of
      `missing_links`/`resolve`, so both cards share one checker that resolves
      directories and pages and skips code. Count reference-style definitions
      as links in that shared checker, and add a directory-link case to
      agentsmd.rs's tests.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Wrapping a broken link in backticks hides it, but that also stops it
      being a link, which the fix allows ("Fix or remove",
      .seikika/standards/agent-docs.yaml:88). Rewriting it reference-style to
      dodge the check costs more than fixing the path. The cheapest route is
      the right one.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists each missing target as written (agent-docs.yaml:87,
      agentsmd.rs:89), and fixing or removing those links empties it. For the
      false failures above, removing or retargeting the link to a file also
      passes, though the fix doesn't explain why a valid directory link was
      listed. The unsafe fixture pins the evidence as ['docs/nope.md']
      (.seikika/tests/standards.test.yaml:491-504).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. D75 puts "relative links resolve" at bronze
      (docs/decisions/D01M7W4Y2K00000000000000000.md), as does the ladder in
      docs/design/agents-md-standards.md:21,66. The rationale
      (agent-docs.yaml:89-91) says a broken link drops the rule the agent was
      sent to read.
summary: >-
  The level and the fix are right, but this card checks links with a
  second implementation that disagrees with the Doc checker on the same
  file. It flags directory links and links inside code blocks, and it
  misses reference-style links. Sharing `links_in` with maintainer-docs
  would remove both kinds of misfire.
