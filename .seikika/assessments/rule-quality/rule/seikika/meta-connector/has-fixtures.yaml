apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-connector/has-fixtures
rubric: rule-quality
subjectHash: ec5dfbea8890
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `fixtureRecords` is the number of non-blank lines in
      fixtures/<connector>.ndjson (crates/seikika-cli/src/model.rs:221-228),
      counted per connector rather than per record kind. S4S's workspace
      connector declares 20 record kinds (.seikika/seikika.yaml:188-209). One
      fixture line for `crate` passes the rule while the other 19 mappings
      never run in tests, which is the gap the rationale says the rule closes
      (.seikika/standards/meta.yaml:874-876). `delete` messages and lines that
      aren't records count as well.
    suggestion: >-
      Emit `withoutFixtures`: the declared record kinds with no `type: record`
      message of that kind in the file. Check that it is empty, and use it as
      the evidence, as freshness-declared does with `withoutFreshness`.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A single `{}` line passes. read_fixtures accepts any JSON value on a
      line (crates/seikika-store/src/lib.rs:189-201), ingest silently skips a
      message with no `type` (lib.rs:120-128), and model.rs:227 counts the
      line anyway. No record is loaded, no test fails, and the rule passes.
    suggestion: >-
      Count only `type: record` messages whose `kind` is one of the
      connector's declared records, which is the per-kind count suggested
      above.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the exact file, `fixtures/<name>.ndjson in portal
      <portal>` (meta.yaml:870), which is where read_fixtures looks
      (seikika-store/src/lib.rs:173, 189-190). The fix says to add
      representative records there. The failing case is pinned for
      connector:demo/feed (.seikika/tests/standards.test.yaml:827-829).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The only number is "at least one". Bronze is placed by
      docs/design/scorecards-for-scorecards.md:209 and by the ratchet comment
      "a new connector needs fixtures and a mapping for every record"
      (meta.yaml:855).
summary: >-
  The fix and the level are right, but the count is too coarse to mean
  "tested without the live system". One line of any JSON passes, and so
  does one record for one of a connector's many record kinds. Counting
  record messages per declared kind would make the rule match its
  rationale.
