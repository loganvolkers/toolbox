apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-connector/refreshable
rubric: rule-quality
subjectHash: c9af4788c723
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The check reads the keys of the manifest's `refresh:` map
      (crates/seikika-cli/src/model.rs:233), which only `seikika validate`
      cross-checks against `records`
      (crates/seikika-model/src/validate.rs:196-208). At runtime, whether a
      refresh by id works depends on the capabilities the connector registers
      (crates/seikika-connect/src/hub.rs:409-415, used at
      crates/seikika-api/src/connectors.rs:510), and nothing compares the two.
      The reference portal fails while meeting the intent: the builtin github
      connector registers `external_ids` refresh for `codeowners` and `app`
      (crates/seikika-connector-github/src/main.rs:411-412), but the manifest
      lists only installation and repository
      (examples/reference-portal/seikika.yaml:45-47). So connector:acme/github
      fails with both kinds in its evidence (.seikika/results.json). The same
      manifest requires `since` for repository, which the connector doesn't
      register, and nothing reports that.
    suggestion: >-
      Compare the manifest's required scopes with what the package registers.
      Builtin capabilities are static and could be recorded in a table or
      taken from `seikika connector test`. Pass a record only when the package
      offers `external_ids` for it.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      One manifest line per record passes. Adding `refresh: {assessment:
      [external_ids]}` to S4S's workspace connector clears the evidence pinned
      at .seikika/tests/standards.test.yaml:833, even though the workspace
      connector deliberately doesn't offer assessment refresh
      (crates/seikika-connector-workspace/src/main.rs:1330-1333). The check
      reads only keys, so `assessment: []` or `assessment: [since]` also
      passes, although the fix says "by external id". The schema allows an
      empty scope list (crates/seikika-model/schema/manifest.schema.json,
      `$defs/connector` `refresh`).
    suggestion: >-
      Require `external_ids` in the record's scope list, and check it against
      the connector's registered capabilities as above.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      "Support refresh by external id for each listed record kind"
      (https://github.com/seikika/seikika/blob/05510a57fafd8707979370858b578b78b935cf0e/portal/standards/meta.yaml#L891-L892)
      names no place. An agent that implements refresh in the connector, where
      the capability actually lives, still fails, because the rule reads only
      the manifest's `refresh:` map and the fix never mentions it.
    suggestion: >-
      Name both places: "Declare `refresh: {<record>: [external_ids]}` on the
      connector in seikika.yaml, and make sure its package registers that
      scope (`seikika connector test` runs a scoped refresh)."
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Gold is placed by
      docs/design/scorecards-for-scorecards.md:209 and by the card's rationale
      that freshness and refresh "sit above" the floor (meta.yaml:841-846).
      The rule's rationale says why refresh is the top rung: an agent needs it
      to confirm a fix (meta.yaml:894-897).
summary: >-
  The rule scores the manifest's refresh declaration, not the connector's
  ability to refresh, and the two have already drifted in the reference
  portal: it fails two kinds the github connector does refresh. A one-line
  declaration passes on a connector that refuses the refresh, and the fix
  doesn't name the key the rule reads.
