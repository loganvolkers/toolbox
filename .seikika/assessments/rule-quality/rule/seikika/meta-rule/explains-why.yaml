entity: rule:seikika/meta-rule/explains-why
rubric: rule-quality
subjectHash: ec75c01b73f5
assessor: {kind: agent, name: cursor-assessor-02, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check reads `explained`, a non-blank `rationale:`
      (crates/seikika-cli/src/model.rs:283-285, meta.rs:263), which is the
      field the fix names (.seikika/standards/meta.yaml:431-433).
      D01M868BY0KJNEYE9WBFZYEYFYH says explains-why requires rationale and
      links. A rule without links shows its scorecard's (same decision, point
      1), so not reading the rule's own `links` is consistent.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `rationale: TODO` passes, because filled() only trims whitespace
      (model.rs:283-285). Nothing downstream judges the text either: the
      rule-quality rubric has no criterion on the rationale
      (meta.yaml:1148-1180). A rationale that restates the fix also passes,
      which is the case the rationale itself warns about (meta.yaml:434-438).
    suggestion: >-
      Apply the floor meta-rubric's `guided` uses (model.rs:287-289): at least
      10 words, and not identical to the fix or description. Or add a
      rule-quality criterion asking whether the rationale names a risk or
      cost.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the rule (`rule sprawling/everything has no
      rationale`, .seikika/tests/standards.test.yaml:253-263), and the fix
      names the key to add. Any non-blank rationale passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      D01M868BY0KJNEYE9WBFZYEYFYH places it at bronze on meta-rule. Bronze is
      the ratchet floor every new rule must meet from its first commit,
      explained included (docs/design/scorecards-for-scorecards.md:117-119,
      L10), and the card's rationale repeats it (meta.yaml:398-399).
summary: >-
  Well-aimed and well-tested: both outcomes are pinned
  (.seikika/tests/standards.test.yaml:253-263). Its fix works and its
  level is decided. It is a presence check on free text, though, and
  nothing, deterministic or judged, looks at whether the rationale says
  why. A one-word rationale passes. All 272 live rules pass it
  (.seikika/results.json).
