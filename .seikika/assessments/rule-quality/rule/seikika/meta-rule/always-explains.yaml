apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-rule/always-explains
rubric: rule-quality
subjectHash: 5b32919bb1c4
assessor: {kind: agent, name: cursor-assessor-02, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check reads `hasEvidence`, which the connector sets to
      `r.evidence.is_some()` (crates/seikika-cli/src/meta.rs:256), so passing
      means exactly what the fix asks for: the rule declares `evidence:`
      (.seikika/standards/meta.yaml:512-518). Whether that evidence names what
      failed is a separate gold rule, evidence-tracks-check (meta.yaml:524),
      so this one doesn't have to claim more than presence.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Any expression passes: `evidence: "['failed']"` sets hasEvidence on a
      rule of any size. Gold only partly catches it, because
      evidenceTracksCheck accepts a fixed sentence for any check of at most 8
      nodes with no loop (meta.yaml:131-142), and accepts any sentence that
      concatenates `entity.name`. So the cheapest route to silver and often
      gold is a constant string, not evidence an agent can act on (lesson L2,
      docs/design/scorecards-for-scorecards.md:82).
    suggestion: >-
      Make silver require evidence that reads at least one field the check
      reads, or a loop, for checks over 8 nodes, and keep presence alone as
      the bar only for the small yes/no checks thresholds.md:46 exempts.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the key, `evidence:`, and adding any evidence expression
      flips hasEvidence (meta.rs:256). The failing fixtures
      rule:seikika/user-cli/has-help and rule:acme/github-app-hygiene/
      only-approved-apps (.seikika/fixtures/surfaces.ndjson) have `evidence:
      null`, and the test at .seikika/tests/standards.test.yaml:278-284 pins
      both failing.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Silver follows the prerequisite principle in
      docs/design/thresholds.md:22-23: evidenceTracksCheck at gold requires
      hasEvidence first (meta.yaml:139). meta-rule's rationale says silver
      adds evidence (meta.yaml:398-401), and the rule's source is L2 and D66
      (scorecards-for-scorecards.md:104).
summary: >-
  A well-formed presence check whose meaning matches its name and fix, and
  whose fix leads straight to a pass. It is cheap to game: a constant
  sentence passes silver, and gold's evidence-tracks-check lets that
  through for small checks or when `entity.name` is concatenated. Live, it
  fails only the six acme rules that have no evidence
  (.seikika/results.json).
