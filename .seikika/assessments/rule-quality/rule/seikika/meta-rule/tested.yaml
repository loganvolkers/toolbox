  - criterion: threshold-justified
    verdict: pass
    reason: >-
      docs/design/scorecards-for-scorecards.md records test omissions as a
      source of drift. packages/meta-scoring/fragments/catalog.yaml makes a
      fixture test a bronze requirement for a new rule.
