apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-ci-reliability/every-job-has-timeout
rubric: rule-quality
subjectHash: 971d5dda5061
assessor: {kind: agent, name: cursor-assessor-09, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The rule's name and fix say "set `timeout-minutes` on every job", and
      that is what the parse records: a job counts as bounded when it has a
      `timeout-minutes` key or is a reusable-workflow call (`uses:`), which
      GitHub doesn't let carry one
      (crates/seikika-connector-workspace/src/workflows.rs:254, 285). The live
      misses are real: ci.yml's rust, report-action, reference-portal, ui and
      typescript-builder jobs and release.yml's five dist jobs have no key,
      matching the five evidence entries per file in .seikika/results.json.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Only the key's presence is read (workflows.rs:254), never its value, so
      `timeout-minutes: 360`, which is GitHub's default and the very hang the
      rationale objects to
      (packages/github-actions/fragments/github-actions.yaml:431-433), passes,
      as does an expression or a larger number on a self-hosted runner. The
      cheapest pass changes nothing about how long a hung job holds a runner.
    suggestion: >-
      Record each job's numeric `timeout-minutes` in the workflow record and
      fail values at or above 360 (or above a `maxJobTimeout` parameter,
      justified in docs/design/thresholds.md); report expressions as unknown
      rather than bounded.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the list of job ids (`jobsWithoutTimeout`) and the fix
      names the key to add, so adding `timeout-minutes` to each listed job in
      ci.yml passes. One caveat: two of the live failures are in release.yml,
      which D01M7Y5VWNAWB8K1DNMY31KQPQ0 says is dist's generated bytes and not
      edited by hand (D98). The fix still works there (dist-workspace.toml:24
      allows dirty CI files), but it contradicts that decision, and no waiver
      covers this rule the way that decision waives the zizmor rules.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule has no number, only presence. Its source is ghalint's
      `job_timeout_minutes_is_required` policy, adopted as this rule
      (docs/design/github-actions-standards.md:59, 86). Bronze sits in the
      reliability ladder (docs/design/thresholds.md:57) as one of the floor
      items that keep a red or hung run bounded.
summary: >-
  A sound, cheap bronze rule borrowed from ghalint whose evidence and fix
  lead straight to a pass. Its weakness is that it reads only whether the
  key exists, so the 360-minute default it warns against satisfies it.
  release.yml fails it under a decision that forbids hand edits, so it
  needs either a waiver or a dist-side fix.
