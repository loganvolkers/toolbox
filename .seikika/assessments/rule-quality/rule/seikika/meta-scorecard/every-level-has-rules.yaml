apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-scorecard/every-level-has-rules
rubric: rule-quality
subjectHash: d4f7ea42f5ba
assessor: {kind: agent, name: cursor-assessor-02, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      rulesPerLevel counts the declared rules at each of the card's levels
      (crates/seikika-cli/src/meta.rs:221-230), and the check requires every
      level to have at least one (.seikika/standards/meta.yaml:611-613). That
      is "no empty level". The rationale misstates the harm, though. Scoring
      skips an empty level (crates/seikika-derive/src/lib.rs: 1272-1276). An
      empty top level is never granted. An empty middle level is jumped, so an
      entity goes from bronze straight to gold. It is not "granted to every
      entity that reaches the one below" (meta.yaml: 618-620). The check is
      still right: either way the level means nothing.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The cheapest fix is the right one: delete the empty level, a one-word
      edit the fix offers. A filler rule such as `check: "true"` would pass
      here, but costs a fix, rationale and test to clear meta-rule bronze, and
      then fails meta-rule's both-outcomes-on-fixtures at silver
      (meta.yaml:468-470).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists the empty levels (`['gold']` for
      scorecard:demo/sprawling, .seikika/tests/standards.test.yaml:290-297).
      Either fix, a rule at that level or dropping it from `levels`, makes the
      check true.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      "At least one rule" is the definition. Bronze is in the meta-scorecard
      ladder (docs/design/thresholds.md:60), and an empty level is the
      limiting case of the principle that gold must ask for what lower levels
      don't imply (thresholds.md:24-25).
summary: >-
  A sound structural check, cheap to satisfy honestly and pinned both ways
  (.seikika/tests/standards.test.yaml:290-297, 306-315). Its rationale
  describes the wrong mechanism. The derive code skips empty levels rather
  than granting them, so a middle level is jumped and a top level is
  unreachable. The rationale should be corrected. No live card fails it
  (.seikika/results.json).
