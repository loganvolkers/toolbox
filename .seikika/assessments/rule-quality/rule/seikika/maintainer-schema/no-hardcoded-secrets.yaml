apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-schema/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 10739ed361f7
assessor: {kind: agent, name: cursor-assessor-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      secretHits uses the shared shape list
      (crates/seikika-connector-workspace/src/specs.rs:77-79,
      crates/seikika-connector-workspace/src/hygiene.rs:16-27): AWS, GitHub,
      OpenAI/Anthropic, Stripe and Slack prefixes, private keys and URL
      passwords. It has no GitLab token shape, though this repo ships a GitLab
      connector whose config takes a `token`
      (crates/seikika-connector-gitlab/src/main.rs:4). A scratch schema with
      `"default": "glpat-abcdefghijklmnopqrst"` reported secretHits [].
      `default`, `examples` and `const` are where a credential would land in a
      schema, and the hygiene module itself calls these patterns "the floor,
      not the scanner" (hygiene.rs:5-7).
    suggestion: >-
      Add `glpat-`, Google `AIza` and JWT shapes to hygiene.rs (fixing every
      card that shares it), or feed gitleaks findings into a SARIF slot and
      have the rule read it.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      JSON has no string concatenation, so the split-prefix dodge that
      hygiene.rs:85-103 guards against in code can't happen here. A schema
      carrying a matched shape can pass only by removing it, which is the fix.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `path:line kind` (pinned as
      `schema/demo/unsafe.schema.json:4 aws-access-key` in
      .seikika/tests/standards.test.yaml:612-613), and the fix says to remove
      the credential (.seikika/standards/schemas.yaml:128-130). Removing that
      line passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze for credentials is the killer-item principle in
      docs/design/thresholds.md:19-21, 35 (D01M83G9F4EEGN1GTP14HEYB8B6).
      docs/design/schema-standards.md:62 still lists it at gold; that table is
      stale, not the rule.
summary: >-
  Correctly placed at bronze, with a precise evidence-and-fix loop, but
  its shape list misses GitLab tokens even though a GitLab connector ships
  here; a `glpat-` default passed on a scratch schema. Widening the shared
  hygiene patterns, or reading a real scanner's SARIF, would fix this card
  and its siblings.
