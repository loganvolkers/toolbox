at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check reads the trimmed root `title`
      (crates/seikika-connector-workspace/src/specs.rs:30), which is what the
      fix and rationale describe: the short name editors show
      (.seikika/standards/schemas.yaml:97-102). All four live documents have
      real titles, e.g. "Seikika portal manifest (v1alpha1)" in
      crates/seikika-model/schema/manifest.schema.json.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `titleChars > 0` (schemas.yaml:95) passes on one character. A scratch
      schema titled "x" passed through
      target/debug/seikika-connector-workspace. maintainer-site's title rule
      treats two characters as a placeholder (docs/design/thresholds.md:38).
    suggestion: >-
      Adopt a chosen floor such as 3 characters, as maintainer-site does, and
      record it in thresholds.md.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence says "no title" (schemas.yaml:96, pinned for
      schema/demo/partial in .seikika/tests/standards.test.yaml:594-595), and
      the fix names the root `title`. Adding one passes.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      D77 puts the title at silver
      (docs/decisions/D01M7W5BEAG0000000000000000.md), but no source says why
      it sits above the description, which costs the same and is at bronze
      (schemas.yaml:83-86). The scorecard's own rationale calls silver the
      level that "ties it to the code" (schemas.yaml:47); a title doesn't.
      docs/design/thresholds.md has no row for it, and
      docs/design/schema-standards.md:21 states the placement without a
      reason.
    suggestion: >-
      Move titled to bronze next to described (both identify the document),
      leaving silver to wired-in, or give the reason for silver in
      thresholds.md.
summary: >-
  The check reads the right field, but one character passes. Its silver
  placement has no stated reason and contradicts the card's rationale that
  silver ties a schema to the code. Moving it to bronze with a short
  length floor would make the ladder read cleanly.
