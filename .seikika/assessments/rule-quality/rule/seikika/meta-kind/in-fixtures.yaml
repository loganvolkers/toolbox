apiVersion: seikika.com/assessment/v1
entity: rule:seikika/meta-kind/in-fixtures
rubric: rule-quality
subjectHash: 28b00657a267
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      `fixtureEntities` counts the derived entities of the kind after the
      portal's fixtures are loaded (crates/seikika-cli/src/model.rs:110-122,
      172-176, 200). Passing means a map rule produced an entity in tests and
      the kind's computed fields ran on it. A kind fed by several map rules
      passes with any one of them: Crate from workspace/crate, runner/test and
      runner/clippy, and McpTool from runner/mcp-calls and surfaces/mcp-tool.
      docs/design/scorecards-for-scorecards.md:180 leaves per-map-rule
      coverage to meta-field's populated-in-fixtures, so the kind-level claim
      this rule makes is met.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The cheapest pass is one record of the mapped record kind in
      fixtures/<connector>.ndjson, which runs the map rule's `id` and `set:`.
      Doing that is doing the right thing. A record with empty `data` either
      raises a map.error diagnostic (crates/seikika-derive/src/lib.rs:349) or
      leaves the fields null, which populated-in-fixtures then reports.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      "Add fixture records that map to the kind"
      (.seikika/standards/meta.yaml:717-719), with evidence naming the kind
      and portal (meta.yaml:714-716). The kind's `map: - from:` names the
      connector and record, and fixtures have a single location
      (crates/seikika-store/src/lib.rs:173). kind:demo/Bare fails and
      kind:seikika/File passes in the fixtures
      (.seikika/tests/standards.test.yaml:805, 808).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      "At least one entity", at bronze. The ratchet comment says "a new kind
      must be in the fixtures and the tests" (meta.yaml:709), the card's
      rationale calls being exercised the floor (meta.yaml:698-700), and
      scorecards-for-scorecards.md:207 places it.
summary: >-
  A sound floor: passing means the kind's mapping and computed fields run
  in tests, and the cheapest pass is the honest one. It speaks for the
  kind as a whole, not for each of its map rules. That gap belongs to the
  scorecard's assessment.
