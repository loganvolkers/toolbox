apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-package/named
rubric: rule-quality
subjectHash: 56c87d973764
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The check is `entity.name != ''`
      (.seikika/standards/packages.yaml:63-72) over the trimmed `name` string
      (crates/seikika-connector-workspace/src/npm.rs:19). Any non-empty string
      passes, including names npm rejects: npm's package.json document
      requires a lowercase, URL-safe name of at most 214 characters
      (https://docs.npmjs.com/cli/v12/configuring-npm/package-json/). A
      scratch manifest named "My App" run through
      target/debug/seikika-connector-workspace came back with name "My App",
      so the rule passes it, yet the rationale's promise ("can be depended on
      or told apart") fails because npm and workspace tooling refuse it.
    suggestion: >-
      Have the connector emit `nameOk` against npm's name grammar (lowercase,
      no spaces or leading dot/underscore, URL-safe, at most 214 chars,
      optional @scope/), the way plugins.rs `name_ok` does for plugin names,
      and check `entity.name != '' && entity.nameOk`.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The cheapest way to clear 'no name' is to write a name in package.json,
      which is the fix (.seikika/standards/packages.yaml:65-69). A short
      placeholder such as "x" is still a valid npm identity, so the cheap
      route does what the rule asks; the grammar gap is a measurement gap,
      covered above.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is either the name or 'no name' (packages.yaml:66), and the
      fix names the file and field ("Set name in package.json"). The
      `packages/demo/unsafe` fixture fails with ['no name']
      (.seikika/tests/standards.test.yaml:552-554) and setting any name flips
      it, since the check reads only that field.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No numeric threshold. Bronze is where
      docs/design/package-standards.md:21 and :63 put identity, and D76
      (docs/decisions/D01M7W56B7R0000000000000000.md) decides that bronze is
      "a name, a private package or a version".
summary: >-
  A sound bronze floor whose check is weaker than its rationale: it proves
  a name exists, not that npm would accept it. "My App" passes. Adding the
  npm name grammar to the connector, as the plugin card already does for
  plugin names, would close the gap.
