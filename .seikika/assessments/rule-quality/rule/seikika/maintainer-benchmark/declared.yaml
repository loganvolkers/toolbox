apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-benchmark/declared
rubric: rule-quality
subjectHash: 58fe8e3b94d2
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check reads declarationGaps and unknownLayers
      (.seikika/standards/benchmarks.yaml:143-158): a non-empty question, at
      least one layer, every layer one of the four, and a status from the four
      in dx-benchmarks.md §6 (docs/design/dx-benchmarks.md:205-211). That is
      exactly the fix's list (benchmarks.yaml:263-266). Stages are named in
      the rationale (benchmarks.yaml:267-270) and in the §2 table
      (dx-benchmarks.md:65) but not in the fix, so leaving them out does not
      make a pass mean something other than the rule says; all 19 live entries
      name stages that exist in .seikika/sdlc/stages/ anyway.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Every benchmark has a question, layers and a status by the time anyone
      writes its README, so typing the real ones costs no more than a
      placeholder. `question: TBD` would pass, since nothing checks that the
      question is a sentence ending in `?` (benchmarks.yaml:147). But the
      bronze ratchet (benchmarks.yaml:257) only asks new entries for this, and
      all 19 live questions are real questions.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names each gap (`no question`, `no SDLC layer`, `unknown
      layer tester`, `unknown status x`; benchmarks.yaml:147-158, pinned by
      .seikika/tests/standards.test.yaml:1228-1233). The fix gives the allowed
      values for layers and status, so filling in the named fields in the
      entry's .seikika/benchmarks/<id>.yaml clears every item.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Bronze is where dx-benchmarks.md §6 puts it ("The
      question, the SDLC layers and the status are declared",
      docs/design/dx-benchmarks.md:224). The §2 reason, "a benchmark without a
      decision behind it is a demo" (dx-benchmarks.md:64), explains why it is
      the floor.
summary: >-
  A sound bronze rule. Its check, fix and the design's §6 bronze row match
  one to one, and the honest way to pass costs no more than a placeholder.
  The rationale mentions SDLC stages, which nothing checks; that gap is
  noted on the scorecard, not here.
