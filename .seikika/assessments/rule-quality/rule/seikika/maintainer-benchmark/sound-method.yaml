apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-benchmark/sound-method
rubric: rule-quality
subjectHash: 71dc706a1f47
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      For a run entry, the check needs both registrationGaps and runGaps empty
      (benchmarks.yaml:117-142, 366-373): protocol 2, prompts, three runs, a
      measure, an independent adjudicator, then frozenAt, spread and fitAudit.
      Those are P1-P7's catalog fields (docs/design/dx-benchmarks.md:158-167).
      Holding protocol-1 runs at silver is the design's stated intent: their
      results are "evidence of friction, not of a claim"
      (dx-benchmarks.md:155-157, :226). Of the 12 live failures
      (.seikika/results.json), 11 are protocol-1 runs. The twelfth is a real
      protocol-2 gap: actions-gitlab is complete but has no `fitAudit`
      (.seikika/benchmarks/actions-gitlab.yaml:45-65).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Every field is free text that nothing ties to a rerun. A protocol-1
      entry such as ratchet-replay could set `protocol: 2`, `deterministic:
      true` (which removes spread, prompts and runs; benchmarks.yaml:125-127,
      140-141), any `frozenAt`, `fitAudit: none` and two different names for
      designer and adjudicator, and reach gold without running again. frozenAt
      isn't checked to be a commit. fitAudit and spread are prose, though
      actions-ab's point at files (results/FIT-AUDIT.md, results/r8/;
      .seikika/benchmarks/actions-ab.yaml).
    suggestion: >-
      Have the connector check that `frozenAt` starts with a commit that `git
      cat-file -e` finds. Allow protocol 2 only when `ran` is on or after the
      date of D01M83RDWQ5EVKY5SFHDWAD5HFH. Add path fields for the fit audit
      and the spread table to `paths:` in .seikika/seikika.yaml, so they must
      exist.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix says to rerun under protocol 2 and record the frozen commit, the
      spread over three runs and the independent adjudicator's fit audit,
      "(dx-benchmarks.md §4.1)" (benchmarks.yaml:374-378). §4.1 also brings in
      prompts and the measure, which registrationGaps checks. The evidence
      names each remaining gap after the first step
      (.seikika/tests/standards.test.yaml:1212-1216). For the four archived
      protocol-1 entries, rerunning contradicts "won't be rerun"
      (dx-benchmarks.md:211), but the fix's last sentence accepts that they
      stay at silver.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Three runs is P2 (docs/design/dx-benchmarks.md:162,
      D01M83RDWQ5EVKY5SFHDWAD5HFH). Gold for a protocol-2 run is the §6 gold
      row and the §4.1 summary ("a run one must have recorded them (gold)",
      dx-benchmarks.md:169-171, :226). The rationale's 21-call drift is L12
      (dx-benchmarks.md:100).
summary: >-
  It is the scorecard's real quality bar and matches protocol 2 and its
  decision, and protocol-1 runs correctly stop at silver. Every field it
  reads is self-declared prose, so relabelling a protocol-1 entry as a
  deterministic protocol-2 run reaches gold without a rerun. Resolving
  `frozenAt` and making the fit audit a path would close that.
