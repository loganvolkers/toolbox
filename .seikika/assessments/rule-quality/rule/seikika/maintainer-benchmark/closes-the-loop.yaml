apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-benchmark/closes-the-loop
rubric: rule-quality
subjectHash: bbe3ed08aa6f
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      changeGaps (benchmarks.yaml:203-209) asks every complete or archived
      entry to list at least one change, which is §4 step 10's "link the fixes
      from the benchmark's catalog entry (`changed`)"
      (docs/design/dx-benchmarks.md:142-143). A run with no product fix can
      still pass honestly, because step 11 makes the decision that records a
      failed hypothesis a change too (dx-benchmarks.md:144-146). Unrun entries
      pass vacuously, and they are held below gold by results-recorded. All 19
      live entries pass.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `changed: [nothing]` passes, and so does a decision id that doesn't
      exist. Several live entries list ids such as D01M833YAH8MT4VY2W4K1PYAEHB
      (.seikika/benchmarks/connector-ab.yaml), but nothing checks that
      docs/decisions/<id>.md exists. The fixture's passing value is the
      generic "a DX fix" (.seikika/fixtures/workspace.ndjson:84), so the tests
      accept free text of any quality.
    suggestion: >-
      Have the connector report `unknownDecisions`: entries in `changed` that
      look like a decision id (`D` plus a ULID) but name no file under
      docs/decisions/. Add it to the check, and treat a free-text entry
      shorter than about four words as empty.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence says "nothing changed: link the fixes or decisions it
      produced" (benchmarks.yaml:208-209). The fix says to list "the friction
      fixes and the decisions it produced (dx-benchmarks.md §4, step 10)", and
      step 10 names the `changed` field (dx-benchmarks.md:143), so one entry
      in `changed` clears it (fail pinned at
      .seikika/tests/standards.test.yaml:1246).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. Gold matches §6 ("and what it changed in Seikika",
      docs/design/dx-benchmarks.md:226). L2 and L3 (dx-benchmarks.md:90-91)
      show friction fixes are the most useful output, which is why the loop is
      asked of a finished benchmark rather than a declared one.
summary: >-
  It measures the right thing at the right level, and its fix reaches the
  `changed` field through §4 step 10. Its weakness is that any string
  passes: decision ids aren't resolved and a one-word entry counts, so a
  check that cited decisions exist would make it hard to game.
