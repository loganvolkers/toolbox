entity: rule:seikika/maintainer-benchmark/method-registered
rubric: rule-quality
subjectHash: 61d11b432381
assessor: {kind: agent, name: cursor-assessor-08, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      For a designed or blocked entry, registrationGaps
      (benchmarks.yaml:117-130) checks the protocol-2 fields: protocol 2,
      prompts (P1), runsPerArm >= 3 (P2), measure (P6), and a designer plus a
      different adjudicator (P7). These are the §4.1 catalog-field columns
      (docs/design/dx-benchmarks.md:158-167) and the fix's list
      (benchmarks.yaml:333-337). The prompts path must exist via paths-exist
      (.seikika/seikika.yaml:174). The live failure is spec-ab, blocked under
      protocol 1, which really is unregistered. P2's five runs when a phase
      registers a cost hypothesis (dx-benchmarks.md:162) isn't enforced; the
      fix doesn't promise it.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Two cheap edits pass without registering anything. `deterministic: true`
      removes both the prompts and the runs requirement
      (benchmarks.yaml:125-127), although §4.1 says only benchmarks with no
      agent in the scored path may skip P2 (dx-benchmarks.md:171-172), and
      nothing checks that. P7 independence is a string comparison
      (benchmarks.yaml:129-130): `designer: agent A`, `adjudicator: a fresh
      agent` passes whoever wrote both. connector-ab's adjudicator text itself
      says "before that, the designer"
      (.seikika/benchmarks/connector-ab.yaml).
    suggestion: >-
      Allow `deterministic: true` only when the entry also has an empty
      `prompts` and the readme names the script that computes the result (a
      `commands:` field resolved like sdlc-stage's, data.rs:133-148). Require
      `adjudicator` to point at a committed adjudication file (a path field
      under `paths:`) rather than free text, so independence is backed by a
      record.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      For a protocol-1 entry, the evidence first shows only `protocol 1:
      re-register under protocol 2 (D01M83RDWQ5EVKY5SFHDWAD5HFH)`
      (.seikika/tests/standards.test.yaml:1225-1227). But the fix lists every
      field the next evaluation will ask for: protocol, prompts, three runs,
      measure, designer and adjudicator (benchmarks.yaml:333-337). Following
      it once clears every item in registrationGaps.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Three runs per arm is P2's number (docs/design/dx-benchmarks.md:162),
      decided in D01M83RDWQ5EVKY5SFHDWAD5HFH and grounded in L10 and L12
      (dx-benchmarks.md:98-100). Silver for an unrun benchmark is stated in
      §4.1 and §6 (dx-benchmarks.md:169-171, :225).
summary: >-
  The check matches protocol 2's catalog fields and the decision's
  three-run floor, and the fix is complete. Two edits game it: a
  self-declared `deterministic: true` skips prompts and runs, and any two
  different strings satisfy the independent adjudicator.
