apiVersion: seikika.com/assessment/v1
entity: rule:seikika/cli-skill/has-skill
rubric: rule-quality
subjectHash: c3a4e7172447
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The name and fix say the command has its own skill, but the check
      (.seikika/standards/cli.yaml:237) passes when any SKILL.md mentions
      `seikika <command>`, because documentedIn is every inbound
      mentionsCommand (cli.yaml:19-22, .seikika/standards/docs.yaml:48).
      Applying the capture regex (.seikika/seikika.yaml:111-114) to every
      skill under plugins/ shows 15 of the 34 commands from `seikika describe`
      are also named by other skills: `validate` by add-action, find-tools and
      vendor; `plan` by review-plan; `assess check` by assess-entity. Deleting
      plugins/seikika-operator/skills/validate/ would leave validate passing.
      Today every command does have its own skill, so the gap is latent. The
      reverse case is also possible: the nested parents are listed by hand in
      the regex (connector, token, tools, assess, describe), so a leaf under a
      new parent is captured as the parent alone and fails.
    suggestion: >-
      Require the mention to come from the command's own skill: a SKILL.md
      whose frontmatter `name` equals the command's slug, or one that declares
      the command in metadata (e.g. `metadata.command: tools find` for
      find-tools). Derive the nested parents in the capture from `seikika
      describe` instead of listing them in .seikika/seikika.yaml.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      The cheapest way to pass every command is one index SKILL.md that lists
      all 34 invocations. A passing aside in another skill also counts, such
      as "Do not run `seikika push` here". Nothing checks the flags and exit
      codes the fix asks for (cli.yaml:239-241), so a skill whose whole body
      is the bare invocation passes.
    suggestion: >-
      Same as above: count only the command's own skill. Add a silver rule
      that every `--flag` the skill names is in the command's `args`
      (cli.yaml:11), so the skill has to carry real usage.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the missing invocation (`missing skill for seikika
      push`, pinned in .seikika/tests/standards.test.yaml:62-69), and the fix
      names plugins/seikika-operator/skills/<slug>/SKILL.md. That path is in
      the docs glob `plugins/**/*.md` (.seikika/seikika.yaml:100), so the
      mention is captured on the next run. A leaf like `connector test` reads
      as `connector-test` after whitespace is joined with `-`
      (crates/seikika-connector-workspace/src/main.rs:406).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule has no number: at least one skill, at bronze, the card's only
      level. D94 and docs/design/cli-skills.md:10-13 give the reason: help
      text is loaded only once an agent already knows the command, while a
      skill is routed by its description. The ratchet keeps new commands at
      bronze (cli.yaml:233).
summary: >-
  The rule passes on any SKILL.md mention of the invocation, not on the
  command having its own skill. 15 of 34 commands are also mentioned by
  other skills, so the dedicated skill could go without this rule
  noticing. The fix and evidence are sound and every command passes today.
  The rule cannot see the flags or exit codes its fix asks for, and the
  hand-listed nested parents in the capture regex will under-count a new
  command group.
