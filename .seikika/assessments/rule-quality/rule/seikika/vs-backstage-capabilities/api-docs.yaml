apiVersion: seikika.com/assessment/v1
entity: rule:seikika/vs-backstage-capabilities/api-docs
rubric: rule-quality
subjectHash: a0cd8c25a823
assessor: {kind: agent, name: cursor-assessor-15, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      "Render an API's OpenAPI or AsyncAPI definition"
      (backstage-comparison.yaml:150) is the brief's "OpenAPI render" scenario
      (RESEARCH.md:118); Backstage meets it with plugin-api-docs
      (experiments/backstage-compare/facts.yaml:175) and Seikika records "no
      OpenAPI or AsyncAPI rendering"
      (experiments/backstage-compare/facts.yaml:87).
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `capApiDocs` is an assertion on
      experiments/backstage-compare/facts.yaml:87 that snapshot.py:85 merges
      unchecked; the harness never registers an API entity or asks either
      product to render one.
    suggestion: >-
      Add one API entity with a small OpenAPI document to the gen.py corpus
      and have surface.py fetch its rendered page on each arm, setting
      `capApiDocs` only when an operation from the document appears.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The fix relies on the UI extension contract (docs/v1-spec.md §7.6),
      which M5 lists but has not built (docs/v1-spec.md:68, "Not yet: ... the
      UI pages"), and it names no source for the definition: no connector or
      kind field that carries an OpenAPI document to the entity.
    suggestion: >-
      Spell out the chain: "Ingest the definition as a field of the API kind
      (git-files connector), render it on the entity page through a UI
      extension once v1-spec §7.6 lands, then update
      experiments/backstage-compare/facts.yaml and rerun snapshot.py."
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Boolean, no threshold; the bar "each capability true" is pre-registered
      (experiments/backstage-compare/README.md:53, ADJUDICATION.md:114).
summary: >-
  The scenario is right and the loss is real. The fix rests on an unbuilt
  UI extension contract and skips where the definition comes from, and the
  fact is an editable boolean rather than a rendered page the harness can
  check.
