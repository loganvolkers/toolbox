apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-plugin/no-secret-headers
rubric: rule-quality
subjectHash: c8d67b5ef995
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The spec rule is that plugins "MUST NOT embed credentials or other
      secrets in `headers`" and likewise in stdio `env` (Agent Plugins 1.0.0
      §7.2.1 and §9.2,
      https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md).
      `secret_shape` knows two shapes, `AKIA…` and `ghp_…`
      (crates/seikika-connector-workspace/src/plugins.rs:174-176), and `env`
      is not read. A scratch server with `"Authorization": "Bearer
      eyJhbGciOi…"` reported `headerSecrets: []`; so would an `X-Api-Key` hex
      string. Headers are never expanded (§7.2.1), so any literal
      credential-bearing header is a violation, which a name check finds
      better than a value shape.
    suggestion: >-
      Flag any header named Authorization, Proxy-Authorization, Cookie or
      matching `(?i)(api[-_]?key|token|secret)` with a non-empty value, plus
      `env` entries whose names match `(?i)(key|token|secret|password)`, and
      rename the rule `no-secret-config`.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Once a header is listed, the shapes it can match are also caught
      anywhere in mcp.json by the bronze no-hardcoded-secrets scan
      (plugins.rs:29-31 into hygiene.rs:17-18), so moving the value to `env`
      or `args` does not clear the card; removing it is the cheap path.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `<server> header <name>` (pinned as ['dev header
      Authorization'] at .seikika/tests/standards.test.yaml:704-706), which
      locates the value in mcp.json, and removing it empties the list.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      Gold should ask for what lower levels don't already imply
      (docs/design/thresholds.md:23-24). The two shapes in `secret_shape` are
      a subset of hygiene.rs's patterns (`\b(?:AKIA|ASIA)…`, `\bgh[pousr]_…`,
      hygiene.rs:17-18), which the bronze no-hardcoded-secrets rule already
      runs over the whole of mcp.json, so a plugin that fails this rule has,
      bar word-boundary edge cases, already failed bronze. It is also a
      credential rule, which thresholds.md:35 puts in the floor; D81 placed it
      at gold before that change.
    suggestion: >-
      After widening the check as above, move it to bronze beside
      no-hardcoded-secrets (or fold it in), and add its row to
      docs/design/thresholds.md.
summary: >-
  The spec's "no secrets in headers" is the right standard, but this check
  recognises only two token shapes the bronze secret scan already catches,
  so at gold it adds nothing. It misses bearer tokens, API keys and `env`.
  Check header and env names, not value shapes, and move it to the floor.
