apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-plugin/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 2cac3bdf758d
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      plugin.json and mcp.json go through the shared shape detector
      (crates/seikika-connector-workspace/src/plugins.rs:29-34,178-184 ->
      hygiene.rs:17-26). In a plugin, credentials sit in mcp.json values:
      stdio `env` and HTTP `headers`, both of which the spec forbids from
      carrying secrets (Agent Plugins 1.0.0 §7.2.1 and §9.2,
      https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md).
      Most real tokens there have no fixed prefix the detector knows: a
      scratch mcp.json with `"env": {"API_KEY": "<40 hex chars>"}` and a
      Bearer JWT header reported `secretHits: []`. hygiene.rs:5-7 calls the
      shapes a floor, but this rule's fix and rationale
      (.seikika/standards/plugins.yaml:165-170) speak of any credential.
    suggestion: >-
      Since the spec allows no secret in `env` or `headers` and expands only
      PLUGIN_ROOT/PLUGIN_DATA, flag any literal value of an env key or header
      whose name matches `(?i)(key|token|secret|password|auth)` in addition to
      the shapes.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      A hit is `file:line kind` (['mcp.json:6 aws-access-key'] at
      .seikika/tests/standards.test.yaml:709-710). JSON offers no
      concatenation, so the only way to clear a matched shape is to edit that
      line, and the cheap edit is removing the credential.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names both files and the evidence names the line
      (plugins.yaml:165); deleting the matched value empties `secretHits`. The
      evidence carries the bare file name (plugins.rs:178-183) rather than the
      plugin path, but the entity id `plugin:<dir>` gives the directory.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze is justified in docs/design/thresholds.md:35 (credential rules
      are killer items, moved to the floor by D01M83G9F4EEGN1GTP14HEYB8B6),
      which the rule links, and the rationale states the ratchet reason
      (plugins.yaml:168-170). docs/design/plugin-standards.md:50 still lists
      it at gold; the design doc lags.
summary: >-
  Right level and good evidence, but a generic shape scan is weak for
  plugins, whose secrets are opaque values in `env` and `headers`. The
  spec bans any secret there, so a name-based check on those two maps
  would catch what the shapes miss. plugin-standards.md still shows the
  rule at gold.
