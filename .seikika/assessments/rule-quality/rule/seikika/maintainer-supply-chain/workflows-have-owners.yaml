apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-supply-chain/workflows-have-owners
rubric: rule-quality
subjectHash: b04234a1ea4a
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rule is about workflow changes, but the check tests one path,
      `.github/workflows/ci.yml`
      (crates/seikika-connector-workspace/src/repo.rs :184-197), so
      `/.github/workflows/ci.yml @x` passes while release.yml, whose jobs hold
      `contents: write`, has no owner. The matcher handles a subset of the
      syntax (repo.rs:199-220). An unanchored `workflows/` or `*.yml`, which
      GitHub matches at any depth, reads as uncovered, and a `**` pattern
      never matches. And in this repository, which commits straight to main
      (D32), CODEOWNERS requests no review at all; the rationale's "should
      reach a named owner for review" holds only for pull requests.
    suggestion: >-
      In workflow_owned, require the last matching rule to name an owner for
      every tracked file under .github/workflows/ (listing the uncovered ones
      as evidence), and match CODEOWNERS patterns as gitignore does
      (unanchored and `**`). Say in the rationale that it requests review on
      pull requests only.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Any non-empty owner list passes (repo.rs:193): `* nobody` or a team that
      doesn't exist satisfies it, though GitHub ignores owners without write
      access. The same file already has `owners_ok` (repo.rs:108-116), which
      at least requires `@` handles, but this check doesn't use it. A
      catch-all naming a placeholder is cheaper than choosing a real owner.
    suggestion: >-
      Require the matching rule's owners to pass owners_ok, and, where the
      github connector runs, that each owner has write access, as GitHub
      requires for a code owner to be requested.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix names the file and the pattern to use, and says a catch-all
      works (.seikika/standards/repository.yaml:107-109). `/.github/ @owner`
      or `*` passes through the directory and catch-all branches of
      codeowners_matches, as this repository's `.github/ @loganvolkers` does
      (.github/CODEOWNERS:2).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Silver is D85's placement, the rationale cites GitHub's
      secure-use guidance on CODEOWNERS for workflows (repository.yaml
      :110-116), and D01M82E93XAPNE0WFXEPJZ59WG4 §2 keeps it because Scorecard
      has no `--local` equivalent.
summary: >-
  A useful silver rule with a clear fix, but it checks that one file,
  ci.yml, has a CODEOWNERS match with any owner string. Other workflows,
  placeholder owners and gitignore-style patterns are misjudged, and in a
  repository that commits to main the owner is never asked to review.
