apiVersion: seikika.com/assessment/v1
entity: rule:seikika/user-cli/args-described
rubric: rule-quality
subjectHash: b0a4f588cbfe
assessor: {kind: agent, name: cursor-assessor-14, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      Every argument of the command whose clap help is empty is listed
      (crates/seikika-cli/src/main.rs:1215-1227), and that help is what
      `--help` shows beside each flag, with clap adding defaults and env vars.
      For the read commands, four of each command's arguments come from the
      flattened `Remote` struct (main.rs:416-429), so one comment there covers
      `--url`, `--token`, `--as` and `-o` for all 12. A pass means what the
      rationale (.seikika/standards/cli.yaml:194-196) asks for.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Any non-empty help passes, with no floor like has-help's (cli.yaml:168).
      The live bar is already low: `explain`'s `<ID>` reads "Entity id" while
      `get`'s reads "Entity id, e.g. repository:payments-api", and `explain
      --field` reads "Field to explain", which repeats the flag. `/// x` on a
      new `--kind` flag would pass too.
    suggestion: >-
      Have `seikika describe` flag help shorter than 10 characters or equal to
      the argument's name, and fail on it. For read commands, consider taking
      each flag's help from the MCP input description it fills
      (crates/seikika-api/src/mcp.rs), so the two can't drift.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists argument ids per command (the fixture's `owner` lists
      `id`, .seikika/fixtures/surfaces.ndjson:3), and a `///` on that field in
      the command's variant in main.rs, or on `Remote` for the shared flags,
      makes it pass. The fix names no file, but every user command's arguments
      are in main.rs.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Silver is set in docs/design/seikika-for-seikika.md:106,
      above has-help and structured output, which fits the prerequisite
      principle (docs/design/thresholds.md:22-23): finding and parsing a
      command comes before using each of its flags.
summary: >-
  It measures what its name says and is easy to satisfy correctly, since
  `Remote` carries most read-command flags. Any non-empty help counts,
  though, and "Entity id" versus the fuller text on `get` shows the bar
  already drifting between commands that take the same argument.
