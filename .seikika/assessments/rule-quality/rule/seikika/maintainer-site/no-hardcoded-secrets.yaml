apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-site/no-hardcoded-secrets
rubric: rule-quality
subjectHash: 9199f343d0ea
assessor: {kind: agent, name: cursor-assessor-13, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      `secretHits` comes from the shared detector, run in text mode
      (crates/seikika-connector-workspace/src/site.rs:222-224,
      hygiene.rs:110-112). It knows nine shapes: AWS keys, GitHub tokens,
      `sk-ant/proj/live`, Stripe, Slack, PEM private keys and URLs with a
      non-placeholder password (hygiene.rs:13-33). A docs page showing a
      Google API key (`AIza...`), an npm token (`npm_...`), a JWT or a legacy
      OpenAI `sk-...` key passes. The detector's own header calls these
      patterns "the floor, not the scanner" (hygiene.rs:5-7), yet the rule's
      name and rationale promise a page free of credentials
      (.seikika/standards/site.yaml:131-141). docs/design/site-standards.md:51
      still describes only the AKIA and ghp_ shapes, an older and narrower
      floor.
    suggestion: >-
      Put gitleaks in the box through the SARIF slot (packages/sarif already
      names it, seikika-package.yaml:7) over npm/site/src/content/docs, and
      have this rule read its findings. Or at least add the `AIza`, `npm_`,
      JWT and `sk-` shapes to hygiene.rs. Update site-standards.md:51 to
      match.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Once a line is flagged, deleting the credential is both the cheapest
      route and the right one. Disguising it, for example by shortening the
      token or splitting it across lines, takes no less effort. Text mode
      skips the split-literal check (hygiene.rs:87), which matters for code
      rather than prose. The rationale tells the reader that the credential
      must be revoked as well (site.yaml:138-141).
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `path:line kind` for each hit (hygiene.rs:82). The fix
      says to remove that credential (site.yaml:135-137), which empties
      `secretHits`. The fixture unsafe.md with a `ghp_` token shows the
      evidence (.seikika/tests/standards.test.yaml:780). Revocation is in the
      rationale rather than the fix, but the rule doesn't need it to pass.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Zero hits at bronze is set by docs/design/thresholds.md:38 under
      D01M83G9F4EEGN1GTP14HEYB8B6: a credential is a killer item, and at gold
      it would pass the bronze ratchet. D91 and site-standards.md:25 still
      place "no secret shape" at gold. That predates the move and should be
      updated, but the current level has a stated source.
summary: >-
  Correctly placed at bronze, with a fix that works. What it catches is
  narrower than its name: nine credential shapes, so common tokens such as
  Google API keys and npm tokens pass on a page published to GitHub Pages.
  The site design doc still describes the older, narrower patterns and the
  old gold placement.
