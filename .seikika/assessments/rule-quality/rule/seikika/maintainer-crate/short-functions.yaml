apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-crate/short-functions
rubric: rule-quality
subjectHash: 29c7f7b29dcb
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale is about functions short enough to read in one sitting
      (.seikika/standards/crates.yaml:308-311). But `longFunctions`
      (crates.yaml:98-103) reads the same span-based `lines`
      (crates/seikika-connector-workspace/src/rust.rs:70-72), which starts at
      the first `///` or attribute. At 80 lines that matters.
      seikika-connector-workspace is at gold with its longest function at 79
      (src/portals.rs:74, undocumented), so one doc line would drop the crate
      to silver. On a scratch crate, a 73-line function went to 85 with 12 doc
      lines. So the gold rule fails functions for being documented, which
      pulls against gold's fully-documented on the same card.
    suggestion: >-
      Count body code lines only, from `{` to `}` and excluding blank and
      comment lines, as clippy's `too_many_lines` does. Put the `fn` line in
      `at`.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Nine crates fail today (brief facts: live fail 9), several by a few
      lines: seikika-exec's change_run is 115 lines including its 3 doc lines
      and an `#[allow]` (crates/seikika-exec/src/executor/change.rs:337-451).
      A function's `lines` is its whole span, doc comments, attributes and
      blank lines included
      (crates/seikika-connector-workspace/src/rust.rs:70-72, :163), so a
      function at 81 to 90 lines can be brought under by deleting its doc
      comment and blank lines, which is cheaper than splitting it and makes it
      harder to read. For private functions no documentation rule notices the
      loss.
    suggestion: >-
      Same change as above. Until it lands, add a fixture where a documented
      78-line body passes, so the rule's intent is pinned.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence lists each function over 80 as `name at file:line: N
      lines`. The fixture pins three for seikika-derive
      (.seikika/tests/standards.test.yaml:82-86) and the `Pipeline::run at
      src/lib.rs` prefix (lines 31-34). The fix states the bound and says to
      split (crates.yaml:307). Each extracted function is measured on its own,
      so splitting passes.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      "No function > 80 lines" is v0's gold in
      docs/design/seikika-for-seikika.md:89-90 and :103, with no reason.
      docs/design/thresholds.md has no row for it. The linked clippy
      `too_many_lines` (crates.yaml:312-314) defaults to 100 body code lines
      (https://doc.rust-lang.org/clippy/lint_configuration.html), which is
      looser than 80 and measured more narrowly, so the link doesn't support
      the number.
    suggestion: >-
      Add a thresholds.md row for 80. Measure from the workspace records, or
      label it chosen with the reason, and say how it relates to clippy's 100.
summary: >-
  Good gold intent and actionable evidence. But function length includes
  doc comments and attributes, so at 80 lines the rule fails functions for
  being documented. Deleting docs is the cheapest pass, which works
  against gold's own fully-documented. The number has no recorded reason,
  and the clippy lint it links uses 100.
