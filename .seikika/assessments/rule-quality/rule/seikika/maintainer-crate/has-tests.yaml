apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-crate/has-tests
rubric: rule-quality
subjectHash: 0b84033f7e01
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Helper asserts and `?` now count, but the resolution is by bare name
      within one file. Helpers are collected per file
      (crates/seikika-connector-workspace/src/rust.rs:433, 453), so a test
      whose check lives in another module or in tests/common/mod.rs (the Rust
      Book's pattern for integration tests) is listed as asserting nothing. So
      is one using `anyhow::ensure!` or `prop_assert_eq!`, because only macros
      named `assert*`/`debug_assert*`, `panic` and `unreachable` count
      (rust.rs:214-223). The reverse also happens: every non-test function in
      the file whose body unwraps is a helper (rust.rs:255-290), matched on
      the last path segment (rust.rs:230, 237-246). On a scratch crate run
      through target/debug/seikika-connector-workspace, `let v: Vec<i32> =
      Vec::new();` counted as an assert because an unrelated `Cfg::new` in the
      same file unwraps. None of the 15 live crates hits these today (no
      proptest, `ensure!` or tests/common under crates/), so the misfires are
      latent.
    suggestion: >-
      Collect helpers per crate rather than per file (including tests/common),
      and resolve a call by its path rather than its last segment. Count
      `ensure!`, `prop_assert*` and `bail!` as checks. Only count a production
      function as a helper when it is called from test code and asserts, not
      merely unwraps.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `assert!(true)` and `assert_eq!(x, x)` are now rejected
      (rust.rs:184-211), but `#[test] fn smoke() {
      "1".parse::<i32>().unwrap(); }` still counts: any
      `.unwrap()`/`.expect()` is an assert (rust.rs:225-235). A scratch crate
      whose only test is that line, with a broken `add` returning `a - b`,
      reported unitTests 1 and testsWithoutAsserts [] from the connector, so
      has-tests passes (.seikika/standards/crates.yaml:178-193), and `cargo
      test` passes too. `assert!(1 == 1)` and `Some(x).unwrap()` also count.
      tests-scale-with-code counts the same tests (crates.yaml:194-210), so
      padding with such tests passes silver.
    suggestion: >-
      Count an assert, unwrap or `?` only when the expression reaches an item
      the crate defines (a `crate::`/`super::` path, a `use`d crate item, or
      the crate's name in tests/). Treat an assert whose condition contains no
      identifiers as trivial. For a measure that can't be gamed this way, put
      cargo-mutants' missed-mutant count in a slot and let a rule read it.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is either `no #[test] in src/ or tests/` or each test as
      `path (file:line) asserts nothing` (crates.yaml:183-185,
      rust.rs:145-151). The fix says to add a #[test] or give each listed test
      an assert (crates.yaml:186-189). A direct non-trivial `assert!` in the
      listed test passes, whatever caused the listing, including the
      cross-file and `ensure!` cases above.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The number is "at least one test, and every test asserts", with no
      allowance. docs/design/thresholds.md:36 states it at bronze as a
      principle with a measurement: a test with no assert passes whatever the
      code does, and on 2026-11-23 two tests here asserted nothing. That row
      describes the current checker (same-file helpers, trivial asserts). The
      size-relative bar is the separate silver rule, justified at
      thresholds.md:37.
summary: >-
  Re-assessed after the rule gained a rationale: its check, evidence, fix
  and level are the same as on main, as is the code the reasons cite, so
  the verdicts stand; crates.yaml line numbers are updated for the
  scorecard's title, rationale, links and track and the rule rationales
  inserted above them. The rationale states the why without claiming more
  than the check sees. The checker now counts same-file helpers and `?`,
  and rejects `assert!(true)` and `assert_eq!(x, x)`. It still resolves
  helpers per file and by bare name, so cross-file, `ensure!` and
  `prop_assert!` checks are missed and an unrelated unwrapping `new` makes
  `Vec::new()` count. A lone `"1".parse::<i32>().unwrap()` still passes
  the rule on a broken crate.
