apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-crate/tests-pass
rubric: rule-quality
subjectHash: 805f15bb72c8
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The check needs a passing run with no ignored and no compiled-out test
      (.seikika/standards/crates.yaml:213-215). The previous gap is closed:
      the runner's test job now sets SEIKIKA_REQUIRE_OPENFGA=1
      (.seikika/seikika.yaml:255-265), as CI does
      (.github/workflows/ci.yml:49), so the two tests that used to return
      early without OpenFGA fail instead
      (crates/seikika-authz/tests/fga.rs:59-68,
      crates/seikika-api/tests/authz.rs:21-27). No other test in
      crates/*/tests skips itself. Short of deliberate evasion (see
      hard-to-game), passing means every test ran and passed.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      `#[ignore]`, `#[cfg(any())]` and `#[cfg(not(all()))]` are closed, but
      is_cfg_disabled matches only those two exact spellings
      (crates/seikika-connector-workspace/src/rust.rs:51-59). `#[cfg(miri)]`
      or `#[cfg(windows)]` on a failing test is just as cheap: cargo never
      compiles it on the Linux runner, parse_cargo_test calls exit 0 `pass`
      (crates/seikika-connector-runner/src/main.rs:93-107), and neither name
      trips rustc's unexpected_cfgs lint, so clippy-clean stays green too. An
      early `return` behind a condition (an environment check like the one the
      OpenFGA tests had) also passes, and has-tests still counts the test.
    suggestion: >-
      Flag any `#[test]` (or its module) gated by a cfg other than `test` in
      disabledTests, unless the cfg is a declared feature. Better, have the
      rule compare the runner's passed+failed+ignored count for unit and
      integration suites (doc-tests apart) with the workspace's unitTests +
      integrationTests, so a test cargo didn't run shows up whatever hid it.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The fix's `cargo test -p <crate>` is the runner's command
      (.seikika/seikika.yaml:258-264). The evidence carries the counts, the
      last 2000 characters of output on failure
      (crates/seikika-connector-runner/src/main.rs:108-112) and each
      compiled-out test with its file and line (rust.rs:134-141). The fix
      names all three removals: failures, `#[ignore]`, the always-false
      `#[cfg(...)]`, and says to install OpenFGA (SEIKIKA_OPENFGA_BIN) since
      the runner requires it (.seikika/standards/crates.yaml:222-227).
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      Bronze with no ignored or compiled-out test is a stated principle in
      docs/design/thresholds.md:38 ("An ignored test never runs, nor does one
      under `#[cfg(any())]`"), which also records the OpenFGA requirement.
      There is no other number. The fixture pins the fail outcome with both an
      ignored and a compiled-out test
      (.seikika/tests/standards.test.yaml:1270-1273).
summary: >-
  Re-assessed after the rule gained a rationale: its check, evidence, fix
  and level are the same as on main, as is the code the reasons cite, so
  the verdicts stand; line numbers are updated for the rationale lines
  inserted above them. The rationale states the why without claiming more
  than the check sees. The runner now requires OpenFGA, so the rule and CI
  agree, and ignored or `#[cfg(any())]` tests fail it. Hiding a failing
  test behind any other always-false cfg on Linux (`miri`, `windows`)
  still passes.
