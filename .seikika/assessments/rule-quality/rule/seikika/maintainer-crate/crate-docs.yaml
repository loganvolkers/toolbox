apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-crate/crate-docs
rubric: rule-quality
subjectHash: 320d0c425610
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The fix asks for docs saying "what it is and which spec section it
      implements" (.seikika/standards/crates.yaml:171-173). But `crateDoc` is
      true when the entry file has any inner `doc` attribute
      (crates/seikika-connector-workspace/src/rust.rs:40-42, 430-432). A bare
      `//!` passes, and so would `#![doc(html_root_url = "...")]`. On a
      scratch crate through target/debug/seikika-connector-workspace, a lib.rs
      whose only doc was an empty `//!` reported `crateDoc: true`. Only one
      entry is read, the lib target or else the first bin
      (crates/seikika-connector-workspace/src/main.rs:536-553), so a crate
      with both doesn't need to document its binary's main.rs.
    suggestion: >-
      Have the connector report the crate doc's text, or its word count, and
      check that it is at least one sentence and names a spec section (for
      example `docs/v1-spec.md` or `§`). Add a fixture crate with an empty
      `//!` that fails.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      An empty `//!` line at the top of src/lib.rs passes, as the scratch run
      above showed. That costs less than writing what the crate is. The rule
      is also untested: all three fixture crates pass it (brief facts: fixture
      pass 3, fail 0; .seikika/fixtures/workspace.ndjson), and
      .seikika/tests/standards.test.yaml only asserts that it is absent from
      seikika-derive's evidence (lines 89-93). So a regression in `crateDoc`
      would go unnoticed.
    suggestion: >-
      Same change as above (a minimum length, a spec reference), plus a
      fixture crate with `crateDoc: false` and a test pinning the evidence
      `crate <name> has no //! crate doc`.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names the crate (crates.yaml:170). The fix names the exact
      file to edit, `src/lib.rs` or `src/main.rs`, and the syntax, `//!`
      (crates.yaml:171-173). Following it sets `crateDoc` true on the next
      resync.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no threshold, only present or absent. Bronze is justified in
      the rationale: the crate doc is what a reader sees first when deciding
      whether to touch a crate (crates.yaml:174-177).
      docs/design/seikika-for-seikika.md:103 places "Crate docs" in v0's
      bronze. All 17 live crates already pass, so the floor costs nothing
      today.
summary: >-
  The right first rule with a precise fix, but it checks only that some
  `doc` attribute exists. An empty `//!` passes, and no fixture ever fails
  the rule. It should check for content the fix asks for (a sentence and a
  spec section), with a failing fixture.
