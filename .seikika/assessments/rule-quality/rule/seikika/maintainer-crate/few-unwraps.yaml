apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-crate/few-unwraps
rubric: rule-quality
subjectHash: 3eb05161e369
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The rationale is about calls that panic outside tests
      (.seikika/standards/crates.yaml:338-341). The count is every method call
      named `unwrap` or `expect` that syn sees outside test code
      (crates/seikika-connector-workspace/src/rust.rs:356-361). syn does not
      parse macro arguments, so unwraps inside `vec![]`, `format!` or `json!`
      are missed: a scratch crate with three such unwraps reported one.
      `panic!`, `unreachable!` and `unwrap_or_else(|_| panic!())` aren't
      counted at all. The denominator `codeLines` counts every non-blank,
      non-`//` line in src/ (rust.rs:375-382), including inline `#[cfg(test)]`
      modules, though the fix says "outside tests". Adding a test module to
      the scratch crate raised it from 96 to 107. And 7 of
      seikika-connector-scim's 9 counted calls are `Mutex::lock().unwrap()`
      (src/main.rs:67-174), the usual way to handle lock poisoning, which is
      already a deliberate invariant.
    suggestion: >-
      Count only src/ lines outside `#[cfg(test)]` in the denominator. Count
      `panic!`/`unreachable!`/`todo!`, and unwraps found inside macro
      arguments (by parsing the tokens as expressions where possible). Either
      exempt `lock().unwrap()`, or say in the rationale why it counts.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      Wrapping a call in a macro hides it: `format!("{}", x.unwrap())` is not
      counted (scratch run above), because only method calls syn parses are
      visited (crates/seikika-connector-workspace/src/rust.rs:356-361). So
      does `let Some(v) = x else { panic!() }`, which crashes the same way.
      Adding inline tests raises `codeLines` and so the allowance, since every
      non-blank, non-comment line counts
      (crates/seikika-connector-workspace/src/rust.rs:377-382). Each of these
      is cheaper than returning an error, and none removes a panic.
    suggestion: >-
      Count every panic site, including `panic!` and `unreachable!` and calls
      inside macros, against a denominator that excludes test code. Pin these
      with a fixture crate where `format!("{}", x.unwrap())` and `let ... else
      { panic!() }` count.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      The evidence is only a count, `9 unwrap/expect calls in 269 lines`
      (crates.yaml:332-334), with no file or line, unlike every other
      maintainer-crate rule. The fix offers "return errors or document the
      invariant" (crates.yaml:335-337), but documenting an invariant in a
      comment or an `expect("...")` message leaves the count unchanged
      (rust.rs:357). For scim, which fails only this rule on its way to gold
      (.seikika/results.json), an agent has to find 7 of the 9 call sites by
      grepping, and then restructure the mutex handling.
    suggestion: >-
      Have the connector emit `unwrapSites` (`file:line`) and make that the
      evidence. Reword the fix to say what lowers the count: return a
      `Result`, use `unwrap_or_else(PoisonError::into_inner)` for locks, or
      restructure. A comment does not.
  - criterion: threshold-justified
    verdict: fail
    reason: >-
      "≤ 1 unwrap per 100 lines" is stated in
      docs/design/seikika-for-seikika.md:103 with no reason given.
      docs/design/thresholds.md has no row for it. The linked Rust Book
      chapter (crates.yaml:342-344) explains when to panic and gives no ratio.
      Live ratios run from 0 to 3.35 per 100 lines (scim), and two crates
      fail, but no measurement places the line at 1.
    suggestion: >-
      Add a thresholds.md row: either the measured distribution (the connector
      already reports `unwraps` and `codeLines` for every crate) or "chosen",
      with the reason. Once the denominator excludes tests, remeasure.
summary: >-
  The weakest rule on the card. The count misses panics in macros and
  `panic!` itself, the denominator includes test code, and the evidence
  has no locations. Its fix suggests documenting the invariant, which
  changes nothing it measures. The 1-in-100 ratio has no stated source,
  and the live failure in scim is mostly the standard `lock().unwrap()`
  idiom.
