apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-ci-security/pinned-to-sha
rubric: rule-quality
subjectHash: de3a829c7aee
assessor: {kind: agent, name: cursor-assessor-12, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      Only `uses:` values are read
      (crates/seikika-connector-workspace/src/workflows.rs:243-251); a job's
      `container:` image and `services.*.image` never are. So a workflow with
      `container: node:20` passes, though a tag on an image moves just as a
      tag on an action does, which is the rationale's whole point
      (packages/github-actions/fragments/github-actions.yaml:258-261). zizmor
      1.32.0 --offline didn't flag `container: alpine:3` on a scratch workflow
      either. Local `./…` refs also count as pinned (workflows.rs:16-18, 292),
      and the globs only take `actions/*` (.seikika/seikika.yaml:126), so an
      unpinned `uses:` in a composite action under .github/actions/ is never
      seen.
    suggestion: >-
      Have workflows.rs also record job `container` and `services` images with
      their pin (`docker-digest` vs `docker-tag`) in `unpinned` and
      `unpinnedAt`, and widen the workflows globs (and the zizmor job's
      `files`) to `.github/actions/**/action.y*ml`.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      The check reads the connector's own parse, not zizmor, so an inline `#
      zizmor: ignore[unpinned-uses]` doesn't silence it. A made-up 40-hex SHA
      passes (`pin`, workflows.rs:26-27) but breaks the run, so the cheap
      route is a real SHA, which the fix's `git ls-remote` gives.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence names each unpinned ref and its line, pinned by
      .seikika/tests/standards.test.yaml:120-131, and the fix gives the
      command and the annotated-tag peel. One gap: `unpinnedAt` comes from a
      line scan for `uses:` (workflows.rs:196-213) while the check reads the
      parsed YAML, so a flow-style step `- {uses: actions/checkout@v4}` failed
      on a scratch workflow with empty evidence. The fix still says to pin
      every `uses:`, so following it passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      No number. Bronze matches D70, docs/design/github-actions-standards.md
      :81 (GitHub secure use, Scorecard Pinned-Dependencies, zizmor
      unpinned-uses), and the floor principle in docs/design/thresholds.md
      :19-21: a moved tag runs new code with the token.
summary: >-
  A sound floor rule that zizmor ignores can't silence, with an actionable
  fix and line-level evidence. It sees only `uses:`, so tag-pinned job
  containers and service images pass, and so does anything run through a
  composite action outside `actions/*`. The evidence line scan misses
  flow-style steps.
