apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-connector/names-its-kinds
rubric: rule-quality
subjectHash: c237aa9f9467
assessor: {kind: agent, name: cursor-assessor-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      documentedKinds includes every `"kind": "<x>"` string anywhere in the
      crate, tests included
      (crates/seikika-connector-workspace/src/connectors.rs:163-171). On this
      repo that lists `dev` for the workspace connector (a Cargo dependency
      kind in a test, crates/seikika-connector-workspace/src/deps.rs:145) and
      `syntax-check` for the runner (an actionlint finding in a test,
      crates/seikika-connector-runner/src/lint.rs:337). Neither is a record
      kind. The check also needs only one kind
      (.seikika/standards/connectors.yaml:116), so a connector that names one
      of three kinds passes, while the rationale says an operator must declare
      all of them (:122-125).
    suggestion: >-
      Collect kinds from production code only (skip `#[cfg(test)]`, as
      secrets() does via production_lines), drop the `"kind":` pattern or
      limit it to record payloads, and compare the named kinds with the
      `capabilities` the connector registers.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      genericKinds is set when the crate doc contains "kind `<" or "declares
      their `kinds`" (crates/seikika-connector-workspace/src/connectors.rs:
      173-175). A scratch crate whose doc said "See also `kind `<x>`" reported
      genericKinds true and passed with no kind named at all. Any `"kind":
      "x"` in a test also passes, because documented_kinds scans every source
      file joined, tests included (connectors.rs:21-25, :137-145).
    suggestion: >-
      Accept genericKinds only when the source reads kinds from config (for
      example, a `kinds` field in its config struct), not when the doc
      contains a phrase.
  - criterion: fix-leads-to-pass
    verdict: fail
    reason: >-
      For a generic runner the fix says to write in the crate doc "that kinds
      come from the job config" (connectors.yaml:119-121), but that sentence
      matches neither pattern the check accepts (connectors.rs:173-175). The
      runner passes only because its doc happens to contain the exact phrases
      (crates/seikika-connector-runner/src/main.rs:9, 11). A record call with
      a constant, `out.record(KIND, ...)`, follows the fix and still fails,
      because only a string literal is matched (connectors.rs:165).
    suggestion: >-
      Quote the accepted forms in the fix (a `record("<kind>"` literal, a doc
      bullet ``- `<kind>` ``, or the exact generic-kinds phrase), or widen the
      check to match the fix's wording.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      "At least one" is D73's "named record kinds" at silver
      (docs/decisions/D01M7W4FRJR0000000000000000.md), and
      docs/design/connector-standards.md:21, 83 places protocol shapes at
      silver.
summary: >-
  Fails three criteria. The kind list is polluted by test fixtures (`dev`
  and `syntax-check` show up as kinds on this repo), one kind is enough
  even when others go unnamed, and the generic-runner escape is a phrase
  match that the fix's own wording doesn't satisfy. The level is decided.
