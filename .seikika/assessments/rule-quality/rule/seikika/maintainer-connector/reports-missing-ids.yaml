apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-connector/reports-missing-ids
rubric: rule-quality
subjectHash: e6d5f34a214b
assessor: {kind: agent, name: cursor-assessor-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      reportsNotFound is `source.contains("not_found")` over the crate's
      joined text (crates/seikika-connector-workspace/src/connectors.rs:41),
      so any identifier containing the word counts, such as a local
      `not_found` flag, an `is_not_found()` helper or a test name. None of
      those is a refresh that admits an id is gone, which is what the
      rationale needs (.seikika/standards/connectors.yaml:144-147). The
      conformance kit checks the real behaviour, an unknown id coming back as
      `not_found` (crates/seikika-connect/src/conformance.rs:235-237), but
      only where CI runs it. The live connectors all make real calls (e.g.
      crates/seikika-connector-gitlab/src/main.rs:126, 149).
    suggestion: >-
      Match the SDK call `.not_found(` in production code (not tests or
      comments), ideally inside the refresh handler.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      On a scratch crate run through target/debug/seikika-connector-workspace,
      a comment mentioning `not_found` set reportsNotFound true. Separately, a
      crate doc containing "push-only" sets pushOnly
      (crates/seikika-connector-workspace/src/connectors.rs:135-137), which
      skips the rule. The scratch doc said "is not push-only" and was
      exempted.
    suggestion: >-
      Ignore comments, and derive pushOnly from the code (run_remote without
      run_stdio, or no `refresh` capability) instead of a doc phrase.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence ("refresh never sends not_found", pinned for
      crates/demo/partial in .seikika/tests/standards.test.yaml:401-403)
      points at the refresh path, and the fix names the message and when to
      send it (connectors.yaml:141-143). Adding the call passes.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      A yes/no rule. Silver is D73's "`not_found` (a push-only connector is
      exempt)" (docs/decisions/D01M7W4FRJR0000000000000000.md), and
      docs/design/connector-standards.md:85 places it.
summary: >-
  The right protocol rule, checked by a substring that any identifier or
  comment containing `not_found` satisfies. Its push-only exemption can be
  claimed by a doc phrase, even a negated one. The conformance kit already
  checks the real behaviour at runtime. The fix is precise and the level
  is decided.
