apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-dependency/from-a-registry
rubric: rule-quality
subjectHash: 1c48c993e6f9
assessor: {kind: agent, name: cursor-assessor-07, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      The rationale's harm is a build that can't be reproduced from a
      published release (.seikika/standards/dependencies.yaml:80-83). `git` is
      true when any Cargo.lock package of that name has a `git+` source
      (crates/seikika-connector-workspace/src/deps.rs:57, 90-114), so a direct
      git dependency and a `[patch]` to git both fail. A path dependency
      outside the workspace has no source and passes. That fits the intent,
      because the vendored code is in the repository and is reproducible from
      it. An alternative registry also passes, which the name allows, though
      the fix says crates.io. The workspace test asserts no live git source
      (deps.rs:230).
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      Cargo writes the source into Cargo.lock, so it can't be relabelled. The
      only ways to pass are a registry release or a vendored copy, and both
      remove the unreproducible fetch the rule is about. Neither the connector
      (`git` is any lockfile source starting `git+`,
      crates/seikika-connector-workspace/src/deps.rs:57, 90-114) nor the rule
      (`!entity.git`, .seikika/standards/dependencies.yaml:75) honours an
      annotation or allowlist that could excuse a git source.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is the lockfile sources (dependencies.yaml:76). The fixture
      pins `['git+https://example.invalid/leftpad']`
      (.seikika/tests/standards.test.yaml:446-456), which names the repository
      to replace. The fix says to depend on a crates.io release
      (dependencies.yaml:77-79). Doing so gives a `registry+` source and
      clears `git`.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      There is no number. docs/design/dependency-standards.md:18 puts "comes
      from a registry" at bronze. The rationale ties it to cargo-deny's
      `[sources]` check (dependencies.yaml:82-83, sourced at
      dependency-standards.md:99-100). A git source as a floor matches
      thresholds.md's rule that safety-relevant items sit at the bottom
      (docs/design/thresholds.md:19-21).
summary: >-
  A sound bronze rule: the lockfile source can't be faked, the evidence
  names the git URL, and the level is argued. The fix says crates.io where
  the check accepts any non-git source, which is a harmless difference.
  All 33 live dependencies pass, and both outcomes are pinned on fixtures.
