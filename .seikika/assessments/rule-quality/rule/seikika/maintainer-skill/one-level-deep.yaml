apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-skill/one-level-deep
rubric: rule-quality
subjectHash: 8b4854bb7823
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      linkDepth is a sound measure of the spec's "one level deep". A scratch
      skill with SKILL.md → references/NOTES.md → DEEP.md reported 2
      (crates/seikika-connector-workspace/src/skills.rs:515-548). But
      supportFiles counts every non-binary file except SKILL.md
      (skills.rs:401-403), including evals/evals.json, which the gold rule
      has-evals requires. design-audit, the only gold skill, sits at exactly
      3: references/rubric.md, scripts/capture.cjs and evals/evals.json. So a
      skill with evals has two files left for references and scripts. A file
      count also says little about "focused": one 2,000-line reference passes,
      while four small scripts fail. A link that leaves the skill directory
      also counts as a hop into repository docs (skills.rs:460-476).
    suggestion: >-
      Exclude evals/ from supportFiles, since it is test data and not loaded
      by the agent. Then either bound the bytes of references/ rather than the
      file count, or keep the count and say in the rationale that it is a file
      proxy for SkillsBench's modules.
  - criterion: hard-to-game
    verdict: fail
    reason: >-
      A skill with five references passes by concatenating them into one file.
      That leaves the bundle exactly as large and as unfocused as before. The
      cheapest pass changes the count, not the focus the rationale cites
      (.seikika/standards/skills.yaml:275-278).
    suggestion: >-
      Add a size bound to the file count, for example total characters under
      references/ against the body budget's 5000-token estimate
      (skills.yaml:173), so merging files does not help.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence states both numbers ("2 link hops, 5 supporting files",
      .seikika/tests/standards.test.yaml:362-363). The fix gives both limits,
      and flattening the chain and pruning files to three passes.
  - criterion: threshold-justified
    verdict: unsure
    reason: >-
      One hop is the Agent Skills spec (docs/design/skill-standards.md:46).
      "At most three" rests on SkillsBench's "at most three modules" claim,
      which the doc labels as the paper's result, not re-run
      (skill-standards.md:151-152). A module is not obviously a file. Counting
      evals.json as one is this portal's mapping, and
      docs/design/thresholds.md has no row for it. I could not read the paper
      from here to check what a module is.
    suggestion: >-
      Add a thresholds.md row that says what SkillsBench counts as a module
      and why a file stands in for it, or label three as chosen.
summary: >-
  The hop count is a faithful check of the spec's one-level rule, and the
  fix works. The three-file limit counts evals/evals.json, which the gold
  has-evals rule requires, and counts files rather than size. So merging
  references passes without making the skill any more focused. Where
  "three" comes from (SkillsBench "modules") is only loosely tied to
  files.
