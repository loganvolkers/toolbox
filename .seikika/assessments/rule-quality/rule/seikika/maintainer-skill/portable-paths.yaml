apiVersion: seikika.com/assessment/v1
entity: rule:seikika/maintainer-skill/portable-paths
rubric: rule-quality
subjectHash: ad26fd13e454
assessor: {kind: agent, name: cursor-assessor-01, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: measures-intent
    verdict: fail
    reason: >-
      The pattern is a drive letter (`C:\…`) or a double backslash
      (crates/seikika-connector-workspace/src/skills.rs:32). That misses the
      relative backslash path that Anthropic's guidance warns about, the
      source the rule cites (.seikika/standards/skills.yaml:198-200). In a
      scratch run of target/debug/seikika-connector-workspace, "Open
      scripts\helper.py" gave windowsPaths [], while a JSON example
      `{"pattern": "\\d+\\.\\d+"}` inside a code fence was reported as a
      Windows path. So it misses the case it is meant for and flags escaped
      regexes. All 43 live skills pass.
    suggestion: >-
      Match a relative path with a backslash between path segments that ends
      in a file extension (e.g. `\b[\w.-]+(\\[\w.-]+)+\.\w{1,5}\b`), and drop
      the bare `\\\\` alternative or limit it to UNC hosts (`^\\\\[\w.-]+\\`).
      Add both scratch cases as fixtures.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      A hit is any line matching the regex
      (crates/seikika-connector-workspace/src/skills.rs:32, 422-430), and the
      check wants none (.seikika/standards/skills.yaml:189), with no
      suppression. The only way to clear a reported path is to rewrite it with
      forward slashes or remove it, which is the right change. Nobody gains
      from writing a backslash path in a form the regex misses. The gap is in
      detection, judged above.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The evidence is `file:line` for each hit (skills.rs:422-430; fixture
      `SKILL.md:4`, .seikika/tests/standards.test.yaml:370). The fix says to
      replace those paths with forward-slash paths relative to the skill
      directory, which clears the line. For a false hit on an escaped regex
      the fix does not fit, but the line is still named.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The rule has no number. Silver, with the other followability rules, is
      set in docs/design/skill-standards.md:95 and D72. The source is
      Anthropic's "avoid Windows-style paths" (skills.yaml:198-200).
summary: >-
  The level and fix are fine, but the detector misses the relative
  `scripts\helper.py` form the cited guidance warns about. It also flags
  any double backslash, so a JSON regex example in a code fence fails. The
  rule passes all 43 live skills without having been tested on the case it
  exists for.
