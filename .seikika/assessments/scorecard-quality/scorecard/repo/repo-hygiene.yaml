apiVersion: seikika.com/assessment/v1
entity: scorecard:repo/repo-hygiene
rubric: scorecard-quality
subjectHash: 37464747c99f
assessor: {kind: agent, name: cursor-assessor-18, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All five rules check root files that tell a newcomer or agent what the
      repository is, who reviews it and whether it may be reused, for the
      pilot repository's maintainers
      (examples/repo-portal-starter/seikika.yaml:72-81). The licence serves
      reusers rather than reviewers, but the description scopes the card as
      "basics", and every rule shares the no-build, no-network constraint
      (docs/design/repo-portals.md:140).
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      Silver mixes completing ownership (codeowners-catch-all,
      owners-are-teams) with an unrelated licence file (has-license,
      examples/repo-portal-starter/seikika.yaml:141-153). has-license is one
      file, cheaper than bronze's 50-word README. payments-api shows the
      split: its ownership is fine apart from `@alice`, yet it stops at bronze
      on the licence too
      (examples/repo-portal-starter/tests/standards.test.yaml).
    suggestion: >-
      Move has-license to bronze, next to has-readme (both are files GitHub's
      community profile lists), and keep silver for ownership completeness. Or
      move it to a separate `reuse` card.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      The rationale says these files tell a newcomer or an agent how to work
      in the repository (examples/repo-portal-starter/seikika.yaml:77-79).
      GitHub's community profile also lists CONTRIBUTING, and agents read
      AGENTS.md, which S4S scores in `maintainer-agent-doc` (D75). The starter
      checks neither, so a repository can reach silver with no written build
      or test instructions.
    suggestion: >-
      Add a gold rule `has-contributing` that passes when CONTRIBUTING.md or
      AGENTS.md exists and names a build or test command (the `commandLines`
      fact `maintainer-agent-doc` already uses).
  - criterion: actionable
    verdict: pass
    reason: >-
      Every rule has evidence and a fix that names a file (brief and
      examples/repo-portal-starter/seikika.yaml:90-153). Raising payments-api
      from bronze to silver works from them alone: the evidence names `@alice`
      to move to the team, and the fix says to add a LICENSE. has-license's
      README-note alternative is the one fix that doesn't lead to a pass.
summary: >-
  A useful, well-evidenced day-one card that pilots can adopt with no
  build. Its silver level puts an easy licence file next to ownership
  completeness, so the levels aren't a clean ladder. It leaves out
  contributor and agent instructions, which its own rationale promises.
  codeowners-catch-all is still untested (.seikika/results.json,
  meta-scorecard `every-rule-tested`).
