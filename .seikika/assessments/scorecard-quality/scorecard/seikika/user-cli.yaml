apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/user-cli
rubric: scorecard-quality
subjectHash: b810d5858547
assessor: {kind: agent, name: cursor-assessor-14, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      It scores the 12 commands whose layer is 'user'
      (.seikika/standards/cli.yaml:15-18, 164): the 11 reads that each call
      one MCP tool (crates/seikika-cli/src/main.rs:401-413) and the `mcp`
      bridge, for one audience, scripts and apps that parse what the CLI
      prints (cli.yaml:151-155). The card's `track: operator` (cli.yaml:162)
      is a report grouping, not its layer, though it reads oddly next to a
      user-SDLC description.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is help and JSON output, silver adds help for every flag and a
      run in a script or test (cli.yaml:166-209), as in
      docs/design/seikika-for-seikika.md:106. All 12 are at bronze and 3 at
      silver (.seikika/results.json), and silver's `exercised` is the costly
      step. Bronze's `structured-output` is in practice given by the shared
      `Remote` struct (main.rs:416-429), so bronze is mostly has-help.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      The rationale says bronze means "a caller can find the command"
      (cli.yaml:153-154) and docs/design/cli-skills.md:42 says user-cli scores
      documentation, but it has no `documented` rule, unlike operator-cli and
      user-mcp. In v1-spec §7.7 the reads share one row, `seikika
      get|query|search|…` (docs/v1-spec.md:412), which the capture reads as
      `get` only. Also missing is CLI–MCP parity, F7's drift
      (docs/design/seikika-for-seikika.md:210): the CLI `search` has no
      `--kind` or `--limit` while the MCP `search` takes both
      (crates/seikika-api/src/mcp.rs:26-30), and nothing scores it although
      `callsTool` already links each command to its tool (cli.yaml:27).
    suggestion: >-
      Add a bronze `documented` rule requiring docs/v1-spec.md, with one §7.7
      row per read command, and a silver rule that every property of the
      called MCP tool has a matching CLI flag (compare `args` with
      `inbound`/`callsTool` properties, or emit the gap from `seikika
      describe`).
  - criterion: actionable
    verdict: fail
    reason: >-
      has-help, structured-output and args-described have fixes an agent can
      follow in main.rs. The silver `exercised` fix sends the agent to
      crates/seikika-cli/tests/, but a test there that really runs `seikika
      get … -o json` (crates/seikika-cli/tests/assess.rs:120) leaves `get`
      failing, because the capture can't see helper calls; meanwhile `mcp`
      passes on a comment (scripts/self-portal.sh:11). An agent raising
      `query` to silver by the fix would not get there.
    suggestion: >-
      Fix the `commands` capture to see test argument arrays and to skip
      comments, or observe CLI invocations as the runner does for MCP calls,
      then re-run the card.
summary: >-
  One concern, a clear two-step ladder, and fixes that mostly name the
  file. The gaps are a missing `documented` rule its own rationale and
  cli-skills.md assume, and CLI–MCP parity, which F7 named. The silver
  `exercised` rule mis-scores live commands in both directions, so its fix
  doesn't reliably raise a level.
