apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/maintainer-plugin
rubric: scorecard-quality
subjectHash: 6612c5915804
assessor: {kind: agent, name: cursor-assessor-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All seven rules ask whether one package, plugin.json plus mcp.json,
      conforms to Agent Plugins 1.0.0
      (.seikika/standards/plugins.yaml:90-173); even the secret and path rules
      restate spec MUSTs (§7.2.1, §9.2 of
      https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md).
      Skills inside the package are left to maintainer-skill
      (plugins.yaml:63). The audience is the maintainer shipping the package
      (.seikika/README.md:33, "1. Maintainer"); the `track: operator`
      (plugins.yaml:86) is the campaign program for operator-facing material
      (.seikika/campaigns.yaml:36-41), not a second audience.
  - criterion: levels-are-a-ladder
    verdict: fail
    reason: >-
      Gold adds almost nothing. no-secret-headers matches two shapes
      (crates/seikika-connector-workspace/src/plugins.rs:174-176) that the
      bronze no-hardcoded-secrets scan already catches anywhere in mcp.json
      (hygiene.rs:17-18), and paths-stay-inside's command check repeats
      silver's stdio-command, which rejects `..` (plugins.rs:114); only args,
      which the spec calls opaque (§4.1), are new. That breaks
      docs/design/thresholds.md:23-24 ("Gold asks for what lower levels don't
      already imply"). Silver's mcp-declared also requires an mcp.json that
      the spec makes optional, so a skills-only plugin must add an empty file
      to climb.
    suggestion: >-
      Fold no-secret-headers into bronze as a header/env name check; move a
      `cwd` containment check to silver with stdio-command; give gold
      something new, such as full schema validation of both files or HTTPS
      remote URLs.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Agent Plugins 1.0.0 §7.2.1 has MUSTs the card does not check: `cwd` must
      be `./`, `${PLUGIN_ROOT}` or `${PLUGIN_DATA}`-rooted and stay inside; a
      streamable-http or sse `url` must be absolute HTTPS unless loopback,
      with no user info; each server entry needs `type` and no foreign fields;
      and `env` may not carry secrets (§9.2). plugins.rs reads none of `cwd`,
      `url`, `type` or `env` (plugins.rs:73-108). The design doc says
      generated manifests "are validated against
      schemas/1.0.0/plugin.schema.json in CI"
      (docs/design/agent-plugins.md:18) and the skeleton passes both schemas
      (agent-plugins.md:200), but no rule checks either.
    suggestion: >-
      Validate both files against the vendored 1.0.0 schemas in the connector,
      and add rules for `cwd` containment and HTTPS remote URLs.
  - criterion: actionable
    verdict: pass
    reason: >-
      Every rule has evidence and a fix naming the file or path
      (plugins.yaml:90-173). Raising the partial fixture from bronze to silver
      is the single step the fix gives, adding mcp.json with the 1.0.0
      `$schema` (pinned at .seikika/tests/standards.test.yaml:689-693), and
      plugins/seikika-operator/mcp.json is a working example. Two fixes are
      weaker: manifest-valid's omits half the name grammar, and
      stdio-command's suggests `${PLUGIN_ROOT}/bin/tool`, which the spec
      forbids but the rule accepts. Neither stops an agent from passing.
summary: >-
  One concern and one audience, and an agent can climb it, but the ladder
  rests on string checks of `$schema` and a few fields rather than the
  spec. Gold restates bronze and silver, and the spec's own MUSTs for
  `cwd`, remote URLs and `env` secrets are not checked. Validating against
  the 1.0.0 schemas and re-levelling the containment and secret rules
  would fix both.
