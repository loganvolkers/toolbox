apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/vs-backstage-extensibility
rubric: scorecard-quality
subjectHash: a7b9fb595838
assessor: {kind: agent, name: cursor-assessor-17, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      Both rules ask what it takes to add an integration: which languages, and
      whether the server is rebuilt
      (.seikika/standards/backstage-comparison.yaml:857-869). That is ISO
      25010 modifiability (F11, docs/design/backstage-comparison.md:56), for
      one audience: the team writing an integration. Extension isolation, a
      security concern, is rightly kept in vs-backstage-security.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      There is one level, and Seikika reaches it: both facts are true in
      .seikika/comparisons/seikika.yaml. The two rules cost about the same,
      since each is one property of the connector protocol, so no rung mixes
      cheap and expensive work. The rationale discloses that the scorecard
      wasn't pre-registered on its own (:867-868; RESULTS.md:269-270).
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      RESEARCH.md F11 measures one reference extension by LOC, files touched
      outside it, core rebuild (y/n), imported API symbols and languages
      (experiments/backstage-compare/RESEARCH.md:67). The scorecard keeps the
      two yes/no measures and drops the three sized ones. The design doc lists
      "F11 the reference extension's lines of code" as not measured
      (docs/design/backstage-comparison.md:118). A protocol any language can
      speak still says nothing about how much code an integration takes.
    suggestion: >-
      Write the reference extension for both products (one fixed data source)
      and add `extension-lines` and `files-outside-extension` rules on it,
      with `better: lower`.
  - criterion: actionable
    verdict: fail
    reason: >-
      Both rules read hand-written booleans
      (experiments/backstage-compare/facts.yaml:60-69), and neither fix names
      facts.yaml or snapshot.py (backstage-comparison.yaml:883-884, 894-896).
      The without-rebuild fix names a design doc rather than code. An agent
      who restored either property would still see `... is false` in the
      evidence. The harness already exercises both properties: a Python client
      pushes to /v1/ingest through a remote connector (measure.py:146,
      158-163). But the facts aren't taken from that run.
    suggestion: >-
      Set both facts from the harness run (the remote, non-Rust ingest
      succeeding on the unchanged release binary), so that rerunning the
      harness is the fix's last step, and name
      crates/seikika-api/src/routes.rs and
      crates/seikika-model/schema/connector-messages.schema.json as the
      places.
summary: >-
  A focused scorecard Seikika clearly leads. It keeps only F11's yes/no
  measures and drops the reference extension's size, the measure that
  would show whether extending is actually cheap. Its two facts are
  hand-written, though the harness already demonstrates both.
