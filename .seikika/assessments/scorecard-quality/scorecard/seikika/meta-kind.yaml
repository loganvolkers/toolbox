apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/meta-kind
rubric: scorecard-quality
subjectHash: fa5d8591ce96
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      in-fixtures, tested, described and fields-described
      (.seikika/standards/meta.yaml:711-754) ask whether a kind is exercised
      in tests and explained to readers. There is one audience, the portal
      author. fields-described aggregates meta-field's `described`
      (meta.yaml:232-236), so one undescribed field counts on both cards, but
      the concern is the same.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze, exercised in tests, is what the ratchet holds new kinds to
      (meta.yaml:709). Silver is a description, and gold every field
      described, which the lower levels don't imply
      (docs/design/thresholds.md:24-25). Every level is reachable: 13 of 38
      kinds are gold, and kind:seikika/File and two reference-portal kinds are
      at none (.seikika/results.json). One weakness: no fixture kind stops at
      bronze (the brief's fixture levels are none 3, silver 1, gold 1, from
      .seikika/fixtures/surfaces.ndjson). So the bronze rung is never tested
      as a stopping point, and meta-scorecard's fixtures-reach-every-level
      (meta.yaml:674-685) fails for this card.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Missing: every map rule exercised. The rationale's concern is map rules
      that never run (meta.yaml:695-698), but in-fixtures passes with one
      entity from any map rule. Crate merges workspace/crate, runner/test and
      runner/clippy, and McpTool merges runner/mcp-calls and
      surfaces/mcp-tool. docs/design/scorecards-for-scorecards.md:180 leaves
      map rules to validate and populated-in-fixtures, but populated passes on
      a map rule's own fallback value: Rule.links is gold although no fixture
      record carries `links` (meta.yaml:197,
      .seikika/fixtures/surfaces.ndjson).
    suggestion: >-
      Emit on the Kind record the map rules (`from`) that have no fixture
      record of that connector and record kind, and add a silver
      `map-rules-in-fixtures` rule with that list as evidence.
  - criterion: actionable
    verdict: pass
    reason: >-
      I raised kind:seikika/File from none on paper. Add an expectation about
      file:scripts/m4-acceptance.sh, its fixture entity
      (.seikika/fixtures/workspace.ndjson), to the tests file the manifest
      names (.seikika/seikika.yaml:441). It already has a description
      (.seikika/standards/docs.yaml:54-56), so it reaches silver. Gold needs
      descriptions for its four fields (docs.yaml:58-61), which the evidence
      lists. Each fix names what to add and where it goes.
summary: >-
  One concern on a sound ladder, with fixes that raise a real kind. It
  scores the kind as a whole: a kind fed by several map rules passes when
  any one of them is exercised, and no fixture shows the bronze rung.
