apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/sdlc-stage
rubric: scorecard-quality
subjectHash: 00c1715b64e4
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      All six rules (.seikika/standards/sdlc.yaml:167-243) ask whether one
      stage of the SDLC catalogue is defined, operable and built, for the
      maintainers who curate the catalogue (D87). The stages belong to four
      layers, but the question and the audience are one; the new rationale
      states it as "each stage has a gate an agent can run"
      (sdlc.yaml:150-154). The rationale, links and track change no rule.
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is a defined stage (status, exit criterion, a doc that exists),
      silver an operable one (commands that resolve, checks a workflow runs),
      gold a built one, which is the climb the rationale describes. Gold
      `built` still reads the declared status, but it needs the silver facts
      first, and docs/design/thresholds.md:75-77 explains why it isn't tied to
      a review (D01M831P5QWJQ4A2FT85N5MXJQF). The live levels spread (8
      bronze, 12 silver, 6 gold in the report), so each rung separates stages.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      The step-name loophole is closed: only `run:`, `uses:` and `with:` text
      counts as run by CI now (crates/seikika-connector-workspace/src/data.rs:
      148-171 and the test at :313-330). But a path still counts when any run
      line contains it (`run_by_ci`, data.rs:203-218). maintainer/build is
      gold with `rust-toolchain.toml` as a check
      (.seikika/sdlc/stages/maintainer.yaml:23), and the only run line naming
      it hashes it into a cache key (actions/report/action.yml:98). Nothing
      asks that a stage's checks pass, and no rule ties the exit criterion to
      a listed command or check. The `automated` rationale says CI "keeps it
      true after every change" (sdlc.yaml:231-234), which holds only once
      checks are shown to run and pass.
    suggestion: >-
      Add a gold `checks-green` rule that reads the workflow-runs record of
      each workflow running a stage's checks (failingStreak 0, from the
      github-actions connector) and is unknown when that connector is skipped;
      and count a check as run only when a command executes it, not when a
      line reads the file.
  - criterion: actionable
    verdict: pass
    reason: >-
      I tried sdlc-stage:maintainer/plan, at bronze and failing agent-operable
      and automated in the report. The evidence names the stage, and the fixes
      name `commands:`, `checks:`, .seikika/sdlc/stages/<layer>.yaml and
      .github/workflows (sdlc.yaml:212-230), so listing a resolvable command
      and a check CI runs raises it to silver. Only has-exit-criterion's fix
      names no file or field (sdlc.yaml:182-184).
summary: >-
  Re-assessed after the scorecard gained a rationale, links and a track.
  Step names no longer count as running a check, but a stage can still be
  gold when its checks are only read by CI, never shown to run or pass.
