apiVersion: seikika.com/assessment/v1
entity: scorecard:seikika/meta-rubric
rubric: scorecard-quality
subjectHash: f6053b256d3f
assessor: {kind: agent, name: cursor-assessor-03, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-concern
    verdict: pass
    reason: >-
      described, in-use, guided and discriminates
      (.seikika/standards/meta.yaml:1097-1144) all ask whether a rubric lets
      assessors judge consistently. There is one audience, the rubric author,
      and the description cites D80 (meta.yaml:1079-1081).
  - criterion: levels-are-a-ladder
    verdict: pass
    reason: >-
      Bronze is described and used once (the ratchet, meta.yaml:1095). Silver
      is guidance for every criterion, and gold is three assessments with no
      criterion passed by all of them. Each level needs the one below: there's
      no discrimination without use. All five rubrics are at silver or above,
      and sdlc-stage-quality is gold (.seikika/results.json). Gold's cheapest
      route, a single `unsure`, is weak, but that is a flaw in discriminates'
      measure, not in the order of the levels.
  - criterion: no-obvious-gap
    verdict: fail
    reason: >-
      Missing: agreement between assessors. The research the design relies on
      calls for calibration, meaning two independent assessors on the same
      subjects with agreement reported per criterion as Cohen's kappa
      (docs/design/meta-standards-review.md:163, M2). thresholds.md says the
      quality of guidance "is what assessors' agreement measures"
      (docs/design/thresholds.md:45). scorecards-for-scorecards.md:326-330
      lists it as not built, because a newer assessment file replaces the
      older one.
    suggestion: >-
      Keep assessments keyed by assessor (a file per assessor, or a history).
      Emit, for each criterion, the agreement on entities that have two
      assessors, and add a gold `assessors-agree` rule above a stated kappa.
  - criterion: actionable
    verdict: fail
    reason: >-
      I tried raising rubric:seikika/rule-quality from silver. When I counted,
      its threshold-justified had passed all 19 assessments. The fix says
      "sharpen or drop" (meta.yaml:1139-1140). Sharpening the question leaves
      the old verdicts, which the rule reads by criterion name
      (crates/seikika-cli/src/model.rs:257-262). Dropping the criterion leaves
      19 assessments answering a criterion that no longer exists, which
      `seikika assess check` rejects
      (docs/design/scorecards-for-scorecards.md:236-240). The route that
      works, re-assessing until some verdict isn't a pass, isn't in the fix.
      The other three fixes do say what to write (meta.yaml:1101-1102,
      1111-1112, 1121-1122).
    suggestion: >-
      Rewrite discriminates' fix to say re-assess after sharpening, and to
      assess more entities when the evidence says there are fewer than three.
summary: >-
  One concern, ordered sensibly. It misses the standard its own design
  cites for rubrics, agreement between assessors, and its gold fix doesn't
  change what the rule reads, so an agent can't raise a rubric to gold by
  following it.
