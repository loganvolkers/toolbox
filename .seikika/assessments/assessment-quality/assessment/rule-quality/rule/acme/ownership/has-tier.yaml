rubric: assessment-quality
subjectHash: 84db4d4e364f
assessor: {kind: agent, name: cursor-reviewer-37, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      .seikika/assessments/rule-quality/rule/acme/ownership/has-tier.yaml
      lands. examples/reference-portal/seikika.yaml:27 is the tier expression
      that requires security for "0" and "1", :95 is the "0"-"3" enum, :99-106
      is ownership's CODEOWNERS authority, :116 is tier from catalog-info or a
      native edit with no authority, :176-177 and :213-216 are the silver and
      rule rationales, :210-212 is the fix, and :319-321 is the action that
      reads that approval. examples/reference-portal/fixtures/native.json sets
      platform-infra's tier, and expected/scorecards.json records has-tier
      passing on all four repositories.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent passes because the check is has(entity.tier)
      (seikika.yaml:209) and the name and fix are "set a tier". hard-to-game
      fails correctly: catalog-info is a source with no authority
      (seikika.yaml:116 versus :99-106), and tier "2" or "3" both satisfies
      the check and selects approval 'none' (seikika.yaml:27).
      fix-leads-to-pass and threshold-justified match the fix text and the
      scorecard rationale. The summary's note that no fixture fails the rule
      is outside the rubric
      (https://github.com/seikika/seikika/blob/05510a57fafd8707979370858b578b78b935cf0e/portal/standards/meta.yaml#L1148-L1180).
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict quotes the manifest. The hard-to-game fail follows the
      rubric's "cheapest pass" test
      (https://github.com/seikika/seikika/blob/05510a57fafd8707979370858b578b78b935cf0e/portal/standards/meta.yaml#L1163-L1166):
      the repository writes its own tier, and the least scrutinised values
      also skip security approval.
  - criterion: actionable
    verdict: pass
    reason: >-
      The only fail is hard-to-game. Giving tier an authority like
      ownership's, so only a platform native edit or a CODEOWNERS-owned
      catalog-info line counts, would stop a self-declared "2" or "3" from
      being the cheap pass, which is what
      .seikika/assessments/rule-quality/rule/acme/ownership/has-tier.yaml
      asks.
summary: >-
  Trustworthy. The manifest citations match the file, including the
  unauthorised tier source and the approval expression that treats "2" and
  "3" as no security review. The hard-to-game fail is the one the sources
  support, and its suggestion would change that verdict.
