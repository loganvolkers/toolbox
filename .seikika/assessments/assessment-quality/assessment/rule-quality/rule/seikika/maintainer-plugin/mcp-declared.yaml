apiVersion: seikika.com/assessment/v1
entity: assessment:rule-quality/rule:seikika/maintainer-plugin/mcp-declared
rubric: assessment-quality
subjectHash: 77934036044b
assessor: {kind: agent, name: cursor-reviewer-06, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      Every citation in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-plugin/mcp-declared.yaml
      checks out. .seikika/standards/plugins.yaml:119 is the check, 120-122
      the evidence, 126-128 the vendor lock-in rationale and 75-76 the card's
      "declares the MCP server portably".
      crates/seikika-connector-workspace/src/plugins.rs:42-43 compares only
      the `$schema` string, and 74-76 returns `commandToken: true` when
      `mcpServers` is missing. The 1.0.0 spec
      (https://github.com/agentplugins/agent-plugins-spec/blob/main/spec/1.0.0.md)
      says this. §6.2: an absent fixed location is not an error. §7.2.1: an
      empty `mcpServers` object is valid, `mcpServers` is required, and each
      server needs `type` with no foreign field.
      .seikika/tests/standards.test.yaml:689-694 pins 'no mcp.json'. D81 and
      docs/design/plugin-standards.md:22,46 put it at silver.
  - criterion: complete
    verdict: pass
    reason: >-
      The verdicts are right. measures-intent fails because the check never
      looks for the vendor config its rationale warns about (plugins.rs:24-27,
      42-43). hard-to-game fails because a one-line `$schema` file passes both
      silver rules (plugins.rs:74-76). The fix names the file and the schema,
      which is all the check reads. There is no number, and D81 sets the
      level.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Both fails follow from plugins.rs:42-43 and 74-76 read against spec §6.2
      and §7.2.1, with no judgement call.
  - criterion: actionable
    verdict: pass
    reason: >-
      Validating against the mcp schema rejects the one-liner, which flips
      hard-to-game. Passing a plugin with no mcp.json unless a vendor MCP
      config exists aligns the check with its rationale, which flips
      measures-intent.
summary: >-
  Accurate and well sourced. The rule rewards an mcp.json with the right
  `$schema` string, never detects the vendor config it warns about, fails
  skills-only plugins the spec allows, and a one-line file reaches silver.
  The two suggestions would flip both fails.
