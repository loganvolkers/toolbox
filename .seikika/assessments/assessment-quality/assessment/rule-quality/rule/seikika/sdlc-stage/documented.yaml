verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The check and the connector claims in
      .seikika/assessments/rule-quality/rule/seikika/sdlc-stage/documented.yaml
      hold. The check is .seikika/standards/sdlc.yaml:194, existence only.
      namedIn and notNaming are sdlc.yaml:81-90, filled at
      crates/seikika-connector-workspace/src/data.rs:258-267 from a
      case-insensitive substring (data.rs:228-229). nothing-missing reads them
      through stagesMissing (sdlc.yaml:26-30, :279). missing() (data.rs:77-93)
      only tests that the path exists, and seikika.yaml:167 puts docs and
      checks in that list. Five stages list a doc that does not contain the
      stage name, including maintainer/plan's docs/decisions/README.md and
      three of build-connector's four docs. thresholds.md:56 and the rationale
      at sdlc.yaml:201-203 match. The fixture citation does not.
      standards.test.yaml:1047-1048 is demo-gap/release failing documented
      with `docs/p.md does not exist`, not a stage that passes by pointing at
      files that exist.
    suggestion: >-
      Cite standards.test.yaml:1047 as the missing-doc failure, and cite a
      passing documented fixture, such as demo-done/plan at
      standards.test.yaml:1036, for "pointing at files that exist passes".
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent and hard-to-game fail because sdlc.yaml:194 never reads
      namedIn, so `docs: [README.md]` passes whenever that file exists. The
      fix (sdlc.yaml:198-200) names docs and checks and, followed, makes
      missingPaths empty. Bronze "a doc that exists" is thresholds.md:56. The
      wrong example does not make the fix-leads-to-pass pass itself wrong.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The check at sdlc.yaml:194 and the substring at data.rs:228-229 are
      enough for a second assessor to fail the same two criteria and pass the
      other two.
  - criterion: actionable
    verdict: pass
    reason: >-
      Requiring namedIn, and matching the stage name in a heading or a table
      row, would fail a stage whose only doc is README.md and would fail the
      short-name substring the hard-to-game reason names. Both suggestions say
      that.
summary: >-
  The existence-only check and the two fails match sdlc.yaml and data.rs,
  including the five stages with a doc that never names them. The pass
  example does not: standards.test.yaml:1047 is demo-gap/release failing
  because docs/p.md does not exist.
