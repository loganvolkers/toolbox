verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-ci-security/pinned-to-sha.yaml
      land. Only `uses:` is read (workflows.rs:243-251), local refs count as
      pinned (16-18, 292), and pin() is 26-27. uses_lines (196-213) strips `-
      ` and then needs a `uses:` prefix, so `- {uses: …}` yields no
      unpinnedAt. The globs are .seikika/seikika.yaml:126, and the rationale
      is github-actions.yaml:258-261. Tests are standards.test.yaml:120-131
      and the practice row is github-actions-standards.md:81. zizmor 1.32.0
      `--offline` gave no finding for `container: alpine:3` or a `postgres:16`
      service, as claimed.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent fails rightly. A third-party `uses:` in a composite
      action outside `actions/*` is never read, which misses the fix's "every
      third-party `uses:`" (github-actions.yaml:254). hard-to-game passes
      rightly: the check reads the connector's parse, so zizmor ignores can't
      silence it. fix-leads-to-pass and threshold-justified are right.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The container-image half of measures-intent rests on the rationale
      ("only a commit SHA fixes what runs") rather than the fix's `uses:`
      wording, so it is the softer half. The composite-action route alone
      supports the fail, and it follows from the globs.
  - criterion: actionable
    verdict: pass
    reason: >-
      Recording container and service images in `unpinned` and widening the
      globs to `.github/actions/**` would make both routes fail, which flips
      measures-intent, as the suggestion in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-ci-security/pinned-to-sha.yaml
      says.
summary: >-
  Trustworthy. Every code citation lands, the flow-style evidence gap is
  real, and offline zizmor is silent on tag-pinned container and service
  images. The measures-intent fail stands on the unglobbed composite
  actions even if one reads the container point as outside the fix.
