entity: assessment:rule-quality/rule:seikika/maintainer-site/titled
rubric: assessment-quality
subjectHash: c408df44acfa
assessor: {kind: agent, name: cursor-reviewer-23, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Three citations in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-site/titled.yaml
      don't hold. First, measures-intent says "a folded `>-` ... no longer
      counts", but crates/seikika-connector-workspace/src/site.rs:237 asserts
      that `title: >-\n  Folded\n  title` reads as "Folded title". That is
      correct for a YAML read, but it is the opposite of the claim. Second,
      hard-to-game cites "test at site.rs:373" for the blank and nested cases.
      site.rs:373 is in a_broken_link_and_a_secret_are_facts (empty
      frontmatter, title ""). The nested and blank tests are site.rs:233-236.
      Third, unique-title is .seikika/standards/site.yaml:142-152, not
      137-148, and the fix is 85-88, not 84-87. The rest holds: site.rs:41-53
      parses the YAML and trims the top-level string, the check is
      `entity.title.size() >= 3` (site.yaml:81), and
      docs/design/thresholds.md:39 labels the 3 characters "Chosen".
    suggestion: >-
      Say that a folded scalar counts as its text, cite site.rs:232-237 for
      the nested, blank and folded cases, and re-cite site.yaml as 85-88 (fix)
      and 142-152 (unique-title).
  - criterion: complete
    verdict: pass
    reason: >-
      The four verdicts follow from the sources. The check reads only a
      top-level, trimmed string (site.rs:48-53, site.yaml:81). The fix names
      the key and the minimum (site.yaml:85-88), and the evidence says missing
      or too short (site.yaml:82-84). thresholds.md:39 states the number. No
      route the sources show is missed: duplicate placeholders fail
      unique-title (site.yaml:142-152), and a placeholder such as `title:
      TODO` is acknowledged in the reason.
  - criterion: reproducible
    verdict: unsure
    reason: >-
      The hard-to-game pass rests on taste: "writing a real title costs the
      same as a placeholder". The rubric's hard-to-game guidance fails a rule
      that an empty doc comment would pass
      (.seikika/standards/meta.yaml:1164-1166). `title: TODO` is the page
      equivalent, and the rule's rationale (site.yaml:89-91) is that readers
      can't recognise the page. A second assessor could fail that verdict on
      the same sources.
    suggestion: >-
      Ground the hard-to-game pass in something checkable. For example, show
      that no page under npm/site/src/content/docs has a placeholder title, or
      that unique-title catches the realistic placeholder case. Or mark it
      unsure and suggest that the connector flag known placeholders (TODO,
      TBD, Untitled).
  - criterion: actionable
    verdict: pass
    reason: >-
      Every verdict in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-site/titled.yaml
      is pass, so it has no suggestions to judge.
summary: >-
  The four verdicts follow from site.rs and site.yaml, but three citations
  are wrong. The "folded `>-` no longer counts" claim is the opposite of
  site.rs:237. The cited test at site.rs:373 is a different test. The
  site.yaml line numbers for unique-title and the fix are stale. The
  hard-to-game pass rests on taste about placeholder titles.
