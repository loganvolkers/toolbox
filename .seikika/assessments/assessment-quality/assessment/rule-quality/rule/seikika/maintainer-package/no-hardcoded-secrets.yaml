      talks about a credential in general. The fixture pin is
      .seikika/tests/standards.test.yaml:565-566. thresholds.md:35 is the
      killer-item row, and docs/design/package-standards.md:72 still lists the
      rule at gold.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent fails because the detector has no npm token shape and
      never opens .npmrc, while the rule is named no-hardcoded-secrets.
      hard-to-game passing is right for JSON: there is no string
      concatenation, so the split-prefix path in hygiene.rs:87-104 does not
      apply, and clearing a hit means changing the matched line. Removing that
      line empties secretHits, so the fix passes. Bronze is the killer-item
      placement at thresholds.md:35.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The shape list and the package.json-only read are in hygiene.rs and
      npm.rs. A second assessor comparing them with an npm_ token and an
      _authToken line in .npmrc reaches the same measures-intent fail.
  - criterion: actionable
    verdict: pass
    reason: >-
      The suggestion in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-package/no-hardcoded-secrets.yaml
      adds npm_[A-Za-z0-9]{36} and scans a sibling .npmrc for a raw
      _authToken. That is the miss measures-intent names, so the fail would
