summary: >-
  Placed at bronze for the right reason, with file:line evidence. The
  detector still has no npm token pattern and never reads .npmrc, which is
  the credential this catalog is most likely to hold.
  package-standards.md:72 still shows the rule at gold. The citations
  match the current files.
