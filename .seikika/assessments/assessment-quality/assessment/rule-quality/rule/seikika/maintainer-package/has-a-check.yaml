verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The code citations in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-package/has-a-check.yaml
      hold. crates/seikika-connector-workspace/src/npm.rs:140-148 counts which
      of four keys exist, and 145-147 reads only key presence.
      .github/workflows/ci.yml:167-173 is the Playwright step, which runs only
      `npm ci --prefix` (ci.yml:171). The only workflow reference to
      scripts/playwright-ci is ci.yml:170, so nothing runs its `check`.
      .seikika/tests/standards.test.yaml:541-543 pins '0 check scripts'. Two
      citations are off. The quoted rationale "CI has nothing to run" is not
      in .seikika/standards/packages.yaml; lines 133-134 say "gives CI nothing
      to run". And docs/design/package-standards.md:34 is the npm package.json
      row, while the npm developers row (a smoke test in `scripts.test`) is
      line 35.
    suggestion: >-
      Quote packages.yaml:133-134 verbatim and cite package-standards.md:35.
  - criterion: complete
    verdict: pass
    reason: >-
      Both fails and both passes are right. measures-intent describes only the
      pass-wrongly direction. The reverse also exists: a package whose only
      CI-run script is `lint` or `test:unit` fails, because only four exact
      keys count (npm.rs:144). The verdict is fail either way. The fix names
      the four scripts, so it leads to a pass. D76 states the silver placement
      (docs/decisions/D01M7W56B7R0000000000000000.md:9).
  - criterion: reproducible
    verdict: pass
    reason: >-
      Both fails reproduce from npm.rs:140-148 alone: the code reads keys, not
      bodies or workflows. The live case is checkable with one grep of
      .github/workflows/.
  - criterion: actionable
    verdict: pass
    reason: >-
      Counting only scripts a workflow runs removes the playwright-ci and
      npm-init-placeholder cases behind measures-intent. Rejecting empty,
      `true` and `exit 0` bodies closes the hard-to-game route. One caveat:
      `ci_uses_install` attributes a job to a package by `working-directory`
      only (npm.rs:176-193), so reusing it would miss `--prefix` calls like
      ci.yml:171. That affects the implementation, not whether the verdict
      flips.
summary: >-
  The verdicts are right and well evidenced: key presence is all the rule
  reads, and the live playwright-ci `check` is never run by CI. It fails
  `supported` on a misquoted rationale (packages.yaml:133-134 says "gives
  CI nothing to run") and package-standards.md:34, which should be 35.
