verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      .seikika/assessments/rule-quality/rule/seikika/meta-kind/fields-described.yaml
      hold. undescribedFields keeps fields with !f.described
      (.seikika/standards/meta.yaml:232-236), and described is filled()
      (crates/seikika-cli/src/model.rs:154), which is any non-empty trim
      (crates/seikika-cli/src/model.rs:281-285). The Crate fixture evidence is
      ['codeLines'] at .seikika/tests/standards.test.yaml:797-802. The rule,
      evidence and rationale are .seikika/standards/meta.yaml:744-754. Gold is
      the meta-kind column at docs/design/scorecards-for-scorecards.md:207,
      and the first-run "16 kinds" is :214-215 and
      .seikika/standards/meta.yaml:753-754. The gold principle is
      docs/design/thresholds.md:24-25. .seikika/results.json evidence lists
      24, 22 and 18 fields-described entries for kind:seikika/Crate, Skill and
      Connector.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent passes because an empty undescribedFields list is every
      field described (.seikika/standards/meta.yaml:232-236 and :746).
      hard-to-game fails because filled() accepts a single word
      (crates/seikika-cli/src/model.rs:283-284), and the evidence counts show
      that is dozens of fields per kind. The fix names description: and the
      listed fields (.seikika/standards/meta.yaml:747-750). Gold is not
      implied by the kind's own description at silver
      (.seikika/standards/meta.yaml:734-736).
  - criterion: reproducible
    verdict: pass
    reason: >-
      filled() is a one-line predicate. A second assessor reading
      crates/seikika-cli/src/model.rs:281-285 and the three evidence counts
      fails hard-to-game and passes the other three, without judging whether a
      particular field's description is good.
  - criterion: actionable
    verdict: pass
    reason: >-
      Rejecting a description equal to the field name, or matching TODO or
      TBD, inside filled() at crates/seikika-cli/src/model.rs:283-284 would
      make that placeholder fail fields-described, and the same change would
      fail meta-field's described. That is the verdict the suggestion is
      attached to.
summary: >-
  The assessment is an exact reading of the aggregate. Passing means every
  field has some description, a one-word placeholder satisfies filled(),
  the live kinds fail by the counts given, and tightening filled() would
  change the fail.
