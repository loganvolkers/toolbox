apiVersion: seikika.com/assessment/v1
entity: assessment:rule-quality/rule:seikika/maintainer-schema/local-refs
rubric: assessment-quality
subjectHash: 7dc6b56d221c
assessor: {kind: agent, name: cursor-reviewer-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-schema/local-refs.yaml
      hold. specs.rs:47-66 collects only `$ref` values not starting with `#`.
      On a scratch schema, `"$ref": "https://x#/$defs/a"` under `"$id":
      "https://x"` was listed as external and a remote `$dynamicRef` was not.
      Cargo.toml:23 is `default-features = false`. jsonschema 0.61.2
      src/retriever.rs:314-317 returns the "`resolve-http` feature ... is
      required" error. schema.rs:25 `expect`s the compile. thresholds.md:24 is
      the gold principle. schemas.yaml:117 and 118-120, and
      standards.test.yaml:610-611, are as cited. A remote `$ref` in a compiled
      schema fails the `embedded_schemas_compile` test and the first call, not
      `cargo build` itself; that doesn't change the argument.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent's fail is right in both directions (specs.rs:50-53).
      hard-to-game and fix-leads-to-pass hold: inlining under `$defs` is the
      fix itself.
  - criterion: reproducible
    verdict: unsure
    reason: >-
      The threshold-justified fail relies on silver implying gold, but that
      only holds for documents schema.rs compiles. wired-in is a filename
      mention (specs.rs:68-75), and validate.py applies schemas with Python
      jsonschema (examples/reference-portal/tools/validate.py:25-28). So a
      remote-ref schema can reach silver uncompiled, and local-refs still adds
      something there. The card's rationale also states gold's purpose, "gold
      keeps it self-contained" (schemas.yaml:47-48), and the reason doesn't
      address it. D77 states the level, and the guidance says unsure when no
      source states it. A second assessor could reach pass or unsure here.
    suggestion: >-
      Address schemas.yaml:47-48 and the uncompiled route through wired-in.
      Either keep the fail and say why "self-contained" isn't a reason for
      gold, or mark it unsure: D77 places it, but nothing explains the
      placement.
  - criterion: actionable
    verdict: pass
    reason: >-
      Resolving `$ref` and `$dynamicRef` against the document's `$id`s would
      fix both misreads behind measures-intent. Moving the rule to bronze
      under "a prerequisite sits below what depends on it"
      (thresholds.md:22-23) would justify its level, so that suggestion would
      change threshold-justified too.
summary: >-
  The measures-intent fail is right and reproduces on a scratch schema
  (own-id refs flagged, `$dynamicRef` missed), and every citation,
  including jsonschema's retriever.rs, lands. The threshold-justified fail
  is less certain. Silver implies local refs only for compiled schemas,
  because wired-in is a filename mention. The fail also skips the card's
  own "gold keeps it self-contained".
