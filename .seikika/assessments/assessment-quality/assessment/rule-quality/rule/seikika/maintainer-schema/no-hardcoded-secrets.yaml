apiVersion: seikika.com/assessment/v1
entity: assessment:rule-quality/rule:seikika/maintainer-schema/no-hardcoded-secrets
rubric: assessment-quality
subjectHash: 166a2ff96767
assessor: {kind: agent, name: cursor-reviewer-10, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      .seikika/assessments/rule-quality/rule/seikika/maintainer-schema/no-hardcoded-secrets.yaml
      land. specs.rs:77-79 delegates to hygiene.rs, whose patterns are lines
      16-27 (no `glpat-`) and whose header, lines 5-7, says "the floor, not
      the scanner". hygiene.rs:85-103 is the split-prefix guard.
      crates/seikika-connector-gitlab/src/main.rs:4 takes a `token`.
      standards.test.yaml:612-613 pins the aws-access-key hit, and
      schemas.yaml:128-130 is the fix. thresholds.md:19-21 and 35 put
      credentials at bronze. schema-standards.md:62 still says gold.
  - criterion: complete
    verdict: fail
    reason: >-
      hard-to-game should fail. The reason says a matched shape "can pass only
      by removing it", because JSON has no concatenation. But JSON string
      escapes do what concatenation does in code. The scan runs on the raw
      text (specs.rs:77-79, hygiene.rs:110), and on a scratch schema
      `"default": "\u0041KIAIOSFODNN7EXAMPLE"` gave secretHits []. The same
      line with a literal `AKIA` gave `schema/a.schema.json:6 aws-access-key`.
      Both parse to the same credential, which ships in the binary through
      `include_str!` (schema.rs:9-17).
    suggestion: >-
      Fail hard-to-game, citing the `\u` escape route. Suggest scanning the
      parsed document's string values (after JSON unescaping) as well as the
      raw text.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The other verdicts rest on the pattern list, the thresholds table and a
      scratch run any assessor can repeat. The missed escape route is a
      completeness gap, not a matter of taste.
  - criterion: actionable
    verdict: pass
    reason: >-
      Adding `glpat-`, `AIza` and JWT shapes to hygiene.rs, or reading
      gitleaks through SARIF, would catch the `glpat-` default behind the
      measures-intent fail.
summary: >-
  Citations, measures-intent and the bronze placement are right. But the
  hard-to-game pass is wrong. JSON `\u` escapes hide a credential from the
  raw-text scan: a `\u0041KIA…` default passed on a scratch schema while
  the literal `AKIA…` was caught. That dodge is the JSON form of the
  split-prefix trick hygiene.rs guards against in code.
