verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      .seikika/assessments/rule-quality/rule/seikika/operator-cli/args-described.yaml
      hold. crates/seikika-cli/src/main.rs:1215-1227 builds `args` without
      `help`/`version` and lists those whose `get_help()` is None. Live
      `seikika describe` gives `run` 24 arguments and `report` 15, with none
      undocumented. .seikika/standards/cli.yaml:100 is has-help's 10-character
      floor. `installer` is the id behind `tools config --for`
      (main.rs:517-518), and `as_user` the id behind `--as` (run.rs:83-84).
      docs/design/seikika-for-seikika.md:105 is the operator-cli row, and
      docs/design/thresholds.md:22-23 is the prerequisite principle. Two
      ranges are one line early. The rationale is cli.yaml:127-129, not
      126-128, though 128 holds the "format and default" claim. `ServeArgs` is
      at main.rs:689, and 688 is its derive.
  - criterion: complete
    verdict: pass
    reason: >-
      hard-to-game fails correctly. The check is `undocumentedArgs.size() ==
      0` (cli.yaml:124), fed by `is_some()` on help (main.rs:1220), so `/// x`
      passes, which the rubric's "empty doc comment" example
      (.seikika/standards/meta.yaml:1165) covers. measures-intent and
      fix-leads-to-pass are right: the help is what `--help` prints per flag,
      and grepping the id finds the field. threshold-justified passes as the
      rubric says for rules with no number (meta.yaml:1179).
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on code a second assessor can read: the `described`
      test at main.rs:1220, the missing floor against cli.yaml:100, and the
      ids `seikika describe` prints. None depends on taste.
  - criterion: actionable
    verdict: pass
    reason: >-
      The one suggestion, to have `seikika describe` report help shorter than
      10 characters or that only restates the id, would reject both routes the
      reason names. `x` and "The out." are each under 10 characters. It would
      also give this rule has-help's floor, which the companion assessment
      (.seikika/assessments/rule-quality/rule/seikika/operator-cli/has-help.yaml)
      passes on hard-to-game.
summary: >-
  A trustworthy assessment. Every claim checks out against main.rs and
  `seikika describe` (24 arguments for `run`, 15 for `report`, none
  undocumented). The single fail is the one the code shows, with a fix
  that would remove it. Two line ranges are one line early
  (cli.yaml:126-128 for the rationale at 127-129, main.rs:688 for
  `ServeArgs` at 689), but neither misleads.
