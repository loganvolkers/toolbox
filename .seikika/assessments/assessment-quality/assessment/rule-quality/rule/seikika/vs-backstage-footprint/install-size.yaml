apiVersion: seikika.com/assessment/v1
entity: assessment:rule-quality/rule:seikika/vs-backstage-footprint/install-size
rubric: assessment-quality
subjectHash: 5eaafc01bded
assessor: {kind: agent, name: cursor-reviewer-32, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The measurement claims in
      .seikika/assessments/rule-quality/rule/seikika/vs-backstage-footprint/install-size.yaml
      hold. experiments/backstage-compare/footprint.py:57-73 downloads the
      v0.1.1 linux archives (the default is line 24) and extracts only members
      with an execute bit, then line 79 adds the OpenFGA binary and line 40
      measures with `du -sbL`. Backstage at line 169 is the production install
      plus the Node tree. backstage-comparison.yaml:57 says "Megabytes on disk
      to run it", and :17-20 says an adopter installs the v0.1.1 release. The
      fix at :400-401 says to drop what the archives carry but do not run,
      which the executable-only extract does not move. Cargo.toml:65-67 sets
      codegen-units and thin LTO and does not set strip. README.md:42 and
      ADJUDICATION.md:108 both state the 1,000 MB bar, and RESEARCH.md:59 ties
      F3 to charter goal 1 as one image plus Postgres. The hard-to-game reason
      misstates that charter. AGENTS.md's charter goal 1 is one container
      image plus Postgres, not an offline single-binary install.
    suggestion: >-
      Cite charter goal 1 as one container image plus Postgres, the wording in
      AGENTS.md and in RESEARCH.md:59.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent passes: both sides are bytes on disk for a release an
      adopter runs, and neither count includes a base image or Postgres.
      hard-to-game passes because the number comes from the published archives
      (footprint.py:58-64), so lowering it means shipping smaller executables.
      fix-leads-to-pass fails because the fix's lever, dropping non-run
      archive members, is not what lines 69-73 count. The 1,000 MB bar was
      pre-registered at README.md:42.
  - criterion: reproducible
    verdict: pass
    reason: >-
      The extract filter and the fix text are enough for a second assessor to
      fail only fix-leads-to-pass. The charter misstatement is a citation
      error, not a different verdict.
  - criterion: actionable
    verdict: pass
    reason: >-
      Rewriting the fix to name strip, the release profile and a new release
      before rerunning footprint.py would make following the fix move
      installMb. That is the suggestion on the fix-leads-to-pass fail.
summary: >-
  The release measurement and the fix-leads-to-pass fail match
  footprint.py and the rule text. The hard-to-game reason quotes charter
  goal 1 as an offline single-binary install. AGENTS.md states one
  container image plus Postgres.
