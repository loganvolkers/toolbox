apiVersion: seikika.com/assessment/v1
entity: assessment:rule-quality/rule:seikika/review-sdlc-stage/no-open-findings
rubric: assessment-quality
subjectHash: f4be8d49cafa
assessor: {kind: agent, name: cursor-reviewer-32, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      The check claims in
      .seikika/assessments/rule-quality/rule/seikika/review-sdlc-stage/no-open-findings.yaml
      hold. reviewFailing (.seikika/standards/sdlc.yaml:103-109) is the latest
      assessment's failing list with no freshness filter, and the evidence at
      sdlc.yaml:335-337 marks a stale one. The fix at :338-341 asks for
      another assessor, and the check does not read the assessor.
      package-author/package fails all four criteria
      (.seikika/assessments/sdlc-stage-quality/sdlc-stage/package-author/package.yaml).
      Deleting the file makes reviewFailing empty (sdlc.yaml:108), so bronze
      passes. standards.test.yaml:1077 fails demo-partial/ship, and :1079-1080
      shows reuses-artifacts. thresholds.md:55 is the "current or stale"
      bronze bar. Two citations do not say what the reasons use them for.
      .github/workflows/ci.yml:95-98 is the take-it-out step and the
      assessments step's name. `seikika assess check .seikika` is ci.yml:99.
      docs/design/meta-standards-review.md:136 (C1) says bronze fails only on
      a current failing review and that a stale review never blocks, which is
      the opposite of the "current or stale" bar the threshold reason places
      next to it.
    suggestion: >-
      Cite ci.yml:99 for assess check, and do not use C1 at
      meta-standards-review.md:136 as support for keeping stale findings open.
      thresholds.md:55 already says that.
  - criterion: complete
    verdict: pass
    reason: >-
      measures-intent passes: an empty reviewFailing, including a stage with
      no assessment (sdlc.yaml:108), passes bronze, and a stale failing list
      stays open. hard-to-game fails because rewriting the current file's
      verdicts, or deleting it, clears the check without changing the stage.
      The fix names .seikika/assessments/ and the evidence names the criteria,
      and a stage-hash change makes assess check exit 1 on stale
      (crates/seikika-cli/src/assess.rs:85). The bronze bar is
      thresholds.md:55 even though C1 disagrees about stale reviews.
  - criterion: reproducible
    verdict: pass
    reason: >-
      reviewFailing's computed field decides the pass and the fail. A second
      assessor reaches the same verdicts from sdlc.yaml:103-109 and :332-341.
  - criterion: actionable
    verdict: pass
    reason: >-
      Keeping a criterion open until the stage hash changes or a different
      assessor passes it would stop the same-assessor rewrite and the deletion
      the hard-to-game reason names. That suggestion is attached to that fail.
summary: >-
  The bronze rule does what the assessment says: stale findings stay open,
  and rewriting or deleting the assessment clears them. Two citations do
  not. assess check is ci.yml:99, not :95-98, and C1 at
  meta-standards-review.md:136 says a stale review never blocks.
