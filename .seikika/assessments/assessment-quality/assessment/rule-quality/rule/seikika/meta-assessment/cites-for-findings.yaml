  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      .seikika/assessments/rule-quality/rule/seikika/meta-assessment/cites-for-findings.yaml
      land where they say. In crates/seikika-connect/src/assessment.rs,
      cites() is 15-46, the dotted-host URL regex 30-35, the unique-name
