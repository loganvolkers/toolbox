apiVersion: seikika.com/assessment/v1
entity: assessment:crate-design/crate:seikika-connector-workspace
rubric: assessment-quality
subjectHash: d897e5e01aec
assessor: {kind: agent, name: cursor-reviewer-20, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: pass
    reason: >-
      The citations in
      .seikika/assessments/crate-design/crate/seikika-connector-workspace.yaml
      check out. main.rs:1-2 says "three record kinds", and main.rs:4-49 then
      lists 21. None of them is `data`, which docs/reference/
      workspace-connector.md:50 documents and main.rs:140 declares. The Cargo
      description is at Cargo.toml:3. clones.rs:53-73 runs clone, fetch,
      `reset --hard` and `clean -qfdx`, and clones.rs:55-59 removes a clone of
      another URL. federation.rs:5 and 163 make `builtin:workspace` the
      federation connector, and v1-spec.md:100 is the connector row. The test
      ranges hold: workflows.rs 393-516, hygiene.rs 158-217 and clones.rs
      111-149. So do ci.yml:100-103 and portals.rs:102-104. rust.rs:470-488 is
      the metrics JSON, and its one test is rust.rs:495-534. One small
      miscount: of the other nine `#[test]` matches in rust.rs, eight are in
      the fixture string (507-516) and one is a doc comment (rust.rs:30). That
      changes nothing.
  - criterion: complete
    verdict: pass
    reason: >-
      Each verdict is the one the sources give. The crate has no dependents
      (rg finds `seikika-connector-workspace` in no other Cargo.toml or
      source), so small-contract passes. Its parsers stay inside it
      (Cargo.toml:11-21), and none is a charter default, so
      replaceable-defaults passes. tests-match-risk fails rightly. rg finds no
      test that asserts `maxComplexity`, `pubDocumented` or `functions`. The
      only other place they appear is the static
      .seikika/fixtures/workspace.ndjson, which is not generated from the
      connector's output. The second gap, an untested origin-URL replacement,
      is also real: a_clone_follows_its_branch (clones.rs:111-149) keeps one
      URL throughout.
  - criterion: reproducible
    verdict: pass
    reason: >-
      Both fails rest on checkable facts, not taste. The crate doc counts
      "three" kinds against a list of 21. clones.rs:53-73 is a write path that
      the spec row (v1-spec.md:100) doesn't describe. rust.rs has one test,
      and it asserts only testsWithoutAsserts and disabledTests
      (rust.rs:528-532). A second assessor reading the same files reaches the
      same verdicts.
  - criterion: actionable
    verdict: pass
    reason: >-
      Each suggestion would change the verdict it is attached to. Correcting
      main.rs:1-3 and Cargo.toml:3, and either documenting the clone job or
      moving clones.rs out, answers both halves of the one-responsibility
      fail. A rust.rs fixture test that asserts `functions`, `pubItems`,
      `undocumented` and `unwraps` would cover the numbers that
      rust.rs:470-488 emits. A changed-URL case in a_clone_follows_its_branch
      would cover clones.rs:55-59.
summary: >-
  A trustworthy assessment. Its citations land, with one harmless miscount
  (one of the nine `#[test]` strings is a doc comment at rust.rs:30, not
  fixture text). Both fails are supported by the sources: stale crate docs
  plus the clone job, and untested Rust metrics. Each suggestion would
  turn its verdict to a pass.
