summary: >-
  The four passes are plausible and the hands-on reads reproduce. But the
  key evidence for executable-exit is wrong: m4-acceptance.sh:69 does not
  assert erin's redaction (the real assertion is lines 84-86, for alice),
  and user-sdlc.md:46 is a table separator. With the UI's authorization
  untested, the executable-exit pass rests on judgement.
