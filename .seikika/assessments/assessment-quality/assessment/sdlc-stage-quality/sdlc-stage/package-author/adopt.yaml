entity: assessment:sdlc-stage-quality/sdlc-stage:package-author/adopt
rubric: assessment-quality
subjectHash: e1c6723f84c8
assessor: {kind: agent, name: cursor-reviewer-22, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: supported
    verdict: fail
    reason: >-
      Most citations in
      .seikika/assessments/sdlc-stage-quality/sdlc-stage/package-author/adopt.yaml
      check out. actions/report/action.yml:1-12 and 154 are the ratchet header
      and verdict step. action.yml:51 and 85-91 download a released version,
      and lines 92-130 hold the source build. plan.rs:25-26 and 94-106 are the
      level diff. The only plan tests are in
      crates/seikika-derive/tests/reference.rs (lines 73 and 111), and no
      workflow runs `seikika plan`. Two claims in agent-can-complete do not
      hold. docs/design/federation.md:84-85 promises that `seikika plan` shows
      level drops on an upgrade. It does not promise a rollout workflow, and
      federation.md never mentions one-PR-per-repo rollout; that is
      docs/design/packages.md §8 (lines 348-359). "Nothing installs the base
      version" is also wrong. `seikika install [PATH]` accepts a manifest file
      and clones its git packages (crates/seikika-cli/src/install.rs:194-218),
      so `seikika install old.yaml` caches the base version.
    suggestion: >-
      Cite packages.md:348-359 or the stage gap
      (.seikika/sdlc/stages/package-author.yaml:121) for the missing rollout
      workflow. Replace "nothing installs the base version" with the `seikika
      install old.yaml` route and its side effect: it pins the old spec in
      seikika.lock.
  - criterion: complete
    verdict: pass
    reason: >-
      The two fails are right. The stage's only check
      (package-author.yaml:116) is a per-repo ratchet that never plans an
      upgrade. The fleet half of the exit criterion
      (package-author.yaml:113-114) has no workflow, which the stage's own gap
      at line 121 admits. reuses-artifacts passes: the stage command is the
      released `seikika plan`, and the action README recommends
      `seikika-version` (actions/report/README.md:35, 112).
      decoupled-from-core passes because main.rs:880-905 plans any two
      manifests through the package loader (load.rs:325-360).
  - criterion: reproducible
    verdict: pass
    reason: >-
      Each verdict rests on readable facts. `checks:` is a ratchet action
      (action.yml:154). No plan test covers a package bump (reference.rs:73,
      111). There is no rollout workflow under .github/workflows. The source
      build only runs when `seikika-version` is empty (action.yml:94).
  - criterion: actionable
    verdict: pass
    reason: >-
      Each suggestion would change its verdict. A test that plans a package
      bump, listed under `checks:`, would satisfy executable-exit (adopt.yaml
      lines 19-22). A reusable rollout workflow that bumps, installs, plans
      and opens a PR is exactly the second half of the exit criterion
      (adopt.yaml lines 33-36).
summary: >-
  The fail, fail, pass, pass verdicts are right and the suggestions would
  flip the fails. Two supporting claims do not hold. federation.md:84-85
  promises the plan half, not a rollout workflow (that is packages.md §8),
  and `seikika install old.yaml` does install the base version
  (install.rs:194-218).
