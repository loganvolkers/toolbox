      meta-catalog.md:94 and 173 have `uses → credential scope` and "not
      over-privileged". gitlab main.rs:6 says "needs `read_api`" and github
      main.rs:3 names no scopes. .seikika/fixtures/workspace.ndjson:23 and 57
      are bronze fixtures, and .seikika/results.json has all six connectors at
