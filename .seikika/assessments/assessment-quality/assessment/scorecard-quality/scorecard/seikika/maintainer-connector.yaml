      (docs/design/thresholds.md:35)". That line says "10 scorecards". In this
      portal, eight standards files define the rule, and maintainer-crate
      (crates.yaml) has no such rule.
    suggestion: >-
      Say "the killer item shared by the cards that scan for credentials
      (thresholds.md:35)" rather than "every catalogued kind".
