apiVersion: seikika.com/assessment/v1
entity: sdlc-stage:package-author/test
rubric: sdlc-stage-quality
subjectHash: e35f1feceea9
assessor: {kind: agent, name: cursor-assessor-22, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      CI runs `seikika test` on each packages/*/tests portal, but with
      target/debug/seikika built at HEAD (.github/workflows/ci.yml:67-71) on
      one platform. No workflow installs a released version: no
      `seikika-version` or install-release.sh appears in .github/workflows/.
      The "each supported release and platform" half of the exit criterion is
      therefore unchecked. Meta bronze is covered only for packages S4S
      includes (.seikika/seikika.yaml:361-384), through its ratchet.
    suggestion: >-
      Add a matrix job that installs each supported release with
      scripts/install-release.sh, on Linux, macOS and Windows, and runs
      `seikika test packages/<name>/tests`.
  - criterion: agent-can-complete
    verdict: fail
    reason: >-
      An agent can run `seikika test packages/github-actions/tests`, but it
      cannot learn which releases a package supports. seikika-package.yaml has
      no Seikika range (crates/seikika-model/src/package.rs:9-10). The test
      portal's `portal.seikika: "0.1"`
      (packages/github-actions/tests/seikika.yaml:8) is only parsed
      (crates/seikika-model/src/manifest.rs:114) and never compared against
      the running binary.
    suggestion: >-
      Add a `seikika:` version range to seikika-package.yaml, enforced at
      load, so the matrix is derived from the package rather than guessed.
  - criterion: reuses-artifacts
    verdict: fail
    reason: >-
      The only package tests in this repository compile Seikika from source
      first (ci.yml:67-71 use target/debug). Releases v0.1.0 and v0.1.1 exist
      (git tags) with installers (scripts/install-release.sh:6-8), yet no
      package test uses them.
    suggestion: >-
      Test this repository's packages against the pinned release binary, as an
      outside author would, and keep the source build for maintainer CI.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      A package's tests are fixtures plus a mini-portal
      (package-author-sdlc.md §6.1 and §6.3, lines 222-254). Any author runs
      them with the released `seikika test`, without a crate change.
# Codex evaluated the two added criteria. Earlier verdicts retain their original attribution.
  - criterion: fast-feedback
    verdict: fail
    reason: >-
      .seikika/sdlc/stages/package-author.yaml lists seikika test
      packages/github-actions/tests. docs/design/package-author-sdlc.md gives
      no measured local time to the stage exit.
    suggestion: >-
      Measure and record the fastest local check that demonstrates this stage
      exit in docs/design/package-author-sdlc.md.
  - criterion: beyond-one-reference
    verdict: pass
    reason: >-
      The package loop in .github/workflows/ci.yml runs the github-actions and
      pattern-count package test portals, among others.
summary: >-
  An agent can test a package today on fixtures, but only against the
  workspace build, on one platform. The stage's defining fork, testing
  against released versions across platforms, has no matrix, version range
  or check, though the releases it needs now exist.
