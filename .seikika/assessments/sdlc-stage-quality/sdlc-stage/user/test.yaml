apiVersion: seikika.com/assessment/v1
entity: sdlc-stage:user/test
rubric: sdlc-stage-quality
subjectHash: bde8f8cf4af6
assessor: {kind: agent, name: cursor-assessor-22, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      `min_snapshot` is a lower bound, not a pin. snapshot_for waits until the
      published snapshot is at least the one asked for, then answers from the
      latest (crates/seikika-api/src/routes.rs:105-139; P8 in
      docs/v1-spec.md:568 is read-your-writes). scripts/m2-acceptance.sh:44-56
      checks read-your-writes and :59-64 a stable snapshot across restarts.
      Neither would fail if two reads with the same min_snapshot returned
      different data after a later ingest, which the code allows.
    suggestion: >-
      Either restate the exit criterion as read-your-writes (P8), which m2
      already checks, or add an exact `at_snapshot` read with a retention
      window, and an acceptance step that ingests, then re-reads at the old
      snapshot.
  - criterion: agent-can-complete
    verdict: fail
    reason: >-
      The stage's command, `seikika get`, has no snapshot option (`seikika get
      --help` lists --fields, --url, --token, --as, -o), so an agent must fall
      back to curl on REST. An app's own CI also has no recorded-fixture mode
      (stage gap, docs/design/user-sdlc.md:84-85). It needs the operator's
      portal checkout to run `seikika serve --fixtures`.
    suggestion: >-
      Add `--min-snapshot` (and an exact pin, if adopted) to the read commands
      and MCP tools, and ship the contract test kit of user-sdlc.md §5 item 5.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      A deterministic test .seikika needs only the released binary. Two
      restarts of `seikika serve examples/reference-portal --fixtures` both
      published snapshot 4.a88f99fe9321, and `GET
      /v1/entities/repository:ledger` returned byte-identical bodies (same
      md5). Nothing is compiled.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      Reproducible app tests are possible today without a Seikika change: an
      in-memory fixture server (`seikika serve --fixtures`,
      crates/seikika-cli/src/main.rs:701-703) yields the same snapshot id and
      data on every start, as observed above, because the id is the input
      version plus the manifest hash
      (crates/seikika-api/src/state.rs:180-181).
# Codex evaluated the two added criteria. Earlier verdicts retain their original attribution.
  - criterion: fast-feedback
    verdict: fail
    reason: >-
      .seikika/sdlc/stages/user.yaml lists seikika get. docs/v1-spec.md gives
      no measured local time to the stage exit.
    suggestion: >-
      Measure and record the fastest local check that demonstrates this stage
      exit in docs/v1-spec.md.
  - criterion: beyond-one-reference
    verdict: fail
    reason: >-
      .seikika/sdlc/stages/user.yaml lists scripts/m2-acceptance.sh as
      evidence. The declared checks name no second exercised reference for
      this stage exit.
    suggestion: >-
      Exercise this exit on a second reference and cite the result in
      .seikika/sdlc/stages/user.yaml.
summary: >-
  Partial, and the exit criterion overstates what `min_snapshot` does: it
  gives read-your-writes, not pinned reads, so m2 cannot fail on the
  stated property. Fixture-backed servers are deterministic and need no
  rebuild, but the CLI cannot pass a snapshot and there is no
  recorded-fixture mode.
