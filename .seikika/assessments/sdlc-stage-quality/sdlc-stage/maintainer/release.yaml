apiVersion: seikika.com/assessment/v1
entity: sdlc-stage:maintainer/release
rubric: sdlc-stage-quality
subjectHash: 8ba73c94224c
assessor: {kind: agent, name: cursor-cloud-agent, model: claude-opus-5.5}
at: 2026-11-24
verdicts:
  - criterion: executable-exit
    verdict: fail
    reason: >-
      The binaries half is checked: a tag runs .github/workflows/release.yml,
      which attests every archive, and v0.1.0 and v0.1.1 exist (v0.1.1 has 76
      assets). The image half has never run: `gh run list --workflow
      image.yml` returns no runs, so no tag has an image
      (.seikika/sdlc/stages/maintainer.yaml lines 121-124). "Consumers pin
      them" is checked by nothing: no workflow under .github/ sets
      seikika-version, so the download path in actions/report/action.yml
      (lines 84-91) never runs in CI.
    suggestion: >-
      Add a CI job that runs ./actions/report with seikika-version set to the
      latest release and fails if it falls back to building; add a step after
      custom-image that runs `gh attestation verify
      oci://ghcr.io/<owner>/seikika:<version>`; dispatch image.yml for v0.1.1.
  - criterion: agent-can-complete
    verdict: pass
    reason: >-
      An agent with push access completes it from the documented commands: set
      the version, `dist plan`, tag and push (docs/RELEASING.md, "Cut a
      release"; docs/design/maintainer-sdlc.md "Releasing"), and release.yml
      then builds archives, installers, the release and the image with
      GITHUB_TOKEN only. docs/RELEASING.md calls the tag a "human step for
      now", but it is a command, not a secret, and the repository is public,
      so the visibility step it describes is already done.
  - criterion: reuses-artifacts
    verdict: pass
    reason: >-
      .github/workflows/image.yml builds the image from the release's
      checksum-verified Linux archives and compiles nothing, and consumers are
      told to pin a release (docs/RELEASING.md, "Install what a consumer
      needs"; scripts/install-release.sh). This repository's own CI still
      builds actions/report from source, which the stage lists as a gap.
  - criterion: decoupled-from-core
    verdict: pass
    reason: >-
      Cutting a release is a version bump and a tag driven by
      dist-workspace.toml; it adds no crate, builtin or schema, and
      .github/workflows/image.yml resolves its repository and owner from the
      run, so a fork releases the same way.
  - criterion: fast-feedback
    verdict: fail
    reason: >-
      No doc measures a release gate. docs/design/maintainer-sdlc.md §3 has no
      row for `dist plan` or a release run, docs/research-log.md records that
      `dist plan` passed but not how long it took, and the image half can only
      be learned from a tag or a workflow_dispatch of
      .github/workflows/image.yml.
    suggestion: >-
      Time `dist plan` and a host-target `dist build` and add them to
      docs/design/maintainer-sdlc.md §3; add a local script that builds the
      image from scripts/install-release.sh output, so an image change is
      checked before a tag.
  - criterion: beyond-one-reference
    verdict: pass
    reason: >-
      The stage produces a release tag, with no example to fit, and it builds
      for five targets (dist-workspace.toml: aarch64-apple-darwin,
      aarch64-unknown-linux-gnu, x86_64-apple-darwin,
      x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc), built by the
      build-local-artifacts matrix in .github/workflows/release.yml; two tags,
      v0.1.0 and v0.1.1, have been cut.
summary: >-
  Binaries release from a tag for five platforms with attestations, but
  the image path has never run and nothing checks that consumers pin a
  release. No release gate has a measured time.
