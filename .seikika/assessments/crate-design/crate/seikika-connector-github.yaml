apiVersion: seikika.com/assessment/v1
entity: crate:seikika-connector-github
rubric: crate-design
subjectHash: e887cf4affaa
assessor: {kind: agent, name: cursor-assessor-19, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-responsibility
    verdict: pass
    reason: >-
      One source and one job: read a GitHub org through the REST API into five
      record kinds (crates/seikika-connector-github/src/main.rs:1-15). The
      workflow-run statistics sit in their own module with their own docs
      (src/runs.rs:1-3). This matches the `github` row of docs/v1-spec.md:100.
      Two pieces of drift, neither a second job: - The Cargo description
      doesn't mention `workflow-runs`. - docs/v1-spec.md:355-356 also promises
      "webhooks for repository and push events", which the crate doesn't
      implement and its docs don't claim.
  - criterion: small-contract
    verdict: pass
    reason: >-
      A binary with no dependents. It uses only `Out`, `Source` and
      `run_stdio` from the SDK (main.rs:20). It advertises `workflow-runs`
      only when `actions` is configured (main.rs:408-421), so the conformance
      kit's capability check matches the manifest. docs/research-log.md:74
      records the bug that this fixed.
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      It wraps none of the charter defaults. Its dependencies are jsonwebtoken
      (for the App JWT), reqwest, serde_json, tokio and seikika-connect
      (crates/seikika-connector-github/Cargo.toml). No GitHub client crate
      leaks into any signature.
  - criterion: tests-match-risk
    verdict: fail
    reason: >-
      Two paths have direct tests: CODEOWNERS parsing with base64
      (main.rs:467-483), and run statistics (src/runs.rs:109-160, including
      cancelled runs and reruns). Scoped refresh, `not_found` and resync go
      through the conformance kit against
      examples/reference-portal/tools/mock_github.py
      (scripts/m4-acceptance.sh:33). The riskiest production path has no test
      at any level: GitHub App authentication (main.rs:70-106). - It mints a
      new installation token on every GET (main.rs:116). - It never checks the
      access_tokens response status, so a rejected key silently falls back to
      unauthenticated requests (main.rs:90-105). - The mock has no
      `/app/installations/{id}/access_tokens` route (mock_github.py:8-10). -
      The mock returns empty pages after page 1 (mock_github.py:10), so the
      100-item paging loop (main.rs:132-153) is only exercised for one page. -
      The installation `selector` filter (main.rs:312-319) has no test.
    suggestion: >-
      Cache the installation token until shortly before `expires_at`, and fail
      the command when access_tokens returns a non-2xx status. Add an
      access_tokens route to mock_github.py, and a run of the conformance kit
      with `appId`, `privateKey` and `installationId` (a test key like
      crates/seikika-authz/tests/fixtures/test-rsa.pem). Add a unit test for
      the installation selector, including the `app` → `app_slug` alias.
summary: >-
  A single-source connector with a clean SDK boundary and capabilities
  that track its configuration. The parsers are unit-tested and the
  token-auth path is checked by the conformance kit. GitHub App
  authentication is untested and fragile: it mints a token per request and
  ignores errors. The spec still promises webhooks the crate doesn't have.
