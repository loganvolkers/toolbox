apiVersion: seikika.com/assessment/v1
entity: crate:seikika-secrets
rubric: crate-design
subjectHash: 66ea447342d0
assessor: {kind: agent, name: cursor-assessor-20, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-responsibility
    verdict: pass
    reason: >-
      The crate does one thing: it resolves `${secret:…}` placeholders in
      connector config through a backend chain of env, mounted files, and then
      opt-in remotes. Its docs say so (crates/seikika-secrets/src/
      lib.rs:1-6), and so do D01M8174KFJCBKKG37B9SS8P9RF (extending D55) and
      its row in docs/v1-spec.md:96. The `b64`, `http` and `config` modules
      serve that one job: base64 for the remote payloads, a mockable transport
      for the remote backends, and the SEIKIKA_SECRETS_CONFIG parser
      (docs/design/secret-vault.md §3).
  - criterion: small-contract
    verdict: pass
    reason: >-
      There is one dependent, seikika-api, and it uses only `resolve_config`
      and `global()` in production
      (crates/seikika-api/src/connectors.rs:207-211). Its tests also use
      `SecretResolver::new` and `EnvBackend::from_map` (connectors.rs:
      585-586). No third-party type crosses: the backends return
      `SecretBytes`, which redacts itself in Debug and Display and is zeroized
      on drop (src/bytes.rs:94-127). The surface is wider than the caller
      needs, though. All seven modules are `pub` (lib.rs:8-14) and doc
      coverage is 57%: the backend constructors, `SecretBytes::new`,
      `b64::decode` and others are undocumented (facts: undocumented).
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      The crate wraps none of the charter's defaults, and the cloud providers
      are kept behind Seikika's own seams. `SecretBackend`
      (crates/seikika-secrets/src/backends/mod.rs:22-25) and `HttpTransport`
      (crates/seikika-secrets/src/http.rs:15-23) are Seikika traits. reqwest
      is optional and feature-gated (crates/seikika-secrets/Cargo.toml:10-17,
      25), with no cloud SDKs. `ReqwestTransport` keeps its reqwest client
      private (crates/seikika-secrets/src/http.rs:46-48), and no public
      signature names a reqwest or provider type. The remote backends are
      default features, so seikika-api does pull reqwest in through this
      crate, but it already depends on reqwest directly
      (crates/seikika-api/Cargo.toml:30).
  - criterion: tests-match-risk
    verdict: fail
    reason: >-
      Several paths have direct tests: - the chain order and nested resolution
      (src/resolver.rs:357-398); - redaction (bytes.rs:133-140); - each remote
      backend against wiremock and in unit tests
      (tests/wiremock_remotes.rs:41-152, backends/aws.rs:149-177, gcp.rs:
      165-202). Three riskier paths are not tested: - Required mode. The
      design says `required: true` fails instead of omitting the key
      (docs/design/secret-vault.md:31-32). But `resolve_config`, the only
      entry point seikika-api calls, catches the Required error, prints it,
      and returns `{}` (resolver.rs:333-338). The connector then starts with
      an empty config. The test required_mode_errors covers only
      `resolve_value` (resolver.rs:400-406). - Path handling. FileBackend
      joins the logical name straight onto its directory
      (backends/file.rs:19-27), and a `file:` ref passes its rest through
      unchanged (resolver.rs:206-207). So `../x` or an absolute path reads
      outside SEIKIKA_SECRETS_DIR, with no guard and no test. - Soft-skipping
      of unauthenticated backends. It matches error message text such as "no
      VAULT_TOKEN" (resolver.rs:180-188) and is untested, so rewording an
      error would silently change the chain's behaviour.
    suggestion: >-
      Make resolve_config return a Result, or refuse to start a connector when
      required mode fails, and test that through resolve_config. Reject
      logical names containing `/`, `\` or `..` in FileBackend, and test it.
      Replace the message matching with a typed `SecretError` variant, for
      example NotAuthenticated, and test that a backend without credentials is
      skipped.
summary: >-
  A well-scoped crate with Seikika-owned seams for every provider and a
  small surface as its one caller uses it. The remote backends are tested
  against wiremock. The gaps are in the paths that matter most for
  secrets. Required mode is swallowed by resolve_config, which contradicts
  the design. Mounted-file lookups have no path guard. Skipping a backend
  depends on error wording. None of the three has a test.
