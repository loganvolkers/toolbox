entity: crate:seikika-connector-runner
rubric: crate-design
subjectHash: 41a8b4b95aaa
assessor: {kind: agent, name: cursor-assessor-19, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-responsibility
    verdict: pass
    reason: >-
      One job: run configured local commands and turn their output into
      records (crates/seikika-connector-runner/src/main.rs:1-22), refreshed
      per entity, as docs/design/seikika-for-seikika.md §3 describes. It is
      the `runner` of docs/v1-spec.md:100. It has nine `parse` formats, but
      each is a fitting from one tool's output to records:
      - SARIF is the standard slot, per docs/design/seikika-and-tools.md.
      - zizmor, actionlint and semgrep are in src/lint.rs.
      - Scorecard is in src/scorecard.rs.

      None adds a second responsibility. The crate docs are one dense
      paragraph (main.rs:6-22), and a per-format list would read better.
  - criterion: small-contract
    verdict: pass
    reason: >-
      A binary with no dependents. It uses the SDK's `Out`, `Source` and
      `run_stdio` (crates/seikika-connector-runner/src/main.rs:32), plus
      `files::glob` and `files::matching`
      (crates/seikika-connect/src/files.rs). It wraps `Out` in a private
      `Sink` that narrows output to the kinds and ids a command asked for
      (main.rs:163-217). That narrowing is a rule every connector must follow,
      so the SDK could own it, but nothing leaks.
  - criterion: replaceable-defaults
    verdict: pass
    reason: >-
      It wraps none of the charter defaults. Its dependencies are regex,
      serde_json, tokio and seikika-connect
      (crates/seikika-connector-runner/Cargo.toml). The tools it runs are
      named in portal configuration (.seikika/seikika.yaml:253-300), not in
      code. One small gap: `regex = "1"` isn't a workspace dependency.
  - criterion: tests-match-risk
    verdict: unsure
    reason: >-
      Parsing third-party output is the biggest risk, and each format has a
      direct test: cargo-test and clippy (main.rs:797-827), zizmor, semgrep,
      SARIF and actionlint (src/lint.rs:231-347), and Scorecard
      (src/scorecard.rs:46-63). tests/any_repo.rs:31-88 covers running outside
      Cargo, `optional`, and `{files}` expansion. The conformance kit runs in
      CI on two runner instances, both ndjson and lint jobs
      (.github/workflows/ci.yml:106-107). Three paths are covered only by the
      self-portal report, or only on the failure path: - per-crate refresh
      routing and `not_found` for unknown crates (main.rs:585-606, the
      `runner` instance at .seikika/seikika.yaml:253-297, which no conformance
      run uses); - `tally` counting with `declared` keys (main.rs:423-462); -
      `export_tracked` (main.rs:699). A failed export now removes its temp
      directory (main.rs:844, `TempTree`'s Drop), but nothing checks that a
      successful export keeps tracked edits and drops untracked files.
    suggestion: >-
      Add a unit test for `run_tally` over a small NDJSON file with a
      declared-only key and an error line. Add an any_repo-style test that
      runs `export_tracked` in a scratch git repo with an uncommitted edit and
      an untracked file, and checks both land as a fresh checkout would. Add a
      refresh test for a `per: crate` job with an unknown crate id that
      expects `not_found`.
summary: >-
  A cohesive command runner whose output fittings are each unit-tested,
  with conformance checked in CI on two configurations. The less visible
  paths are only exercised by the self-portal report: per-crate refresh
  routing and tally counting. The tracked-file export now has a test that
  a failed export leaves no directory (main.rs:844); the successful export
  is still untested, so the test verdict stays unsure.
