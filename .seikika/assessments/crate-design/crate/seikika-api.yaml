apiVersion: seikika.com/assessment/v1
entity: crate:seikika-api
rubric: crate-design
subjectHash: e67cef600492
assessor: {kind: agent, name: cursor-assessor-19, model: claude-opus-5.5}
at: 2026-11-25
verdicts:
  - criterion: one-responsibility
    verdict: fail
    reason: >-
      The crate docs are stale. They say "snapshot loop + REST API. Later
      milestones add authorization (M3), MCP, the UI host and connectors
      (M4)" (crates/seikika-api/src/lib.rs:1-2), and the Cargo description
      says MCP and the UI "arrive in M4". All of those shipped. The crate
      now also holds:
      - the connector runtime: supervision, freshness resyncs, reconciliation
      (src/connectors.rs:1-4);
      - action runs with approvals and their own Postgres or file
      persistence (src/actions.rs:1-30);
      - assessment briefs (src/assess.rs).

      The docs/v1-spec.md:96 row says "axum REST + OpenAPI generation; MCP
      (rmcp); UI host". There is no OpenAPI generation, MCP is hand-written
      JSON-RPC rather than rmcp (src/mcp.rs:1-4; no `rmcp` in any
      Cargo.toml), and the connector runtime the spec gives to seikika-connect
      (docs/v1-spec.md:94) is here. Neither the docs nor the spec say what
      this crate is today.
    suggestion: >-
      Rewrite lib.rs's doc to name the crate's actual job ("the served portal:
      REST, MCP, UI host, connector runtime and action runs over one
      AppState") and list its modules. Update the Cargo description and the
      v1-spec §4 rows for seikika-api and seikika-connect (or record a
      decision) so OpenAPI, rmcp and the connector runtime's home match the
      code.
  - criterion: small-contract
    verdict: fail
    reason: >-
      The intended contract is small and documented: `app_state_with`,
      `Config` and `serve` (src/lib.rs:23-84). But all eleven modules are
      `pub` (src/lib.rs:4-15), and the CLI reaches into server modules for
      logic that has nothing to do with serving:
      - `connectors::resolve_config` and `connectors::binary_for`
      (src/connectors.rs:209-219) are used by `seikika report`,
      `seikika install` and `connector test`
      (crates/seikika-cli/src/report.rs:162-166, 1445-1446;
      crates/seikika-cli/src/install.rs:331;
      crates/seikika-cli/src/main.rs:1126).
      - `actions::signing_seed`, `actions::approval_key_for` and
      `actions::served_dir` are used by the offline `seikika run` and by
      `serve --detach` (crates/seikika-cli/src/run.rs:314, 687;
      crates/seikika-cli/src/detach.rs:28, 195).

      So a checkout-only command links the whole server for config
      resolution and a key derivation.
    suggestion: >-
      Move `resolve_config` and `binary_for` to seikika-connect, or to
      seikika-model next to `artifacts`. Move `signing_seed` and
      `approval_key_for` to seikika-exec's `grant` module. Make the remaining
      modules `pub(crate)`, except what tests and `serve` need.
  - criterion: replaceable-defaults
    verdict: fail
    reason: >-
      Reads go through `Arc<dyn Store>` and `Arc<dyn Authorizer>`
      (src/state.rs:88-94). The UI host serves whatever bundle is in crates/seikika-api/ui-dist,
      with no React dependency (src/ui.rs:7-9). But the public
      `app_state_with` and `AppState` take a concrete
      `Option<seikika_store::PgStore>` next to the trait object
      (src/lib.rs:24-49; src/state.rs:94). Three things bypass the Store
      contract:
      - action-run persistence (`pg.runs`, `put_run`, `put_spent`;
      src/actions.rs:157-161, 183-195);
      - snapshot-loop leadership (`pg.try_lead`, src/state.rs:277-279);
      - a second, file-based backend hand-written inline for the same runs
      (src/actions.rs:166-199).

      Swapping Postgres would change this crate, not just seikika-store.
    suggestion: >-
      Add run records, spent tokens and the leader lease to the `Store` trait,
      or to a small `RunStore` trait with Postgres and file implementations in
      seikika-store. Then hold only trait objects in `AppState`, and drop `pg:
      Option<PgStore>` from `app_state_with`.
  - criterion: tests-match-risk
    verdict: fail
    reason: >-
      There is broad integration coverage:
      - REST reads and filters (tests/api.rs:34-318);
      - forge identity refusals (tests/api.rs:320-352);
      - facet shaping, revocation, hidden-facet probing and snapshot-bound
      decisions, required in CI (tests/authz.rs:89-322);
      - every MCP tool (tests/mcp.rs:80-627);
      - the served action path (scripts/m5-acceptance.sh:108-112).

      Three risky server-side guards have no test anywhere:
      1. The deletion safety valve, which holds a resync's deletes at ≥90%
      of a kind (src/connectors.rs:22, 98-131). No test or script matches
      DELETION_THRESHOLD or "held … deletes".
      2. Connector bearer-token authentication (`connector_of`,
      src/routes.rs:654-671). Every test uses the dev header
      `x-seikika-connector` (tests/api.rs:48), and nothing sets
      `connector_tokens`.
      3. Rejection of an undeclared connector or record kind
      (src/connectors.rs:31-50).

      `markdown` in src/mcp.rs:619 (complexity 51, 378 lines) is only
      checked through a few tool outputs.
    suggestion: >-
      Add API tests: - ingest N records, then resync with none, and assert the
      deletes are held; then resync with N-1 and assert one delete; -
      configure a connector token and assert 401 without it, 401 with another
      connector's token, and 202 with its own; - post a record of an
      undeclared kind and assert 422 `invalid-messages`; - post as an
      undeclared connector and assert 403.
summary: >-
  The served-portal crate has good end-to-end tests for reads,
  authorization and MCP. Its design has drifted, though. The crate docs
  and spec row predate M4 and M5. Every module is public, and offline CLI
  commands reach into it. Run persistence bypasses the Store trait through
  a concrete PgStore. The guards that protect data on ingest (the deletion
  safety valve, connector tokens, kind scoping) are untested.
