# Seikika report: score this repository with its repo portal and ratchet against a committed
# baseline (docs/design/repo-portals.md, D66, D69). One step in a workflow:
#
#   - uses: actions/checkout@v4
#   - uses: seikika/seikika/actions/report@<commit sha>
#
# with `.seikika/seikika.yaml` in the repository (start from examples/repo-portal-starter) and
# `.seikika/results.json` committed (create it with `mode: update`, see the README next to this file).
name: Seikika report
description: >-
  Score a repository against its Seikika standards and fail when anything
  gets worse than the committed baseline.
author: Seikika
branding: {icon: check-square, color: blue}

inputs:
  working-directory:
    description: >-
      The repository checkout to score (connectors read it); portal and
      baseline are relative to it.
    default: .
  portal:
    description: Directory containing the repo portal's seikika.yaml.
    default: .seikika
  baseline:
    description: Results file to ratchet against (default <portal>/results.json).
    default: ""
  mode:
    description: >-
      ci (default): fail on regressions and when the baseline is out of date
      or missing. check: fail on regressions only. update: write improvements
      (or create the baseline) and upload it as an artifact to commit. report:
      no baseline, just the report.
    default: ci
  skip:
    description: Connectors not to run, comma-separated (e.g. a slow test runner).
    default: ""
  html:
    description: >-
      Also produce the one-page HTML report and upload it with the Markdown
      report.
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    default: seikika-report
  seikika-dir:
    description: >-
      A directory that already holds the seikika binaries (seikika,
      seikika-connector-*). Takes precedence over seikika-version.
    default: ""
  seikika-version:
    description: >-
      A released Seikika version (e.g. 0.2.0) to download, checksum-verified,
      from the action's repository's GitHub releases (D90). When empty, the
      action builds seikika from its own source at the action's ref, and
      caches it.
    default: ""

outputs:
  result:
    description: pass, regressed, stale, missing-baseline, unknown or error
    value: ${{ steps.run.outputs.result }}
  exit-code:
    description: Exit code of seikika report (0 pass, 1 ratchet failure, 2 error).
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path of the Markdown report.
    value: ${{ steps.run.outputs.report }}
  html:
    description: Path of the HTML report (when html is true).
    value: ${{ steps.run.outputs.html }}
  baseline:
    description: Path of the baseline file.
    value: ${{ steps.run.outputs.baseline }}
  verdict:
    description: >-
      Path of the verdict JSON (seikika-verdict/v1, D96) with each regression
      and improvement.
    value: ${{ steps.run.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Download released seikika binaries
      if: inputs.seikika-dir == '' && inputs.seikika-version != ''
      shell: bash
      env:
        SEIKIKA_REPO: ${{ github.action_repository || 'seikika/seikika' }}
        SEIKIKA_VERSION: ${{ inputs.seikika-version }}
        SEIKIKA_BIN: ${{ runner.temp }}/seikika-bin
        GH_TOKEN: ${{ env.GH_TOKEN || env.GITHUB_TOKEN || github.token }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
    - name: Cache key for the seikika build
      id: key
      if: inputs.seikika-dir == '' && inputs.seikika-version == ''
      shell: bash
      run: |
        root="$GITHUB_ACTION_PATH/../.."
        cd "$root"
        h=$(
          {
            sha256sum Cargo.toml Cargo.lock rust-toolchain.toml package.json pnpm-lock.yaml pnpm-workspace.yaml
            find crates npm/ui npm/ui-kit npm/report-ui \
              \( -name target -o -name node_modules -o -name .astro -o -name dist \
                -o -name storybook-static -o -name ui-dist -o -name report-dist \) -prune \
              -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          } | sha256sum | cut -c1-16
        )
        echo "key=seikika-bin-${RUNNER_OS}-${RUNNER_ARCH}-$h" >> "$GITHUB_OUTPUT"
    - name: Restore seikika binaries
      id: cache
      if: inputs.seikika-dir == '' && inputs.seikika-version == ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/seikika-bin
        key: ${{ steps.key.outputs.key }}
    - name: Restore the Cargo build (incremental across commits)
      if: >-
        inputs.seikika-dir == '' && inputs.seikika-version == '' &&
        steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/seikika-target
        key: ${{ steps.key.outputs.key }}-target
        restore-keys: seikika-bin-${{ runner.os }}-${{ runner.arch }}-
    - name: Set up Node for the source build
      if: >-
        inputs.seikika-dir == '' && inputs.seikika-version == '' &&
        steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: {node-version: 24}
    - name: Build seikika from the action's source
      if: >-
        inputs.seikika-dir == '' && inputs.seikika-version == '' &&
        steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env: {ASTRO_TELEMETRY_DISABLED: "1"}
      run: |
        cd "$GITHUB_ACTION_PATH/../.."          # rust-toolchain.toml pins the toolchain here
        corepack enable pnpm
        pnpm install --frozen-lockfile
        pnpm build
        cargo build --locked --target-dir "$RUNNER_TEMP/seikika-target" \
          -p seikika-cli -p seikika-connector-workspace -p seikika-connector-runner
        mkdir -p "$RUNNER_TEMP/seikika-bin"
        cp "$RUNNER_TEMP"/seikika-target/debug/seikika "$RUNNER_TEMP"/seikika-target/debug/seikika-connector-* "$RUNNER_TEMP/seikika-bin/" 2>/dev/null || true
        rm -f "$RUNNER_TEMP"/seikika-bin/*.d
    - name: Seikika report
      id: run
      shell: bash
      env:
        SEIKIKA_BIN: ${{ inputs.seikika-dir != '' && inputs.seikika-dir || format('{0}/seikika-bin', runner.temp) }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PORTAL: ${{ inputs.portal }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_HTML: ${{ inputs.html }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
    - name: Upload the report
      if: always() && steps.run.outputs.report != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.run.outputs.report }}
          ${{ steps.run.outputs.html }}
          ${{ steps.run.outputs.verdict }}
          ${{ inputs.mode == 'update' && steps.run.outputs.baseline || '' }}
        if-no-files-found: ignore
    - name: Fail on the ratchet's verdict
      if: steps.run.outputs.exit-code != '0'
      shell: bash
      env:
        REPORT_RESULT: ${{ steps.run.outputs.result }}
      run: |
        echo "::error title=Seikika report::${REPORT_RESULT} (see the job summary)"
        exit 1
