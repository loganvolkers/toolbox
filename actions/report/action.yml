# Toolbox report: score this repository with its repo portal and ratchet against a committed
# baseline (docs/design/repo-portals.md, D66, D69). One step in a workflow:
#
#   - uses: actions/checkout@v4
#   - uses: loganvolkers/toolbox/actions/report@<commit sha>
#
# with `.toolbox/toolbox.yaml` in the repository (start from examples/repo-portal-starter) and
# `.toolbox/results.json` committed (create it with `mode: update`, see the README next to this file).
name: Toolbox report
description: >-
  Score a repository against its Toolbox standards and fail when anything
  gets worse than the committed baseline.
author: Toolbox
branding: {icon: check-square, color: blue}

inputs:
  working-directory:
    description: >-
      The repository checkout to score (connectors read it); portal and
      baseline are relative to it.
    default: .
  portal:
    description: Directory containing the repo portal's toolbox.yaml.
    default: .toolbox
  baseline:
    description: Results file to ratchet against (default <portal>/results.json).
    default: ""
  mode:
    description: >-
      ci (default): fail on regressions and when the baseline is out of date
      or missing. check: fail on regressions only. update: write improvements
      (or create the baseline) and upload it as an artifact to commit. report:
      no baseline, just the report.
    default: ci
  skip:
    description: Connectors not to run, comma-separated (e.g. a slow test runner).
    default: ""
  html:
    description: >-
      Also produce the one-page HTML report and upload it with the Markdown
      report.
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    default: toolbox-report
  toolbox-dir:
    description: >-
      A directory that already holds the toolbox binaries (toolbox,
      toolbox-connector-*). Takes precedence over toolbox-version.
    default: ""
  toolbox-version:
    description: >-
      A released Toolbox version (e.g. 0.1.0) to download, checksum-verified,
      from the action's repository's GitHub releases (D90). When empty, the
      action builds toolbox from its own source at the action's ref, and
      caches it.
    default: ""

outputs:
  result:
    description: pass, regressed, stale, missing-baseline, unknown or error
    value: ${{ steps.run.outputs.result }}
  exit-code:
    description: Exit code of toolbox report (0 pass, 1 ratchet failure, 2 error).
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path of the Markdown report.
    value: ${{ steps.run.outputs.report }}
  html:
    description: Path of the HTML report (when html is true).
    value: ${{ steps.run.outputs.html }}
  baseline:
    description: Path of the baseline file.
    value: ${{ steps.run.outputs.baseline }}
  verdict:
    description: >-
      Path of the verdict JSON (toolbox-verdict/v1, D96) with each regression
      and improvement.
    value: ${{ steps.run.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Download released toolbox binaries
      if: inputs.toolbox-dir == '' && inputs.toolbox-version != ''
      shell: bash
      env:
        TOOLBOX_REPO: ${{ github.action_repository || 'loganvolkers/toolbox' }}
        TOOLBOX_VERSION: ${{ inputs.toolbox-version }}
        TOOLBOX_BIN: ${{ runner.temp }}/toolbox-bin
      run: bash "$GITHUB_ACTION_PATH/install.sh"
    - name: Cache key for the toolbox build
      id: key
      if: inputs.toolbox-dir == '' && inputs.toolbox-version == ''
      shell: bash
      run: |
        root="$GITHUB_ACTION_PATH/../.."
        h=$(cd "$root" && cat Cargo.lock rust-toolchain.toml $(find crates schema -type f -not -path '*/target/*' | LC_ALL=C sort) | sha256sum | cut -c1-16)
        echo "key=toolbox-bin-${RUNNER_OS}-${RUNNER_ARCH}-$h" >> "$GITHUB_OUTPUT"
    - name: Restore toolbox binaries
      id: cache
      if: inputs.toolbox-dir == '' && inputs.toolbox-version == ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/toolbox-bin
        key: ${{ steps.key.outputs.key }}
    - name: Restore the Cargo build (incremental across commits)
      if: >-
        inputs.toolbox-dir == '' && inputs.toolbox-version == '' &&
        steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ runner.temp }}/toolbox-target
        key: ${{ steps.key.outputs.key }}-target
        restore-keys: toolbox-bin-${{ runner.os }}-${{ runner.arch }}-
    - name: Build toolbox from the action's source
      if: >-
        inputs.toolbox-dir == '' && inputs.toolbox-version == '' &&
        steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/../.."          # rust-toolchain.toml pins the toolchain here
        cargo build --locked --target-dir "$RUNNER_TEMP/toolbox-target" \
          -p toolbox-cli -p toolbox-connector-workspace -p toolbox-connector-runner
        mkdir -p "$RUNNER_TEMP/toolbox-bin"
        cp "$RUNNER_TEMP"/toolbox-target/debug/toolbox "$RUNNER_TEMP"/toolbox-target/debug/toolbox-connector-* "$RUNNER_TEMP/toolbox-bin/" 2>/dev/null || true
        rm -f "$RUNNER_TEMP"/toolbox-bin/*.d
    - name: Toolbox report
      id: run
      shell: bash
      env:
        TOOLBOX_BIN: ${{ inputs.toolbox-dir != '' && inputs.toolbox-dir || format('{0}/toolbox-bin', runner.temp) }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PORTAL: ${{ inputs.portal }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_HTML: ${{ inputs.html }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
    - name: Upload the report
      if: always() && steps.run.outputs.report != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.run.outputs.report }}
          ${{ steps.run.outputs.html }}
          ${{ steps.run.outputs.verdict }}
          ${{ inputs.mode == 'update' && steps.run.outputs.baseline || '' }}
        if-no-files-found: ignore
    - name: Fail on the ratchet's verdict
      if: steps.run.outputs.exit-code != '0'
      shell: bash
      env:
        REPORT_RESULT: ${{ steps.run.outputs.result }}
      run: |
        echo "::error title=Toolbox report::${REPORT_RESULT} (see the job summary)"
        exit 1
