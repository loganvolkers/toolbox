# Storybook catalog hygiene (D01M7YNZFP68W0DR24PEA6T3FVM). Needs a workspace connector
# with storybooks globs (facts from seikika-connector-workspace).
apiVersion: seikika.com/package/v0
name: storybook
version: 0.3.0
description: >-
  Storybook project hygiene: config, story files, a11y addon, telemetry
  off, CI build and story tests.
parameters:
  requireA11yAddon:
    type: boolean
    default: true
    description: >-
      When true (default), silver a11y-addon requires @storybook/addon-a11y in
      deps or main addons.
fragments: [fragments/*.yaml]
