# A Toolbox package (D89): an existing semgrep rule as a ratcheted standard, with its inline
# `nosemgrep` suppressions as the baseline a campaign pays down. semgrep's own `--error` gate stops
# unsuppressed findings; this one also stops new suppressions (experiments/standards-ab: PostHog
# enforces its person-table rule with semgrep, and 65 of 80 findings are suppressed inline).
apiVersion: toolbox.dev/package/v0
name: semgrep
version: 0.2.0
description: >-
  Findings of semgrep rules per file, suppressed ones included. The
  ratchet fails a pull request that adds a finding to a file, suppressed
  or not, and a campaign pays the findings down.
parameters:
  name:
    type: string
    default: semgrep
    description: Names this standard's connector, scorecard and campaign.
  kind:
    type: string
    default: SemgrepFile
    description: The entity kind for scanned files (PascalCase; unique per include).
  title:
    type: string
    default: No semgrep findings
    description: The scorecard's heading.
  owner:
    type: string
    default: group:maintainers
    description: Who owns the standard.
  root:
    type: string
    default: .
    description: The checkout semgrep runs in, relative to where `toolbox report` runs.
  config:
    type: string
    description: semgrep's `--config`, e.g. .semgrep/rules/no-direct-persons-db-orm.yaml.
  target:
    type: string
    default: .
    description: >-
      What semgrep scans (a directory or file). The rule's own `paths` still
      apply.
  fix:
    type: string
    default: >-
      Fix the finding as the rule's message says, and remove any nosemgrep
      comment.
    description: What to do about a finding (shown with each one).
fragments: [fragments/*.yaml]
