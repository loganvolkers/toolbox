# One semgrep run through the box's SARIF slot: semgrep's SARIF marks nosemgrep findings as
# suppressed (`suppressions: [{kind: inSource}]`), so they are counted too. One record per file
# with findings, with `total`, `suppressed`, `active` and `command` (the run, to repeat it alone).
connectors:
  - name: ${param:name}
    package: builtin:runner
    runtime: in-image
    config:
      name: ${param:name}
      root: ${param:root}
      jobs:
        - name: ${param:name}
          command:
          - semgrep
          - --config
          - ${param:config}
          - --metrics=off
          - --disable-version-check # its startup check stalls ~190 s on a closed network
          - --sarif
          - --quiet
          - ${param:target}
          parse: sarif
          optional: true # not installed → the rule is unknown, not failing
    records: ["${param:name}"]
    refresh: {"${param:name}": [external_ids]}
    freshness: {"${param:name}": 15m}

kinds:
  - name: ${param:kind}
    description: >-
      A file scanned by the ${param:name} standard (semgrep findings,
      suppressed or not).
    identityFrom: ["connector:${param:name}"]
    fields:
      path: {type: string}
      total: {type: integer}
      suppressed: {type: integer}
      active: {type: integer}
      findings: {type: list, items: object}
    sources: {default: ["connector:${param:name}"]}
    map:
    - from: ${param:name}/${param:name}
      id: "'${param:name}:' + record.path"
      set: >-
        {'path': record.path, 'total': record.total, 'suppressed':
        record.suppressed, 'active': record.active, 'findings': record.findings}

scorecards:
  - name: ${param:name}
    title: ${param:title}
    description: >-
      Each semgrep finding is a violation, including those suppressed with
      nosemgrep. The measure is the number of findings, so a new finding or a
      new suppression is a regression.
    rationale: >-
      Semgrep's rules encode the bug and security patterns a team chose to
      enforce. Counting suppressed findings too keeps nosemgrep from becoming
      a quiet way to pass: a suppression is a decision a reviewer should see.
    links:
    - title: The box and the tools
      url: https://github.com/seikika/seikika/blob/main/docs/design/seikika-and-tools.md
    - title: 'Semgrep: ignoring findings'
      url: https://semgrep.dev/docs/ignoring-files-folders-code
    kind: ${param:kind}
    owner: ${param:owner}
    levels: [clean]
    ratchet: {newEntitiesAtLeast: clean}
    rules:
    - name: no-findings
      level: clean
      check: entity.total == 0
      measure: entity.total
      dataFrom: ${param:name}
      evidence: >-
        entity.findings.map(f, 'line ' + string(f.line) + ': ' + f.rule +
        (f.suppressed ? ' (suppressed)' : ''))
      fix: ${param:fix}
      rationale: >-
        A finding is a pattern the configured rules call a bug or a risk. A new
        suppression hides one rather than fixing it, so both count until a
        reviewer accepts them in the baseline.
    facets: {summary: public, details: public}

campaigns:
  - name: ${param:name}-zero
    title: "${param:title}: to zero"
    owner: ${param:owner}
    description: >-
      No findings and no suppressions. Progress is counted from the starting
      point saved in the baseline.
    includes: [{scorecard: '${param:name}', rules: [no-findings]}]
