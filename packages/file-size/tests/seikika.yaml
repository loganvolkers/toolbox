# The package's test portal: includes the package as a consumer would, with its own parameters.
# Run: seikika test packages/file-size/tests
apiVersion: seikika.com/v1alpha1
portal:
  name: file-size-package
  title: File size standard (package tests)
  owner: group:maintainers
  seikika: "0.1"
include:
  - package: ..
    with:
      name: module-size
      kind: RustFile
      files: [src/**/*.rs]
      exclude: [src/**/tests/**]
      exempt: {src/generated.rs: generated by build.rs}
      limit: 800
tests: [standards.test.yaml]
