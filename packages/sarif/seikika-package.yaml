# A Seikika package (D89): any tool with SARIF output, in the box as a ratcheted standard with a
# campaign to zero (docs/design/seikika-and-tools.md: the SARIF slot, as one include).
apiVersion: seikika.com/package/v0
name: sarif
version: 0.3.0
description: >-
  Put any SARIF-emitting tool (ruff, semgrep, zizmor, gitleaks, an ESLint
  SARIF formatter) in the box: one record per file, a scorecard that every
  file must pass, and a campaign to zero.
parameters:
  track:
    type: string
    default: null
    description: >-
      The portal track its scorecards and campaigns belong to; leave unset if
      the portal has no tracks.
  name:
    type: string
    description: >-
      Names the connector, record kind, scorecard and campaign (e.g.
      maintainer-python).
  kind:
    type: string
    description: The entity kind for the files (PascalCase, unique per include).
  kindTitle:
    type: string
    default: null
    description: >-
      The kind's name as readers see it (e.g. Python file); unset, reports
      split the kind name into words.
  tool:
    type: string
    description: >-
      The tool's program name, pinned under `tools:` and checked by `seikika
      doctor`.
  version:
    type: string
    description: The tool version the standard was made with.
  versionArgs:
    type: array
    default: [--version]
    description: How `seikika doctor` asks the tool its version.
  install:
    type: object
    default: {}
    description: >-
      The tool's id for each installer `seikika tools install` can run, e.g.
      {pypi: ruff, mise: "pipx:ruff", aqua: astral-sh/ruff}. Any subset; none
      is required.
  command:
    type: array
    description: >-
      The tool's command, printing SARIF to stdout. A word `{files}` becomes
      the files matching `files`. Keep the tool's settings in its own config
      file, so the command runs the same alone.
  files:
    type: array
    default: []
    description: Globs of the files covered; each gets a record, clean ones included.
  root:
    type: string
    default: .
    description: Where the tool runs, relative to where `seikika report` runs.
  countSuppressed:
    type: boolean
    default: false
    description: >-
      Count findings suppressed inline (SARIF suppressions: `noqa`,
      `nosemgrep`) as violations, so a campaign pays them down too.
  title:
    type: string
    default: No findings
    description: The scorecard's heading.
  owner:
    type: string
    default: group:maintainers
    description: Who owns the standard.
  fix:
    type: string
    default: >-
      Fix the tool's findings (the record's command reruns them), or configure
      the rule in the tool's own config file with a comment saying why.
    description: What to do about a violation.
fragments: [fragments/*.yaml]
