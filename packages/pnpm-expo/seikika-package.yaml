# pnpm workspace + Expo app hygiene (D01M7Y6X38AERPBT0YH1AG5TBRD). Needs a workspace connector
# with jsWorkspace: true and expoApps globs (facts from seikika-connector-workspace).
apiVersion: seikika.com/package/v0
name: pnpm-expo
version: 0.3.0
description: >-
  pnpm workspace and Expo app hygiene: packageManager pin, lockfile +
  frozen CI, linker policy, toolchain alignment, Expo SDK / EAS /
  doctor-in-CI.
parameters:
  expoAppGlobs:
    type: string
    default: apps/*/app.json
    description: >-
      Glob for Expo app configs (passed through to the consumer's workspace
      connector).
  requireHoisted:
    type: boolean
    default: false
    description: >-
      When true, silver linker-policy requires an explicit hoisted /
      node-linker=hoisted policy (React Native / Expo monorepos that still
      need it).
fragments: [fragments/*.yaml]
