# The package's own expectations, over its own fixtures (package author SDLC: test).
name: github-actions
assert:
  - name: >-
      tag-pinned actions fail bronze, and zizmor's unpinned-uses isn't counted
      twice
    expect: >-
      score('ci-security',
      'workflow:.github/workflows/ci.yml').rules['pinned-to-sha'] == 'fail' &&
      score('ci-security',
      'workflow:.github/workflows/ci.yml').rules['no-high-findings'] == 'pass'
      && score('ci-security',
      'workflow:.github/workflows/ci.yml').evidence['pinned-to-sha'] ==
      ['actions/checkout@v4 at line 12', 'actions/setup-python@v5 at line 18',
      'actions/setup-go@v5 at line 24', 'actions/setup-node@v4 at line 72']
  - name: >-
      a dangerous trigger is a high finding with evidence, and a write token
      on it fails silver
    expect: >-
      score('ci-security',
      'workflow:.github/workflows/release.yml').evidence['no-high-findings']
      == ['high dangerous-triggers at line 3: use of fundamentally insecure
      workflow trigger'] && score('ci-security',
      'workflow:.github/workflows/release.yml').rules['no-write-tokens-on-risky-triggers']
      == 'fail'
  - name: >-
      zizmor-clean names every other finding with its message, and leaves
      unpinned-uses to pinned-to-sha
    expect: >-
      score('ci-security',
      'workflow:.github/workflows/ci.yml').evidence['zizmor-clean'] ==
      ['medium artipacked at line 14: credential persistence through GitHub
      Actions artifacts', 'low self-repository at line 120: action uses itself
      from the same repository']
  - name: without actionlint's output its rule is unknown, not failing
    expect: >-
      score('ci-security',
      'workflow:.github/workflows/release.yml').rules['actionlint-clean'] ==
      'unknown'
  - name: medium findings (artipacked) fail silver
    expect: >-
      score('ci-security',
      'workflow:.github/workflows/ci.yml').evidence['no-medium-findings'] ==
      ['medium artipacked at line 14: credential persistence through GitHub
      Actions artifacts']
  - name: a 92% fail rate and 11 red runs in a row fail bronze
    expect: >-
      score('ci-reliability',
      'workflow:.github/workflows/ci.yml').evidence['fail-rate-under-20'] ==
      ['92% of the last 12 decided runs on main failed on their first attempt
      (92% still failed after re-runs; 0 cancelled runs not counted)',
      'https://github.com/seikika/seikika/actions/runs/12',
      'https://github.com/seikika/seikika/actions/runs/11'] &&
      score('ci-reliability',
      'workflow:.github/workflows/ci.yml').rules['main-not-stuck-red'] ==
      'fail'
  - name: no job timeouts and no concurrency group are named
    expect: >-
      score('ci-reliability',
      'workflow:.github/workflows/ci.yml').evidence['every-job-has-timeout'].size()
      == 6 && score('ci-speed',
      'workflow:.github/workflows/ci.yml').rules['cancels-superseded-runs'] ==
      'fail'
  - name: without run data the run rules are unknown and say which connector
    expect: >-
      score('ci-reliability',
      'workflow:.github/workflows/release.yml').rules['main-not-stuck-red'] ==
      'unknown' && score('ci-reliability',
      'workflow:.github/workflows/release.yml').evidence['main-not-stuck-red']
      == ['no data from connector github-actions']
  - name: action metadata isn't scored for reliability
    expect: >-
      score('ci-reliability', 'workflow:actions/report/action.yml').level ==
      'skipped'
  - name: >-
      an action pinned by SHA in one workflow and by tag in another fails,
      naming the tag and the SHA it is pinned to elsewhere
    expect: >-
      score('action-deps',
      'action:actions/checkout').evidence['pinned-everywhere'] ==
      ['actions/checkout@v4, pinned elsewhere as
      actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2'] &&
      score('action-deps', 'action:actions/cache').level == 'bronze'
  - name: >-
      a step whose failure nothing reads fails bronze, and one with a
      cancelling group passes
    expect: >-
      score('ci-reliability',
      'workflow:.github/workflows/release.yml').evidence['failures-visible']
      == ['jobs.release.steps[2]'] && score('ci-reliability',
      'workflow:.github/workflows/ci.yml').rules['failures-visible'] == 'pass'
      && score('ci-speed',
      'workflow:.github/workflows/ci.yml').evidence['cancels-superseded-runs']
      == ['no concurrency group on a workflow triggered by pull_request']
