# GitHub Actions standards (docs/design/github-actions-standards.md, D70), packaged (D89, D90).
# Requires a `workspace` connector with `workflows` globs (workflow and action-ref records).
# Box and tools (docs/design/toolbox-and-tools.md): a kit carrying two existing tools. zizmor fits
# the box's SARIF slot; actionlint, which has no SARIF output, comes in through a fitting. Neither
# gets settings the tool can't read itself: actionlint's ignores belong in the repository's
# `.github/actionlint.yaml` (this package's actionlint.yaml is a starting point), so running the
# tool directly, with the `command` each record carries, gives the same findings.
connectors:
  - name: ci-lint
    package: builtin:runner # zizmor and actionlint: fast, offline, deterministic at pinned versions
    runtime: in-image
    config:
      name: ci-lint
      root: .
      jobs:
        - name: zizmor # security audits (regular persona), offline
          command:
          - zizmor
          - --offline
          - --no-exit-codes
          - --format
          - sarif
          - "{files}" # the files below that exist: a repository needn't have actions/
          parse: sarif # the standard slot; zizmor's severity comes from its zizmor/severity property
          files: [.github/workflows/*.y*ml, actions/*/action.y*ml]
          optional: true # not installed → its rules are unknown, not failing
        - name: actionlint # workflow syntax, expressions, types; shellcheck off so local = CI
          # Ignores and runner labels are read from the repository's .github/actionlint.yaml, as
          # when actionlint runs alone (see this package's actionlint.yaml).
          command:
          - actionlint
          - -shellcheck=
          - -pyflakes=
          - -format
          - "{{json .}}"
          - "{files}"
          parse: actionlint
          files: [.github/workflows/*.y*ml]
          optional: true
    records: [zizmor, actionlint]
    refresh: {zizmor: [external_ids], actionlint: [external_ids]}
    freshness: {zizmor: 5m, actionlint: 5m}
  - name: github-actions
    package: builtin:github # run history: changes with time, so not in the ratchet (--skip it)
    runtime: in-image
    config:
      org: ${param:githubOrg}
      token: ${env:GITHUB_TOKEN}
      actions:
        repos: ["${param:githubRepo}"]
        branch: ${param:branch}
        runs: 50
    records: [workflow-runs]
    refresh: {workflow-runs: [external_ids]}
    freshness: {workflow-runs: 15m}

# One pin per tool; `toolbox tools install --via <installer>` (or `tools config --for …`) uses any
# of these ids (D01M800DHD0Z1RTPH7CM46GZS3B). Toolbox downloads nothing itself.
tools:
  zizmor:
    version: 1.32.0
    install: {pypi: zizmor, mise: pipx:zizmor, aqua: zizmorcore/zizmor}
  actionlint:
    version: 1.7.12
    install: {mise: aqua:rhysd/actionlint, aqua: rhysd/actionlint}
    versionArgs: [-version]


kinds:
  # ── CI: the workflows and actions that build, test and ship Toolbox ──────────────────────
  - name: Workflow
    description: >-
      A GitHub Actions workflow or action metadata file, with lint findings
      and run history.
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      type: {type: enum, values: [workflow, action]}
      name: {type: string}
      triggers: {type: list, items: string}
      riskyTriggers: {type: list, items: string}
      topPermissions: {type: boolean}
      jobs: {type: integer}
      jobsWithoutTimeout: {type: list, items: string}
      jobsWithoutPermissions: {type: list, items: string}
      jobsWithWrite: {type: list, items: string}
      concurrency: {type: boolean}
      cancelsSuperseded:
        type: boolean
        description: >-
          A concurrency group that varies by ref with cancel-in-progress not
          false, at the top or on every job, so a new push cancels the old run.
      hiddenFailures:
        type: list
        items: string
        description: >-
          Jobs with continue-on-error, and steps with it whose outcome no later
          step reads (steps.<id>.outcome or .conclusion).
      unpinned: {type: list, items: string}
      unpinnedAt:
        type: list
        items: string
        description: Each unpinned `uses:` as `<ref> at line <n>`.
      zizmor: {type: object} # {total, counts: {high, medium, low, informational}, findings}
      actionlint: {type: object} # {total, findings}
      runs: {type: object} # from the GitHub API: failRate, rerunRate, failingStreak, p90Seconds …
    relations: {usesAction: {to: ActionDependency, many: true}}
    sources:
      default: [connector:workspace]
      fields:
        zizmor: [connector:ci-lint]
        actionlint: [connector:ci-lint]
        runs: [connector:github-actions]
    map:
    - from: workspace/workflow
      id: "'workflow:' + record.path"
      set: >-
        {'path': record.path, 'type': record.type, 'name': record.name, 'triggers': record.triggers,
         'riskyTriggers': record.riskyTriggers, 'topPermissions': record.topPermissions, 'jobs': record.jobs,
         'jobsWithoutTimeout': record.jobsWithoutTimeout, 'jobsWithoutPermissions': record.jobsWithoutPermissions,
         'jobsWithWrite': record.jobsWithWrite, 'concurrency': record.concurrency,
         'cancelsSuperseded': record.cancelsSuperseded, 'hiddenFailures': record.hiddenFailures,
         'unpinned': record.unpinned, 'unpinnedAt': record.unpinnedAt}
      relations: {usesAction: "record.actions.map(a, 'action:' + a)"}
    - from: ci-lint/zizmor
      id: "'workflow:' + record.path"
      set: "{'zizmor': record}"
    - from: ci-lint/actionlint
      id: "'workflow:' + record.path"
      set: "{'actionlint': record}"
    - from: github-actions/workflow-runs
      id: "'workflow:' + record.path"
      set: "{'runs': record}"

  - name: ActionDependency
    description: >-
      A third-party action or reusable workflow our CI runs, across every
      workflow using it.
    identityFrom: [connector:workspace]
    fields:
      name: {type: string}
      owner: {type: string}
      refs: {type: list, items: string}
      pins: {type: list, items: string}
      usedBy: {type: list, items: string}
      shaPins:
        type: list
        items: string
        description: >-
          Its SHA refs as the workflows write them, with the version comment
          (`actions/checkout@<sha> # v6.0.2`).
      pinHints:
        type: list
        items: string
        description: >-
          Each ref that isn't a SHA, with the pin to write instead when the
          repository pins the action anywhere: one of its SHA pins, on the ref's
          own path, preferring the version the tag names (`actions/cache@v5,
          pinned elsewhere as actions/cache@<sha> # v5.0.5`).
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/action-ref
      id: "'action:' + record.name"
      set: >-
        {'name': record.name, 'owner': record.owner, 'refs': record.refs,
        'pins': record.pins, 'usedBy': record.usedBy, 'shaPins': record.shaPins,
        'pinHints': record.pinHints}

scorecards:
  # ── Layer 1: maintainer SDLC — CI (docs/design/github-actions-standards.md) ──────────────
  # Security: what an attacker could do through a workflow or the report action (which pilot repos
  # run, so it is operator-facing too). zizmor and actionlint rules evaluate to `unknown`, not `fail`,
  # where those tools aren't installed (`dataFrom: ci-lint`).
  - name: maintainer-ci-security
    title: CI security
    kind: Workflow
    description: >-
      What an attacker could do through a workflow: pinned actions, least-
      privilege tokens, no risky triggers with write access, and zizmor and
      actionlint clean (D70, docs/design/github-actions-standards.md).
    owner: group:maintainers
    levels: [bronze, silver, gold]
    rules:
    - name: actionlint-clean
      level: bronze
      dataFrom: ci-lint
      check: entity.type == 'action' || entity.actionlint.total == 0
      evidence: >-
        entity.actionlint.findings.map(f, f.rule + ' at line ' + string(f.line)
        + ': ' + f.message)
      fix: Fix what actionlint reports (`actionlint` in the repository root).
    - name: no-high-findings
      level: bronze
      dataFrom: ci-lint
      check: >-
        entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule !=
        'unpinned-uses').size() == 0
      evidence: >-
        entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule !=
        'unpinned-uses').map(f, f.severity + ' ' + f.rule + ' at line ' +
        string(f.line) + ': ' + f.message)
      fix: >-
        Fix zizmor's high-severity findings (`zizmor --offline .github/workflows
        actions`); see https://docs.zizmor.sh/audits/.
    - name: least-privilege-token
      level: bronze
      check: >-
        entity.type == 'action' || entity.topPermissions ||
        entity.jobsWithoutPermissions.size() == 0
      evidence: entity.jobsWithoutPermissions
      fix: >-
        Declare `permissions:` at the top of the workflow (read-only, e.g.
        `contents: read`) and grant writes per job.
    - name: pinned-to-sha
      level: bronze
      check: entity.unpinned.size() == 0
      evidence: entity.unpinnedAt
      fix: >-
        Pin every third-party `uses:` to a full commit SHA. Resolve the tag with
        `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>` and
        peel an annotated tag (`^{}`) so the SHA is the commit, then put the tag
        in a comment. Let Dependabot update them.
    - name: no-medium-findings
      level: silver
      dataFrom: ci-lint
      check: entity.zizmor.counts.medium == 0
      evidence: >-
        entity.zizmor.findings.filter(f, f.severity == 'medium').map(f,
        f.severity + ' ' + f.rule + ' at line ' + string(f.line) + ': ' +
        f.message)
      fix: >-
        Fix zizmor's medium findings (e.g. `artipacked`: set
        `persist-credentials: false` on checkout).
    - name: no-write-tokens-on-risky-triggers
      level: silver
      check: entity.riskyTriggers.size() == 0 || entity.jobsWithWrite.size() == 0
      evidence: >-
        entity.riskyTriggers.map(t, 'trigger ' + t) +
        entity.jobsWithWrite.map(j, 'write token in job ' + j)
      fix: >-
        Don't combine pull_request_target/workflow_run/issue_comment with write
        permissions; split privileged steps into a separate workflow.
    - name: zizmor-clean
      level: gold
      dataFrom: ci-lint
      check: >-
        entity.zizmor.findings.filter(f, f.rule != 'unpinned-uses').size() == 0
      evidence: >- # unpinned-uses is pinned-to-sha's: one defect, one rule
        entity.zizmor.findings.filter(f, f.rule != 'unpinned-uses').map(f,
        f.severity + ' ' + f.rule + ' at line ' + string(f.line) + ': ' +
        f.message)
      fix: >-
        Resolve or explicitly ignore (with a reason) zizmor's low and
        informational findings.
    facets: {summary: public, details: public}

  # Reliability: whether CI can be trusted to say "green means good". Run history comes from the
  # GitHub API (github-actions connector). When that connector is skipped, the run rules are
  # `unknown` (`dataFrom: github-actions`). An all-unknown level is not granted.
  - name: maintainer-ci-reliability
    title: CI reliability
    kind: Workflow
    description: >-
      Whether green CI means good on the default branch: failures visible and
      counted, including those a re-run hid, every job bounded by a timeout,
      and a branch that rarely fails (D70; docs/design/thresholds.md for the
      tiers). Speed is maintainer-ci-speed.
    owner: group:maintainers
    levels: [bronze, silver, gold]
    appliesTo: entity.type == 'workflow'
    rules:
    - name: main-not-stuck-red
      level: bronze
      dataFrom: github-actions
      check: entity.runs.failingStreak < 3
      evidence: >-
        [string(entity.runs.failingStreak) + ' failures in a row on ' +
        entity.runs.branch + ', last run ' + entity.runs.lastRunAt] +
        (has(entity.runs.failedRuns) ? entity.runs.failedRuns : [])
      fix: >-
        Fix the default branch before anything else: open the failed runs in the
        evidence, find the failing job, and fix its cause in the code or in the
        workflow file under .github/workflows/.
    - name: still-running
      level: bronze
      dataFrom: github-actions
      check: "!has(entity.runs.state) || entity.runs.state == 'active'"
      evidence: >-
        ['GitHub reports the workflow as ' + entity.runs.state + ', so its run
        history is old']
      fix: >-
        Re-enable the workflow (`gh workflow enable <file>`, or the Actions
        tab), or delete its file from .github/workflows/ if it is retired.
    - name: fail-rate-under-20
      level: bronze
      dataFrom: github-actions
      check: entity.runs.firstTryFailRate <= ${param:failRateBronze}
      evidence: >-
        [string(entity.runs.firstTryFailRate) + '% of the last ' +
        string(entity.runs.decided) + ' decided runs on ' + entity.runs.branch +
        ' failed on their first attempt (' + string(entity.runs.failRate) + '%
        still failed after re-runs; ' + string(entity.runs.cancelled) + '
        cancelled runs not counted)'] + (has(entity.runs.failedRuns) ?
        entity.runs.failedRuns : [])
      fix: >-
        Open the failed runs in the evidence, find the failing jobs, and fix
        their causes in the code or the workflow file. The rate is over the last
        runs on the branch, so it falls as passing runs replace failed ones.
        Re-running a failure doesn't help: a run that passed on a later attempt
        counts as failed, continue-on-error, `|| true` and skips on the default
        branch are caught by failures-visible, and cancelled runs are shown
        here.
    - name: failures-visible
      level: bronze
      check: entity.hiddenFailures.size() == 0
      evidence: entity.hiddenFailures
      fix: >-
        For each listed job or step in the workflow file: remove
        `continue-on-error`, `|| true` (or `set +e`), or the `if:` that skips it
        on the default branch. If a step is expected to fail, give it an `id:`
        and check `steps.<id>.outcome` in a later step, so the failure is still
        asserted.
    - name: every-job-has-timeout
      level: bronze
      check: entity.jobsWithoutTimeout.size() == 0
      evidence: entity.jobsWithoutTimeout
      fix: >-
        Set `timeout-minutes` on every job; the default is 360 minutes of a hung
        runner.
    - name: fail-rate-under-10
      level: silver
      dataFrom: github-actions
      check: >-
        entity.runs.decided >= ${param:minDecidedRuns} &&
        entity.runs.firstTryFailRate <= ${param:failRateSilver}
      evidence: >-
        (entity.runs.decided < ${param:minDecidedRuns} ? ['only ' +
        string(entity.runs.decided) + ' decided runs: at least
        ${param:minDecidedRuns} are needed to tell the tiers apart'] :
        [string(entity.runs.firstTryFailRate) + '% failed on the first
        attempt']) + (has(entity.runs.failedRuns) ? entity.runs.failedRuns : [])
      fix: >-
        Open the failed runs in the evidence and classify each cause: a flaky
        test (fix or quarantine it in its test file), infrastructure (pin or
        retry the step in the workflow file), or real breakage merged to the
        branch (add the missing check to the pull request workflow).
    - name: fail-rate-under-5
      level: gold
      dataFrom: github-actions
      check: >-
        entity.runs.decided >= ${param:minDecidedRuns} &&
        entity.runs.firstTryFailRate <= ${param:failRateGold}
      evidence: >-
        (entity.runs.decided < ${param:minDecidedRuns} ? ['only ' +
        string(entity.runs.decided) + ' decided runs: at least
        ${param:minDecidedRuns} are needed to tell the tiers apart'] :
        [string(entity.runs.firstTryFailRate) + '% failed on the first
        attempt']) + (has(entity.runs.failedRuns) ? entity.runs.failedRuns : [])
      fix: >-
        Open each failed run in the evidence and fix its cause where it lives
        (the test, the workflow file, or the check the pull request lacked), so
        that every failure on the branch is rare enough to be looked at.
    facets: {summary: public, details: public}

  - name: maintainer-ci-speed
    title: CI speed
    kind: Workflow
    description: >-
      Whether CI answers quickly and spends no runner time on superseded
      commits: a cost and feedback-time concern, separate from whether CI can
      be trusted (maintainer-ci-reliability; docs/design/thresholds.md).
    owner: group:maintainers
    levels: [bronze, silver]
    appliesTo: entity.type == 'workflow'
    rules:
      - name: cancels-superseded-runs
        level: bronze
        check: entity.cancelsSuperseded || !('pull_request' in entity.triggers)
        evidence: >-
          [entity.concurrency ? 'the concurrency group does not vary by ref, or
          cancel-in-progress is false (the default)' : 'no concurrency group on a
          workflow triggered by pull_request']
        fix: |-
          Add, at the top of the workflow file:
            concurrency:
              group: "${{ github.workflow }}-${{ github.ref }}"
              cancel-in-progress: ${{ github.event_name == 'pull_request' }}
          A new push to a pull request then cancels its old run, while every
          run on main still finishes.
      - name: fast-feedback
        level: silver
        dataFrom: github-actions
        check: entity.runs.p90Seconds <= ${param:p90Seconds}
        evidence: "['p90 run time ' + string(entity.runs.p90Seconds / 60) + ' min']"
        fix: >-
          Keep the p90 run under 15 minutes: split slow jobs, cache builds, move
          long suites off the PR path.
    facets: {summary: public, details: public}

  # Supply chain: each third-party action, across every workflow that uses it (the "who uses
  # tj-actions/changed-files?" question).
  - name: maintainer-action-deps
    title: Third-party actions pinned
    kind: ActionDependency
    description: >-
      Each third-party action across every workflow that uses it: pinned to a
      commit SHA everywhere (D70, docs/design/github-actions-standards.md).
    owner: group:maintainers
    levels: [bronze]
    rules:
    - name: pinned-everywhere
      level: bronze
      check: entity.pins.all(p, p == 'sha')
      evidence: >- # only what to change, and the pin the repository already writes for it
        entity.pinHints
      fix: >-
        Pin this action to a full commit SHA in every workflow that uses it.
        Resolve the tag with `git ls-remote https://github.com/<owner>/<repo>
        refs/tags/<tag>` and peel an annotated tag (`^{}`) so the SHA is the
        commit.
    facets: {summary: public, details: public}
