# GitHub Actions standards (docs/design/github-actions-standards.md, D70), packaged (D89, D90).
# Requires a `workspace` connector with `workflows` globs (workflow and action-ref records).
# Box and tools (docs/design/toolbox-and-tools.md): a kit carrying two existing tools. zizmor fits
# the box's SARIF slot; actionlint, which has no SARIF output, comes in through a fitting. Neither
# gets settings the tool can't read itself: actionlint's ignores belong in the repository's
# `.github/actionlint.yaml` (this package's actionlint.yaml is a starting point), so running the
# tool directly, with the `command` each record carries, gives the same findings.
connectors:
  - name: ci-lint
    package: builtin:runner # zizmor and actionlint: fast, offline, deterministic at pinned versions
    runtime: in-image
    config:
      name: ci-lint
      root: .
      jobs:
        - name: zizmor # security audits (regular persona), offline
          command:
          - zizmor
          - --offline
          - --no-exit-codes
          - --format
          - sarif
          - "{files}" # the files below that exist: a repository needn't have actions/
          parse: sarif # the standard slot; zizmor's severity comes from its zizmor/severity property
          files: [.github/workflows/*.y*ml, actions/*/action.y*ml]
          optional: true # not installed → its rules are unknown, not failing
        - name: actionlint # workflow syntax, expressions, types; shellcheck off so local = CI
          # Ignores and runner labels are read from the repository's .github/actionlint.yaml, as
          # when actionlint runs alone (see this package's actionlint.yaml).
          command:
          - actionlint
          - -shellcheck=
          - -pyflakes=
          - -format
          - "{{json .}}"
          - "{files}"
          parse: actionlint
          files: [.github/workflows/*.y*ml]
          optional: true
    records: [zizmor, actionlint]
    refresh: {zizmor: [external_ids], actionlint: [external_ids]}
    freshness: {zizmor: 5m, actionlint: 5m}
  - name: github-actions
    package: builtin:github # run history: changes with time, so not in the ratchet (--skip it)
    runtime: in-image
    inRatchet: false
    config:
      org: ${param:githubOrg}
      token: ${env:GITHUB_TOKEN}
      actions:
        repos: ["${param:githubRepo}"]
        branch: ${param:branch}
        runs: 50
    records: [workflow-runs]
    refresh: {workflow-runs: [external_ids]}
    freshness: {workflow-runs: 15m}

# One pin per tool; `toolbox tools install --via <installer>` (or `tools config --for …`) uses any
# of these ids (D01M800DHD0Z1RTPH7CM46GZS3B). Toolbox downloads nothing itself.
tools:
  zizmor:
    version: 1.32.0
    install: {pypi: zizmor, mise: pipx:zizmor, aqua: zizmorcore/zizmor}
  actionlint:
    version: 1.7.12
    install: {mise: aqua:rhysd/actionlint, aqua: rhysd/actionlint}
    versionArgs: [-version]


kinds:
  # ── CI: the workflows and actions that build, test and ship Toolbox ──────────────────────
  - name: Workflow
    description: >-
      A GitHub Actions workflow or action metadata file, with lint findings
      and run history.
    identityFrom: [connector:workspace]
    fields:
      path: {type: string}
      type: {type: enum, values: [workflow, action]}
      name: {type: string}
      triggers: {type: list, items: string}
      riskyTriggers: {type: list, items: string}
      topPermissions: {type: boolean}
      jobs: {type: integer}
      jobsWithoutTimeout: {type: list, items: string}
      jobsWithoutPermissions: {type: list, items: string}
      jobsWithWrite: {type: list, items: string}
      concurrency: {type: boolean}
      pushBranches:
        type: list
        items: string
        description: >-
          The branch filters of its `push` trigger as written (`*` when it has
          none; empty when it runs on no branch push, as for tags only).
      pushIgnores:
        type: list
        items: string
        description: The `branches-ignore` of its `push` trigger.
      scheduled: {type: boolean, description: It has a `schedule` trigger.}
      onDefaultBranch:
        type: boolean
        description: >-
          The workflow runs on the default branch (`branch`, a push there or a
          schedule), where run history is read. One that runs only on pull
          requests, tags or by hand has no history there: run-history rules pass
          at bronze and fail above it.
        computed: >-
          entity.scheduled || (('*' in entity.pushBranches || '**' in
          entity.pushBranches || '${param:branch}' in entity.pushBranches) &&
          !('${param:branch}' in entity.pushIgnores))
      cancelsSuperseded:
        type: boolean
        description: >-
          A concurrency group that varies by ref with cancel-in-progress not
          false, at the top or on every job, so a new push cancels the old run.
      hiddenFailures:
        type: list
        items: string
        description: >-
          Jobs with continue-on-error, and steps with it whose outcome no later
          step reads (steps.<id>.outcome or .conclusion).
      unpinned: {type: list, items: string}
      unpinnedAt:
        type: list
        items: string
        description: Each unpinned `uses:` as `<ref> at line <n>`.
      zizmor: {type: object} # {total, counts: {high, medium, low, informational}, findings}
      actionlint: {type: object} # {total, findings}
      runs: {type: object} # from the GitHub API: failRate, rerunRate, failingStreak, p90Seconds …
    relations: {usesAction: {to: ActionDependency, many: true}}
    sources:
      default: [connector:workspace]
      fields:
        zizmor: [connector:ci-lint]
        actionlint: [connector:ci-lint]
        runs: [connector:github-actions]
    map:
    - from: workspace/workflow
      id: "'workflow:' + record.path"
      set: >-
        {'path': record.path, 'type': record.type, 'name': record.name, 'triggers': record.triggers,
         'riskyTriggers': record.riskyTriggers, 'topPermissions': record.topPermissions, 'jobs': record.jobs,
         'jobsWithoutTimeout': record.jobsWithoutTimeout, 'jobsWithoutPermissions': record.jobsWithoutPermissions,
         'jobsWithWrite': record.jobsWithWrite, 'concurrency': record.concurrency,
         'cancelsSuperseded': record.cancelsSuperseded, 'hiddenFailures': record.hiddenFailures,
         'pushBranches': has(record.pushBranches) ? record.pushBranches : ['*'],
         'pushIgnores': has(record.pushIgnores) ? record.pushIgnores : [],
         'scheduled': has(record.scheduled) ? record.scheduled : false,
         'unpinned': record.unpinned, 'unpinnedAt': record.unpinnedAt}
      relations: {usesAction: "record.actions.map(a, 'action:' + a)"}
    - from: ci-lint/zizmor
      id: "'workflow:' + record.path"
      set: "{'zizmor': record}"
    - from: ci-lint/actionlint
      id: "'workflow:' + record.path"
      set: "{'actionlint': record}"
    - from: github-actions/workflow-runs
      id: "'workflow:' + record.path"
      set: "{'runs': record}"

  - name: ActionDependency
    description: >-
      A third-party action or reusable workflow our CI runs, across every
      workflow using it.
    identityFrom: [connector:workspace]
    fields:
      name: {type: string}
      owner: {type: string}
      refs: {type: list, items: string}
      pins: {type: list, items: string}
      usedBy: {type: list, items: string}
      shaPins:
        type: list
        items: string
        description: >-
          Its SHA refs as the workflows write them, with the version comment
          (`actions/checkout@<sha> # v6.0.2`).
      pinHints:
        type: list
        items: string
        description: >-
          Each ref that isn't a SHA, with the pin to write instead when the
          repository pins the action anywhere: one of its SHA pins, on the ref's
          own path, preferring the version the tag names (`actions/cache@v5,
          pinned elsewhere as actions/cache@<sha> # v5.0.5`).
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/action-ref
      id: "'action:' + record.name"
      set: >-
        {'name': record.name, 'owner': record.owner, 'refs': record.refs,
        'pins': record.pins, 'usedBy': record.usedBy, 'shaPins': record.shaPins,
        'pinHints': record.pinHints}

scorecards:
  # ── Layer 1: maintainer SDLC — CI (docs/design/github-actions-standards.md) ──────────────
  # Security: what an attacker could do through a workflow or the report action (which pilot repos
  # run, so it is operator-facing too). zizmor and actionlint rules evaluate to `unknown`, not `fail`,
  # where those tools aren't installed (`dataFrom: ci-lint`).
  - name: ${param:prefix}ci-security
    title: CI security
    kind: Workflow
    description: >-
      What an attacker could do through a workflow: pinned actions, least-
      privilege tokens, no risky triggers with write access, and zizmor and
      actionlint clean (D70, docs/design/github-actions-standards.md).
    rationale: >-
      A workflow runs with the repository's token and secrets, so a hijacked
      action, an injected expression or an over-broad token is a route to
      pushing code or stealing credentials. Bronze closes the direct routes,
      silver removes write access where untrusted events arrive, and gold
      leaves nothing zizmor flags unexplained.
    links:
    - title: 'Decision: GitHub Actions standards'
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7VZ2DPR0000000000000000.md
    - title: GitHub Actions standards design
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/github-actions-standards.md
    - title: GitHub Actions secure use
      url: https://docs.github.com/en/actions/reference/security/secure-use
    owner: ${param:owner}
    track: ${param:track}
    levels: [bronze, silver, gold]
    rules:
    - name: actionlint-clean
      level: bronze
      dataFrom: ci-lint
      check: entity.type == 'action' || entity.actionlint.total == 0
      evidence: >-
        entity.actionlint.findings.map(f, f.rule + ' at line ' + string(f.line)
        + ': ' + f.message)
      fix: Fix what actionlint reports (`actionlint` in the repository root).
      rationale: >-
        A syntax error, a mistyped expression or a wrong action input only shows
        up when the workflow runs, and actionlint also finds script injection;
        catching these in the file is cheaper than a broken run.
      links:
      - title: actionlint checks
        url: https://github.com/rhysd/actionlint/blob/main/docs/checks.md
    - name: no-high-findings
      level: bronze
      dataFrom: ci-lint
      check: >-
        entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule !=
        'unpinned-uses').size() == 0
      evidence: >-
        entity.zizmor.findings.filter(f, f.severity == 'high' && f.rule !=
        'unpinned-uses').map(f, f.severity + ' ' + f.rule + ' at line ' +
        string(f.line) + ': ' + f.message)
      fix: >-
        Fix zizmor's high-severity findings (`zizmor --offline .github/workflows
        actions`); see https://docs.zizmor.sh/audits/.
      rationale: >-
        zizmor's high-severity audits, such as template injection and dangerous
        triggers, find ways for untrusted input to run code with the workflow's
        token. One is enough for an attacker, so they belong in the floor.
      links: [{title: zizmor audits, url: https://docs.zizmor.sh/audits/}]
    - name: least-privilege-token
      level: bronze
      check: >-
        entity.type == 'action' || entity.topPermissions ||
        entity.jobsWithoutPermissions.size() == 0
      evidence: entity.jobsWithoutPermissions
      fix: >-
        Declare `permissions:` at the top of the workflow (read-only, e.g.
        `contents: read`) and grant writes per job.
      rationale: >-
        A job without `permissions:` gets the token's default scopes, which can
        include write access, so any compromised step can push code or change
        releases. Read-only by default limits what one bad step can do.
      links:
      - title: zizmor excessive-permissions
        url: https://docs.zizmor.sh/audits/#excessive-permissions
      - title: Scorecard Token-Permissions
        url: https://github.com/ossf/scorecard/blob/main/docs/checks.md#token-permissions
    - name: pinned-to-sha
      level: bronze
      check: entity.unpinned.size() == 0
      evidence: entity.unpinnedAt
      fix: >-
        Pin every third-party `uses:` to a full commit SHA. Resolve the tag with
        `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>` and
        peel an annotated tag (`^{}`) so the SHA is the commit, then put the tag
        in a comment. Let Dependabot update them.
      rationale: >-
        A tag or branch can be moved to new code after review, and that code
        runs with the workflow's token and secrets; only a commit SHA fixes what
        runs.
      links:
      - title: zizmor unpinned-uses
        url: https://docs.zizmor.sh/audits/#unpinned-uses
      - title: GitHub on third-party actions
        url: https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
    - name: no-medium-findings
      level: silver
      dataFrom: ci-lint
      check: entity.zizmor.counts.medium == 0
      evidence: >-
        entity.zizmor.findings.filter(f, f.severity == 'medium').map(f,
        f.severity + ' ' + f.rule + ' at line ' + string(f.line) + ': ' +
        f.message)
      fix: >-
        Fix zizmor's medium findings (e.g. `artipacked`: set
        `persist-credentials: false` on checkout).
      rationale: >-
        Medium findings widen what one compromised step can reach: a checkout
        token left in `.git/config`, for example, is readable by every later
        step and by any artifact that uploads the directory.
      links:
      - title: zizmor artipacked
        url: https://docs.zizmor.sh/audits/#artipacked
    - name: no-write-tokens-on-risky-triggers
      level: silver
      check: entity.riskyTriggers.size() == 0 || entity.jobsWithWrite.size() == 0
      evidence: >-
        entity.riskyTriggers.map(t, 'trigger ' + t) +
        entity.jobsWithWrite.map(j, 'write token in job ' + j)
      fix: >-
        Don't combine pull_request_target/workflow_run/issue_comment with write
        permissions; split privileged steps into a separate workflow.
      rationale: >-
        These triggers run in the base repository's context on events outsiders
        can cause, such as a fork's pull request or a comment, so a write token
        there puts a privileged credential within reach of untrusted input.
      links:
      - title: zizmor dangerous-triggers
        url: https://docs.zizmor.sh/audits/#dangerous-triggers
      - title: Scorecard Dangerous-Workflow
        url: https://github.com/ossf/scorecard/blob/main/docs/checks.md#dangerous-workflow
      - title: GitHub on untrusted checkout
        url: https://docs.github.com/en/actions/reference/security/secure-use#mitigating-the-risks-of-untrusted-code-checkout
    - name: zizmor-clean
      level: gold
      dataFrom: ci-lint
      check: >-
        entity.zizmor.findings.filter(f, f.rule != 'unpinned-uses').size() == 0
      evidence: >- # unpinned-uses is pinned-to-sha's: one defect, one rule
        entity.zizmor.findings.filter(f, f.rule != 'unpinned-uses').map(f,
        f.severity + ' ' + f.rule + ' at line ' + string(f.line) + ': ' +
        f.message)
      fix: >-
        Resolve or explicitly ignore (with a reason) zizmor's low and
        informational findings.
      rationale: >-
        Low and informational findings are weak signals one by one, but each
        fixed or ignored with a written reason lets a reviewer tell a known
        trade-off from an oversight. That is polish beyond the direct risks, so
        it is gold.
    facets: {summary: public, details: public}

  # Reliability: whether CI can be trusted to say "green means good". Run history comes from the
  # GitHub API (github-actions connector). When that connector is skipped, the run rules are
  # `unknown` (`dataFrom: github-actions`). An all-unknown level is not granted.
  - name: ${param:prefix}ci-reliability
    title: CI reliability
    kind: Workflow
    description: >-
      Whether green CI means good on the default branch: failures visible and
      counted, including those a re-run hid, every job bounded by a timeout,
      and a branch that rarely fails (D70; docs/design/thresholds.md for the
      tiers). Speed is ${param:prefix}ci-speed.
    rationale: >-
      CI is only worth running if red means something broke and green means
      nothing did; flaky, hidden or hung jobs teach people to ignore it.
      Bronze makes failures visible and bounded and keeps the branch out of
      long red streaks; silver and gold each halve the share of first-try
      failures a reader must check, over enough runs to tell the tiers apart.
    links:
    - title: Thresholds and levels
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md
    - title: GitHub Actions standards design
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/github-actions-standards.md
    owner: ${param:owner}
    track: ${param:track}
    levels: [bronze, silver, gold]
    appliesTo: entity.type == 'workflow'
    rules:
    - name: main-not-stuck-red
      level: bronze
      dataFrom: github-actions
      check: "!entity.onDefaultBranch || entity.runs.failingStreak < 3"
      evidence: >-
        [string(entity.runs.failingStreak) + ' failures in a row on ' +
        entity.runs.branch + ', last run ' + entity.runs.lastRunAt] +
        (has(entity.runs.failedRuns) ? entity.runs.failedRuns : [])
      fix: >-
        Fix the default branch before anything else: open the failed runs in the
        evidence, find the failing job, and fix its cause in the code or in the
        workflow file under .github/workflows/.
      rationale: >-
        A default branch that keeps failing breaks everyone who branches from
        it, and each new failure hides behind the last. Three in a row means the
        break is not being fixed.
    - name: still-running
      level: bronze
      dataFrom: github-actions
      check: >-
        !entity.onDefaultBranch || !has(entity.runs.state) || entity.runs.state
        == 'active'
      evidence: >-
        ['GitHub reports the workflow as ' + entity.runs.state + ', so its run
        history is old']
      fix: >-
        Re-enable the workflow (`gh workflow enable <file>`, or the Actions
        tab), or delete its file from .github/workflows/ if it is retired.
      rationale: >-
        A disabled workflow's old run history still reads green, so it would
        pass every run-history rule while checking nothing. GitHub disables
        scheduled workflows in a public repository after 60 days without
        activity, and anyone can disable one by hand. A workflow whose triggers
        simply stop matching stays active; recently-run catches that.
      links:
      - title: GitHub on disabling workflows
        url: https://docs.github.com/en/actions/how-tos/manage-workflow-runs/disable-and-enable-workflows
    - name: recently-run
      level: bronze
      dataFrom: github-actions
      check: >-
        !entity.onDefaultBranch || (entity.runs.daysSinceLastRun != null &&
        entity.runs.daysSinceLastRun <= ${param:maxIdleDays})
      evidence: >-
        [entity.runs.daysSinceLastRun == null ? 'no run on ' +
        entity.runs.branch + ' in the history read' : 'the last run on ' +
        entity.runs.branch + ' was ' + string(entity.runs.daysSinceLastRun) + '
        days ago (at most ${param:maxIdleDays})']
      fix: >-
        Find why the workflow stopped running on the default branch: its `on:`
        triggers (branch or path filters that no longer match) in the workflow
        file, or a branch rename. Fix the triggers, or delete the file if the
        workflow is retired.
      rationale: >-
        A workflow that stays active but no longer runs, because its triggers
        stopped matching, keeps its old green history, so every rule that reads
        run history passes on runs that no longer say anything.
    - name: fail-rate-under-20
      level: bronze
      dataFrom: github-actions
      check: >-
        !entity.onDefaultBranch || entity.runs.firstTryFailRate <=
        ${param:failRateBronze}
      evidence: >-
        [string(entity.runs.firstTryFailRate) + '% of the last ' +
        string(entity.runs.decided) + ' decided runs on ' + entity.runs.branch +
        ' failed on their first attempt (' + string(entity.runs.failRate) + '%
        still failed after re-runs; ' + string(entity.runs.cancelled) + '
        cancelled runs not counted)'] + (has(entity.runs.failedRuns) ?
        entity.runs.failedRuns : [])
      fix: >-
        Open the failed runs in the evidence, find the failing jobs, and fix
        their causes in the code or the workflow file. The rate is over the last
        runs on the branch, so it falls as passing runs replace failed ones.
        Re-running a failure doesn't help: a run that passed on a later attempt
        counts as failed, continue-on-error, `|| true` and skips on the default
        branch are caught by failures-visible, and cancelled runs are shown
        here.
      rationale: >-
        Every red run costs someone a look, and a re-run that turns it green
        hides a flaky test or step; counting first-try failures stops re-runs
        from lowering the rate. Bronze is the first step for a branch that fails
        often.
    - name: failures-visible
      level: bronze
      check: >-
        entity.hiddenFailures.filter(h, !h.matches('[(]skipped on [^)]+[)]$') ||
        h.endsWith('(skipped on ${param:branch})') || h.endsWith('(skipped on
        push)')).size() == 0
      evidence: >-
        entity.hiddenFailures.filter(h, !h.matches('[(]skipped on [^)]+[)]$') ||
        h.endsWith('(skipped on ${param:branch})') || h.endsWith('(skipped on
        push)'))
      fix: >-
        For each listed job or step in the workflow file: remove
        `continue-on-error`, the exit-status mask (`|| true`, `set +e`, a pipe
        into `tee` without `set -o pipefail`), the in-run retry, or the `if:`
        that skips it on the default branch. If a step is expected to fail, give
        it an `id:` and check `steps.<id>.outcome` in a later step, so the
        failure is still asserted.
      rationale: >-
        `continue-on-error`, `|| true`, `set +e` and a skip on the default
        branch each turn a failure into a pass, so the fail-rate rules would
        count it green. It is their prerequisite, so it sits at bronze.
    - name: every-job-has-timeout
      level: bronze
      check: entity.jobsWithoutTimeout.size() == 0
      evidence: entity.jobsWithoutTimeout
      fix: >-
        Set `timeout-minutes` on every job; the default is 360 minutes of a hung
        runner.
      rationale: >-
        Without `timeout-minutes` a hung job holds a runner for GitHub's default
        of 360 minutes before it fails, spending runner time and delaying the
        signal everyone is waiting for.
    - name: fail-rate-under-10
      level: silver
      dataFrom: github-actions
      check: >-
        entity.onDefaultBranch && entity.runs.decided >= ${param:minDecidedRuns}
        && entity.runs.firstTryFailRate <= ${param:failRateSilver}
      evidence: >-
        !entity.onDefaultBranch ? ['runs only on pull requests, tags or by hand:
        no history on ${param:branch} shows this tier, so the workflow stops at
        bronze'] : (entity.runs.decided < ${param:minDecidedRuns} ? ['only ' +
        string(entity.runs.decided) + ' decided runs: at least
        ${param:minDecidedRuns} are needed to tell the tiers apart'] :
        [string(entity.runs.firstTryFailRate) + '% failed on the first
        attempt']) + (has(entity.runs.failedRuns) ? entity.runs.failedRuns : [])
      fix: >-
        Open the failed runs in the evidence and classify each cause: a flaky
        test (fix or quarantine it in its test file), infrastructure (pin or
        harden the step in the workflow file, without an in-run retry, which
        failures-visible counts as hiding the failure), or real breakage merged
        to the branch (add the missing check to the pull request workflow).
      rationale: >-
        At silver, failures are rare enough that each can be classified as a
        flake, infrastructure or a break a pull request check missed. It needs a
        minimum number of runs, because with few runs one failure moves the rate
        across tiers.
    - name: fail-rate-under-5
      level: gold
      dataFrom: github-actions
      check: >-
        entity.onDefaultBranch && entity.runs.decided >= ${param:minDecidedRuns}
        && entity.runs.firstTryFailRate <= ${param:failRateGold}
      evidence: >-
        !entity.onDefaultBranch ? ['runs only on pull requests, tags or by hand:
        no history on ${param:branch} shows this tier, so the workflow stops at
        bronze'] : (entity.runs.decided < ${param:minDecidedRuns} ? ['only ' +
        string(entity.runs.decided) + ' decided runs: at least
        ${param:minDecidedRuns} are needed to tell the tiers apart'] :
        [string(entity.runs.firstTryFailRate) + '% failed on the first
        attempt']) + (has(entity.runs.failedRuns) ? entity.runs.failedRuns : [])
      fix: >-
        Open each failed run in the evidence and fix its cause where it lives
        (the test, the workflow file, or the check the pull request lacked), so
        that every failure on the branch is rare enough to be looked at.
      rationale: >-
        At gold, a red run on the default branch is rare enough that every one
        is looked at and fixed at its cause, so red keeps its meaning.
    facets: {summary: public, details: public}

  - name: ${param:prefix}ci-speed
    title: CI speed
    kind: Workflow
    description: >-
      Whether CI answers quickly and spends no runner time on superseded
      commits: a cost and feedback-time concern, separate from whether CI can
      be trusted (${param:prefix}ci-reliability; docs/design/thresholds.md).
    rationale: >-
      Slow runs and runs for superseded commits cost runner minutes and queue
      time, and make people wait or switch task for feedback. Speed is not a
      correctness or security property, so it has its own card rather than
      holding a reliable workflow back.
    links:
    - title: Thresholds and levels
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/thresholds.md
    owner: ${param:owner}
    track: ${param:track}
    levels: [bronze, silver]
    appliesTo: entity.type == 'workflow'
    rules:
      - name: cancels-superseded-runs
        level: bronze
        check: entity.cancelsSuperseded || !('pull_request' in entity.triggers)
        evidence: >-
          [entity.concurrency ? 'the concurrency group does not vary by ref, or
          cancel-in-progress is false (the default)' : 'no concurrency group on a
          workflow triggered by pull_request']
        fix: |-
          Add, at the top of the workflow file:
            concurrency:
              group: "${{ github.workflow }}-${{ github.ref }}"
              cancel-in-progress: ${{ github.event_name == 'pull_request' }}
          A new push to a pull request then cancels its old run, while every
          run on main still finishes.
        rationale: >-
          Without a concurrency group per ref, each push to a pull request starts
          a new run while the old one, whose result no longer matters, keeps a
          runner busy.
        links:
        - title: GitHub Actions concurrency
          url: https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency
      - name: fast-feedback
        level: silver
        dataFrom: github-actions
        check: entity.runs.p90Seconds <= ${param:p90Seconds}
        evidence: "['p90 run time ' + string(entity.runs.p90Seconds / 60) + ' min']"
        fix: >-
          Keep the p90 run under 15 minutes: split slow jobs, cache builds, move
          long suites off the PR path.
        rationale: >-
          Past the bound, developers switch to other work while they wait and come
          back late to a failure. The bound is a chosen point, not a measured one.
    facets: {summary: public, details: public}

  # Supply chain: each third-party action, across every workflow that uses it (the "who uses
  # tj-actions/changed-files?" question).
  - name: ${param:prefix}action-deps
    title: Third-party actions pinned
    kind: ActionDependency
    description: >-
      Each third-party action across every workflow that uses it: pinned to a
      commit SHA everywhere (D70, docs/design/github-actions-standards.md).
    rationale: >-
      A compromised action reaches every workflow that runs it, so in an
      incident the question is which workflows use it and at which refs.
      Scoring per action answers that and shows any use still unpinned; bronze
      is the only level because an action is either pinned everywhere or not.
    links:
    - title: GitHub Actions standards design
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/design/github-actions-standards.md
    - title: 'Decision: GitHub Actions standards'
      url: https://github.com/loganvolkers/toolbox/blob/main/docs/decisions/D01M7VZ2DPR0000000000000000.md
    owner: ${param:owner}
    track: ${param:track}
    levels: [bronze]
    rules:
    - name: pinned-everywhere
      level: bronze
      check: entity.pins.all(p, p == 'sha')
      evidence: >- # only what to change, and the pin the repository already writes for it
        entity.pinHints
      fix: >-
        Pin this action to a full commit SHA in every workflow that uses it.
        Resolve the tag with `git ls-remote https://github.com/<owner>/<repo>
        refs/tags/<tag>` and peel an annotated tag (`^{}`) so the SHA is the
        commit.
      rationale: >-
        One unpinned use is enough for a moved tag to run new code with that
        workflow's token, so an action counts as pinned only when every workflow
        pins it.
      links:
      - title: zizmor unpinned-uses
        url: https://docs.zizmor.sh/audits/#unpinned-uses
    facets: {summary: public, details: public}
