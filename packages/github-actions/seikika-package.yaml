# A Seikika package (D89): GitHub Actions security, reliability and supply-chain standards built on
# zizmor and actionlint (D70). The first package extracted from Seikika for Seikika, which includes it.
apiVersion: seikika.com/package/v0
name: github-actions
version: 0.2.1
description: >-
  Score GitHub Actions workflows and the third-party actions they use,
  with zizmor, actionlint and run history.
parameters:
  track:
    type: string
    default: null
    description: >-
      The portal track its scorecards and campaigns belong to; leave unset if
      the portal has no tracks.
  prefix:
    type: string
    default: ""
    description: >-
      Put before each scorecard's name (e.g. maintainer- gives
      maintainer-ci-security), to match the portal's own naming.
  owner:
    type: string
    default: group:maintainers
    description: Who owns the standards in this portal.
  githubOrg:
    type: string
    description: The GitHub organisation whose run history is read.
  githubRepo:
    type: string
    description: The repository whose workflows' run history is read.
  branch:
    type: string
    default: main
    description: The branch run history is read from.
  failRateBronze:
    type: integer
    default: 20
    tighten: lower
    description: >-
      Max % of decided runs on the branch that failed on their first attempt,
      for bronze.
  failRateSilver:
    type: integer
    default: 10
    tighten: lower
    description: Max % failed runs for silver.
  failRateGold:
    type: integer
    default: 5
    tighten: lower
    description: Max % failed runs for gold.
  minDecidedRuns:
    type: integer
    default: 10
    tighten: higher
    description: >-
      Fewest decided runs before the silver and gold fail-rate tiers can pass.
  p90Seconds:
    type: integer
    default: 900
    tighten: lower
    description: Max p90 run time in seconds for ci-speed silver.
fragments: [fragments/*.yaml]
