# Alert stub: index freshness (Prometheus / Mimir). Wired when a Grafana pack lands.
groups:
  - name: seikika.index
    rules:
    - alert: SeikikaIndexStale
      expr: seikika_index_freshness_seconds > 300
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: Seikika search index is stale
        description: >-
          seikika_index_freshness_seconds has been above 300s for 10m.
