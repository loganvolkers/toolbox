# Alert stub: snapshot lag (Prometheus / Mimir). Wired when a Grafana pack lands.
groups:
  - name: seikika.snapshot
    rules:
    - alert: SeikikaSnapshotLagHigh
      expr: seikika_snapshot_lag_seconds > 60
      for: 5m
      labels: {severity: warning}
      annotations:
        summary: Seikika published snapshot is lagging
        description: >-
          seikika_snapshot_lag_seconds has been above 60s for 5m. Check derive and
          connector freshness.
