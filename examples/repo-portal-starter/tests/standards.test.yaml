# What each starter rule means, over three made-up repositories (fixtures/workspace.ndjson): one fully
# set up, one with an individual in CODEOWNERS and no licence, one with almost nothing.
name: standards
assert:
  - name: a README, a team-only CODEOWNERS with a catch-all, and a licence reach silver
    expect: "score('repo-hygiene', 'repository:acme/platform-infra').level == 'silver'"
  - name: an individual owner and no licence stop at bronze, and the evidence names them
    expect: "score('repo-hygiene', 'repository:acme/payments-api').level == 'bronze' && score('repo-hygiene', 'repository:acme/payments-api').evidence['owners-are-teams'] == ['@alice'] && score('repo-hygiene', 'repository:acme/payments-api').rules['has-license'] == 'fail'"
  - name: a short README and no CODEOWNERS fail bronze
    expect: "score('repo-hygiene', 'repository:acme/legacy-tool').level == 'none' && score('repo-hygiene', 'repository:acme/legacy-tool').rules['has-readme'] == 'fail' && score('repo-hygiene', 'repository:acme/legacy-tool').rules['has-codeowners'] == 'fail'"
  - name: owners are collected across CODEOWNERS rules
    expect: "entity('repository:acme/payments-api').owners == ['@acme/payments', '@alice']"
  - name: broken relative links fail the docs scorecard
    expect: "score('docs', 'doc:README.md').evidence['links-resolve'] == ['docs/runbook.md']"
