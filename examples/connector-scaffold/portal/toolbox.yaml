apiVersion: toolbox.dev/v1alpha1

portal:
  name: connector-scaffold
  title: Connector scaffold
  owner: group:platform
  toolbox: "0.1"

connectors:
  - name: example
    package: local:example
    runtime: in-image
    config: {seed: alpha}
    records: [example-item]

kinds:
  - name: ExampleItem
    identityFrom: [connector:example]
    fields: {title: {type: string}}
    sources: {default: [connector:example]}
    map:
    - from: example/example-item
      id: "'example-item:' + record.id"
      set: "{'title': record.title}"
