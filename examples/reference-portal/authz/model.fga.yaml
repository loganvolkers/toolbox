# OpenFGA tests for the reference portal. The tuples are the ones the derived-state pipeline emits
# (authz/tuples.expected.json, generated by tools/reference.py from toolbox.yaml + fixtures), so these
# tests check the model *and* the derivation together. Run: fga model test --tests authz/model.fga.yaml
name: reference-portal
model_file: ./model.fga
tuple_file: ./tuples.expected.json
tests:
  - name: public by default, details owner-only
    check:
      - user: user:erin
        object: repository:payments-api
        assertions: {can_view: true, can_view_details: false, can_refresh: false}
      - user: user:alice
        object: repository:payments-api
        assertions: {can_view: true, can_view_details: true}
      - user: user:bob                     # checkout is nested in payments
        object: repository:payments-api
        assertions: {can_view_details: true}
      - user: user:alice
        object: repository:checkout-web
        assertions: {can_view_details: false}
  - name: unverified ownership confers nothing (D17)
    check:
      - user: user:alice                   # claimed via catalog-info, not backed by CODEOWNERS
        object: repository:ledger
        assertions: {can_view_details: false, can_install_apps: true}
      - user: user:dave                    # portal admin through group:platform
        object: repository:ledger
        assertions: {can_view_details: true}
  - name: installing apps needs GitHub admin or portal admin
    check:
      - user: user:alice
        object: repository:payments-api
        assertions: {can_install_apps: true, can_refresh: true}
      - user: user:bob
        object: repository:payments-api
        assertions: {can_install_apps: false}
      - user: user:carol
        object: repository:payments-api
        assertions: {can_install_apps: false, can_view_details: false}
      - user: user:dave
        object: repository:payments-api
        assertions: {can_install_apps: true}
    list_objects:
      - user: user:alice
        type: repository
        assertions:
          can_view_details: [repository:payments-api]
          can_install_apps: [repository:ledger, repository:payments-api]
      - user: user:bob
        type: repository
        assertions:
          can_view_details: [repository:checkout-web, repository:payments-api]
