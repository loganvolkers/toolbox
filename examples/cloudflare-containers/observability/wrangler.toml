name = "seikika-observability"
main = "worker.mjs"
compatibility_date = "2026-11-26"
workers_dev = false
preview_urls = false
routes = [{ pattern = "observe.seikika.com", custom_domain = true }]

[observability]
enabled = true

[[containers]]
class_name = "ObservabilityContainer"
image = "./Dockerfile"
instance_type = "standard-2"
max_instances = 1

[[durable_objects.bindings]]
name = "OBSERVABILITY"
class_name = "ObservabilityContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ObservabilityContainer"]
