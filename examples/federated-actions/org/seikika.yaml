apiVersion: seikika.com/v1alpha1
portal: {name: org, title: Org portal, owner: group:platform, seikika: "0.1"}
connectors:
  - name: workspace
    package: builtin:workspace
    runtime: in-image
    config: {root: .., crates: false, portals: ["*/.seikika/seikika.yaml"]}
    records: [portal]
    refresh: {portal: [external_ids]}
    freshness: {portal: 5m}
kinds:
  - name: Portal
    identityFrom: [connector:workspace]
    fields:
      name: {type: string}
      key: {type: string}
      path: {type: string}
      dir: {type: string}
      owner: {type: string}
      actions: {type: list, items: object}
      runner: {type: object}
      error: {type: string}
      report: {type: object, facet: operator}
      reportError: {type: string, facet: operator}
    sources: {default: [connector:workspace]}
    map:
    - from: workspace/portal
      # A child is identified by where it was found, not by the name it gives itself.
      id: "'portal:' + record.key"
      set: >-
        {'name': record.name, 'key': record.key, 'path': record.path, 'dir':
        record.dir, 'owner': record.owner, 'actions': record.actions, 'runner':
        record.runner, 'error': record.error, 'report': has(record.report) ?
        record.report : null, 'reportError': has(record.reportError) ?
        record.reportError : null}
# Children's actions are offered on their Portal entities. A served org portal runs the children
# listed under runners.local in its own process, and signs the approvals it records with the key in
# $SEIKIKA_APPROVAL_KEY (64 hex characters) so children that pin it accept them.
federation:
  portals: Portal
  runners: {local: {portals: ["*"]}}
  signingKey: SEIKIKA_APPROVAL_KEY
