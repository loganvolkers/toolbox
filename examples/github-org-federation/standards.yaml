scorecards:
  - name: repository-identity
    title: Repository identity
    kind: Repository
    owner: group:maintainers
    description: Check that each repository carries a usable provider identity and URL.
    rationale: >-
      A full slug gives readers a disambiguated link. The provider ID remains
      available for reconciliation when a repository is renamed.
    levels: [bronze, silver]
    facets: {summary: public, details: public}
    rules:
    - name: has-qualified-location
      level: bronze
      check: >-
        entity.name.matches('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') &&
        entity.repositoryUrl == 'https://github.com/' + entity.name
      evidence: '[entity.name, entity.repositoryUrl]'
      fix: >-
        Read the owner, repository name, and URL from the organization
        inventory.
    - name: has-provider-id
      level: silver
      check: has(entity.githubId) && entity.githubId > 0
      evidence: "['GitHub repository ID missing or invalid for ' + entity.name]"
      fix: >-
        Capture the positive repository id from the GitHub organization
        inventory response.

  - name: repo-hygiene
    title: Repository basics
    kind: Repository
    description: >-
      Repository entry-point files and CODEOWNERS conventions at the commit
      the organization scanned.
    rationale: >-
      These files tell a newcomer or an agent what the repository is, who
      reviews changes to it, and whether its code may be reused, and they can
      be checked in any repository with no build or network. Bronze is a
      README with content and a CODEOWNERS rule with an owner. Silver adds a
      leading default, consistently styled handles, and a license file.
    links:
    - title: Repo portals
      url: https://github.com/seikika/seikika/blob/main/docs/design/repo-portals.md
    - title: GitHub code owners
      url: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners
    owner: group:maintainers
    appliesTo: entity.scanned
    levels: [bronze, silver]
    rules:
    - name: has-readme
      level: bronze
      check: entity.readmeEntrypoint && entity.readmeWords > 0
      evidence: >-
        !entity.readmeEntrypoint ? ['no recognized root README'] :
        [entity.readme + ' has ' + string(entity.readmeWords) + ' words']
      fix: >-
        Fill the README named in the evidence, or add a root README.md if the
        scanner found no recognized entry point. Describe the project's purpose
        and where to find setup or contribution instructions.
      rationale: >-
        A discoverable README with content is the entry point for a new
        contributor. This check establishes that the scanner can read content.
    - name: has-codeowners
      level: bronze
      check: >-
        has(entity.codeowners) && entity.codeowners.rules.exists(r,
        r.validOwners > 0)
      evidence: >-
        ['no CODEOWNERS rule names a recognizable owner in .github/, the root or
        docs/']
      fix: Add a rule such as `* @my-org/my-team` to .github/CODEOWNERS.
      rationale: >-
        Without CODEOWNERS, GitHub requests no reviewer for a pull request and
        nothing in the repository says who owns the code.
    - name: codeowners-catch-all
      level: silver
      check: >-
        has(entity.codeowners) && entity.codeowners.rules.size() > 0 &&
        entity.codeowners.rules[0].pattern == '*' &&
        entity.codeowners.rules.all(r, r.validOwners > 0)
      evidence: >-
        !has(entity.codeowners) ? ['missing CODEOWNERS'] :
        (entity.codeowners.rules.size() == 0 ||
        entity.codeowners.rules[0].pattern != '*' ? ['Start ' +
        entity.codeowners.path + ' with a * rule'] : []) +
        entity.codeowners.rules.filter(r, r.validOwners == 0).map(r,
        entity.codeowners.path + ':' + string(r.line) + ' needs an owner')
      fix: >-
        Start CODEOWNERS with a `*` rule that names an owner. Give every later
        rule an owner or remove it so it cannot clear the default.
      rationale: >-
        A path no rule matches has no owner, so changes to it get no automatic
        reviewer. A leading catch-all gives every path a default that later,
        more specific rules override.
    - name: owner-handles-consistent
      level: silver
      check: entity.ownersOk
      evidence: >-
        entity.owners.size() == 0 ? ['CODEOWNERS has no owner handles'] :
        entity.owners
      fix: >-
        Use team handles (@org/team) throughout, or use only personal handles
        (@user). Replace malformed handles and email addresses.
      rationale: >-
        A team keeps ownership when people leave; a mix of teams and
        individuals, or an email, leaves it unclear who answers for the code.
        All-personal handles are accepted so a single-maintainer repository can
        reach silver.
      links:
      - title: Personal CODEOWNERS decision
        url: https://github.com/seikika/seikika/blob/main/docs/decisions/D01M7Y57FVX0XYNGMX0A0XJ4GK9.md
    - name: has-license-file
      level: silver
      check: entity.licenseHasContent
      evidence: >-
        has(entity.license) ? [entity.license + ' has no readable license text']
        : ['no recognized LICENSE or COPYING file']
      fix: >-
        Add LICENSE or COPYING at the repository root with the repository's
        reuse terms.
      rationale: >-
        Without a licence, default copyright applies and nobody else may legally
        use, change or share the code, even in a public repository.
      links:
      - title: Licensing a repository
        url: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/licensing-a-repository
    facets: {summary: public, details: public}
