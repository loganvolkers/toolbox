kinds:
  - name: Repository
    title: GitHub repository
    identityFrom: [connector:github-org]
    fields:
      name: {type: string}
      repositoryUrl: {type: string}
      sourceUrl: {type: string}
      defaultBranch: {type: string}
      visibility: {type: string}
      scanned: {type: boolean}
      scanError: {type: string}
      commit: {type: string}
      workflowError: {type: string}
      report: {type: object, facet: operator}
      reportError: {type: string, facet: operator}
      portalPresent: {type: boolean}
      readme: {type: string}
      readmeWords: {type: integer}
      license: {type: string}
      codeowners: {type: object}
      owners: {type: list, items: string}
      ownersOk: {type: boolean}
    sources: {default: [connector:github-org]}
    map:
    - from: github-org/federated-repo
      id: "'repository:' + record.identity"
      set: >-
        {'name': record.name, 'repositoryUrl': record.repositoryUrl,
        'sourceUrl': record.sourceUrl, 'defaultBranch': record.defaultBranch,
        'visibility': record.visibility, 'scanned': record.scanned, 'scanError':
        record.scanError, 'commit': has(record.commit) ? record.commit : null,
        'workflowError': has(record.workflowError) ? record.workflowError :
        null, 'report': has(record.report) ? record.report : null,
        'reportError': has(record.reportError) ? record.reportError : null,
        'portalPresent': record.portalPresent, 'readme': record.readme,
        'readmeWords': record.readmeWords, 'license': record.license,
        'codeowners': record.codeowners, 'owners': record.owners, 'ownersOk':
        record.ownersOk}
