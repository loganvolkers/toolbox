apiVersion: seikika.com/v1alpha1
include:
  - repositories.yaml
  - standards.yaml
  - workflows.yaml
  - meta.yaml
  - public-connector.yaml
  - package: ../../packages/meta-scoring
    with:
      track: portal-quality
      describeCommand:
        - target/debug/seikika
        - describe
        - portal
        - examples/github-org-federation/public.yaml
      manifest: examples/github-org-federation/public.yaml
      assessments: [examples/github-org-federation/assessments/**/*.y*ml]

portal:
  name: seikika-organization
  title: Seikika organization
  owner: group:maintainers
  seikika: "0.2"

tests: [standards.test.yaml]
