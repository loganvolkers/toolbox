verdicts:
  - criterion: measures-intent
    verdict: pass
    reason: >-
      .seikika/check-platform-packages.mjs checks the launcher optional
      dependencies against the installed platform manifest identities,
      versions and platform selectors.
  - criterion: hard-to-game
    verdict: pass
    reason: >-
      .seikika/check-platform-packages.mjs uses .github/workflows/release.yml
      as the authority for published platforms. The missing Linux platform
      replay in .seikika/tests/release.test.yaml fails when its manifest and
      optional dependency disappear together.
  - criterion: fix-leads-to-pass
    verdict: pass
    reason: >-
      The diagnostics name the package.json path and expected value. The fix
      in .seikika/seikika.yaml points to the two sources that must agree.
  - criterion: threshold-justified
    verdict: pass
    reason: >-
      The root package.json version is the baseline for committed templates.
      .github/workflows/release.yml stamps the release tag version into all
      published packages and optional dependencies. The local preflight
      requires the committed metadata to agree before that stamping.
