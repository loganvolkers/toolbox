# Runtime secrets config (no secret values). Point SEIKIKA_SECRETS_CONFIG at this file.
required: false
backends:
  - type: env
  - type: file
    # dir comes from SEIKIKA_SECRETS_DIR when unset here
  - type: gcp_secret_manager
    project: my-gcp-project
    map:
      github-app-private-key: seikika-github-app-pem
      jira-app-token: seikika-jira-token
      gcp-sa-key: seikika-gcp-connector-sa
