# Runtime secrets config (no secret values). Point TOOLBOX_SECRETS_CONFIG at this file.
required: false
backends:
  - type: env
  - type: file
    # dir comes from TOOLBOX_SECRETS_DIR when unset here
  - type: gcp_secret_manager
    project: my-gcp-project
    map:
      github-app-private-key: toolbox-github-app-pem
      jira-app-token: toolbox-jira-token
      gcp-sa-key: toolbox-gcp-connector-sa
